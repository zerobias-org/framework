id: 8c31917f-3288-455b-8d9e-ae1e9e7a37c8
externalId: CM0014
name: Secure boot
description: Software/Firmware must verify a trust chain that extends through
  the hardware root of trust, boot loader, boot configuration file, and
  operating system image, in that order. The trusted boot/RoT computing module
  should be implemented on radiation tolerant burn-in (non-programmable)
  equipment.
elementType: control
