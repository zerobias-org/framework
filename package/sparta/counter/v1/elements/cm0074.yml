name: Distributed Constellations
description: A distributed system uses a number of nodes, working together, to
  perform the same mission or functions as a single node. In a distributed
  constellation, the end user is not dependent on any single satellite but
  rather uses multiple satellites to derive a capability. A distributed
  constellation can complicate an adversary’s counterspace planning by
  presenting a larger number of targets that must be successfully attacked to
  achieve the same effects as targeting just one or two satellites in a
  less-distributed architecture. GPS is an example of a distributed
  constellation because the functioning of the system is not dependent on any
  single satellite or ground station; a user can use any four satellites within
  view to get a time and position fix.*
  *https://csis-website-prod.s3.amazonaws.com/s3fs-public/publication/210225_Harrison_Defense_Space.pdf?N2KWelzCz3hE3AaUUptSGMprDtBlBSQG
