id: f2720a03-0c46-4cc8-9c91-6f7c3527a9d3
externalId: CM0032
name: On-board Intrusion Detection & Prevention
description: Utilize on-board intrusion detection/prevention system that
  monitors the mission critical components or systems and audit/logs actions.
  The IDS/IPS should have the capability to respond to threats (initial access,
  execution, persistence, evasion, exfiltration, etc.) and it should address
  signature-based attacks along with dynamic never-before seen attacks using
  machine learning/adaptive technologies. The IDS/IPS must integrate with
  traditional fault management to provide a wholistic approach to faults
  on-board the spacecraft. Spacecraft should select and execute
  safe countermeasures against cyber-attacks.  These countermeasures are a ready
  supply of options to triage against the specific types of attack and mission
  priorities. Minimally, the response should ensure vehicle safety and continued
  operations. Ideally, the goal is to trap the threat, convince the threat that
  it is successful, and trace and track the attacker — with or without ground
  support. This would support successful attribution and evolving
  countermeasures to mitigate the threat in the future. “Safe countermeasures”
  are those that are compatible with the system’s fault management system to
  avoid unintended effects or fratricide on the system.
elementType: control
