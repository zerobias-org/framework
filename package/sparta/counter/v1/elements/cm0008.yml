id: 4337cf5f-e998-4b98-ad2d-b94b945344df
externalId: CM0008
name: Security Testing Results
description: As penetration testing and vulnerability scanning is a best
  practice, protecting the results from these tests and scans is equally
  important. These reports and results typically outline detailed
  vulnerabilities and how to exploit them. As with countermeasure CM0001,
  protecting sensitive information from disclosure to threat actors is
  imperative.
elementType: control
