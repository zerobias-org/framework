name: Threat Intelligence Feeds Program
description: A threat intelligence program helps an organization generate their
  own threat intelligence information and track trends to inform defensive
  priorities and mitigate risk. Leverage all-source intelligence services or
  commercial satellite imagery to identify and track adversary infrastructure
  development/acquisition. Countermeasures for this attack fall outside the
  scope of the mission in the majority of cases.
elementType: control
