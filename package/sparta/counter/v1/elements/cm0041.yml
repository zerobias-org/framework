id: abd972db-6fe5-4dd3-b169-17fd61e1afef
externalId: CM0041
name: User Training
description: "Train users to be aware of access or manipulation attempts by a
  threat actor to reduce the risk of successful spear phishing, social
  engineering, and other techniques that involve user interaction. Ensure that
  role-based security-related training is provided to personnel with assigned
  security roles and responsibilities: (i) before authorizing access to the
  information system or performing assigned duties; (ii) when required by
  information system changes; and (iii) at least annually if not otherwise
  defined."
elementType: control
