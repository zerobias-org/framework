externalId: 2-15-3
name: 2-15-3
description: "Develop and implement a plan for the withdrawal of the IoT devices
  and services at the end of their lifecycle. Implement the following practices
  for establishing an end-of-life strategy for the IoT devices and services:\r

  ▪ Develop a replacement plan, and an end-of-life plan for the IoT devices and
  services that have run out of support and/or no longer support the essential
  cybersecurity functions. Also include third-party components within the
  end-of-life plan.\r

  ▪ Implement measures to securely dispose the data that was stored or being
  processed by the IoT devices/ service, as per organizational policies and
  regulations.\r

  ▪ Maintain an audit log to monitor the IoT devices and services disposal
  process."
elementType: control
