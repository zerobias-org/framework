description: "Include IoT cybersecurity aspects within the organization's
  overall cybersecurity awareness and training strategy, including:\r

  ▪ Define, document, and approve training strategy for personnel with specific
  IoT roles and responsibilities.\r

  ▪ Train employees on cybersecurity best practices for the secure usage of IoT
  devices and services.\r

  ▪ Embed training programs with information about IoT cybersecurity best
  practices, roles and responsibilities, policies and standards to ensure a safe
  work environment."
