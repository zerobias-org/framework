externalId: 2-15-2
name: 2-15-2
description: "Define and implement steps for installing and setting up an IoT
  device and service. It is recommended that these steps are in alignment with
  cybersecurity best practices regarding the usability of the device and service
  such as but not limited to:\r

  ▪ Apply secure configuration and hardening options that are applicable to the
  organization, such as disabling certain features or functionalities that would
  not be used by the organization.\r

  ▪ Implement secure set up and configuration to the IoT device, in order to
  reduce the exposure to threats; such as ensuring all IoT devices and related
  applications/services don't contain default or hardcoded passwords, and to be
  unique and complex.\r

  ▪ Implement cybersecurity tests prior to deploying the application in the
  production environment.\r

  ▪ Periodically conduct cybersecurity tests before and after every new software
  release."
elementType: control
