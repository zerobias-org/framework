externalId: 2-12-2
name: 2-12-2
description: "Establish an IoT cybersecurity incident management plan,
  comprising incident response and handling procedures in alignment with the
  organization's overall incident management practices. Which can include the
  following:\r

  ▪ Prepare for incidents by ensuring that systems, networks, and applications
  are secure.\r

  ▪ Detect, analyze and document the incident.\r

  ▪ Communicate the incident with the stakeholders including the National
  Cybersecurity Authority (NCA).\r

  ▪ Contain, eradicate and recover from the incident.\r

  ▪ Create a follow up report for the incident."
elementType: control
