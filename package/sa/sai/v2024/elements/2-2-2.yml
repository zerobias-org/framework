externalId: 2-2-2
name: 2-2-2
description: "Implement strong authentication standard to access IoT devices and
  services, and follow best practices, including but not limited to:\r

  ▪ Prevent the users from using default and hard-coded passwords.\r

  ▪ Enforce the users to change their passwords periodically.\r

  ▪ Improve the complexity of passwords, such as by defining a minimum key
  length and usage of a combination ofletters (upper/lower cases), numbers and
  symbols;\r

  ▪ Implement controls to prevent the display of user's credentials on login
  interfaces in applications.\r

  ▪ Establish threshold limits for unsuccessful attempts.\r

  ▪ Enable secure authentication capabilities, if applicable."
elementType: control
