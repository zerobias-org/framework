id: 6557b7aa-549f-4b65-99d6-5bcd88e8eb02
externalId: 2-5-1
name: 2-5-1
description: "Implement the following measures for IoT-connected mobile devices
  :\r

  ▪ Implement measures to secure the communication between the IoT device and
  the mobile devices.\r

  ▪ Restrict the access to IoT-connected mobile devices only to authorized
  personnel.\r

  ▪ Use secure methods of authentication for accessing the mobile device and IoT
  device data.\r

  ▪ Implement secure code development practices for mobile applications
  interacting with the IoT devices.\r

  ▪ Secure erasure of IoT devices stored data when losing the mobile device, or
  when the device is no longer used."
elementType: control
