name: 1-9-2
description: "Promote IoT cybersecurity awareness at all organization levels,
  considering the following;\r

  ▪ Keeping personnel aware at all organization levels of the importance of
  safeguarding IoT devices, including decision-makers.\r

  ▪ Conducting cybersecurity activities to raise IoT cybersecurity awareness
  among personnel, through courses, IoT cybersecurity simulations activties,
  cybersecurity best practices brochures via e-mail, round tables, and any other
  awareness channel.\r

  ▪ Assessing the IoT cybersecurity skills of personnel to identify knowledge
  gaps, and efficiently map training against the required skills for each job.\r

  ▪ Ensuring that personnel working with IoT devices and services are updated
  with the latest developments of in the field of IoT cybersecurity."
elementType: control
