name: 2-9-2
description: "Patch all the software/firmeware components within the IoT devices
  in a timely manner as following:\r

  ▪ Implement software patches in a preventative manner, to ensure cybersecurity
  vulnerabilities are eliminated before they can be exploited.\r

  ▪ Ensure that the essential function of the device is maintained during
  software patching.\r

  ▪ Utilize the most recent operating system for development the IoT device, as
  it would help ensure that known vulnerabilities have been mitigated."
elementType: control
