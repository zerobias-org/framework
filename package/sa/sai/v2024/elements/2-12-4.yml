externalId: 2-12-4
name: 2-12-4
description: "Define IoT cybersecurity requirements for threat management as
  part of the overall threat modelling process developed by the organization.
  Implement the following practices as part of the IoT threat management plan:\r

  ▪ Monitor, track and aggregate threat intelligence data derived from the usage
  of IoT devices and services.\r

  ▪ Share information regarding breach indicators and threat intelligence with
  the National Cybersecurity Authority (NCA).\r

  ▪ Periodically review the cybersecurity requirements for threat management."
elementType: control
