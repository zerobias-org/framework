id: 044d0194-990d-4df7-a154-2e12fab77700
externalId: Article 5.1
name: Article 5.1
description: Except for the cases stated in this Law, neither Personal Data may
  be processed nor the purpose of Personal Data Processing may be changed
  without the consent of the Data Subject. The Regulations Shall set out the
  conditions of the consent, the cases in which the consent must be explicit,
  and the terms and conditions related to obtaining the consent of the legal
  guardian if the Data Subject fully or partially lacks legal capacity.
elementType: control
