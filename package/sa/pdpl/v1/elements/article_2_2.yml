id: 923d08e1-83ee-4cc5-a441-c482541fb50f
externalId: Article 2.2
name: Article 2.2
description: The scope of applying the Law excludes the individual's Personal
  Data Processing for purposes that do not go beyond personal or family use, as
  long as the Data Subject did not publish or disclose it to others. The
  Regulations shall define personal and family use provided in this Paragraph.
elementType: control
