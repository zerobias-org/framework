id: 85e67980-3090-434b-9257-795c5fba9858
externalId: Article 30.2
name: Article 30.2
description: The Regulations shall identify the situations where the Controller
  shall appoint one or more persons as personal data protection officer(s). and
  shall set the responsibilities of any such person in accordance with the
  provisions of this Law.
elementType: control
