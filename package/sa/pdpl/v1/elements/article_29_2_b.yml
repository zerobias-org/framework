id: 9a9fa171-e788-4689-ba2a-463c266b749e
externalId: Article 29.2.b
name: Article 29.2.b
description: There is an adequate level of protection for Personal Data outside
  the Kingdom. Such level of protection shall be at least equivalent to the
  level of protection guaranteed by the Law and Regulations, according to the
  results of an assessment conducted by the Competent Authority in coordination
  with whomever it deems appropriate from the other relevant authorities.
elementType: control
