id: 75210e1e-b648-45a5-9763-90943f02087d
externalId: Article 13.2
name: Article 13.2
description: The purpose of the Collection, and shall specify the Personal Data
  whose Collection is mandatory and the Personal Data whose Collection is
  optional. The Data Subject shall be informed that the Personal Data will not
  be subsequently processed in a manner inconsistent with the Collection purpose
  or in cases other than those stated in Article (10) of this Law.
elementType: control
