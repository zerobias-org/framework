id: f7a2b6aa-b5ff-496c-837a-fffc0ce1635c
externalId: Article 11.3
name: Article 11.3
description: The content of the Personal Data shall be appropriate and limited
  to the minimum amount necessary to achieve the purpose of the Collection.
  Content that may lead to specifically identifying Data Subject once the
  purpose of Collection is achieved shall be avoided. The Regulations shall set
  out the necessary controls in this regard.
elementType: control
