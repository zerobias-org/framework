id: 50d727ed-003e-43e0-9084-7ed89003f37a
externalId: Article 18.1
name: Article 18.1
description: The Controller shall, without undue delay, Destroy the Personal
  Data when no longer necessary for the purpose for which they were collected.
  However, the Controller may retain data after the purpose of the Collection
  ceases to exist; provided that it does not contain anything that may lead to
  specifically identifying Data Subject pursuant to the controls stipulated in
  the Regulations.
elementType: control
