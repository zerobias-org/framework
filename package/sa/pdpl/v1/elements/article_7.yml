externalId: Article 7
name: Article 7
description: The consent referred to in paragraph (1) of Article (5) of this Law
  may not form a condition of providing a service or a benefit, unless such
  service or benefit is directly related to the Processing of Personal Data for
  which the consent is given.
elementType: control
