id: 21568376-836c-4df4-aee0-964b55b17347
externalId: Article 26
name: Article 26
description: With the exception of Sensitive Data, Personal Data may be
  processed for marketing purposes, if it is collected directly from the Data
  Subject and their consent is given in accordance with the provisions of Law;
  the Regulations shall set out the controls in such regard.
elementType: control
