id: 47083c9b-89e6-4f93-81c7-84e4f683070e
externalId: Article 12
name: Article 12
description: The Controller shall use a privacy policy and make it available to
  Data Subjects for their information prior to collecting their Personal Data.
  The policy shall specify the purpose of Collection, Personal Data to be
  collected, the means used for Collection, Processing, storage and Destruction,
  and information about the Data Subject rights and how to exercise such rights.
elementType: control
