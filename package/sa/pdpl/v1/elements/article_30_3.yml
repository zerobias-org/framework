id: d1721bda-b067-41e4-b1c7-c7e160113ea0
externalId: Article 30.3
name: Article 30.3
description: The Controller shall cooperate with the Competent Authority in
  performing its duties to supervise the implementation of the provisions of
  this Law and the Regulations, and shall take such steps as necessary in
  connection with the related matters referred to the Controller by the
  Competent Authority.
elementType: control
