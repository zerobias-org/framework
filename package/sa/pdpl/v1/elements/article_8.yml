id: cbd7a1ee-841b-4d39-b594-d099cc817cb0
externalId: Article 8
name: Article 8
description: Subject to the provisions of this Law and the Regulations regarding
  the Disclosure of Personal Data, the Controller shall only select Processors
  providing the necessary guarantees to implement the provisions of this Law and
  the Regulations. The Controller shall also monitor the compliance of said
  Processors with the provisions of this Law and the Regulations. This shall not
  prejudice the Controller’s responsibilities towards the Data Subject or the
  Competent Authority as the case may be. The Regulations shall set out the
  provisions necessary in this regard, including provisions related to any
  subsequent contracts conducted by the Processor.
elementType: control
