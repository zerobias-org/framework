externalId: Article 10
name: Article 10
description: >-
  The Controller may only collect Personal Data directly from the Data Subject
  and may only process Personal Data for the purposes for which they have been
  collected. However, the Controller may collect Personal Data from a source
  other that the Data Subject and may process Personal Data for purposes other
  than the ones for which they have been collected in the following situations:


  The Regulations shall set out the provisions, controls and procedures related
  to what is stated in paragraphs (2) to (7) of this Article.
elementType: control
