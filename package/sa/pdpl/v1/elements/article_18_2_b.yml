externalId: Article 18.2.b
name: Article 18.2.b
description: If the Personal Data is closely related to a case under
  consideration before a judicial authority and the retention of the Personal
  Data is required for that purpose, in which case the Personal Data shall be
  destroyed once the judicial procedures are concluded.
elementType: control
