id: 2eea7e53-1991-4c1d-b2ef-f0b779aac500
name: Inventory and Control of Software Assets
elementType: control
externalId: '2'
description: >-
  Actively manage (inventory, track, and correct) all software (operating
  systems and applications) on the network so that only authorized software is
  installed and can execute, and that unauthorized and unmanaged software is
  found and prevented from installation or execution.
