id: 311f9267-955c-44a8-b027-59a2358b4515
externalId: "1"
name: Inventory and Control of Enterprise Assets
description: Actively manage (inventory, track, and correct) all enterprise
  assets (end-user devices, including portable and mobile; network devices;
  non-computing/Internet of Things (IoT) devices; and servers) connected to the
  infrastructure physically, virtually, remotely, and those within cloud
  environments, to accurately know the totality of assets that need to be
  monitored and protected within the enterprise. This will also support
  identifying unauthorized and unmanaged assets to remove or remediate.
elementType: control
