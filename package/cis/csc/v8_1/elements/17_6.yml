id: 1ee9b5f6-2fce-4222-ab89-822a94b8685b
externalId: "17.6"
name: Define Mechanisms for Communicating During Incident Response
description: Determine which primary and secondary mechanisms will be used to
  communicate and report during a security incident. Mechanisms can include
  phone calls, emails, secure chat, or notification letters. Keep in mind that
  certain mechanisms, such as emails, can be affected during a security
  incident. Review annually, or when significant enterprise changes occur that
  could impact this Safeguard.
elementType: control
