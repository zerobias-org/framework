id: f34f831b-3cc1-4ce6-84d9-f2c8ad212e73
externalId: "5.2"
name: Use Unique Passwords
description: Use unique passwords for all enterprise assets. Best practice
  implementation includes, at a minimum, an 8-character password for accounts
  using Multi-Factor Authentication (MFA) and a 14-character password for
  accounts not using MFA.
elementType: control
