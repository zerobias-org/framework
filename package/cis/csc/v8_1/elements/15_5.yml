id: ac47befc-c7a5-47e3-a53a-c58f373ed2f4
externalId: "15.5"
name: Assess Service Providers
description: Assess service providers consistent with the enterprise’s service
  provider management policy. Assessment scope may vary based on
  classification(s), and may include review of standardized assessment reports,
  such as Service Organization Control 2 (SOC 2) and Payment Card Industry (PCI)
  Attestation of Compliance (AoC), customized questionnaires, or other
  appropriately rigorous processes. Reassess service providers annually, at a
  minimum, or with new and renewed contracts.
elementType: control
