id: 1b0d18da-9376-492c-9e92-ac83f6cf299e
externalId: "3.11"
name: Encrypt Sensitive Data at Rest
description: Encrypt sensitive data at rest on servers, applications, and
  databases. Storage-layer encryption, also known as server-side encryption,
  meets the minimum requirement of this Safeguard. Additional encryption methods
  may include application-layer encryption, also known as client-side
  encryption, where access to the data storage device(s) does not permit access
  to the plain-text data.
elementType: control
