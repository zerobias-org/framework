id: 17ab769a-ec4e-47f5-b94f-8d0af9949ed1
externalId: "3.1"
name: Establish and Maintain a Data Management Process
description: Establish and maintain a documented data management process. In the
  process, address data sensitivity, data owner, handling of data, data
  retention limits, and disposal requirements, based on sensitivity and
  retention standards for the enterprise. Review and update documentation
  annually, or when significant enterprise changes occur that could impact this
  Safeguard.
elementType: control
