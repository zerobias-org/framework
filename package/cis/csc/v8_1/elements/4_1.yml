id: e245b949-d1a9-4227-86f8-9eaf8a394bf3
externalId: "4.1"
name: Establish and Maintain a Secure Configuration Process
description: Establish and maintain a documented secure configuration process
  for enterprise assets (end-user devices, including portable and mobile,
  non-computing/IoT devices, and servers) and software (operating systems and
  applications). Review and update documentation annually, or when significant
  enterprise changes occur that could impact this Safeguard.
elementType: control
