id: 3544e88d-d07c-47b0-92e1-0a4572470f64
externalId: "16.7"
name: Use Standard Hardening Configuration Templates for Application Infrastructure
description: Use standard, industry-recommended hardening configuration
  templates for application infrastructure components. This includes underlying
  servers, databases, and web servers, and applies to cloud containers, Platform
  as a Service (PaaS) components, and SaaS components. Do not allow in-house
  developed software to weaken configuration hardening.
elementType: control
