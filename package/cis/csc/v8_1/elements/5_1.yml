id: d87878af-13c6-4914-9150-115cf7d7e916
externalId: "5.1"
name: Establish and Maintain an Inventory of Accounts
description: Establish and maintain an inventory of all accounts managed in the
  enterprise. The inventory mustmust at a minimum include user, administrator
  accounts, and service accounts. The inventory, at a minimum, should contain
  the person’s name, username, start/stop dates, and department. Validate that
  all active accounts are authorized, on a recurring schedule at a minimum
  quarterly, or more frequently.
elementType: control
