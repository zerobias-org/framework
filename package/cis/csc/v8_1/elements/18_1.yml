id: d41771e1-367f-4982-9ae8-101881933e56
externalId: "18.1"
name: Establish and Maintain a Penetration Testing Program
description: Establish and maintain a penetration testing program appropriate to
  the size, complexity, industry, and maturity of the enterprise. Penetration
  testing program characteristics include scope, such as network, web
  application, Application Programming Interface (API), hosted services, and
  physical premise controls; frequency; limitations, such as acceptable hours,
  and excluded attack types; point of contact information; remediation, such as
  how findings will be routed internally; and retrospective requirements.
elementType: control
