externalId: "16.1"
name: Establish and Maintain a Secure Application Development Process
description: "Establish and maintain a secure application development process.
  In the process, address such items as: secure application design standards,
  secure coding practices, developer training, vulnerability management,
  security of third-party code, and application security testing procedures.
  Review and update documentation annually, or when significant enterprise
  changes occur that could impact this Safeguard."
elementType: control
