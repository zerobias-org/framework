id: bf89c430-4ff6-4305-a99d-1489600ad73f
externalId: "16.2"
name: Establish and Maintain a Process to Accept and Address Software Vulnerabilities
description: "Establish and maintain a process to accept and address reports of
  software vulnerabilities, including providing a means for external entities to
  report. The process is to include such items as: a vulnerability handling
  policy that identifies reporting process, responsible party for handling
  vulnerability reports, and a process for intake, assignment, remediation, and
  remediation testing. As part of the process, use a vulnerability tracking
  system that includes severity ratings, and metrics for measuring timing for
  identification, analysis, and remediation of vulnerabilities. Review and
  update documentation annually, or when significant enterprise changes occur
  that could impact this Safeguard.\r

  \r

  Third-party application developers need to consider this an externally-facing
  policy that helps to set expectations for outside stakeholders."
elementType: control
