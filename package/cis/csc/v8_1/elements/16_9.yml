id: 6c94cf4d-26f1-474e-b113-3465b8dde31e
externalId: "16.9"
name: Train Developers in Application Security Concepts and Secure Coding
description: Ensure that all software development personnel receive training in
  writing secure code for their specific development environment and
  responsibilities. Training can include general security principles and
  application security standard practices. Conduct training at least annually
  and design in a way to promote security within the development team, and build
  a culture of security among the developers.
elementType: control
