id: a7f64bfa-4e92-4ea4-85e0-ca053d903f35
externalId: "17.1"
name: Designate Personnel to Manage Incident Handling
description: Designate one key person, and at least one backup, who will manage
  the enterprise’s incident handling process. Management personnel are
  responsible for the coordination and documentation of incident response and
  recovery efforts and can consist of employees internal to the enterprise,
  service providers, or a hybrid approach. If using a service provider,
  designate at least one person internal to the enterprise to oversee any
  third-party work. Review annually, or when significant enterprise changes
  occur that could impact this Safeguard.
elementType: control
