id: 94347df5-3301-46b5-9081-61092383a406
externalId: "11.1"
name: Establish and Maintain a Data Recovery Process
description: Establish and maintain a data recovery process. In the process,
  address the scope of data recovery activities, recovery prioritization, and
  the security of backup data. Review and update documentation annually, or when
  significant enterprise changes occur that could impact this Safeguard.
elementType: control
