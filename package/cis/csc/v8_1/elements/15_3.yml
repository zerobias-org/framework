id: bf3a2f36-d961-4eb8-b1ed-55bf531f4c11
externalId: "15.3"
name: Classify Service Providers
description: Classify service providers. Classification consideration may
  include one or more characteristics, such as data sensitivity, data volume,
  availability requirements, applicable regulations, inherent risk, and
  mitigated risk. Update and review classifications annually, or when
  significant enterprise changes occur that could impact this Safeguard.
elementType: control
