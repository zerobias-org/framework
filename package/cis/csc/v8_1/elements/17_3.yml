id: 46232ea7-83d7-4cfb-9293-1014b3c8bf2c
externalId: "17.3"
name: Establish and Maintain an Enterprise Process for Reporting Incidents
description: Establish and maintain an documented enterprise process for the
  workforce to report security incidents. The process includes reporting
  timeframe, personnel to report to, mechanism for reporting, and the minimum
  information to be reported. Ensure the process is publicly available to all of
  the workforce. Review annually, or when significant enterprise changes occur
  that could impact this Safeguard.
elementType: control
