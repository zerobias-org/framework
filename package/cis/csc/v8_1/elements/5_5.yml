id: 573dc386-bfa4-4419-80c8-4051f97c32d7
externalId: "5.5"
name: Establish and Maintain an Inventory of Service Accounts
description: Establish and maintain an inventory of service accounts. The
  inventory, at a minimum, must contain department owner, review date, and
  purpose. Perform service account reviews to validate that all active accounts
  are authorized, on a recurring schedule at a minimum quarterly, or more
  frequently.
elementType: control
