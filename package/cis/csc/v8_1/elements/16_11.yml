id: a37847f0-6974-4b32-b42f-4c8d2f729b60
externalId: "16.11"
name: Leverage Vetted Modules or Services for Application Security Components
description: Leverage vetted modules or services for application security
  components, such as identity management, encryption, and auditing and logging.
  Using platform features in critical security functions will reduce developers’
  workload and minimize the likelihood of design or implementation errors.
  Modern operating systems provide effective mechanisms for identification,
  authentication, and authorization and make those mechanisms available to
  applications. Use only standardized, currently accepted, and extensively
  reviewed encryption algorithms. Operating systems also provide mechanisms to
  create and maintain secure audit logs.
elementType: control
