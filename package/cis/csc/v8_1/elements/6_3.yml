id: 3f887dc8-0f3e-4e36-b5c3-20866685e778
externalId: "6.3"
name: Require MFA for Externally-Exposed Applications
description: Require all externally-exposed enterprise or third-party
  applications to enforce MFA, where supported. Enforcing MFA through a
  directory service or SSO provider is a satisfactory implementation of this
  Safeguard.
elementType: control
