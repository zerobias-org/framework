id: beedef84-d1ec-4985-85ae-f0bbd8912a02
externalId: "15.1"
name: Establish and Maintain an Inventory of Service Providers
description: Establish and maintain an inventory of service providers. The
  inventory is to list all known service providers, include classification(s),
  and designate an enterprise contact for each service provider. Review and
  update the inventory annually, or when significant enterprise changes occur
  that could impact this Safeguard.
elementType: control
