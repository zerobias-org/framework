name: Train Workforce on the Dangers of Connecting to and Transmitting
  Enterprise Data Over Insecure Networks
description: Train workforce members on the dangers of connecting to, and
  transmitting data over, insecure networks for enterprise activities. If the
  enterprise has remote workers, training must include guidance to ensure that
  all users securely configure their home network infrastructure.
