id: f5524e46-005f-446d-b409-225dc28e2253
externalId: "6.8"
name: Define and Maintain Role-Based Access Control
description: Define and maintain role-based access control, through determining
  and documenting the access rights necessary for each role within the
  enterprise to successfully carry out its assigned duties. Perform access
  control reviews of enterprise assets to validate that all privileges are
  authorized, on a recurring schedule at a minimum annually, or more frequently.
elementType: control
