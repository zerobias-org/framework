externalId: "16.13"
name: Conduct Application Penetration Testing
description: Conduct application penetration testing. For critical applications,
  authenticated penetration testing is better suited to finding business logic
  vulnerabilities than code scanning and automated security testing. Penetration
  testing relies on the skill of the tester to manually manipulate an
  application as an authenticated and unauthenticated user.
elementType: control
