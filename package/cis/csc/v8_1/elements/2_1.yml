id: 089efd03-ea04-4d8b-95fc-ea6126a9e41f
externalId: "2.1"
name: Establish and Maintain a Software Inventory
description: Establish and maintain a detailed inventory of all licensed
  software installed on enterprise assets. The software inventory must document
  the title, publisher, initial install/use date, and business purpose for each
  entry; where appropriate, include the Uniform Resource Locator (URL), app
  store(s), version(s), deployment mechanism, and decommission date. Review and
  update the software inventory bi-annually, or more frequently.
elementType: control
