id: f53004d7-8ac3-431e-b69b-a6a3cd4efbe2
externalId: "12.8"
name: Establish and Maintain Dedicated Computing Resources for All
  Administrative Work
description: Establish and maintain dedicated computing resources, either
  physically or logically separated, for all administrative tasks or tasks
  requiring administrative access. The computing resources should be segmented
  from the enterprise's primary network and not be allowed internet access.
elementType: control
