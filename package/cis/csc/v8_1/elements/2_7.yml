name: Allowlist Authorized Scripts
description: Use technical controls, such as digital signatures and version
  control, to ensure that only authorized scripts, such as specific .ps1, and
  .py files are allowed to execute. Block unauthorized scripts from executing.
  Reassess bi-annually, or more frequently.
elementType: control
