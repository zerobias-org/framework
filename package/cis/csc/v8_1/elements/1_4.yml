id: c61dbbc8-b124-4a5e-ab38-bd8684812eb8
externalId: "1.4"
name: Use Dynamic Host Configuration Protocol (DHCP) Logging to Update
  Enterprise Asset Inventory
description: Use DHCP logging on all DHCP servers or Internet Protocol (IP)
  address management tools to update the enterprise’s asset inventory. Review
  and use logs to update the enterprise’s asset inventory weekly, or more
  frequently.
elementType: control
