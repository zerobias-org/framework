id: af1c313c-c4c7-4c51-b71c-1b92d39375a1
externalId: "8.1"
name: Establish and Maintain an Audit Log Management Process
description: Establish and maintain a documented audit log management process
  that defines the enterprise’s logging requirements. At a minimum, address the
  collection, review, and retention of audit logs for enterprise assets. Review
  and update documentation annually, or when significant enterprise changes
  occur that could impact this Safeguard.
elementType: control
