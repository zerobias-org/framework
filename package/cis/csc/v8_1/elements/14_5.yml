name: Train Workforce Members on Causes of Unintentional Data Exposure
description: Train workforce members to be aware of causes for unintentional
  data exposure. Example topics include mis-delivery of sensitive data, losing a
  portable end-user device, or publishing data to unintended audiences.
elementType: control
