id: c4d1867e-b963-46ef-983b-381407222c9d
externalId: "6.6"
name: Establish and Maintain an Inventory of Authentication and Authorization Systems
description: Establish and maintain an inventory of the enterprise’s
  authentication and authorization systems, including those hosted on-site or at
  a remote service provider. Review and update the inventory, at a minimum,
  annually, or more frequently.
elementType: control
