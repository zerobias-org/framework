id: 2a9c9f74-f0b0-4ce9-9c97-d37329667004
externalId: "17.2"
name: Establish and Maintain Contact Information for Reporting Security Incidents
description: Establish and maintain contact information for parties that need to
  be informed of security incidents. Contacts may include internal staff,
  service vendors, law enforcement, cyber insurance providers, relevant
  government agencies, Information Sharing and Analysis Center (ISAC) partners,
  or other stakeholders. Verify contacts annually to ensure that information is
  up-to-date.
elementType: control
