name: Restrict Administrator Privileges to Dedicated Administrator Accounts
description: Restrict administrator privileges to dedicated administrator
  accounts on enterprise assets. Conduct general computing activities, such as
  internet browsing, email, and productivity suite use, from the user’s primary,
  non-privileged account.
