id: d3a022dc-4cc3-4ac5-8f0e-096029324093
externalId: "18.2"
name: Perform Periodic External Penetration Tests
description: Perform periodic external penetration tests based on program
  requirements, no less than annually. External penetration testing must include
  enterprise and environmental reconnaissance to detect exploitable information.
  Penetration testing requires specialized skills and experience and must be
  conducted through a qualified party. The testing may be clear box or opaque
  box.
elementType: control
