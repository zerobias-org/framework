id: 2f1ab3f0-54c3-48d0-9c7b-9ab0160cec82
externalId: 6(4)
name: Consent
description: Where consent given by the Data Principal is the basis of
  processing of personal data, such Data Principal shall have the right to
  withdraw her consent at any time, with the ease of doing so being comparable
  to the ease with which such consent was given.
elementType: control
