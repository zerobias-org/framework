id: 1e101f76-902d-4d84-9cbe-bd6a980f2c9c
externalId: 8(5)
name: General Obligations of Data Fiduciary
description: A Data Fiduciary shall protect personal data in its possession or
  under its control, including in respect of any processing undertaken by it or
  on its behalf by a Data Processor, by taking reasonable security safeguards to
  prevent personal data breach.
elementType: control
