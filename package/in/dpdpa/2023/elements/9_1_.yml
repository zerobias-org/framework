id: 7fd95144-4f6d-457b-ace3-abe98e0519c6
externalId: 9(1)
name: Processing of Personal Data of Children
description: The Data Fiduciary shall, before processing any personal data of a
  child or a person with disability who has a lawful guardian obtain verifiable
  consent of the parent of such child or the lawful guardian, as the case may
  be, in such manner as may be prescribed.
elementType: control
