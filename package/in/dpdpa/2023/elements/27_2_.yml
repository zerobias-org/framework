id: bc924437-8438-4993-8553-c082c51b803e
externalId: 27(2)
name: Powers and Functions of Board
description: The Board may, for the effective discharge of its functions under
  the provisions of this Act, after giving the person concerned an opportunity
  of being heard and after recording reasons in writing, issue such directions
  as it may consider necessary to such person, who shall be bound to comply with
  the same.
elementType: control
