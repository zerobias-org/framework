externalId: 28(1)
name: Procedure to Be Followed By Board
description: The Board shall function as an independent body and shall, as far
  as practicable, function as a digital office, with the receipt of complaints
  and the allocation, hearing and pronouncement of decisions in respect of the
  same being digital by design, and adopt such techno-legal measures as may be
  prescribed.
elementType: control
