id: 997bdd8f-b253-46b6-807f-92185e227ea1
externalId: 6(6)
name: Consent
description: If a Data Principal withdraws her consent to the processing of
  personal data under sub-section (5), the Data Fiduciary shall, within a
  reasonable time, cease and cause its Data Processors to cease processing the
  personal data of such Data Principal unless such processing without her
  consent is required or authorised under the provisions of this Act or the
  rules made thereunder or any other law for the time being in force in India.
elementType: control
