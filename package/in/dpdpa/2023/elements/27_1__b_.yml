id: f426833b-e7fe-4300-b7ce-0d9463c2255d
externalId: 27(1)(b)
name: Powers and Functions of Board
description: on a complaint made by a Data Principal in respect of a personal
  data breach or a breach in observance by a Data Fiduciary of its obligations
  in relation to her personal data or the exercise of her rights under the
  provisions of this Act, or on a reference made to it by the Central Government
  or a State Government, or in compliance of the directions of any court, to
  inquire into such breach and impose penalty as provided in this Act;
elementType: control
