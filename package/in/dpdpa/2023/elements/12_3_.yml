id: 7a1f2e19-8ecd-40a8-a23b-cdb6cd5660a3
externalId: 12(3)
name: Right to Correction and Erasure of Personal Data
description: A Data Principal shall make a request in such manner as may be
  prescribed to the Data Fiduciary for erasure of her personal data, and upon
  receipt of such a request, the Data Fiduciary shall erase her personal data
  unless retention of the same is necessary for the specified purpose or for
  compliance with any law for the time being in force.
elementType: control
