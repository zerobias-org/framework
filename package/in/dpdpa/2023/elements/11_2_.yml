id: 39544e83-675d-4835-8e06-ecfd2ef224fe
externalId: 11(2)
name: Right to Access Information About Personal Data
description: Nothing contained in clause (b) or clause (c) of sub-section (1)
  shall apply in respect of the sharing of any personal data by the said Data
  Fiduciary with any other Data Fiduciary authorised by law to obtain such
  personal data, where such sharing is pursuant to a request made in writing by
  such other Data Fiduciary for the purpose of prevention or detection or
  investigation of offences or cyber incidents, or for prosecution or punishment
  of offences.
elementType: control
