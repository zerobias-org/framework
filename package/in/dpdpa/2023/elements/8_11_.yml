id: 1c79c7ed-795b-4bd4-9237-39a800e9e91f
externalId: 8(11)
name: General Obligations of Data Fiduciary
description: For the purposes of this section, it is hereby clarified that a
  Data Principal shall be considered as not having approached the Data Fiduciary
  for the performance of the specified purpose, in any period during which she
  has not initiated contact with the Data Fiduciary for such performance, in
  person or by way of communication in electronic or physical form.
elementType: control
