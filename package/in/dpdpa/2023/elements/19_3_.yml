id: e5b79763-5c41-4bb9-8865-df9bef46f447
externalId: 19(3)
name: Composition and Qualifications for Appointment of Chairperson and Members
description: The Chairperson and other Members shall be a person of ability,
  integrity and standing who possesses special knowledge or practical experience
  in the fields of data governance, administration or implementation of laws
  related to social or consumer protection, dispute resolution, information and
  communication technology, digital economy, law, regulation or
  techno-regulation, or in any other field which in the opinion of the Central
  Government may be useful to the Board, and at least one among them shall be an
  expert in the field of law.
elementType: control
