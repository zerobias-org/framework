id: 63f292f1-1b18-407b-b63f-40f0d975c2df
externalId: 22(2)
name: Resignation by Members and Filling of Vacancy
description: A vacancy caused by the resignation or removal or death of the
  Chairperson or any other Member, or otherwise, shall be filled by fresh
  appointment in accordance with the provisions of this Act.
elementType: control
