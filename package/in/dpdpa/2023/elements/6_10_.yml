id: bf6d2036-28e3-4ad9-b147-0d64bd67af2f
externalId: 6(10)
name: Consent
description: Where a consent given by the Data Principal is the basis of
  processing of personal data and a question arises in this regard in a
  proceeding, the Data Fiduciary shall be obliged to prove that a notice was
  given by her to the Data Principal and consent was given by such Data
  Principal to the Data Fiduciary in accordance with the provisions of this Act
  and the rules made thereunder.
elementType: control
