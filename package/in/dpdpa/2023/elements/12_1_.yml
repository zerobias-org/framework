id: 3ebff848-6a2e-4f67-9fe9-f69b0ee30beb
externalId: 12(1)
name: Right to Correction and Erasure of Personal Data
description: A Data Principal shall have the right to correction, completion,
  updating and erasure of her personal data for the processing of which she has
  previously given consent, including consent as referred to in clause (a) of
  section 7, in accordance with any requirement or procedure under any law for
  the time being in force.
elementType: control
