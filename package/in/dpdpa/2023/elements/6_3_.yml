id: c9db3fc7-3901-44e3-8f2a-281e10b95ecb
externalId: 6(3)
name: Consent
description: Every request for consent under the provisions of this Act or the
  rules made thereunder shall be presented to the Data Principal in a clear and
  plain language, giving her the option to access such request in English or any
  language specified in the Eighth Schedule to the Constitution and providing
  the contact details of a Data Protection Officer, where applicable, or of any
  other person authorised by the Data Fiduciary to respond to any communication
  from the Data Principal for the purpose of exercise of her rights under the
  provisions of this Act.
elementType: control
