id: 4a8dfc05-9cfb-47a2-938d-1dc26af1b51f
externalId: 8(2)
name: General Obligations of Data Fiduciary
description: A Data Fiduciary may engage, appoint, use or otherwise involve a
  Data Processor to process personal data on its behalf for any activity related
  to offering of goods or services to Data Principals only under a valid
  contract.
elementType: control
