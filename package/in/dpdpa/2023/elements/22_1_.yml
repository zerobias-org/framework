id: 13034d88-32ab-484a-9c78-12661afb41f9
externalId: 22(1)
name: Resignation by Members and Filling of Vacancy
description: The Chairperson or any other Member may give notice in writing to
  the Central Government of resigning from her office, and such resignation
  shall be effective from the date on which the Central Government permits her
  to relinquish office, or upon expiry of a period of three months from the date
  of receipt of such notice, or upon a duly appointed successor entering upon
  her office, or upon the expiry of the term of her office, whichever is
  earliest.
elementType: control
