id: 7c6e3397-56bf-412c-a890-e945e715a05f
externalId: 8(1)
name: General Obligations of Data Fiduciary
description: A Data Fiduciary shall, irrespective of any agreement to the
  contrary or failure of a Data Principal to carry out the duties provided under
  this Act, be responsible for complying with the provisions of this Act and the
  rules made thereunder in respect of any processing undertaken by it or on its
  behalf by a Data Processor.
elementType: control
