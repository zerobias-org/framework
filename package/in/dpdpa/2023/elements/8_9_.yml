id: d7bb32e3-826a-45f4-8a5c-35cd023e5be6
externalId: 8(9)
name: General Obligations of Data Fiduciary
description: A Data Fiduciary shall publish, in such manner as may be
  prescribed, the business contact information of a Data Protection Officer, if
  applicable, or a person who is able to answer on behalf of the Data Fiduciary,
  the questions, if any, raised by the Data Principal about the processing of
  her personal data.
elementType: control
