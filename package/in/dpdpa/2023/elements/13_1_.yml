id: 5c115029-8e34-4a25-8aa3-685088824822
externalId: 13(1)
name: Right of Grievance Redressal
description: A Data Principal shall have the right to have readily available
  means of grievance redressal provided by a Data Fiduciary or Consent Manager
  in respect of any act or omission of such Data Fiduciary or Consent Manager
  regarding the performance of its obligations in relation to the personal data
  of such Data Principal or the exercise of her rights under the provisions of
  this Act and the rules made thereunder.
elementType: control
