id: b6aeda9b-e99c-4e4f-b29a-1f822e617e6f
externalId: 14(1)
name: Right to Nominate
description: A Data Principal shall have the right to nominate, in such manner
  as may be prescribed, any other individual, who shall, in the event of death
  or incapacity of the Data Principal, exercise the rights of the Data Principal
  in accordance with the provisions of this Act and the rules made thereunder.
elementType: control
