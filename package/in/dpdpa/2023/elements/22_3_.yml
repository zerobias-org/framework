id: d707ff9f-b718-43cd-9784-12c28cecd936
externalId: 22(3)
name: Resignation by Members and Filling of Vacancy
description: The Chairperson and any other Member shall not, for a period of one
  year from the date on which they cease to hold such office, except with the
  previous approval of the Central Government, accept any employment, and shall
  also disclose to the Central Government any subsequent acceptance of
  employment with any Data Fiduciary against whom proceedings were initiated by
  or before such Chairperson or other Member.
elementType: control
