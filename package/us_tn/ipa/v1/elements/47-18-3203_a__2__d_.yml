name: 47-18-3203(a)(2)(D)
description: Obtain a copy of the consumer's personal information that the
  consumer previously provided to the controller in a portable and, to the
  extent technically feasible, readily usable format that allows the consumer to
  transmit the data to another controller without hindrance, where the
  processing is carried out by automated means; or
elementType: control
