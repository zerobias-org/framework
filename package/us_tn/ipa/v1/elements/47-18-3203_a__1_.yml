id: 3f96c81f-742b-4cd7-979c-9bb9879338ac
externalId: 47-18-3203(a)(1)
name: 47-18-3203(a)(1)
description: >-
  A consumer may invoke the consumer rights authorized pursuant to

  subdivision (a)(2) at any time by submitting a request to a controller
  specifying the consumer rights the consumer wishes to invoke. A known child's
  parent or legal guardian may invoke the consumer rights authorized pursuant to
  subdivision (a)(2) on behalf of the child regarding processing personal
  information belonging to the known child.
elementType: control
