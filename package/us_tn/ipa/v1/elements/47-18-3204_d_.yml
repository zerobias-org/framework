externalId: 47-18-3204(d)
name: 47-18-3204(d)
description: >-
  If a controller sells personal information to third parties or processes
  personal

  information for targeted advertising, then the controller shall clearly
  and  conspicuously disclose the processing, as well as the manner in which a
  consumer may exercise the right to opt out of the processing
elementType: control
