id: 9e619090-afcf-44f9-8278-d742a05dd85f
externalId: 47-18-3203(b)(3)
name: 47-18-3203(b)(3)
description: Information provided in response to a consumer request must be
  provided by a controller free of charge, up to twice annually per consumer. If
  requests from a consumer are manifestly unfounded, technically infeasible,
  excessive, or repetitive, then the controller may charge the consumer a
  reasonable fee to cover the administrative costs of complying with the request
  or decline to act on the request. The controller bears the burden of
  demonstrating the manifestly unfounded, technically infeasible, excessive, or
  repetitive nature of the request; and
elementType: control
