id: ecdf0047-237f-493c-ae51-418893875dcf
externalId: 47-18-3203(b)(4)
name: 47-18-3203(b)(4)
description: If a controller is unable to authenticate the request using
  commercially reasonable efforts, then the controller is not required to comply
  with a request to initiate an action under subsection (a) and may request that
  the consumer provide additional information reasonably necessary to
  authenticate the consumer and the consumer's request.
elementType: control
