id: 2ebbe3bc-f42a-4051-b42b-5655e928a88d
externalId: 47-18-3204(a)(5)
name: 47-18-3204(a)(5)
description: Not process personal information in violation of state and federal
  laws that prohibit unlawful discrimination against consumers. A controller
  shall not discriminate against a consumer for exercising the consumer rights
  contained in this part, including denying goods or services, charging
  different prices or rates for goods or services, or providing a different
  level of quality of goods and services to the consumer. However, this
  subdivision (a)(5) does not require a controller to provide a product or
  service that requires the personal information of a consumer that the
  controller does not collect or maintain, or prohibit a controller from
  offering a different price, rate, level, quality, or selection of goods or
  services to a consumer, including offering goods or services for no fee, if
  the consumer has exercised the right to opt out pursuant to §
  47-18-3203(a)(2)(F) or the offer is related to a consumer's voluntary
  participation in a bona fide loyalty, rewards, premium features, discounts, or
  club card program; and
elementType: control
