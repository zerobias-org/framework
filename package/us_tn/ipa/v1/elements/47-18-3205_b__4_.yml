externalId: 47-18-3205(b)(4)
name: 47-18-3205(b)(4)
description: Allow, and cooperate with, reasonable assessments by the controller
  or the controller's designated assessor; alternatively, the processor may
  arrange for a qualified and independent assessor to conduct an assessment of
  the processor's policies and technical and organizational measures in support
  of the obligations under this part using an appropriate and accepted control
  standard or framework and assessment procedure for the assessments. The
  processor shall provide a report of each assessment to the controller upon
  request; and
elementType: control
