id: c42f82af-7973-430e-b609-3902216d2e3b
externalId: 47-18-3207(d)
name: 47-18-3207(d)
description: A controller that discloses pseudonymous data or de-identified data
  shall exercise reasonable oversight to monitor compliance with contractual
  commitments to which the pseudonymous data or de-identified data is subject
  and shall take appropriate steps to address breaches of those contractual
  commitments.
elementType: control
