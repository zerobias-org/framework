name: 47-18-3205(b)
description: "A contract between a controller and a processor governs the
  processor's data processing procedures with respect to processing performed on
  behalf of the controller. The contract is binding and must clearly set forth
  instructions for processing data, the nature and purpose of processing, the
  type of data subject to processing, the duration of processing, and the rights
  and obligations of both parties. The contract must also include requirements
  that the processor shall:"
elementType: control
