id: e6a38899-0a86-4920-90d6-f6777a2778ba
externalId: 47-18-3203(b)(2)
name: 47-18-3203(b)(2)
description: If a controller declines to take action regarding the consumer's
  request, then the controller shall inform the consumer without undue delay,
  but in all cases and at the latest within forty-five (45) days of receipt of
  the request, of the justification for declining to take action and
  instructions for how to appeal the decision pursuant to subsection (c);
elementType: control
