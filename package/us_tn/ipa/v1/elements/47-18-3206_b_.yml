id: 5e8781a3-af93-4b03-908c-0ea2dc6e819e
externalId: 47-18-3206(b)
name: 47-18-3206(b)
description: Data protection assessments conducted pursuant to subsection (a)
  must identify and weigh the benefits that may flow, directly and indirectly,
  from the processing to the controller, the consumer, other stakeholders, and
  the public against the potential risks to the rights of the consumer
  associated with the processing, as mitigated by safeguards that can be
  employed by the controller to reduce the risks. The use of deidentified data
  and the reasonable expectations of consumers, as well as the context of the
  processing and the relationship between the controller and the consumer whose
  personal information will be processed, must be factored into this assessment
  by the controller
elementType: control
