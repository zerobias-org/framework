id: b0b92610-ec06-431a-a217-1b4e31352fcc
externalId: 47-18-3203(c)
name: 47-18-3203(c)
description: >-
  A controller shall establish a process for a consumer to appeal the
  controller's refusal to take action on a request within a reasonable period of
  time after the consumer's receipt of the decision pursuant to subdivision
  (b)(2). The appeal process must be made available to the consumer in a
  conspicuous manner, must be

  available at no cost to the consumer, and must be similar to the process for
  submitting requests to initiate action pursuant to subsection (a). Within
  sixty (60) days of receipt of an appeal, a controller shall inform the
  consumer in writing of action taken or not taken in response to the appeal,
  including a written explanation of the reasons for the decisions. If the
  appeal is denied, then the controller shall also provide the consumer with an
  online mechanism, if available, or other method through which the consumer may
  contact the attorney general and reporter to submit a complaint
elementType: control
