id: 52c715bc-5863-489e-b859-8428fd3029a1
externalId: 47-18-3207(c)
name: 47-18-3207(c)
description: The consumer rights contained in §§ 47-18-3203 and 47-18-3204 do
  not apply to pseudonymous data in cases where the controller is able to
  demonstrate information necessary to identify the consumer is kept separately
  and is subject to effective technical and organizational controls that prevent
  the controller from accessing that information.
elementType: control
