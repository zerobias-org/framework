id: 94830796-2e44-4bad-8bcc-44ce215f024b
externalId: 47-18-3204(a)(3)
name: 47-18-3204(a)(3)
description: Establish, implement, and maintain reasonable administrative,
  technical, and physical data security practices, as described in § 47-18-3213,
  to protect the confidentiality, integrity, and accessibility of personal
  information. The data security practices must be appropriate to the volume and
  nature of the personal information at issue;
elementType: control
