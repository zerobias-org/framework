id: 07e57d12-8120-4cdc-96f0-6319a89d23fa
externalId: 47-18-3204(a)(2)
name: 47-18-3204(a)(2)
description: Except as otherwise provided in this part, not process personal
  information for purposes that are beyond what is reasonably necessary to and
  compatible with the disclosed purposes for which the personal information is
  processed, as disclosed to the consumer, unless the controller obtains the
  consumer's consent;
elementType: control
