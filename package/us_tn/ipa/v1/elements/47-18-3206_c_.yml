id: 9748e467-455c-4dfe-b10b-1b889e880bce
externalId: 47-18-3206(c)
name: 47-18-3206(c)
description: >-
  The attorney general and reporter may request pursuant to a civil
  investigative demand that a controller disclose a data protection assessment
  that is relevant to an investigation conducted by the attorney general and
  reporter, and the controller shall make the data protection assessment
  available to the attorney general and reporter. The attorney general and
  reporter may evaluate the data protection

  assessment for compliance with the responsibilities set forth in § 47-18-3204.
  Data protection  assessments are confidential and not open to public
  inspection and copying. The disclosure of a data protection assessment
  pursuant to a request from the attorney general and reporter does not
  constitute a waiver of attorney-client privilege or work product protection
  with respect to the assessment and information contained in the assessment
elementType: control
