externalId: 47-18-3204(a)(6)
name: 47-18-3204(a)(6)
description: Not process sensitive data concerning a consumer without obtaining
  the consumer's consent, or, in the case of the processing of sensitive data
  concerning a known child, without processing the data in accordance with the
  federal Children's Online Privacy Protection Act (15 U.S.C. § 6501 et seq.)
  and its implementing regulations
elementType: control
