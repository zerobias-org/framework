id: b68421a6-72f7-4466-a07e-a69e9fa4fa14
externalId: 47-18-3205(d)
name: 47-18-3205(d)
description: Determining whether a person is acting as a controller or processor
  with respect to a specific processing of data is a fact-based determination
  that depends upon the context in which personal information is to be
  processed. A processor that continues to adhere to a controller's instructions
  with respect to a specific processing of personal information remains a
  processor.
elementType: control
