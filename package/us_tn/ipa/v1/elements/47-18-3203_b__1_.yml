id: 3efe7674-73fc-47c9-ad16-e4992abf453a
externalId: 47-18-3203(b)(1)
name: 47-18-3203(b)(1)
description: A controller shall respond to the consumer without undue delay, but
  in all cases within forty-five (45) days of receipt of a request submitted
  pursuant to subsection (a). The response period may be extended once by
  forty-five (45) additional days when reasonably necessary, taking into account
  the complexity and number of the consumer's requests, so long as the
  controller informs the consumer of the extension within the initial
  forty-five-day response period, together with the reason for the extension;
elementType: control
