id: 05d212f3-9042-4de1-8f04-f8a5147341b6
externalId: "§ 482.59"
name: "Condition of participation: Obstetrical services."
description: "If the hospital offers obstetrical services, the services must be well organized and provided in accordance with nationally recognized acceptable standards of practice for the health care (including physical and behavioral health) of pregnant, birthing, and postpartum patients. If outpatient obstetrical services are offered, the services must be consistent in quality with inpatient care in accordance with the complexity of services offered."
elementType: condition
parent: subpart_d
