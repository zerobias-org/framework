id: defda9c0-346d-4b5d-b566-467f462f6fbc
externalId: "§ 482.26"
name: "Condition of participation: Radiologic services."
description: "The hospital must maintain, or have available, diagnostic radiologic services. If therapeutic services are also provided, they, as well as the diagnostic services, must meet professionally approved standards for safety and personnel qualifications."
elementType: condition
parent: subpart_c
