id: 70385535-91e9-4d40-bcf2-6ab86edb4bc7
externalId: "§ 482.21"
name: "Condition of participation: Quality assessment and performance improvement program."
description: "The hospital must develop, implement, and maintain an effective, ongoing, hospital-wide, data-driven quality assessment and performance improvement program. The hospital's governing body must ensure that the program reflects the complexity of the hospital's organization and services; involves all hospital departments and services (including those services furnished under contract or arrangement); and focuses on indicators related to improved health outcomes and the prevention and reduction of medical errors. The hospital must maintain and demonstrate evidence of its QAPI program for review by CMS."
elementType: condition
parent: subpart_c
