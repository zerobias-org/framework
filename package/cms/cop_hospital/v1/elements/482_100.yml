externalId: "§ 482.100"
name: "Condition of participation: Organ procurement."
description: "The transplant program must ensure that the hospital in which it operates has a written agreement for the receipt of organs with an OPO designated by the Secretary that identifies specific responsibilities for the hospital and for the OPO with respect to organ recovery and organ allocation."
elementType: condition
parent: subpart_e
