externalId: "§ 482.56"
name: "Condition of participation: Rehabilitation services."
description: "If the hospital provides rehabilitation, physical therapy, occupational therapy, audiology, or speech pathology services, the services must be organized and staffed to ensure the health and safety of patients."
elementType: condition
parent: subpart_d
