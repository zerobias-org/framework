externalId: "§ 482.61"
name: "Condition of participation: Special medical record requirements for psychiatric hospitals."
description: "The medical records maintained by a psychiatric hospital must permit determination of the degree and intensity of the treatment provided to individuals who are furnished services in the institution."
elementType: condition
parent: subpart_e
