id: 5e3c3d6e-fa24-4839-ae9a-fb2dbddc5a38
externalId: "§ 482.78"
name: "Condition of participation: Emergency preparedness for transplant programs."
description: "A transplant program must be included in the emergency preparedness planning and the emergency preparedness program as set forth in § 482.15 for the hospital in which it is located. However, a transplant program is not individually responsible for the emergency preparedness requirements set forth in § 482.15."
elementType: condition
parent: subpart_e
