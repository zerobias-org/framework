externalId: "§ 482.92"
name: "Condition of participation: Organ recovery and receipt."
description: "Transplant programs must have written protocols for validation of donor-recipient blood type and other vital data for the deceased organ recovery, organ receipt, and living donor organ transplantation processes. The transplanting surgeon at the transplant program is responsible for ensuring the medical suitability of donor organs for transplantation into the intended recipient."
elementType: condition
parent: subpart_e
