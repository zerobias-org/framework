name: "Condition of participation: Quality assessment and performance improvement (QAPI)."
description: "Transplant programs must develop, implement, and maintain a written, comprehensive, data-driven QAPI program designed to monitor and evaluate performance of all transplantation services, including services provided under contract or arrangement."
elementType: condition
parent: subpart_e
