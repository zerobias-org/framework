id: 1c7990ef-8ec8-4993-9846-a276cafb6992
externalId: "§ 482.60"
name: "Special provisions applying to psychiatric hospitals."
description: "Psychiatric hospital must— (a) Be primarily engaged in providing, by or under the supervision of a doctor of medicine or osteopathy, psychiatric services for the diagnosis and treatment of mentally ill persons; (b) Meet the conditions of participation specified in §§ 482.1 through 482.23 and §§ 482.25 through 482.57; (c) Maintain clinical records on all patients, including records sufficient to permit CMS to determine the degree and intensity of treatment furnished to Medicare beneficiaries, as specified in § 482.61; and (d) Meet the staffing requirements specified in § 482.62."
elementType: condition
parent: subpart_e
