id: d6746d2a-436e-4da7-a9a5-4f41afd0d9be
externalId: "§ 482.25"
name: "Condition of participation: Pharmaceutical services."
description: "The hospital must have pharmaceutical services that meet the needs of the patients. The institution must have a pharmacy directed by a registered pharmacist or a drug storage area under competent supervision. The medical staff is responsible for developing policies and procedures that minimize drug errors. This function may be delegated to the hospital's organized pharmaceutical service."
elementType: condition
parent: subpart_c
