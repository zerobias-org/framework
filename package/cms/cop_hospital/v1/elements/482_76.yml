externalId: "§ 482.76"
name: "Condition of participation: Pediatric Transplants."
description: "A transplant center that seeks Medicare approval to provide transplantation services to pediatric patients must submit to CMS a request specifically for Medicare approval to perform pediatric transplants using the procedures described at § 488.61 of this chapter."
elementType: condition
