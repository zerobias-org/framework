id: 8c55590e-1655-4bf6-b726-5d461e6c6be2
externalId: "§ 482.72"
name: "Condition of participation: OPTN membership."
description: "A transplant program must be located in a transplant hospital that is a member of and abides by the rules and requirements of the Organ Procurement and Transplantation Network (OPTN) established and operated in accordance with section 372 of the Public Health Service (PHS) Act (42 U.S.C. 274). The term “rules and requirements of the OPTN” means those rules and requirements approved by the Secretary pursuant to § 121.4 of this title. No hospital that provides transplantation services shall be deemed to be out of compliance with section 1138(a)(1)(B) of the Act or this section unless the Secretary has given the OPTN formal notice that he or she approves the decision to exclude the transplant hospital from the OPTN and also has notified the transplant hospital in writing."
elementType: condition
parent: subpart_e
