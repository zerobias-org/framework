id: 3f7615c6-e95d-4251-8022-23c8fa3d4213
externalId: "§ 482.68"
name: "Special requirement for transplant programs."
description: "A transplant program located within a hospital that has a Medicare provider agreement must meet the conditions of participation specified in §§ 482.72 through 482.104 in order to be granted approval from CMS to provide transplant services."
elementType: condition
parent: subpart_e
