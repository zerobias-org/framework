externalId: "§ 482.68"
name: "Special requirement for transplant programs."
description: "Requires a transplant program in a Medicare hospital to meet the transplant conditions of participation in sections 482.72 to 482.104 to be approved by CMS to provide transplant services."
elementType: condition
