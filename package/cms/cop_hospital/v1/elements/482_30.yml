id: 74ed19ea-a6af-48bb-85f3-9f084c96ae74
externalId: "§ 482.30"
name: "Condition of participation: Utilization review."
description: "The hospital must have in effect a utilization review (UR) plan that provides for review of services furnished by the institution and by members of the medical staff to patients entitled to benefits under the Medicare and Medicaid programs."
elementType: condition
parent: subpart_c
