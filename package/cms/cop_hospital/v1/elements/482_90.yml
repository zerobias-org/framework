externalId: "§ 482.90"
name: "Condition of participation: Patient and living donor selection."
description: "Requires a transplant program to use written criteria for selecting patients for the waiting list and for transplantation, and for selecting living donors when it performs living donor transplants."
elementType: condition
parent: subpart_e
