id: 33ebbd6f-4461-4208-8619-28c956663a44
externalId: "§ 482.90"
name: "Condition of participation: Patient and living donor selection."
description: "The transplant program must use written patient selection criteria in determining a patient's suitability for placement on the waiting list or a patient's suitability for transplantation. If a program performs living donor transplants, the program also must use written donor selection criteria in determining the suitability of candidates for donation."
elementType: condition
parent: subpart_e
