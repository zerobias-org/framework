externalId: "§ 482.27"
name: "Condition of participation: Laboratory services."
description: "The hospital must maintain, or have available, adequate laboratory services to meet the needs of its patients. The hospital must ensure that all laboratory services provided to its patients are performed in a facility certified in accordance with part 493 of this chapter."
elementType: condition
parent: subpart_c
