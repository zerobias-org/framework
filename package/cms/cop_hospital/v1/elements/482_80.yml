name: "Condition of participation: Data submission, clinical experience, and outcome requirements for initial approval of transplant programs."
description: "Except as specified in paragraph (d) of this section, and § 488.61 of this chapter, transplant programs must meet all data submission, clinical experience, and outcome requirements to be granted initial approval by CMS."
elementType: condition
