externalId: "§ 482.11"
name: "Condition of participation: Compliance with Federal, State and local laws."
description: "Requires the hospital to comply with applicable Federal laws on patient health and safety, to be licensed or State-approved, and to ensure its personnel are licensed or certified as required."
elementType: condition
