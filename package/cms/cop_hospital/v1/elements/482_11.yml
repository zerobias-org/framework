id: 54e2ae76-2037-49aa-b8c2-74e9ce643f02
externalId: "§ 482.11"
name: "Condition of participation: Compliance with Federal, State and local laws."
description: "(a) The hospital must be in compliance with applicable Federal laws related to the health and safety of patients. (b) The hospital must be— (1) Licensed; or (2) Approved as meeting standards for licensing established by the agency of the State or locality responsible for licensing hospitals. (c) The hospital must assure that personnel are licensed or meet other applicable standards that are required by State or local laws."
elementType: condition
parent: subpart_b
