id: 7df0d042-58af-4e59-a65d-b465c3075250
externalId: "§ 482.43"
name: "Condition of participation: Discharge planning."
description: "The hospital must have an effective discharge planning process that focuses on the patient's goals and treatment preferences and includes the patient and his or her caregivers/support person(s) as active partners in the discharge planning for post-discharge care. The discharge planning process and the discharge plan must be consistent with the patient's goals for care and his or her treatment preferences, ensure an effective transition of the patient from hospital to post-discharge care, and reduce the factors leading to preventable hospital readmissions."
elementType: condition
parent: subpart_c
