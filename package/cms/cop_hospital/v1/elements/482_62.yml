externalId: "§ 482.62"
name: "Condition of participation: Special staff requirements for psychiatric hospitals."
description: "The hospital must have adequate numbers of qualified professional and supportive staff to evaluate patients, formulate written, individualized comprehensive treatment plans, provide active treatment measures, and engage in discharge planning."
elementType: condition
parent: subpart_e
