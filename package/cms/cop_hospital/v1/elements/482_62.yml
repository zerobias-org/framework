id: 32bd57f8-9d37-4314-b733-6b5e40959310
externalId: "§ 482.62"
name: "Condition of participation: Special staff requirements for psychiatric hospitals."
description: "Requires a psychiatric hospital to have enough qualified staff, including a psychiatrist director, medical and nursing coverage, and psychological, social work and therapeutic activity services."
elementType: condition
parent: subpart_e
