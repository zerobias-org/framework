id: 58006d50-4652-4cad-a73b-15bac25502f7
externalId: "§ 482.94"
name: "Condition of participation: Patient and living donor management."
description: "Transplant programs must have written patient management policies for the transplant and discharge phases of transplantation. If a transplant program performs living donor transplants, the program also must have written donor management policies for the donor evaluation, donation, and discharge phases of living organ donation."
elementType: condition
parent: subpart_e
