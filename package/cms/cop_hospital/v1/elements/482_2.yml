id: 4063a625-c0a2-4635-8cfb-f0300a086d52
externalId: "§ 482.2"
name: "Provision of emergency services by nonparticipating hospitals."
description: "(a) The services of an institution that does not have an agreement to participate in the Medicare program may, nevertheless, be reimbursed under the program if— (1) The services are emergency services; and (2) The institution meets the requirements of section 1861(e) (1) through (5) and (7) of the Act. Rules applicable to emergency services furnished by nonparticipating hospitals are set forth in subpart G of part 424 of this chapter. (b) Section 440.170(e) of this chapter defines emergency hospital services for purposes of Medicaid reimbursement."
elementType: condition
parent: subpart_a
