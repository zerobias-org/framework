id: 5623d3c2-7712-4b6d-94a1-8ceb04fbd4eb
externalId: "§ 482.28"
name: "Condition of participation: Food and dietetic services."
description: "The hospital must have organized dietary services that are directed and staffed by adequate qualified personnel. However, a hospital that has a contract with an outside food management company may be found to meet this Condition of participation if the company has a dietitian who serves the hospital on a full-time, part-time, or consultant basis, and if the company maintains at least the minimum standards specified in this section and provides for constant liaison with the hospital medical staff for recommendations on dietetic policies affecting patient treatment."
elementType: condition
parent: subpart_c
