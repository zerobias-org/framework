id: 6dbb5f81-4dd8-4ca1-9599-169b29e7b4a8
externalId: "§ 482.42"
name: "Condition of participation: Infection prevention and control and antibiotic stewardship programs."
description: "The hospital must have active hospital-wide programs for the surveillance, prevention, and control of HAIs and other infectious diseases, and for the optimization of antibiotic use through stewardship. The programs must demonstrate adherence to nationally recognized infection prevention and control guidelines, as well as to best practices for improving antibiotic use where applicable, and for reducing the development and transmission of HAIs and antibiotic-resistant organisms. Infection prevention and control problems and antibiotic use issues identified in the programs must be addressed in collaboration with the hospital-wide quality assessment and performance improvement (QAPI) program."
elementType: condition
parent: subpart_c
