id: 3b721c5b-2db3-4b0b-b40e-0720ed0b7f1a
externalId: "§ 482.12"
name: "Condition of participation: Governing body."
description: "There must be an effective governing body that is legally responsible for the conduct of the hospital. If a hospital does not have an organized governing body, the persons legally responsible for the conduct of the hospital must carry out the functions specified in this part that pertain to the governing body."
elementType: condition
parent: subpart_b
