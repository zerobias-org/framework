id: a2446490-def0-42f4-9620-0017538bdf77
externalId: "§ 482.51"
name: "Condition of participation: Surgical services."
description: "If the hospital provides surgical services, the services must be well organized and provided in accordance with acceptable standards of practice. If outpatient surgical services are offered the services must be consistent in quality with inpatient care in accordance with the complexity of services offered."
elementType: condition
parent: subpart_d
