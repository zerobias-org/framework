id: a4e847c1-cd9c-475c-a689-234b45101653
externalId: "§ 482.52"
name: "Condition of participation: Anesthesia services."
description: "If the hospital furnishes anesthesia services, they must be provided in a well-organized manner under the direction of a qualified doctor of medicine or osteopathy. The service is responsible for all anesthesia administered in the hospital."
elementType: condition
parent: subpart_d
