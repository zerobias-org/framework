id: 551b0207-33d7-4c88-a15e-585f532978c3
externalId: 8(2)
name: 8(2)
description: A data protection assessment shall identify and weigh how
  processing personal data may directly or indirectly benefit the controller,
  the consumer, other stakeholders and the public against potential risks to the
  consumer, taking into account how safeguards the controller employs can
  mitigate the risks. In conducting the assessment, the controller shall
  consider how deidentified data might reduce risks, the reasonable expectations
  of consumers, the context in which the data is processed and the relationship
  between the controller and the consumers whose personal data the controller
  will process.
elementType: control
