id: c92089aa-8578-44e5-90f8-64c1a634fb9b
externalId: Section 4(6)(d)
name: Section 4(6)(d)
description: Require the controller to approve or deny the appeal within 45 days
  after the date on which the controller received the appeal and to notify the
  consumer in writing of the controller’s decision and the reasons for the
  decision. If the controller denies the appeal, the notice must provide or
  specify information that enables the consumer to contact the Attorney General
  to submit a complaint.
elementType: control
