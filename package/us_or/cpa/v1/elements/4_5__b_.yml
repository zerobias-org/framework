id: 994af43a-6d4a-406f-857f-65ef889a6b62
externalId: 4(5)(b)
name: 4(5)(b)
description: Notify the consumer without undue delay and not later than 45 days
  after receiving the consumer’s request if the controller declines to take
  action on the request. The controller in the notice shall explain the
  justification for not taking action and include instructions for appealing the
  controller’s decision.
elementType: control
