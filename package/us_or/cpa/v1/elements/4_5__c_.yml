id: d55281eb-8cc2-46ae-8ca2-4e018dac1d30
externalId: 4(5)(c)
name: 4(5)(c)
description: Provide information the consumer requests once during any 12-month
  period without charge to the consumer. A controller may charge a reasonable
  fee to cover the administrative costs of complying with a second or subsequent
  request within the 12-month period, unless the purpose of the second or
  subsequent request is to verify that the controller corrected inaccuracies in,
  or deleted, the consumer’s personal data in compliance with the consumer’s
  request.
elementType: control
