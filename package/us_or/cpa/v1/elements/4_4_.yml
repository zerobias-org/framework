id: 9c1e5a61-8e2f-4a6b-bb21-6abdd8755bde
externalId: 4(4)
name: 4(4)
description: A consumer may designate another person to act on the consumer’s
  behalf as the consumer’s authorized agent for the purpose of opting out of a
  controller’s processing of the consumer’s personal data, as provided in
  section 3 (1)(d) of this 2023 Act. The consumer may designate an authorized
  agent by means of an internet link, browser setting, browser extension, global
  device setting or other technology that enables the consumer to opt out of the
  controller’s processing of the consumer’s personal data. A controller shall
  comply with an opt-out request the controller receives from an authorized
  agent if the controller can verify, with commercially reasonable effort, the
  identity of the consumer and the authorized agent’s authority to act on the
  consumer’s behalf.
elementType: control
