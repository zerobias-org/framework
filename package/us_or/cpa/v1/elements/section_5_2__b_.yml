externalId: Section 5(2)(b)
name: Section 5(2)(b)
description: Process sensitive data about a consumer without first obtaining the
  consumer’s consent or, if the controller knows the consumer is a child,
  without processing the sensitive data in accordance with the Children’s Online
  Privacy Protection Act of 1998, 15 U.S.C. 6501 et seq. and the regulations,
  rules and guidance adopted under the Act, all as in effect on the effective
  date of this 2023 Act;
elementType: control
