id: ae351925-1214-4cf9-922f-2bfe680be7c7
externalId: Section 3(2)
name: Section 3(2)
description: A controller that provides a copy of personal data to a consumer
  under subsection (1)(a)(C) of this section shall provide the personal data in
  a portable and, to the extent technically feasible, readily usable format that
  allows the consumer to transmit the personal data to another person without
  hindrance.
elementType: control
