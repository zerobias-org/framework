id: 367a2220-6920-439a-b800-6f890c0f4369
externalId: Section 7(1)(b)
name: Section 7(1)(b)
description: A controller that discloses deidentified data shall exercise
  reasonable oversight to monitor compliance with any contractual commitments to
  which the deidentified data is subject and shall take appropriate steps to
  address any breaches of the contractual commitments.
elementType: control
