id: f1807a88-32b3-42ab-978a-b0ad0641afd7
externalId: Section 4(5)(a)
name: Section 4(5)(a)
description: Respond to a request from a consumer without undue delay and not
  later than 45 days after receiving the request. The controller may extend the
  period within which the controller responds by an additional 45 days if the
  extension is reasonably necessary to comply with the consumer’s request,
  taking into consideration the complexity of the request and the number of
  requests the consumer makes. A controller that intends to extend the period
  for responding shall notify the consumer within the initial 45-day response
  period and explain the reason for the extension.
elementType: control
