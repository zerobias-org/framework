id: 630301c8-bf66-4b93-ad15-422e46d9555d
externalId: Section 4(5)(d)
name: Section 4(5)(d)
description: Notify the consumer if the controller cannot, using commercially
  reasonable methods, authenticate the consumer’s request without additional
  information from the consumer. A controller that sends a notification under
  this paragraph does not have to comply with the request until the consumer
  provides the information necessary to authenticate the request.
elementType: control
