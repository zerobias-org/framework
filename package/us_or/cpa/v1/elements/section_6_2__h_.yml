id: f2ab1eb1-9bd7-4f17-947c-23b04e07f2da
externalId: Section 6(2)(h)
name: Section 6(2)(h)
description: Allow the controller, the controller’s designee or a qualified and
  independent person the processor engages, in accordance with an appropriate
  and accepted control standard, framework or procedure, to assess the
  processor’s policies and technical and organizational measures for complying
  with the processor’s obligations under sections 1 to 9 of this 2023 Act, and
  require the processor to cooperate with the assessment and, at the
  controller’s request, report the results of the assessment to the controller.
elementType: control
