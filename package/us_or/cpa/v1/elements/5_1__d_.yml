id: d4aeba31-b10b-473b-8309-39fb0a0db138
externalId: 5(1)(d)
name: 5(1)(d)
description: Provide an effective means by which a consumer may revoke consent a
  consumer gave under sections 1 to 9 of this 2023 Act to the controller’s
  processing of the consumer’s personal data. The means must be at least as easy
  as the means by which the consumer provided consent. Once the consumer revokes
  consent, the controller shall cease processing the personal data as soon as is
  practicable, but not later than 15 days after receiving the revocation.
elementType: control
