id: 9f724f85-59c9-41ad-be73-a4e2ce25a769
externalId: Section 5(2)(c)
name: Section 5(2)(c)
description: Process a consumer’s personal data for the purposes of targeted
  advertising, of profiling the consumer in furtherance of decisions that
  produce legal effects or effects of similar significance or of selling the
  consumer’s personal data without the consumer’s consent if the controller has
  actual knowledge that, or willfully disregards whether, the consumer is at
  least 13 years of age and not older than 15 years of age; or
elementType: control
