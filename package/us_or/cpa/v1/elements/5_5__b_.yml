id: a5c56541-d283-4147-8462-aec3d924cd2a
externalId: 5(5)(b)
name: 5(5)(b)
description: Provide a clear and conspicuous link to a webpage where the
  consumer or an authorized agent may opt out from a controller’s processing of
  the consumer’s personal data as described in section 3 (1)(d) of this 2023 Act
  or, solely if the controller does not have a capacity needed for linking to a
  webpage, provide another method the consumer can use to opt out.
elementType: control
