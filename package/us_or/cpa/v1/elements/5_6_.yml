id: 1da40941-3d6c-4b0b-bf8a-a5ab6154a628
externalId: 5(6)
name: 5(6)
description: If a consumer or authorized agent uses a method described in
  subsection (5) of this section to opt out of a controller’s processing of the
  consumer’s personal data under section 3 (1)(d) of this 2023 Act and the
  decision conflicts with a consumer’s voluntary participation in a bona fide
  reward, club card or loyalty program or a program that provides premium
  features or discounts in return for the consumer’s consent to the controller’s
  processing of the consumer’s personal data, the controller may either comply
  with the request to opt out or notify the consumer of the conflict and ask the
  consumer to affirm that the consumer intends to withdraw from the bona fide
  reward, club card or loyalty program or the program that provides premium
  features or discounts. If the consumer affirms that the consumer intends to
  withdraw, the controller shall comply with the request to opt out.
elementType: control
