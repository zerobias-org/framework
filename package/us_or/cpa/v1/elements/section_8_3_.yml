id: feba3a6b-0449-4e14-889f-1b5f36c6a480
externalId: Section 8(3)
name: Section 8(3)
description: The Attorney General may require a controller to provide to the
  Attorney General any data protection assessments the controller has conducted
  if the data protection assessment is relevant to an investigation the Attorney
  General conducts under section 9 of this 2023 Act. The Attorney General may
  evaluate a data protection assessment for the controller’s compliance with the
  requirements of section 1 to 9 of this 2023 Act. If a data protection
  assessment the Attorney General obtains under this subsection includes
  information that is subject to attorney-client privilege or is work product
  that is subject to a privilege, the controller’s provision of the data
  protection assessment does not waive the privilege.
elementType: control
