id: ca5b7fab-6df0-483c-9fbb-e286a4847d79
externalId: Section 4(5)(e)(B)
name: Section 4(5)(e)(B)
description: A controller may deny a request to opt out if the controller has a
  good-faith, reasonable and documented belief that the request is fraudulent.
  If the controller denies a request under this subparagraph, the controller
  shall notify the consumer that the controller believes the request is
  fraudulent, stating in the notice that the controller will not comply with the
  request.
elementType: control
