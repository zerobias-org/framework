externalId: 5(1)(c)
name: 5(1)(c)
description: Establish, implement and maintain for personal data the same
  safeguards described in ORS 646A.622 that are required for protecting personal
  information, as defined in ORS 646A.602, such that the controller’s safeguards
  protect the confidentiality, integrity and accessibility of the personal data
  to the extent appropriate for the volume and nature of the personal data; and
elementType: control
