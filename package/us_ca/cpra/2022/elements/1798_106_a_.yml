id: 796eb3fe-2f56-4d7f-ad10-3b1c4e70739b
externalId: 1798.106(a)
name: 1798.106(a)
description: A consumer shall have the right to request a business that
  maintains inaccurate personal information about the consumer to correct that
  inaccurate personal information, taking into account the nature of the
  personal information and the purposes of the processing of the personal
  information.
elementType: control
