id: 26c434a9-752b-434a-bc49-4fe90f9cdd43
externalId: 1798.100(a)(3)
name: 1798.100(a)(3)
description: The length of time the business intends to retain each category of
  personal information, including sensitive personal information, or if that is
  not possible, the criteria used to determine that period provided that a
  business shall not retain a consumer’s personal information or sensitive
  personal information for each disclosed purpose for which the personal
  information was collected for longer than is reasonably necessary for that
  disclosed purpose.
elementType: control
