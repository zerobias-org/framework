name: 1798.130(a)(1)(B)
description: If the business maintains an internet website, make the internet
  website available to consumers to submit requests for information required to
  be disclosed pursuant to Sections 1798.110 and 1798.115, or requests for
  deletion or correction pursuant to Sections 1798.105 and 1798.106,
  respectively.
