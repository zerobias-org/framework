id: c044a73c-3a3a-46e1-9b37-d8034c2c726e
externalId: 1798.120(c)
name: 1798.120(c)
description: Notwithstanding subdivision (a), a business shall not sell or share
  the personal information of consumers if the business has actual knowledge
  that the consumer is less than 16 years of age, unless the consumer, in the
  case of consumers at least 13 years of age and less than 16 years of age, or
  the consumer’s parent or guardian, in the case of consumers who are less than
  13 years of age, has affirmatively authorized the sale or sharing of the
  consumer’s personal information. A business that willfully disregards the
  consumer’s age shall be deemed to have had actual knowledge of the consumer’s
  age.
elementType: control
