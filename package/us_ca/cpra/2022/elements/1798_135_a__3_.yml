id: 367e6ad5-1ce8-4b18-9bda-ca738c2d639e
externalId: 1798.135(a)(3)
name: 1798.135(a)(3)
description: At the business’ discretion, utilize a single, clearly labeled link
  on the business’ internet homepages, in lieu of complying with paragraphs (1)
  and (2), if that link easily allows a consumer to opt out of the sale or
  sharing of the consumer’s personal information and to limit the use or
  disclosure of the consumer’s sensitive personal information.
elementType: control
