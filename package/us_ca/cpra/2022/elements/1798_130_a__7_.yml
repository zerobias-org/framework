id: eae93ab3-fa0b-4acf-84dc-4f8f578f3fb3
externalId: 1798.130(a)(7)
name: 1798.130(a)(7)
description: Use any personal information collected from the consumer in
  connection with the business’ verification of the consumer’s request solely
  for the purposes of verification and shall not further disclose the personal
  information, retain it longer than necessary for purposes of verification, or
  use it for unrelated purposes.
elementType: control
