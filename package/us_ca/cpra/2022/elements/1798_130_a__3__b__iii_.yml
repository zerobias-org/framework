id: 04b80130-07be-428a-9fc2-7b9965c003c9
externalId: 1798.130(a)(3)(B)(iii)
name: 1798.130(a)(3)(B)(iii)
description: Provide the specific pieces of personal information obtained from
  the consumer in a format that is easily understandable to the average
  consumer, and to the extent technically feasible, in a structured, commonly
  used, machine-readable format that may also be transmitted to another entity
  at the consumer’s request without hindrance. “Specific pieces of information”
  do not include data generated to help ensure security and integrity or as
  prescribed by regulation. Personal information is not considered to have been
  disclosed by a business when a consumer instructs a business to transfer the
  consumer’s personal information from one business to another in the context of
  switching services.
elementType: control
