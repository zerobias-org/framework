externalId: 1798.106(c)
name: 1798.106(c)
description: A business that receives a verifiable consumer request to correct
  inaccurate personal information shall use commercially reasonable efforts to
  correct the inaccurate personal information as directed by the consumer,
  pursuant to Section 1798.130 and regulations adopted pursuant to paragraph (7)
  of subdivision (a) of Section 1798.185.
elementType: control
