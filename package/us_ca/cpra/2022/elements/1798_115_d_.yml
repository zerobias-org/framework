id: a4d5187d-68e8-4584-9708-51532ebd6b9a
externalId: 1798.115(d)
name: 1798.115(d)
description: A third party shall not sell or share personal information about a
  consumer that has been sold to, or shared with, the third party by a business
  unless the consumer has received explicit notice and is provided an
  opportunity to exercise the right to opt-out pursuant to Section 1798.120.
elementType: control
