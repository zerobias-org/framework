id: 5dab9c8e-8d02-4f26-8e5e-22bafc6e1d4e
externalId: 1798.105(c)(1)
name: 1798.105(c)(1)
description: A business that receives a verifiable consumer request from a
  consumer to delete the consumer’s personal information pursuant to subdivision
  (a) of this section shall delete the consumer’s personal information from its
  records, notify any service providers or contractors to delete the consumer’s
  personal information from their records, and notify all third parties to whom
  the business has sold or shared the personal information to delete the
  consumer’s personal information unless this proves impossible or involves
  disproportionate effort.
elementType: control
