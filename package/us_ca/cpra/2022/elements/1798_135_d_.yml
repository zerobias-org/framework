id: 4500ab3d-9dc4-4374-aa78-1f4a2685efdd
externalId: 1798.135(d)
name: 1798.135(d)
description: Nothing in this title shall be construed to require a business to
  comply with the title by including the required links and text on the homepage
  that the business makes available to the public generally, if the business
  maintains a separate and additional homepage that is dedicated to California
  consumers and that includes the required links and text, and the business
  takes reasonable steps to ensure that California consumers are directed to the
  homepage for California consumers and not the homepage made available to the
  public generally.
elementType: control
