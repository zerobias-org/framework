id: 6f592a09-2eb1-40bb-9395-c75a7a7a1a6f
externalId: 1798.130(a)(2)(A)
name: 1798.130(a)(2)(A)
description: Disclose and deliver the required information to a consumer free of
  charge, correct inaccurate personal information, or delete a consumer’s
  personal information, based on the consumer’s request, within 45 days of
  receiving a verifiable consumer request from the consumer. The business shall
  promptly take steps to determine whether the request is a verifiable consumer
  request, but this shall not extend the business’ duty to disclose and deliver
  the information, to correct inaccurate personal information, or to delete
  personal information within 45 days of receipt of the consumer’s request. The
  time period to provide the required information, to correct inaccurate
  personal information, or to delete personal information may be extended once
  by an additional 45 days when reasonably necessary, provided the consumer is
  provided notice of the extension within the first 45-day period. The
  disclosure of the required information shall be made in writing and delivered
  through the consumer’s account with the business, if the consumer maintains an
  account with the business, or by mail or electronically at the consumer’s
  option if the consumer does not maintain an account with the business, in a
  readily useable format that allows the consumer to transmit this information
  from one entity to another entity without hindrance. The business may require
  authentication of the consumer that is reasonable in light of the nature of
  the personal information requested, but shall not require the consumer to
  create an account with the business in order to make a verifiable consumer
  request provided that if the consumer, has an account with the business, the
  business may require the consumer to use that account to submit a verifiable
  consumer request.
elementType: control
