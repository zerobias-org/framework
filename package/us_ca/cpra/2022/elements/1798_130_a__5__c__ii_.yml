externalId: 1798.130(a)(5)(C)(ii)
name: 1798.130(a)(5)(C)(ii)
description: A list of the categories of personal information it has disclosed
  about consumers for a business purpose in the preceding 12 months by reference
  to the enumerated category in subdivision (c) that most closely describes the
  personal information disclosed, or if the business has not disclosed
  consumers’ personal information for a business purpose in the preceding 12
  months, the business shall disclose that fact.
elementType: control
