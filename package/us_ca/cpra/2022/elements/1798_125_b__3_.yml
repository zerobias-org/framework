id: b8ee8568-4718-4886-9a83-1acb972bbaa4
externalId: 1798.125(b)(3)
name: 1798.125(b)(3)
description: A business may enter a consumer into a financial incentive program
  only if the consumer gives the business prior opt-in consent pursuant to
  Section 1798.130 that clearly describes the material terms of the financial
  incentive program, and which may be revoked by the consumer at any time. If a
  consumer refuses to provide opt-in consent, then the business shall wait for
  at least 12 months before next requesting that the consumer provide opt-in
  consent, or as prescribed by regulations adopted pursuant to Section 1798.185.
elementType: control
