id: aefb7ad2-e7e3-4555-a02c-ad4ebac5acc6
externalId: 1798.100(b)
name: 1798.100(b)
description: A business that, acting as a third party, controls the collection
  of personal information about a consumer may satisfy its obligation under
  subdivision (a) by providing the required information prominently and
  conspicuously on the homepage of its internet website. In addition, if a
  business acting as a third party controls the collection of personal
  information about a consumer on its premises, including in a vehicle, then the
  business shall, at or before the point of collection, inform consumers as to
  the categories of personal information to be collected and the purposes for
  which the categories of personal information are used, and whether that
  personal information is sold, in a clear and conspicuous manner at the
  location.
elementType: control
