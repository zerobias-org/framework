id: f1fec87a-6dd7-4cd6-a91a-cda15b5af963
externalId: 1798.100(a)(2)
name: 1798.100(a)(2)
description: If the business collects sensitive personal information, the
  categories of sensitive personal information to be collected and the purposes
  for which the categories of sensitive personal information are collected or
  used, and whether that information is sold or shared. A business shall not
  collect additional categories of sensitive personal information or use
  sensitive personal information collected for additional purposes that are
  incompatible with the disclosed purpose for which the sensitive personal
  information was collected without providing the consumer with notice
  consistent with this section.
elementType: control
