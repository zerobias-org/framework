id: bd13f641-45e6-4d91-b3f9-a0152fc091dd
externalId: 1798.130(a)(1)(A)
name: 1798.130(a)(1)(A)
description: Make available to consumers two or more designated methods for
  submitting requests for information required to be disclosed pursuant to
  Sections 1798.110 and 1798.115, or requests for deletion or correction
  pursuant to Sections 1798.105 and 1798.106, respectively, including, at a
  minimum, a toll-free telephone number. A business that operates exclusively
  online and has a direct relationship with a consumer from whom it collects
  personal information shall only be required to provide an email address for
  submitting requests for information required to be disclosed pursuant to
  Sections 1798.110 and 1798.115, or for requests for deletion or correction
  pursuant to Sections 1798.105 and 1798.106, respectively.
elementType: control
