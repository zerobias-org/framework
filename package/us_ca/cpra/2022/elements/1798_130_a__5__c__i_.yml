externalId: 1798.130(a)(5)(C)(i)
name: 1798.130(a)(5)(C)(i)
description: A list of the categories of personal information it has sold or
  shared about consumers in the preceding 12 months by reference to the
  enumerated category or categories in subdivision (c) that most closely
  describe the personal information sold or shared, or if the business has not
  sold or shared consumers’ personal information in the preceding 12 months, the
  business shall prominently disclose that fact in its privacy policy.
elementType: control
