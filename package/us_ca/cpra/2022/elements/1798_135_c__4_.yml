id: 34c143f3-46a9-40dc-b30b-36886839a15c
externalId: 1798.135(c)(4)
name: 1798.135(c)(4)
description: For consumers who exercise their right to opt out of the sale or
  sharing of their personal information or limit the use or disclosure of their
  sensitive personal information, refrain from selling or sharing the consumer’s
  personal information or using or disclosing the consumer’s sensitive personal
  information and wait for at least 12 months before requesting that the
  consumer authorize the sale or sharing of the consumer’s personal information
  or the use and disclosure of the consumer’s sensitive personal information for
  additional purposes, or as authorized by regulations.
elementType: control
