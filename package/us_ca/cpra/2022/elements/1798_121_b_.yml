id: 236410e1-dd1d-4b19-a292-7d06ddf0c788
externalId: 1798.121(b)
name: 1798.121(b)
description: A business that has received direction from a consumer not to use
  or disclose the consumer’s sensitive personal information, except as
  authorized by subdivision (a), shall be prohibited, pursuant to paragraph (4)
  of subdivision (c) of Section 1798.135, from using or disclosing the
  consumer’s sensitive personal information for any other purpose after its
  receipt of the consumer’s direction unless the consumer subsequently provides
  consent for the use or disclosure of the consumer’s sensitive personal
  information for additional purposes.
elementType: control
