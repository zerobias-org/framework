id: 42b64ffc-3a2e-416d-9e64-8bcd6fa44c32
externalId: 1798.135(b)(2)
name: 1798.135(b)(2)
description: "A business that allows consumers to opt out of the sale or sharing
  of their personal information and to limit the use of their sensitive personal
  information pursuant to paragraph (1) may provide a link to a web page that
  enables the consumer to consent to the business ignoring the opt-out
  preference signal with respect to that business’ sale or sharing of the
  consumer’s personal information or the use of the consumer’s sensitive
  personal information for additional purposes provided that:"
elementType: control
