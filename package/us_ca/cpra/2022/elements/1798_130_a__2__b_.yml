id: cf4ebd63-079b-4c11-812b-5c5c4c5e0460
externalId: 1798.130(a)(2)(B)
name: 1798.130(a)(2)(B)
description: The disclosure of the required information shall cover the 12-month
  period preceding the business’ receipt of the verifiable consumer request
  provided that, upon the adoption of a regulation pursuant to paragraph (8) of
  subdivision (a) of Section 1798.185, a consumer may request that the business
  disclose the required information beyond the 12-month period, and the business
  shall be required to provide that information unless doing so proves
  impossible or would involve a disproportionate effort. A consumer’s right to
  request required information beyond the 12-month period, and a business’
  obligation to provide that information, shall only apply to personal
  information collected on or after January 1, 2022. Nothing in this
  subparagraph shall require a business to keep personal information for any
  length of time.
elementType: control
