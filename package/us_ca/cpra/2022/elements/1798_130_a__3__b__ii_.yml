id: 2f12c157-b604-44d2-94be-1f481acad22a
externalId: 1798.130(a)(3)(B)(ii)
name: 1798.130(a)(3)(B)(ii)
description: Identify by category or categories the personal information
  collected about the consumer for the applicable period of time by reference to
  the enumerated category or categories in subdivision (c) that most closely
  describes the personal information collected; the categories of sources from
  which the consumer’s personal information was collected; the business or
  commercial purpose for collecting, selling, or sharing the consumer’s personal
  information; and the categories of third parties to whom the business
  discloses the consumer’s personal information.
elementType: control
