id: daa19050-9792-48bc-81ac-ad0d9816b04a
externalId: 1798.130(a)(4)(B)
name: 1798.130(a)(4)(B)
description: Identify by category or categories the personal information of the
  consumer that the business sold or shared during the applicable period of time
  by reference to the enumerated category in subdivision (c) that most closely
  describes the personal information, and provide the categories of third
  parties to whom the consumer’s personal information was sold or shared during
  the applicable period of time by reference to the enumerated category or
  categories in subdivision (c) that most closely describes the personal
  information sold or shared. The business shall disclose the information in a
  list that is separate from a list generated for the purposes of subparagraph
  (C).
elementType: control
