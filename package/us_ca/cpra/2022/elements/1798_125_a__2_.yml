id: f9915002-c603-45f6-8679-34d34dfaeacc
externalId: 1798.125(a)(2)
name: 1798.125(a)(2)
description: Nothing in this subdivision prohibits a business, pursuant to
  subdivision (b), from charging a consumer a different price or rate, or from
  providing a different level or quality of goods or services to the consumer,
  if that difference is reasonably related to the value provided to the business
  by the consumer’s data.
elementType: control
