id: 7365ab28-8434-4e4f-b5e0-2abc413e7c0e
externalId: 1798.115(b)
name: 1798.115(b)
description: A business that sells or shares personal information about a
  consumer, or that discloses a consumer’s personal information for a business
  purpose, shall disclose, pursuant to paragraph (4) of subdivision (a) of
  Section 1798.130, the information specified in subdivision (a) to the consumer
  upon receipt of a verifiable consumer request from the consumer.
elementType: control
