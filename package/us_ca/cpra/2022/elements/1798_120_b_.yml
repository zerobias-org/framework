id: 46f7dfeb-cb73-46f6-8543-ea98409ed864
externalId: 1798.120(b)
name: 1798.120(b)
description: A business that sells consumers’ personal information to, or shares
  it with, third parties shall provide notice to consumers, pursuant to
  subdivision (a) of Section 1798.135, that this information may be sold or
  shared and that consumers have the “right to opt-out” of the sale or sharing
  of their personal information.
elementType: control
