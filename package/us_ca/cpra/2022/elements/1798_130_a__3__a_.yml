id: 4b0fa192-8683-43b5-960e-34238df12329
externalId: 1798.130(a)(3)(A)
name: 1798.130(a)(3)(A)
description: A business that receives a verifiable consumer request pursuant to
  Section 1798.110 or 1798.115 shall disclose any personal information it has
  collected about a consumer, directly or indirectly, including through or by a
  service provider or contractor, to the consumer. A service provider or
  contractor shall not be required to comply with a verifiable consumer request
  received directly from a consumer or a consumer’s authorized agent, pursuant
  to Section 1798.110 or 1798.115, to the extent that the service provider or
  contractor has collected personal information about the consumer in its role
  as a service provider or contractor. A service provider or contractor shall
  provide assistance to a business with which it has a contractual relationship
  with respect to the business’ response to a verifiable consumer request,
  including, but not limited to, by providing to the business the consumer’s
  personal information in the service provider or contractor’s possession, which
  the service provider or contractor obtained as a result of providing services
  to the business, and by correcting inaccurate information or by enabling the
  business to do the same. A service provider or contractor that collects
  personal information pursuant to a written contract with a business shall be
  required to assist the business through appropriate technical and
  organizational measures in complying with the requirements of subdivisions (d)
  to (f), inclusive, of Section 1798.100, taking into account the nature of the
  processing.
elementType: control
