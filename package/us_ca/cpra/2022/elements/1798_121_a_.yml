externalId: 1798.121(a)
name: 1798.121(a)
description: A consumer shall have the right, at any time, to direct a business
  that collects sensitive personal information about the consumer to limit its
  use of the consumer’s sensitive personal information to that use which is
  necessary to perform the services or provide the goods reasonably expected by
  an average consumer who requests those goods or services, to perform the
  services set forth in paragraphs (2), (4), (5), and (8) of subdivision (e) of
  Section 1798.140, and as authorized by regulations adopted pursuant to
  subparagraph (C) of paragraph (18) of subdivision (a) of Section 1798.185. A
  business that uses or discloses a consumer’s sensitive personal information
  for purposes other than those specified in this subdivision shall provide
  notice to consumers, pursuant to subdivision (a) of Section 1798.135, that
  this information may be used, or disclosed to a service provider or
  contractor, for additional, specified purposes and that consumers have the
  right to limit the use or disclosure of their sensitive personal information.
elementType: control
