id: ff2b2fa6-d72b-4bab-8654-a924a427f607
externalId: 1798.120(d)
name: 1798.120(d)
description: A business that has received direction from a consumer not to sell
  or share the consumer’s personal information or, in the case of a minor
  consumer’s personal information has not received consent to sell or share the
  minor consumer’s personal information, shall be prohibited, pursuant to
  paragraph (4) of subdivision (c) of Section 1798.135, from selling or sharing
  the consumer’s personal information after its receipt of the consumer’s
  direction, unless the consumer subsequently provides consent, for the sale or
  sharing of the consumer’s personal information.
elementType: control
