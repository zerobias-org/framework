id: 072f2c9d-cb9d-4139-bba8-03a590ad6618
externalId: 1798.105(c)(3)
name: 1798.105(c)(3)
description: A service provider or contractor shall cooperate with the business
  in responding to a verifiable consumer request, and at the direction of the
  business, shall delete, or enable the business to delete and shall notify any
  of its own service providers or contractors to delete personal information
  about the consumer collected, used, processed, or retained by the service
  provider or the contractor. The service provider or contractor shall notify
  any service providers, contractors, or third parties who may have accessed
  personal information from or through the service provider or contractor,
  unless the information was accessed at the direction of the business, to
  delete the consumer’s personal information unless this proves impossible or
  involves disproportionate effort. A service provider or contractor shall not
  be required to comply with a deletion request submitted by the consumer
  directly to the service provider or contractor to the extent that the service
  provider or contractor has collected, used, processed, or retained the
  consumer’s personal information in its role as a service provider or
  contractor to the business.
elementType: control
