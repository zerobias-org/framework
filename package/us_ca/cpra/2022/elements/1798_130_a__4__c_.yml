id: bcb3d254-3445-4c6f-b067-77cda6196de1
externalId: 1798.130(a)(4)(C)
name: 1798.130(a)(4)(C)
description: Identify by category or categories the personal information of the
  consumer that the business disclosed for a business purpose during the
  applicable period of time by reference to the enumerated category or
  categories in subdivision (c) that most closely describes the personal
  information, and provide the categories of persons to whom the consumer’s
  personal information was disclosed for a business purpose during the
  applicable period of time by reference to the enumerated category or
  categories in subdivision (c) that most closely describes the personal
  information disclosed. The business shall disclose the information in a list
  that is separate from a list generated for the purposes of subparagraph (B).
elementType: control
