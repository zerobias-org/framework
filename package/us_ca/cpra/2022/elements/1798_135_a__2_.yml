id: 90db8d05-9490-4b21-9960-9189065970f1
externalId: 1798.135(a)(2)
name: 1798.135(a)(2)
description: >-
  Provide a clear and conspicuous link on the business’ internet homepages,
  titled “Limit the Use of My Sensitive Personal Information,” that enables a
  consumer, or a person authorized by the consumer, to limit the use or
  disclosure of the consumer’s sensitive personal information to those uses
  authorized by subdivision (a) of Section

  1798.121.
elementType: control
