id: fbd51a98-d06a-47b3-8784-0c4bd6f6be74
externalId: 1798.125(b)(1)
name: 1798.125(b)(1)
description: A business may offer financial incentives, including payments to
  consumers as compensation, for the collection of personal information, the
  sale or sharing of personal information, or the retention of personal
  information. A business may also offer a different price, rate, level, or
  quality of goods or services to the consumer if that price or difference is
  reasonably related to the value provided to the business by the consumer’s
  data.
elementType: control
