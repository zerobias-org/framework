id: 94f8a1c8-b829-4420-9258-cc5f2676b940
externalId: 3.3.1
name: Situational Awareness
description: Each entity must possess the internal capacity to monitor the
  constant state of its own information assets and an overall awareness of its
  surrounding environment. This includes the ability to detect internal
  cybersecurity incidents, and taking into account any threat, warning, or
  incident-related information received from external sources.
elementType: control
