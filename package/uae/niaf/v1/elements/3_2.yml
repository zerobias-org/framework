id: a9d6e8c0-5d76-4cad-82d4-ff705ab80b48
externalId: "3.2"
name: Integrated Security
description: Based on the results of the risk assessment, the individual
  entities must document how identified risks will be mitigated. As a minimum,
  this includes clearly identifying an integrated set of logical, physical, and
  personnel security controls to be implemented and the underlying rationale for
  a control selection based on a cost-benefit analysis.
elementType: control
