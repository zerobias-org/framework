id: 84679f50-8960-47c9-9e42-8b31a219b152
externalId: "3.4"
name: Business Continuity
description: As a result of the business impact analysis, each entity should
  identify which information assets are the most crucial to the normal
  functioning of business. Each entity must ensure that these critical business
  functions will be available to customers, suppliers, and other actors as
  needed, including during significant cybersecurity events or other incidents
  (e.g. natural disasters) that might impact availability of these critical
  information assets. Business continuity is not only implemented at the time of
  a disaster but requires the performance of daily activities to maintain
  service, consistency, and recoverability.
elementType: control
