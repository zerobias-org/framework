externalId: "3.3"
name: Incident Management
description: To minimize the impact of cybersecurity incidents, each entity must
  have the capacity to monitor its own information assets, identify and manage
  cybersecurity incidents, and escalate incidents to a sector or national level
  taking into account and utilizing as appropriate the National Incident
  Management Capability established by NESA.
elementType: control
