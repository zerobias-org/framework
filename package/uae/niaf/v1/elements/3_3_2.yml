id: c05d60df-14de-4b1c-875e-f1c22b98fb5b
externalId: 3.3.2
name: Entity Incident Response
description: "Each entity must develop an internal incident response capability
  that minimizes the impact of internal incidents or incidents arising from
  other entities that could affect them directly or indirectly.\r

  \r

  The national framework for cybersecurity incident management, as well as other
  NESA’s issuances, define these minimum capabilities to be put in place by the
  critical entities."
elementType: control
