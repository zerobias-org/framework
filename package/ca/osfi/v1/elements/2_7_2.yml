id: 14a95429-14df-47ff-8475-cc558d3fe657
externalId: 2.7.2
name: Incident management process is clear, responsive and risk-based
description: "FRFIs should implement processes and procedures for managing
  technology incidents; elements may include:\r

  \r

  Defining and documenting roles and responsibilities of relevant internal and
  external parties to support effective incident response;\r

  Establishing early warning indicators or triggers of system disruption (i.e.,
  detection) that are informed by ongoing threat assessment and risk
  surveillance activities;\r

  Identifying and classifying incidents according to priority, based on their
  impacts on business services;\r

  Developing and implementing incident response procedures that mitigate the
  impacts of incidents, including internal and external communication actions
  that contain escalation and notification triggers and processes;\r

  Performing periodic testing and exercises using plausible scenarios in order
  to identify and remedy gaps in incident response actions and capabilities;\r

  Conducting periodic exercises and testing of incident management process,
  playbooks, and other response tools (e.g., coordination and communication) to
  validate and maintain their effectiveness; and\r

  Establishing and periodically testing incident management processes with third
  parties."
elementType: control
