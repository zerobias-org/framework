externalId: "2.2"
name: Technology asset management
description: "Principle 5: FRFIs should maintain an updated inventory of all
  technology assets supporting business processes or functions. FRFI’s asset
  management processes should address classification of assets to facilitate
  risk identification and assessment, record configurations to ensure asset
  integrity, provide for the safe disposal of assets at the end of their life
  cycle, and monitor and manage technology currency."
elementType: control
