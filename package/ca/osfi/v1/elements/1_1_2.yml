name: Appropriate structure, resources and training are provided
description: "FRFIs should:\r

  \r

  Establish an organizational structure for managing technology and cyber risks
  across the institution, with clear roles and responsibilities, adequate people
  and financial resources, and appropriate subject-matter expertise and
  training;\r

  Include among its Senior Management ranks persons with sufficient
  understanding of technology and cyber risks; and\r

  Promote a culture of risk awareness in relation to technology and cyber risks
  throughout the institution.\r

  Please refer to OSFI’s Corporate Governance Guideline for OSFI’s expectations
  of FRFI Boards of Directors regarding business strategy, risk appetite and
  operational, business, risk and crisis management policies."
elementType: control
