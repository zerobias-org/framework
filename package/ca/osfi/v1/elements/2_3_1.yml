externalId: 2.3.1
name: Technology projects are governed by an enterprise-wide framework
description: Technology projects are often distinguished by their scale,
  required investment and importance in fulfilling the FRFI’s broader strategy.
  As a result, they should be governed by an enterprise-wide project management
  framework that provides for consistent approaches and achievement of project
  outcomes in support of the FRFI’s technology strategy. The FRFI should
  measure, monitor and periodically report on project performance and associated
  risks.
elementType: control
