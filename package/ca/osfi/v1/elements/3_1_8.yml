id: b6f50395-2a21-4e9c-96c5-de06c5a374fd
externalId: 3.1.8
name: Cyber risk profile is monitored and reported on
description: FRFIs should maintain, and report on, a current and comprehensive
  cyber security risk profile to facilitate oversight and timely
  decision-making. The profile should draw on existing internal and external
  risk identification and assessment sources, processes, tools and capabilities.
  FRFIs should also ensure that processes and tools exist to measure, monitor
  and aggregate residual risks.
elementType: control
