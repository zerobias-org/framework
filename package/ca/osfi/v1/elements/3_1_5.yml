id: 565f3d57-7b3d-46d5-8580-e49984560430
externalId: 3.1.5
name: Continuous situational awareness and information sharing are maintained
description: FRFIs should maintain continuous situational awareness of the
  external cyber threat landscape and its threat environment as it applies to
  its technology assets. This could include participating in industry threat
  intelligence and information sharing forums and subscribing to timely and
  reputable threat information sources. Where feasible, FRFIs are encouraged to
  provide timely exchange of threat intelligence to facilitate prevention of
  cyber attacks, thereby contributing to its own cyber resilience and that of
  the broader financial sector.
elementType: control
