id: b3fe5ea7-013f-4811-9ac6-2d6f2d3cc204
externalId: 2.4.2
name: Security requirements are embedded throughout the SDLC
description: In addition to the general technology processes and controls, FRFIs
  should establish control gates to ensure that security requirements and
  expectations are embedded in each phase of the SDLC. For Agile software
  development methods, FRFIs should continue to incorporate the necessary SDLC
  and security-by-design principles throughout its Agile process.
elementType: control
