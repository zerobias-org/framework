id: fb418d54-09cd-434b-a096-981dd8f5ab9c
externalId: 3.2.1
name: Secure-by-design practices are adopted
description: FRFIs should adopt secure-by-design practices to safeguard its
  technology assets. Security defence controls should aim to be preventive,
  where feasible, and FRFIs should regularly review security use cases with a
  view to strengthen reliance on preventive versus detective controls. Standard
  security controls should be applied end-to-end, starting at the design stage,
  to applications, micro-services and application programming interfaces
  developed by the FRFI.
elementType: control
