id: c4ae031a-5d3f-4fc6-b944-69f1de54125d
externalId: 2.2.2
name: Inventory is maintained and assets are categorized
description: "FRFIs should maintain a current and comprehensive asset management
  system, or inventory, that catalogues technology assets throughout their life
  cycle. Based on the FRFI’s risk tolerance, this may include assets owned or
  leased by a FRFI, and third-party assets that store or process FRFI
  information or provide critical business services. The asset management
  system, or inventory, should be supported by:\r

  \r

  Processes to categorize technology assets based on their criticality and/or
  classification. These processes should identify critical technology assets
  that are of high importance to the FRFI, or which could attract threat actors
  and cyber attacks, and therefore require enhanced cyber protections; and\r

  Documented interdependencies between critical technology assets, where
  appropriate, to enable proper change and configuration management processes,
  and to assist in response to security and operational incidents, including
  cyber attacks."
elementType: control
