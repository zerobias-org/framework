externalId: 2.9.3
name: Disaster recovery scenarios are tested
description: "To promote learning, continuous improvement and technology
  resilience, FRFIs should regularly validate and report on their disaster
  recovery strategies, plans and/or capabilities against severe but plausible
  scenarios. These scenarios should be forward-looking and consider, where
  appropriate:\r

  \r

  New and emerging risks or threats;\r

  Material changes to business objectives or technologies;\r

  Situations that can lead to prolonged outage; and,\r

  Previous incident history and known technology complexities or weaknesses.\r

  FRFIs’ disaster recovery scenarios should test:\r

  \r

  The FRFI’s backup and recovery capabilities and processes to validate
  resiliency strategies, plans and actions, and confirm the organization’s
  ability to meet pre-defined requirements; and,\r

  Critical third-party technologies and integration points with upstream and
  downstream dependencies, including both on- and off-premises technology."
elementType: control
