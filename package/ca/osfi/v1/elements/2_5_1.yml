id: 51a3aeef-a5f2-4641-a166-bd2f257ec765
externalId: 2.5.1
name: Changes to technology assets are conducted in a controlled manner
description: FRFIs should ensure that changes to technology assets in the
  production environment are documented, assessed, tested, approved, implemented
  and verified in a controlled manner. The change and release management
  standard should outline the key controls required throughout the change
  management process. The standard should also define emergency change and
  control requirements to ensure that such changes are implemented in a
  controlled manner with adequate safeguards.
elementType: control
