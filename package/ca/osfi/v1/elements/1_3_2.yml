name: RMF captures key elements
description: "FRFIs should consider the following elements of risk management
  when establishing the technology and cyber RMF:\r

  \r

  Accountability for technology and cyber risk management, including for
  relevant Oversight Functions;\r

  Technology and cyber risk appetite and measurement (e.g., limits, thresholds
  and tolerance levels);\r

  A technology and cyber risk taxonomy;\r

  Control domains for technology and cyber security;\r

  Policies, standards and processes governing technology and cyber risk, which
  are approved, regularly reviewed and consistently implemented
  enterprise-wide;\r

  Processes for identifying, assessing, managing, monitoring and reporting on
  technology and cyber risks, including processes for managing exceptions;\r

  Management of unique risks posed by emerging threats and technologies; and\r

  Reporting to Senior Management on technology and cyber risk appetite measures,
  exposures and trends to inform the FRFI’s current and emerging risk profile.\r

  Please refer to OSFI’s Corporate Governance Guideline for OSFI’s expectations
  in relation to FRFI Oversight Functions, which include Risk Management,
  Compliance, and Internal Audit."
elementType: control
