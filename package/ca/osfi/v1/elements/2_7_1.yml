id: 36922288-f303-4432-a6b9-f0e6cb61a83d
externalId: 2.7.1
name: Incidents are managed to minimize impact on affected systems and business
  processes
description: FRFIs should define standards and implement processes for incident
  and problem management. Standards should provide an appropriate governance
  structure for timely identification and escalation of incidents, restoration
  and/or recovery of an affected system, and investigation and resolution of
  incident root causes.
elementType: control
