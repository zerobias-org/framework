externalId: 1.1.1
name: Senior Management accountability is established
description: "Senior Management is accountable for directing the FRFI’s
  technology and cyber security operations and should assign clear
  responsibility for technology and cyber risk governance to senior officers.
  Examples of such roles include: Head of Information Technology; Chief
  Technology Officer (CTO); Chief Information Officer (CIO); Head of Cyber
  Security or Chief Information Security Officer (CISO). These roles should have
  appropriate stature and visibility throughout the institution."
elementType: control
