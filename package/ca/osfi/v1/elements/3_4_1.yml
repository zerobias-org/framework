externalId: 3.4.1
name: Incident response capabilities are integrated and aligned
description: Domain 2 sets out the foundational expectations for FRFIs’ incident
  and problem management capabilities. FRFIs should ensure the alignment and
  integration between their cyber security, technology, crisis management and
  communication protocols. This should include capabilities to enable
  comprehensive and timely escalation and stakeholder coordination (internal and
  external) in response to a major cyber security event or incident.
elementType: control
