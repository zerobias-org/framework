name: Technology infrastructure performance and capacity are sufficient
description: FRFIs should define performance and capacity requirements with
  thresholds on infrastructure utilization. These requirements should be
  continuously monitored against defined thresholds to ensure technology
  performance and capacity support current and future business needs.
