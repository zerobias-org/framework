id: e8145c92-19de-45b5-8ff2-f66ecb460121
externalId: 3.3.2
name: Malicious and unauthorized activity is detected
description: FRFIs should maintain security information and event management
  capabilities to ensure continuous detection and alerting of malicious and
  unauthorized user and system activity. Where feasible, advanced
  behaviour-based detection and prevention methods should be used to detect user
  and entity behaviour anomalies, and emerging external and internal threats.
  The latest threat intelligence and indicators of compromise should be used to
  continuously enhance FRFI monitoring tools.
elementType: control
