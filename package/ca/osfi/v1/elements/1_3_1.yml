externalId: 1.3.1
name: RMF is well-aligned and continuously improved
description: FRFIs should establish a framework for managing technology and
  cyber risks in alignment with its enterprise risk management framework. FRFIs
  should regularly review and refresh its technology and cyber RMF to make
  continuous improvements based on implementation, monitoring and other lessons
  learned (e.g., past incidents).
elementType: control
