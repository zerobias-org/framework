id: a93d9173-85ef-4d1b-a67a-d2151b3f9fee
externalId: 2.7.3
name: Processes are established to investigate, resolve and learn from problems
description: FRFIs should develop problem management processes that provide for
  the detection, categorization, investigation and resolution of suspected
  incident cause(s). Processes should include post-incident reviews, root cause
  and impact diagnostics and identification of trends or patterns in incidents.
  Problem management activities and findings should inform related control
  processes and be used on an ongoing basis to improve incident management
  processes and procedures, including change and release management.
elementType: control
