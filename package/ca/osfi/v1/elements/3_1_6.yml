externalId: 3.1.6
name: Threat modelling and hunting are conducted
description: Where feasible, FRFIs should maintain cyber threat models to
  identify cyber security threats directly facing its technology assets and
  services. Threats should be assessed regularly to enhance the cyber security
  program, capabilities and controls required to mitigate current and emerging
  threats. FRFIs should use manual techniques to proactively identify and
  isolate threats which may not be detected by automated tools (e.g., threat
  hunting).
elementType: control
