id: 646b2306-eb11-407b-9617-9f3738a194d8
externalId: 3.1.3
name: Vulnerabilities are identified, assessed and ranked
description: FRFIs should establish processes to conduct regular vulnerability
  assessments of its technology assets, including but not limited to network
  devices, systems and applications. Processes should articulate the frequency
  with which vulnerability scans and assessments are conducted. FRFIs should
  assess and rank relevant cyber vulnerabilities and threats according to the
  severity of the threat and risk exposure to technology assets using a standard
  risk measurement methodology. In doing so, FRFIs should consider the potential
  cumulative impact of vulnerabilities, irrespective of risk level, that could
  present a high-risk exposure when combined.
elementType: control
