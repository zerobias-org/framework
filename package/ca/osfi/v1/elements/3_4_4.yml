externalId: 3.4.4
name: Timely response, containment and recovery capabilities are established
description: FRFIs should establish a cyber incident response team with tools
  and capabilities available on a continuous basis to rapidly respond, contain
  and recover from cyber security events and incidents that could materially
  impact the FRFI’s technology assets, customers and other stakeholders.
elementType: control
