externalId: 2.2.3
name: Inventory records and manages technology asset configurations
description: The technology inventory should also include a system for recording
  and managing asset configurations to enhance visibility and mitigate the risk
  of technology outages and unauthorized activity. Processes should be in place
  to identify, assess, and remediate discrepancies from the approved baseline
  configuration, and to report on breaches.
elementType: control
