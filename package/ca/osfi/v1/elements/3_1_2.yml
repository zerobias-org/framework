id: 16dbc50f-c080-47cd-925b-d600ea991365
externalId: 3.1.2
name: Intelligence-led threat assessment and testing is conducted
description: FRFIs should adopt a risk-based approach to threat assessment and
  testing. FRFIs should set defined triggers, and minimum frequencies, for
  intelligence-led threat assessments to test cyber security processes and
  controls. FRFIs should also regularly perform tests and exercises, to identify
  vulnerabilities or control gaps in its cyber security programs (e.g.,
  penetration testing and red teaming) using an intelligence-led approach. The
  scope and potential impacts of such testing should be clearly defined by the
  FRFI with effective risk mitigation controls applied throughout the assessment
  to manage any associated inherent risks.
elementType: control
