id: 2f93534f-02a8-4bca-b2c0-c133f242f464
externalId: 3.2.3
name: Enhanced controls and functionality are applied to protect critical and
  external-facing technology assets
description: "FRFIs should employ enhanced controls and functionality to rapidly
  contain cyber security threats, defend its critical technology assets and
  remain resilient against cyber attacks by considering the following:\r

  \r

  Identifying cyber security controls required to secure its critical technology
  assets;\r

  Designing application controls to contain and limit the impact of a cyber
  attack;\r

  Implementing, monitoring and reviewing appropriate security standards,
  configuration baselines and security hardening requirements; and\r

  Deploying additional layers of security controls, as appropriate, to defend
  against cyber attacks (e.g., volumetric, low/slow network and application
  business logic attacks)."
elementType: control
