id: 5e5c1e5e-1743-41bc-b010-99f91b721837
externalId: 2.9.1
name: Disaster recovery program is established
description: "FRFIs should develop, implement and maintain an ERDP that sets out
  their approach to recovering technology services during a disruption. FRFIs
  should align the disaster recovery program with its business continuity
  management program. The EDRP should establish:\r

  \r

  Accountability and responsibility for the availability and recovery of
  technology services, including recovery actions;\r

  A process for identifying and analyzing technology services and key
  dependencies required to operate within the FRFI’s risk tolerance;\r

  Plans, procedures and/or capabilities to recover technology services to an
  acceptable level, within an acceptable timeframe, as defined and prioritized
  by the FRFI; and,\r

  A policy or standard with controls for data back-up and recovery processes,
  requirements for data storage and periodic testing."
elementType: control
