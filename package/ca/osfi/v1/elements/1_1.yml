name: Accountability and organizational structure
description: "Principle 1: Senior Management should assign responsibility for
  managing technology and cyber risks to senior officers. It should also ensure
  an appropriate organizational structure and adequate resourcing are in place
  for managing technology and cyber risks across the FRFI."
