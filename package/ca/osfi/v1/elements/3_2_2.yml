id: f5751cb2-5ad0-4bf1-8088-13729ae2e9db
externalId: 3.2.2
name: Strong and secure cryptographic technologies are employed
description: FRFIs should implement and maintain strong cryptographic
  technologies to protect the authenticity, confidentiality and integrity of its
  technology assets. This includes controls for the protection of encryption
  keys from unauthorised access, usage and disclosure throughout the
  cryptographic key management life cycle. FRFIs should regularly assess its
  cryptography standard and technologies to remain effective against current and
  emerging threats.
elementType: control
