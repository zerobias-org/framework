id: d5031604-8e2e-4157-9432-01ea613ead55
externalId: 3.3.1
name: Continuous, centralized security logging to support investigations
description: FRFIs should ensure continuous security logging for technology
  assets and different layers of defence tools. Central tools for aggregating,
  correlating and managing security event logs should enable timely log access
  during a cyber event investigation. For any significant cyber threat or
  incident, the FRFI’s forensic investigation should not be limited or delayed
  by disaggregated, inaccessible or missing critical security event logs. FRFIs
  should implement minimum security log retention periods and maintain cyber
  security event logs to facilitate a thorough and unimpeded forensic
  investigation of cyber security events.
elementType: control
