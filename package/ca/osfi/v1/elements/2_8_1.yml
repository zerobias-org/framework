id: b8bbd659-0a9e-4f88-b96b-03346135e584
externalId: 2.8.1
name: Technology service performance is measured, monitored and regularly
  reviewed for improvement
description: FRFIs should establish technology service management standards with
  defined performance indicators and/or service targets that can be used to
  measure and monitor the delivery of technology services. Processes should also
  provide for remediation where targets are not being met.
elementType: control
