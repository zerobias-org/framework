id: 3936c06b-ea27-4db6-88e6-86caf191416e
externalId: 3.1.7
name: Cyber awareness is promoted and tested
description: FRFIs should enable and encourage its employees, customers and
  third parties to report suspicious cyber activity, recognizing the role that
  each can play in preventing cyber attacks. FRFIs should create awareness of
  cyber attack scenarios directly targeting employees, customers and relevant
  third parties. In addition, the FRFI should regularly test its employees to
  assess their awareness of cyber threats and the effectiveness of their
  reporting processes and tools.
elementType: control
