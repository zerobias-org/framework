id: c2e893cd-e5af-409c-b6a6-7a365e6c70e9
externalId: 3.1.4
name: Data are identified, classified and protected
description: FRFIs should ensure that adequate controls are in place to
  identify, classify and protect structured and unstructured data based on their
  confidentiality classification. FRFIs should implement processes to perform
  periodic discovery scans to identify changes and deviations from established
  standards and controls to protect data from unauthorized access.
elementType: control
