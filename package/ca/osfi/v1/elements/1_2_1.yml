name: Strategy is proactive, comprehensive and measurable
description: "FRFI’s strategic technology and cyber plan(s) should consider the
  following elements:\r

  \r

  Anticipate and evolve with potential changes in the FRFI’s internal and
  external technology and cyber environment;\r

  Reference planned changes in the FRFI’s technology environment;\r

  Clearly outline the drivers, opportunities, vulnerabilities, threats and
  measures to report on progress against strategic objectives;\r

  Include risk indicators that are defined, measured, monitored and reported on;
  and\r

  Articulate how technology and cyber security operations will support the
  overall business strategy."
elementType: control
