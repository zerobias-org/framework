id: 61ea2aa3-1eb8-417a-9247-f42c435d57f0
externalId: 3.2.9
name: Application scanning and testing capabilities are employed
description: Where feasible, static and/or dynamic scanning and testing
  capabilities should be used to ensure new, and/or changes to existing, systems
  and applications are assessed for vulnerabilities prior to release into the
  production environment. Security controls should also be implemented to
  maintain security when development and operations practices are combined
  through a continuous and automated development pipeline (see paragraph 2.4.2).
elementType: control
