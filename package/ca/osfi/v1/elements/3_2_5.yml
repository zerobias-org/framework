externalId: 3.2.5
name: Data protection and loss prevention security controls are implemented
description: Starting with clear information classification of its data, FRFIs
  should design and implement risk-based controls for the protection of its data
  throughout its life cycle. This includes data loss prevention capabilities and
  controls for data at rest, data in transit and data in use.
elementType: control
