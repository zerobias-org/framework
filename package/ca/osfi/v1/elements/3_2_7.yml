id: c148b988-a3dd-4ad4-831f-1e125300786b
externalId: 3.2.7
name: Identity and access management controls are implemented
description: "FRFIs should implement risk-based identity and access controls,
  including Multi-Factor Authentication (MFA) and privileged access management.
  Where feasible, FRFIs should consider:\r

  \r

  Enforcing the principles of least privilege, conducting regular attestation of
  access and maintaining strong complex passwords to authenticate employee,
  customer and third-party access to technology assets;\r

  Implementing MFA across external-facing channels and privileged accounts
  (e.g., customers, employees, and third parties);\r

  Managing privileged account credentials using a secure vault;\r

  Logging and monitoring account activity as part of continuous security
  monitoring;\r

  Ensuring system and service accounts are securely authenticated, managed and
  monitored to detect unauthorized usage; and\r

  Performing appropriate background checks (where feasible) on persons granted
  access to the FRFI’s systems or data, commensurate with the criticality and
  classification of the technology assets."
elementType: control
