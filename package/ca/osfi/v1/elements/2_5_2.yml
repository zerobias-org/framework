id: 05bc2ec2-554f-4d04-9ad5-6bfd82b88312
externalId: 2.5.2
name: Segregation of duties controls against unauthorized changes
description: Segregation of duties is a key control used in protecting assets
  from unauthorized changes. FRFIs should segregate duties in the change
  management process to ensure that the same person cannot develop, authorize,
  execute and move code or releases between production and non-production
  technology environments.
elementType: control
