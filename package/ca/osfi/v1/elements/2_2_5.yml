id: ace2ba54-94ee-4cf3-959f-f06561519370
externalId: 2.2.5
name: Technology currency is continuously assessed and managed
description: FRFIs should continuously monitor the currency of software and
  hardware assets used in the technology environment in support of business
  processes. It should proactively implement plans to mitigate and manage risks
  stemming from unpatched, outdated or unsupported assets and replace or upgrade
  assets before maintenance ceases.
elementType: control
