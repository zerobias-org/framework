externalId: 2.9.2
name: Key dependencies are managed
description: "FRFIs should manage key dependencies required to support the EDRP,
  such as:\r

  \r

  Information security requirements for data security and storage (e.g.,
  encryption); and, \r

  Location of technology asset centres, backup sites, service provider locations
  and proximity to primary data centres, and other critical technology assets
  and locations.\r

  \r

  Principle 13: FRFIs should perform scenario testing on disaster recovery
  capabilities to confirm its technology services operate as expected through
  disruption"
elementType: control
