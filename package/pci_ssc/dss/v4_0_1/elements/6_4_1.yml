id: 786c355d-68b0-4445-9f86-f128d7a432ca
externalId: 6.4.1
name: 6.4.1
description: "For public-facing web applications, new threats and
  vulnerabilities are addressed on an ongoing basis and these applications are
  protected against known attacks as follows:\r

  ▪ Reviewing public-facing web applications via manual or automated application
  vulnerability security assessment tools or methods as follows:\r

  –    At least once every 12 months and after significant changes.\r

  –    By an entity that specializes in application security.\r

  –    Including, at a minimum, all common software attacks in Requirement
  6.2.4.\r

  –    All vulnerabilities are ranked in accordance with requirement 6.3.1.\r

  –    All vulnerabilities are corrected.\r

  –    The application is re-evaluated after the corrections\r

  OR\r

  ▪ Installing an automated technical solution(s) that continually detects and
  prevents web-based attacks as follows:\r

  –    Installed in front of public-facing web applications to detect and
  prevent web- based attacks.\r

  –    Actively running and up to date as applicable.\r

  –    Generating audit logs.\r

  –    Configured to either block web-based attacks or generate an alert that is
  immediately investigated."
elementType: control
