id: 7d25a21f-b3a1-448c-ab7d-e2a8ccb70885
externalId: A3.2.2
name: A3.2.2
description: "PCI DSS scope impact for all changes to systems or networks is
  determined, including additions of new systems and new network connections.
  Processes include:\r

  ▪ Performing a formal PCI DSS impact assessment.\r

  ▪ Identifying applicable PCI DSS requirements to the system or network.\r

  ▪ Updating PCI DSS scope as appropriate.\r

  ▪ Documented sign-off of the results of the impact assessment by responsible
  personnel (as defined in A3.1.3).\r

  PCI DSS Reference: Scope of PCI DSS Requirements; Requirements 1-12"
elementType: control
