name: 6.2.3.1
description: "If manual code reviews are performed for bespoke and custom
  software prior to release to production, code changes are:\r

  ▪ Reviewed by individuals other than the originating code author, and who are
  knowledgeable about code-review techniques and secure coding practices.\r

  ▪ Reviewed and approved by management prior to release."
