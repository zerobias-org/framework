description: "Mechanisms are implemented for detecting and preventing cleartext
  PAN from leaving the CDE via an unauthorized channel, method, or process,
  including mechanisms that are:\r

  ▪ Actively running.\r

  ▪ Configured to detect and prevent cleartext PAN leaving the CDE via an
  unauthorized channel, method, or process.\r

  ▪ Generating audit logs and alerts upon detection of cleartext PAN leaving the
  CDE via an unauthorized channel, method, or process.\r

  PCI DSS Reference: Scope of PCI DSS Requirements, Requirement 12"
