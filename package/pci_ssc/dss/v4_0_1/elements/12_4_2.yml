externalId: 12.4.2
name: 12.4.2
description: "Additional requirement for service providers only: Reviews are
  performed at least once every three months to confirm that personnel are
  performing their tasks in accordance with all security policies and
  operational procedures. Reviews are performed by personnel other than those
  responsible for performing the given task and include, but are not limited to,
  the following tasks:\r

  ▪ Daily log reviews.\r

  ▪ Configuration reviews for network security controls.\r

  ▪ Applying configuration standards to new systems.\r

  ▪ Responding to security alerts.\r

  ▪ Change-management processes."
elementType: control
