externalId: 1.4.2
name: 1.4.2
description: "Inbound traffic from untrusted networks to trusted networks is
  restricted to:\r

  ▪ Communications with system components that are authorized to provide
  publicly accessible services, protocols, and ports.\r

  ▪ Stateful responses to communications initiated by system components in a
  trusted network.\r

  ▪ All other traffic is denied."
elementType: control
