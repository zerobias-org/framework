id: 4cc465ab-af9a-442d-baa7-e9960490b0ab
externalId: 12.3.1
name: 12.3.1
description: "Each PCI DSS requirement that provides flexibility for how
  frequently it is performed (for example, requirements to be performed
  periodically) is supported by a targeted risk analysis that is documented and
  includes:\r

  ▪ Identification of the assets being protected.\r

  ▪ Identification of the threat(s) that the requirement is protecting
  against.\r

  ▪ Identification of factors that contribute to the likelihood and/or impact of
  a threat being realized.\r

  ▪ Resulting analysis that determines, and includes justification for, how
  frequently the requirement must be performed to minimize the likelihood of the
  threat being realized.\r

  ▪ Review of each targeted risk analysis at least once every 12 months to
  determine whether the results are still valid or if an updated risk analysis
  is needed.\r

  ▪ Performance of updated risk analyses when needed, as determined by the
  annual review."
elementType: control
