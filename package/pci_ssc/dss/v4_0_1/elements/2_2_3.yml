externalId: 2.2.3
name: 2.2.3
description: "Primary functions requiring different security levels are managed
  as follows:\r

  ▪ Only one primary function exists on a system component,\r

  OR\r

  ▪ Primary functions with differing security levels that exist on the same
  system component are isolated from each other,\r

  OR\r

  ▪ Primary functions with differing security levels on the same system
  component are all secured to the level required by the function with the
  highest security need."
elementType: control
