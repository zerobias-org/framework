name: 12.3.2
description: "A targeted risk analysis is performed for each PCI DSS requirement
  that the entity meets with the customized approach, to include:\r

  ▪ Documented evidence detailing each element specified in Appendix D:
  Customized Approach (including, at a minimum, a controls matrix and risk
  analysis).\r

  ▪ Approval of documented evidence by senior management.\r

  ▪ Performance of the targeted analysis of risk at least once every 12 months."
elementType: control
