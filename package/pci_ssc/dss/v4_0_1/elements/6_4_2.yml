name: 6.4.2
description: "For public-facing web applications, an automated technical
  solution is deployed that continually detects and prevents web-based attacks,
  with at least the following:\r

  ▪ Is installed in front of public-facing web applications and is configured to
  detect and prevent web-based attacks.\r

  ▪ Actively running and up to date as applicable.\r

  ▪ Generating audit logs.\r

  ▪ Configured to either block web-based attacks or generate an alert that is
  immediately investigated."
