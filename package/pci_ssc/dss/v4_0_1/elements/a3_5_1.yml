externalId: A3.5.1
name: A3.5.1
description: "A methodology is implemented for the prompt identification of
  attack patterns and undesirable behavior across systems that includes:\r

  ▪ Identification of anomalies or suspicious activity as it occurs.\r

  ▪ Issuance of prompt alerts upon detection of suspicious activity or anomaly
  to responsible personnel.\r

  ▪ Response to alerts in accordance with documented response procedures.\r

  PCI DSS Reference: Requirements 10, 12"
elementType: control
