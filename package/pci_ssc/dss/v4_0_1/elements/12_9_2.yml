externalId: 12.9.2
name: 12.9.2
description: "Additional requirement for service providers only: TPSPs support
  their customers’ requests for information to meet Requirements\r

  12.8.4 and 12.8.5 by providing the following upon customer request:\r

  ▪ PCI DSS compliance status information for any service the TPSP performs on
  behalf of customers (Requirement 12.8.4).\r

  ▪ Information about which PCI DSS requirements are the responsibility of the
  TPSP and which are the responsibility of the customer, including any shared
  responsibilities (Requirement 12.8.5)."
elementType: control
