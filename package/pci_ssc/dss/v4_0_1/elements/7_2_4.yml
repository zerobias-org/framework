name: 7.2.4
description: "All user accounts and related access privileges, including
  third-party/vendor accounts, are reviewed as follows:\r

  ▪ At least once every six months.\r

  ▪ To ensure user accounts and access remain appropriate based on job
  function.\r

  ▪ Any inappropriate access is addressed.\r

  ▪ Management acknowledges that access remains appropriate."
