name: 8.3.1
description: "All user access to system components for users and administrators
  is authenticated via at least one of the following authentication factors:\r

  ▪ Something you know, such as a password or passphrase.\r

  ▪ Something you have, such as a token device or smart card.\r

  ▪ Something you are, such as a biometric element."
