externalId: 6.3.1
name: 6.3.1
description: "Security vulnerabilities are identified and managed as follows:\r

  ▪ New security vulnerabilities are identified using industry-recognized
  sources for security vulnerability information, including alerts from
  international and national computer emergency response teams (CERTs).\r

  ▪ Vulnerabilities are assigned a risk ranking based on industry best practices
  and consideration of potential impact.\r

  ▪ Risk rankings identify, at a minimum, all vulnerabilities considered to be a
  high-risk or critical to the environment.\r

  ▪ Vulnerabilities for bespoke and custom, and third-party software (for
  example operating systems and databases) are covered."
elementType: control
