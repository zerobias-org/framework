externalId: 1.5.1
name: 1.5.1
description: "Security controls are implemented on any computing devices,
  including company- and employee-owned devices, that connect to both untrusted
  networks (including the Internet) and the CDE as follows:\r

  ▪   Specific configuration settings are defined to prevent threats being
  introduced into the entity’s network.\r

  ▪   Security controls are actively running.\r

  ▪   Security controls are not alterable by users of the computing devices
  unless specifically documented and authorized by management on a case-by-case
  basis for a limited period."
elementType: control
