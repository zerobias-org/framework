externalId: 12.3.4
name: 12.3.4
description: "Hardware and software technologies in use are reviewed at least
  once every 12 months, including at least the following:\r

  ▪ Analysis that the technologies continue to receive security fixes from
  vendors promptly.\r

  ▪ Analysis that the technologies continue to support (and do not preclude) the
  entity’s PCI DSS compliance.\r

  ▪ Documentation of any industry announcements or trends related to a
  technology, such as when a vendor has announced “end of life” plans for a
  technology.\r

  ▪ Documentation of a plan, approved by senior management, to remediate
  outdated technologies, including those for which vendors have announced “end
  of life” plans."
elementType: control
