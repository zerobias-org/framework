id: 413dae7f-3330-4ed2-8f6f-54cb07b469a9
externalId: 8.6.1
name: 8.6.1
description: "If accounts used by systems or applications can be used for
  interactive login, they are managed as follows:\r

  ▪ Interactive use is prevented unless needed for an exceptional
  circumstance.\r

  ▪ Interactive use is limited to the time needed for the exceptional
  circumstance.\r

  ▪ Business justification for interactive use is documented.\r

  ▪ Interactive use is explicitly approved by management.\r

  ▪ Individual user identity is confirmed before access to account is granted.\r

  ▪ Every action taken is attributable to an individual user."
elementType: control
