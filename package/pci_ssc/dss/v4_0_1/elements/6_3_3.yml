id: 1037cfcd-e5c7-4e48-99a8-78737e8aa0e8
externalId: 6.3.3
name: 6.3.3
description: "All system components are protected from known vulnerabilities by
  installing applicable security patches/updates as follows:\r

  ▪ Critical or high-security patches/updates (identified according to the risk
  ranking process at Requirement 6.3.1) are installed within one month of
  release.\r

  ▪ All other applicable security patches/updates are installed within an
  appropriate time frame as determined by the entity (for example, within three
  months of release)."
elementType: control
