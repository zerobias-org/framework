externalId: A3.2.4
name: A3.2.4
description: "If segmentation is used, PCI DSS scope is confirmed as follows:\r

  ▪ Per the entity’s methodology defined at Requirement 11.4.1.\r

  ▪ Penetration testing is performed on segmentation controls at least once
  every six months and after any changes to segmentation controls/methods.\r

  ▪ The penetration testing covers all segmentation controls/methods in use.\r

  ▪ The penetration testing verifies that segmentation controls/methods are
  operational and effective, and isolate the CDE from all out- of-scope
  systems.\r

  PCI DSS Reference: Requirement 11"
elementType: control
