name: 11.4.2
description: "Internal penetration testing is performed:\r

  ▪ Per the entity’s defined methodology,\r

  ▪ At least once every 12 months\r

  ▪ After any significant infrastructure or application upgrade or change\r

  ▪ By a qualified internal resource or qualified external third-party\r

  ▪ Organizational independence of the tester exists (not required to be a QSA
  or ASV)."
elementType: control
