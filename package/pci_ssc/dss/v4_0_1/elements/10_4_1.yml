name: 10.4.1
description: "The following audit logs are reviewed at least once daily:\r

  ▪ All security events.\r

  ▪ Logs of all system components that store, process, or transmit CHD and/or
  SAD.\r

  ▪ Logs of all critical system components.\r

  ▪ Logs of all servers and system components that perform security functions
  (for example, network security controls, intrusion-detection
  systems/intrusion-prevention systems (IDS/IPS), authentication servers)."
elementType: control
