id: 6f7029e9-8f38-4b33-9ccf-251adfc55e23
externalId: 8.6.3
name: 8.6.3
description: "Passwords/passphrases for any application and system accounts are
  protected against misuse as follows:\r

  ▪ Passwords/passphrases are changed periodically (at the frequency defined in
  the entity’s targeted risk analysis, which is performed according to all
  elements specified in Requirement 12.3.1) and upon suspicion or confirmation
  of compromise.\r

  ▪ Passwords/passphrases are constructed with sufficient complexity appropriate
  for how frequently the entity changes the passwords/passphrases."
elementType: control
