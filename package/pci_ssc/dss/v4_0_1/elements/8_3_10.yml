externalId: 8.3.10
name: 8.3.10
description: "Additional requirement for service providers only: If
  passwords/passphrases are used as the only authentication factor for customer
  user access to cardholder data (i.e., in any single- factor authentication
  implementation), then guidance is provided to customer users including:\r

  ▪ Guidance for customers to change their user passwords/passphrases
  periodically.\r

  ▪ Guidance as to when, and under what circumstances, passwords/passphrases are
  to be changed."
elementType: control
