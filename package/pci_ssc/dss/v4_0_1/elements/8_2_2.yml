externalId: 8.2.2
name: 8.2.2
description: "Group, shared, or generic accounts, or other shared authentication
  credentials are only used when necessary on an exception basis, and are
  managed as follows:\r

  ▪ Account use is prevented unless needed for an exceptional circumstance.\r

  ▪ Use is limited to the time needed for the exceptional circumstance.\r

  ▪ Business justification for use is documented.\r

  ▪ Use is explicitly approved by management.\r

  ▪ Individual user identity is confirmed before access to an account is
  granted.\r

  ▪ Every action taken is attributable to an individual user."
elementType: control
