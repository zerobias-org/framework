externalId: 4.2.1
name: 4.2.1
description: "Strong cryptography and security protocols are implemented as
  follows to safeguard PAN during transmission over open, public networks:\r

  ▪ Only trusted keys and certificates are accepted.\r

  ▪ Certificates used to safeguard PAN during transmission over open, public
  networks are confirmed as valid and are not expired or revoked. This bullet is
  a best practice until its effective date; refer to applicability notes below
  for details.\r

  ▪ The protocol in use supports only secure versions or configurations and does
  not support fallback to, or use of insecure versions, algorithms, key sizes,
  or implementations.\r

  ▪ The encryption strength is appropriate for the encryption methodology in
  use."
elementType: control
