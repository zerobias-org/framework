externalId: A3.1.2
name: A3.1.2
description: "A formal PCI DSS compliance program is in place that includes:\r

  ▪ Definition of activities for maintaining and monitoring overall PCI DSS
  compliance, including business-as-usual activities.\r

  ▪ Annual PCI DSS assessment processes.\r

  ▪ Processes for the continuous validation of PCI DSS requirements (for
  example, daily, weekly, every three months, as applicable per the
  requirement).\r

  ▪ A process for performing business-impact analysis to determine potential PCI
  DSS impacts for strategic business decisions.\r

  PCI DSS Reference: Requirements 1-12"
elementType: control
