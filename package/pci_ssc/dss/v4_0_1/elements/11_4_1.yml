id: fef5fcc9-a82a-42dc-8267-397d93548887
externalId: 11.4.1
name: 11.4.1
description: "A penetration testing methodology is defined, documented, and
  implemented by the entity, and includes:\r

  ▪ Industry-accepted penetration testing approaches.\r

  ▪ Coverage for the entire CDE perimeter and critical systems.\r

  ▪ Testing from both inside and outside the network.\r

  ▪ Testing to validate any segmentation and scope- reduction controls.\r

  ▪ Application-layer penetration testing to identify, at a minimum, the
  vulnerabilities listed in Requirement 6.2.4.\r

  ▪ Network-layer penetration tests that encompass all components that support
  network functions as well as operating systems.\r

  ▪ Review and consideration of threats and vulnerabilities experienced in the
  last 12 months.\r

  ▪ Documented approach to assessing and addressing the risk posed by
  exploitable vulnerabilities and security weaknesses found during penetration
  testing.\r

  ▪ Retention of penetration testing results and remediation activities results
  for at least 12 months."
elementType: control
