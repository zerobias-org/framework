id: da2e41db-2d0d-4354-85bd-357881eada59
externalId: 3.6.1.2
name: 3.6.1.2
description: "Secret and private keys used to encrypt/decrypt stored account
  data are stored in one (or more) of the following forms at all times:\r

  ▪ Encrypted with a key-encrypting key that is at least as strong as the
  data-encrypting key, and that is stored separately from the data- encrypting
  key.\r

  ▪ Within a secure cryptographic device (SCD), such as a hardware security
  module (HSM) or PTS-approved point-of-interaction device.\r

  ▪ As at least two full-length key components or key shares, in accordance with
  an industry-accepted method."
elementType: control
