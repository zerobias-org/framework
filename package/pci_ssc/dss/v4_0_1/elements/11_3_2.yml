name: 11.3.2
description: "External vulnerability scans are performed as follows:\r

  ▪   At least once every three months.\r

  ▪   By a PCI SSC Approved Scanning Vendor (ASV).\r

  ▪   Vulnerabilities are resolved and ASV Program Guide requirements for a
  passing scan are met.\r

  ▪   Rescans are performed as needed to confirm that vulnerabilities are
  resolved per the ASV Program Guide requirements for a passing scan."
elementType: control
