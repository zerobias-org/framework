name: 5.2.3
description: "Any system components that are not at risk for malware are
  evaluated periodically to include the following:\r

  ▪   A documented list of all system components not at risk for malware.\r

  ▪   Identification and evaluation of evolving malware threats for those system
  components.\r

  ▪   Confirmation whether such system components continue to not require
  anti-malware protection."
