externalId: A3.3.1.2
name: A3.3.1.2
description: "Failures of any critical security control systems are responded to
  promptly. Processes for responding to failures in security control systems
  include:\r

  ▪ Restoring security functions.\r

  ▪ Identifying and documenting the duration (date and time from start to end)
  of the security failure.\r

  ▪ Identifying and documenting the cause(s) of failure, including root cause,
  and documenting remediation required to address the root cause.\r

  ▪ Identifying and addressing any security issues that arose during the
  failure.\r

  ▪ Determining whether further actions are required as a result of the security
  failure.\r

  ▪ Implementing controls to prevent the cause of failure from reoccurring.\r

  ▪ Resuming monitoring of security controls.\r

  PCI DSS Reference: Requirements 1-12"
elementType: control
