id: 2a50a836-0222-4eaf-97ba-40c80fe84175
externalId: A3.3.3
name: A3.3.3
description: "Reviews are performed at least once every three months to verify
  BAU activities are being followed. Reviews are performed by personnel assigned
  to the PCI DSS compliance program (as identified in A3.1.3), and include:\r

  ▪ Confirmation that all BAU activities, including A3.2.2, A3.2.6, and A3.3.1,
  are being performed.\r

  ▪ Confirmation that personnel are following security policies and operational
  procedures (for example, daily log reviews, ruleset reviews for network
  security controls, configuration standards for new systems).\r

  ▪ Documenting how the reviews were completed, including how all BAU activities
  were verified as being in place.\r

  ▪ Collection of documented evidence as required for the annual PCI DSS
  assessment.\r

  ▪ Review and sign-off of results by personnel assigned responsibility for the
  PCI DSS compliance program, as identified in A3.1.3.\r

  ▪ Retention of records and documentation for at least 12 months, covering all
  BAU activities.\r

  PCI DSS Reference: Requirements 1-12"
elementType: control
