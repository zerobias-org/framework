externalId: 11.2.1
name: 11.2.1
description: "Authorized and unauthorized wireless access points are managed as
  follows:\r

  ▪ The presence of wireless (Wi-Fi) access points is tested for,\r

  ▪ All authorized and unauthorized wireless access points are detected and
  identified,\r

  ▪ Testing, detection, and identification occurs at least once every three
  months.\r

  ▪ If automated monitoring is used, personnel are notified via generated
  alerts."
elementType: control
