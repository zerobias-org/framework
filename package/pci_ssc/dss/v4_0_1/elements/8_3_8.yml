externalId: 8.3.8
name: 8.3.8
description: "Authentication policies and procedures are documented and
  communicated to all users including:\r

  ▪ Guidance on selecting strong authentication factors.\r

  ▪ Guidance for how users should protect their authentication factors.\r

  ▪ Instructions not to reuse previously used passwords/passphrases.\r

  ▪ Instructions to change passwords/passphrases if there is any suspicion or
  knowledge that the password/passphrases have been compromised and how to
  report the incident."
elementType: control
