id: 8b484581-ac7a-41f1-99f6-70142d924413
externalId: A2.1.2
name: A2.1.2
description: "Additional requirement for service providers only: All service
  providers with existing connection points to POS POI terminals that use SSL
  and/or early TLS as defined in A2.1 have a formal Risk Mitigation and
  Migration Plan in place that includes:\r

  ▪ Description of usage, including what data is being transmitted, types and
  number of systems that use and/or support SSL/early TLS, and type of
  environment.\r

  ▪ Risk-assessment results and risk-reduction controls in place.\r

  ▪ Description of processes to monitor for new vulnerabilities associated with
  SSL/early TLS.\r

  ▪ Description of change control processes that are implemented to ensure
  SSL/early TLS is not implemented into new environments.\r

  ▪ Overview of migration project plan to replace SSL/early TLS at a future
  date."
elementType: control
