externalId: 10.7.2
name: 10.7.2
description: "Failures of critical security control systems are detected,
  alerted, and addressed promptly, including but not limited to failure of the
  following critical security control systems:\r

  ▪ Network security controls.\r

  ▪ IDS/IPS.\r

  ▪ Change-detection mechanisms.\r

  ▪ Anti-malware solutions.\r

  ▪ Physical access controls.\r

  ▪ Logical access controls.\r

  ▪ Audit logging mechanisms.\r

  ▪ Segmentation controls (if used).\r

  ▪ Audit log review mechanisms.\r

  ▪ Automated security testing tools (if used)."
elementType: control
