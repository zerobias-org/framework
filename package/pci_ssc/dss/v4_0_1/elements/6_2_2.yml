name: 6.2.2
description: "Software development personnel working on bespoke and custom
  software are trained at least once every 12 months as follows:\r

  ▪ On software security relevant to their job function and development
  languages.\r

  ▪ Including secure software design and secure coding techniques.\r

  ▪ Including, if security testing tools are used, how to use the tools for
  detecting vulnerabilities in software."
