id: 7d6e5ed6-3344-40eb-bb27-e0cdf7970378
externalId: 3.2.1
name: 3.2.1
description: "Account data storage is kept to a minimum through implementation
  of data retention and disposal policies, procedures, and processes that
  include at least the following:\r

  ▪ Coverage for all locations of stored account data.\r

  ▪ Coverage for any sensitive authentication data (SAD) stored prior to
  completion of authorization. This bullet is a best practice until its
  effective date; refer to Applicability Notes below for details.\r

  ▪ Limiting data storage amount and retention time to that which is required
  for legal or regulatory, and/or business requirements.\r

  ▪ Specific retention requirements for stored account data that defines length
  of retention period and includes a documented business justification.\r

  ▪ Processes for secure deletion or rendering account data unrecoverable when
  no longer needed per the retention policy.\r

  ▪ A process for verifying, at least once every three months, that stored
  account data exceeding the defined retention period has been securely deleted
  or rendered unrecoverable."
elementType: control
