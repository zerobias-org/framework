externalId: A3.2.1
name: A3.2.1
description: "PCI DSS scope is documented and confirmed for accuracy at least
  once every three months and upon significant changes to the in- scope
  environment. At a minimum, the scoping validation includes:\r

  ▪ Identifying all data flows for the various payment stages (for example,
  authorization, capture, settlement, chargebacks, and refunds) and acceptance
  channels (for example, card-present, card-not-present, and e-commerce).\r

  ▪ Updating all data-flow diagrams per Requirement 1.2.4.\r

  ▪ Identifying all locations where account data is stored, processed, and
  transmitted, including but not limited to 1) any locations outside of the
  currently defined CDE, 2) applications that process CHD, 3) transmissions
  between systems and networks, and 4) file backups.\r

  ▪ For any account data found outside of the currently defined CDE, either 1)
  securely delete it, 2) migrate it into the currently defined CDE, or\r

  3) expand the currently defined CDE to include it.\r

  ▪ Identifying all system components in the CDE, connected to the CDE, or that
  could impact security of the CDE.\r

  ▪ Identifying all segmentation controls in use and the environment(s) from
  which the CDE is segmented, including justification for environments being out
  of scope.\r

  ▪ Identifying all connections to third-party entities with access to the
  CDE.\r

  ▪ Confirming that all identified data flows, account data, system components,
  segmentation controls, and connections from third parties with access to the
  CDE are included in scope.\r

  PCI DSS Reference: Scope of PCI DSS Requirements, Requirement 12.\r

  (continued on next page)"
elementType: control
