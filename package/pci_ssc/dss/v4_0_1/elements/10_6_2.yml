id: cf4ce8cc-4c28-4db5-b0d1-84c7d6ef030d
externalId: 10.6.2
name: 10.6.2
description: "Systems are configured to the correct and consistent time as
  follows:\r

  ▪ One or more designated time servers are in use.\r

  ▪ Only the designated central time server(s) receives time from external
  sources.\r

  ▪ Time received from external sources is based on International Atomic Time or
  Coordinated Universal Time (UTC).\r

  ▪ The designated time server(s) accept time updates only from specific
  industry-accepted external sources.\r

  ▪ Where there is more than one designated time server, the time servers peer
  with one another to keep accurate time.\r

  ▪ Internal systems receive time information only from designated central time
  server(s)."
elementType: control
