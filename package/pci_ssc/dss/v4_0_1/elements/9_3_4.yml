name: 9.3.4
description: "A visitor log is used to maintain a physical record of visitor
  activity within the facility and within sensitive areas, including:\r

  ▪ The visitor’s name and the organization represented.\r

  ▪ The date and time of the visit.\r

  ▪ The name of the personnel authorizing physical access.\r

  ▪ Retaining the log for at least three months, unless otherwise restricted by
  law."
elementType: control
