description: "Audit logs record the following details for each auditable
  event:\r

  ▪ User identification.\r

  ▪ Type of event.\r

  ▪ Date and time.\r

  ▪ Success and failure indication.\r

  ▪ Origination of event.\r

  ▪ Identity or name of affected data, system component, resource, or service
  (for example, name and protocol)."
