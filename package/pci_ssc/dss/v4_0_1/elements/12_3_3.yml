externalId: 12.3.3
name: 12.3.3
description: "Cryptographic cipher suites and protocols in use are documented
  and reviewed at least once every 12 months, including at least the
  following:\r

  ▪ An up-to-date inventory of all cryptographic cipher suites and protocols in
  use, including purpose and where used.\r

  ▪ Active monitoring of industry trends regarding continued viability of all
  cryptographic cipher suites and protocols in use.\r

  ▪ A documented strategy to respond to anticipated changes in cryptographic
  vulnerabilities."
elementType: control
