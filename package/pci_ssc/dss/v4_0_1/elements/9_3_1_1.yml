name: 9.3.1.1
description: "Physical access to sensitive areas within the CDE for personnel is
  controlled as follows:\r

  ▪ Access is authorized and based on individual job function.\r

  ▪ Access is revoked immediately upon termination.\r

  ▪ All physical access mechanisms, such as keys, access cards, etc., are
  returned or disabled upon termination."
elementType: control
