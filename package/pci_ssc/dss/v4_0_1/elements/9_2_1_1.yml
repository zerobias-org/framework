externalId: 9.2.1.1
name: 9.2.1.1
description: "Individual physical access to sensitive areas within the CDE is
  monitored with either video cameras or physical access control mechanisms (or
  both) as follows:\r

  ▪ Entry and exit points to/from sensitive areas within the CDE are
  monitored.\r

  ▪ Monitoring devices or mechanisms are protected from tampering or
  disabling.\r

  ▪ Collected data is reviewed and correlated with other entries.\r

  ▪ Collected data is stored for at least three months, unless otherwise
  restricted by law."
elementType: control
