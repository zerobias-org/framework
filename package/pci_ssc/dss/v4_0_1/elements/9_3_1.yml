name: 9.3.1
description: "Procedures are implemented for authorizing and managing physical
  access of personnel to the CDE, including:\r

  ▪ Identifying personnel.\r

  ▪ Managing changes to an individual’s physical access requirements.\r

  ▪ Revoking or terminating personnel identification.\r

  ▪ Limiting access to the identification process or system to authorized
  personnel."
elementType: control
