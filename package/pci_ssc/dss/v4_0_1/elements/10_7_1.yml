externalId: 10.7.1
name: 10.7.1
description: "Additional requirement for service providers only: Failures of
  critical security control systems are detected, alerted, and addressed
  promptly, including but not limited to failure of the following critical
  security control systems:\r

  ▪ Network security controls.\r

  ▪ IDS/IPS.\r

  ▪ FIM.\r

  ▪ Anti-malware solutions.\r

  ▪ Physical access controls.\r

  ▪ Logical access controls.\r

  ▪ Audit logging mechanisms.\r

  ▪ Segmentation controls (if used)."
elementType: control
