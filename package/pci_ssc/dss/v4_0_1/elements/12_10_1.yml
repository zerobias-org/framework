externalId: 12.10.1
name: 12.10.1
description: "An incident response plan exists and is ready to be activated in
  the event of a suspected or confirmed security incident. The plan includes,
  but is not limited to:\r

  ▪ Roles, responsibilities, and communication and contact strategies in the
  event of a suspected or confirmed security incident, including notification of
  payment brands and acquirers, at a minimum.\r

  ▪ Incident response procedures with specific containment and mitigation
  activities for different types of incidents.\r

  ▪ Business recovery and continuity procedures.\r

  ▪ Data backup processes.\r

  ▪ Analysis of legal requirements for reporting compromises.\r

  ▪ Coverage and responses of all critical system components.\r

  ▪ Reference or inclusion of incident response procedures from the payment
  brands."
elementType: control
