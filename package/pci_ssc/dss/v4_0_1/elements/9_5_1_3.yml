externalId: 9.5.1.3
name: 9.5.1.3
description: "Training is provided for personnel in POI environments to be aware
  of attempted tampering or replacement of POI devices, and includes:\r

  ▪ Verifying the identity of any third-party persons claiming to be repair or
  maintenance personnel, before granting them access to modify or troubleshoot
  devices.\r

  ▪ Procedures to ensure devices are not installed, replaced, or returned
  without verification.\r

  ▪ Being aware of suspicious behavior around devices.\r

  ▪ Reporting suspicious behavior and indications of device tampering or
  substitution to appropriate personnel."
elementType: control
