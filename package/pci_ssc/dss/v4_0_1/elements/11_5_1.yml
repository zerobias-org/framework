name: 11.5.1
description: "Intrusion-detection and/or intrusion- prevention techniques are
  used to detect and/or prevent intrusions into the network as follows:\r

  ▪ All traffic is monitored at the perimeter of the CDE.\r

  ▪ All traffic is monitored at critical points in the CDE.\r

  ▪ Personnel are alerted to suspected compromises.\r

  ▪ All intrusion-detection and prevention engines, baselines, and signatures
  are kept up to date."
elementType: control
