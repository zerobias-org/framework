description: "Audit log capability is enabled for each customer’s environment
  that is consistent with PCI DSS Requirement 10, including:\r

  ▪ Logs are enabled for common third-party applications.\r

  ▪ Logs are active by default.\r

  ▪ Logs are available for review only by the owning customer.\r

  ▪ Log locations are clearly communicated to the owning customer.\r

  ▪ Log data and availability is consistent with PCI DSS Requirement 10."
