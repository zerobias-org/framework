externalId: 7.2.1
name: 7.2.1
description: "An access control model is defined and includes granting access as
  follows:\r

  ▪ Appropriate access depending on the entity’s business and access needs.\r

  ▪ Access to system components and data resources that is based on users’ job
  classification and functions.\r

  ▪ The least privileges required (for example, user, administrator) to perform
  a job function."
elementType: control
