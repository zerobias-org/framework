externalId: A3.2.6.1
name: A3.2.6.1
description: "Response procedures are implemented to be initiated upon the
  detection of attempts to remove cleartext PAN from the CDE via an unauthorized
  channel, method, or process.\r

  Response procedures include:\r

  ▪ Procedures for the prompt investigation of alerts by responsible
  personnel.\r

  ▪ Procedures for remediating data leaks or process gaps, as necessary, to
  prevent any data loss.\r

  PCI DSS Reference: Requirement 12"
elementType: control
