name: 1.3.3
description: "NSCs are installed between all wireless networks and the CDE,
  regardless of whether the wireless network is a CDE, such that:\r

  ▪ All wireless traffic from wireless networks into the CDE is denied by
  default.\r

  ▪ Only wireless traffic with an authorized business purpose is allowed into
  the CDE."
elementType: control
