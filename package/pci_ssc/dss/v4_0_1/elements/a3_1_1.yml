name: A3.1.1
description: "Responsibility is established by executive management for the
  protection of account data and a PCI DSS compliance program that includes:\r

  ▪ Overall accountability for maintaining PCI DSS compliance.\r

  ▪ Defining a charter for a PCI DSS compliance program.\r

  ▪ Providing updates to executive management and board of directors on PCI DSS
  compliance initiatives and issues, including remediation activities, at least
  once every 12 months.\r

  PCI DSS Reference: Requirement 12"
elementType: control
