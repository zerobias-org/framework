externalId: A3.1.3
name: A3.1.3
description: "PCI DSS compliance roles and responsibilities are specifically
  defined and formally assigned to one or more personnel, including:\r

  ▪ Managing PCI DSS business-as-usual activities.\r

  ▪ Managing annual PCI DSS assessments.\r

  ▪ Managing continuous validation of PCI DSS requirements (for example, daily,
  weekly, every three months, as applicable per the requirement).\r

  ▪ Managing business-impact analysis to determine potential PCI DSS impacts for
  strategic business decisions.\r

  PCI DSS Reference: Requirement 12"
elementType: control
