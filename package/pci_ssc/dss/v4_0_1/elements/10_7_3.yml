id: eb73743e-13fc-45ed-bf5d-37903542a5d1
externalId: 10.7.3
name: 10.7.3
description: "Failures of any critical security controls systems are responded
  to promptly, including but not limited to:\r

  ▪ Restoring security functions.\r

  ▪ Identifying and documenting the duration (date and time from start to end)
  of the security failure.\r

  ▪ Identifying and documenting the cause(s) of failure and documenting required
  remediation.\r

  ▪ Identifying and addressing any security issues that arose during the
  failure.\r

  ▪ Determining whether further actions are required as a result of the security
  failure.\r

  ▪ Implementing controls to prevent the cause of failure from reoccurring.\r

  ▪ Resuming monitoring of security controls."
elementType: control
