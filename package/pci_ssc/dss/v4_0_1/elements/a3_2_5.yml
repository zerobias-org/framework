name: A3.2.5
description: "A data-discovery methodology is implemented that:\r

  ▪   Confirms PCI DSS scope.\r

  ▪   Locates all sources and locations of cleartext PAN at least once every
  three months and upon significant changes to the CDE or processes.\r

  ▪   Addresses the potential for cleartext PAN to reside on systems and
  networks outside the currently defined CDE.\r

  PCI DSS Reference: Scope of PCI DSS Requirements"
elementType: control
