externalId: 6.2.4
name: 6.2.4
description: "Software engineering techniques or other methods are defined and
  in use by software development personnel to prevent or mitigate common
  software attacks and related vulnerabilities in bespoke and custom software,
  including but not limited to the following:\r

  ▪ Injection attacks, including SQL, LDAP, XPath, or other command, parameter,
  object, fault, or injection-type flaws.\r

  ▪ Attacks on data and data structures, including attempts to manipulate
  buffers, pointers, input data, or shared data.\r

  ▪ Attacks on cryptography usage, including attempts to exploit weak, insecure,
  or inappropriate cryptographic implementations, algorithms, cipher suites, or
  modes of operation.\r

  ▪ Attacks on business logic, including attempts to abuse or bypass application
  features and functionalities through the manipulation of APIs, communication
  protocols and channels, client- side functionality, or other
  system/application functions and resources. This includes cross-site scripting
  (XSS) and cross-site request forgery (CSRF).\r

  ▪ Attacks on access control mechanisms, including attempts to bypass or abuse
  identification, authentication, or authorization mechanisms, or attempts to
  exploit weaknesses in the implementation of such mechanisms.\r

  ▪ Attacks via any “high-risk” vulnerabilities identified in the vulnerability
  identification process, as defined in Requirement 6.3.1."
elementType: control
