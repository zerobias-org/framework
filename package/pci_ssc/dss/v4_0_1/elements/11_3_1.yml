id: 2b0bdfa9-1184-4161-a0e5-c018e9e45b46
externalId: 11.3.1
name: 11.3.1
description: "Internal vulnerability scans are performed as follows:\r

  ▪ At least once every three months.\r

  ▪ High-risk and critical vulnerabilities (per the entity’s vulnerability risk
  rankings defined at Requirement 6.3.1) are resolved.\r

  ▪   Rescans are performed that confirm all high- risk and critical
  vulnerabilities (as noted above) have been resolved.\r

  ▪ Scan tool is kept up to date with latest vulnerability information.\r

  ▪ Scans are performed by qualified personnel and organizational independence
  of the tester exists."
elementType: control
