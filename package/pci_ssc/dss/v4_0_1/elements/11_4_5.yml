externalId: 11.4.5
name: 11.4.5
description: "If segmentation is used to isolate the CDE from other networks,
  penetration tests are performed on segmentation controls as follows:\r

  ▪ At least once every 12 months and after any changes to segmentation
  controls/methods\r

  ▪ Covering all segmentation controls/methods in use.\r

  ▪ According to the entity’s defined penetration testing methodology.\r

  ▪ Confirming that the segmentation controls/methods are operational and
  effective, and isolate the CDE from all out-of-scope systems.\r

  ▪ Confirming effectiveness of any use of isolation to separate systems with
  differing security levels (see Requirement 2.2.3).\r

  ▪ Performed by a qualified internal resource or qualified external third
  party.\r

  ▪ Organizational independence of the tester exists (not required to be a QSA
  or ASV)."
elementType: control
