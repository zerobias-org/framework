externalId: 9.5.1
name: 9.5.1
description: "POI devices that capture payment card data via direct physical
  interaction with the payment card form factor are protected from tampering and
  unauthorized substitution, including the following:\r

  ▪   Maintaining a list of POI devices.\r

  ▪   Periodically inspecting POI devices to look for tampering or unauthorized
  substitution.\r

  ▪   Training personnel to be aware of suspicious behavior and to report
  tampering or unauthorized substitution of devices."
elementType: control
