externalId: 12.10.5
name: 12.10.5
description: "The security incident response plan includes monitoring and
  responding to alerts from security monitoring systems, including but not
  limited to:\r

  ▪ Intrusion-detection and intrusion-prevention systems.\r

  ▪ Network security controls.\r

  ▪ Change-detection mechanisms for critical files.\r

  ▪ The change-and tamper-detection mechanism for payment pages. This bullet is
  a best practice until its effective date; refer to Applicability Notes below
  for details.\r

  ▪ Detection of unauthorized wireless access points."
elementType: control
