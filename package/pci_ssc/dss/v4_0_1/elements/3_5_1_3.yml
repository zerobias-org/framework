externalId: 3.5.1.3
name: 3.5.1.3
description: "If disk-level or partition-level encryption is used (rather than
  file-, column-, or field--level database encryption) to render PAN unreadable,
  it is managed as follows:\r

  ▪   Logical access is managed separately and independently of native operating
  system authentication and access control mechanisms.\r

  ▪   Decryption keys are not associated with user accounts.\r

  ▪   Authentication factors (passwords, passphrases, or cryptographic keys)
  that allow access to unencrypted data are stored securely."
elementType: control
