externalId: 9.4.6
name: 9.4.6
description: "Hard-copy materials with cardholder data are destroyed when no
  longer needed for business or legal reasons, as follows:\r

  ▪ Materials are cross-cut shredded, incinerated, or pulped so that cardholder
  data cannot be reconstructed.\r

  ▪ Materials are stored in secure storage containers prior to destruction."
elementType: control
