id: 19915c96-559f-4627-8084-55e5b334c7c3
externalId: Article 3.1
name: Article 3.1
description: When an information system processes personal data, the provisions
  of Regulation (EU) 2016/679 of the European Parliament and of the Council, of
  April 27, 2016, relating to the protection of natural persons in what concerns
  the processing of personal data and the free circulation of these data and
  which repeals Directive 95/46/EC (General Data Protection Regulation) and
  Organic Law 3/2018, of December 5, on Protection of Personal Data and
  guarantee of digital rights, or, where applicable, Organic Law 7/2021, of May
  26, on the protection of personal data processed for the purposes of
  prevention, detection, investigation and prosecution of criminal and
  enforcement infractions of criminal sanctions, the rest of the applicable
  regulations, as well as the criteria established by the Spanish Data
  Protection Agency or in its area of ​​competence, by the autonomous data
  protection authorities, without prejudice to the requirements established
  herein royal decree.
elementType: control
