id: e2e16843-3bc6-44bd-b795-88db7f0377eb
externalId: Article 18
name: Protection of facilities.
description: The information systems and their associated communications
  infrastructure must remain in controlled areas and have adequate and
  proportional access mechanisms based on the risk analysis, without prejudice
  to the provisions of Law 8/2011, of April 28, by which establishes measures
  for the protection of critical infrastructures and in Royal Decree 704/2011,
  of May 20, which approves the Regulation for the protection of critical
  infrastructures.
elementType: control
