id: 43719db1-ceb2-47fe-8cf2-c7886c4f2442
externalId: Article 15.1
name: Article 15.1
description: Personnel, whether their own or others, related to the information
  systems subject to the provisions of this royal decree, must be trained and
  informed of their duties, obligations and responsibilities in matters of
  security. Their actions, which must be supervised to verify that established
  procedures are followed, will apply the approved safety standards and
  operating procedures in the performance of their duties.
elementType: control
