id: 56c0b041-180e-41e8-be43-4bc9a900c78e
externalId: Article 33.7
name: Article 33.7
description: Private sector organizations that provide services to public
  entities will notify INCIBE-CERT, a reference security incident response
  center for citizens and private law entities in Spain operated by the SME
  National Cybersecurity Institute of Spain MP , SA (INCIBE) dependent on the
  Ministry of Economic Affairs and Digital Transformation, the incidents that
  affect them through its computer security incident response team, who, without
  prejudice to its powers and the provisions of articles 9, 10 and 11 of Royal
  Decree 43/2021, of January 26, in relation to the Cyberincident Notification
  and Monitoring Platform, will immediately inform the CCN-CERT.
elementType: control
