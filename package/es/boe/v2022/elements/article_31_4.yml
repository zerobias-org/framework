id: a85ff437-7221-4ebc-aa8e-ded38c8efa37
externalId: Article 31.4
name: Article 31.4
description: The audit report must rule on the degree of compliance with this
  royal decree, identifying the findings of compliance and non-compliance
  detected. It must also include the audit methodological criteria used, the
  scope and objective of the audit, and the data, facts and observations on
  which the conclusions formulated are based, all in accordance with the
  aforementioned Technical Instruction on Audit Security. the Security of
  Information Systems.
elementType: control
