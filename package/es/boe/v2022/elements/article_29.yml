id: c95b56b0-fe03-40fd-868f-7b9ef93e38b9
externalId: Article 29
name: Common infrastructure and services.
description: The use of common infrastructure and services of public
  administrations, including shared or transversal ones, will facilitate
  compliance with the provisions of this royal decree. The specific cases of use
  of these infrastructures and services will be determined by each public
  administration.
elementType: control
