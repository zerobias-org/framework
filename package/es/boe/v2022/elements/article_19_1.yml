id: 59192808-e0b2-41ac-9f50-8213745d756b
externalId: Article 19.1
name: Article 19.1
description: In the acquisition of security products or contracting of
  information and communication technology security services that are going to
  be used in the information systems within the scope of application of this
  royal decree, they will be used, in a manner proportionate to the category of
  the system and the level of security determined, those that have the security
  functionality related to the object of their acquisition certified.
elementType: control
