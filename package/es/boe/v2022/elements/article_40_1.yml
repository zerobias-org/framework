id: 454774ba-86a6-422b-8b45-1d1225409d0c
externalId: Article 40.1
name: Article 40.1
description: The security category of an information system will modulate the
  balance between the importance of the information it handles and the services
  it provides and the security effort required, depending on the risks to which
  it is exposed, under the principle of proportionality.
elementType: control
