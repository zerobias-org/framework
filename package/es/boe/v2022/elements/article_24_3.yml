id: c8d86bef-792c-48bb-9d6f-ada486eb132f
externalId: Article 24.3
name: Article 24.3
description: To correct or, where appropriate, demand responsibilities, each
  user who accesses the information system must be uniquely identified, so that
  it is known, at all times, who receives access rights, what type they are, and
  who has carried out a certain activity.
elementType: control
