id: 93240089-d333-4c87-979c-d0e41bf80bf8
externalId: Article 33.4
name: Article 33.4
description: When an operator with an impact on the National Defense suffers an
  incident, he must analyze whether, due to its scope, it could have an impact
  on the functioning of the Ministry of Defense or on the operation of the Armed
  Forces, he will immediately inform his Reference CSIRT, who will inform the
  response capacity and reference security incidents for the field of national
  Defense, called ESPDEF-CERT, of the Joint Cyberspace Command (MCCE) through
  the established channels. In these cases, the ESPDEF-CERT of the Joint
  Cyberspace Command must be promptly informed of the evolution of the incident
  management and may collaborate in supervision with the competent authority.
elementType: control
