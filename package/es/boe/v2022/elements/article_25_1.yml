id: 5a99667f-55bd-4f04-8248-0d869be0e90e
externalId: Article 25.1
name: Article 25.1
description: The entity that owns the information systems within the scope of
  this royal decree will have security incident management procedures in
  accordance with the provisions of article 33, the corresponding Technical
  Security Instruction and, in the case of an operator of essential services or
  a digital service provider, in accordance with the provisions of the annex to
  Royal Decree 43/2021, of January 26, which implements Royal Decree-Law
  12/2018, of September 7, security of networks and information systems.
elementType: control
