id: fe37639d-81de-4d95-8b67-aa54bfd0a7a4
externalId: Article 40.2
name: Article 40.2
description: The determination of the security category will be carried out
  based on the assessment of the impact that an incident that affects the
  security of the information or services with detriment to the availability,
  authenticity, integrity, confidentiality or traceability would have, following
  the procedure described in Annex I.
elementType: control
