id: c297110b-ad8e-4e01-9011-f01b12557311
externalId: Article 16.2
name: Article 16.2
description: The entities within the scope of application of this royal decree
  will require, in an objective and non-discriminatory manner, that the
  organizations that provide them with security services have qualified
  professionals with suitable levels of management and maturity in the services
  provided.
elementType: control
