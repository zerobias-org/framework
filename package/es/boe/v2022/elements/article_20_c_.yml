id: 57468088-d6a0-41d9-996b-f09cbbd5f449
externalId: Article 20(c)
name: Article 20(c)
description: Functions that are unnecessary or inappropriate for the intended
  purpose will be eliminated or deactivated by controlling the configuration.
  Ordinary use of the system must be simple and safe, so that unsafe use
  requires a conscious act on the part of the user.
elementType: control
