externalId: Article 32.2
name: Article 32.2
description: The CCN will articulate the necessary procedures for the collection
  and consolidation of information, as well as the methodological aspects for
  its treatment and exploitation, through the corresponding working groups that
  are constituted for this purpose in the Sectoral Commission of Electronic
  Administration and in the competent collegiate bodies in the field of the
  General Administration of the State.
elementType: control
