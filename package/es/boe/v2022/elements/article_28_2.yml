id: 4f2eff4a-b1a8-4eb4-bba8-737d746130d1
externalId: Article 28.2
name: Article 28.2
description: The measures referred to in section 1 will have the status of
  minimum requirements, being expandable at the discretion of the person
  responsible for security, who may include additional measures, taking into
  account the state of the technology, the nature of the information processed
  or the services provided and the risks to which the affected information
  systems are exposed. The list of selected security measures will be formalized
  in a document called Declaration of Applicability, signed by the person
  responsible for security.
elementType: control
