id: c566e24a-1fa1-4ca2-80ad-b13e7e7e57ed
externalId: Article 37
name: Control mechanisms
description: Each entity that owns the information systems included in the scope
  of application of this royal decree and, where appropriate, its agencies,
  bodies, departments or units, will establish its control mechanisms to truly
  and effectively guarantee compliance with the ENS.
elementType: control
