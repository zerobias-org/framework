id: db1394bf-3838-4553-b3dd-a5675c9ad840
externalId: Article 38.2
name: Article 38.2
description: "The information systems included in the scope of article 2 will be
  subject to a process to determine their conformity with the ENS. To this end,
  MEDIUM or HIGH category systems will require an audit to certify their
  conformity, without prejudice to the security audit provided for in Article
  31, which may also serve the purposes of certification, while systems BASIC
  category will only require a self-assessment for their declaration of
  conformity, without prejudice to the fact that they may also undergo a
  certification audit.\r

  \r

  Both the self-assessment procedure and the certification audit will be carried
  out in accordance with the provisions of article 31 and annex III and in the
  terms determined in the corresponding Technical Safety Instruction, which will
  also specify the requirements required of the certifying entities."
elementType: control
