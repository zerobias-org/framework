id: 466bc10e-d1b6-4f3b-aa4a-82cb88d49938
externalId: Article 7.2
name: Article 7.2
description: Risk management will allow the maintenance of a controlled
  environment, minimizing risks to acceptable levels. The reduction to these
  levels will be carried out through an appropriate application of security
  measures, in a balanced manner and proportionate to the nature of the
  information processed, the services to be provided and the risks to which they
  are exposed.
elementType: control
