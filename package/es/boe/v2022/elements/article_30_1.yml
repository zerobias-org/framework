id: 97f00cc3-e8d8-40bf-870d-bb27530b87c2
externalId: Article 30.1
name: Article 30.1
description: By virtue of the principle of proportionality and seeking an
  effective and efficient application of the ENS to certain entities or specific
  sectors of activity, specific compliance profiles may be implemented that will
  include that set of security measures that, resulting from the mandatory risk
  analysis , are suitable for a specific security category.
elementType: control
