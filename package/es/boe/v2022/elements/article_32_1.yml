id: 3745e8ed-869c-4674-b1c5-7b894b933b47
externalId: Article 32.1
name: Article 32.1
description: The Sectoral Commission for Electronic Administration will collect
  information related to the state of the main security variables in the
  information systems referred to in this royal decree, so that it allows the
  elaboration of a general profile of the state of security in the entities that
  own the information systems included in the scope of application of article 2,
  which will be reflected in the corresponding report.
elementType: control
