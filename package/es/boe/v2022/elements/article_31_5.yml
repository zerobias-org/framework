id: 1e23c443-4581-476b-8924-5a5d922e93fc
externalId: Article 31.5
name: Article 31.5
description: The audit reports will be presented to the person responsible for
  the system and the person responsible for security. These reports will be
  analyzed by the latter who will present their conclusions to the person
  responsible for the system so that appropriate corrective measures can be
  taken.
elementType: control
