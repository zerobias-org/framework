id: 9b2ba1df-30e0-4649-9038-195b64f8a27d
externalId: Article 13.3
name: Article 13.3
description: The person responsible for security will be different from the
  person responsible for the system, and there should be no hierarchical
  dependency between the two. In those exceptional situations in which the
  justified absence of resources makes it necessary for both functions to fall
  to the same person or to different people between whom there is a hierarchical
  relationship, compensatory measures must be applied to guarantee the purpose
  of the principle of differentiation of responsibilities provided for in the
  article 11.
elementType: control
