id: c7d01569-d69b-4cd2-bae1-6e2f62f503e9
externalId: Article 24.1
name: Article 24.1
description: With the purpose of satisfying the purpose of this royal decree,
  with full guarantees of the right to honor, personal and family privacy and
  the self-image of those affected, and in accordance with the regulations on
  the protection of personal data, of function public or labor, and other
  provisions that may be applicable, the activities of the users will be
  recorded, retaining the information strictly necessary to monitor, analyze,
  investigate and document improper or unauthorized activities, allowing the
  person acting to be identified at all times.
elementType: control
