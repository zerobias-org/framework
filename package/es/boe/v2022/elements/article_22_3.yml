id: 4de5aea2-7b56-4c6d-af13-2de6389b3540
externalId: Article 22.3
name: Article 22.3
description: All information in non-electronic support that has been the direct
  cause or consequence of the electronic information referred to in this royal
  decree must be protected with the same degree of security as this. To do this,
  the measures that correspond to the nature of the support will be applied, in
  accordance with the applicable regulations.
elementType: control
