externalId: Article 31.6
name: Article 31.6
description: In the case of HIGH category systems, given the audit opinion and
  taking into account the eventual severity of the deficiencies found, the
  person responsible for the system may temporarily suspend the processing of
  information, the provision of services or the total operation of the system. ,
  until its adequate correction or mitigation.
elementType: control
