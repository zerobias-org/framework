id: 9a1a8068-4214-4411-9d3d-a3a7da8f8ec2
externalId: Article 30.2
name: Article 30.2
description: In a manner analogous to what is provided in the previous section,
  to enable the adequate implementation and configuration of solutions or
  platforms supplied by third parties, which are going to be used by the
  entities included in the scope of application of this royal decree, they may
  be implemented accreditation schemes for entities and validation of people,
  which guarantee the security of said solutions or platforms and compliance
  with the provisions of this royal decree.
elementType: control
