id: 194aa4ed-7c52-4f4d-93f8-244e37fd4632
externalId: Article 12.2
name: Article 12.2
description: "Each public administration will have a security policy formally
  approved by the competent body. Likewise, each body or entity with its own
  legal personality included in the subjective scope of article 2 must have a
  security policy formally approved by the competent body.\r

  \r

  However, all or part of the subjects of an institutional public sector may be
  included in the subjective scope of the security policy approved by the
  Administration with which they have a relationship, dependence or affiliation,
  when so determined by the bodies. competent in the exercise of organizational
  powers."
elementType: control
