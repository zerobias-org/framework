id: 7332260a-b0eb-4ee1-af5d-8f1a6b3638b6
externalId: Article 27
name: Continuous improvement of the security process.
description: The comprehensive security process implemented must be continually
  updated and improved. To this end, the criteria and methods recognized in
  national and international practice relating to information technology
  security management will be applied.
elementType: control
