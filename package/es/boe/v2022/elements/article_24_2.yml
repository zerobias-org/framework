id: a1eb3e8f-865f-4b80-8165-6f81e771a733
externalId: Article 24.2
name: Article 24.2
description: In order to preserve the security of information systems,
  guaranteeing rigorous observance of the principles of action of public
  Administrations, and in accordance with the provisions of the General Data
  Protection Regulation and respect for the principles of limitation of the
  purpose, minimization of data and limitation of the conservation period stated
  therein, the subjects included in article 2 may, to the extent strictly
  necessary and proportionate, analyze incoming or outgoing communications, and
  only for the purposes of security of the information, so that it is possible
  to prevent unauthorized access to networks and information systems, stop
  denial of service attacks, prevent malicious distribution of harmful code as
  well as other damage to the aforementioned networks and information systems.
elementType: control
