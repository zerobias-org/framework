id: 9664d211-a471-4141-bb97-eeb9756823de
externalId: Article 13.5
name: Article 13.5
description: "In the case of outsourced services, except for justified and
  documented cause, the organization providing said services must designate a
  POC (Point or Contact Person) for the security of the information processed
  and the service provided, who has the support of the management bodies, and
  that channels and supervises both compliance with the security requirements of
  the service it provides or solution it provides, as well as communications
  related to information security and incident management for the scope of said
  service.\r

  \r

  Said security POC will be the Security Manager of the contracted organization,
  will be part of its area or will have direct communication with it. All this
  without prejudice to the fact that the ultimate responsibility resides with
  the public sector entity receiving the aforementioned services."
elementType: control
