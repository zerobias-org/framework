id: 8367c88f-6a84-471e-9e57-20e3fc11cb4e
externalId: § 164.308(a)(8)
name: "Standard: Evaluation"
description: Perform a periodic technical and nontechnical evaluation, based
  initially upon the standards implemented under this rule and, subsequently, in
  response to environmental or operational changes affecting the security of
  electronic protected health information, that establishes the extent to which
  a covered entity's or business associate's security policies and procedures
  meet the requirements of this subpart.
elementType: control
