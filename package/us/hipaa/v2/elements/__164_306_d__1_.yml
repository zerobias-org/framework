id: 916e877a-9b0c-4cd4-8ce1-004caab6d9f7
externalId: § 164.306(d)(1)
name: § 164.306(d)(1)
description: Implementation specifications are required or addressable. If an
  implementation specification is required, the word “Required” appears in
  parentheses after the title of the implementation specification. If an
  implementation specification is addressable, the word “Addressable” appears in
  parentheses after the title of the implementation specification.
elementType: control
