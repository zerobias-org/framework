id: 51378952-3dd3-4ef8-9c3f-317cebb6e3f5
externalId: § 164.308(a)(7)(i)
name: "Standard: Contingency plan"
description: Establish (and implement as needed) policies and procedures for
  responding to an emergency or other occurrence (for example, fire, vandalism,
  system failure, and natural disaster) that damages systems that contain
  electronic protected health information.
elementType: control
