id: 020e70eb-598d-4ca3-95a0-a9a43cceb0c1
externalId: § 164.308(b)(1)
name: § 164.308(b)(1)
description: A covered entity may permit a business associate to create,
  receive, maintain, or transmit electronic protected health information on the
  covered entity's behalf only if the covered entity obtains satisfactory
  assurances, in accordance with § 164.314(a), that the business associate will
  appropriately safeguard the information. A covered entity is not required to
  obtain such satisfactory assurances from a business associate that is a
  subcontractor.
elementType: control
