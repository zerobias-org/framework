id: 7cc39fd1-b15a-4d87-83d2-119d96f12afb
externalId: § 164.306(e)
name: Maintenance
description: A covered entity or business associate must review and modify the
  security measures implemented under this subpart as needed to continue
  provision of reasonable and appropriate protection of electronic protected
  health information, and update documentation of such security measures in
  accordance with § 164.316(b)(2)(iii).
elementType: control
