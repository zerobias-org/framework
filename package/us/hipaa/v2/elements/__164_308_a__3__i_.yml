id: 593d960b-d0bf-4a7d-8aab-392d9fc3c638
externalId: § 164.308(a)(3)(i)
name: "Standard: Workforce security"
description: Implement policies and procedures to ensure that all members of its
  workforce have appropriate access to electronic protected health information,
  as provided under paragraph (a)(4) of this section, and to prevent those
  workforce members who do not have access under paragraph (a)(4) of this
  section from obtaining access to electronic protected health information.
elementType: control
