name: § 164.314(a)(2)(i)(B)
description: In accordance with § 164.308(b)(2), ensure that any subcontractors
  that create, receive, maintain, or transmit electronic protected health
  information on behalf of the business associate agree to comply with the
  applicable requirements of this subpart by entering into a contract or other
  arrangement that complies with this section; and
