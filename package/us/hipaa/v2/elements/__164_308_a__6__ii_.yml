id: e61e9607-f833-4cd8-a297-66fe3c2ab3f5
externalId: § 164.308(a)(6)(ii)
name: "Implementation specification: Response and reporting (Required)"
description: Identify and respond to suspected or known security incidents;
  mitigate, to the extent practicable, harmful effects of security incidents
  that are known to the covered entity or business associate; and document
  security incidents and their outcomes.
elementType: control
