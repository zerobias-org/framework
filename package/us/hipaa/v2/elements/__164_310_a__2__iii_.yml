id: 7c5ce9aa-efdb-4c05-9463-5e75d1aeddf4
externalId: § 164.310(a)(2)(iii)
name: Access control and validation procedures (Addressable)
description: Implement procedures to control and validate a person's access to
  facilities based on their role or function, including visitor control, and
  control of access to software programs for testing and revision.
elementType: control
