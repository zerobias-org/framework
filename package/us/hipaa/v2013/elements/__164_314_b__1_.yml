id: 9df25cfe-1449-4ab8-8515-d02cbc84cd47
externalId: § 164.314(b)(1)
name: "Standard: Requirements for group health plans"
description: Except when the only electronic protected health information
  disclosed to a plan sponsor is disclosed pursuant to § 164.504(f)(1)(ii) or
  (iii), or as authorized under § 164.508, a group health plan must ensure that
  its plan documents provide that the plan sponsor will reasonably and
  appropriately safeguard electronic protected health information created,
  received, maintained, or transmitted to or by the plan sponsor on behalf of
  the group health plan.
elementType: control
