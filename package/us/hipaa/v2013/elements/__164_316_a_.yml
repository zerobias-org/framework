id: 7d597386-8d59-4c8a-ad89-cf8bbdf99c4f
externalId: § 164.316(a)
name: "Standard: Policies and procedures"
description: Implement reasonable and appropriate policies and procedures to
  comply with the standards, implementation specifications, or other
  requirements of this subpart, taking into account those factors specified in §
  164.306(b)(2)(i), (ii), (iii), and (iv). This standard is not to be construed
  to permit or excuse an action that violates any other standard, implementation
  specification, or other requirements of this subpart. A covered entity or
  business associate may change its policies and procedures at any time,
  provided that the changes are documented and are implemented in accordance
  with this subpart.
elementType: control
