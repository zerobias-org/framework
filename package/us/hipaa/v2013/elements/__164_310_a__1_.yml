id: 274f8ddf-0e6a-4db3-85fe-146989faed32
externalId: § 164.310(a)(1)
name: "Standard: Facility access controls"
description: Implement policies and procedures to limit physical access to its
  electronic information systems and the facility or facilities in which they
  are housed, while ensuring that properly authorized access is allowed.
elementType: control
