externalId: § 164.308(a)(3)(ii)(C)
name: Termination procedures (Addressable)
description: Implement procedures for terminating access to electronic protected
  health information when the employment of, or other arrangement with, a
  workforce member ends or as required by determinations made as specified in
  paragraph (a)(3)(ii)(B) of this section.
elementType: control
