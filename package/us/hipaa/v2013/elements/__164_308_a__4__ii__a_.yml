id: 14318355-d749-4fac-8625-ebd961ec1a09
externalId: § 164.308(a)(4)(ii)(A)
name: Isolating health care clearinghouse functions (Required)
description: If a health care clearinghouse is part of a larger organization,
  the clearinghouse must implement policies and procedures that protect the
  electronic protected health information of the clearinghouse from unauthorized
  access by the larger organization.
elementType: control
