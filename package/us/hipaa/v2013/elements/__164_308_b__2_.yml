id: e8b0898a-0074-4691-9f0e-c10ae5f7efd3
externalId: § 164.308(b)(2)
name: § 164.308(b)(2)
description: A business associate may permit a business associate that is a
  subcontractor to create, receive, maintain, or transmit electronic protected
  health information on its behalf only if the business associate obtains
  satisfactory assurances, in accordance with § 164.314(a), that the
  subcontractor will appropriately safeguard the information.
elementType: control
