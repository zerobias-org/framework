id: d989ae21-2923-4de9-97d6-9baba0008968
externalId: § 164.308(a)(4)(ii)(C)
name: Access establishment and modification (Addressable)
description: Implement policies and procedures that, based upon the covered
  entity's or the business associate's access authorization policies, establish,
  document, review, and modify a user's right of access to a workstation,
  transaction, program, or process.
elementType: control
