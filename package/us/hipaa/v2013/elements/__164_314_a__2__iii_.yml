id: e974daf6-21f1-41c5-98f0-0fad12194f36
externalId: § 164.314(a)(2)(iii)
name: Business associate contracts with subcontractors
description: The requirements of paragraphs (a)(2)(i) and (a)(2)(ii) of this
  section apply to the contract or other arrangement between a business
  associate and a subcontractor required by § 164.308(b)(4) in the same manner
  as such requirements apply to contracts or other arrangements between a
  covered entity and business associate.
elementType: control
