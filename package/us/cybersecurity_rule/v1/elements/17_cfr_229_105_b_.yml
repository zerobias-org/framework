externalId: 17 CFR 229.105(b)
name: 17 CFR 229.105(b)
description: Concisely explain how each risk affects the registrant or the
  securities being offered. If the discussion is longer than 15 pages, include
  in the forepart of the prospectus or annual report, as applicable, a series of
  concise, bulleted or numbered statements that is no more than two pages
  summarizing the principal factors that make an investment in the registrant or
  offering speculative or risky. If the risk factor discussion is included in a
  registration statement, it must immediately follow the summary section
  required by § 229.503 (Item 503 of Regulation S–K). If you do not include a
  summary section, the risk factor section must immediately follow the cover
  page of the prospectus or the pricing information section that immediately
  follows the cover page. Pricing information means price and price-related
  information that you may omit from the prospectus in an effective registration
  statement based on Rule 430A (§ 230.430A of this chapter). The registrant must
  furnish this information in plain English. See § 230.421(d) of Regulation C of
  this chapter.
elementType: control
