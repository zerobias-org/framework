id: 2d1049be-a83f-4beb-9c1a-1a02eb9d2217
externalId: 17 CFR 229.106(a)
name: 17 CFR 229.106(a)
description: "Definitions. For purposes of this section:\r

  \r

  Cybersecurity incident means an unauthorized occurrence, or a series of
  related unauthorized occurrences, on or conducted through a registrant's
  information systems that jeopardizes the confidentiality, integrity, or
  availability of a registrant's information systems or any information residing
  therein.\r

  \r

  Cybersecurity threat means any potential unauthorized occurrence on or
  conducted through a registrant's information systems that may result in
  adverse effects on the confidentiality, integrity, or availability of a
  registrant's information systems or any information residing therein.\r

  \r

  Information systems means electronic information resources, owned or used by
  the registrant, including physical or virtual infrastructure controlled by
  such information resources, or components thereof, organized for the
  collection, processing, maintenance, use, sharing, dissemination, or
  disposition of the registrant's information to maintain or support the
  registrant's operations."
elementType: control
