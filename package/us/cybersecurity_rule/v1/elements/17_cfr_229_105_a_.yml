id: adfc9843-b16d-431d-9ad8-eaabbdebc253
externalId: 17 CFR 229.105(a)
name: 17 CFR 229.105(a)
description: Where appropriate, provide under the caption “Risk Factors” a
  discussion of the material factors that make an investment in the registrant
  or offering speculative or risky. This discussion must be organized logically
  with relevant headings and each risk factor should be set forth under a
  subcaption that adequately describes the risk. The presentation of risks that
  could apply generically to any registrant or any offering is discouraged, but
  to the extent generic risk factors are presented, disclose them at the end of
  the risk factor section under the caption “General Risk Factors.”
elementType: control
