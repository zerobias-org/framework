id: 671dc1a7-7e96-4b70-b1be-497745c8d16d
externalId: "4.3"
name: Personally Identifiable Information (PII)
description: "For the purposes of this document, PII is information which can be
  used to distinguish or trace an individual’s identity, such as name, social
  security number, or biometric records, alone or when combined with other
  personal or identifying information which is linked or linkable to a specific
  individual, such as date and place of birth, or mother’s maiden name. Any FBI
  CJIS provided data maintained by an agency, including but not limited to,
  education, financial transactions, medical history, and criminal or employment
  history may include PII. A criminal history record for example inherently
  contains PII as would a Law Enforcement National Data Exchange (N-DEx) case
  file.\r

  PII shall be extracted from CJI for the purpose of official business only.
  Agencies shall develop policies, based on state and local privacy rules, to
  ensure appropriate controls are applied when handling PII extracted from CJI.
  Due to the expansive nature of PII, this Policy does not specify auditing,
  logging, or personnel security requirements associated with the life cycle of
  PII."
elementType: control
