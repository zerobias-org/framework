id: 06d2f0b6-a064-48b5-a54a-9197cc4af2b9
externalId: 5.1.1.7
name: Outsourcing Standards for Channelers
description: "Channelers designated to request civil fingerprint-based
  background checks or noncriminal justice ancillary functions on behalf of a
  NCJA (public) or NCJA (private) for noncriminal justice functions shall be
  eligible for access to CJI. Access shall be permitted when such designation is
  authorized pursuant to federal law or state statute approved by the U.S.
  Attorney General. All Channelers accessing CJI shall be subject to the terms
  and conditions described in the Compact Council Security and Management
  Control Outsourcing Standard. Each Channeler that directly accesses CJI shall
  also allow the FBI to conduct periodic penetration testing.\r

  Channelers leveraging CJI to perform civil functions on behalf of an
  Authorized Recipient shall meet the same training and certification criteria
  required by governmental agencies performing a similar function, and shall be
  subject to the same extent of audit review as are local user agencies."
elementType: control
