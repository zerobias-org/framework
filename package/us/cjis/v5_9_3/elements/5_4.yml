externalId: "5.4"
name: "Policy Area 4: Auditing and Accountability"
description: "Agencies shall implement audit and accountability controls to
  increase the probability of authorized users conforming to a prescribed
  pattern of behavior. Agencies shall carefully assess the inventory of
  components that compose their information systems to determine which security
  controls are applicable to the various components.\r

  Auditing controls are typically applied to the components of an information
  system that provide auditing capability (servers, etc.) and would not
  necessarily be applied to every user-level workstation within the agency. As
  technology advances, more powerful and diverse functionality can be found in
  such devices as personal digital assistants and cellular telephones, which may
  require the application of security controls in accordance with an agency
  assessment of risk.\r

  Refer to Section 5.13.6 for additional audit requirements related to mobile
  devices used to access CJI."
elementType: control
