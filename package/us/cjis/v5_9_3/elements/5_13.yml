externalId: "5.13"
name: "Policy Area 13: Mobile Devices"
description: "This policy area describes considerations and requirements for
  mobile devices including smartphones and tablets. Mobile devices are not
  limited to a single form factor or communications medium. The requirements in
  this section augment those in other areas of the Policy to address the gaps
  introduced by using mobile devices.\r

  The agency shall: (i) establish usage restrictions and implementation guidance
  for mobile devices; and (ii) authorize, monitor, control wireless access to
  the information system. Wireless technologies, in the simplest sense, enable
  one or more devices to communicate without physical connections—without
  requiring network or peripheral cabling.\r

  Appendix G provides reference material and additional information on mobile
  devices."
elementType: control
