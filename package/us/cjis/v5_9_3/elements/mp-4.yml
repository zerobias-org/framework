name: MEDIA STORAGE
description: "a. Physically control and securely store digital and non-digital
  media within physically secure locations or controlled areas and encrypt CJI
  on digital media when physical and personnel restrictions are not feasible;
  and\r

  b. Protect system media types defined in MP-4a until the media are destroyed
  or sanitized using approved equipment, techniques, and procedures."
