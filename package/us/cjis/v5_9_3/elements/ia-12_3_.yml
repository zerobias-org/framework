id: 77ea6955-df3a-4cc2-a598-667875e7df39
externalId: IA-12(3)
name: IDENTITY PROOFING | IDENTITY EVIDENCE VALIDATION AND VERIFICATION
description: "a. Require that the presented identity evidence be validated and
  verified through agency-defined resolution, validation, and verification
  methods.\r

  b. Identity proofing SHALL NOT be performed to determine suitability or
  entitlement to gain access to services or benefits.\r

  c. 1. Collection of PII SHALL be limited to the minimum necessary to resolve
  to a unique identity in a given context.\r

  2. Collection of PII SHALL be limited to the minimum necessary to validate the
  existence of the claimed identity and associate the claimed identity with the
  applicant providing identity evidence for appropriate identity resolution,
  validation, and verification..."
elementType: control
