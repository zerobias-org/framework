id: ea5ba9fe-2dcd-4636-847b-6d913baac6f3
externalId: 5.1.2
name: Monitoring, Review, and Delivery of Services
description: As specified in the interagency agreements, MCAs, and contractual
  agreements with private contractors, the services, reports and records
  provided by the service provider shall be regularly monitored and reviewed.
  The CJA, authorized agency, or FBI shall maintain sufficient overall control
  and visibility into all security aspects to include, but not limited to,
  identification of vulnerabilities and information security incident
  reporting/response. The incident reporting/response process used by the
  service provider shall conform to the incident reporting/response
  specifications provided in this Policy.
elementType: control
