id: 25b43098-877c-4ea8-960b-7afef35dde6e
externalId: AC-20(1)
name: USE OF EXTERNAL SYSTEMS | LIMITS ON AUTHORIZED USE
description: "Permit authorized individuals to use an external system to access
  the system or to process, store, or transmit organization-controlled
  information only after:\r

  a. Verification of the implementation of controls on the external system as
  specified in the organization’s security and privacy policies and security and
  privacy plans; or\r

  b. Retention of approved system connection or processing agreements with the
  organizational entity hosting the external system."
elementType: control
