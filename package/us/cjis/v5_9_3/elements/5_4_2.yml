id: 79cf8c9b-5e64-4449-8a29-96dd1b2bc5e8
externalId: 5.4.2
name: Response to Audit Processing Failures
description: "The agency’s information system shall provide alerts to
  appropriate agency officials in the event of an audit processing failure.
  Audit processing failures include, for example: software/hardware errors,
  failures in the audit capturing mechanisms, and audit storage capacity being
  reached or exceeded."
elementType: control
