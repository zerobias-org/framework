id: 51032833-a658-4d68-9c0e-e86a9ee47b5f
externalId: 5.4.4
name: Time Stamps
description: The agency’s information system shall provide time stamps for use
  in audit record generation. The time stamps shall include the date and time
  values generated by the internal system clocks in the audit records. The
  agency shall synchronize internal information system clocks on an annual
  basis.
elementType: control
