id: 750535f2-2a59-4a5b-bbe3-2ebce231720f
externalId: IA-4
name: IDENTIFIER MANAGEMENT
description: "Manage system identifiers by:\r

  a. Receiving authorization from organizational personnel with identifier
  management responsibilities to assign an individual, group, role, service, or
  device identifier;\r

  b. Selecting an identifier that identifies an individual, group, role,
  service, or device;\r

  c. Assigning the identifier to the intended individual, group, role, service,
  or device; and\r

  d. Preventing reuse of identifiers for one (1) year."
elementType: control
