id: 46ff2462-3379-46c7-9933-02ebbd090758
externalId: 4.2.4
name: Storage
description: When CHRI is stored, agencies shall establish appropriate
  administrative, technical and physical safeguards to ensure the security and
  confidentiality of the information. These records shall be stored for extended
  periods only when they are key elements for the integrity and/or utility of
  case files and/or criminal record files. See Section 5.9 for physical security
  controls.
elementType: control
