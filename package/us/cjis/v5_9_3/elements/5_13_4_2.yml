id: 22b9a275-1600-45db-9f7b-6b0b432a11f6
externalId: 5.13.4.2
name: Malicious Code Protection
description: "Appropriately configured MDM software is capable of checking the
  installed applications on the device and reporting the software inventory to a
  central management console in a manner analogous to traditional virus scan
  detection of unauthorized software and can provide a high degree of confidence
  that only known software or applications are installed on the device.\r

  Agencies that allow smartphones and tablets to access CJI shall have a process
  to approve the use of specific software or applications on the devices. Any
  device natively capable of performing these functions without a MDM solution
  is acceptable under this section."
elementType: control
