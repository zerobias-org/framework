id: 6b4db7fb-8f94-4b95-9d26-94785c5f87b3
externalId: AC-22
name: PUBLICLY ACCESSIBLE CONTENT
description: "a. Designate individuals authorized to make information publicly
  accessible;\r

  b. Train authorized individuals to ensure that publicly accessible information
  does not contain nonpublic information;\r

  c. Review the proposed content of information prior to posting onto the
  publicly accessible system to ensure that nonpublic information is not
  included; and\r

  d. Review the content on the publicly accessible system for nonpublic
  information quarterly and remove such information, if discovered."
elementType: control
