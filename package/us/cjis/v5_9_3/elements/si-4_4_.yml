id: 8e20eac1-1911-484a-ae2b-52854fb781c6
externalId: SI-4(4)
name: SYSTEM MONITORING | INBOUND AND OUTBOUND COMMUNICATIONS TRAFFIC
description: "a. Determine criteria for unusual or unauthorized activities or
  conditions for inbound and outbound communications traffic;\r

  b. Monitor inbound and outbound communications traffic continuously for
  unusual or unauthorized activities or conditions such as: the presence of
  malicious code or unauthorized use of legitimate code or credentials within
  organizational systems or propagating among system components, signaling to
  external systems, and the unauthorized exporting of information."
elementType: control
