id: 81f5ddef-7ae8-43ea-8850-cb6f830acb09
externalId: AT-1
name: POLICY AND PROCEDURES
description: "a. Develop, document, and disseminate to all personnel when their
  unescorted logical or physical access to any information system results in the
  ability, right, or privilege to view, modify, or make use of unencrypted
  CJI:\r

  1. Organization-level awareness and training policy that:\r

  (a) Addresses purpose, scope, roles, responsibilities, management commitment,
  coordination among organizational entities, and compliance; and\r

  (b) Is consistent with applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines; and\r

  2. Procedures to facilitate the implementation of the awareness and training
  policy and the associated awareness and training controls;\r

  b. Designate organizational personnel with information security awareness and
  training responsibilities to manage the development, documentation, and
  dissemination of the awareness and training policy and procedures; and\r

  c. Review and update the current awareness and training:\r

  1. Policy annually and following changes in the information system operating
  environment, when security incidents occur, or when changes to the CJIS
  Security Policy are made; and\r

  2. Procedures annually and following changes in the information system
  operating environment, when security incidents occur, or when changes to the
  CJIS Security Policy are made."
elementType: control
