id: adee0e21-3039-4606-b813-277e5a496a0c
externalId: MP-6
name: MEDIA SANITIZATION
description: "a. Sanitize or destroy digital and non-digital media prior to
  disposal, release out of agency control, or release for reuse using overwrite
  technology at least three times or degauss digital media prior to disposal or
  release for reuse by unauthorized individuals. Inoperable digital media will
  be destroyed (cut up, shredded, etc.). Physical media will be securely
  disposed of when no longer needed for investigative or security purposes,
  whichever is later. Physical media will be destroyed by crosscut shredding or
  incineration; and\r

  b. Employ sanitization mechanisms with the strength and integrity commensurate
  with the security category or classification of the information."
elementType: control
