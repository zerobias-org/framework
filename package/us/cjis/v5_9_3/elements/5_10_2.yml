id: 78f5e147-734b-4c2d-92bd-247bcceb69e5
externalId: 5.10.2
name: Facsimile Transmission of CJI
description: CJI transmitted via a single or multi-function device over a
  standard telephone line is exempt from encryption requirements. CJI
  transmitted external to a physically secure location using a facsimile server,
  application or service which implements email-like technology, shall meet the
  encryption requirements for CJI in transit as defined in Section 5.10.
elementType: control
