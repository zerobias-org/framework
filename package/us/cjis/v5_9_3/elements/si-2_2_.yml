name: FLAW REMEDIATION | AUTOMATED FLAW REMEDIATION STATUS
description: Determine if system components have applicable security-relevant
  software and firmware updates installed using vulnerability scanning tools as
  least quarterly or following any security incidents involving CJI or systems
  used to process, store, or transmit CJI.
