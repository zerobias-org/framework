id: 92c75113-a5b8-472e-afa9-e936ce407ec3
externalId: MA-2
name: CONTROLLED MAINTENANCE
description: "a. Schedule, document, and review records of maintenance, repair,
  and replacement on system components in accordance with manufacturer or vendor
  specifications and/or organizational requirements;\r

  b. Approve and monitor all maintenance activities, whether performed on site
  or remotely and whether the system or system components are serviced on site
  or removed to another location;\r

  c. Require that organizational personnel with information security and privacy
  responsibilities explicitly approve the removal of the system or system
  components from organizational facilities for off-site maintenance, repair, or
  replacement;\r

  d. Sanitize equipment to remove information from associated media prior to
  removal from organizational facilities for off-site maintenance, repair,
  replacement, or destruction;\r

  e. Check all potentially impacted controls to verify that the controls are
  still functioning properly following maintenance, repair, or replacement
  actions; and\r

  f. Include the following information in organizational maintenance records:\r

  1. Component name\r

  2. Component serial number\r

  3. Date/time of maintenance\r

  4. Maintenance performed\r

  5. Name(s) of entity performing maintenance including escort if required."
elementType: control
