externalId: 5.10.1.2.3
name: Public Key Infrastructure (PKI) Technology
description: "For agencies using public key infrastructure (PKI) technology, the
  agency shall develop and implement a certificate policy and certification
  practice statement for the issuance of public key certificates used in the
  information system. Registration to receive a public key certificate shall:\r

  1. Include authorization by a supervisor or a responsible official.\r

  2. Be accomplished by a secure process that verifies the identity of the
  certificate holder.\r

  3. Ensure the certificate is issued to the intended party."
elementType: control
