externalId: 5.1.1.1
name: Information Handling
description: "Procedures for handling and storage of information shall be
  established to protect that information from unauthorized disclosure,
  alteration or misuse. Using the requirements in this Policy as a starting
  point, the procedures shall apply to the handling, processing, storing, and
  communication of CJI. These procedures apply to the exchange of CJI no matter
  the form of exchange.\r

  The policies for information handling and protection also apply to using CJI
  shared with or received from FBI CJIS for noncriminal justice purposes. In
  general, a noncriminal justice purpose includes the use of criminal history
  records for purposes authorized by federal or state law other than purposes
  relating to the administration of criminal justice, including – but not
  limited to - employment suitability, licensing determinations, immigration and
  naturalization matters, and national security clearances."
elementType: control
