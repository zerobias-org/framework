id: 28917c43-07cb-4c5d-a5c0-5ea62560a40a
externalId: 5.7.2
name: Security of Configuration Documentation
description: The system configuration documentation often contains sensitive
  details (e.g., descriptions of applications, processes, procedures, data
  structures, authorization processes, data flow, etc.) Agencies shall protect
  the system documentation from unauthorized access consistent with the
  provisions described in Section 5.5 Access Control.
elementType: control
