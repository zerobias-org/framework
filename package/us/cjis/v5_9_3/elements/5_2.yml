id: 4f6cd02d-7dfd-4199-a763-b10b078c6c0e
externalId: "5.2"
name: AWARENESS AND TRAINING (AT)
description: Security training is key to the human element of information
  security. All users with authorized access to CJI should be made aware of
  their individual responsibilities and expected behavior when accessing CJI and
  the systems which process CJI. LASOs require enhanced training on the specific
  duties and responsibilities of those positions and the impact those positions
  have on the overall security of information systems.
elementType: control
