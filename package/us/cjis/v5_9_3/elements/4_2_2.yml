externalId: 4.2.2
name: Proper Access, Use, and Dissemination of NCIC Restricted Files Information
description: "The NCIC hosts restricted files and non-restricted files. NCIC
  restricted files are distinguished from NCIC non-restricted files by the
  policies governing their access and use. Proper access to, use, and
  dissemination of data from restricted files shall be consistent with the
  access, use, and dissemination policies concerning the III described in Title
  28, Part 20, CFR, and the NCIC Operating Manual. The restricted files, which
  shall be protected as CHRI, are as follows:\r

  1. Gang Files\r

  2. Threat Screening Center Files\r

  3. Supervised Release Files\r

  4. National Sex Offender Registry Files\r

  5. Historical Protection Order Files of the NCIC\r

  6. Identity Theft Files\r

  7. Protective Interest Files\r

  8. Person With Information (PWI) data in the Missing Person Files\r

  9. Violent Person File\r

  10. NICS Denied Transactions File\r

  The remaining NCIC files are considered non-restricted files."
elementType: control
