id: 093ebb2f-f809-4950-8965-c6d84d249439
externalId: AC-2(3)
name: ACCOUNT MANAGEMENT | DISABLE ACCOUNTS
description: "Disable accounts within one (1) week when the accounts:\r

  (a) Have expired;\r

  (b) Are no longer associated with a user or individual;\r

  (c) Are in violation of organizational policy; or\r

  (d) Have been inactive for 90 calendar days."
elementType: control
