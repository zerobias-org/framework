externalId: MP-1
name: POLICY AND PROCEDURES
description: "a. Develop, document, and disseminate to authorized individuals:\r

  1. Agency-level media protection policy that:\r

  (a) Addresses purpose, scope, roles, responsibilities, management commitment,
  coordination among agency entities, and compliance; and\r

  (b) Is consistent with applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines; and\r

  2. Procedures to facilitate the implementation of the media protection policy
  and the associated media protection controls;\r

  b. Designate an individual with security responsibilities to manage the
  development, documentation, and dissemination of the media protection policy
  and procedures; and\r

  c. Review and update the current media protection: 2\r

  1. Policy at least annually and following any security incidents involving
  digital and/or non-digital media; and\r

  2. Procedures at least annually and following any security incidents involving
  digital and/or non-digital media."
elementType: control
