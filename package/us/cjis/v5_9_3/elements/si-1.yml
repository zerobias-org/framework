id: 691ddb66-6ad0-4414-901e-25d5d62616de
externalId: SI-1
name: POLICY AND PROCEDURES
description: "a. Develop, document, and disseminate to all organizational
  personnel with system and information integrity responsibilities and
  information system owners:\r

  1. Agency-level system and information integrity policy that:\r

  (a) Addresses purpose, scope, roles, responsibilities, management commitment,
  coordination among organizational entities, and compliance; and\r

  (b) Is consistent with applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines; and\r

  2. Procedures to facilitate the implementation of the system and information
  integrity policy and the associated system and information integrity
  controls;\r

  b. Designate organizational personnel with system and information integrity
  responsibilities to manage the development, documentation, and dissemination
  of the system and information integrity policy and procedures; and\r

  c. Review and update the current system and information integrity:\r

  1. Policy annually and following any security incidents involving unauthorized
  access to CJI or systems used to process, store, or transmit CJI; and\r

  2. Procedures annually and following any security incidents involving
  unauthorized access to CJI or systems used to process, store, or transmit
  CJI."
elementType: control
