name: Criminal History Record Information (CHRI)
description: Criminal History Record Information (CHRI), sometimes informally
  referred to as “restricted data”, is a subset of CJI. Due to its comparatively
  sensitive nature, additional controls are required for the access, use and
  dissemination of CHRI. In addition to the dissemination restrictions outlined
  below, Title 28, Part 20, Code of Federal Regulations (CFR), defines CHRI and
  provides the regulatory guidance for dissemination of CHRI. While the CJIS
  Security Policy attempts to be architecturally independent, the III and the
  NCIC are specifically identified in Title 28, Part 20, CFR, and the NCIC
  Operating Manual, as associated with CHRI.
elementType: control
