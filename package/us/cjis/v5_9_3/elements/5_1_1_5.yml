name: Private Contractor User Agreements and CJIS Security Addendum
description: "The CJIS Security Addendum is a uniform addendum to an agreement
  between the government agency and a private contractor, approved by the
  Attorney General of the United States, which specifically authorizes access to
  CHRI, limits the use of the information to the purposes for which it is
  provided, ensures the security and confidentiality of the information is
  consistent with existing regulations and the CJIS Security Policy, provides
  for sanctions, and contains such other provisions as the Attorney General may
  require.\r

  Private contractors who perform criminal justice functions shall meet the same
  training and certification criteria required by governmental agencies
  performing a similar function, and shall be subject to the same extent of
  audit review as are local user agencies. All private contractors who perform
  criminal justice functions shall acknowledge, via signing of the CJIS
  Security\r

  Addendum Certification page, and abide by all aspects of the CJIS Security
  Addendum. The CJIS Security Addendum is presented in Appendix H. Modifications
  to the CJIS Security Addendum shall be enacted only by the FBI.\r

  1. Private contractors designated to perform criminal justice functions for a
  CJA shall be eligible for access to CJI. Access shall be permitted pursuant to
  an agreement which specifically identifies the agency’s purpose and scope of
  providing services for the administration of criminal justice. The agreement
  between the CJA and the private contractor shall incorporate the CJIS Security
  Addendum approved by the Director of the FBI, acting for the U.S. Attorney
  General, as referenced in Title 28 CFR 20.33 (a)(7).\r

  2. Private contractors designated to perform criminal justice functions on
  behalf of a NCJA (government) shall be eligible for access to CJI. Access
  shall be permitted pursuant to an agreement which specifically identifies the
  agency’s purpose and scope of providing services for the administration of
  criminal justice. The agreement between the NCJA and the private contractor
  shall incorporate the CJIS Security Addendum approved by the Director of the
  FBI, acting for the U.S. Attorney General, as referenced in Title 28 CFR 20.33
  (a)(7)."
