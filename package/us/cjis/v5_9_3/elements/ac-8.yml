id: c30ef658-c4a0-4d51-98eb-55c8b208b8b1
externalId: AC-8
name: SYSTEM USE NOTIFICATION
description: "a. Display a system use notification message to users before
  granting access to the system that provides privacy and security notices
  consistent with applicable laws, executive orders, directives, regulations,
  policies, standards, and guidelines and state that:\r

  1. Users are accessing a restricted information system;\r

  2. System usage may be monitored, recorded, and subject to audit;\r

  3. Unauthorized use of the system is prohibited and subject to criminal and
  civil penalties; and\r

  4. Use of the system indicates consent to monitoring and recording;\r

  b. Retain the notification message or banner on the screen until users
  acknowledge the usage conditions and take explicit actions to log on to or
  further access the system; and\r

  c. For publicly accessible systems:\r

  1. Display system use information consistent with applicable laws, executive
  orders, directives, regulations, policies, standards, and guidelines, before
  granting further access to the publicly accessible system;\r

  2. Display references, if any, to monitoring, recording, or auditing that are
  consistent with privacy accommodations for such systems that generally
  prohibit those activities; and\r

  3. Include a description of the authorized uses of the system."
elementType: control
