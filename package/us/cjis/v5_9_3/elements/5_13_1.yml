externalId: 5.13.1
name: Wireless Communications Technologies
description: "Examples of wireless communication technologies include, but are
  not limited to: 802.11, cellular, Bluetooth, satellite, microwave, and land
  mobile radio (LMR). Wireless technologies require at least the minimum
  security applied to wired technology and, based upon the specific technology
  or implementation, wireless technologies may require additional security
  controls as described below."
elementType: control
