id: 10758813-58fa-414c-868b-70232f33661e
externalId: 5.9.1.1
name: Security Perimeter
description: The perimeter of a physically secure location shall be prominently
  posted and separated from non-secure locations by physical controls. Security
  perimeters shall be defined, controlled and secured in a manner acceptable to
  the CSA or SIB.
elementType: control
