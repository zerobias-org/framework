id: 3e831f86-242d-493f-a85e-2389a486e35e
externalId: MA-3(3)
name: MAINTENANCE TOOLS | PREVENT UNAUTHORIZED REMOVAL
description: "Prevent the removal of maintenance equipment containing
  organizational information by:\r

  a. Verifying that there is no organizational information contained on the
  equipment;\r

  b. Sanitizing or destroying the equipment;\r

  c. Retaining the equipment within the facility; or\r

  d. Obtaining an exemption from organizational personnel with system
  maintenance responsibilities explicitly authorizing removal of the equipment
  from the facility."
elementType: control
