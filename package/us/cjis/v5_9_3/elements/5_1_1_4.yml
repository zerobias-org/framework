id: 4d0d7e1a-61d8-4393-aedc-cca9a8c19524
externalId: 5.1.1.4
name: Interagency and Management Control Agreements
description: A NCJA (government) designated to perform criminal justice
  functions for a CJA shall be eligible for access to the CJI. Access shall be
  permitted when such designation is authorized pursuant to executive order,
  statute, regulation, or interagency agreement. The NCJA shall sign and execute
  a management control agreement (MCA) with the CJA, which stipulates management
  control of the criminal justice function remains solely with the CJA. The MCA
  may be a separate document or included with the language of an interagency
  agreement. An example of an NCJA (government) is a city information technology
  (IT) department.
elementType: control
