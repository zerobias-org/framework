externalId: 5.1.1
name: Information Exchange
description: "Before exchanging CJI, agencies shall put formal agreements in
  place that specify security controls. The exchange of information may take
  several forms including electronic mail, instant messages, web services,
  facsimile, hard copy, and information systems sending, receiving and storing
  CJI.\r

  Information exchange agreements outline the roles, responsibilities, and data
  ownership between agencies and any external parties. Information exchange
  agreements for agencies sharing CJI data that is sent to and/or received from
  the FBI CJIS shall specify the security controls and conditions described in
  this document.\r

  Information exchange agreements shall be supported by documentation committing
  both parties to the terms of information exchange. As described in subsequent
  sections, different agreements and policies apply, depending on whether the
  parties involved are CJAs or NCJAs. See Appendix D for examples of Information
  Exchange Agreements.\r

  There may be instances, on an ad-hoc basis, where CJI is authorized for
  further dissemination to Authorized Recipients not covered by an information
  exchange agreement with the releasing agency. In these instances the
  dissemination of CJI is considered to be secondary dissemination. Law
  Enforcement and civil agencies shall have a local policy to validate a
  requestor of CJI as an authorized recipient before disseminating CJI. See
  Section 5.1.3 for secondary dissemination guidance."
elementType: control
