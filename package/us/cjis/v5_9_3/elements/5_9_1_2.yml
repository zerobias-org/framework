externalId: 5.9.1.2
name: Physical Access Authorizations
description: The agency shall develop and keep current a list of personnel with
  authorized access to the physically secure location (except for those areas
  within the permanent facility officially designated as publicly accessible) or
  shall issue credentials to authorized personnel.
elementType: control
