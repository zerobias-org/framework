name: Partitioning and Virtualization
description: As resources grow scarce, agencies are increasing the
  centralization of applications, services, and system administration. Advanced
  software now provides the ability to create virtual machines that allows
  agencies to reduce the amount of hardware needed. Although the concepts of
  partitioning and virtualization have existed for a while, the need for
  securing the partitions and virtualized machines has evolved due to the
  increasing amount of distributed processing and federated information sources
  now available across the Internet.
elementType: control
