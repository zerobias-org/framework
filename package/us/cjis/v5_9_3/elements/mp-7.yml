id: 5ab0882f-4d49-4de2-bfa9-86aa6d1c1dba
externalId: MP-7
name: MEDIA USE
description: "a. Restrict the use of digital and non-digital media on agency
  owned systems that have been approved for use in the storage, processing, or
  transmission of criminal justice information by using technical, physical, or
  administrative controls (examples below); and\r

  b. Prohibit the use of personally owned digital media devices on all agency
  owned or controlled systems that store, process, or transmit criminal justice
  information; and\r

  c. Prohibit the use of digital media devices on all agency owned or controlled
  systems that store, process, or transmit criminal justice information when
  such devices have no identifiable owner."
elementType: control
