externalId: SI-12(1)
name: INFORMATION MANAGEMENT AND RETENTION | LIMIT PERSONALLY IDENTIFIABLE
  INFORMATION ELEMENTS
description: Limit personally identifiable information being processed in the
  information life cycle to the minimum PII necessary to achieve the purpose for
  which it is collected (see Section 4.3).
