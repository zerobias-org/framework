id: 5a555b09-dab1-4e43-a8cb-c1c0024b0dfa
externalId: 5.9.1.7
name: Visitor Control
description: The agency shall control physical access by authenticating visitors
  before authorizing escorted access to the physically secure location (except
  for those areas designated as publicly accessible). The agency shall escort
  visitors at all times and monitor visitor activity.
elementType: control
