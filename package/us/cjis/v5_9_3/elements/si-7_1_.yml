name: SOFTWARE, FIRMWARE, AND INFORMATION INTEGRITY | INTEGRITY CHECKS
description: Perform an integrity check of software, firmware, and information
  systems that contain or process CJI at agency-defined transitional states or
  security relevant events at least weekly or in an automated fashion.
