id: 63cf3143-b4bf-4864-953d-d391c3ab9be7
externalId: MA-5
name: MAINTENANCE PERSONNEL
description: "a. Establish a process for maintenance personnel authorization and
  maintain a list of authorized maintenance organizations or personnel;\r

  b. Verify that non-escorted personnel performing maintenance on the system
  possess the required access authorizations; and\r

  c. Designate organizational personnel with required access authorizations and
  technical competence to supervise the maintenance activities of personnel who
  do not possess the required access authorizations."
elementType: control
