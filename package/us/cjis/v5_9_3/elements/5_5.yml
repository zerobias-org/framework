externalId: "5.5"
name: ACCESS CONTROL (AC)
description: "Access control provides the planning and implementation of
  mechanisms to restrict reading, writing, processing, and transmission of CJIS
  information and the modification of information systems, applications,
  services, and communication configurations allowing access to CJIS
  information.\r

  Refer to Section 5.13.6 for additional access control requirements related to
  mobile devices used to access CJI."
elementType: control
