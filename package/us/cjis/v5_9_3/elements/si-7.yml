id: aece440e-aacd-4e0a-ac2a-1a4e08a08657
externalId: SI-7
name: SOFTWARE, FIRMWARE, AND INFORMATION INTEGRITY
description: "a. Employ integrity verification tools to detect unauthorized
  changes to software, firmware, and information systems that contain or process
  CJI; and\r

  b. Take the following actions when unauthorized changes to the software,
  firmware, and information are detected: notify organizational personnel
  responsible for software, firmware, and/or information integrity and implement
  incident response procedures as appropriate."
elementType: control
