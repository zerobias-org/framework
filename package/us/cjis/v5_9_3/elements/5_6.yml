name: IDENTIFICATION AND AUTHENTICATION (IA)
description: Identification is a unique, auditable representation of an identity
  within an information system usually in the form of a simple character string
  for each individual user, machine, software component, or any other entity.
  Authentication refers to mechanisms or processes to verify the identity of a
  user, process, or device, as a prerequisite to allowing access to a system’s
  resources.
elementType: control
