name: For Official Purposes
description: NCIC non-restricted files are those not listed as restricted files
  in Section 4.2.2. NCIC non-restricted files information may be accessed and
  used for any authorized purpose consistent with the inquiring agency’s
  responsibility. Information obtained may be disseminated to (a) other
  government agencies or (b) private entities authorized by law to receive such
  information for any purpose consistent with their responsibilities.
