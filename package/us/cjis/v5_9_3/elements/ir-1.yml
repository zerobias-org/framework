externalId: IR-1
name: POLICY AND PROCEDURES
description: "a. Develop, document, and disseminate to all personnel when their
  unescorted logical or physical access to any information system results in the
  ability, right, or privilege to view, modify, or make use of unencrypted
  CJI:\r

  1. Agency-level incident response policy that:\r

  (a) Addresses purpose, scope, roles, responsibilities, management commitment,
  coordination among organizational entities, and compliance; and\r

  (b) Is consistent with applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines; and\r

  2. Procedures to facilitate the implementation of the incident response policy
  and the associated incident response controls;\r

  b. Designate an individual with security responsibilities to manage the
  development, documentation, and dissemination of the incident response policy
  and procedures; and\r

  c. Review and update the current incident response: 3\r

  1. Policy annually and following any security incidents involving unauthorized
  access to CJI or systems used to process, store, or transmit CJI; and\r

  2. Procedures annually and following any security incidents involving
  unauthorized access to CJI or systems used to process, store, or transmit
  CJI."
elementType: control
