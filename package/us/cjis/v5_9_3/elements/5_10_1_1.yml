id: 4085676f-b5ac-4076-928a-7abb15e7c3ec
externalId: 5.10.1.1
name: Boundary Protection
description: "The agency shall:\r

  1. Control access to networks processing CJI.\r

  2. Monitor and control communications at the external boundary of the
  information system and at key internal boundaries within the system.\r

  3. Ensure any connections to the Internet, other external networks, or
  information systems occur through controlled interfaces (e.g., proxies,
  gateways, routers, firewalls, encrypted tunnels). See Section 5.13.4.3 for
  guidance on personal firewalls.\r

  4. Employ tools and techniques to monitor network events, detect attacks, and
  provide identification of unauthorized use.\r

  5. Ensure the operational failure of the boundary protection mechanisms do not
  result in any unauthorized release of information outside of the information
  system boundary (i.e., the device “fails closed” vs. “fails open”).\r

  6. Allocate publicly accessible information system components (e.g., public
  Web servers) to separate sub networks with separate, network interfaces.
  Publicly accessible information systems residing on a virtual host shall
  follow the guidance in Section 5.10.3.2 to achieve separation."
elementType: control
