externalId: IR-2
name: INCIDENT RESPONSE TRAINING
description: "a. Provide incident response training to system users consistent
  with assigned roles and responsibilities:\r

  1. Prior to assuming an incident response role or responsibility or acquiring
  system access;\r

  2. When required by system changes; and\r

  3. Annually thereafter; and\r

  b. Review and update incident response training content annually and following
  any security incidents involving unauthorized access to CJI or systems used to
  process, store, or transmit CJI."
elementType: control
