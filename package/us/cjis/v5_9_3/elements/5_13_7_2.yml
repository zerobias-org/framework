externalId: 5.13.7.2
name: Advanced Authentication
description: When accessing CJI from an authorized mobile device, advanced
  authentication shall be used by the authorized user unless the access to CJI
  is indirect as described in Section 5.6.2.2.1. If access is indirect, then AA
  is not required.
elementType: control
