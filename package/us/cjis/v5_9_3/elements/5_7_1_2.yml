externalId: 5.7.1.2
name: Network Diagram
description: "The agency shall ensure that a complete topological drawing
  depicting the interconnectivity of the agency network, to criminal justice
  information, systems and services is maintained in a current status. See
  Appendix C for sample network diagrams.\r

  The network topological drawing shall include the following:\r

  1. All communications paths, circuits, and other components used for the
  interconnection, beginning with the agency-owned system(s) and traversing
  through all interconnected systems to the agency end-point.\r

  2. The logical location of all components (e.g., firewalls, routers, switches,
  hubs, servers, encryption devices, and computer workstations). Individual
  workstations (clients) do not have to be shown; the number of clients is
  sufficient.\r

  3. “For Official Use Only” (FOUO) markings.\r

  4. The agency name and date (day, month, and year) drawing was created or
  updated."
elementType: control
