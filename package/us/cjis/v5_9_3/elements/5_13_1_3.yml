externalId: 5.13.1.3
name: Bluetooth
description: "Bluetooth is an open standard for short-range radio frequency (RF)
  communication. Bluetooth is used primarily to establish wireless personal area
  networks (WPAN). Bluetooth technology has been integrated into many types of
  business and consumer devices, including cell phones, laptops, automobiles,
  medical devices, printers, keyboards, mice, headsets, and biometric capture
  devices.\r

  Bluetooth technology and associated devices are susceptible to general
  wireless networking threats (e.g., denial of service [DoS] attacks,
  eavesdropping, man-in-the-middle [MITM] attacks, message modification, and
  resource misappropriation) as well as specific Bluetooth-related attacks that
  target known vulnerabilities in Bluetooth implementations and specifications.
  Organizational security policy shall be used to dictate the use of Bluetooth
  and its associated devices based on the agency’s operational and business
  processes."
elementType: control
