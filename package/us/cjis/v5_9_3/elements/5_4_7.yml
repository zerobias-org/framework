id: a75a8038-1ab9-4719-ae1e-b1700c57ec71
externalId: 5.4.7
name: Logging NCIC and III Transactions
description: A log shall be maintained for a minimum of one (1) year on all NCIC
  and III transactions. The III portion of the log shall clearly identify both
  the operator and the authorized receiving agency. III logs shall also clearly
  identify the requester and the secondary recipient. The identification on the
  log shall take the form of a unique identifier that shall remain unique to the
  individual requester and to the secondary recipient throughout the minimum one
  year retention period.
elementType: control
