id: ee691a94-437c-4dc5-9ae6-2606a0a96f51
externalId: 5.11.2
name: Audits by the CSA
description: "Each CSA shall:\r

  1. At a minimum, triennially audit all CJAs and NCJAs which have direct access
  to the state system in order to ensure compliance with applicable statutes,
  regulations and policies.\r

  2. In coordination with the SIB, establish a process to periodically audit all
  NCJAs, with access to CJI, in order to ensure compliance with applicable
  statutes, regulations and policies.\r

  3. Have the authority to conduct unannounced security inspections and
  scheduled audits of Contractor facilities.\r

  4. Have the authority, on behalf of another CSA, to conduct a CSP compliance
  audit of contractor facilities and provide the results to the requesting CSA.
  If a subsequent CSA requests an audit of the same contractor facility, the CSA
  may provide the results of the previous audit unless otherwise notified by the
  requesting CSA that a new audit be performed.\r

  Note: This authority does not apply to the audit requirement outlined in the
  Security and Management Control Outsourcing Standard for Non-Channeler and
  Channelers related to outsourcing noncriminal justice administrative
  functions."
elementType: control
