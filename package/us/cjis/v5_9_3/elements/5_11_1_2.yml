id: 79a7c273-cb67-4580-8189-4730965dfea7
externalId: 5.11.1.2
name: Triennial Security Audits by the FBI CJIS Division
description: The FBI CJIS Division is authorized to conduct security audits of
  the CSA and SIB networks and systems, once every three (3) years as a minimum,
  to assess agency compliance with the CJIS Security Policy. This audit shall
  include a sample of CJAs and NCJAs. Audits may be conducted on a more frequent
  basis if the audit reveals that an agency has not complied with the CJIS
  Security Policy.
elementType: control
