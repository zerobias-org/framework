id: 10e0a4ff-bb85-4f8c-90ac-d4a6a81fda9c
externalId: 5.11.3
name: Special Security Inquiries and Audits
description: All agencies having access to CJI shall permit an inspection team
  to conduct an appropriate inquiry and audit of any alleged security
  violations. The inspection team shall be appointed by the APB and shall
  include at least one representative of the CJIS Division. All results of the
  inquiry and audit shall be reported to the APB with appropriate
  recommendations.
elementType: control
