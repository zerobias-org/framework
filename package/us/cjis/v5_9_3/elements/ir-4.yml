id: 2db0bd07-50da-489d-b8e8-953c14d2e146
externalId: IR-4
name: INCIDENT HANDLING
description: "a. Implement an incident handling capability for incidents that is
  consistent with the incident response plan and includes preparation, detection
  and analysis, containment, eradication, and recovery;\r

  b. Coordinate incident handling activities with contingency planning
  activities;\r

  c. Incorporate lessons learned from ongoing incident handling activities into
  incident response procedures, training, and testing, and implement the
  resulting changes accordingly; and\r

  d. Ensure the rigor, intensity, scope, and results of incident handling
  activities are comparable and predictable across the organization."
elementType: control
