id: cd964442-1327-4e8d-aef3-47359e6b2e64
externalId: AT-3(5)
name: ROLE-BASED TRAINING | PROCESSING PERSONALLY IDENTIFIABLE INFORMATION
description: Provide all personnel when their unescorted logical or physical
  access to any information system results in the ability, right, or privilege
  to view, modify, or make use of unencrypted CJI with initial and annual
  training in the employment and operation of personally identifiable
  information processing and transparency controls.
elementType: control
