externalId: 5.1.1.3
name: Criminal Justice Agency User Agreements
description: "Any CJA receiving access to CJI shall enter into a signed written
  agreement with the appropriate signatory authority of the CSA providing the
  access. The written agreement shall specify the FBI CJIS systems and services
  to which the agency will have access, and the FBI CJIS Division policies to
  which the agency must adhere. These agreements shall include:\r

  1. Audit.\r

  2. Dissemination.\r

  3. Hit confirmation.\r

  4. Logging.\r

  5. Quality Assurance (QA).\r

  6. Screening (Pre-Employment).\r

  7. Security.\r

  8. Timeliness.\r

  9. Training.\r

  10. Use of the system.\r

  11. Validation."
elementType: control
