externalId: 5.1.1.8
name: Outsourcing Standards for Non-Channelers
description: Contractors designated to perform noncriminal justice ancillary
  functions on behalf of a NCJA (public) or NCJA (private) for noncriminal
  justice functions shall be eligible for access to CJI. Access shall be
  permitted when such designation is authorized pursuant to federal law or state
  statute approved by the U.S. Attorney General. All contractors accessing CJI
  shall be subject to the terms and conditions described in the Compact Council
  Outsourcing Standard for Non-Channelers. Contractors leveraging CJI to perform
  civil functions on behalf of an Authorized Recipient shall meet the same
  training and certification criteria required by governmental agencies
  performing a similar function, and shall be subject to the same extent of
  audit review as are local user agencies.
elementType: control
