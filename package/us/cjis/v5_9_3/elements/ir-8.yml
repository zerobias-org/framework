id: a1c923b3-4cc4-419f-9600-6e2794744098
externalId: IR-8
name: INCIDENT RESPONSE PLAN
description: "a. Develop an incident response plan that:\r

  1. Provides the organization with a roadmap for implementing its incident
  response capability;\r

  2. Describes the structure and organization of the incident response
  capability;\r

  3. Provides a high-level approach for how the incident response capability
  fits into the overall organization;\r

  4. Meets the unique requirements of the organization, which relate to mission,
  size, structure, and functions;\r

  5. Defines reportable incidents;\r

  6. Provides metrics for measuring the incident response capability within the
  organization;\r

  7. Defines the resources and management support needed to effectively maintain
  and mature an incident response capability;\r

  8. Addresses the sharing of incident information;\r

  9. Is reviewed and approved by the organization’s/agency’s executive
  leadership annually; and\r

  10. Explicitly designates responsibility for incident response to
  organizational personnel with incident reporting responsibilities and CSO or
  CJIS WAN Official.\r

  b. Distribute copies of the incident response plan to organizational personnel
  with incident handling responsibilities;\r

  c. Update the incident response plan to address system and organizational
  changes or problems encountered during plan implementation, execution, or
  testing;\r

  d. Communicate incident response plan changes to organizational personnel with
  incident handling responsibilities; and\r

  e. Protect the incident response plan from unauthorized disclosure and
  modification."
elementType: control
