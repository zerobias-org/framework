name: "Policy Area 1: Information Exchange Agreements"
description: The information shared through communication mediums shall be
  protected with appropriate security safeguards. The agreements established by
  entities sharing information across systems and communications mediums are
  vital to ensuring all parties fully understand and agree to a set of security
  standards.
