id: bd237fd3-935b-4474-b59e-9a2a76bc652e
externalId: 5.4.3
name: Audit Monitoring, Analysis, and Reporting
description: The responsible management official shall designate an individual
  or position to review/analyze information system audit records for indications
  of inappropriate or unusual activity, investigate suspicious activity or
  suspected violations, to report findings to appropriate officials, and to take
  necessary actions. Audit review/analysis shall be conducted at a minimum once
  a week. The frequency of review/analysis should be increased when the volume
  of an agency’s processing indicates an elevated need for audit review. The
  agency shall increase the level of audit monitoring and analysis activity
  within the information system whenever there is an indication of increased
  risk to agency operations, agency assets, or individuals based on law
  enforcement information, intelligence information, or other credible sources
  of information.
elementType: control
