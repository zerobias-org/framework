name: Encryption
description: "Encryption is a form of cryptology that applies a cryptographic
  operation to provide confidentiality of (sensitive) information. Decryption is
  the reversing of the cryptographic operation to convert the information back
  into a plaintext (readable) format. There are two main types of encryption:
  symmetric encryption and asymmetric encryption (also known as public key
  encryption). Hybrid encryption solutions do exist and use both asymmetric
  encryption for client/server certificate exchange – session integrity and
  symmetric encryption for bulk data encryption – data confidentiality."
elementType: control
