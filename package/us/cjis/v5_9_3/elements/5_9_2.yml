id: 9f4ec76b-a0a7-49d1-9fdd-9a72d1642b12
externalId: 5.9.2
name: Controlled Area
description: "If an agency cannot meet all of the controls required for
  establishing a physically secure location, but has an operational need to
  access or store CJI, the agency shall designate an area, a room, or a storage
  container, as a controlled area for the purpose of day-to-day CJI access or
  storage. The agency shall, at a minimum:\r

  1. Limit access to the controlled area during CJI processing times to only
  those personnel authorized by the agency to access or view CJI.\r

  2. Lock the area, room, or storage container when unattended.\r

  3. Position information system devices and documents containing CJI in such a
  way as to prevent unauthorized individuals from access and view.\r

  4. Follow the encryption requirements found in Section 5.10.1.2 for electronic
  storage (i.e., data “at rest”) of CJI."
elementType: control
