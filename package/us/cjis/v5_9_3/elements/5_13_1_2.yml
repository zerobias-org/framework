name: Cellular Devices
description: "Cellular telephones, smartphones (i.e., Blackberry, iPhones,
  etc.), tablets, personal digital assistants (PDA), and “aircards” are examples
  of cellular handheld devices or devices that are capable of employing cellular
  technology. Additionally, cellular handheld devices typically include
  Bluetooth, infrared, and other wireless protocols capable of joining
  infrastructure networks or creating dynamic ad hoc networks.\r

  Threats to cellular handheld devices stem mainly from their size, portability,
  and available wireless interfaces and associated services. Examples of threats
  to cellular handheld devices include:\r

  1. Loss, theft, or disposal.\r

  2. Unauthorized access.\r

  3. Malware.\r

  4. Spam.\r

  5. Electronic eavesdropping.\r

  6. Electronic tracking (threat to security of data and safety of the criminal
  justice professional).\r

  7. Cloning (not as prevalent with later generation cellular technologies).\r

  8. Server-resident data."
elementType: control
