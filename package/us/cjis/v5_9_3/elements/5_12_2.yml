id: 09f98760-53a0-4eec-b510-65f44623ad05
externalId: 5.12.2
name: Personnel Termination
description: Upon termination of personnel by an interface agency, the agency
  shall immediately terminate access to local agency systems with access to CJI.
  Furthermore, the interface agency shall provide notification or other action
  to ensure access to state and other agency systems is terminated. If the
  employee is an employee of a NCJA or a Contractor, the employer shall notify
  all Interface Agencies that may be affected by the personnel change.
elementType: control
