id: 31e711d4-2a97-4ba8-8182-a7693c7d9ee1
externalId: 5.4.6
name: Audit Record Retention
description: The agency shall retain audit records for at least one (1) year.
  Once the minimum retention time period has passed, the agency shall continue
  to retain audit records until it is determined they are no longer needed for
  administrative, legal, audit, or other operational purposes. This includes,
  for example, retention and availability of audit records relative to Freedom
  of Information Act (FOIA) requests, subpoena, and law enforcement actions.
elementType: control
