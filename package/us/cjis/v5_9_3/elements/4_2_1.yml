externalId: 4.2.1
name: Proper Access, Use, and Dissemination of CHRI
description: Information obtained from the III is considered CHRI. Rules
  governing the access, use, and dissemination of CHRI are found in Title 28,
  Part 20, CFR. The III shall be accessed only for an authorized purpose.
  Further, CHRI shall only be used for an authorized purpose consistent with the
  purpose for which III was accessed. Dissemination to another agency is
  authorized if (a) the other agency is an Authorized Recipient of such
  information and is being serviced by the accessing agency, or (b) the other
  agency is performing personnel and appointment functions for criminal justice
  employment applicants.
elementType: control
