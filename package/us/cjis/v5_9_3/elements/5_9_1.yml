id: 06c3540f-8099-4021-b8b1-e2eb9a362edd
externalId: 5.9.1
name: Physically Secure Location
description: "A physically secure location is a facility, a criminal justice
  conveyance, or an area, a room, or a group of rooms within a facility with
  both the physical and personnel security controls sufficient to protect CJI
  and associated information systems. The physically secure location is subject
  to criminal justice agency management control; SIB control; FBI CJIS Security
  addendum; or a combination thereof.\r

  Sections 5.9.1.1 – 5.9.1.8 describe the physical controls required in order to
  be considered a physically secure location, while Sections 5.2 and 5.12,
  respectively, describe the minimum security awareness training and personnel
  security controls required for unescorted access to a physically secure
  location. Sections 5.5, 5.6.2.2.1, and 5.10 describe the requirements for
  technical security controls required to access CJI from within the perimeter
  of a physically secure location without AA."
elementType: control
