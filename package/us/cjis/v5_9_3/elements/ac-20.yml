id: 69300d90-4afd-454b-920e-cad20b600682
externalId: AC-20
name: USE OF EXTERNAL SYSTEMS
description: "a. Establish agency-level policies governing the use of external
  systems consistent with the trust relationships established with other
  organizations owning, operating, and/or maintaining external systems, allowing
  authorized individuals to:\r

  1. Access the system from external systems; and\r

  2. Process, store, or transmit organization-controlled information using
  external systems; or\r

  b. Prohibit the use of personally-owned information systems including mobile
  devices (i.e., bring your own device [BYOD]) and publicly accessible systems
  for accessing, processing, storing, or transmitting CJI."
elementType: control
