externalId: 5.1.1.6
name: Agency User Agreements
description: "A NCJA (public) designated to request civil fingerprint-based
  background checks, with the full consent of the individual to whom a
  background check is taking place, for noncriminal justice functions, shall be
  eligible for access to CJI. Access shall be permitted when such designation is
  authorized pursuant to federal law or state statute approved by the U.S.
  Attorney General. A NCJA (public) receiving access to CJI shall enter into a
  signed written agreement with the appropriate signatory authority of the
  CSA/SIB providing the access. An example of a NCJA (public) is a county school
  board.\r

  A NCJA (private) designated to request civil fingerprint-based background
  checks, with the full consent of the individual to whom a background check is
  taking place, for noncriminal justice functions, shall be eligible for access
  to CJI. Access shall be permitted when such designation is authorized pursuant
  to federal law or state statute approved by the U.S. Attorney General. A NCJA
  (private) receiving access to CJI shall enter into a signed written agreement
  with the appropriate signatory authority of the CSA, SIB, or authorized agency
  providing the access. An example of a NCJA (private) is a local bank.\r

  All NCJAs accessing CJI shall be subject to all pertinent areas of the CJIS
  Security Policy (see Appendix J for supplemental guidance). Each NCJA that
  directly accesses FBI CJI shall also allow the FBI to periodically test the
  ability to penetrate the FBI’s network through the external network connection
  or system."
elementType: control
