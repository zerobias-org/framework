externalId: 5.10.3.1
name: Partitioning
description: "The application, service, or information system shall separate
  user functionality (including user interface services) from information system
  management functionality.\r

  The application, service, or information system shall physically or logically
  separate user interface services (e.g., public web pages) from information
  storage and management services (e.g., database management). Separation may be
  accomplished through the use of one or more of the following:\r

  1. Different computers.\r

  2. Different central processing units.\r

  3. Different instances of the operating system.\r

  4. Different network addresses.\r

  5. Other methods approved by the FBI CJIS ISO."
elementType: control
