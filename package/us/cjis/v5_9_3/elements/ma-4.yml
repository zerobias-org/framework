id: 9bb20c42-942b-4e9d-944d-de86330cb69f
externalId: MA-4
name: NONLOCAL MAINTENANCE
description: "a. Approve and monitor nonlocal maintenance and diagnostic
  activities;\r

  b. Allow the use of nonlocal maintenance and diagnostic tools only as
  consistent with organizational policy and documented in the security plan for
  the system;\r

  c. Employ strong authentication in the establishment of nonlocal maintenance
  and diagnostic sessions;\r

  d. Maintain records for nonlocal maintenance and diagnostic activities; and\r

  e. Terminate session and network connections when nonlocal maintenance is
  completed."
elementType: control
