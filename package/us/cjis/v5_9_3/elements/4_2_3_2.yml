id: 6b012e2a-5a8e-47b0-b05a-44c254fd2eb6
externalId: 4.2.3.2
name: For Other Authorized Purposes
description: "NCIC non-restricted files may be accessed for other purposes
  consistent with the resources of the inquiring agency; however, requests for
  bulk data are discouraged. Information derived from NCIC non-restricted files
  for other than law enforcement purposes can be used by authorized criminal
  justice personnel only to confirm the status of a person or property (i.e.,
  wanted or stolen). An inquiring agency is authorized to charge a nominal
  administrative fee for such service. Non-restricted files information shall
  not be disseminated commercially.\r

  A response to a NCIC person inquiry may include NCIC restricted files
  information as well as NCIC non-restricted files information. Agencies shall
  not disseminate restricted files information for purposes other than law
  enforcement."
elementType: control
