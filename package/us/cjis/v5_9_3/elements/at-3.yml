id: 7e444da5-b194-40df-9d00-954f80001f86
externalId: AT-3
name: ROLE-BASED TRAINING
description: "a. Provide role-based security and privacy training to personnel
  with the following roles and responsibilities:\r

  • All individuals with unescorted access to a physically secure location;\r

  • General User: A user, but not a process, who is authorized to use an
  information system;\r

  • Privileged User: A user that is authorized (and, therefore, trusted) to
  perform security-relevant functions that general users are not authorized to
  perform;\r

  • Organizational Personnel with Security Responsibilities: Personnel with the
  responsibility to ensure the confidentiality, integrity, and availability of
  CJI and the implementation of technology in a manner compliant with the
  CJISSECPOL.\r

  1. Before authorizing access to the system, information, or performing
  assigned duties, and annually thereafter; and\r

  2. When required by system changes.\r

  b. Update role-based training content annually and following audits of the CSA
  and local agencies; changes in the information system operating environment;
  security incidents; or when changes are made to the CJIS Security Policy;\r

  c. Incorporate lessons learned from internal or external security incidents or
  breaches into role-based training;\r

  d. Incorporate the minimum following topics into the appropriate role-based
  training content:\r

  1. All individuals with unescorted access to a physically secure location\r

  a. Access, Use and Dissemination of Criminal History Record Information
  (CHRI), NCIC Restricted Files Information, and NCIC Non-Restricted Files
  Information Penalties\r

  b. Reporting Security Events\r

  c. Incident Response Training\r

  d. System Use Notification\r

  e. Physical Access Authorizations\r

  f. Physical Access Control\r

  g. Monitoring Physical Access\r

  h. Visitor Control\r

  i. Personnel Sanctions\r

  2. General User: A user, but not a process, who is authorized to use an
  information system. In addition to AT-3 (d) (1) above, include the following
  topics:\r

  a. Criminal Justice Information\r

  b. Proper Access, Use, and Dissemination of NCIC Non-Restricted Files
  Information\r

  c. Personally Identifiable Information\r

  d. Information Handling\r

  e. Media Storage\r

  f. Media Access\r

  g. Audit Monitoring, Analysis, and Reporting\r

  h. Access Enforcement\r

  i. Least Privilege\r

  j. System Access Control\r

  k. Access Control Criteria\r

  l. System Use Notification\r

  m. Session Lock\r

  n. Personally Owned Information Systems\r

  o. Password\r

  p. Access Control for Display Medium\r

  q. Encryption\r

  r. Malicious Code Protection\r

  s. Spam and Spyware Protection\r

  t. Cellular Devices\r

  u. Mobile Device Management\r

  v. Wireless Device Risk Mitigations\r

  w. Wireless Device Malicious Code Protection\r

  x. Literacy Training and Awareness/Social Engineering and Mining\r

  y. Identification and Authentication (Organizational Users)\r

  z. Media Protection\r

  3. Privileged User: A user that is authorized (and, therefore, trusted) to
  perform security-relevant functions that general users are not authorized to
  perform. In addition to AT-3 (d) (1) and (2) above, include the following
  topics:\r

  a. Access Control\r

  b. System and Communications Protection and Information Integrity\r

  c. Patch Management\r

  d. Data backup and storage—centralized or decentralized approach\r

  e. Most recent changes to the CJIS Security Policy\r

  4. Organizational Personnel with Security Responsibilities: Personnel with the
  responsibility to ensure the confidentiality, integrity, and availability of
  CJI and the implementation of technology in a manner compliant with the
  CJISSECPOL. In addition to AT-3 (d) (1), (2), and (3) above, include the
  following topics:\r

  a. Local Agency Security Officer Role\r

  b. Authorized Recipient Security Officer Role2\r

  c. Additional state/local/tribal/territorial or federal agency roles and
  responsibilities\r

  d. Summary of audit findings from previous state audits of local agencies\r

  e. Findings from the last FBI CJIS Division audit"
elementType: control
