id: 59f6714f-323d-4025-83fb-b99dc2629ce2
externalId: SI-4
name: SYSTEM MONITORING
description: "a. Monitor the system to detect:\r

  1. Attacks and indicators of potential attacks in accordance with the
  following monitoring objectives:\r

  a. Intrusion detection and prevention\r

  b. Malicious code protection\r

  c. Vulnerability scanning\r

  d. Audit record monitoring\r

  e. Network monitoring\r

  f. Firewall monitoring;\r

  and\r

  2. Unauthorized local, network, and remote connections;\r

  b. Identify unauthorized use of the system through the following techniques
  and methods: event logging (ref. 5.4 Audit and Accountability);\r

  c. Invoke internal monitoring capabilities or deploy monitoring devices:\r

  1. Strategically within the system to collect organization-determined
  essential information; and\r

  2. At ad hoc locations within the system to track specific types of
  transactions of interest to the organization;\r

  d. Analyze detected events and anomalies;\r

  e. Adjust the level of system monitoring activity when there is a change in
  risk to organizational operations and assets, individuals, other
  organizations, or the Nation;\r

  f. Obtain legal opinion regarding system monitoring activities; and\r

  g. Provide intrusion detection and prevention systems, malicious code
  protection software, scanning tools, audit record monitoring software, network
  monitoring, and firewall monitoring software logs to organizational personnel
  with information security responsibilities weekly."
elementType: control
