name: ACCESS CONTROL FOR MOBILE DEVICES | FULL DEVICE OR CONTAINER-BASED ENCRYPTION
description: Employ full-device encryption to protect the confidentiality and
  integrity of information on full- and limited-feature operating system mobile
  devices authorized to process, store, or transmit CJI.
