id: c7312059-ac80-4960-9df7-c73afdb43f29
externalId: 609.930(e)
name: Board reporting requirements.
description: At a minimum, each institution must report quarterly to its board
  or an appropriate committee of the board. The report must contain material
  matters related to the institution's cyber risk management program, including
  specific risks and threats.
elementType: control
