id: ccf8b42f-873b-4cd0-b94a-656fe0fe8471
externalId: 609.930(a)
name: Cyber risk management program.
description: Each System institution must implement a comprehensive, written
  cyber risk management program consistent with the size, risk profile, and
  complexity of the institution's operations. The program must ensure controls
  exist to protect the security and confidentiality of current, former, and
  potential customer and employee information, protect against reasonably
  anticipated cyber threats or hazards to the security or integrity of such
  information, and protect against unauthorized access to or use of such
  information.
elementType: control
