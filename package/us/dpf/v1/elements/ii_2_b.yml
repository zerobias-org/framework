externalId: II.2.b
name: Choice
description: By derogation to the previous paragraph, it is not necessary to
  provide choice when disclosure is made to a third party that is acting as an
  agent to perform task(s) on behalf of and under the instructions of the
  organization. However, an organization shall always enter into a contract with
  the agent.
elementType: control
