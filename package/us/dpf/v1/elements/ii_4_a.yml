id: 555abdaa-4b10-48c6-b7df-defdec2a05a1
externalId: II.4.a
name: Security
description: Organizations creating, maintaining, using or disseminating
  personal information must take reasonable and appropriate measures to protect
  it from loss, misuse and unauthorized access, disclosure, alteration and
  destruction, taking into due account the risks involved in the processing and
  the nature of the personal data.
elementType: control
