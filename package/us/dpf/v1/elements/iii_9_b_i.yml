externalId: III.9.b.i
name: Human Resources Data
description: A U.S. organization that has received employee information from the
  EU under the EU-U.S. DPF may disclose it to third parties or use it for
  different purposes only in accordance with the Notice and Choice Principles.
  For example, where an organization intends to use personal information
  collected through the employment relationship for non-employmentrelated
  purposes, such as marketing communications, the U.S. organization must provide
  the affected individuals with the requisite choice before doing so, unless
  they have already authorized the use of the information for such purposes.
  Such use must not be incompatible with the purposes for which the personal
  information has been collected or subsequently authorized by the individual.
  Moreover, such choices must not be used to restrict employment opportunities
  or take any punitive action against such employees.
elementType: control
