id: 88888de1-5762-46b6-be94-62ab66338aaa
externalId: III.15.a
name: Public Record and Publicly Available Information
description: An organization must apply the Principles of Security, Data
  Integrity and Purpose Limitation, and Recourse, Enforcement and Liability to
  personal data from publicly available sources. These Principles shall apply
  also to personal data collected from public records (i.e., those records kept
  by government agencies or entities at any level that are open to consultation
  by the public in general).
elementType: control
