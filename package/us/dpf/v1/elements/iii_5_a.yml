id: 2dcf4c3e-4a76-4977-bcbf-f5b91b3947ac
externalId: III.5.a
name: The Role of the Data Protection Authorities
description: "Organizations will implement their commitment to cooperate with
  DPAs as described below. Under the EU-U.S. DPF, U.S. organizations receiving
  personal data from the EU must commit to employ effective mechanisms for
  assuring compliance with the Principles. More specifically as set out in the
  Recourse, Enforcement and Liability Principle, participating organizations
  must provide: (a)(i) recourse for individuals to whom the data relate; (a)(ii)
  follow-up procedures for verifying that the attestations and assertions they
  have made about their privacy practices are true; and (a)(iii) obligations to
  remedy problems arising out of failure to comply with the Principles and
  consequences for such organizations. An organization may satisfy points (a)(i)
  and (a)(iii) of the Recourse, Enforcement and Liability Principle if it
  adheres to the requirements set forth here for cooperating with the DPAs."
elementType: control
