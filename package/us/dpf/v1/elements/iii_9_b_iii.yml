externalId: III.9.b.iii
name: Human Resources Data
description: In addition, employers should make reasonable efforts to
  accommodate employee privacy preferences. This could include, for example,
  restricting access to the personal data, anonymizing certain data, or
  assigning codes or pseudonyms when the actual names are not required for the
  management purpose at hand.
elementType: control
