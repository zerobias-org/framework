id: 44383075-54d6-4a23-9b8d-617192ec49f3
externalId: II.1.b
name: Notice
description: This notice must be provided in clear and conspicuous language when
  individuals are first asked to provide personal information to the
  organization or as soon thereafter as is practicable, but in any event before
  the organization uses such information for a purpose other than that for which
  it was originally collected or processed by the transferring organization or
  discloses it for the first time to a third party.
elementType: control
