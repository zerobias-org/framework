externalId: III.8.e.i
name: Access
description: "As organizations must always make good faith efforts to provide
  individuals with access to their personal data, the circumstances in which
  organizations may restrict such access are limited, and any reasons for
  restricting access must be specific. As under the GDPR, an organization can
  restrict access to information to the extent that disclosure is likely to
  interfere with the safeguarding of important countervailing public interests,
  such as national security; defense; or public security. In addition, where
  personal information is processed solely for research or statistical purposes,
  access may be denied. Other reasons for denying or limiting access are:"
elementType: control
