id: e451bc4a-8735-43a6-a0df-128b9dd07b3b
externalId: III.8.a.iii
name: Access
description: Consistent with the fundamental nature of access, organizations
  should always make good faith efforts to provide access. For example, where
  certain information needs to be protected and can be readily separated from
  other personal information subject to an access request, the organization
  should redact the protected information and make available the other
  information. If an organization determines that access should be restricted in
  any particular instance, it should provide the individual requesting access
  with an explanation of why it has made that determination and a contact point
  for any further inquiries.
elementType: control
