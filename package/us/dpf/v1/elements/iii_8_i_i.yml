id: 3ca5e02e-8694-4a60-9e61-8bf75dd924d0
externalId: III.8.i.i
name: Access
description: Organizations should respond to access requests within a reasonable
  time period, in a reasonable manner, and in a form that is readily
  intelligible to the individual. An organization that provides information to
  data subjects at regular intervals may satisfy an individual access request
  with its regular disclosure if it would not constitute an excessive delay.
elementType: control
