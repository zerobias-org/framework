id: bf3dcc99-75f5-4b81-8979-d9fa409bbdee
externalId: III.10.b.i
name: Obligatory Contracts for Onward Transfers
description: When personal information is transferred between two controllers
  within a controlled group of corporations or entities, a contract is not
  always required under the Accountability for Onward Transfer Principle. Data
  controllers within a controlled group of corporations or entities may base
  such transfers on other instruments, such as EU Binding Corporate Rules or
  other intra-group instruments (e.g., compliance and control programs),
  ensuring the continuity of protection of personal information under the
  Principles. In case of such transfers, the participating organization remains
  responsible for compliance with the Principles.
elementType: control
