id: f8911851-45b6-4c63-ad6f-c72689c23e58
externalId: II.7.d
name: Recourse, Enforcement and Liability
description: In the context of an onward transfer, a participating organization
  has responsibility for the processing of personal information it receives
  under the EU-U.S. DPF and subsequently transfers to a third party acting as an
  agent on its behalf. The participating organization shall remain liable under
  the Principles if its agent processes such personal information in a manner
  inconsistent with the Principles, unless the organization proves that it is
  not responsible for the event giving rise to the damage.
elementType: control
