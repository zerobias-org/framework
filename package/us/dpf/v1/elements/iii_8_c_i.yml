id: 89556750-032d-4d13-9ebb-3ef08c95ee2c
externalId: III.8.c.i
name: Access
description: Confidential commercial information is information that an
  organization has taken steps to protect from disclosure, where disclosure
  would help a competitor in the market. Organizations may deny or limit access
  to the extent that granting full access would reveal its own confidential
  commercial information, such as marketing inferences or classifications
  generated by the organization, or the confidential commercial information of
  another that is subject to a contractual obligation of confidentiality.
elementType: control
