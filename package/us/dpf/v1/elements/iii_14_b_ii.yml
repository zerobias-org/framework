id: 158577ce-bfe0-4a96-8b87-5b94d0430d4b
externalId: III.14.b.ii
name: Pharmaceutical and Medical Products
description: It is understood that not all future uses of the data can be
  specified, since a new research use could arise from new insights on the
  original data, new medical discoveries and advances, and public health and
  regulatory developments. Where appropriate, the notice should therefore
  include an explanation that personal data may be used in future medical and
  pharmaceutical research activities that are unanticipated. If the use is not
  consistent with the general research purpose(s) for which the personal data
  were originally collected, or to which the individual has consented
  subsequently, new consent must be obtained.
elementType: control
