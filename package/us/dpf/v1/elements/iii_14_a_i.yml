name: Pharmaceutical and Medical Products
description: EU/Member State law applies to the collection of the personal data
  and to any processing that takes place prior to the transfer to the United
  States. The Principles apply to the data once they have been transferred to
  the United States. Data used for pharmaceutical research and other purposes
  should be anonymized when appropriate.
