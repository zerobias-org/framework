id: e27f2078-4c36-4806-86ee-89a45d1eb242
externalId: III.9.c.i
name: Human Resources Data
description: The Supplemental Principle on Access provides guidance on reasons
  which may justify denying or limiting access on request in the human resources
  context. Of course, employers in the EU must comply with local regulations and
  ensure that EU employees have access to such information as is required by law
  in their home countries, regardless of the location of data processing and
  storage. The EU-U.S. DPF requires that an organization processing such data in
  the United States will cooperate in providing such access either directly or
  through the EU employer.
elementType: control
