externalId: III.14.d.i
name: Pharmaceutical and Medical Products
description: Pharmaceutical and medical device companies are allowed to provide
  personal data from clinical trials conducted in the EU to regulators in the
  United States for regulatory and supervision purposes. Similar transfers are
  allowed to parties other than regulators, such as company locations and other
  researchers, consistent with the Principles of Notice and Choice.
elementType: control
