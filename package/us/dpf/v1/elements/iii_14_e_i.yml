id: a4d829d7-a591-4487-b530-961e622bdee5
externalId: III.14.e.i
name: Pharmaceutical and Medical Products
description: To ensure objectivity in many clinical trials, participants, and
  often investigators as well, cannot be given access to information about which
  treatment each participant may be receiving. Doing so would jeopardize the
  validity of the research study and results. Participants in such clinical
  trials (referred to as “blinded” studies) do not have to be provided access to
  the data on their treatment during the trial if this restriction has been
  explained when the participant entered the trial and the disclosure of such
  information would jeopardize the integrity of the research effort.
elementType: control
