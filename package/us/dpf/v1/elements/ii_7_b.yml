id: 5d38ce8b-0b32-436e-a1e5-e772de028c75
externalId: II.7.b
name: Recourse, Enforcement and Liability
description: Organizations and their selected independent recourse mechanisms
  will respond promptly to inquiries and requests by the Department for
  information relating to the EU-U.S. DPF. All organizations must respond
  expeditiously to complaints regarding compliance with the Principles referred
  by EU Member State authorities through the Department. Organizations that have
  chosen to cooperate with DPAs, including organizations that process human
  resources data, must respond directly to such authorities with regard to the
  investigation and resolution of complaints.
elementType: control
