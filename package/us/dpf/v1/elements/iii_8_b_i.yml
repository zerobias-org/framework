id: c931a3f7-56fd-49fa-99bf-3e3120cdb00e
externalId: III.8.b.i
name: Access
description: The right of access to personal data may be restricted in
  exceptional circumstances where the legitimate rights of persons other than
  the individual would be violated or where the burden or expense of providing
  access would be disproportionate to the risks to the individual’s privacy in
  the case in question. Expense and burden are important factors and should be
  taken into account but they are not controlling factors in determining whether
  providing access is reasonable.
elementType: control
