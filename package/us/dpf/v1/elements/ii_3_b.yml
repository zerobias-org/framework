id: 79d20a74-f6eb-4eac-ba44-c008e97f39b5
externalId: II.3.b
name: Accountability for Onward Transfer
description: "To transfer personal data to a third party acting as an agent,
  organizations must: (i) transfer such data only for limited and specified
  purposes; (ii) ascertain that the agent is obligated to provide at least the
  same level of privacy protection as is required by the Principles; (iii) take
  reasonable and appropriate steps to ensure that the agent effectively
  processes the personal information transferred in a manner consistent with the
  organization’s obligations under the Principles; (iv) require the agent to
  notify the organization if it makes a determination that it can no longer meet
  its obligation to provide the same level of protection as is required by the
  Principles; (v) upon notice, including under (iv), take reasonable and
  appropriate steps to stop and remediate unauthorized processing; and (vi)
  provide a summary or a representative copy of the relevant privacy provisions
  of its contract with that agent to the Department upon request."
elementType: control
