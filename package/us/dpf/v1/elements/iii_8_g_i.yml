id: 004cb273-6449-49d5-abea-d43dd2a2872f
externalId: III.8.g.i
name: Access
description: An organization may set reasonable limits on the number of times
  within a given period that access requests from a particular individual will
  be met. In setting such limitations, an organization should consider such
  factors as the frequency with which information is updated, the purpose for
  which the data are used, and the nature of the information.
elementType: control
