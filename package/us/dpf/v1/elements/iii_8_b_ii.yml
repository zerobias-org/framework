id: 62f108b9-89e6-4ade-bd27-ef5e6ee48edd
externalId: III.8.b.ii
name: Access
description: For example, if the personal information is used for decisions that
  will significantly affect the individual (e.g., the denial or grant of
  important benefits, such as insurance, a mortgage, or a job), then consistent
  with the other provisions of these Supplemental Principles, the organization
  would have to disclose that information even if it is relatively difficult or
  expensive to provide. If the personal information requested is not sensitive
  or not used for decisions that will significantly affect the individual, but
  is readily available and inexpensive to provide, an organization would have to
  provide access to such information.
elementType: control
