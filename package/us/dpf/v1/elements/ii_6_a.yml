id: 1ba5e5b2-ea8d-4bd0-b57a-1b9866cba89b
externalId: II.6.a
name: Access
description: Individuals must have access to personal information about them
  that an organization holds and be able to correct, amend, or delete that
  information where it is inaccurate, or has been processed in violation of the
  Principles, except where the burden or expense of providing access would be
  disproportionate to the risks to the individual’s privacy in the case in
  question, or where the rights of persons other than the individual would be
  violated.
elementType: control
