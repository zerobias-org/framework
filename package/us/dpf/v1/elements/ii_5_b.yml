id: 30cb1eeb-2a8b-43f3-81a3-8bbe7fcb0521
externalId: II.5.b
name: Data Integrity and Purpose Limitation
description: Information may be retained in a form identifying or making
  identifiable7 the individual only for as long as it serves a purpose of
  processing within the meaning of 5(a). This obligation does not prevent
  organizations from processing personal information for longer periods for the
  time and to the extent such processing reasonably serves the purposes of
  archiving in the public interest, journalism, literature and art, scientific
  or historical research, and statistical analysis. In these cases, such
  processing shall be subject to the other principles and provisions of the
  EU-U.S. DPF. Organizations should take reasonable and appropriate measures in
  complying with this provision.
elementType: control
