externalId: III.14.e.ii
name: Pharmaceutical and Medical Products
description: Agreement to participate in the trial under these conditions is a
  reasonable forgoing of the right of access. Following the conclusion of the
  trial and analysis of the results, participants should have access to their
  data if they request it. They should seek it primarily from the physician or
  other health care provider from whom they received treatment within the
  clinical trial, or secondarily from the sponsoring organization.
elementType: control
