id: 0e77df44-6017-48fc-9ef9-f2f6c3cef88a
externalId: III.11.d.i
name: Dispute Resolution and Enforcement
description: Individuals should be encouraged to raise any complaints they may
  have with the relevant organization before proceeding to independent recourse
  mechanisms. Organizations must respond to an individual within 45 days of
  receiving a complaint. Whether a recourse mechanism is independent is a
  factual question that can be demonstrated notably by impartiality, transparent
  composition and financing, and a proven track record. As required by the
  Recourse, Enforcement and Liability Principle, the recourse available to
  individuals must be readily available and free of charge to individuals.
  Independent dispute resolution bodies should look into each complaint received
  from individuals unless they are obviously unfounded or frivolous. This does
  not preclude the establishment of eligibility requirements by the independent
  dispute resolution body operating the recourse mechanism, but such
  requirements should be transparent and justified (for example, to exclude
  complaints that fall outside the scope of the program or are for consideration
  in another forum), and should not have the effect of undermining the
  commitment to look into legitimate complaints. In addition, recourse
  mechanisms should provide individuals with full and readily available
  information about how the dispute resolution procedure works when they file a
  complaint. Such information should include notice about the mechanism’s
  privacy practices, in conformity with the Principles. They should also
  cooperate in the development of tools, such as standard complaint forms to
  facilitate the complaint resolution process.
elementType: control
