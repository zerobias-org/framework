externalId: III.14.b.i
name: Pharmaceutical and Medical Products
description: Personal data developed in specific medical or pharmaceutical
  research studies often play a valuable role in future scientific research.
  Where personal data collected for one research study are transferred to a U.S.
  organization in the EU-U.S. DPF, the organization may use the data for a new
  scientific research activity if appropriate notice and choice have been
  provided in the first instance. Such notice should provide information about
  any future specific uses of the data, such as periodic follow up, related
  studies, or marketing.
elementType: control
