id: 0207df3e-19fa-4a4c-a4c5-13c581705391
externalId: III.10.c.i
name: Obligatory Contracts for Onward Transfers
description: For transfers between controllers, the recipient controller need
  not be a participating organization or have an independent recourse mechanism.
  The participating organization must enter into a contract with the recipient
  third-party controller that provides for the same level of protection as is
  available under the EU-U.S. DPF, not including the requirement that the third
  party controller be a participating organization or have an independent
  recourse mechanism, provided it makes available an equivalent mechanism.
elementType: control
