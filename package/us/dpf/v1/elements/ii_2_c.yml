id: adfcffea-fd5c-4df0-8095-b8886606c6a7
externalId: II.2.c
name: Choice
description: For sensitive information (i.e., personal information specifying
  medical or health conditions, racial or ethnic origin, political opinions,
  religious or philosophical beliefs, trade union membership or information
  specifying the sex life of the individual), organizations must obtain
  affirmative express consent (i.e., opt in) from individuals if such
  information is to be (i) disclosed to a third party or (ii) used for a purpose
  other than those for which it was originally collected or subsequently
  authorized by the individuals through the exercise of opt-in choice. In
  addition, an organization should treat as sensitive any personal information
  received from a third party where the third party identifies and treats it as
  sensitive.
elementType: control
