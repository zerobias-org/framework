id: 947f67ae-b120-47cc-85e0-668453ddde72
externalId: III.14.g.i
name: Pharmaceutical and Medical Products
description: Invariably, research data are uniquely key-coded at their origin by
  the principal investigator so as not to reveal the identity of individual data
  subjects. Pharmaceutical companies sponsoring such research do not receive the
  key. The unique key code is held only by the researcher, so that he or she can
  identify the research subject under special circumstances (e.g., if follow-up
  medical attention is required). A transfer from the EU to the United States of
  data coded in this way that is EU personal data under EU law would be covered
  by the Principles.
elementType: control
