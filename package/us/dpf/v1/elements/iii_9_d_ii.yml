externalId: III.9.d.ii
name: Human Resources Data
description: A U.S. organization participating in the EU-U.S. DPF that uses EU
  human resources data transferred from the EU in the context of the employment
  relationship and that wishes such transfers to be covered by the EU-U.S. DPF
  must therefore commit to cooperate in investigations by and to comply with the
  advice of competent EU authorities in such cases.
elementType: control
