id: 98ba8b25-d2b6-415c-8ed8-35cc4eee087a
externalId: III.12.b
name: Choice - Timing of Opt Out
description: Similarly, an organization may use information for certain direct
  marketing purposes when it is impracticable to provide the individual with an
  opportunity to opt out before using the information, if the organization
  promptly gives the individual such opportunity at the same time (and upon
  request at any time) to decline (at no cost to the individual) to receive any
  further direct marketing communications and the organization complies with the
  individual’s wishes.
elementType: control
