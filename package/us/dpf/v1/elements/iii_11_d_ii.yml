id: 7149d319-fbf4-4faa-abce-35d0def49366
externalId: III.11.d.ii
name: Dispute Resolution and Enforcement
description: "Independent recourse mechanisms must include on their public
  websites information regarding the Principles and the services that they
  provide under the EU-U.S. DPF. This information must include: (1) information
  on or a link to the Principles’ requirements for independent recourse
  mechanisms; (2) a link to the Department’s Data Privacy Framework website; (3)
  an explanation that their dispute resolution services under the EUU. S. DPF
  are free of charge to individuals; (4) a description of how a
  Principles-related complaint can be filed; (5) the timeframe in which
  Principles-related complaints are processed; and (6) a description of the
  range of potential remedies."
elementType: control
