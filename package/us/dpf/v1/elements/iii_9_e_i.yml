id: 0b0f1947-2123-45a3-9954-a3d3ad8bd42f
externalId: III.9.e.i
name: Human Resources Data
description: For occasional employment-related operational needs of the
  participating organization with respect to personal data transferred under the
  EU-U.S. DPF, such as the booking of a flight, hotel room, or insurance
  coverage, transfers of personal data of a small number of employees can take
  place to controllers without application of the Access Principle or entering
  into a contract with the third-party controller, as otherwise required under
  the Accountability for Onward Transfer Principle, provided that the
  participating organization has complied with the Notice and Choice Principles.
elementType: control
