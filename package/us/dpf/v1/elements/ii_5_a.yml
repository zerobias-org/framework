id: 1c7ad35c-83df-4c27-a210-74896c411ba3
externalId: II.5.a
name: Data Integrity and Purpose Limitation
description: Consistent with the Principles, personal information must be
  limited to the information that is relevant for the purposes of processing.6
  An organization may not process personal information in a way that is
  incompatible with the purposes for which it has been collected or subsequently
  authorized by the individual. To the extent necessary for those purposes, an
  organization must take reasonable steps to ensure that personal data is
  reliable for its intended use, accurate, complete, and current. An
  organization must adhere to the Principles for as long as it retains such
  information.
elementType: control
