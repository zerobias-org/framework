id: da9b54c3-bb91-4197-912e-d1bed66a22ba
externalId: III.8.f.i
name: Access
description: An individual has the right to obtain confirmation of whether or
  not this organization has personal data relating to him or her. An individual
  also has the right to have communicated to him or her personal data relating
  to him or her. An organization may charge a fee that is not excessive.
elementType: control
