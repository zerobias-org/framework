id: 49dcabc1-a656-46ac-a459-ea3871ddaeea
externalId: CIP-007-6 2.3
name: CIP-007-6 Table R2 – Security Patch Management
description: "For applicable patches identified in Part 2.2, within 35 calendar
  days of the evaluation completion, take one of the following actions:\r

  \ • Apply the applicable patches; or\r

  \ • Create a dated mitigation plan; or\r

  \ • Revise an existing mitigation plan. Mitigation plans shall include the
  Responsible Entity’s planned actions to mitigate the vulnerabilities addressed
  by each security patch and a timeframe to complete these mitigations."
elementType: control
