id: e9da54c4-656f-4324-abd7-a87efcd73040
externalId: CIP-004-7 R6
name: CIP-004-7 R6
description: "Each Responsible Entity shall implement one or more documented
  access management program(s) to authorize, verify, and revoke provisioned
  access to BCSI pertaining to the “Applicable Systems” identified in CIP-004-7
  Table R6 – Access Management for BES Cyber System Information that
  collectively include each of the applicable requirement parts in CIP-004-7
  Table R6 – Access Management for BES Cyber System Information. To be
  considered access to BCSI in the context of this requirement, an individual
  has both the ability to obtain and use BCSI. Provisioned access is to be
  considered the result of the specific actions taken to provide an
  individual(s) the means to access BCSI (e.g., may include physical keys or
  access cards, user accounts and associated rights and privileges, encryption
  keys). [Violation Risk Factor: Medium] [Time Horizon: Same Day Operations and
  Operations Planning]."
elementType: control
