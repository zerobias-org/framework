externalId: CIP-004-7 5.3
name: CIP-004-7 Table R5 – Access Revocation
description: For termination actions, revoke the individual’s non-shared user
  accounts (unless already revoked according to Part 5.1) within 30 calendar
  days of the effective date of the termination action.
elementType: control
