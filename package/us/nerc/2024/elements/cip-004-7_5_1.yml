id: f4c33324-439d-46b7-b8e1-7c009a488684
externalId: CIP-004-7 5.1
name: CIP-004-7 Table R5 – Access Revocation
description: A process to initiate removal of an individual’s ability for
  unescorted physical access and Interactive Remote Access upon a termination
  action, and complete the removals within 24 hours of the termination action
  (Removal of the ability for access may be different than deletion, disabling,
  revocation, or removal of all access rights).
elementType: control
