externalId: CIP-008-6 R4
name: CIP-008-6 R4
description: "Each Responsible Entity shall notify the Electricity Information
  Sharing and Analysis Center (E-ISAC) and, if subject to the jurisdiction of
  the United States, the United States National Cybersecurity and Communications
  Integration Center (NCCIC),1 or their successors, of a Reportable Cyber
  Security Incident and a Cyber Security Incident that was an attempt to
  compromise, as determined by applying the criteria from Requirement R1, Part
  1.2.1, a system identified in the “Applicable Systems” column, unless
  prohibited by law, in accordance with each of the applicable requirement parts
  in CIP-008-6 Table R4 – Notifications and Reporting for Cyber Security
  Incidents. [Violation Risk Factor: Lower] [Time Horizon: Operations
  Assessment]."
elementType: control
