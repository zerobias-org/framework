name: CIP-009-6 Table R2 – Recovery Plan Implementation and Testing
description: "Test each of the recovery plans referenced in Requirement R1 at
  least once every 15 calendar months:\r

  \ • By recovering from an actual incident;\r

  \ • With a paper drill or tabletop exercise; or\r

  \ • With an operational exercise."
