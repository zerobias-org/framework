name: CIP-004-7 Table R4 – Access Management Program
description: For electronic access, verify at least once every 15 calendar
  months that all user accounts, user account groups, or user role categories,
  and their specific, associated privileges are correct and are those that the
  Responsible Entity determines are necessary.
