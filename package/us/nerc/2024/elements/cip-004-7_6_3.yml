name: CIP-004-7 Table R6 – Access Management for BES Cyber System Information
description: For termination actions, remove the individual’s ability to use
  provisioned access to BCSI (unless already revoked according to Part 5.1) by
  the end of the next calendar day following the effective date of the
  termination action.
