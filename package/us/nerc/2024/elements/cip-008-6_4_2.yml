id: 6a61df7a-ccaa-45f0-80a8-adcd3a0a0a92
externalId: CIP-008-6 4.2
name: CIP-008-6 Table R4 – Notifications and Reporting for Cyber Security Incidents
description: "After the Responsible Entity’s determination made pursuant to
  documented process(es) in Requirement R1, Part 1.2, provide initial
  notification within the following timelines:\r

  \ • One hour after the determination of a Reportable Cyber Security
  Incident.\r

  \ • By the end of the next calendar day after determination that a Cyber
  Security Incident was an attempt to compromise a system identified in the
  “Applicable Systems” column for this Part."
elementType: control
