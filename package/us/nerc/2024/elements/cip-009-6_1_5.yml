name: CIP-009-6 Table R1 – Recovery Plan Specifications
description: One or more processes to preserve data, per Cyber Asset capability,
  for determining the cause of a Cyber Security Incident that triggers
  activation of the recovery plan(s). Data preservation should not impede or
  restrict recovery.
