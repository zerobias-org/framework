name: CIP-009-6 Table R2 – Recovery Plan Implementation and Testing
description: Test a representative sample of information used to recover BES
  Cyber System functionality at least once every 15 calendar months to ensure
  that the information is useable and is compatible with current configurations.
  An actual recovery that incorporates the information used to recover BES Cyber
  System functionality substitutes for this test.
elementType: control
