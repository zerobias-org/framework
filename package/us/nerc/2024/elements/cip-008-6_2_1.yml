id: d591c938-22ee-47ec-b7af-7f5e287cbd7f
externalId: CIP-008-6 2.1
name: CIP-008-6 Table R2 – Cyber Security Incident Response Plan Implementation
  and Testing
description: "Test each Cyber Security Incident response plan(s) at least once
  every 15 calendar months:\r

  \ • By responding to an actual Reportable Cyber Security Incident;\r

  \ • With a paper drill or tabletop exercise of a Reportable Cyber Security
  Incident; or\r

  \ • With an operational exercise of a Reportable Cyber Security Incident."
elementType: control
