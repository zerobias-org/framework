id: fccef630-75c8-439d-9d87-533ac5a94449
externalId: CIP-007-6 5.6
name: CIP-007-6 Table R5 – System Access Control
description: Where technically feasible, for password-only authentication for
  interactive user access, either technically or procedurally enforce password
  changes or an obligation to change the password at least once every 15
  calendar months.
elementType: control
