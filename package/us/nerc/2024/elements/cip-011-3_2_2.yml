id: 1113fe95-7c57-446f-b2a1-eb44866c6960
externalId: CIP-011-3 2.2
name: CIP-011-3 Table R2 – BES Cyber Asset Reuse and Disposal
description: Prior to the disposal of applicable Cyber Assets that contain BCSI,
  the Responsible Entity shall take action to prevent the unauthorized retrieval
  of BCSI from the Cyber Asset or destroy the data storage media.
elementType: control
