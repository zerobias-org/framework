name: CIP-013-2 R1
description: "Each Responsible Entity shall develop one or more documented
  supply chain cyber security risk management plan(s) for high and medium impact
  BES Cyber Systems and their associated Electronic Access Control or Monitoring
  Systems (EACMS) and Physical Access Control Systems (PACS). The plan(s) shall
  include: [Violation Risk Factor: Medium] [Time Horizon: Operations Planning]"
