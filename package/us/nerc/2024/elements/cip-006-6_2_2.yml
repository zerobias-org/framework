id: 376355dd-4759-4283-beef-c22cef6ecb62
externalId: CIP-006-6 2.2
name: CIP-006-6 Table R2 – Visitor Control Program
description: Require manual or automated logging of visitor entry into and exit
  from the Physical Security Perimeter that includes date and time of the
  initial entry and last exit, the visitor’s name, and the name of an individual
  point of contact responsible for the visitor, except during CIP Exceptional
  Circumstances.
elementType: control
