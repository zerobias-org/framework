id: 43e32c84-3f3b-4eb9-b0a2-dca467421201
externalId: CIP-011-3 2.1
name: CIP-011-3 Table R2 – BES Cyber Asset Reuse and Disposal
description: Prior to the release for reuse of applicable Cyber Assets that
  contain BCSI (except for reuse within other systems identified in the
  “Applicable Systems” column), the Responsible Entity shall take action to
  prevent the unauthorized retrieval of BCSI from the Cyber Asset data storage
  media.
elementType: control
