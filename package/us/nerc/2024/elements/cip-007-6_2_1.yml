id: e2386719-fb92-4d16-8e2e-66ea559c4999
externalId: CIP-007-6 2.1
name: CIP-007-6 Table R2 – Security Patch Management
description: A patch management process for tracking, evaluating, and installing
  cybersecurity patches for applicable Cyber Assets. The tracking portion shall
  include the identification of a source or sources that the Responsible Entity
  tracks for the release of cyber security patches for applicable Cyber Assets
  that are updateable and for which a patching source exists.
elementType: control
