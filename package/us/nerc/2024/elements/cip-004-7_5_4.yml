id: 8f93816b-7928-48ec-b5bf-3e5e6c88bb57
externalId: CIP-004-7 5.4
name: CIP-004-7 Table R5 – Access Revocation
description: For termination actions, change passwords for shared account(s)
  known to the user within 30 calendar days of the termination action. For
  reassignments or transfers, change passwords for shared account(s) known to
  the user within 30 calendar days following the date that the Responsible
  Entity determines that the individual no longer requires retention of that
  access. If the Responsible Entity determines and documents that extenuating
  operating circumstances require a longer time period, change the password(s)
  within 10 calendar days following the end of the operating circumstances.
elementType: control
