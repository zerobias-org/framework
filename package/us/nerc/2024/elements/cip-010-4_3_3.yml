id: e9a9bbc0-7c6f-4edf-83f4-4c6dcf7e7c63
externalId: CIP-010-4 3.3
name: CIP-010-4 Table R3 – Vulnerability Assessments
description: Prior to adding a new applicable Cyber Asset to a production
  environment, perform an active vulnerability assessment of the new Cyber
  Asset, except for CIP Exceptional Circumstances and like replacements of the
  same type of Cyber Asset with a baseline configuration that models an existing
  baseline configuration of the previous or other existing Cyber Asset.
elementType: control
