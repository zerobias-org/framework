id: cc317df9-fba8-4c50-97cc-03ac56697b9c
externalId: CIP-006-6 1.3
name: CIP-006-6 Table R1 – Physical Security Plan
description: Where technically feasible, utilize two or more different physical
  access controls (this does not require two completely independent physical
  access control systems) to collectively allow unescorted physical access into
  Physical Security Perimeters to only those individuals who have authorized
  unescorted physical access.
elementType: control
