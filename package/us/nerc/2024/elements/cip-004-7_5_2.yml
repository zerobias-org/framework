id: 4929d86f-b00e-40f2-af99-e62ae40d3e9c
externalId: CIP-004-7 5.2
name: CIP-004-7 Table R5 – Access Revocation
description: For reassignments or transfers, revoke the individual’s authorized
  electronic access to individual accounts and authorized unescorted physical
  access that the Responsible Entity determines are not necessary by the end of
  the next calendar day following the date that the Responsible Entity
  determines that the individual no longer requires retention of that access.
elementType: control
