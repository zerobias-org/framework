id: 46b72979-e4d8-48a7-bc1e-0660e12a13c1
externalId: CIP-008-6 2.2
name: CIP-008-6 Table R2 – Cyber Security Incident Response Plan Implementation
  and Testing
description: Use the Cyber Security Incident response plan(s) under Requirement
  R1 when responding to a Reportable Cyber Security Incident, responding to a
  Cyber Security Incident that attempted to compromise a system identified in
  the “Applicable Systems” column for this Part, or performing an exercise of a
  Reportable Cyber Security Incident. Document deviations from the plan(s) taken
  during the response to the incident or exercise.
elementType: control
