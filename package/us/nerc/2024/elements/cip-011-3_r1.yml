name: CIP-011-3 R1
description: "Each Responsible Entity shall implement one or more documented
  information protection program(s) for BES Cyber System Information (BCSI)
  pertaining to “Applicable Systems” identified in CIP-011-3 Table R1 –
  Information Protection Program that collectively includes each of the
  applicable requirement parts in CIP-011-3 Table R1 – Information Protection
  Program. [Violation Risk Factor: Medium] [Time Horizon: Operations Planning]."
