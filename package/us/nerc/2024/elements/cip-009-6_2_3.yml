name: CIP-009-6 Table R2 – Recovery Plan Implementation and Testing
description: Test each of the recovery plans referenced in Requirement R1 at
  least once every 36 calendar months through an operational exercise of the
  recovery plans in an environment representative of the production environment.
  An actual recovery response may substitute for an operational exercise.
elementType: control
