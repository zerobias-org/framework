id: 0052dbc3-f25c-4bf3-b133-6d3bc26005eb
externalId: 314.4(j)(2)
name: Notification event treated as discovered
description: A notification event shall be treated as discovered as of the first day on which such event is known to you. You shall be deemed to have knowledge of a notification event if such event is known to any person, other than the person committing the breach, who is your employee, officer, or other agent.
elementType: control
