id: 4c3bd812-95a8-4bb1-b252-d9e83bf5c4f7
externalId: 314.4(b)(2)
name: "314.4(b)(2)"
description: You shall periodically perform additional risk assessments that
  reexamine the reasonably foreseeable internal and external risks to the
  security, confidentiality, and integrity of customer information that could
  result in the unauthorized disclosure, misuse, alteration, destruction, or
  other compromise of such information, and reassess the sufficiency of any
  safeguards in place to control these risks.
elementType: control
