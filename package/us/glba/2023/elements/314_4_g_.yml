id: bdc4bdc6-57ed-4ae8-99ab-cb150d08e654
externalId: 314.4(g)
name: "314.4(g)"
description: Evaluate and adjust your information security program in light of
  the results of the testing and monitoring required by paragraph (d) of this
  section; any material changes to your operations or business arrangements; the
  results of risk assessments performed under paragraph (b)(2) of this section;
  or any other circumstances that you know or have reason to know may have a
  material impact on your information security program.
elementType: control
