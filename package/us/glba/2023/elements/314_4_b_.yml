id: 798ab2e9-96ad-472e-8b1f-4799ecbc4d88
externalId: 314.4(b)
name: "314.4(b)"
description: Base your information security program on a risk assessment that
  identifies reasonably foreseeable internal and external risks to the security,
  confidentiality, and integrity of customer information that could result in
  the unauthorized disclosure, misuse, alteration, destruction, or other
  compromise of such information, and assesses the sufficiency of any safeguards
  in place to control these risks.
elementType: control
