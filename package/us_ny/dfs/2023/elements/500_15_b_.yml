id: cd58c951-142f-4788-a903-c8ca479b58ee
externalId: 500.15(b)
name: 500.15(b)
description: To the extent a covered entity determines that encryption of
  nonpublic information at rest is infeasible, the covered entity may instead
  secure such nonpublic information using effective alternative compensating
  controls that have been reviewed and approved by the covered entity’s CISO in
  writing. The feasibility of encryption and effectiveness of the compensating
  controls shall be reviewed by the CISO at least annually.
elementType: control
