externalId: "500.3"
name: Cybersecurity Policy
description: "Each covered entity shall implement and maintain a written policy
  or policies, approved at least annually by a senior officer or the covered
  entity’s senior governing body for the protection of its information systems
  and nonpublic information stored on those information systems. Procedures
  shall be developed, documented and implemented in accordance with the written
  policy or policies. The cybersecurity policy or policies and procedures shall
  be based on the covered entity’s risk assessment and address, at a minimum,
  the following areas to the extent applicable to the covered entity’s
  operations:"
elementType: control
