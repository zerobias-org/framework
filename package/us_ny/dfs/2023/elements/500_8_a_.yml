id: 4242db5e-0be9-4475-b200-5c9479b6c37b
externalId: 500.8(a)
name: 500.8(a)
description: Each covered entity’s cybersecurity program shall include written
  procedures, guidelines and standards designed to ensure the use of secure
  development practices for in-house developed applications utilized by the
  covered entity, and procedures for evaluating, assessing or testing the
  security of externally developed applications utilized by the covered entity
  within the context of the covered entity’s technology environment.
elementType: control
