id: 6e7cfe62-d417-419e-b57b-c2657045cd07
externalId: 500.13(b)
name: 500.13(b)
description: As part of its cybersecurity program, each covered entity shall
  include policies and procedures for the secure disposal on a periodic basis of
  any nonpublic information identified in section 500.1(k)(2)–(3) of this Part
  that is no longer necessary for business operations or for other legitimate
  business purposes of the covered entity, except where such information is
  otherwise required to be retained by law or regulation, or where targeted
  disposal is not reasonably feasible due to the manner in which the information
  is maintained.
elementType: control
