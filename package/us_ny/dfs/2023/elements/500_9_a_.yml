id: dc3a90d6-5458-4312-bc0f-b73da1606203
externalId: 500.9(a)
name: 500.9(a)
description: Each covered entity shall conduct a periodic risk assessment of the
  covered entity’s information systems sufficient to inform the design of the
  cybersecurity program as required by this Part. Such risk assessment shall be
  reviewed and updated as reasonably necessary, but at a minimum annually, and
  whenever a change in the business or technology causes a material change to
  the covered entity’s cyber risk. The covered entity’s risk assessment shall
  allow for revision of controls to respond to technological developments and
  evolving threats and shall consider the particular risks of the covered
  entity’s business operations related to cybersecurity, nonpublic information
  collected or stored, information systems utilized and the availability and
  effectiveness of controls to protect nonpublic information and information
  systems.
elementType: control
