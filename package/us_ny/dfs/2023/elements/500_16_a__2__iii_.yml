externalId: 500.16(a)(2)(iii)
name: 500.16(a)(2)(iii)
description: include a plan to communicate with essential persons in the event
  of a cybersecurity-related disruption to the operations of the covered entity,
  including employees, counterparties, regulatory authorities, third-party
  service providers, disaster recovery specialists, the senior governing body
  and any other persons essential to the recovery of documentation and data and
  the resumption of operations;
elementType: control
