externalId: 500.17(b)(2)
name: 500.17(b)(2)
description: Such certification or acknowledgment shall be submitted
  electronically in the form set forth on the department’s website and shall be
  signed by the covered entity’s highestranking executive and its CISO. If the
  covered entity does not have a CISO, the certification or acknowledgment shall
  be signed by the highest-ranking executive and by the senior officer
  responsible for the cybersecurity program of the covered entity.
elementType: control
