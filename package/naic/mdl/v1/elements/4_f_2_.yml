externalId: 4.F(2)
name: 4.F(2)
description: A Licensee shall require a Third-Party Service Provider to
  implement appropriate administrative, technical, and physical measures to
  protect and secure the Information Systems and Nonpublic Information that are
  accessible to, or held by, the Third-Party Service Provider.
