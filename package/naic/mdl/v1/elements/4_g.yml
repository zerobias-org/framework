externalId: 4.G
name: Program Adjustments
description: The Licensee shall monitor, evaluate and adjust, as appropriate,
  the Information Security Program consistent with any relevant changes in
  technology, the sensitivity of its Nonpublic Information, internal or external
  threats to information, and the Licensee’s own changing business arrangements,
  such as mergers and acquisitions, alliances and joint ventures, outsourcing
  arrangements and changes to Information Systems.
elementType: control
