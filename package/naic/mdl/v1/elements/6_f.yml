id: 47d2b9d2-b98b-4d6b-b392-a386d169aa77
externalId: 6.F
name: Notice Regarding Cybersecurity Events of Insurers to Producers of Record
description: "In the case of a Cybersecurity Event involving Nonpublic
  Information that is in the possession, custody or control of a Licensee that
  is an insurer or its Third-Party Service Provider and for which a Consumer
  accessed the insurer’s services through an independent insurance producer, the
  insurer shall notify the producers of record of all affected Consumers as soon
  as practicable as directed by the Commissioner. \r

  \r

  The insurer is excused from this obligation for those instances in which it
  does not have the current producer of record information for any individual
  Consumer."
elementType: control
