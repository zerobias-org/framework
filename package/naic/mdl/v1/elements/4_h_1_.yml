id: a2a211c3-f5ad-47bd-aeea-6e26448ceec3
externalId: 4.H(1)
name: 4.H(1)
description: As part of its Information Security Program, each Licensee shall
  establish a written incident response plan designed to promptly respond to,
  and recover from, any Cybersecurity Event that compromises the
  confidentiality, integrity, or availability of Nonpublic Information in its
  possession, the Licensee’s Information Systems, or the continuing
  functionality of any aspect of the Licensee’s business or operations.
elementType: control
