id: 160bb572-7679-4383-bf11-f133ddc027c9
externalId: 4.I
name: Annual Certification to Commissioner of Domiciliary State
description: Annually, each insurer domiciled in this State shall submit to the
  Commissioner, a written statement by February 15, certifying that the insurer
  is in compliance with the requirements set forth in Section 4 of this Act.
  Each insurer shall maintain for examination by the Department all records,
  schedules and data supporting this certificate for a period of five years. To
  the extent an insurer has identified areas, systems, or processes that require
  material improvement, updating or redesign, the insurer shall document the
  identification and the remedial efforts planned and underway to address such
  areas, systems or processes. Such documentation must be available for
  inspection by the Commissioner.
elementType: control
