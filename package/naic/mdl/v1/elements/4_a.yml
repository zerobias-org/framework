id: 24daf011-a0a8-4534-afd7-e6057a338bcd
externalId: 4.A
name: Implementation of an Information Security Program
description: Commensurate with the size and complexity of the Licensee, the
  nature and scope of the Licensee’s activities, including its use of
  Third-Party Service Providers, and the sensitivity of the Nonpublic
  Information used by the Licensee or in the Licensee’s possession, custody or
  control, each Licensee shall develop, implement, and maintain a comprehensive
  written Information Security Program based on the Licensee’s Risk Assessment
  and that contains administrative, technical, and physical safeguards for the
  protection of Nonpublic Information and the Licensee’s Information System.
elementType: control
