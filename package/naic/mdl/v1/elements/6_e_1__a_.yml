id: 8493b019-faae-4ef4-8e6a-05855215120c
externalId: 6.E(1)(a)
name: 6.E(1)(a)
description: In the case of a Cybersecurity Event involving Nonpublic
  Information that is used by the Licensee that is acting as an assuming insurer
  or in the possession, custody or control of a Licensee that is acting as an
  assuming insurer and that does not have a direct contractual relationship with
  the affected Consumers, the assuming insurer shall notify its affected ceding
  insurers and the Commissioner of its state of domicile within 72 hours of
  making the determination that a Cybersecurity Event has occurred.
elementType: control
