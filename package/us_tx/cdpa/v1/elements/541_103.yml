id: 35a805db-0cc8-4111-9c8e-0b99909fda28
externalId: "541.103"
name: Sale of Data to Third Parties and Processing Data for Targeted
  Advertising; Disclosure
description: If a controller sells personal data to third parties or processes
  personal data for targeted advertising, the controller shall clearly and
  conspicuously disclose that process and the manner in which a consumer may
  exercise the right to opt out of that process.
elementType: control
