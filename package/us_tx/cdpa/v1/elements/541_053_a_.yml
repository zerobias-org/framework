id: 08a3ecb6-2526-4e87-b712-d2d832471a0c
externalId: 541.053(a)
name: Appeal
description: A controller shall establish a process for a consumer to appeal the
  controller's refusal to take action on a request within a reasonable period of
  time after the consumer's receipt of the decision under Section 541.052(c).
elementType: control
