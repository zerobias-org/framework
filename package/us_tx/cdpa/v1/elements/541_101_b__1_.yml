id: d3d0d661-dda5-450b-85b3-03138f091068
externalId: 541.101(b)(1)
name: Controller Duties; Transparency
description: except as otherwise provided by this chapter, process personal data
  for a purpose that is neither reasonably necessary to nor compatible with the
  disclosed purpose for which the personal data is processed, as disclosed to
  the consumer, unless the controller obtains the consumer's consent;
elementType: control
