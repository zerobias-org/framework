id: 5e8507d7-24eb-490f-a7d3-6873915102a6
externalId: 541.053(c)
name: Appeal
description: A controller shall inform the consumer in writing of any action
  taken or not taken in response to an appeal under this section not later than
  the 60th day after the date of receipt of the appeal, including a written
  explanation of the reason or reasons for the decision.
elementType: control
