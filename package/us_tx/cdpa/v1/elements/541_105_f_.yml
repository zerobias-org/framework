externalId: 541.105(f)
name: Data Protection Assessments
description: A data protection assessment conducted by a controller for the
  purpose of compliance with other laws or regulations may constitute compliance
  with the requirements of this section if the assessment has a reasonably
  comparable scope and effect.
elementType: control
