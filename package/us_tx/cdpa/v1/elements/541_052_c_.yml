id: f2c5967e-408a-4c1d-9ff4-7566f817421c
externalId: 541.052(c)
name: Controller Response to Consumer Request
description: If a controller declines to take action regarding the consumer's
  request, the controller shall inform the consumer without undue delay, which
  may not be later than the 45th day after the date of receipt of the request,
  of the justification for declining to take action and provide instructions on
  how to appeal the decision in accordance with Section 541.053.
elementType: control
