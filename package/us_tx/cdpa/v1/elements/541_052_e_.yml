id: 427ce930-c391-4691-8f08-6026625f571a
externalId: 541.052(e)
name: Controller Response to Consumer Request
description: If a controller is unable to authenticate the request using
  commercially reasonable efforts, the controller is not required to comply with
  a consumer request submitted under Section 541.051 and may request that the
  consumer provide additional information reasonably necessary to authenticate
  the consumer and the consumer's request.
elementType: control
