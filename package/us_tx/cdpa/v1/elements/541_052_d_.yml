id: dff69da9-c960-481b-81cc-0637956dac2d
externalId: 541.052(d)
name: Controller Response to Consumer Request
description: A controller shall provide information in response to a consumer
  request free of charge, at least twice annually per consumer. If a request
  from a consumer is manifestly unfounded, excessive, or repetitive, the
  controller may charge the consumer a reasonable fee to cover the
  administrative costs of complying with the request or may decline to act on
  the request. The controller bears the burden of demonstrating for purposes of
  this subsection that a request is manifestly unfounded, excessive, or
  repetitive.
elementType: control
