id: e5c1d5df-e986-42f8-8d2d-bd2eba2f0bd9
externalId: 541.204(c)
name: Processing of Certain Personal Data by Controller or Other Person
description: A controller that processes personal data under an exemption in
  this subchapter bears the burden of demonstrating that the processing of the
  personal data qualifies for the exemption and complies with the requirements
  of Subsections (a) and (b).
elementType: control
