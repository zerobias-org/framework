id: ac0355f6-4056-420d-bd43-c88a6f7931fb
externalId: 541.106(d)
name: Deidentified or Pseudonymous Data
description: A controller that discloses pseudonymous data or deidentified data
  shall exercise reasonable oversight to monitor compliance with any contractual
  commitments to which the pseudonymous data or deidentified data is subject and
  shall take appropriate steps to address any breach of the contractual
  commitments.
elementType: control
