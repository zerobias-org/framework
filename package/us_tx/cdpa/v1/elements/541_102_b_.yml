id: 9142cdf2-2df5-4b92-b9b3-03ec3d9c6aa4
externalId: 541.102(b)
name: Privacy Notice
description: >-
  If a controller engages in the sale of personal data that is sensitive data,
  the controller shall include the following notice:

  "NOTICE: We may sell your sensitive personal data." 

  The notice must be posted in the same location and in the same manner as

  the privacy notice described by Subsection (a).
elementType: control
