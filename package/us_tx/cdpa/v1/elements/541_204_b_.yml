id: 1cba7449-0a0d-4f43-b450-5ea46c13a6b1
externalId: 541.204(b)
name: Processing of Certain Personal Data by Controller or Other Person
description: Personal data collected, used, or retained under Section 541.202(a)
  must, where applicable, take into account the nature and purpose of such
  collection, use, or retention. The personal data described by this subsection
  is subject to reasonable administrative, technical, and physical measures to
  protect the confidentiality, integrity, and accessibility of the personal data
  and to reduce reasonably foreseeable risks of harm to consumers relating to
  the collection, use, or retention of personal data.
elementType: control
