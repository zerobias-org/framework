id: 79f8c830-4805-4cac-bad3-d07678002c0e
externalId: 541.052(b)
name: Controller Response to Consumer Request
description: A controller shall respond to the consumer request without undue
  delay, which may not be later than the 45th day after the date of receipt of
  the request. The controller may extend the response period once by an
  additional 45 days when reasonably necessary, taking into account the
  complexity and number of the consumer's requests, so long as the controller
  informs the consumer of the extension within the initial 45-day response
  period, together with the reason for the extension.
elementType: control
