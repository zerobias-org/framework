id: 0f8b1022-78d0-4749-92f5-e1b21aafe3f5
externalId: 541.055(e)
name: Methods for Submitting Consumer Requests
description: "A consumer may designate another person to serve as the consumer's
  authorized agent and act on the consumer's behalf to opt out of the processing
  of the consumer's personal data under Sections 541.051(b)(5)(A) and (B). A
  consumer may designate an authorized agent using a technology, including a
  link to an Internet website, an Internet browser setting or extension, or a
  global setting on an electronic device, that allows the consumer to indicate
  the consumer's intent to opt out of the processing. A controller shall comply
  with an opt-out request received from an authorized agent under this
  subsection if the controller is able to verify, with commercially reasonable
  effort, the identity of the consumer and the authorized agent's authority to
  act on the consumer's behalf. A controller is not required to comply with an
  opt-out request received from an authorized agent under this subsection if:"
elementType: control
