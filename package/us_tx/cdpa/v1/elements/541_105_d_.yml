id: 4a821d61-3e1c-4d4f-919c-2c252e75d168
externalId: 541.105(d)
name: Data Protection Assessments
description: A data protection assessment is confidential and exempt from public
  inspection and copying under Chapter 552, Government Code. Disclosure of a
  data protection assessment in compliance with a request from the attorney
  general does not constitute a waiver of attorney-client privilege or work
  product protection with respect to the assessment and any information
  contained in the assessment.
elementType: control
