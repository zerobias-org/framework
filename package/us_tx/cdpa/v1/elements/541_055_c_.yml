id: 8682808f-c40b-46ef-9958-693f96c0627b
externalId: 541.055(c)
name: Methods for Submitting Consumer Requests
description: Except as provided by Subsection (d), if the controller maintains
  an Internet website, the controller must provide a mechanism on the website
  for consumers to submit requests for information required to be disclosed
  under this chapter.
elementType: control
