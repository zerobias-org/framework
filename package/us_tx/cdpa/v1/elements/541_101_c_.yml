id: f4946cef-4f56-4448-bddf-74b545a81e3a
externalId: 541.101(c)
name: Controller Duties; Transparency
description: Subsection (b)(3) may not be construed to require a controller to
  provide a product or service that requires the personal data of a consumer
  that the controller does not collect or maintain or to prohibit a controller
  from offering a different price, rate, level, quality, or selection of goods
  or services to a consumer, including offering goods or services for no fee, if
  the consumer has exercised the consumer's right to opt out under Section
  541.051 or the offer is related to a consumer's voluntary participation in a
  bona fide loyalty, rewards, premium features, discounts, or club card program.
elementType: control
