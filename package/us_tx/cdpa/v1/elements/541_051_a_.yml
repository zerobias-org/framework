id: 5d2e80fb-28ba-4f8e-865b-ead8d8082cbf
externalId: 541.051(a)
name: Consumer's Personal Data Rights; Request To Exercise Rights
description: A consumer is entitled to exercise the consumer rights authorized
  by this section at any time by submitting a request to a controller specifying
  the consumer rights the consumer wishes to exercise. With respect to the
  processing of personal data belonging to a known child, a parent or legal
  guardian of the child may exercise the consumer rights on behalf of the child.
elementType: control
