id: 00bf724c-79be-4d9b-91b9-1b49ce841e42
externalId: 541.104(c)
name: Duties of Processor
description: Notwithstanding the requirement described by Subsection (b)(6)(D),
  a processor, in the alternative, may arrange for a qualified and independent
  assessor to conduct an assessment of the processor's policies and technical
  and organizational measures in support of the requirements under this chapter
  using an appropriate and accepted control standard or framework and assessment
  procedure. The processor shall provide a report of the assessment to the
  controller on request.
elementType: control
