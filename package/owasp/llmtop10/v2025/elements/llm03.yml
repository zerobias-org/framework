externalId: LLM03
name: Training Data Poisoning
description: >-
  Training Data Poisoning occurs when the data used to train or fine-tune an LLM is
  manipulated to introduce vulnerabilities, backdoors, or biases that compromise the
  model's security, effectiveness, or ethical behavior.
elementType: vulnerability
