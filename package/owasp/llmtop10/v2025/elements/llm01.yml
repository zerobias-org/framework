id: 03a43919-a0d3-46ae-acd5-3f67b7d726a5
externalId: LLM01
name: Prompt Injection
description: >-
  Prompt Injection occurs when an attacker manipulates the input to an LLM through
  crafted prompts that cause the model to act in unintended ways. This can be direct
  (jailbreaking) or indirect (manipulating external data sources).
elementType: vulnerability
