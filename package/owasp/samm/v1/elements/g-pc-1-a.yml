id: 1209c3b8-4a2f-4dfd-a24a-dac0ee479579
name: Define policies and standards
description: >-
  Determine a security baseline representing organization's policies and
  standards.
longDescription: >
  Develop a library of policies and standards to govern all aspects of software
  development in the organization. Policies and standards are based on existing
  industry standards and appropriate for the organization's industry. Due to the
  full range of technology-specific limitations and best practices, review
  proposed standards with the various product teams. With the overarching
  objective of increasing security of the applications and computing
  infrastructure, invite product teams to offer feedback on any aspects of the
  standards that would not be feasible or cost-effective to implement, as well
  as opportunities for standards to go further with little effort on the product
  teams.

  For policies, emphasize high-level definitions and aspects of application
  security that do not depend on specific technology or hosting environment.
  Focus on broader objectives of the organization to protect the integrity of
  its computing environment, safety and privacy of the data, and maturity of the
  software development life-cycles. For larger organizations, policies may
  qualify specific requirements based on data classification or application
  functionality, but should not be detailed enough to offer technology-specific
  guidance.

  For standards, incorporate requirements set forth by policies, and focus on
  technology-specific implementation guidance intended to capture and take
  advantage of the security features of different programming languages and
  frameworks. Standards require input from senior developers and architects
  considered experts in various technologies in use by the organization. Create
  them in a format that allows for periodic updates. Label or tag individual
  requirements with the policy or a 3rd party requirement, to make maintenance
  and audits easier and more efficient.
benefits: Clear expectation of minimum security level in the organization
elementType: activity
externalId: G-PC-1-A
question: >-
  Do you have and apply a common set of policies and standards throughout your
  organization?
qualityCriteria:
  - >-
    You have adapted existing standards appropriate for the organization’s
    industry to account for domain-specific considerations
  - >-
    Your standards are aligned with your policies and incorporate
    technology-specific implementation guidance
