id: c7fcee90-33eb-4e92-8f47-3aed94830703
name: Architecture Assessment
description: >-
  This practice focuses on validating the security and compliance of the
  software and supporting infrastructure architecture.
longDescription: >
  The Architecture Assessment (AA) practice ensures that the application and
  infrastructure architecture adequately meets all relevant security and
  compliance requirements, and sufficiently mitigates identified security
  threats. The first stream focuses on verifying that the security and
  compliance requirements identified in the Policy and Compliance, and Security
  Requirements, practices are met, first in an ad-hoc manner, then more
  systematically for each interface in the system. The second stream reviews the
  architecture, first for mitigations against typical threats, then against the
  specific threats identified in the Threat Assessment practice.

  In its more advanced form, the practice formalizes the architecture security
  review process, continuously evaluates the effectiveness of the architecture's
  security controls, their scalability and strategic alignment. Identified
  weaknesses and possible improvements are fed back to the Secure Architecture
  practice to improve reference architectures.
