name: Deep Understanding
description: >
  Deep understanding focuses on performing manual security testing of high-risk
  components, using complex attack vectors with the goal of making advanced
  security testing an integral part of the development process. The goal of this
  stream is to favor testing depth (testing rigour) over testing width (the
  portfolio of applications).
