id: 4bf93f22-495a-45d9-a6ff-62713c2c5c63
name: Establish a data catalog
description: Develop data catalog and establish data protection policy.
longDescription: >
  At this maturity level, Data Protection activities focus on actively managing
  your stewardship of data. Establish technical and administrative controls to
  protect the confidentiality of sensitive data, and the integrity and
  availability of all data in your care, from its initial creation/receipt
  through the destruction of backups at the end of their retention period.

  Identify the data stored, processed, and transmitted by applications, and
  capture information regarding their types, sensitivity (classification)
  levels, and storage location(s) in your data catalog. Clearly identify records
  or data elements subject to specific regulation. Establishing a single source
  of truth regarding the data you work with supports finer-grained selection of
  controls for their protection. Collecting this information enhances the
  accuracy, timeliness, and efficiency of your responses to data-related queries
  (e.g., from auditors, incident response teams, or customers), and supports
  threat modeling and compliance activities.

  Based on your Data Protection Policy, establish processes and procedures for
  protecting and preserving data throughout their lifetime, whether at rest,
  while being processed, or in transit. Pay particular attention to the handling
  and protection of sensitive data outside the active processing system,
  including, but not limited to: storage, retention, and destruction of backups;
  and the labeling, encryption, and physical protection of offline storage
  media. Your processes and procedures cover the implementation of all controls
  adopted to comply with regulatory, contractual, or other restrictions on
  storage locations, personnel access, and other factors.
benefits: Standardized handling of different classes of sensitive data
elementType: activity
externalId: O-OM-2-A
question: >-
  Do you maintain a data catalog, including types, sensitivity levels, and
  processing and storage locations?
qualityCriteria:
  - The data catalog is stored in an accessible location
  - You know which data elements are subject to specific regulation
  - You have controls for protecting and preserving data throughout its lifetime
  - >-
    You have retention requirements for data, and you destroy backups in a
    timely manner after the relevant retention period ends
