id: 21b68bcd-e9f2-4e54-8736-3c2ec69ee32c
name: Track security defects centrally
description: >-
  Introduce a structured tracking of security defects and make knowledgeable
  decisions based on this information.
longDescription: >
  Introduce a common definition / understanding of a security defect and define
  the most common ways of identifying these. These typically include, but are
  not limited to:


  * Threat assessments

  * Penetration tests

  * Output from static and dynamic analysis scanning tools

  * Responsible disclosure processes or bug bounties


  Foster a culture of transparency and avoid blaming any teams for introducing
  or identifying security defects. Record and track all security defects in a
  defined location. This location doesn't necessarily have to be centralized for
  the whole organization, however ensure that you're able to get an overview of
  all defects affecting a particular application at any single point in time.
  Define and apply access rules for the tracked security defects to mitigate the
  risk of leakage and abuse of this information.

  Introduce at least rudimentary qualitative classificiation of security defects
  so that you are able to prioritize fixing efforts accordingly. Strive for
  limiting duplication of information and presence of false positives to
  increase the trustworthiness of the process.
benefits: Transparency of known security defects impacting particular applications
elementType: activity
externalId: I-DM-1-A
question: Do you track all known security defects in accessible locations?
qualityCriteria:
  - >-
    You can easily get an overview of all security defects impacting one
    application
  - You have at least a rudimentary classification scheme in place
  - >-
    The process includes a strategy for handling false positives and duplicate
    entries
  - >-
    The defect management system covers defects from various sources and
    activities
