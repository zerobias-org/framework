id: 66d1242f-46cb-45bd-a1f7-0bce0bfd21ec
name: Use metrics to improve the security strategy
description: >-
  Continuously improve your security defect management metrics and correlate it
  with other sources.
longDescription: >
  Regularly (at least once per year) revisit the defect management metrics
  you're collecting and compare the effort needed to collect and track these to
  the expected outcomes. Make knowledgeable decision about removing metrics
  which don't deliver the overall expected value. Wherever possible, include and
  automate verification activities for the quality of the collected data and
  ensure sustainable improvement if any differences are detected.

  Aggregate the data with your threat intelligence and incident management
  metrics and use the results as input for other initiatives over the whole
  organization, such as:


  * Planning security trainings for various personnel

  * Improvement of security verification activities for both internally and
  externally develeoped collected

  * Supply chain management, e.g. carrying out security audits of partner
  organizations

  * Monitoring of attacks against your infrastructure and applications

  * Investing in security infrastructure or compensating controls

  * Staffing your security team and setting up the security budget
benefits: Optimized security strategy based on defect information
elementType: activity
externalId: I-DM-3-B
question: >-
  Do you regularly evaluate the effectiveness of your security metrics so that
  its input helps drive your security strategy?
qualityCriteria:
  - >-
    You have analyzed the effectiveness of the security metrics at least once in
    the last year
  - Where possible, you verify the correctness of the data automatically
  - >-
    The metrics is aggregated with other sources like threat intelligence or
    incident management
  - >-
    You derived at least one strategic activity from the metrics in the last
    year
