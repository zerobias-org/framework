id: 82c91a83-6248-436b-b51f-c0204c6d40b1
name: Automate deployment and integrate security checks
description: >-
  Automate the deployment process over all stages and introduce sensible
  security verification tests.
longDescription: >
  Automate the deployment process to cover various stages, so that no manual
  configuration steps are needed and the risk of isolated human errors is
  eliminated. Ensure and verify that the deployment is consistent over all
  stages.

  Integrate automated security checks in your deployment process, e.g. using
  Dynamic Application Security Testing (DAST) and vulnerability scanning tools.
  Also, verify the integrity of the deployed artefacts where this makes sense.
  Log the results from these tests centrally and take any necessary actions.
  Ensure that in case any defects are detected, relevant personnel is notified
  automatically. In case any issues exceeding predefined criticality are
  identified, stop or reverse the deployment  either automatically, or introduce
  a separate manual approval workflow so that this decision is recorded,
  containing an explanation for the exception.

  Account for and audit all deployments to all stages. Have a system in place to
  record each deployment, including information about who conducted it, the
  software version that was deployed, and any relevant variables specific to the
  deploy.
benefits: Efficient deployment process with integrated security tools
elementType: activity
externalId: I-SD-2-A
question: Are deployment processes automated and employing security checks?
qualityCriteria:
  - Deployment processes are automated on all stages
  - Deployment includes automated security testing procedures
  - You alert responsible staff to identified vulnerabilities
  - >-
    You have logs available for your past deployments for a defined period of
    time
