id: e7617d14-3e20-43e9-9684-5699dede6e6d
name: Define an incident detection process
description: >-
  Follow an established, well-documented process for incident detection, with
  emphasis on automated log evaluation.
longDescription: >
  Establish a dedicated owner for the incident detection process, make clear
  documentation accessible to all process stakeholders, and ensure it is
  regularly reviewed and updated as necessary. Ensure employees responsible for
  incident detection follow this process (e.g., using training).

  The process typically relies on a high degree of automation, collecting and
  correlating log data from different sources, including application logs. You
  may aggregate logs in a central place, if suitable. Periodically verify the
  integrity of analyzed data. If you add a new application, ensure the process
  covers it within a reasonable period of time.

  Detect possible security incidents using an available checklist. The checklist
  should cover expected attack vectors and known or expected kill chains.
  Evaluate and update it regularly.

  When you determine an event is a security incident (with sufficiently high
  confidence), notify responsible staff immediately, even outside business
  hours. Perform further analysis, as appropriate, and start the escalation
  process.
benefits: Timely and consistent detection of expected security incidents
elementType: activity
externalId: O-IM-2-A
question: Do you follow a documented process for incident detection?
qualityCriteria:
  - The process has a dedicated owner
  - You store process documentation in an accessible location
  - The process considers an escalation path for further analysis
  - You train employees responsible for incident detection in this process
  - You have a checklist of potential attacks to simplify incident detection
