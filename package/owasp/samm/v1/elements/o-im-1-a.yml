id: 71a26d14-2d6d-4e7f-bb8c-a5155c9d96a2
name: Use best-effort incident detection
description: >-
  Use available log data to perform best-effort detection of possible security
  incidents.
longDescription: >
  Analyze available log data (e.g., access logs, application logs,
  infrastructure logs), to detect possible security incidents in accordance with
  known log data retention periods.

  In small setups, you can do this manually with the help of common command-line
  tools. With larger log volumes, employ automation techniques. Even a `cron`
  job, running a simple script to look for suspicious events, is a step forward!


  If you send logs from different sources to a dedicated log aggregation system,
  analyze the logs there and employ basic log correlation principles.

  Even if you don't have a 24/7 incident detection process, ensure that
  unavailability of the responsible person (e.g., due to vacation or illness)
  doesn't significantly impact detection speed or quality.

  Establish and share points of contact for formal creation of security
  incidents.
benefits: Ability to detect the most obvious security incidents
elementType: activity
externalId: O-IM-1-A
question: Do you analyze log data for security incidents periodically?
qualityCriteria:
  - You have a contact point for the creation of security incidents
  - You analyze data in accordance with the log data retention periods
  - >-
    The frequency of this analysis is aligned with the criticality of your
    applications
