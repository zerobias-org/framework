id: 867e9bc2-a3d9-434d-ba39-87d15392958f
name: Identify application dependencies
description: >-
  Create records with Bill of Materials of your applications and
  opportunistically analyze these.
longDescription: >
  Keep a record of all dependencies used throughout the target production
  environment. This is sometimes referred to as a Bill of Materials (BOM).
  Consider that different components of the application may consume entirely
  different dependencies. For example, if the software package is a web
  application, cover both the server-side application code and client-side
  scripts. In building these records, consider the various locations where
  dependencies might be specified such as configuration files, the project's
  directory on disk, a package management tool or the actual code (e.g. via an
  IDE that supports listing dependencies).

  Gather the following information about each dependency&#58;


  * Where it is used or referenced

  * Version used

  * License

  * Source information (link to repository, author's name, etc.)

  * Support and maintenance status of the dependency


  Check the records to discover any dependencies with known vulnerabilities and
  update or replace them accordingly.
benefits: Available information on known security issues in dependencies
elementType: activity
externalId: I-SB-1-B
question: Do you have solid knowledge about dependencies you're relying on?
qualityCriteria:
  - You have a current bill of materials (BOM) for every application
  - You can quickly find out which applications are affected by a particular CVE
  - >-
    You have analyzed, addressed, and documented findings from dependencies at
    least once in the last three months
