id: 447c28c6-c9c6-4784-949f-043062fe5c8d
name: Perform application risk assessments
description: >-
  A basic assessment of the application risk is performed to understand
  likelihood and impact of an attack.
longDescription: >
  Use a simple method to evaluate the application risk per application,
  estimating the potential business impact that it poses for the organization in
  case of an attack. To achieve this, evaluate the impact of a breach in the
  confidentiality, integrity and availability of the data or service. Consider
  using a set of 5-10 questions to understand important application
  characteristics, such as whether the application processes financial data,
  whether it is internet facing, or whether privacy-related data is involved.
  The application risk profile tells you whether these factors are applicable
  and if they could significantly impact the organization.

  Next, use a scheme to classify applications according to this risk. A simple,
  qualitative scheme (e.g. high/medium/low) that translates these
  characteristics into a value is often effective. It is important to use these
  values to represent and compare the risk of different applications against
  each other. Mature highly risk-driven organizations might make use of more
  quantitative risk schemes. Don't invent a new risk scheme if your organization
  already has one that works well.
benefits: Ability to classify applications according to risk
elementType: activity
externalId: D-TA-1-A
question: >-
  Do you classify applications according to business risk based on a simple and
  predefined set of questions?
qualityCriteria:
  - An agreed-upon risk classification exists
  - The application team understands the risk classification
  - >-
    The risk classification covers critical aspects of business risks the
    organization is facing
  - The organization has an inventory for the applications in scope
