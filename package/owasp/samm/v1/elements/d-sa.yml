id: 812155d6-b977-483a-849a-fd1da2a078c8
name: Secure Architecture
description: >-
  The secure architecture practice focuses on managing architectural risks for
  the software solution.
longDescription: >
  The Secure Architecture (SA) practice focuses on the security linked to
  components and technology you deal with during the architectural design of
  your software. Secure Architecture Design looks at the selection and
  composition of components that form the foundation of your solution, focusing
  on its security properties. Technology Management looks at the security of
  supporting technologies used during development, deployment and operations,
  such as development stacks and tooling, deployment tooling, and operating
  systems and tooling.
