id: 82721085-5c48-4ad8-90dd-e01a4d07ae93
name: Identify unused applications
description: >-
  Decommission unused applications and services as identified. Manage customer
  upgrades/migrations individually.
longDescription: >
  Identify unused applications on an _ad hoc_ basis, either by chance
  observation, or by occasionally performing a review. When you identify unused
  applications, process those findings for further action. If you have
  established a formal process for decommissioning unused applications, ensure
  teams are aware of and use it.

  Manage customer/user migration from older versions of your products for each
  product and customer/user group. When a product version is no longer in use by
  any customer/user group, discontinue support for that version. However, at
  this level of maturity you may have a large number of product versions in
  active use across the customer/user base, requiring significant developer
  effort to back-port product fixes.
benefits: Identification of unused of software assets or components
elementType: activity
externalId: O-OM-1-B
question: >-
  Do you identify and remove systems, applications, application dependencies, or
  services that are no longer used, have reached end of life, or are no longer
  actively developed or supported?
qualityCriteria:
  - You do not use unsupported applications or dependencies
  - >-
    You manage customer/user migration from older versions for each product and
    customer/user group
