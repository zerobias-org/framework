id: b7e23d4d-e7d9-45eb-816a-461e5306b09a
name: Set strategic KPIs
description: Set targets and KPI's for measuring the program effectiveness.
longDescription: >
  Once the organization has defined its application security metrics, collect
  enough information to establish realistic goals. Test identified metrics to
  ensure you can gather data consistently and efficiently over a short period.
  After the initial testing period, the organization should have enough
  information to commit to goals and objectives expressed through Key
  Performance Indicators (KPIs).

  While several measurements are useful for monitoring the information security
  program and its effectiveness, KPIs are comprised of the most meaningful and
  effective metrics. Aim to remove volatility common in application development
  environments from KPIs to reduce chances of unfavorable numbers resulting from
  temporary or misleading individual measurements. Base KPIs on metrics
  considered valuable not only to Information Security professionals but also to
  individuals responsible for the overall success of the application, and
  organization's leadership. View KPIs as definitive indicators of the success
  of the whole program and consider them actionable.

  Fully document KPIs and distribute them to the teams contributing to the
  success of the program as well as organization's leadership. Ideally, include
  a brief explanation of the information sources for each KPI and the meaning if
  the numbers are high or low. Include short and long-term goals, and ranges for
  unacceptable measurements requiring immediate intervention. Share action plans
  with application security and application development teams to ensure full
  transparency in understanding of the organization's objectives and goals.
benefits: Transparency on your AppSec program's performance
elementType: activity
externalId: G-SM-2-B
question: >-
  Did you define Key Performance Indicators (KPI) from available application
  security metrics?
qualityCriteria:
  - >-
    You defined KPIs after gathering enough information to establish realistic
    objectives
  - >-
    You developed KPIs with the buy-in from the leadership and teams responsible
    for application security
  - >-
    KPIs are available to the application teams and include acceptability
    thresholds and guidance in case teams need to take action
  - >-
    Success of the application security program is clearly visible based on
    defined KPIs
