id: 62e2c020-8608-4710-9699-4ded409127d9
name: Define and run security abuse cases from requirements
description: Create and test abuse cases and business logic flaw test.
longDescription: >
  Misuse and abuse cases describe unintended and malicious use scenarios of the
  application, describing how an attacker could do this. Create misuse and abuse
  cases to misuse or exploit the weaknesses of controls in software features to
  attack an application. Use abuse-case models for an application to serve as
  fuel for identification of concrete security tests that directly or indirectly
  exploit the abuse scenarios.

  Abuse of functionality, sometimes referred to as a "business logic attack",
  depends on the design and implementation of application functions and
  features. An example is using a password reset flow to enumerate accounts. As
  part of business logic testing, identify the business rules that are important
  for the application and turn them into experiments to verify whether the
  application properly enforces the business rule. For example, on a stock
  trading application, is the attacker allowed to start a trade at the beginning
  of the day and lock in a price, hold the transaction open until the end of the
  day, then complete the sale if the stock price has risen or cancel if the
  price dropped?
benefits: Detection of application business logic flaws
elementType: activity
externalId: V-RT-2-B
question: >-
  Do you create abuse cases from functional requirements and use them to drive
  security tests?
qualityCriteria:
  - Important business functionality has corresponding abuse cases
  - >-
    You build abuse stories around relevant personas with well-defined
    motivations and characteristics
  - You capture identified weaknesses as security requirements
