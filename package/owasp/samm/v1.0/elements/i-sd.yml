name: Secure Deployment
description: >-
  This practice focuses on increasing the security of software deployments to
  the production environment and the supporting secrets.
longDescription: >
  One of the final stages in delivering secure software is ensuring the security
  and integrity of developed applications are not compromised during deployment.
  The Secure Deployment (SD) practice focuses on this. To this end, the
  practice’s first stream focuses on removing manual error by automating the
  deployment process as much as possible, and making its success contingent upon
  the outcomes of integrated security verification checks. It also fosters
  Separation of Duties by making adequately trained, non-developers responsible
  for deployment.

  The second stream goes beyond the mechanics of deployment, and focuses on
  protecting the privacy and integrity of sensitive data, such as passwords,
  tokens, and other secrets, required for applications to operate in production
  environments. In its simplest form, suitable production secrets are moved from
  repositories and configuration files into adequately managed digital vaults.
  In more advanced forms, secrets are dynamically generated at deployment time
  and routine processes detect and mitigate the presence of any unprotected
  secrets in the environment.
