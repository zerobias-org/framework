id: 2a5cc6d3-9d8d-4c7d-b978-c49ba782924a
name: Automate security requirements testing
description: Perform regression testing (with security unit tests).
longDescription: >
  Write and automate regression tests for all identified (and fixed) bugs to
  ensure that these become a test harness preventing similar issues being
  introduced during later releases. Security unit tests should verify
  dynamically (i.e., at run time) that the components function as expected and
  should validate that code changes are properly implemented.

  A good practice for developers is to build security test cases as a generic
  security test suite that is part of the existing unit testing framework. A
  generic security test suite might include security test cases to validate both
  positive and negative requirements for security controls such as Identity,
  Authentication and Access Control, Input Validation and Encoding, User and
  Session Management, Error and Exception Handling, Encryption, and Auditing and
  Logging. Verify the correct execution of the security tests as early as
  possible. If feasible for example, consider the passing of security tests as
  part of merge requirements before allowing new code to enter the main code
  base. Alternatively, consider their passing a requirement for validating a
  build.

  For security functional tests, use unit level tests for the functionality of
  security controls at the software component level, such as functions, methods,
  or classes. For example, a test case could check input and output validation
  (e.g., variable sanitation) and boundary checks for variables by asserting the
  expected functionality of the component.
benefits: Timely and reliable detection of violations to security requirements
elementType: activity
externalId: V-RT-3-A
question: Do you automatically test applications for security regressions?
qualityCriteria:
  - >-
    You consistently write tests for all identified bugs (possibly exceeding a
    pre-defined severity threshold)
  - >-
    You collect security tests in a test suite that is part of the existing unit
    testing framework
