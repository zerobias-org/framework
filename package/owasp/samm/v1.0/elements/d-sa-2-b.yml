id: 8b075766-345e-4b3d-a68b-e1dd6801777d
name: Promote preferred tools and technologies
description: >-
  Standardize technologies and frameworks to be used throughout the different
  applications.
longDescription: >
  Identify commonly used technologies, frameworks and tools in use across
  software projects in the organization, whereby you focus on capturing the
  high-level technologies.

  Create a list and share it across the development organization as recommended
  technologies. When selecting them, consider incident history, track record for
  responding to vulnerabilities, appropriateness of functionality for the
  organization, excessive complexity in usage of the third-party component, and
  sufficient knowledge within the organization.

  Senior developers and architects create this list, including input from
  managers and security auditors. Share this list of recommended components with
  the development organization. Ultimately, the goal is to provide well-known
  defaults for project teams. Perform a periodic review of these technologies
  for security and appropriateness.
benefits: Technologies with appropriate security level available to product teams
elementType: activity
externalId: D-SA-2-B
question: Do you have a list of recommended technologies for the organization?
qualityCriteria:
  - The list is based on technologies used in the software portfolio
  - Lead architects and developers review and approve the list
  - You share the list across the organization
  - You review and update the list at least yearly
