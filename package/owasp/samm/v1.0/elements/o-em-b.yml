id: 7e44e28b-35ff-4d01-94ee-596de8afde2c
name: Patching and Updating
description: >
  The activities in this stream focus on the organization's handling of patches
  and updates for all elements of the technology stack. For software developed
  by the organization, these activities are concerned with delivering patches
  and updates to customers, as well as applying them to organization-managed
  solutions (e.g., software as a service). For third-party elements, these
  activities are concerned with the organization's timely application of updates
  and patches received.
