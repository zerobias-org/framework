name: Incident Response
description: >
  Incident Response starts the moment you acknowledge and verify the existence
  of a security incident. Your goal is to act in a coordinated and efficient way
  so that further damage is limited as much as possible. The activities in this
  stream focus on the organization's ability to respond appropriately and
  effectively to reported security incidents.
