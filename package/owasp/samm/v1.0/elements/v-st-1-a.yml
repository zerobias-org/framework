id: 0ffa9c40-99f5-42d0-8474-17e29da79e12
name: Perform automated security testing
description: Utilize automated security testing tools.
longDescription: >
  Use automated static and dynamic security test tools for software, resulting
  in more efficient security testing and higher quality results. Progressively
  increase the frequency of security tests and extend code coverage.

  Application security testing can be performed statically, by inspecting an
  application's source code without running it, or dynamically by simply
  observing the application's behavior in response to various input conditions.
  The former approach is often referred to as Static Application Security
  Testing (SAST), the latter as Dynamic Application Security Testing (DAST). A
  hybrid approach, known as Interactive Application Security Testing (IAST),
  combines the strengths of both approaches (at the cost of additional overhead)
  by dynamically testing automatically instrumented applications, allowing
  accurate monitoring of the application's internal state in response to
  external input.

  Many security vulnerabilities are very hard to detect without carefully
  inspecting the source code. While this is ideally performed by expert or peer
  review, it is a slow and expensive task. Although "noisier" and frequently
  less accurate than expert-led reviews, automated SAST tools are cheaper, much
  faster, and more consistent than humans. A number of commercial and free tools
  are able to efficiently detect sufficiently important bugs and vulnerabilities
  in large code bases.

  Dynamic testing does not require application source code, making it ideal for
  cases where source code is not available. It also identifies concrete
  instances of vulnerabilities. Due to its "black-box" approach , without
  instrumentation, it is more likely to uncover shallow bugs. Dynamic testing
  tools need a large source of test data whose manual test generation is
  prohibitive. Many tools exist which generate suitable test data automatically,
  leading to more efficient security testing and higher quality results.

  Select appropriate tools based on several factors, including depth and
  accuracy of inspection, robustness and accuracy of security test cases,
  available integrations with other tools, usage and cost model, etc. When
  selecting tools, use input from security-savvy technical staff as well as
  developers and development managers and review results with stakeholders.
benefits: Detection of common easy-to-find vulnerabilities
elementType: activity
externalId: V-ST-1-A
question: Do you scan applications with automated security testing tools?
qualityCriteria:
  - You dynamically generate inputs for security tests using automated tools
  - >-
    You choose the security testing tools to fit the organization's architecture
    and technology stack, and balance depth and accuracy of inspection with
    usability of findings to the organization
