id: af87834f-7ffe-40e4-b99b-6f286f94bf3a
name: Structurally verify the architecture for identified threats
description: Analyze the architecture for known threats.
longDescription: >
  Systematically review each threat identified during the Threat Assessment
  activities and examine how the architecture mitigates them. Use a standardised
  process for analyzing system architectures and the flow of data within them.
  This is typically linked to the threat model used (e.g. STRIDE) in order to
  identify the relevant security objectives which address each type of threat.
  For each threat, identify the design-level features of the architecture which
  counter it and assess their effectiveness in doing so.

  Where available, review architectural decision records to understand the
  architectural constraints and tradeoffs made during design. Take their impact
  into consideration along with any security assumptions on which the safe
  operation of the system relies and re-evaluate them.

  Enrich your previously created threat model such that each threat and its
  estimated impact are linked to the corresponding counter measure. Produce a
  mapping document, or dashboard in a specialized tool, to make the information
  available and visible to the relevant stakeholders.
benefits: All identified threats to the application are adequately handled.
elementType: activity
externalId: V-AA-2-B
question: Do you regularly evaluate the threats to your architecture?
qualityCriteria:
  - You systematically review each threat identified in the Threat Assessment
  - Trained or experienced people lead review exercise
  - You identify mitigating design-level features for each identified threat
  - You log unhandled threats as defects
