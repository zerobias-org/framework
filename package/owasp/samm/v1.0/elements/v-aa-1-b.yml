id: a0390adb-9999-4010-ac9e-433e15445a9b
name: Evaluate architecture for typical threats
description: Ad-hoc review of the architecture for unmitigated security threats.
longDescription: >
  Review the architecture for typical security threats. Security-savvy technical
  staff conduct this analysis with input from architects, developers, managers,
  and business owners as needed, to ensure the architecture addresses all common
  threats which development teams lacking specialised security expertise may
  have overlooked.

  Typical threats in an architecture can relate to incorrect assumptions in, or
  overly reliance on, the provisioning of security mechanisms such as
  authentication, authorization, user and rights management, secure
  communication, data protection, key management and log management. Threats, on
  the other hand, can also relate to known limitations of, or issues in,
  technological components or frameworks that are part of the solution and for
  which insufficient mitigation has been put in place.
benefits: Assures that the architecture protects against typical security threats.
elementType: activity
externalId: V-AA-1-B
question: >-
  Do you review the application architecture for mitigations of typical threats
  on an ad-hoc basis?
qualityCriteria:
  - You have an agreed upon model of the overall software architecture
  - Security savvy staff conduct the review
  - >-
    You consider different types of threats, including insider and data-related
    ones
