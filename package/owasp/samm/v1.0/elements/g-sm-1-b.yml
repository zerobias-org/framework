id: adde7f26-44ac-487a-ba45-b472780beee1
name: Define basic security metrics
description: >-
  Define metrics with insight into the effectiveness and efficiency of the
  Application Security Program.
longDescription: >
  Define and document metrics to evaluate the effectiveness and efficiency of
  the application security program. This way improvements are measurable and you
  can use them to secure future support and funding for the program. Considering
  the dynamic nature of most development environments, metrics should be
  comprised of measurements in the following categories


  * `Effort` metrics measure the effort spent on security. For example training
  hours, time spent performing code reviews, and number of applications scanned
  for vulnerabilities.

  * `Result` metrics measure the results of security efforts. Examples include
  number of outstanding patches with security defects and number of security
  incidents involving application vulnerabilities.

  * `Environment` metrics measure the environment where security efforts take
  place. Examples include number of applications or lines of code as a measure
  of difficulty or complexity.

  Each metric by itself is useful for a specific purpose, but a combination of
  two or three metrics together helps explain spikes in metrics trends. For
  example, a spike in a total number of vulnerabilities may be caused by the
  organization on-boarding several new applications that have not been
  previously exposed to the implemented application security mechanisms.
  Alternatively, an increase in the environment metrics without a corresponding
  increase in the effort or result could be an indicator of a mature and
  efficient security program.

  While identifying metrics, it's always recommended to stick to the metrics
  that meet several criteria


  * Consistently Measured

  * Inexpensive to gather

  * Expressed as a cardinal number or a percentage

  * Expressed as a unit of measure


  Document metrics and include descriptions of best and most efficient methods
  for gathering data, as well as recommended methods for combining individual
  measures into meaningful metrics. For example, a number of applications and a
  total number of defects across all applications may not be useful by
  themselves but, when combined as a number of outstanding high-severity defects
  per application, they provide a more actionable metric.
benefits: Basic insights into your AppSec program's effectiveness and efficiency
elementType: activity
externalId: G-SM-1-B
question: >-
  Do you use a set of metrics to measure the effectiveness and efficiency of the
  application security program across applications?
qualityCriteria:
  - >-
    You document each metric, including a description of the sources,
    measurement coverage, and guidance on how to use it to explain application
    security trends
  - >-
    Metrics include measures of efforts, results, and the environment
    measurement categories
  - >-
    Most of the metrics are frequently measured, easy or inexpensive to gather,
    and expressed as a cardinal number or a percentage
  - Application security and development teams publish metrics
