id: f2994e88-ac38-458c-8a8a-4086ac5205d5
name: Inventorize risk profiles
description: >-
  Understand the risk for all applications in the organization by centralizing
  the risk profile inventory for stakeholders.
longDescription: >
  The goal of this activity is to thoroughly understand the risk level of all
  applications within the organization, to focus the effort of your software
  assurance activities where it really matters.

  From a risk evaluation perspective, the basic set of questions is not enough
  to thoroughly evaluate the risk of all applications. Create an extensive and
  standardized way to evaluate the risk of the application, among others via
  their impact on information security (confidentiality, integrity and
  availability of data). Next to security, you also want to evaluate the privacy
  risk of the application. Understand the data that the application processes
  and what potential privacy violations are relevant. Finally, study the impact
  that this application has on other applications within the organization (e.g.,
  the application might be modifying data that was considered read-only in
  another context). Evaluate all applications within the organization, including
  all existing and legacy ones.

  Leverage business impact analysis to quantify and classify application risk. A
  simple qualitative scheme (such as high/medium/low) is not enough to
  effectively manage and compare applications on an enterprise-wide level.

  Based on this input, Security Officers leverage the classification to define
  the risk profile to build a centralized inventory of risk profiles and manage
  accountability. This inventory gives Product Owners, Managers, and other
  organizational stakeholders an aligned view of the risk level of an
  application in order to assign appropriate priority to security-related
  activities.
benefits: Solid understanding of the risk level of your application portfolio
elementType: activity
externalId: D-TA-2-A
question: >-
  Do you use centralized and quantified application risk profiles to evaluate
  business risk?
qualityCriteria:
  - >-
    The application risk profile is in line with the organizational risk
    standard
  - The application risk profile covers impact to security and privacy
  - You validate the quality of the risk profile manually and/or automatically
  - The application risk profiles are stored in a central inventory
