id: d4413abe-f1c6-4fbf-952d-20b5c5faefd8
name: Security Testing
description: >-
  This practice focuses on the detection and resolution of basic security issues
  through automation, allowing manual testing to focus on more complex attack
  vectors.
longDescription: >
  The Security Testing (ST) practice leverages the fact that, while automated
  security testing is fast and scales well to numerous applications, in-depth
  testing based on good knowledge of an application and its business logic is
  often only possible via slower, manual expert security testing. Each stream
  therefore has one approach at its core.

  The first stream focuses on establishing a common security baseline to
  automatically detect so-called "low hanging fruit". Progressively customize
  the automated tests for each application and increase their frequency of
  execution to detect more bugs and regressions earlier, as close as possible to
  their inception. The more bugs the automated processes can detect, the more
  time experts have to use their knowledge and creativity to focus on more
  complex attack vectors and ensure in-depth application testing in the second
  stream. As manual review is slow and hard to scale, reviewers prioritize
  testing components based on their risk, recent relevant changes, or upcoming
  major releases. Organizations can also access external expertise by
  participating in bug bounty programs, for example.

  Unlike the Requirements-driven testing practice which focuses on verifying
  that applications correctly implement their requirements, the goal of this
  practice is to uncover technical and business-logic weaknesses in application
  and make them visible to management and business stakeholders, irrespective of
  requirements.
