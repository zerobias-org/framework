id: 8ca8114b-3880-45fb-92a6-f2bbefe899e0
name: Identify tools and technologies
description: >-
  Elicit technologies, frameworks and integrations within the overall solution
  to identify risk.
longDescription: >
  People often take the path of least resistance in developing, deploying or
  operating a software solution. New technologies are often included when they
  can facilitate or speed up the effort or enable the solution to scale better.
  These new technologies might, however, introduce new risks to the organization
  that you need to manage.

  Identify the most important technologies, frameworks, tools and integrations
  being used for each application. Use the knowledge of the architect to study
  the development and operating environment as well as artefacts. Then evaluate
  them for their security quality and raise important findings to be managed.
benefits: Transparency of technologies that introduce security risk
elementType: activity
externalId: D-SA-1-B
question: >-
  Do you evaluate the security quality of important technologies used for
  development?
qualityCriteria:
  - >-
    You have a list of the most important technologies used in, or in support
    of, each application
  - You identify and track technological risks
  - >-
    You ensure the risks to these technologies are in line with the
    organizational baseline
