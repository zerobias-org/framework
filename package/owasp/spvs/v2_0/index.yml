name: OWASP Secure Pipeline Verification Standard (SPVS) 2.0
description: >-
  The OWASP Secure Pipeline Verification Standard (SPVS) 2.0 defines verifiable
  security requirements for software delivery pipelines across five lifecycle
  phases (Plan, Develop, Integrate, Release, Operate), assigned to three
  cumulative verification levels: Foundational, Standard and Advanced. Content
  by the OWASP SPVS project, licensed under CC BY-SA 4.0
  (https://github.com/OWASP/www-project-spvs).
