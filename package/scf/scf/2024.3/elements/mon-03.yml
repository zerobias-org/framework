id: bf1f3e0a-d2aa-58de-a7a5-24c05427f8d4
name: Content of Event Logs
description: "Mechanisms exist to configure systems to produce event logs that contain sufficient information to, at a minimum:\r\n ▪ Establish what type of event occurred;\r\n ▪ When (date and time) the event occurred;\r\n ▪ Where the event occurred;\r\n ▪ The source of the event;\r\n ▪ The outcome (success or failure) of the event; and \r\n ▪ The identity of any user/subject associated with the event."
