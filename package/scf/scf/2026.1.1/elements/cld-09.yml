id: 5827da1f-34ab-42b8-ba48-88255f0fe6ef
name: Geolocation Requirements for Processing, Storage and Service Locations
description: Mechanisms exist to control the location of cloud processing/storage based on business requirements that includes statutory, regulatory and contractual obligations.
elementType: control
externalId: CLD-09
parent: cld
controlQuestion: Does the organization control the location of cloud processing/storage based on business requirements that includes statutory, regulatory and contractual obligations?
functionGrouping: Protect
controlWeighting: '10'
cmm_0:
  name: Not Performed
  description: Practices are non-existent, based on the inability to demonstrate an implemented and operational capability. A reasonable person would conclude the control is not being performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    Cloud Security (CLD) domain capabilities are ad hoc and inconsistent. Capability criteria associated with this control may include:
    ▪ Policies, standards & procedures associated with CLD domain capabilities provide limited coverage due to the depth and breadth of the existing documentation.
    ▪ Cloud management-related activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.
    ▪ Geolocation requirements for sensitive/regulated data types identify restrictions on transfer of data to third-countries or international organizations.
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    Cloud Security (CLD) capabilities are requirements-driven, but are not standardized across the entity (e.g., local/regional level consistency). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with CLD domain capabilities are formally documented and centrally-managed by the entity.
    ▪ Standardized Operating Procedures (SOP) associated with CLD domain capabilities are documented and maintained by process owners.
    ▪ IT and/or cybersecurity personnel work with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with CLD  domain capabilities to address applicable statutory, regulatory and/or contractual requirements for Technology Assets, Applications, Services and/or Data (TAASD).
    ▪ Cloud management controls-related controls are primarily administrative and preventative in nature (e.g., policies, standards, procedures & guidelines).
    ▪ Cloud management may be a defined function (e.g., team or department) or assigned as an additional duty to existing IT and/or cybersecurity personnel.
    ▪ Cloud-based Technology Assets, Applications and/or Services (TAAS) are governed according to the same processes used for on-premises TAAS, where no formal, dedicated cloud governance process exists.
    ▪ IT and/or cybersecurity personnel work with business stakeholders and process owners to govern geolocation requirements for sensitive/regulated data types, including the transfer of data to third-countries or international organizations.
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: |-
    Cloud Security (CLD) capabilities are standardized across the entity for applicability to People, Processes, Technologies, Data and/or Facilities (PPTDF) to ensure consistency for Technology Assets, Applications, Services and/or Data (TAASD). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with CLD domain capabilities are formally documented and centrally-managed by the entity's Governance, Risk & Compliance (GRC) team, or similar function.
    ▪ Standardized Operating Procedures (SOP) associated with CLD domain capabilities are well-documented and kept current by process owners.
    ▪ A cloud governance team, or similar function, is appropriately staffed and supported to implement and maintain CLD domain capabilities.
    ▪ Technology is leveraged to enhance the efficiency and accuracy of cloud governance operations (e.g., multi-cloud governance tools, policy enforcement, cost management, etc.).
    ▪ The entity's Governance, Risk & Compliance (GRC) team, or similar function, works with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with CLD domain capabilities to address Minimum Compliance Requirements (MCR) (e.g., applicable statutory, regulatory and/or contractual requirements) and Discretionary Security Requirements (DSR) (e.g., entity-required controls).
    ▪ An implemented and operational capability exists to control the location of cloud processing/storage based on business requirements that includes statutory, regulatory and contractual obligations.
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    Compliance (CPL) capabilities, in addition to being standardized across the entity and centrally managed to ensure consistency across Technology Assets, Applications, Services and/or Data (TAASD), efforts are metrics driven to provide sufficient insight for decision makers to predict optimal performance, ensure continued operations and/or identify areas for improvement. Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Applicable SCR-CMM Level 3 (Well Defined) capabilities are implemented and operational.
    ▪ Metrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).
    ▪ Metrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).
    ▪ Scope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.
    ▪ Organizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).
    ▪ Based on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.
    ▪ Business and technical stakeholders are involved in reviewing and approving proposed changes to evolve capabilities.
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    Cloud Security (CLD) capabilities, in addition to being standardized across the entity and centrally managed to ensure consistency across Technology Assets, Applications, Services and/or Data (TAASD), efforts are metrics driven to provide sufficient insight for decision makers to predict optimal performance, ensure continued operations and/or identify areas for improvement. Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Applicable SCR-CMM Level 3 (Well Defined) capabilities are implemented and operational.
    ▪ Based on predictive analysis, process improvements are implemented according to “continuous improvement” practices that affect process changes.
    ▪ Stakeholders make time-sensitive decisions to support operational efficiency, which may include automated remediation actions.
  available: true
  value: 5
