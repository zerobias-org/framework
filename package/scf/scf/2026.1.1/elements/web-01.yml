id: 5f25d343-6197-4512-99ac-350a5839716a
name: Web Security
description: Mechanisms exist to facilitate the implementation of an enterprise-wide web management policy, as well as associated standards, controls and procedures.
elementType: control
externalId: WEB-01
parent: web
controlQuestion: Does the organization facilitate the implementation of an enterprise-wide web management policy, as well as associated standards, controls and procedures?
functionGrouping: Govern
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: Practices are non-existent, based on the inability to demonstrate an implemented and operational capability. A reasonable person would conclude the control is not being performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    Web Security (WEB) domain capabilities are ad hoc and inconsistent. Capability criteria associated with this control may include:
    ▪ Policies, standards & procedures associated with WEB domain capabilities provide limited coverage due to the depth and breadth of the existing documentation.
    ▪ Web management-related activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    Web Security (WEB) capabilities are requirements-driven, but are not standardized across the entity (e.g., local/regional level consistency). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with WEB domain capabilities are formally documented and centrally-managed by the entity.
    ▪ Standardized Operating Procedures (SOP) associated with WEB domain capabilities are documented and maintained by process owners.
    ▪ IT and/or cybersecurity personnel work with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with WEB  domain capabilities to address applicable statutory, regulatory and/or contractual requirements for Technology Assets, Applications, Services and/or Data (TAASD).
    ▪ Web security-related controls are primarily administrative and preventative in nature (e.g., policies, standards, procedures & guidelines).
    ▪ Web security management may be a defined function (e.g., team or department) or assigned as an additional duty to existing IT and/or cybersecurity personnel.
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: |-
    Web Security (WEB) capabilities are standardized across the entity for applicability to People, Processes, Technologies, Data and/or Facilities (PPTDF) to ensure consistency for Technology Assets, Applications, Services and/or Data (TAASD). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with WEB domain capabilities are formally documented and centrally-managed by the entity's Governance, Risk & Compliance (GRC) team, or similar function.
    ▪ Standardized Operating Procedures (SOP) associated with WEB domain capabilities are well-documented and kept current by process owners.
    ▪ A web management team, or simiE210:E1635main capabilities.
    ▪ Technology is leveraged to enhance the efficiency and accuracy of web management operations (e.g., secure web gateway, Content Management System (CMS) solution, etc.).
    ▪ The entity's Governance, Risk & Compliance (GRC) team, or similar function, works with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with WEB domain capabilities to address Minimum Compliance Requirements (MCR) (e.g., applicable statutory, regulatory and/or contractual requirements) and Discretionary Security Requirements (DSR) (e.g., entity-required controls).
    ▪ An implemented and operational capability exists to facilitate the implementation of an enterprise-wide web management policy, as well as associated standards, controls and procedures.
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    Utilize SCR-CMM Level 3 criteria definitions:
    ▪ There are no defined Level 4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to operationalize this control.
    ▪ While it may be possible to develop “metrics-driven” capabilities for this control, the criteria would be organization-specific to define.
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    Utilize SCR-CMM Level 3 or Level 4 (if available) criteria definitions:
    ▪ There are no defined Level 5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to operationalize this control.
    ▪ Level 5 capabilities should be considered “world-class” where the control builds on Level 4 capabilities, but are continuously improving through Artificial Intelligence (AI) and/or Machine Learning (ML) technologies.
    ▪ While it may be possible to develop responsive capabilities for this control through the use of AI and/or ML technologies, the criteria would be organization-specific to define.
  available: true
  value: 5
