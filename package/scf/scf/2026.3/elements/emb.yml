id: 9f5abcc9-3895-4117-b428-04b49a2f09f8
name: Embedded Technology
description: Apply risk-based security, compliance and resilience practices to embedded technologies where compromise or misuse could create operational, safety and/or data protection impacts.
elementType: domain
externalId: EMB
intent: Organizations develop, deploy, harden, monitor and maintain embedded technologies, including IoT and Operational Technology (OT), with safeguards for hardware, firmware, software, communications, service protocols and safety-related dependencies.
