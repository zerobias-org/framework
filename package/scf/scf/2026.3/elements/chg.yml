id: 8b826335-1098-41cc-8573-c5c7f7f06d83
name: Change Management
description: Manage changes to Technology Assets, Applications, Services and Data (TAASD) through an authorized, risk-based process that evaluates, implements and validates changes before and after deployment.
elementType: domain
externalId: CHG
intent: Organizations ensure technology and business stakeholders assess, authorize, test, implement, monitor and validate changes to minimize production impact, preserve availability, support rollback and maintain secure configurations.
