name: Asset Management
description: Manage Technology Assets, Applications and Services (TAAS) throughout their lifecycle to maintain visibility, accountability, authorization and protection.
elementType: domain
externalId: AST
intent: Organizations maintain accurate inventories, ownership records and data relationships for TAAS from procurement through disposal to ensure only authorized assets, applications and services are used and associated data is protected throughout its lifecycle.
