name: Information Assurance
description: Execute Information Assurance (IA) practices to validate that expected security, compliance and resilience controls are appropriately designed and operating as intended for Technology Assets, Applications and Services (TAAS).
elementType: domain
externalId: IAO
intent: Organizations validate the adequacy and operating effectiveness of security, compliance and resilience controls across development, testing and production environments through assurance activities that support defensible risk and compliance decisions.
