id: 3e9cc3cb-f843-438e-8611-cb5cfb0fb7e3
name: Business Continuity & Disaster Recovery
description: Maintain resilient capabilities to sustain business-critical functions and recover from disruptions through documented, tested and maintained continuity and recovery processes.
elementType: domain
externalId: BCD
intent: Organizations establish, exercise and improve Business Continuity and Disaster Recovery (BC/DR) capabilities to minimize operational disruption from adverse events, meet recovery objectives and support business, legal, regulatory and stakeholder obligations.
