id: a68a534f-2bf8-4d16-9c32-827f13df43e8
name: Mobile Device Management
description: Govern mobile device access to Technology Assets, Applications, Services and Data (TAASD) to reduce attack surface and data exposure.
elementType: domain
externalId: MDM
intent: Organizations manage risks associated with organization-owned, employee-owned and third-party-owned mobile devices through centralized, risk-based controls for device access, configuration, data storage, monitoring and remote management commensurate with ownership model and risk.
