id: a792b25e-4842-421d-9e6e-b20b6d8630f2
name: Security, Compliance & Resilience Governance
description: Govern the security, compliance and resilience program through accountable oversight, evidence-based decision-making and defensible evidence of its effectiveness.
elementType: domain
externalId: GOV
intent: Organizations establish and maintain governance structures, decision rights, accountability mechanisms and documented evidence to demonstrate that security, compliance and resilience practices are designed, implemented, monitored and improved in a manner that can withstand scrutiny from leadership, regulators, auditors, customers and other interested parties.
