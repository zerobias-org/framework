name: Human Resources Security
description: Execute security-informed personnel management practices that address screening, onboarding, acceptable behavior, role-based risk, competence and offboarding requirements.
elementType: domain
externalId: HRS
intent: Organizations cultivate a security, compliance and resilience-minded workforce by defining personnel security expectations, validating role-based competence, supporting appropriate culture and collaboration, and managing personnel risk throughout the employment lifecycle.
