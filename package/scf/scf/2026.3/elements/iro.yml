id: 829a5e30-338c-47f4-a4a0-73b846de90ab
name: Incident Response
description: Maintain a tested incident response capability that enables trained responders to identify, analyze, contain, eradicate and recover from incidents.
elementType: domain
externalId: IRO
intent: Organizations establish, maintain and exercise the capability to lawfully and effectively respond to cybersecurity incidents in a timely manner, preserve evidence and notify affected stakeholders as required.
