name: Identification & Authentication
description: Implement Identity and Access Management (IAM) capabilities that enforce least privilege across human users, devices, service accounts and other non-person entities.
elementType: domain
externalId: IAC
intent: "Organizations enforce least privilege by limiting access to Technology Assets, Applications, Services and Data (TAASD) to authorized users, services and entities\_with Need to Know (NTK) / Need to Access (NTA)\_based on approved identities, authentication strength, attributes and access rights."
