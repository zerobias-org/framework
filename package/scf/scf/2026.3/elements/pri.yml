name: Data Privacy
description: Execute risk-based, legally defensible data privacy practices that conform with applicable obligations to protect sensitive personal data throughout its lifecycle.
elementType: domain
externalId: PRI
intent: Organizations govern and implement privacy practices that align with overall privacy strategy; meet statutory regulatory and contractual obligations; ensure privacy by design and by default; protect individual rights; and provide lawful processing and safeguards for sensitive Personal Data (sPD).
