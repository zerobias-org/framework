id: 00fdc2cc-4827-5aea-82df-6f5b652e7c36
name: Specialized Assessments
description: "Mechanisms exist to conduct specialized assessments for: \r\n ▪ Statutory, regulatory and contractual compliance obligations;\r\n ▪ Monitoring capabilities; \r\n ▪ Mobile devices;\r\n ▪ Databases;\r\n ▪ Application security;\r\n ▪ Embedded technologies (e.g., IoT, OT, etc.);\r\n ▪ Vulnerability management; \r\n ▪ Malicious code; \r\n ▪ Insider threats and\r\n ▪ Performance/load testing."
elementType: enhancement
externalId: IAO-02.2
controlQuestion: "Does the organization conduct specialized assessments for: \r\n ▪ Statutory, regulatory and contractual compliance obligations;\r\n ▪ Monitoring capabilities; \r\n ▪ Mobile devices;\r\n ▪ Databases;\r\n ▪ Application security;\r\n ▪ Embedded technologies (e.g., IoT, OT, etc.);\r\n ▪ Vulnerability management; \r\n ▪ Malicious code; \r\n ▪ Insider threats and\r\n ▪ Performance/load testing?"
methodsToComply: "- Information Assurance (IA) program\r\n- VisibleOps security management\r\n- CimTrak Integrity Suite (https://www.cimcor.com/cimtrak/)\r\n- NNT Change Tracker (https://www.newnettechnologies.com)"
functionGrouping: Protect
controlWeighting: '9'
parent: iao-02
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to conduct specialized assessments for:
    ▪ Statutory, regulatory and contractual compliance obligations;
    ▪ Monitoring capabilities;
    ▪ Mobile devices;
    ▪ Databases;
    ▪ Application security;
    ▪ Embedded technologies (e.g., IoT, OT, etc.);
    ▪ Vulnerability management;
    ▪ Malicious code;
    ▪ Insider threats and
    ▪ Performance/load testing.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Information Assurance (IA) is ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPre-production security testing is decentralized.\n•\tIT personnel implement and maintain an informal process to conduct limited control testing of High Value Assets (HVAs) to meet specific statutory, regulatory and/ or contractual requirements for pre-production cybersecurity & data privacy control testing."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Information Assurance (IA) is requirements-driven and formally governed at a local/regional level, but not consistently across the enterprise. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPre-production security testing is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for pre-production cybersecurity & data privacy control testing.\n•\tIT personnel implement and maintain an established a limited Information Assurance Program (IAP) capability to conduct limited control testing to meet specific statutory, regulatory and/ or contractual requirements for pre-production cybersecurity & data privacy control testing.\n•\tIAP operations focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tAdministrative processes and technologies exist to conduct specialized assessments for specific statutory, regulatory and contractual compliance obligations, as well as business-critical technologies."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Information Assurance (IA) is standardized across the enterprise and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCybersecurity personnel implement and maintain an established Information Assurance Program (IAP) capability to conduct “business as usual” pre-production cybersecurity & data privacy control testing focused on the concept of “security and data privacy be design and by default.”\n•\tThe IAP validates that systems/applications/services/processes are both secure and compliant.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, facilitates the implementation of cybersecurity & data privacy controls to ensure that secure engineering practices are designed and implemented throughout the lifecycle of systems, applications and services both internal and external to the organization.\n•\tA Project Management Office (PMO), or project management function, ensures project involvement for IAP as part of the organization’s established project management processes.\n•\tA Plan of Action and Milestones (POA&M) or similar mechanism, exists to document planned remediation actions to correct weaknesses or deficiencies noted during the assessment of the security controls, helping to reduce or eliminate known vulnerabilities.\n•\tAdministrative processes prevent systems/applications/services/processes from “going live” in a production environment without first going through the IAP process.\n•\tThe IAP uses a tiered approach to conformity testing, based on (1) the sensitivity of data that is stored, processed and/ or transmitted and (2) the criticality of the system/application/service/process.\n•\tAdministrative processes and technologies exist to conduct specialized assessments for specific statutory, regulatory and contractual compliance obligations, as well as business-critical technologies."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Information Assurance (IA) is metrics driven and provides sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in the review process for proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to conduct specialized assessments for:
    ▪ Statutory, regulatory and contractual compliance obligations;
    ▪ Monitoring capabilities;
    ▪ Mobile devices;
    ▪ Databases;
    ▪ Application security;
    ▪ Embedded technologies (e.g., IoT, OT, etc.);
    ▪ Vulnerability management;
    ▪ Malicious code;
    ▪ Insider threats and
    ▪ Performance/load testing.
  available: false
  value: 5
