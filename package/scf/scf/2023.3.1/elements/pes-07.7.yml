id: 1026c9d5-5295-532f-ae17-a095f9137e69
name: Redundant Cabling
description: Mechanisms exist to employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged.
elementType: enhancement
externalId: PES-07.7
controlQuestion: Does the organization employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged?
functionGrouping: Protect
controlWeighting: '2'
parent: pes-07
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Physical & Environmental Security (PES) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPhysical access control is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for physical access control.\n•\tHuman Resources, or a similar function, maintains a current list of personnel with authorized access to organizational facilities and facilitates the implementation of physical access management controls.\n•\tPhysical security controls are primarily administrative in nature (e.g., policies & standards).\n•\tPhysical controls, administrative processes and technologies are primarily designed and implemented for offices, rooms and facilities that focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tA facilities maintenance team, or similar function, manages the operation of automated physical and environmental protection controls."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Physical & Environmental Security (PES) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA physical security team, or similar function:\no\tPerforms the centralized-management of physical security controls across the enterprise.\no\tMaintains a current list of personnel with authorized access to organizational facilities and implements physical access management controls.\n•\tA facilities maintenance team, or similar function, manages the operation of environmental protection controls.\n•\tAdministrative processes exist to authorize physical access to facilities based on the position or role of the individual.\n•\tAdministrative processes and physical controls restrict unescorted access to facilities to personnel with required security clearances, formal access authorizations and validated the need for access."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to employ redundant power cabling paths that are physically separated to ensure that power continues to flow in the event one of the cables is cut or otherwise damaged.
  available: false
  value: 5
