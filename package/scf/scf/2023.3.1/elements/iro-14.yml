id: 801c77a1-4871-595a-a022-a832501f9aed
name: Regulatory & Law Enforcement Contacts
description: Mechanisms exist to maintain incident response contacts with applicable regulatory and law enforcement agencies.
elementType: control
externalId: IRO-14
controlQuestion: Does the organization maintain incident response contacts with applicable regulatory and law enforcement agencies?
functionGrouping: Identify
controlWeighting: '9'
parent: iro
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to maintain incident response contacts with applicable regulatory and law enforcement agencies.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to maintain incident response contacts with applicable regulatory and law enforcement agencies.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Incident Response (IRO) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIncident response operations are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for incident response operations.\no\tImplement and maintain an incident response capability using a documented and tested Incident Response Plan (IRP) to facilitate incident management operations that cover preparation, detection and analysis, containment, eradication and recovery.\n•\tAdministrative processes and technologies exist to maintain incident response contacts with applicable regulatory and law enforcement agencies."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Incident Response (IR) processes are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Integrated Security Incident Response Team (ISIRT), or similar function, exists to form an on-demand, scalable and integrated team of formally-assigned cybersecurity, IT, data privacy and business function representatives that can perform coordinated incident response.\n•\tThe ISIRT, or similar function, develops and maintains a documented, program-level Integrated Incident Response Program (IIRP) that provides operational and tactical-level guidance for cybersecurity & data privacy response operations.\n•\tA Security Operations Center (SOC), or similar function, facilitates incident management operations that includes preparation, detection and analysis, containment, eradication and recovery.\n•\tBusiness Process Owners (BPOs), in conjunction with the SOC and ISIRT functions, develop and maintain a documented Incident Response Plan (IRP) specific to the business process / business unit but inclusive of the organization’s larger approach to incident response operations.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and provides that information to the SOC for Incident Response Operations (IRO).\n•\tAdministrative processes and technologies exist to maintain incident response contacts with applicable regulatory and law enforcement agencies."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Incident Response (IR) is metrics driven and provides sufficient management insight (based on a quantitative understanding of process of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to maintain incident response contacts with applicable regulatory and law enforcement agencies.
  available: false
  value: 5
