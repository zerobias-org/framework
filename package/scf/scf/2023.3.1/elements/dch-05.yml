id: 30b4492f-8c59-5210-b086-7843c298dcc3
name: Cybersecurity & Data Privacy Attributes
description: Mechanisms exist to bind cybersecurity & data privacy attributes to information as it is stored, transmitted and processed.
elementType: control
externalId: DCH-05
controlQuestion: Does the organization bind security attributes to information as it is stored, transmitted and processed?
functionGrouping: Protect
controlWeighting: '2'
parent: dch
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to bind security attributes to information as it is stored, transmitted and processed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to bind security attributes to information as it is stored, transmitted and processed.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to bind security attributes to information as it is stored, transmitted and processed.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Data Classification & Handling (DCH) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, assists users in making information sharing decisions to ensure data is appropriately protected, regardless of where or how it is stored, processed and/ or transmitted.\n•\tA data classification process exists to identify categories of data and specific protection requirements.\n•\tA data retention process exists to protect archived data in accordance with applicable statutory, regulatory and contractual obligations.\n•\tData/process owners:\no\tAre expected to take the initiative to work with Data Protection Officers (DPOs) to ensure applicable statutory, regulatory and contractual obligations are properly addressed, including the storage, transmission and processing of sensitive/regulated data.\no\tMaintain decentralized inventory logs of all sensitive/regulated media and update sensitive/regulated media inventories at least annually.\no\tCreate and maintain Data Flow Diagrams (DFDs) and network diagrams.\no\tDocument where sensitive/regulated data is stored, transmitted and processed in order to document data repositories and data flows.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of sensitive/regulated data processed, stored or transmitted on internal or external systems, in order to implement cybersecurity & data privacy controls in accordance with applicable statutory, regulatory and contractual obligations.\n•\tHuman Resources (HR), documents formal “rules of behavior” as an employment requirement that stipulates acceptable and unacceptable practices pertaining to sensitive/regulated data handling.\n•\tData Loss Prevention (DLP), or similar content filtering capabilities, blocks users from performing ad hoc file transfers through unapproved file transfer services (e.g., Box, Dropbox, Google Drive, etc.).\n•\tMobile Device Management (MDM) software is used to restrict and protect the data that resides on mobile devices.\n•\tAdministrative processes and technologies:\no\tIdentify data classification types to ensure adequate cybersecurity & data privacy controls are in place to protect organizational information and individual data privacy.\no\tIdentify and document the location of information on which the information resides.\no\tRestrict and govern the transfer of data to third-countries or international organizations.\no\tLimit the disclosure of data to authorized parties.\no\tMark media in accordance with data protection requirements so that personnel are alerted to distribution limitations, handling caveats and applicable security requirements.\no\tProhibit “rogue instances” where unapproved third parties are engaged to store, process or transmit data, including budget reviews and firewall connection authorizations.\no\tProtect and control digital and non-digital media during transport outside of controlled areas using appropriate security measures.\no\tGovern the use of personal devices (e.g., Bring Your Own Device (BYOD)) as part of acceptable and unacceptable behaviors.\no\tDictate requirements for minimizing data collection to what is necessary for business purposes.\no\tDictate requirements for limiting the use of sensitive/regulated data in testing, training and research."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to bind security attributes to information as it is stored, transmitted and processed.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to bind security attributes to information as it is stored, transmitted and processed.
  available: false
  value: 5
