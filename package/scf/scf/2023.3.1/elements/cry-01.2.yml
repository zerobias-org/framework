id: 5d9fbe4e-7334-53be-a4ff-45bc63e3d18f
name: Export-Controlled Technology
description: Mechanisms exist to address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements.
elementType: enhancement
externalId: CRY-01.2
controlQuestion: Does the organization address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements?
functionGrouping: Protect
controlWeighting: '5'
parent: cry-01
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cryptographic Protections (CRY) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCryptographic management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cryptographic management.\n•\tData classification and handling criteria govern requirements to encrypt sensitive/regulated data during transmission and in storage.\n•\tDecentralized technologies implement cryptographic mechanisms on endpoints to control how sensitive/regulated data is encrypted during transmission and in storage.\n•\tSystems, applications and services that store, process or transmit sensitive/regulated data use cryptographic mechanisms to prevent unauthorized disclosure of information as an alternate to physical safeguards."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cryptographic Protections (CRY) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tData classification and handling criteria govern requirements to encrypt sensitive/regulated data during transmission and in storage.\n•\tCentrally-managed technologies implement cryptographic mechanisms on endpoints to control how sensitive/regulated data is encrypted during transmission and in storage.\n•\tSystems, applications and services that store, process or transmit sensitive/regulated data use cryptographic mechanisms to prevent unauthorized disclosure of information as an alternate to physical safeguards.\n•\tAn IT infrastructure team, or similar function:\no\tImplements Public Key Infrastructure (PKI) key management controls to protect the confidentiality, integrity and availability of keys.\no\tImplements and maintains an internal PKI infrastructure or obtains PKI services from a reputable PKI service provider.\n•\tSystems, applications and services that include cryptographic mechanisms are controlled to ensure the exporting of cryptographic technologies is in compliance with relevant statutory and regulatory requirements."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to address the exporting of cryptographic technologies in compliance with relevant statutory and regulatory requirements.
  available: false
  value: 5
