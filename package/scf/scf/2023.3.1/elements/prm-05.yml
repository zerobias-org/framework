id: 1df0ff9f-7ca9-54d9-b766-5ec1076d5af3
name: Cybersecurity & Data Privacy Requirements Definition
description: Mechanisms exist to identify critical system components and functions by performing a criticality analysis for critical systems, system components or services at pre-defined decision points in the Secure Development Life Cycle (SDLC).
elementType: control
externalId: PRM-05
controlQuestion: Does the organization identify critical system components and functions by performing a criticality analysis for critical systems, system components or services at pre-defined decision points in the Secure Development Life Cycle (SDLC)?
methodsToComply: '- Secure Development Life Cycle (SDLC)'
functionGrouping: Identify
controlWeighting: '9'
parent: prm
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to identify critical system components and functions by performing a criticality analysis for critical systems, system components or services at pre-defined decision points in the Secure Development Life Cycle (SDLC).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Project & Resource Management (PRM) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tProgram/project management is decentralized.\n•\tIT personnel work with data/process owners to help ensure secure practices are implemented throughout the System Development Lifecycle (SDLC) for all high-value projects."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Project & Resource Management (PRM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tProgram/project management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for Project Management (PM).\n•\tThe PM function facilitates the implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe responsibility for enforcing cybersecurity & data privacy control implementation is assigned to business / process owners and asset custodians."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Project & Resource Management (PRM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Project Management Office (PMO), or project management function, enables the centralized-implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe PMO determines the identification and allocation of resources for cybersecurity & data privacy requirements within business process planning for projects and other initiatives.\n•\tProject Management (PM) is centrally-managed across the enterprise to implement cybersecurity & data privacy controls as part of the project management lifecycle, with the responsibility for enforcing cybersecurity & data privacy control implementation assigned to business / process owners and asset custodians.\n•\tThe Chief Information Security Officer (CISO), or similar function, analyzes the organization’s business strategy and prioritizes the objectives of the security function, based on business requirements.\n•\tThe CISO, or similar function, leverages a capability maturity model to define and identify targeted capability maturity levels for each of the functions that make up the cybersecurity & data privacy program.\n•\tSubordinate staff and stakeholders are educated on the capability maturity expectations and those targets are used to task individual contributor work activities in an effort to achieve the targeted maturity levels.\n•\tA Governance, Risk & Compliance (GRC), or security engineering function, conducts functional testing of all applicable administrative, physical and technical controls as part of “business as usual” pre-production testing to determine the extent to which the controls are implemented correctly, operating as intended and producing the desired outcome with respect to meeting the defined business requirements."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Project & Resource Management (PRM) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to identify critical system components and functions by performing a criticality analysis for critical systems, system components or services at pre-defined decision points in the Secure Development Life Cycle (SDLC).
  available: false
  value: 5
