name: AI & Autonomous Technologies Likelihood & Impact Risk Analysis
description: Mechanisms exist to define the potential likelihood and impact of each identified risk based on expected use and past uses of Artificial Intelligence (AI) and Autonomous Technologies (AAT) in similar contexts.
elementType: enhancement
externalId: AAT-07.2
controlQuestion: Does the organization define the potential likelihood and impact of each identified risk based on expected use and past uses of Artificial Intelligence (AI) and Autonomous Technologies (AAT) in similar contexts?
functionGrouping: Identify
controlWeighting: '10'
parent: aat-07
