id: a7721980-4cea-53f6-9354-37d57bf885ae
name: Incident Response
description: Requires maintaining a viable incident response capability, with trained personnel who can recognize, report and handle incidents per a documented plan.
elementType: domain
externalId: IRO
intent: Organizations establish and maintain a viable and tested capability to respond to cybersecurity or data privacy-related incidents in a timely manner, where organizational personnel understand how to detect and report potential incidents.
