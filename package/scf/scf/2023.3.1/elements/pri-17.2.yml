name: Notice of Financial Incentive
description: Mechanisms exist to provide data subjects with a Notice of Financial Incentive that explains the material terms of a financial incentive, price or service difference so the data subject can make an informed decision about whether to participate.
elementType: enhancement
externalId: PRI-17.2
controlQuestion: Does the organization provide data subjects with a Notice of Financial Incentive that explains the material terms of a financial incentive, price or service difference so the data subject can make an informed decision about whether to participate?
functionGrouping: Identify
controlWeighting: '2'
parent: pri-17
