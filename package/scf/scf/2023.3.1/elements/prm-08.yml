id: d54f1042-6112-5332-a1d0-28baffd7b42b
name: Manage Organizational Knowledge
description: Mechanisms exist to manage the organizational knowledge of the cybersecurity & data privacy staff.
elementType: control
externalId: PRM-08
controlQuestion: Does the organization manage the organizational knowledge. of the cybersecurity & data privacy staff?
functionGrouping: Protect
controlWeighting: '5'
parent: prm
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to manage the organizational knowledge of the cybersecurity & data privacy staff.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to manage the organizational knowledge of the cybersecurity & data privacy staff.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Project & Resource Management (PRM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tProgram/project management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for Project Management (PM).\n•\tThe PM function facilitates the implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe responsibility for enforcing cybersecurity & data privacy control implementation is assigned to business / process owners and asset custodians.\n•\tCritical business functions are documented in “run books” or Standardized Operating Procedures (SOPs) to capture the knowledge in documentation form."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Project & Resource Management (PRM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Project Management Office (PMO), or project management function, enables the centralized-implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe PMO determines the identification and allocation of resources for cybersecurity & data privacy requirements within business process planning for projects and other initiatives.\n•\tProject Management (PM) is centrally-managed across the enterprise to implement cybersecurity & data privacy controls as part of the project management lifecycle, with the responsibility for enforcing cybersecurity & data privacy control implementation assigned to business / process owners and asset custodians.\n•\tThe Chief Information Security Officer (CISO), or similar function, analyzes the organization’s business strategy and prioritizes the objectives of the security function, based on business requirements.\n•\tThe CISO, or similar function, leverages a capability maturity model to define and identify targeted capability maturity levels for each of the functions that make up the cybersecurity & data privacy program.\n•\tSubordinate staff and stakeholders are educated on the capability maturity expectations and those targets are used to task individual contributor work activities in an effort to achieve the targeted maturity levels.\n•\tLine of Business (LOB) stakeholders are identified and tasked with documenting business-critical functions in “run books” or Standardized Operating Procedures (SOPs) to capture the knowledge in documentation form from both a business and technology perspective."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to manage the organizational knowledge of the cybersecurity & data privacy staff.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to manage the organizational knowledge of the cybersecurity & data privacy staff.
  available: false
  value: 5
