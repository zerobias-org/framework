id: 2a5a637f-83e4-5544-8128-9db23c942112
name: Cloud Security Architecture
description: Mechanisms exist to ensure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.
elementType: control
externalId: CLD-02
controlQuestion: Does the organization ensure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments?
methodsToComply: "- Architectural review board\r\n- System Security Plan (SSP)\r\n- Security architecture roadmaps"
functionGrouping: Protect
controlWeighting: '8'
parent: cld
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to ensure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Cloud Security (CLD) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCloud-based technologies are governed no differently from on-premise network assets (e.g., cloud-based technology is viewed as an extension of the corporate network).\n•\tA Shared Responsibility Matrix (SRM), or similar Customer Responsibility Matrix (CRM), is documented for each Cloud Service Providers (CSPs) instance that takes into account differences between Software as a Service (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) methodologies."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cloud Security (CLD) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCloud security management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cloud security management.\no\tUse an informal process to govern cloud-specific cybersecurity & data privacy-specific tools.\n•\tA Shared Responsibility Matrix (SRM), or similar Customer Responsibility Matrix (CRM), is documented for each Cloud Service Providers (CSPs) instance that takes into account differences between Software as a Service (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) methodologies.\n•\tIT personnel have a documented architecture for cloud-based technologies to support cybersecurity and data protection requirements.\n•\tCybersecurity and data privacy requirements are identified and documented for cloud-specific sensitive/regulated data processing, storing and/ or transmitting, including restrictions on data processing and storage locations.\n•\tTechnologies exist to support:\no\tA secure infrastructure, including a managed security zone to house cybersecurity & data privacy tools.\no\tA standardized virtualization format.\no\tCloud access points, including a managed security zone with\no\tData handling & portability, including a managed security zone to house cybersecurity & data privacy tools\no\tIntegrity of multi-tenant CSP assets, including a managed security zone to house cybersecurity & data privacy tools\no\tIntegrity of VM images, including a managed security zone to house cybersecurity & data privacy tools.\no\tProcessing and storage of service location, including a managed security zone to house cybersecurity & data privacy tools."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cloud Security (CLD) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tRoles and associated responsibilities for governing cloud instances, including provisioning, maintaining and deprovisioning, are formally assigned.\n•\tA Shared Responsibility Matrix (SRM), or similar Customer Responsibility Matrix (CRM), is documented for each Cloud Service Providers (CSPs) instance that takes into account differences between Software as a Service (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) methodologies.\n•\tIT architects, in conjunction with cybersecurity architects:\no\tEnsure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.\no\tEnsure multi-tenant CSP assets (physical and virtual) are designed and governed such that provider and customer (tenant) user access is appropriately segmented from other tenant users.\no\tEnsure CSPs use secure protocols for the import, export and management of data in cloud-based services.\no\tImplement a dedicated subnet to host security-specific technologies on all cloud instances, where technically feasible.\n•\tA Change Advisory Board (CAB), or similar function:\no\tGoverns changes to cloud-based systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews processes to identify and prevent use of unapproved CSPs.\n•\tA dedicated IT infrastructure team, or similar function, enables the implementation of cloud management controls to ensure cloud instances are both secure and compliant, leveraging industry-recognized secure practices that are CSP-specific.\n•\tCybersecurity and data privacy requirements are identified and documented for each CSP instance to address sensitive/regulated data processing, storing and/ or transmitting and provide restrictions on data processing and storage locations.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of sensitive/regulated data processed, stored or transmitted on external systems.\n•\tIT architects, in conjunction with cybersecurity architects, ensure multi-tenant CSP assets (physical and virtual) are designed and governed such that provider and customer (tenant) user access is appropriately segmented from other tenant users.\n•\tIT architects, in conjunction with cybersecurity architects, ensure CSPs use secure protocols for the import, export and management of data in cloud-based services.\n•\tIT architects, in conjunction with cybersecurity architects, implement a dedicated subnet to host security-specific technologies on all cloud instances, where technically feasible.\n•\tIT infrastructure personnel and Data Protection Officers (DPOs) work with business stakeholders to identify business-critical systems and services, as well as associated sensitive/regulated data, including Personal Data (PD).\n•\tThe DPO function oversees the storage, processing and transmission of PD in CSPs.\n•\tAn IT Asset Management (ITAM) function, or similar function, governs cloud-based assets leveraging an established Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets to provide oversight of purchasing, updating, repairing and disposing of cloud-based assets.\n•\tFormal Change Management (CM) program governs cloud-based systems, applications and services and ensures that no unauthorized changes are made, that all changes are documented, that services are not unnecessarily disrupted and that resources are used efficiently.\n•\tAn IT infrastructure team, or similar function, enables the implementation of a Content Delivery Network (CDN) by restricting access to the origin server's IP address to the CDN and an authorized management network."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to ensure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to ensure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.
  available: false
  value: 5
