id: 743b74cc-d4f2-5ff0-bd24-4213a7d0cf3e
name: Authorized Communications
description: Mechanisms exist to restrict embedded technologies to communicate only with authorized peers and service endpoints.
elementType: control
externalId: EMB-13
controlQuestion: Does the organization restrict embedded technologies to communicate only with authorized peers and service endpoints?
functionGrouping: Protect
controlWeighting: '8'
parent: emb
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to restrict embedded technologies to communicate only with authorized peers and service endpoints.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to restrict embedded technologies to communicate only with authorized peers and service endpoints.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to restrict embedded technologies to communicate only with authorized peers and service endpoints.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Embedded Technology (EMB) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes embedded technologies according to the data the asset stores, transmits and/ or processes to ensure that the appropriate technology controls are applied to protect the asset and the data it stores, transmits or processes.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity & data privacy obligations are addressed to ensure secure configurations for embedded technologies are designed, built and maintained for embedded technologies.\n•\tCybersecurity personnel perform annual evaluations of deployed embedded technologies to identify necessary updates to mitigate any newly discovered risks associated with legacy embedded technologies.\n•\tConfigurations for embedded technologies conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tConfiguration management of embedded technologies is centralized for all operating systems, applications, servers and other technologies that are capable of being configured.\n•\tSpecial baseline configurations for embedded technologies are created for higher-risk environments.\n•\tDeviations to baseline configurations for embedded technologies are required to have a risk assessment and the business process owner accepts the risk(s) associated with the deviation.\n•\tUnauthorized configuration changes to embedded technologies are responded to in accordance with an Incident Response Plan (IRP) to determine if the unauthorized configuration is malicious in nature.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of sensitive/regulated data processed, stored or transmitted on embedded technologies, so that cybersecurity & data privacy controls are implemented in accordance with applicable statutory, regulatory and contractual obligations.\n•\tEmbedded technologies are configured to initiate all communications and drop any new incoming communications."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to restrict embedded technologies to communicate only with authorized peers and service endpoints.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to restrict embedded technologies to communicate only with authorized peers and service endpoints.
  available: false
  value: 5
