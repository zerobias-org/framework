id: 11a5c98d-f00d-5872-b2f8-4a73d919b55a
name: Privileged Account Separation
description: Mechanisms exist to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
elementType: enhancement
externalId: IAC-16.2
controlQuestion: Does the organization separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments?
functionGrouping: Protect
controlWeighting: '4'
parent: iac-16
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Identification & Authentication (IAC) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\n•\tThe Human Resources (HR) department governs personnel management operations and notifies IAM personnel of personnel role changes for RBAC-based provisioning and deprovisioning actions.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity & data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tActive Directory (AD), or a similar technology, is used to centrally manage identities and permissions. Only by exception due to a technical or business limitation are solutions authorized to operate a decentralized access control program for systems, applications and services."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to separate privileged accounts between infrastructure environments to reduce the risk of a compromise in one infrastructure environment from laterally affecting other infrastructure environments.
  available: false
  value: 5
