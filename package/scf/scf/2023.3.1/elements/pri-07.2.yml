id: e6962194-b45e-53b5-a777-f1d3cf3b0b79
name: Joint Processing of Personal Data
description: Mechanisms exist to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
elementType: enhancement
externalId: PRI-07.2
controlQuestion: Does the organization clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem?
functionGrouping: Identify
controlWeighting: '5'
parent: pri-07
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Privacy (PRI) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Privacy program, run by a Chief Privacy Officer (CPO), or similar role, ensures that applicable statutory, regulatory and contractual data privacy obligations are properly identified and implemented to limit and secure Personal Data (PD) that the organization stores, transmits and processes.\n•\tA data privacy team oversees the centralized-management of physical security controls across the enterprise.\n•\tData Protection Officers (DPOs) are assigned to work closely with business units and project teams to ensure data privacy principles are being implemented.\n•\tCPO and DPO determine and document the legal authority that permits the collection, use, maintenance and sharing of PD, either generally or in support of a specific program or system need.\n•\tAs part of the organization’s data privacy program, the CPO publishes a clear set of “data privacy principles”, based on leading data privacy practices, that systems, applications, services, processes and third-parties must adhere to.\n•\tA Project Management Office (PMO), or project management function, ensures both cybersecurity & data privacy principles are identified and implemented within ongoing or planned projects.\n•\tAdministrative processes exist disclose PD to third-parties only for the purposes identified in the data privacy notice and with the implicit or explicit consent of the individual.\n•\tAdministrative processes exist include data privacy requirements in contracts and other acquisition-related documents that establish data privacy roles and responsibilities for contractors and service providers."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to clearly define and communicate the organization's role in processing Personal Data (PD) in the data processing ecosystem.
  available: false
  value: 5
