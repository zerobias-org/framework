id: 81f60fba-1401-5eef-8fe1-9a754c55daee
name: Product Management
description: Mechanisms exist to design and implement product management processes to update products, including systems, software and services, to improve functionality and correct security deficiencies.
elementType: enhancement
externalId: TDA-01.1
controlQuestion: Does the organization design and implement product management processes to update products, including systems, software and services, to improve functionality and correct security deficiencies?
functionGrouping: Protect
controlWeighting: '10'
parent: tda-01
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to design and implement product management processes to update products, including systems, software and services, to improve functionality and correct security deficiencies.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Technology Development & Acquisition (TDA) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to govern technology development and acquisition.\n•\tSecure development practices loosely conform to industry-recognized standards for secure engineering (e.g., OWASP, NIST SP 800-218, NIST SP 800-160, etc.).\n•\tIT personnel work with data/process owners to help ensure secure practices are implemented throughout the System Development Lifecycle (SDLC) for all high-value projects.\n•\tProject management is decentralized and generally lacks formal project management managers or broader oversight."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Technology Development & Acquisition (TDA) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tDevelopment and acquisition management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for technology development and acquisition management.\n•\tIT/cybersecurity personnel implement secure practices to protect the confidentiality, integrity, availability and safety of the organization’s technology assets, data and network(s).\n•\tSecure development practices mostly conform to industry-recognized standards for secure engineering (e.g., OWASP, NIST SP 800-218, NIST SP 800-160, etc.).\n•\tProcurement practices require third-party developers of systems, system components or services to follow secure engineering practices.\n•\tA Project Management office (PMO), or project management function, enables the implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all high-value projects."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Technology Development & Acquisition (TDA) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tSecure development practices conform to industry-recognized standards for secure engineering (e.g., OWASP, NIST SP 800-218, NIST SP 800-160, etc.).\n•\tA procurement team, or similar function, ensures that third party development and/ or acquisitions meet, or exceed, the organization's business, cybersecurity & data privacy requirements to have secure and resilient systems, applications, services and processes.\n•\tA Software Assurance Maturity Model (SAMM) governs a secure development lifecycle for the development of systems, applications and services.\n•\tAdministrative processes exist and technologies are configured to implement secure configuration settings by default to reduce the likelihood of software being deployed with weak security settings, putting the asset at a greater risk of compromise.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tA formal Change Management (CM) program help to ensure that no unauthorized changes are made, all changes are documented, services are not disrupted and resources are used efficiently.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function;\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data for technology development and acquisition.\no\tEnsures the Information Assurance Program (IAP) evaluates applicable cybersecurity & data privacy controls as part of “business as usual” pre-production testing.\no\tOperates the Cybersecurity Supply Chain Risk Management (C-SCRM) program to identify and mitigate supply chain-related risks and threats.\n•\tA Project Management Office (PMO), or project management function, enables IAP pre-production testing of cybersecurity & data privacy controls as part of the organization’s established project management processes."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Technology Development & Acquisition (TDA) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to design and implement product management processes to update products, including systems, software and services, to improve functionality and correct security deficiencies.
  available: false
  value: 5
