id: 61407f7c-5197-5270-9a70-3d2318deb862
name: Automated Unauthorized Component Detection
description: Automated mechanisms exist to detect and alert upon the detection of unauthorized hardware, software and firmware components.
elementType: enhancement
externalId: AST-02.2
controlQuestion: Does the organization use automated mechanisms to detect and alert upon the detection of unauthorized hardware, software and firmware components?
methodsToComply: "- CimTrak Integrity Suite (https://www.cimcor.com/cimtrak/)\r\n- DHCP logging\r\n- Active discovery tools\r\n- NNT Change Tracker (https://www.newnettechnologies.com)\r\n- Vectra\r\n- Tripwire Enterprise (https://www.tripwire.com/products/tripwire-enterprise/)\r\n- Puppet (https://puppet.com/)\r\n- Chef (https://www.chef.io/) (https://www.chef.io/)\r\n- Microsoft SCCM\r\n- CimTrak Integrity Suite (https://www.cimcor.com/cimtrak/)"
functionGrouping: Detect
controlWeighting: '3'
parent: ast-02
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to detect and alert up on the detection of unauthorized hardware, software and firmware components.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to detect and alert up on the detection of unauthorized hardware, software and firmware components.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to detect and alert up on the detection of unauthorized hardware, software and firmware components.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Asset Management (AST) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, governs asset management to help ensure compliance with requirements for asset management.\n•\tAn ITAM function, or similar function, maintains an inventory of IT assets, covering both physical and virtual assets, as well as centrally managed asset ownership assignments.\n•\tTechnology assets and data are categorized according to data classification and business criticality criteria.\n•\tA Cybersecurity Supply Chain Risk Management (C-SCRM) function oversees supply chain risks including the removal and prevention of certain technology services and/ or equipment designated as supply chain threats by a statutory or regulatory body.\n•\tData/process owners document where sensitive/regulated data is stored, transmitted and processed, generating Data Flow Diagrams (DFDs) and network diagrams to document the flow of data.\n•\tThe ITAM tool is configured to detect and alert on instances of duplication, unauthorized components and unauthorized software.\n•\tUnauthorized configuration changes are responded to in accordance with an Incident Response Plan (IRP) to determine if the change is malicious in nature."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Asset Management (AST) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement.\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to detect and alert up on the detection of unauthorized hardware, software and firmware components.
  available: false
  value: 5
