id: 5cec0cae-c906-5b06-9807-ee7d87160d98
name: Defining Business Context & Mission
description: Mechanisms exist to define the context of its business model and document the mission of the organization.
elementType: control
externalId: GOV-08
controlQuestion: Does the organization define the context of its business model and document the mission of the organization?
functionGrouping: Identify
controlWeighting: '5'
parent: gov
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to define the context of its business model and document the mission of the organization.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to define the context of its business model and document the mission of the organization.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cybersecurity & Privacy Governance (GOV) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCybersecurity and data privacy governance activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cybersecurity & data privacy governance activities.\n•\tThe Chief Information Officer (CIO), or similar function, analyzes the organization’s business strategy and prioritizes the objectives of the security function, based on business requirements.\n•\tA qualified individual is assigned the role and responsibilities to centrally manage, coordinate, develop, implement and maintain a cybersecurity & data privacy program (e.g., cybersecurity director or Chief Information Security Officer (CISO)).\n•\tNo formal Governance, Risk & Compliance (GRC) team exists. GRC roles are assigned to existing cybersecurity personnel.\n•\tCompliance requirements for cybersecurity & data privacy are identified and documented.\n•\tCybersecurity policies and standards exist that are aligned with a leading cybersecurity framework (e.g., SCF, NIST 800-53, ISO 27002 or NIST Cybersecurity Framework).\n•\tControls are assigned to sensitive/regulated assets to comply with specific compliance requirements.\n•\tProcedures are established for sensitive/regulated obligations, but are not standardized across the organization.\n•\tDocumentation is made available to internal personnel."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cybersecurity & Privacy Governance (GOV) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides scoping guidance to determine control applicability.\n•\tCompliance requirements for cybersecurity & data privacy controls are identified, documented and tested for adherence to internal standards or regulatory requirements.\n•\tProcedures are established for sensitive/regulated obligations and standardized across the organization.\n•\tControls are standardized across the organization to ensure uniformity and consistent execution.\n•\tInternal policies and standards address all statutory, regulatory and contractual obligations for cybersecurity & data privacy.\n•\tDefined roles & responsibilities require data/process owners to define, implement and maintain cybersecurity & data privacy controls for each system, application and/ or service of which they have accountability.\n•\tCybersecurity and data privacy personnel are encouraged to attend and be involved in local groups and associations.\n•\tCybersecurity and data privacy personnel identify and maintain contact information for local, regional and national cybersecurity / data privacy groups and associations.\n•\tCybersecurity and data privacy personnel in supervisory positions subscribe to news feeds from security/data privacy-related groups and associations to facilitate ongoing education and training.\n•\tDesignated incident response personnel participate in public/private information sharing organizations (e.g., InfraGard)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to define the context of its business model and document the mission of the organization.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to define the context of its business model and document the mission of the organization.
  available: false
  value: 5
