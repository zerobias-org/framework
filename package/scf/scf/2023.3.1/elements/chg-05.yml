id: 02a47ba1-24d2-523d-8942-7a37d3cb5f5b
name: Stakeholder Notification of Changes
description: Mechanisms exist to ensure stakeholders are made aware of and understand the impact of proposed changes.
elementType: control
externalId: CHG-05
controlQuestion: Does the organization ensure stakeholders are made aware of and understand the impact of proposed changes?
methodsToComply: "- Change management procedures\r\n- VisibleOps methodology \r\n- ITIL infrastructure library"
functionGrouping: Protect
controlWeighting: '9'
parent: chg
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to ensure stakeholders are made aware of and understand the impact of proposed changes.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Change Management (CHG) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to:\no\tGovern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tNotify stakeholders about proposed changes.\n•\tLogical Access Control (LAC) limits the ability of non-administrators from making unauthorized configuration changes to systems, applications and services.\n•\tRequests for Change (RFC) are submitted to IT personnel.\n•\tprior to changes being made, RFCs are informally reviewed for cybersecurity & data privacy ramifications.\n•\tWhenever possible, IT personnel test changes to business-critical systems/services/applications on a similarly configured IT environment as that of Production, prior to widespread production release of the change."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Change Management (CHG) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tChange management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for change management.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function, exists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\n•\tA CAB, or similar function, reviews RFCs for cybersecurity & data privacy ramifications.\n•\tA CAB, or similar function, notifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tLogical Access Control (LAC) limits the ability of non-administrators from making unauthorized configuration changes to systems, applications and services.\n•\tCybersecurity controls are tested after a change is implemented to ensure cybersecurity controls are operating properly."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Change Management (CHG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tITAM leverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tLogical Access Control (LAC) is governed to limit the ability of non-administrators from making configuration changes to systems, applications and services.\n•\tA formal Change Management (CM) program ensures that no unauthorized changes are made, that all changes are documented, that services are not disrupted and that resources are used efficiently.\n•\tThe CM function has formally defined roles and associated responsibilities.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function:\no\tExists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews RFC for cybersecurity & data privacy ramifications.\no\tNotifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tIT personnel use dedicated development/test/staging environments to deploy and evaluate changes, wherever technically possible."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to ensure stakeholders are made aware of and understand the impact of proposed changes.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to ensure stakeholders are made aware of and understand the impact of proposed changes.
  available: false
  value: 5
