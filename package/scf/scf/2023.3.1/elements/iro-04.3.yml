id: a1e83f3e-4cf8-53b5-b428-bf350c4786a8
name: Continuous Incident Response Improvements
description: "Mechanisms exist to use qualitative and quantitative data from incident response testing to: \r\n▪Determine the effectiveness of incident response processes;\r\n▪Continuously improve incident response processes; and\r\n▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format."
elementType: enhancement
externalId: IRO-04.3
controlQuestion: "Does the organization use qualitative and quantitative data from incident response testing to: \r\n▪Determine the effectiveness of incident response processes;\r\n▪Continuously improve incident response processes; and\r\n▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format?"
functionGrouping: Identify
controlWeighting: '3'
parent: iro-04
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to use qualitative and quantitative data from incident response testing to:
    ▪Determine the effectiveness of incident response processes;
    ▪Continuously improve incident response processes; and
    ▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    SP-CMM1 is N/A, since a structured process is required to use qualitative and quantitative data from incident response testing to:
    ▪Determine the effectiveness of incident response processes;
    ▪Continuously improve incident response processes; and
    ▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    SP-CMM2 is N/A, since a well-defined process is required to use qualitative and quantitative data from incident response testing to:
    ▪Determine the effectiveness of incident response processes;
    ▪Continuously improve incident response processes; and
    ▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Incident Response (IR) processes are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Integrated Security Incident Response Team (ISIRT), or similar function, exists to form an on-demand, scalable and integrated team of formally-assigned cybersecurity, IT, data privacy and business function representatives that can perform coordinated incident response.\n•\tThe ISIRT, or similar function, develops and maintains a documented, program-level Integrated Incident Response Program (IIRP) that provides operational and tactical-level guidance for cybersecurity & data privacy response operations.\n•\tA Security Operations Center (SOC), or similar function, facilitates incident management operations that includes preparation, detection and analysis, containment, eradication and recovery.\n•\tBusiness Process Owners (BPOs), in conjunction with the SOC and ISIRT functions, develop and maintain a documented Incident Response Plan (IRP) specific to the business process / business unit but inclusive of the organization’s larger approach to incident response operations.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and provides that information to the SOC for Incident Response Operations (IRO)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to use qualitative and quantitative data from incident response testing to:
    ▪Determine the effectiveness of incident response processes;
    ▪Continuously improve incident response processes; and
    ▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to use qualitative and quantitative data from incident response testing to:
    ▪Determine the effectiveness of incident response processes;
    ▪Continuously improve incident response processes; and
    ▪Provide incident response measures and metrics that are accurate, consistent, and in a reproducible format.
  available: false
  value: 5
