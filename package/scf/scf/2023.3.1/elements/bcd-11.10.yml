id: fceb2be0-f076-5177-a523-787b2b9b01fe
name: Backup Modification and/or Destruction
description: Mechanisms exist to restrict access to modify and/or delete backups to privileged users with assigned data backup and recovery operations roles.
elementType: enhancement
externalId: BCD-11.10
controlQuestion: Does the organization restrict access to modify and/or delete backups to privileged users with assigned data backup and recovery operations roles?
functionGrouping: Protect
controlWeighting: '9'
parent: bcd-11
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to restrict access to modify and/ or delete backups to privileged users with assigned data backup and recovery operations roles.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to restrict access to modify and/ or delete backups to privileged users with assigned data backup and recovery operations roles.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to restrict access to modify and/ or delete backups to privileged users with assigned data backup and recovery operations roles.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Business Continuity & Disaster Recovery (BCD) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA formal Business Continuity & Disaster Recovery (BC/DR) program exists with defined roles and responsibilities to restore functionality in the event of a catastrophe, emergency, or significant disruptive incident that is handled in accordance with the Continuity of Operations Plan (COOP).\n•\tBC/DR personnel work with business stakeholders to identify business-critical systems, services, internal teams and third-party service providers.\n•\tApplication/system/process owners conduct a Business Impact Analysis (BIA) at least annually, or after any major technology or process change, to identify assets critical to the business in need of protection, as well as single points of failure.\n•\tRecovery Time Objectives (RTOs) are defined.\n•\tRecovery Point Objectives (RPOs) are defined.\n•\tControls are assigned to sensitive/regulated assets to comply with specific BC/DR requirements to facilitate recovery operations in accordance with RTOs and RPOs.\n•\tIT personnel work with business stakeholders to develop Disaster Recovery Plans (DRP) to recover business-critical systems and services within RPOs.\n•\tBusiness stakeholders work with IT personnel to develop Business Continuity Plans (BCPs) to ensure business functions are sustainable both during and after an incident within RTOs.\n•\tThe data backup function is formally assigned with defined roles and responsibilities.\n•\tLogical and physical access controls restricts access to backups from privileged users to prevent unauthorized restore of sensitive data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to restrict access to modify and/ or delete backups to privileged users with assigned data backup and recovery operations roles.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to restrict access to modify and/ or delete backups to privileged users with assigned data backup and recovery operations roles.
  available: false
  value: 5
