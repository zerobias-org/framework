id: 28ea6994-2724-50a7-a5a8-1772a78d7b3c
name: Business Continuity Management System (BCMS)
description: Mechanisms exist to facilitate the implementation of contingency planning controls to help ensure resilient assets and services (e.g., Continuity of Operations Plan (COOP) or Business Continuity & Disaster Recovery (BC/DR) playbooks).
elementType: control
externalId: BCD-01
controlQuestion: Does the organization facilitate the implementation of contingency planning controls?
methodsToComply: "- Business Continuity Plan (BCP)\r\n- Disaster Recovery Plan (DRP)\r\n- Continuity of Operations Plan (COOP)\r\n- Business Impact Analysis (BIA)\r\n- Criticality assessments"
functionGrouping: Recover
controlWeighting: '10'
parent: bcd
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the implementation of contingency planning controls to help ensure resilient assets and services.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Business Continuity & Disaster Recovery (BCD) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel work with business stakeholders to identify business-critical systems and services, including internal teams and third-party service providers.\n•\tIT personnel develop limited Disaster Recovery Plans (DRP) to recover business-critical systems and services.\n•\tBusiness stakeholders develop limited Business Continuity Plans (BCPs) to ensure business-critical functions are sustainable both during and after an incident within Recovery Time Objectives (RTOs).\n•\tBackups are performed ad-hoc and focus on business-critical systems.\n•\tLimited technologies exist to support near real-time network infrastructure failover (e.g., redundant ISPs, redundant power, etc.)."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Business Continuity & Disaster Recovery (BCD) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tBusiness Continuity / Disaster Recovery (BC/DR) management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for BC/DR management.\n•\tIT/cybersecurity personnel work with business stakeholders to identify business-critical systems, services, internal teams and third-party service providers.\n•\tBC/DR roles are formally assigned as an additional duty to existing IT/cybersecurity personnel.\n•\tRecovery Time Objectives (RTOs) identify business-critical systems and services, which are given priority of service in alternate processing and storage sites.\n•\tIT personnel develop Disaster Recovery Plans (DRP) to recover business-critical systems and services.\n•\tData/process owners conduct a Business Impact Analysis (BIA) at least annually, or after any major technology or process change, to identify assets critical to the business in need of protection, as well as single points of failure.\n•\tIT/cybersecurity personnel work with business stakeholders to develop Business Continuity Plans (BCPs) to ensure business functions are sustainable both during and after an incident within Recovery Time Objectives (RTOs).\n•\tWithin the BCPs, alternate communications channels have been defined and alternative decision-makers are designated if primary decision-makers are unavailable.\n•\tIT personnel use a backup methodology (e.g., grandfather, father & s on rotation) to store backups in a secondary location, separate from the primary storage site.\n•\tIT personnel configure business-critical systems to transfer backup data to the alternate storage site at a rate that is capable of meeting Recovery Time Objectives (RTOs) and Recovery Point Objectives (RPOs)."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Business Continuity & Disaster Recovery (BCD) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function, analyzes the organization’s business strategy and security function objectives to determine prioritization of and authoritative guidance for Business Continuity & Disaster Recovery (BC/DR) practices, within the broader scope of cybersecurity and data protection operations.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the organization. This CONOPS for continuity of operations may be incorporated as part of a broader operational plan for the cybersecurity & data privacy program.\n•\tA Governance, Risk & Compliance (GRC) team, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data. Compliance requirements for data backups are identified and documented.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program, including BC/DR and establishes a clear and authoritative accountability structure for BC/DR operations.\n•\tA formal Business Continuity & Disaster Recovery (BC/DR) program exists with defined roles and responsibilities to restore functionality in the event of a catastrophe, emergency, or significant disruptive incident that is handled in accordance with the Continuity of Operations Plan (COOP).\n•\tBC/DR personnel work with business stakeholders to identify business-critical systems, services, internal teams and third-party service providers.\n•\tApplication/system/process owners conduct a Business Impact Analysis (BIA) at least annually, or after any major technology or process change, to identify assets critical to the business in need of protection, as well as single points of failure.\n•\tRecovery Time Objectives (RTOs) are defined.\n•\tRecovery Point Objectives (RPOs) are defined.\n•\tControls are assigned to sensitive/regulated assets to comply with specific BC/DR requirements to facilitate recovery operations in accordance with RTOs and RPOs.\n•\tIT personnel work with business stakeholders to develop Disaster Recovery Plans (DRP) to recover business-critical systems and services within RPOs.\n•\tBusiness stakeholders work with IT personnel to develop Business Continuity Plans (BCPs) to ensure business functions are sustainable both during and after an incident within RTOs.\n•\tWithin the BCPs, alternate communications channels have been defined and alternative decision-makers are designated if primary decision-makers are unavailable.\n•\tThe data backup function is formally assigned with defined roles and responsibilities."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Business Continuity & Disaster Recovery (BCD) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to facilitate the implementation of contingency planning controls to help ensure resilient assets and services.
  available: false
  value: 5
