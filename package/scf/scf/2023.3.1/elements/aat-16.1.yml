cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to measure Artificial Intelligence (AI) and Autonomous Technologies (AAT)-related risks to deployment context(s) through review and consultation with industry experts, domain specialists and end users.
