id: 7adffc65-2c1a-525d-b238-169e8f938aff
name: Provenance
description: Mechanisms exist to track the origin, development, ownership, location and changes to systems, system components and associated data.
elementType: enhancement
externalId: AST-03.2
controlQuestion: Does the organization govern the chronology of the origin, development, ownership, location and changes to a system, system components and associated data?
functionGrouping: Identify
controlWeighting: '8'
parent: ast-03
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to track the origin, development, ownership, location and changes to systems, system components and associated data.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to track the origin, development, ownership, location and changes to systems, system components and associated data.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to track the origin, development, ownership, location and changes to systems, system components and associated data.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Asset Management (AST) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, governs asset management to help ensure compliance with requirements for asset management.\n•\tAn ITAM function, or similar function, maintains an inventory of IT assets, covering both physical and virtual assets, as well as centrally managed asset ownership assignments.\n•\tTechnology assets and data are categorized according to data classification and business criticality criteria.\n•\tA Cybersecurity Supply Chain Risk Management (C-SCRM) function oversees supply chain risks including the removal and prevention of certain technology services and/ or equipment designated as supply chain threats by a statutory or regulatory body.\n•\tData/process owners document where sensitive/regulated data is stored, transmitted and processed, generating Data Flow Diagrams (DFDs) and network diagrams to document the flow of data.\n•\tITAM tracks the origin, development, ownership, location and changes to a system, system components and associated data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to track the origin, development, ownership, location and changes to systems, system components and associated data.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to track the origin, development, ownership, location and changes to systems, system components and associated data.
  available: false
  value: 5
