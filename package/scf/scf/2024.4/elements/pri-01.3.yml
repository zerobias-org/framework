id: 51740203-dd67-571f-8ab3-d26afd6d7998
name: Dissemination of Data Privacy Program Information
description: "Mechanisms exist to: \r\n (1) Ensure that the public has access to information about organizational data privacy activities and can communicate with its Chief Privacy Officer (CPO) or similar role;\r\n (2) Ensure that organizational data privacy practices are publicly available through organizational websites or document repositories; \r\n (3) Utilize publicly facing email addresses and/or phone lines to enable the public to provide feedback and/or direct questions to data privacy office(s) regarding data privacy practices; and\r\n (4) Inform data subjects when changes are made to the privacy notice and the nature of such changes."
elementType: enhancement
