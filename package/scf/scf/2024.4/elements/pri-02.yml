id: 3a92f414-b90e-55f2-8340-4a68e96b6836
name: Data Privacy Notice
description: "Mechanisms exist to:\r\n (1) Make data privacy notice(s) available to individuals upon first interacting with an organization and subsequently as necessary; \r\n (2) Ensure that data privacy notices are clear and easy-to-understand, expressing information about Personal Data (PD) processing in plain language that meets all legal obligations; \r\n (3) Define the scope of PD processing activities, including the geographic locations and third-party recipients that process the PD within the scope of the data privacy notice;\r\n (4) Content of the privacy notice is periodically reviewed and updates made as necessary; and\r\n (5) Retain prior versions of the privacy notice, in accordance with data retention requirements."
elementType: control
externalId: PRI-02
controlQuestion: "Does the organization:\r\n (1) Make data privacy notice(s) available to individuals upon first interacting with an organization and subsequently as necessary; \r\n (2) Ensure that data privacy notices are clear and easy-to-understand, expressing information about Personal Data (PD) processing in plain language that meets all legal obligations; \r\n (3) Define the scope of PD processing activities, including the geographic locations and third-party recipients that process the PD within the scope of the data privacy notice;\r\n (4) Content of the privacy notice is periodically reviewed and updates made as necessary; and\r\n (5) Retain prior versions of the privacy notice, in accordance with data retention requirements?"
