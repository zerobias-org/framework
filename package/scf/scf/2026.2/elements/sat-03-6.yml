id: ea336bde-92af-4ce9-b69c-e6c15ac3c376
name: Cyber Threat Environment
description: Mechanisms exist to provide role-based security, compliance and resilience awareness training that is current and relevant to the cyber threats that users might encounter in day-to-day business operations.
elementType: enhancement
externalId: SAT-03.6
parent: sat-03
controlQuestion: Does the organization provide role-based security, compliance and resilience awareness training that is current and relevant to the cyber threats that users might encounter in day-to-day business operations?
functionGrouping: Identify
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: Practices are non-existent, based on the inability to demonstrate an implemented and operational capability. A reasonable person would conclude the control is not being performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    SCR-CMM Level 1 criteria definitions are not available for this control:
    ▪ A reasonable person would conclude this control requires a structured process.
    ▪ At this level of maturity, the "ad hoc" nature of performing a capability informally would indicate the intent of the control is not met due to a lack of consistency and formality.
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    Security Awareness & Training (SAT) capabilities are requirements-driven, but are not standardized across the entity (e.g., local/regional level consistency). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with SAT domain capabilities are formally documented and centrally-managed by the entity.
    ▪ Standardized Operating Procedures (SOP) associated with SAT domain capabilities are documented and maintained by process owners.
    ▪ IT and/or cybersecurity personnel work with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with SAT  domain capabilities to address applicable statutory, regulatory and/or contractual requirements for Technology Assets, Applications, Services and/or Data (TAASD).
    ▪ Security Awareness & Training-related controls are primarily administrative and preventative in nature (e.g., policies, standards, procedures & guidelines).
    ▪ Security Awareness & Training may be a defined function (e.g., team or department) or assigned as an additional duty to existing IT and/or cybersecurity personnel.
    ▪ Users are educated on their responsibilities to protect TAASD assigned to them or under their supervision.
    ▪ IT and/or cybersecurity personnel create/govern security and awareness training to meet specific statutory, regulatory and/or contractual compliance obligations.
    ▪ Privileged users receive formal security and/or data privacy awareness training to ensure they understand their unique roles and responsibilities.
    ▪ The responsibility for training users and enforcing policies may be assigned to user’s immediate supervisor(s)/manager(s), including the definition and enforcement of the user’s specific role(s) and responsibilities.
    ▪ Security awareness and training methods are role-based (e.g., handling sensitive/regulated data).
    ▪ Business process owners are required to incorporate vendor-specific security training in support of new technology initiatives.
    ▪ Security awareness training covers recommended practices for securing laptops and mobile devices while traveling.
    ▪ Security awareness training covers reporting of unauthorized alterations and evidence of tampering of equipment
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: |-
    Security Awareness & Training (SAT) capabilities are standardized across the entity for applicability to People, Processes, Technologies, Data and/or Facilities (PPTDF) to ensure consistency for Technology Assets, Applications, Services and/or Data (TAASD). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with SAT domain capabilities are formally documented and centrally-managed by the entity's Governance, Risk & Compliance (GRC) team, or similar function.
    ▪ Standardized Operating Procedures (SOP) associated with SAT domain capabilities are well-documented and kept current by process owners.
    ▪ A security awareness & training team, or similar function, is appropriately staffed and supported to implement and maintain SAT domain capabilities.
    ▪ Technology is leveraged to enhance the efficiency and accuracy of security awareness and training management (e.g., Computer Based Learning (CBL) solutions, etc.).
    ▪ The entity's Governance, Risk & Compliance (GRC) team, or similar function, works with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with SAT domain capabilities to address Minimum Compliance Requirements (MCR) (e.g., applicable statutory, regulatory and/or contractual requirements) and Discretionary Security Requirements (DSR) (e.g., entity-required controls).
    ▪ An implemented and operational capability exists to provide role-based security, compliance and resilience awareness training that is current and relevant to the cyber threats that users might encounter in day-to-day business operations.
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    Utilize SCR-CMM Level 3 criteria definitions:
    ▪ There are no defined Level 4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to operationalize this control.
    ▪ While it may be possible to develop “metrics-driven” capabilities for this control, the criteria would be organization-specific to define.
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    Utilize SCR-CMM Level 3 or Level 4 (if available) criteria definitions:
    ▪ There are no defined Level 5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to operationalize this control.
    ▪ Level 5 capabilities should be considered “world-class” where the control builds on Level 4 capabilities, but are continuously improving through Artificial Intelligence (AI) and/or Machine Learning (ML) technologies.
    ▪ While it may be possible to develop responsive capabilities for this control through the use of AI and/or ML technologies, the criteria would be organization-specific to define.
  available: true
  value: 5
