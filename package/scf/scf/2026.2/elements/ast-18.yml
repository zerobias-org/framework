name: Roots of Trust Protection
description: Mechanisms exist to provision and protect the confidentiality, integrity and authenticity of product supplier keys and data that can be used as a “roots of trust” basis for integrity verification.
elementType: control
externalId: AST-18
parent: ast
controlQuestion: Does the organization provision and protect the confidentiality, integrity and authenticity of product supplier keys and data that can be used as a “roots of trust” basis for integrity verification?
functionGrouping: Protect
controlWeighting: '4'
cmm_0:
  name: Not Performed
  description: Practices are non-existent, based on the inability to demonstrate an implemented and operational capability. A reasonable person would conclude the control is not being performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    SCR-CMM Level 1 criteria definitions are not available for this control:
    ▪ A reasonable person would conclude this control requires a structured process.
    ▪ At this level of maturity, the "ad hoc" nature of performing a capability informally would indicate the intent of the control is not met due to a lack of consistency and formality.
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    SCR-CMM Level 2 criteria definitions are not available for this control:
    ▪ A reasonable person would conclude a well-defined and standardized process is required.
    ▪ At this level of maturity, the “requirements-driven” nature of performing the control is focused on a localized and/or regionalized implementation, not uniform and consistent across the organization.
    ▪ Requirements are narrowly scoped for applicability and are primarily derived from compliance obligations (e.g., laws, regulations and contracts).
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: |-
    Asset Management (AST) capabilities are standardized across the entity for applicability to People, Processes, Technologies, Data and/or Facilities (PPTDF) to ensure consistency for Technology Assets, Applications, Services and/or Data (TAASD). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with AST domain capabilities are formally documented and centrally-managed by the entity's Governance, Risk & Compliance (GRC) team, or similar function.
    ▪ Standardized Operating Procedures (SOP) associated with AST domain capabilities are well-documented and kept current by process owners.
    ▪ An IT Asset Management (ITAM) team, or similar function, is appropriately staffed and supported to implement and maintain AST domain capabilities.
    ▪ Technology is leveraged to enhance the efficiency and accuracy of ITAM operations (e.g., ITAM platform, (e.g., Configuration Management Database (CMBD) Asset Management solution, etc.).
    ▪ The entity's Governance, Risk & Compliance (GRC) team, or similar function, works with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with AST domain capabilities to address Minimum Compliance Requirements (MCR) (e.g., applicable statutory, regulatory and/or contractual requirements) and Discretionary Security Requirements (DSR) (e.g., entity-required controls).
    ▪ An implemented and operational capability exists to provision and protect the confidentiality, integrity and authenticity of product supplier keys and data that can be used as a “roots of trust” basis for integrity verification.
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    Utilize SCR-CMM Level 3 criteria definitions:
    ▪ There are no defined Level 4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to operationalize this control.
    ▪ While it may be possible to develop “metrics-driven” capabilities for this control, the criteria would be organization-specific to define.
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    Utilize SCR-CMM Level 3 or Level 4 (if available) criteria definitions:
    ▪ There are no defined Level 5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to operationalize this control.
    ▪ Level 5 capabilities should be considered “world-class” where the control builds on Level 4 capabilities, but are continuously improving through Artificial Intelligence (AI) and/or Machine Learning (ML) technologies.
    ▪ While it may be possible to develop responsive capabilities for this control through the use of AI and/or ML technologies, the criteria would be organization-specific to define.
  available: true
  value: 5
