id: a655b18c-f6cc-44ba-9ab7-92404d831264
name: Dual Approval For High-Impact Environments
description: |-
  Mechanisms exist to require dual approval for any changes that might result in a serious incident that could adversely impact:
  (1) Business processes; and/or
  (2) Technology Assets, Applications, Services and/or Data (TAASD).
elementType: control
externalId: CHG-08
parent: chg
controlQuestion: |-
  Does the organization require dual approval for any changes that might result in a serious incident that could adversely impact:
  (1) Business processes; and/or
  (2) Technology Assets, Applications, Services and/or Data (TAASD)?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: Practices are non-existent, based on the inability to demonstrate an implemented and operational capability. A reasonable person would conclude the control is not being performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    SCR-CMM Level 1 criteria definitions are not available for this control:
    ▪ A reasonable person would conclude this control requires a structured process.
    ▪ At this level of maturity, the "ad hoc" nature of performing a capability informally would indicate the intent of the control is not met due to a lack of consistency and formality.
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    Change Management (CHG) capabilities are requirements-driven, but are not standardized across the entity (e.g., local/regional level consistency). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with CHG domain capabilities are formally documented and centrally-managed by the entity.
    ▪ Standardized Operating Procedures (SOP) associated with CHG domain capabilities are documented and maintained by process owners.
    ▪ IT and/or cybersecurity personnel work with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with CHG  domain capabilities to address applicable statutory, regulatory and/or contractual requirements for Technology Assets, Applications, Services and/or Data (TAASD).
    ▪ Change management-related controls are primarily administrative and preventative in nature (e.g., policies, standards, procedures & guidelines).
    ▪ Change management may be a defined function (e.g., team or department) or assigned as an additional duty to existing IT and/or cybersecurity personnel.
    ▪ Business stakeholders and process owners ensure changes to Technology Assets, Applications and/or Services (TAAS) within the System Development Lifecycle (SDLC) are controlled through formal change control procedures.
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: |-
    Change Management (CHG) capabilities are standardized across the entity for applicability to People, Processes, Technologies, Data and/or Facilities (PPTDF) to ensure consistency for Technology Assets, Applications, Services and/or Data (TAASD). Capability criteria associated with this control reasonably expect the following criteria to exist:
    ▪ Policies and standards associated with CHG domain capabilities are formally documented and centrally-managed by the entity's Governance, Risk & Compliance (GRC) team, or similar function.
    ▪ Standardized Operating Procedures (SOP) associated with CHG domain capabilities are well-documented and kept current by process owners.
    ▪ A centralized Change Management Office (CMO), or similar function, is appropriately staffed and supported to implement and maintain CHG domain capabilities.
    ▪ Technical procedures (e.g., ITIL change enablement) are utilized along with change management governance capabilities (e.g., Change Advisory Board (CAB)) to ensure successful, efficient and secure change management operations.
    ▪ The entity's Governance, Risk & Compliance (GRC) team, or similar function, works with business stakeholders and process owners to appropriately scope and reasonably implement cybersecurity and data protection controls associated with CHG domain capabilities to address Minimum Compliance Requirements (MCR) (e.g., applicable statutory, regulatory and/or contractual requirements) and Discretionary Security Requirements (DSR) (e.g., entity-required controls).
    ▪ An implemented and operational capability exists to require dual approval for any changes that might result in a serious incident that could adversely impact:
    (1) Business processes; and/or
    (2)  Technology Assets, Applications, Services and/or Data (TAASD).
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    Utilize SCR-CMM Level 3 criteria definitions:
    ▪ There are no defined Level 4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to operationalize this control.
    ▪ While it may be possible to develop “metrics-driven” capabilities for this control, the criteria would be organization-specific to define.
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    Utilize SCR-CMM Level 3 or Level 4 (if available) criteria definitions:
    ▪ There are no defined Level 5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to operationalize this control.
    ▪ Level 5 capabilities should be considered “world-class” where the control builds on Level 4 capabilities, but are continuously improving through Artificial Intelligence (AI) and/or Machine Learning (ML) technologies.
    ▪ While it may be possible to develop responsive capabilities for this control through the use of AI and/or ML technologies, the criteria would be organization-specific to define.
  available: true
  value: 5
