id: e71ee8fd-0172-5d82-85f3-f305d2181b45
name: Impact-Level Prioritization
description: Mechanisms exist to prioritize the impact level for systems, applications and/or services to prevent potential disruptions.
elementType: enhancement
externalId: RSK-02.1
controlQuestion: Does the organization prioritize the impact level for systems, applications and/or services to prevent potential disruptions?
functionGrouping: Identify
controlWeighting: '9'
parent: rsk-02
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to prioritize the impact level for systems, applications and/ or services to prevent potential disruptions.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to prioritize the impact level for systems, applications and/ or services to prevent potential disruptions.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Risk Management efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tRisk management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tData/process owners are expected to self-manage risks associated with their systems, applications, services and data, based on the organization’s published policies and standards, including the identification, remediation and reporting of risks.\n•\tData/process owners work with IT/cybersecurity personnel and Data Protection Officers (DPOs) to ensure applicable statutory, regulatory and contractual obligations are properly addressed, including the storage, transmission and processing of sensitive/regulated data.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for risk management.\no\tImplement and maintain a form of Risk Management Program (RMP) that provides operational guidance on how risk is identified, assessed, remediated and reported.\n•\tRisk management processes (e.g., risk assessments) and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Risk Management efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA formal Risk Management Program (RMP) provides enterprise-wide guidance on how risk is to be identified, framed (e.g., risk appetite, risk tolerance, risk thresholds, etc.) assessed, mitigated/remediated and reported.\n•\tCriteria to define materiality for risk management decisions is defined.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program, including appropriately resourcing risk management operations.\n•\tA formally-documented Cybersecurity Supply Chain Risk Management (C-SCRM) plan exists to identify, assess and mitigate supply chain-related risks and threats;\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns,\no\tAnalyzes the organization’s business strategy to determine prioritized and authoritative guidance for Risk Management (RM) practices.\no\tDevelops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for RM.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function:\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data with regards to RM.\no\tMaintains a common taxonomy of risk-relevant terminology to minimize assumptions and misunderstandings.\no\tEnables data/process owners to conduct annual risk assessment of their operations that includes the likelihood and magnitude of harm, from unauthorized access, use, disclosure, disruption, modification or destruction of the organization's systems and data.\no\tAssists users in making informed risk decisions to ensure data and processes are appropriately protected.\no\tEnables the documentation of risk assessments, risk response and risk monitoring to support statutory, regulatory and contractual obligations for risk management practices.\no\tMaintains a centralized risk register to reflect an active recording and disposition of identified risks. The risk register identifies and assigns a risk ranking to vulnerabilities and risks that is based on industry-recognized practices and facilitates monitoring and reporting of those risks.\no\tGoverns supply chain risks associated with the development, acquisition, maintenance and disposal of systems, system components and services.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes assets according to the data the asset stores, transmits and/ or processes, applying the appropriate technology controls to protect the asset and data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to prioritize the impact level for systems, applications and/ or services to prevent potential disruptions.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to prioritize the impact level for systems, applications and/ or services to prevent potential disruptions.
  available: false
  value: 5
