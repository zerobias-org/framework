id: 82f8cdc1-3289-5931-a9dc-0f294a0edbff
name: Zero-Touch Provisioning (ZTP)
description: Mechanisms exist to implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices upon being added to a network.
elementType: control
externalId: CFG-07
controlQuestion: Does the organization implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices upon being added to a network?
functionGrouping: Protect
controlWeighting: '8'
parent: cfg
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices up on being added to a network.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices up on being added to a network.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices up on being added to a network.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Configuration Management (CFG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe configuration management function is formally assigned with defined roles and responsibilities.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity & data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tConfiguration management is centralized for all operating systems, applications, servers and other configurable technologies.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including test, development, staging and production environments.\n•\tConfigurations conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tDeviations to baseline configurations are required to have a risk assessment and business process owner approval of the risk(s) associated with the deviation.\n•\tSpecial baseline configurations are created for higher-risk environments or for systems, applications and services that store, process or transmit sensitive/regulated data.\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tLogical Access Control (LAC) is used to limit the ability of non-administrators from making configuration changes to systems, applications and services, including the of installation of unauthorized software.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool, monitors for unauthorized activities, accounts, connections, devices and software.\n•\tUnauthorized configuration changes are responded to in accordance with an Incident Response Plan (IRP) to determine if the unauthorized configuration is malicious in nature.\n•\tZero-Touch Provisioning (ZTP), or similar technology, is used to automatically and securely configure devices up on being added to a network."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Configuration Management (CFG) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to implement Zero-Touch Provisioning (ZTP), or similar technology, to automatically and securely configure devices up on being added to a network.
  available: false
  value: 5
