id: 5daa0110-9bed-5b33-9218-b47ec045d2bb
name: Acceptable Discoverable Information
description: Mechanisms exist to define what information is allowed to be discoverable by adversaries and take corrective actions to remediated non-compliant systems.
elementType: enhancement
externalId: VPM-06.8
controlQuestion: Does the organization define what information is allowed to be discoverable by adversaries and take corrective actions to remediated non-compliant systems?
functionGrouping: Protect
controlWeighting: '5'
parent: vpm-06
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to define what information is allowed to be discoverable by adversaries and take corrective actions to remediated non-compliant systems.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Vulnerability & Patch Management (VPM) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAttack Surface Management (ASM) is decentralized.\n•\tIT personnel apply software patches through an informal process.\n•\tOccasional vulnerability scanning is conducted on High Value Assets (HVAs)."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Vulnerability & Patch Management (VPM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAttack Surface Management (ASM) is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for ASM.\no\tApply software patches and other vulnerability remediation efforts.\n•\tAdministrative processes and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tAdministrative processes and technologies prevent the public disclosure of internal address information."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Vulnerability & Patch Management (VPM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function:\no\tDefines the scope of ASM activities.\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data with regards to ASM.\no\tProvides oversight of ASM activities to centrally manage the flaw remediation process as part of the organization’s overall Patch& Vulnerability & Patch Management Program (VPMP).\n•\tA Security Operations Center (SOC), or similar function:\no\tManages the identification, tracking and remediation of vulnerabilities.\no\tUtilizes a Security Incident Event monitor (SIEM), or similar automated tool, to monitor for unauthorized activities, accounts, connections, devices and software according to organization-specific Indicators of Compromise (IoC), including feeds from applications, hosts, network devices and vulnerability scanners.\n•\tAsset custodians install the latest stable version of security-related updates on all systems within the organization-defined time requirements.\n•\tAdministrative processes and technologies prevent the public disclosure of internal address information."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to define what information is allowed to be discoverable by adversaries and take corrective actions to remediated non-compliant systems.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to define what information is allowed to be discoverable by adversaries and take corrective actions to remediated non-compliant systems.
  available: false
  value: 5
