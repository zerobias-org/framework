id: d27a265e-671e-5a13-8d3d-6fbb0a4e996c
name: First-Party Declaration (1PD)
description: Mechanisms exist to obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors.
elementType: enhancement
externalId: TPM-05.6
controlQuestion: Does the organization obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors?
functionGrouping: Identify
controlWeighting: '7'
parent: tpm-05
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Third-Party Management (TPM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThird-party management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for third-party management.\n•\tA procurement function maintains a list of all active External Service Providers (ESPs), including pertinent contract information that will assist in a risk assessment.\n•\tA Shared Responsibility Matrix (SRM) is documented for every TSP that directly or indirectly affects sensitive/regulated data.\n•\tProcurement contracts:\no\tRequire TSP to follow secure engineering practices as part of a broader Cybersecurity Supply Chain Risk Management (C-SCRM) initiative.\no\tContain \"break clauses\" in all TSP contracts to enable penalty-free, early termination of a contract for cause, based on the TSP's cybersecurity and/ or data privacy practices deficiency(ies)."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Third-Party Management (TPM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tProcurement contracts and layered defenses provide safeguards to limit harm from potential adversaries who identify and target the organization's supply chain.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function;\no\tprovides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data with regards to third-party management.\no\tOperates the Cybersecurity Supply Chain Risk Management (C-SCRM) program to identify and mitigate supply chain-related risks and threats.\no\tEvaluates risks associated with weaknesses or deficiencies in supply chain elements identified during first and/ or third-party reviews.\no\tEnables the implementation of third-party management controls.\no\tEnsures the Information Assurance Program (IAP) evaluates applicable cybersecurity & data privacy controls as part of “business as usual” pre-production testing.\n•\tA procurement team, or similar function:\no\tMaintains a list of all active External Service Providers (ESPs), including pertinent contract information that will assist in a risk assessment.\no\tRequires TSP to follow secure engineering practices as part of a broader Cybersecurity Supply Chain Risk Management (C-SCRM) initiative.\no\tIncludes \"break clauses\" in all TSP contracts to enable penalty-free, early termination of a contract for cause, based on the TSP's cybersecurity and/ or data privacy practices deficiency(ies).\no\tControls changes to services by suppliers, taking into account the criticality of business information, systems and processes that are in scope by the third-party.\no\tRequires a risk assessment prior to the acquisition or outsourcing of technology-related services.\no\tMonitors, regularly reviews and audits supplier service delivery for compliance with established contract agreements.\no\tUses tailored acquisition strategies, contract tools and procurement methods for the purchase of unique systems, system components or services.\n•\tA Shared Responsibility Matrix (SRM) is documented for every TSP that directly or indirectly affects sensitive/regulated data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to obtain a First-Party Declaration (1PD) from applicable External Service Providers (ESPs) that provides assurance of compliance with specified statutory, regulatory and contractual obligations for cybersecurity & data privacy controls, including any flow-down requirements to subcontractors.
  available: false
  value: 5
