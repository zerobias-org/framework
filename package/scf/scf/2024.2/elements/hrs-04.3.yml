id: 9a3da819-1e42-56b7-83ba-b0a5cd9ce029
name: Citizenship Requirements
description: Mechanisms exist to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/or contractual requirements for citizenship.
elementType: enhancement
externalId: HRS-04.3
controlQuestion: Does the organization verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/or contractual requirements for citizenship?
functionGrouping: Identify
controlWeighting: '5'
parent: hrs-04
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/ or contractual requirements for citizenship.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/ or contractual requirements for citizenship.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/ or contractual requirements for citizenship.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Human Resources Security (HRS) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Human Resources (HR) department:\no\tEnsures industry-recognized HR practices are implemented for hiring, managing, training, investigating and terminating employees, contractors and other personnel that work on behalf of the organization.\no\tEnsures that every user accessing a system that processes, stores, or transmits sensitive/regulated data is cleared and regularly trained in proper data handling practices.\no\tIdentifies and implements industry-recognized HR practices related to cybersecurity & data privacy training and awareness to help ensure secure practices are implemented in personnel operations to help manage risk to both technology assets and data.\no\tManages personnel security risk by assigning a risk designation to all positions and establishing screening criteria for individuals filling those positions.\n•\tAdministrative processes require Non-Disclosure Agreements (NDAs) or similar confidentiality agreements that reflect the needs to protect data and operational details, for both employees and third-parties.\n•\tHR ensures citizenship requirements are addressed per applicable statutory, regulatory and contractual requirements."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/ or contractual requirements for citizenship.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to verify that individuals accessing a system processing, storing, or transmitting sensitive information meet applicable statutory, regulatory and/ or contractual requirements for citizenship.
  available: false
  value: 5
