id: 65120f35-35e0-5517-9077-7bb29955f298
name: Software Escrow
description: Mechanisms exist to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
elementType: enhancement
externalId: TDA-20.3
controlQuestion: Does the organization escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support?
functionGrouping: Protect
controlWeighting: '7'
parent: tda-20
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Technology Development & Acquisition (TDA) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tSecure development practices conform to industry-recognized standards for secure engineering (e.g., OWASP, NIST SP 800-218, NIST SP 800-160, etc.).\n•\tA procurement team, or similar function, ensures that third party development and/ or acquisitions meet, or exceed, the organization's business, cybersecurity & data privacy requirements to have secure and resilient systems, applications, services and processes.\n•\tA Software Assurance Maturity Model (SAMM) governs a secure development lifecycle for the development of systems, applications and services.\n•\tAdministrative processes exist and technologies are configured to implement secure configuration settings by default to reduce the likelihood of software being deployed with weak security settings, putting the asset at a greater risk of compromise.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tA formal Change Management (CM) program help to ensure that no unauthorized changes are made, all changes are documented, services are not disrupted and resources are used efficiently.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function;\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data for technology development and acquisition.\no\tEnsures the Information Assurance Program (IAP) evaluates applicable cybersecurity & data privacy controls as part of “business as usual” pre-production testing.\no\tOperates the Cybersecurity Supply Chain Risk Management (C-SCRM) program to identify and mitigate supply chain-related risks and threats.\n•\tA Project Management Office (PMO), or project management function, enables IAP pre-production testing of cybersecurity & data privacy controls as part of the organization’s established project management processes.\n•\tThe process owner contracts a reputable third-party escrow agent to provide source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to escrow source code and supporting documentation to ensure software availability in the event the software provider goes out of business or is unable to provide support.
  available: false
  value: 5
