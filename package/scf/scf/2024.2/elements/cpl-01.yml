id: eb67a106-1390-508d-907d-d67312e77ece
name: Statutory, Regulatory & Contractual Compliance
description: Mechanisms exist to facilitate the identification and implementation of relevant statutory, regulatory and contractual controls.
elementType: control
externalId: CPL-01
controlQuestion: Does the organization facilitate the identification and implementation of relevant statutory, regulatory and contractual controls?
methodsToComply: "- Governance, Risk and Compliance Solution (GRC) tool (SCFConnect, SureCloud,Ostendio, ZenGRC, Archer, RSAM, MetricStream, etc.)\r\n- Steering committee"
functionGrouping: Govern
controlWeighting: '10'
parent: cpl
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the identification and implementation of relevant statutory, regulatory and contractual controls.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Compliance (CPL) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to govern statutory, regulatory and contractual compliance obligations.\n•\tIT personnel self-identify a set of controls that are used to conduct cybersecurity & data privacy control assessments.\n•\tIT personnel perform internal assessments of cybersecurity & data privacy controls to determine compliance status."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Compliance (CPL) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCompliance activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for compliance activities.\n•\tCybersecurity personnel use a defined set of controls to conduct cybersecurity & data privacy control assessments, as defined by the applicable statutory, regulatory and contractual requirements.\n•\tLegal representation is consulted on an as-needed basis.\n•\tCybersecurity personnel perform an informal annual review of existing compliance requirements and researches evolving or new requirements."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Compliance (CPL) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization’s business strategy to determine prioritized and authoritative guidance for statutory, regulatory and contractual obligations.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the organization to manage compliance efforts.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program with regards to GRC operations.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to ensure compliance requirements are identified and documented.\n•\tThe GRC function, or similar function:\no\tEnsures data/process owners understand their requirements to manage applicable cybersecurity & data privacy controls through oversight and written guidance.\no\tProvides applicable stakeholders with status reports on control execution to enable security controls oversight.\no\tWorks with data/process owners and asset custodians to document and validate the scope of cybersecurity & data privacy controls to ensure statutory, regulatory and/ or contractual compliance obligations are met.\no\tConducts cybersecurity & data privacy control assessments, on a regular cadence that is defined by the applicable statutory, regulatory and contractual requirements.\n•\tCybersecurity and data privacy controls are centrally managed through a technology solution (e.g., GRC solution) to assign controls, track control activities and report on compliance efforts.\n•\tLegal representation is consulted on an as-needed basis."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to facilitate the identification and implementation of relevant statutory, regulatory and contractual controls.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to facilitate the identification and implementation of relevant statutory, regulatory and contractual controls.
  available: false
  value: 5
