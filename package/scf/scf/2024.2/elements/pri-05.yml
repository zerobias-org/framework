id: 5b5217a3-77d8-548f-b566-7dbf359262fe
name: Personal Data Retention & Disposal
description: "Mechanisms exist to: \r\n ▪ Retain Personal Data (PD), including metadata, for an organization-defined time period to fulfill the purpose(s) identified in the notice or as required by law;\r\n ▪ Dispose of, destroys, erases, and/or anonymizes the PD, regardless of the method of storage; and\r\n ▪ Use organization-defined techniques or methods to ensure secure deletion or destruction of PD (including originals, copies and archived records)."
elementType: control
externalId: PRI-05
controlQuestion: "Does the organization: \r\n ▪ Retain Personal Data (PD), including metadata, for an organization-defined time period to fulfill the purpose(s) identified in the notice or as required by law;\r\n ▪ Dispose of, destroys, erases, and/or anonymizes the PD, regardless of the method of storage; and\r\n ▪ Use organization-defined techniques or methods to ensure secure deletion or destruction of PD (including originals, copies and archived records)?"
functionGrouping: Identify
controlWeighting: '8'
parent: pri
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to:
    ▪ Retain Personal Data (PD), including metadata, for an organization-defined time period to fulfill the purpose(s) identified in the notice or as required by law;
    ▪ Dispose of, destroys, erases, and/ or anonymizes the PD, regardless of the method of storage; and
    ▪ Use organization-defined techniques or methods to ensure secure deletion or destruction of PD (including originals, copies and archived records).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Privacy (PRI) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tNo formal data privacy team exists. Privacy roles are assigned to existing IT / cybersecurity.\n•\tFormal roles and responsibilities for data privacy may exist.\n•\tNo formal data privacy principles are identified for the organization.\n•\tAn ad hoc approach to Data Protection Impact Assessment (DPIA) exists."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Privacy (PRI) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPrivacy management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tThe data privacy program is developed to work with IT and cybersecurity staff to ensure that applicable statutory, regulatory and contractual data privacy obligations for Personal Data (PD) are properly identified and implemented across the enterprise.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for data privacy management.\n•\tA qualified individual is formally assigned as the Chief Privacy Officer (CPO), or similar role, to lead the organization’s data privacy program. This individual may be assigned to multiple duties, including that as a Data Protection Officer (DPO).\n•\tThe CPO, or similar role, identifies “data privacy principles” that systems, applications, services, processes and third-parties must adhere to, based on leading data privacy practices.\n•\tAdministrative processes and technologies retain PD, including metadata, for an organization-defined time period to fulfill the purpose(s) identified in the data privacy notice, or as required by law.\n•\tAdministrative processes and technologies dispose of, destroy, erase, and/ or anonymize the PD, regardless of the method of storage."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Privacy (PRI) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Chief Privacy Officer (CPO), or similar function with technical competence to address data privacy concerns, analyzes the organization’s business strategy to develop and publish authoritative guidance on the organization’s data privacy program.\n•\tA Privacy program, run by a CPO, or similar role, ensures that applicable statutory, regulatory and contractual data privacy obligations are properly identified and implemented to limit and secure Personal Data (PD) that the organization stores, transmits and processes.\n•\tAs part of the organization’s data privacy program, the CPO publishes a clear set of “data privacy principles”, based on leading data privacy practices, that systems, applications, services, processes and third-parties must adhere to.\n•\tA Project Management Office (PMO), or project management function, ensures both cybersecurity & data privacy principles are identified and implemented within ongoing or planned projects.\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization’s business strategy to determine prioritized and authoritative guidance for cybersecurity-related data privacy practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for cybersecurity-related data privacy practices.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data with regards to data privacy.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program.\n•\tData/process owners operationalize data privacy controls into the processes they control.\n•\tThird-party contracts included data protection requirements, including flow-down requirements to subcontractors.\n•\tData Protection Officers (DPOs) are assigned to work closely with business units and project teams to ensure data privacy principles are being implemented.\n•\tCPO and DPO determine and document the legal authority that permits the collection, use, maintenance and sharing of PD, either generally or in support of a specific program or system need."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Privacy (PRI) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: "Privacy (PRI) efforts are “world-class” capabilities that leverage predictive analysis (e.g., machine learning, AI, etc.). In addition to CMM Level 4 criteria, CMM Level 5 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tStakeholders make time-sensitive decisions to support operational efficiency, which may include automated remediation actions.\n▪ \tBased on predictive analysis, process improvements are implemented according to “continuous improvement” practices that affect process changes."
  available: true
  value: 5
