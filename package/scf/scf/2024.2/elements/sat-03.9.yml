name: Counterintelligence Training
description: Mechanisms exist to provide specialized counterintelligence awareness training that enables personnel to collect, interpret and act upon a range of data sources that may signal the presence of a hostile actor.
elementType: enhancement
externalId: SAT-03.9
controlQuestion: Does the organization provide specialized counterintelligence awareness training that enables personnel to collect, interpret and act upon a range of data sources that may signal the presence of a hostile actor?
functionGrouping: Identify
controlWeighting: '1'
parent: sat-03
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to provide specialized counterintelligence awareness training that enables personnel to collect, interpret and act upon a range of data sources that may signal the presence of a hostile actor.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
