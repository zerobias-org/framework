  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to provide specialized counterintelligence awareness training that enables personnel to collect, interpret and act upon a range of data sources that may signal the presence of a hostile actor.
  available: false
  value: 5
