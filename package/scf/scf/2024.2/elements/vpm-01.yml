id: bd4eef88-a312-5fac-b293-893c5bf239bc
name: Vulnerability & Patch Management Program (VPMP)
description: Mechanisms exist to facilitate the implementation and monitoring of vulnerability management controls.
elementType: control
externalId: VPM-01
controlQuestion: Does the organization facilitate the implementation and monitoring of vulnerability management controls?
methodsToComply: '- Vulnerability & Patch Management Program (ComplianceForge)'
functionGrouping: Govern
controlWeighting: '9'
parent: vpm
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the implementation and monitoring of vulnerability management controls.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Vulnerability & Patch Management (VPM) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAttack Surface Management (ASM) is decentralized.\n•\tIT personnel apply software patches through an informal process.\n•\tOccasional vulnerability scanning is conducted on High Value Assets (HVAs)."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Vulnerability & Patch Management (VPM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAttack Surface Management (ASM) is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for ASM.\no\tApply software patches and other vulnerability remediation efforts.\n•\tAdministrative processes and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Vulnerability & Patch Management (VPM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization’s business strategy to determine prioritized and authoritative guidance for Attack Surface Management (ASM) practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for ASM.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program, including ASM.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function:\no\tDefines the scope of ASM activities.\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data with regards to ASM.\no\tProvides oversight of ASM activities to centrally manage the flaw remediation process as part of the organization’s overall Patch& Vulnerability & Patch Management Program (VPMP).\n•\tA Security Operations Center (SOC), or similar function:\no\tManages the identification, tracking and remediation of vulnerabilities.\no\tUtilizes a Security Incident Event monitor (SIEM), or similar automated tool, to monitor for unauthorized activities, accounts, connections, devices and software according to organization-specific Indicators of Compromise (IoC), including feeds from applications, hosts, network devices and vulnerability scanners.\n•\tAsset custodians install the latest stable version of security-related updates on all systems within the organization-defined time requirements."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Vulnerability & Patch Management (VPM) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to facilitate the implementation and monitoring of vulnerability management controls.
  available: false
  value: 5
