id: 21820f3a-5acb-5426-9fbd-380b16db0265
name: Concealment & Misdirection
description: Mechanisms exist to utilize concealment and misdirection techniques for systems to confuse and mislead adversaries.
elementType: control
externalId: SEA-14
controlQuestion: Does the organization utilize concealment and misdirection techniques for systems to confuse and mislead adversaries?
functionGrouping: Protect
controlWeighting: '2'
parent: sea
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to utilize concealment and misdirection techniques for systems to confuse and mislead adversaries.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Secure Engineering & Architecture (SEA) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to design, build and maintain secure solutions.\n•\tIT /cyber engineering governance is decentralized, with the responsibility for implementing and testing cybersecurity & data privacy controls being assigned to the business process owner(s), including the definition and enforcement of roles and responsibilities."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Secure Engineering & Architecture (SEA) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tArchitecture/engineering management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tA Change Advisory Board (CAB), or similar function, exists to govern changes to systems, applications and services, ensuring their stability, reliability and predictability.\n•\tAdministrative processes and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls to address applicable statutory, regulatory and contractual requirements for architecture/engineering management.\n•\tIT personnel implement secure engineering practices to protect the confidentiality, integrity, availability and safety of the organization’s technology assets, data and network(s).\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and mostly conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including cryptographic protections for sensitive/regulated data."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Secure Engineering & Architecture (SEA) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT/cybersecurity architects, or a similar function, enable the implementation a “layered defense” network architecture that enables a resilient defense-in-depth approach through the use of industry-recognized cybersecurity & data privacy practices in the specification, design, development, implementation and modification of systems and services (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tIT/cybersecurity engineers, or a similar function, operationalize enterprise architecture, aligned with industry-recognized leading practices, with consideration for cybersecurity & data privacy principles, including resiliency expectations, that addresses risk to organizational operations, assets, individuals, other organizations.\n•\tA Validated Architecture Design Review (VADR), or similar process, is used to evaluate design criteria for secure practices and conformance with requirements for applicable statutory, regulatory and contractual controls to determine if the system/application/service is designed, built and operated in a secure and resilient manner.\n•\tA Change Advisory Board (CAB), or similar function, governs changes to systems, applications and services to ensure their stability, reliability and predictability.\n•\tA formal Change Management (CM) program helps to ensure that no unauthorized changes are made, all changes are documented, services are not disrupted and resources are used efficiently.\n•\tAn Identity & Access Management (IAM) function, or similar function, enables the implementation of identification and access management controls for “least privileges” practices, allowing for the management of user, group and system accounts, including privileged accounts.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes assets according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to utilize concealment and misdirection techniques for systems to confuse and mislead adversaries.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to utilize concealment and misdirection techniques for systems to confuse and mislead adversaries.
  available: false
  value: 5
