id: 5148a163-cd16-5ca8-8602-12d6fc3a6c52
name: Exception Management
description: Mechanisms exist to prohibit exceptions to standards, except when the exception has been formally assessed for risk impact, approved and recorded.
elementType: enhancement
externalId: GOV-02.1
controlQuestion: Does the organization prohibit exceptions to standards, except when the exception has been formally assessed for risk impact, approved and recorded?
functionGrouping: Govern
controlWeighting: '8'
parent: gov-02
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to prohibit exceptions to standards, except when the exception has been formally assessed for risk impact, approved and recorded.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Cybersecurity & Privacy Governance (GOV) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tNo formal cybersecurity and/ or data privacy principles are identified for the organization.\n•\tNo formal Governance, Risk & Compliance (GRC) team exists. GRC roles are assigned to existing IT/cybersecurity personnel.\n•\tGovernance efforts are narrowly-limited to certain compliance requirements.\n•\tFormal roles and responsibilities for cybersecurity and/ or data privacy may exist.\n•\tCybersecurity and data privacy governance is informally assigned as an additional duty to existing IT/cybersecurity personnel.\n•\tBasic cybersecurity policies and standards are documented [not based on any industry framework]\n•\tBasic procedures are established for important tasks, but are ad hoc and not formally documented.\n•\tDocumentation is made available to internal personnel.\n•\tOrganizational leadership maintains an informal process to review and respond to observed trends."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cybersecurity & Privacy Governance (GOV) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCybersecurity and data privacy governance activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cybersecurity & data privacy governance activities.\n•\tThe Chief Information Officer (CIO), or similar function, analyzes the organization’s business strategy and prioritizes the objectives of the security function, based on business requirements.\n•\tA qualified individual is assigned the role and responsibilities to centrally manage, coordinate, develop, implement and maintain a cybersecurity & data privacy program (e.g., cybersecurity director or Chief Information Security Officer (CISO)).\n•\tNo formal Governance, Risk & Compliance (GRC) team exists. GRC roles are assigned to existing cybersecurity personnel.\n•\tCompliance requirements for cybersecurity & data privacy are identified and documented.\n•\tCybersecurity policies and standards exist that are aligned with a leading cybersecurity framework (e.g., SCF, NIST 800-53, ISO 27002 or NIST Cybersecurity Framework).\n•\tControls are assigned to sensitive/regulated assets to comply with specific compliance requirements.\n•\tProcedures are established for sensitive/regulated obligations, but are not standardized across the organization.\n•\tDocumentation is made available to internal personnel."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cybersecurity & Privacy Governance (GOV) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tStatutory, regulatory and contractual compliance requirements for cybersecurity & data privacy are identified and documented. Recurring testing is utilized to assess adherence to internal standards and/or external compliance requirements.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides scoping guidance to determine control applicability.\n•\tInternal policies and standards address all statutory, regulatory and contractual obligations for cybersecurity & data privacy.\n•\tControls are standardized across the organization to ensure uniformity and consistent execution.\n•\tCorporate governance (executive oversight) exists for the cybersecurity and data privacy, which includes regular briefings to ensure executives have sufficient situational awareness to properly govern the organization.\n•\tProcedures are established for sensitive/regulated compliance obligations that are standardized across the organization.\n•\tDefined roles & responsibilities require data/process owners to define, implement and maintain cybersecurity & data privacy controls for each system, application and/ or service of which they have accountability.\n•\tThe organization designates one or more qualified individuals to govern the cybersecurity and data privacy programs (e.g., Chief Information Security Officer or Chief Privacy Officer).\n•\tRisk management processes are defined, to include materiality considerations."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to prohibit exceptions to standards, except when the exception has been formally assessed for risk impact, approved and recorded.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to prohibit exceptions to standards, except when the exception has been formally assessed for risk impact, approved and recorded.
  available: false
  value: 5
