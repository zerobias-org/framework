id: 9372fae3-4df7-504e-9efc-3c63a6c67e45
name: Cryptographic Management
description: Mechanisms exist to govern assets involved in providing cryptographic protections according to the organization's configuration management processes.
elementType: enhancement
externalId: CHG-02.5
controlQuestion: Does the organization govern assets involved in providing cryptographic protections according to the organization's configuration management processes?
functionGrouping: Protect
controlWeighting: '5'
parent: chg-02
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to govern assets involved in providing cryptographic protections according to the organization's configuration management processes.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to govern assets involved in providing cryptographic protections according to the organization's configuration management processes.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Change Management (CHG) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tChange management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for change management.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function, exists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\n•\tA CAB, or similar function, reviews RFCs for cybersecurity & data privacy ramifications.\n•\tA CAB, or similar function, notifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tLogical Access Control (LAC) limits the ability of non-administrators from making unauthorized configuration changes to systems, applications and services.\n•\tCybersecurity controls are tested after a change is implemented to ensure cybersecurity controls are operating properly."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Change Management (CHG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tITAM leverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tLogical Access Control (LAC) is governed to limit the ability of non-administrators from making configuration changes to systems, applications and services.\n•\tA formal Change Management (CM) program ensures that no unauthorized changes are made, that all changes are documented, that services are not disrupted and that resources are used efficiently.\n•\tThe CM function has formally defined roles and associated responsibilities.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function:\no\tExists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews RFC for cybersecurity & data privacy ramifications.\no\tNotifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tIT personnel use dedicated development/test/staging environments to deploy and evaluate changes, wherever technically possible.\n•\tCryptographic primitives are employed to track file revisions and authentications."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to govern assets involved in providing cryptographic protections according to the organization's configuration management processes.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to govern assets involved in providing cryptographic protections according to the organization's configuration management processes.
  available: false
  value: 5
