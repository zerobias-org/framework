name: Authoritative Chain of Command
description: Mechanisms exist to establish an authoritative chain of command with clear lines of communication to remove ambiguity from individuals and teams related to managing data and technology-related risks.
elementType: enhancement
externalId: GOV-04.2
controlQuestion: Does the organization establish an authoritative chain of command with clear lines of communication to remove ambiguity from individuals and teams related to managing data and technology-related risks?
methodsToComply: '- Organization chart'
functionGrouping: Govern
controlWeighting: '7'
