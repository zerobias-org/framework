id: 75fc365b-57ea-5c57-9cae-8bf230613f97
name: Disassociability
description: Mechanisms exist to disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties.
elementType: enhancement
externalId: IAC-03.4
controlQuestion: Does the organization disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties?
functionGrouping: Protect
controlWeighting: '2'
parent: iac-03
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Identification & Authentication (IAC) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tLogical Access Control (LAC) is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for logical access control.\n•\tIT personnel:\no\tImplement and maintain an Identity & Access Management (IAM) capability for all users to implement “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\no\tGovern IAM technologies via RBAC to prohibit privileged access by non-organizational users, unless there is an explicit support contract for privileged IT support services.\n•\tActive Directory (AD), or a similar technology, is primarily used to centrally manage identities and permissions with RBAC. Due to technical or business limitations, asset/process owners are empowered to operate a decentralized access control program for their specific systems, applications and services that cannot be integrated into AD.\n•\tIAM controls are primarily administrative in nature (e.g., policies & standards) to manage accounts and permissions."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Identification & Authentication (IAC) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\n•\tThe Human Resources (HR) department governs personnel management operations and notifies IAM personnel of personnel role changes for RBAC-based provisioning and deprovisioning actions.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity & data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tActive Directory (AD), or a similar technology, is used to centrally manage identities and permissions. Only by exception due to a technical or business limitation are solutions authorized to operate a decentralized access control program for systems, applications and services."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to disassociate user attributes or credential assertion relationships among individuals, credential service providers and relying parties.
  available: false
  value: 5
