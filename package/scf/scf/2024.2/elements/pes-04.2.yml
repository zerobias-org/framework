cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to inspect personnel and their personal effects (e.g., personal property ordinarily worn or carried by the individual, including vehicles) to prevent the unauthorized exfiltration of data and technology assets.
  available: true
