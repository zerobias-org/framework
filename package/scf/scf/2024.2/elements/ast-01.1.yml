id: 8ee4693e-175f-56a2-a9a8-9098d770c264
name: Asset-Service Dependencies
description: Mechanisms exist to identify and assess the security of technology assets that support more than one critical business function.
elementType: enhancement
externalId: AST-01.1
controlQuestion: Does the organization identify and assess the security of technology assets that support more than one critical business function?
functionGrouping: Identify
controlWeighting: '5'
parent: ast-01
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to identify and assess the security of technology assets that support more than one critical business function.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to identify and assess the security of technology assets that support more than one critical business function.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Asset Management (AST) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAsset management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for asset management.\n•\tAdministrative processes and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tAsset management is formally assigned as an additional duty to existing IT/cybersecurity personnel.\n•\tTechnology assets are categorized according to data classification and business criticality.\n•\tInventories cover technology assets in scope for statutory, regulatory and/ or contractual compliance, which includes both physical and virtual assets.\n•\tSoftware licensing is tracked as part of IT asset inventories.\n•\tUsers are educated on their responsibilities to protect technology assets assigned to them or under their supervision.\n•\tIT/cybersecurity personnel maintain network diagrams to document the flow of sensitive/regulated data across the network.\n•\tF or business-critical business services and assets, dependencies are reviewed by cybersecurity personnel for security concerns."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Asset Management (AST) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, governs asset management to help ensure compliance with requirements for asset management.\n•\tAn ITAM function, or similar function, maintains an inventory of IT assets, covering both physical and virtual assets, as well as centrally managed asset ownership assignments.\n•\tTechnology assets and data are categorized according to data classification and business criticality criteria.\n•\tA Cybersecurity Supply Chain Risk Management (C-SCRM) function oversees supply chain risks including the removal and prevention of certain technology services and/ or equipment designated as supply chain threats by a statutory or regulatory body.\n•\tData/process owners document where sensitive/regulated data is stored, transmitted and processed, generating Data Flow Diagrams (DFDs) and network diagrams to document the flow of data.\n•\tThe CMDB, or similar tool, is leveraged to identify asset-service dependencies that can impact the security of technology assets, as well as relevant stakeholders and data/process owners.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity & data privacy controls are addressed to ensure secure configurations are designed, built and maintained."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Asset Management (AST) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement.\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to identify and assess the security of technology assets that support more than one critical business function.
  available: false
  value: 5
