id: 824a6988-fb46-5602-8f30-a633d23d54db
name: Adaptive Email Protections
description: Mechanisms exist to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
elementType: enhancement
externalId: NET-20.7
controlQuestion: Does the organization utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections?
functionGrouping: Protect
controlWeighting: '1'
parent: net-20
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Network Security (NET) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Technology Infrastructure team, or similar function, defines centrally-managed network security controls for implementation across the enterprise.\n•\tSecure engineering principles are used to design and implement network security controls (e.g., industry-recognized secure practices) to enforce the concepts of least privilege and least functionality at the network level.\n•\tIT/cybersecurity architects work with the Technology Infrastructure team to implement a “layered defense” network architecture that provides a defense-in-depth approach for redundancy and risk reduction for network-based security controls, including wired and wireless networking.\n•\tAdministrative processes and technologies configure boundary devices (e.g., firewalls, routers, etc.) to deny network traffic by default and allow network traffic by exception (e.g., deny all, permit by exception).\n•\tTechnologies automate the Access Control Lists (ACLs) and similar rulesets review process to identify security issues and/ or misconfigurations.\n•\tNetwork segmentation exists to implement separate network addresses (e.g., different subnets) to connect systems in different security domains (e.g., sensitive/regulated data environments)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to utilize adaptive email protections that involve employing risk-based analysis in the application and enforcement of email protections.
  available: false
  value: 5
