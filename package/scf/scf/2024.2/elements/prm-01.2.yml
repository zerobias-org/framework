id: aae92482-d02a-5be1-a4a7-d9e116702ef1
name: Targeted Capability Maturity Levels
description: Mechanisms exist to define and identify targeted capability maturity levels.
elementType: enhancement
externalId: PRM-01.2
controlQuestion: Does the organization define and identify targeted capability maturity levels?
functionGrouping: Identify
controlWeighting: '5'
parent: prm-01
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to define and identify targeted capability maturity levels.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to define and identify targeted capability maturity levels.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Project & Resource Management (PRM) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tProgram/project management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for Project Management (PM).\n•\tThe PM function facilitates the implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe responsibility for enforcing cybersecurity & data privacy control implementation is assigned to business / process owners and asset custodians.\n•\tThe Chief Information Officer (CIO), or similar function, analyzes the organization’s business strategy and prioritizes the objectives and resourcing of the security function, based on broader business requirements.\n•\tIT/cybersecurity personnel develop plans to implement security-related objectives, based on defined capability maturity levels (e.g., SCF SP-CMM)."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Project & Resource Management (PRM) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization’s business strategy to determine prioritized and authoritative guidance for program/project management practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise with regards to program/project management.\n•\tThe CISO, or similar function, leverages a capability maturity model to define and identify targeted capability maturity levels for each of the functions that make up the cybersecurity & data privacy program.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls to protect the confidentiality, integrity, availability and safety of the organization’s applications, systems, services and data for program/project management.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program, including program/project management.\n•\tA Project Management Office (PMO), or project management function, enables the centralized-implementation of cybersecurity & data privacy-related resource planning controls across the System Development Lifecycle (SDLC) for all projects.\n•\tThe PMO determines the identification and allocation of resources for cybersecurity & data privacy requirements within business process planning for projects and other initiatives.\n•\tProject Management (PM) is centrally-managed across the enterprise to implement cybersecurity & data privacy controls as part of the project management lifecycle, with the responsibility for enforcing cybersecurity & data privacy control implementation assigned to business / process owners and asset custodians.\n•\tSubordinate staff and stakeholders are educated on the capability maturity expectations and those targets are used to task individual contributor work activities in an effort to achieve the targeted maturity levels."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to define and identify targeted capability maturity levels.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to define and identify targeted capability maturity levels.
  available: false
  value: 5
