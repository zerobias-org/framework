id: 9c08f54a-5439-5d95-8c77-aec1381a4d4a
name: Dynamic Isolation & Segregation (Sandboxing)
description: Automated mechanisms exist to dynamically isolate (e.g., sandbox) untrusted components during runtime, where the component is isolated in a fault-contained environment but it can still collaborate with the application.
elementType: enhancement
externalId: NET-03.6
controlQuestion: Does the organization use automated mechanisms to dynamically isolate (e.g., sandbox) untrusted components during runtime, where the component is isolated in a fault-contained environment but it can still collaborate with the application?
functionGrouping: Protect
controlWeighting: '5'
parent: net-03
