id: be47b241-19dc-57d7-abb3-8988e4e3a5fd
name: Automated Security Response
description: Automated mechanisms exist to implement remediation actions upon the detection of unauthorized baseline configurations change(s).
elementType: enhancement
externalId: CHG-02.4
controlQuestion: Does the organization use automated mechanisms to implement remediation actions upon the detection of unauthorized baseline configurations change(s)?
methodsToComply: '- CimTrak Integrity Suite (https://www.cimcor.com/cimtrak/)'
functionGrouping: Protect
controlWeighting: '5'
parent: chg-02
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to implement remediation actions up on the detection of unauthorized baseline configurations change(s).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to implement remediation actions up on the detection of unauthorized baseline configurations change(s).
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to implement remediation actions up on the detection of unauthorized baseline configurations change(s).
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Change Management (CHG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tITAM leverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tLogical Access Control (LAC) is governed to limit the ability of non-administrators from making configuration changes to systems, applications and services.\n•\tA formal Change Management (CM) program ensures that no unauthorized changes are made, that all changes are documented, that services are not disrupted and that resources are used efficiently.\n•\tThe CM function has formally defined roles and associated responsibilities.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function:\no\tExists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews RFC for cybersecurity & data privacy ramifications.\no\tNotifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tIT personnel use dedicated development/test/staging environments to deploy and evaluate changes, wherever technically possible.\n•\tFile Integrity Monitoring (FIM) alerts are investigated for unauthorized changes.\n•\tFIM alerts are investigated for unauthorized changes and are configured to implement remediation actions up on the detection of unauthorized baseline configurations change(s).\n•\tFIM is deployed on systems that store, process or transmit sensitive/regulated/regulated data to monitor the integrity of business-critical files for tampering.\n•\tEndpoint technologies detect and report changes with a centralized Change Management (CM) service to discover unauthorized changes."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Change Management (CHG) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to implement remediation actions up on the detection of unauthorized baseline configurations change(s).
  available: false
  value: 5
