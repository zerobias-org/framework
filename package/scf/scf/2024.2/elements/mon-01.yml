id: e4a4cddf-8580-5a08-b6fd-398a09d9bef1
name: Continuous Monitoring
description: Mechanisms exist to facilitate the implementation of enterprise-wide monitoring controls.
elementType: control
externalId: MON-01
controlQuestion: Does the organization facilitate the implementation of enterprise-wide monitoring controls?
methodsToComply: "- Splunk\r\n- CimTrak Integrity Suite (https://www.cimcor.com/cimtrak/)\r\n- NNT Change Tracker (https://www.newnettechnologies.com)"
functionGrouping: Govern
controlWeighting: '10'
parent: mon
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the implementation of enterprise-wide monitoring controls.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Continuous Monitoring (MON) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tGenerating event logs and the review of event logs is narrowly-focused to business-critical systems and/ or systems that store, processes and/ or transmit sensitive/regulated data.\n•\tSecure baseline configurations generate logs that contain sufficient information to establish necessary details of activity and allow for forensics analysis."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Continuous Monitoring (MON) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tSituational awareness management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tSecure baseline configurations generate logs that contain sufficient information to establish necessary details of activity and allow for forensics analysis.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for situational awareness management.\no\tConfigure alerts for critical or sensitive data that is stored, transmitted and processed on assets.\no\tUse a structured process to review and analyze logs.\n•\tA log aggregator, or similar automated tool, provides an event log report generation capability to aid in detecting and assessing anomalous activities on business-critical systems."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Continuous Monitoring (MON) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization’s business strategy to determine prioritized and authoritative guidance for continuous monitoring (e.g., event log collection and analysis) practices, within the broader scope of cybersecurity and data protection operations.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the organization for security monitoring.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity & data privacy controls for continuous security monitoring.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity & data privacy program, including continuous monitoring.\n•\tAn IT Asset Management (ITAM) function, or similar function:\no\tGoverns asset management that ensures compliance with requirements for asset management.\no\tLeverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool:\no\tCentrally collects logs and is protected according to the manufacturer’s security guidelines to protect the integrity of the event logs with cryptographic mechanisms.\no\tMonitors the organization for Indicators of Compromise (IoC) and provides 24x7x365 near real-time alerting capability.\no\tIs configured to alert incident response personnel of detected suspicious events such that incident responders can look to terminate suspicious events.\n•\tA Security Operations Center (SOC), or similar function, enables incident management operations covering preparation, detection and analysis, containment, eradication and recovery.\n•\tBoth inbound and outbound network traffic is monitored for unauthorized activities to identify prohibited activities and assist incident handlers with identifying potentially compromised systems."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Continuous Monitoring (MON) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n▪ \tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n▪ \tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n▪ \tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity & data privacy controls, including functions performed by third-parties.\n▪ \tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n▪ \tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n▪ \tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to facilitate the implementation of enterprise-wide monitoring controls.
  available: false
  value: 5
