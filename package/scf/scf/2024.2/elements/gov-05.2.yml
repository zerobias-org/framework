name: Key Risk Indicators (KRIs)
description: Mechanisms exist to develop, report and monitor Key Risk Indicators (KRIs) to assist senior management in performance monitoring and trend analysis of the cybersecurity & data privacy program.
elementType: enhancement
externalId: GOV-05.2
controlQuestion: Does the organization develop, report and monitor Key Risk Indicators (KRIs) to assist senior management in performance monitoring and trend analysis of the cybersecurity & data privacy program?
methodsToComply: '- Key Risk Indicators (KRIs)'
functionGrouping: Govern
controlWeighting: '6'
