id: 8f28c985-e41a-5e60-bf1b-57d98c07d655
name: Alternate Storage Site
description: Mechanisms exist to establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information.
elementType: control
externalId: BCD-08
controlQuestion: Does the organization establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information?
methodsToComply: "- SunGard\r\n- AWS\r\n- Azure"
functionGrouping: Protect
controlWeighting: '9'
parent: bcd
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Business Continuity & Disaster Recovery (BCD) efforts are requirements-driven and formally governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tBusiness Continuity / Disaster Recovery (BC/DR) management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity & data privacy controls that are appropriate to address applicable statutory, regulatory and contractual requirements for BC/DR management.\n•\tBC/DR roles are formally assigned as an additional duty to existing IT/cybersecurity personnel.\n•\tRecovery Time Objectives (RTOs) identify business-critical systems and services, which are given priority of service in alternate processing and storage sites.\n•\tIT personnel develop Disaster Recovery Plans (DRP) to recover business-critical systems and services.\n•\tData/process owners conduct a Business Impact Analysis (BIA) at least annually, or after any major technology or process change, to identify assets critical to the business in need of protection, as well as single points of failure.\n•\tIT/cybersecurity personnel work with business stakeholders to develop Business Continuity Plans (BCPs) to ensure business functions are sustainable both during and after an incident within Recovery Time Objectives (RTOs).\n•\tIT personnel use a backup methodology (e.g., grandfather, father & s on rotation) to store backups in a secondary location, separate from the primary storage site.\n•\tIT personnel configure business-critical systems to transfer backup data to the alternate site at a rate that is capable of meeting Recovery Time Objectives (RTOs) and Recovery Point Objectives (RPOs).\n•\tthe organization acquires space to serve as the alternate site that is in a different geographic zone from the inaccessible facility (e.g., dedicated facility or cloud instance).Roles and responsibilities are formally assigned to restore the primary site in the event of a catastrophe, emergency, or similar-type disruptive incident in accordance with the Continuity of Operations (COOP) plan.\n•\tIT personnel backup copies of business-critical software, licenses/keys and other security-related information to the alternate site.\n•\tIT personnel configure business-critical systems to be able to failover to an alternate location than the primary system which can be activated without loss of information or disruption to operations.\n•\tA dedicated alternate site is identified, documented, equipped to match the processing capabilities of the primary site and not used for existing production activities .\n•\tIT personnel maintain network connectivity for data communications from the alternate site toother business critical locations in order to support business processes.\n•\tIT personnel maintain redundant network connectivity from the alternate site to the business locations providing the ability for data communications to support business processes.\n•\tIT personnel maintain technologies compatible with existing network and infrastructure configuration. the organization either owns the facility or contracts with a third-party provider for off-site storage."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Business Continuity & Disaster Recovery (BCD) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA formal Business Continuity & Disaster Recovery (BC/DR) program exists with defined roles and responsibilities to restore functionality in the event of a catastrophe, emergency, or significant disruptive incident that is handled in accordance with a Continuity of Operations Plan (COOP).\n•\tBC/DR personnel work with business stakeholders to identify business-critical systems, services, internal teams and third-party service providers.\n•\tSpecific criteria are defined to initiate BC/DR activities that facilitate business continuity operations capable of meeting applicable RTOs and/or RPOs.•\tApplication/system/process owners conduct a Business Impact Analysis (BIA) at least annually, or after any major technology or process change, to identify assets critical to the business in need of protection, as well as single points of failure.\n•\tRecovery Time Objectives (RTOs) are defined for business-critical systems and services.\n•\tRecovery Point Objectives (RPOs) are defined and technologies exist to conduct transaction-level recovery, in accordance with RPOs.\n\n•\tControls are assigned to sensitive/regulated assets to comply with specific BC/DR requirements to facilitate recovery operations in accordance with RTOs and RPOs.\n•\tIT personnel work with business stakeholders to develop Disaster Recovery Plans (DRP) to recover business-critical systems and services within RPOs.\n•\tBusiness stakeholders work with IT personnel to develop Business Continuity Plans (BCPs) to ensure business functions are sustainable both during and after an incident within RTOs.\n•\tThe data backup function is formally assigned with defined roles and responsibilities.\n•\tBC/DR personnal have pre-established methods to communicate the status of recovery activities and progress in restoring operational capabilities to designated internal and external stakeholders.\n•\tThe integrity of backups and other restoration assets are verified prior to using them for restoration."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to establish an alternate storage site that includes both the assets and necessary agreements to permit the storage and recovery of system backup information.
  available: false
  value: 5
