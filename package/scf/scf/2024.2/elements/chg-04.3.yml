id: 4e5dd866-2683-547e-8c14-5942b0ed801b
name: Dual Authorization for Change
description: Mechanisms exist to enforce a two-person rule for implementing changes to critical assets.
elementType: enhancement
externalId: CHG-04.3
controlQuestion: Does the organization enforce a two-person rule for implementing changes to critical assets?
methodsToComply: '- Separation of Duties (SoD)'
functionGrouping: Protect
controlWeighting: '6'
parent: chg-04
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to enforce a two-pers on rule for implementing changes to critical assets.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: SP-CMM1 is N/A, since a structured process is required to enforce a two-pers on rule for implementing changes to critical assets.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: SP-CMM2 is N/A, since a well-defined process is required to enforce a two-pers on rule for implementing changes to critical assets.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Change Management (CHG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tITAM leverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tLogical Access Control (LAC) is governed to limit the ability of non-administrators from making configuration changes to systems, applications and services.\n•\tA formal Change Management (CM) program ensures that no unauthorized changes are made, that all changes are documented, that services are not disrupted and that resources are used efficiently.\n•\tThe CM function has formally defined roles and associated responsibilities.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function:\no\tExists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews RFC for cybersecurity & data privacy ramifications.\no\tNotifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tIT personnel use dedicated development/test/staging environments to deploy and evaluate changes, wherever technically possible.\n•\tCritical systems are configured to use dual authorization mechanisms requiring the approval of two authorized individuals in order to execute a change."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See SP-CMM3. SP-CMM4 is N/A, since a quantitatively-controlled process is not necessary to enforce a two-pers on rule for implementing changes to critical assets.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See SP-CMM4. SP-CMM5 is N/A, since a continuously-improving process is not necessary to enforce a two-pers on rule for implementing changes to critical assets.
  available: false
  value: 5
