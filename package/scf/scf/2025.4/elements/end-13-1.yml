id: a160bfbd-e94d-4c59-b6d1-b2b2b20c4f27
name: Authorized Use
description: Mechanisms exist to utilize organization-defined measures so that data or information collected by sensors is only used for authorized purposes.
elementType: enhancement
externalId: END-13.1
parent: end-13
controlQuestion: Does the organization utilize organization-defined measures so that data or information collected by sensors is only used for authorized purposes?
functionGrouping: Protect
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to utilize organization-defined measures so that data or information collected by sensors is only used for authorized purposes.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Endpoint Security (END) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAsset management is informally assigned as an additional duty to existing IT/cybersecurity personnel.\n•\tIT/cybersecurity personnel use an informal process to design, build and maintain secure configurations for test, development, staging and production environments, including the implementation of appropriate cybersecurity and data protection controls.\n•\tAnti-malware technologies are decentralized but are deployed on all technology assets that can run Anti-malware software.\n•\tData management is decentralized."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Endpoint Security (END) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tEndpoint security management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for endpoint security management.\n•\tAnti-malware technologies are decentralized but are deployed on all technology assets that can run anti-malware software.\n•\tPhysical controls, administrative processes and technologies focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and mostly conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including cryptographic protections for sensitive/regulated data.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of Personal Data (PD) processed, stored or transmitted on endpoint devices, so that cybersecurity and data protection controls are implemented in accordance with applicable statutory, regulatory and contractual obligations.\n•\tAdministrative processes exist and technologies are configured to notify individuals that Personal Data (PD) is collected by sensors."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Endpoint Security (END) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tConfiguration management is centralized for all operating systems, applications, servers and other configurable technologies.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including test, development, staging and production environments.\n•\tConfigurations conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” practices for the management of user, group and system accounts, including privileged accounts.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tA Security Operations Center (SOC), or similar function, centrally manages anti-malware and anti-phishing technologies, in accordance with industry-recognized practices for Prevention, Detection & Response (PDR) activities.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool, is tuned to detect and respond to anomalous behavior that could indicate account compromise or other malicious activities.\n•\tThe Human Resources (HR) department ensures that every user accessing a system that processes, stores, or transmits sensitive/regulated data is cleared and regularly trained in proper data handling practices.\n•\tUnauthorized configuration changes are responded to in accordance with an Incident Response Plan (IRP) to determine if the any unauthorized configuration is malicious in nature.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of Personal Data (PD) processed, stored or transmitted on endpoint devices, so that cybersecurity and data protection controls are implemented in accordance with applicable statutory, regulatory and contractual obligations.\n•\tAdministrative processes exist and technologies are configured to notify individuals that Personal Data (PD) is collected by sensors."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to utilize organization-defined measures so that data or information collected by sensors is only used for authorized purposes.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to utilize organization-defined measures so that data or information collected by sensors is only used for authorized purposes.
  available: false
  value: 5
