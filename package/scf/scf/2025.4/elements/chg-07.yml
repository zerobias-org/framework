id: 7d1cfba6-96c8-4fe7-aacf-76bfa510d100
name: Emergency Changes
description: Mechanisms exist to govern change management procedures for "emergency" changes.
elementType: control
externalId: CHG-07
parent: chg
controlQuestion: Does the organization govern change management procedures for "emergency" changes?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to govern change management procedures for "emergency" changes.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to govern change management procedures for "emergency" changes.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Change Management (CHG) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tChange management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for change management.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function, exists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\n•\tA CAB, or similar function, reviews RFCs for cybersecurity and data privacy ramifications.\n•\tA CAB, or similar function, notifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tLogical Access Control (LAC) limits the ability of non-administrators from making unauthorized configuration changes to systems, applications and services.\n•\tCybersecurity controls are tested after a change is implemented to ensure cybersecurity controls are operating properly."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Change Management (CHG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tITAM leverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tLogical Access Control (LAC) is governed to limit the ability of non-administrators from making configuration changes to systems, applications and services.\n•\tA formal Change Management (CM) program ensures that no unauthorized changes are made, that all changes are documented, that services are not disrupted and that resources are used efficiently.\n•\tThe CM function has formally defined roles and associated responsibilities.\n•\tChanges are tracked through a centralized technology solution to submit, review, approve and assign Requests for Change (RFC).\n•\tA Change Advisory Board (CAB), or similar function:\no\tExists to govern changes to systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews RFC for cybersecurity and data privacy ramifications.\no\tNotifies stakeholders to ensure awareness of the impact of proposed changes.\n•\tIT personnel use dedicated development/test/staging environments to deploy and evaluate changes, wherever technically possible.\n•\tUp on implementing the RFC, the technician implementing a change tests to ensure anti-malware, logging and other cybersecurity and data protection controls are still implemented and operating properly.\n•\tA structured set of controls are tested after a change is implemented to ensure cybersecurity controls are operating properly.\n•\tResults from testing changes are documented.\n•\tA vulnerability assessment is conducted on systems/applications/services to detect any new vulnerabilities that a change may have introduced."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to govern change management procedures for "emergency" changes.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to govern change management procedures for "emergency" changes.
  available: false
  value: 5
