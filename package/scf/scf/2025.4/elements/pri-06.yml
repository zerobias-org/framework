id: 7ba23f0f-e377-4a96-87d9-fe41ef01e410
name: Data Subject Empowerment
description: "Mechanisms exist to provide authenticated data subjects the ability to:\r\n(1) Access their Personal Data (PD) that is being processed, stored and shared, except where the burden, risk or expense of providing access would be disproportionate to the benefit offered to the data subject through granting access;\r\n(2) Obtain answers on the specifics of how their PD is collected, received, processed, stored, transmitted, shared, updated and/or disposed; \r\n(3) Obtain the source(s) of their PD; \r\n(4) Obtain the categories of their PD being collected, received, processed, stored and shared; \r\n(5) Request correction to their PD due to inaccuracies;\r\n(6) Request erasure of their PD; and\r\n(7) Restrict the further collecting, receiving, processing, storing, transmitting, updated and/or sharing of their PD."
elementType: control
externalId: PRI-06
parent: pri
controlQuestion: "Does the organization provide authenticated data subjects the ability to:\r\n (1) Access their Personal Data (PD) that is being processed, stored and shared, except where the burden, risk or expense of providing access would be disproportionate to the benefit offered to the data subject through granting access;\r\n (2) Obtain answers on the specifics of how their PD is collected, received, processed, stored, transmitted, shared, updated and/or disposed; \r\n (3) Obtain the source(s) of their PD; \r\n (4) Obtain the categories of their PD being collected, received, processed, stored and shared; \r\n (5) Request correction to their PD due to inaccuracies;\r\n (6) Request erasure of their PD; and\r\n (7) Restrict the further collecting, receiving, processing, storing, transmitting, updated and/or sharing of their PD?"
functionGrouping: Identify
controlWeighting: '6'
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to provide authenticated data subjects the ability to:
    (1) Access their Personal Data (PD) that is being processed, stored and shared, except where the burden, risk or expense of providing access would be disproportionate to the benefit offered to the data subject through granting access;
    (2) Obtain answers on the specifics of how their PD is collected, received, processed, stored, transmitted, shared, updated and/or disposed;
    (3) Obtain the source(s) of their PD;
    (4) Obtain the categories of their PD being collected, received, processed, stored and shared;
    (5) Request correction to their PD due to inaccuracies;
    (6) Request erasure of their PD; and
    (7) Restrict the further collecting, receiving, processing, storing, transmitting, updated and/or sharing of their PD.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    C|P-CMM1 is N/A, since a structured process is required to provide authenticated data subjects the ability to:
    (1) Access their Personal Data (PD) that is being processed, stored and shared, except where the burden, risk or expense of providing access would be disproportionate to the benefit offered to the data subject through granting access;
    (2) Obtain answers on the specifics of how their PD is collected, received, processed, stored, transmitted, shared, updated and/or disposed;
    (3) Obtain the source(s) of their PD;
    (4) Obtain the categories of their PD being collected, received, processed, stored and shared;
    (5) Request correction to their PD due to inaccuracies;
    (6) Request erasure of their PD; and
    (7) Restrict the further collecting, receiving, processing, storing, transmitting, updated and/or sharing of their PD.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Privacy (PRI) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPrivacy management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tThe data privacy program is developed to work with IT and cybersecurity staff to ensure that applicable statutory, regulatory and contractual data privacy obligations for Personal Data (PD) are properly identified and implemented across the enterprise.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls to address applicable statutory, regulatory and contractual requirements for data privacy management.\n•\tA qualified individual is formally assigned as the Chief Privacy Officer (CPO), or similar role, to lead the organization's data privacy program. This individual may be assigned to multiple duties, including that as a Data Protection Officer (DPO).\n•\tThe CPO, or similar role, identifies “data privacy principles” that systems, applications, services, processes and third-parties must adhere to, based on leading data privacy practices.\n•\tAdministrative processes and technologies provide data subjects the ability to access their PD maintained in organizational systems of records."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Privacy (PRI) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Chief Privacy Officer (CPO), or similar function with technical competence to address data privacy concerns, analyzes the organization's business strategy to develop and publish authoritative guidance on the organization's data privacy program.\n•\tA Privacy program, run by a CPO, or similar role, ensures that applicable statutory, regulatory and contractual data privacy obligations are properly identified and implemented to limit and secure Personal Data (PD) that the organization stores, transmits and processes.\n•\tAs part of the organization's data privacy program, the CPO publishes a clear set of “data privacy principles”, based on leading data privacy practices, that systems, applications, services, processes and third-parties must adhere to.\n•\tA Project Management Office (PMO), or project management function, ensures both cybersecurity and data privacy principles are identified and implemented within ongoing or planned projects.\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for cybersecurity-related data privacy practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for cybersecurity-related data privacy practices.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data with regards to data privacy.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program.\n•\tData/process owners operationalize data privacy controls into the processes they control.\n•\tThird-party contracts included data protection requirements, including flow-down requirements to subcontractors.\n•\tData Protection Officers (DPOs) are assigned to work closely with business units and project teams to ensure data privacy principles are being implemented.\n•\tCPO and DPO determine and document the legal authority that permits the collection, use, maintenance and sharing of PD, either generally or in support of a specific program or system need."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Privacy (PRI) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to provide authenticated data subjects the ability to:
    (1) Access their Personal Data (PD) that is being processed, stored and shared, except where the burden, risk or expense of providing access would be disproportionate to the benefit offered to the data subject through granting access;
    (2) Obtain answers on the specifics of how their PD is collected, received, processed, stored, transmitted, shared, updated and/or disposed;
    (3) Obtain the source(s) of their PD;
    (4) Obtain the categories of their PD being collected, received, processed, stored and shared;
    (5) Request correction to their PD due to inaccuracies;
    (6) Request erasure of their PD; and
    (7) Restrict the further collecting, receiving, processing, storing, transmitting, updated and/or sharing of their PD.
  available: false
  value: 5
