id: 477766ee-6b3d-4421-8ac5-f61a31ab52bd
name: Sharing of Event Logs
description: Mechanisms exist to share event logs with third-party organizations based on specific cross-organizational sharing agreements.
elementType: enhancement
externalId: MON-14.1
parent: mon-14
controlQuestion: Does the organization share event logs with third-party organizations based on specific cross-organizational sharing agreements?
functionGrouping: Detect
controlWeighting: '5'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to share event logs with third-party organizations based on specific cross-organizational sharing agreements.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to share event logs with third-party organizations based on specific cross-organizational sharing agreements.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Continuous Monitoring (MON) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tSituational awareness management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tSecure baseline configurations generate logs that contain sufficient information to establish necessary details of activity and allow for forensics analysis.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for situational awareness management.\no\tConfigure alerts for critical or sensitive data that is stored, transmitted and processed on assets.\no\tUse a structured process to review and analyze logs.\n•\tA log aggregator, or similar automated tool, provides an event log report generation capability to aid in detecting and assessing anomalous activities on business-critical systems.\n•\tA formal agreement exists between the organization and applicable third-parties that includes a Non-Disclosure Agreement (NDA) addressing shared sensitive data.\n•\tthe organization sets specific parameters on what type of audit information is permitted to be shared and what cannot be shared with third-parties, even with a NDA in place."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Continuous Monitoring (MON) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function:\no\tGoverns asset management that ensures compliance with requirements for asset management.\no\tLeverages a Configuration Management Database (CMDB), or similar tool, as the authoritative source of IT assets.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool:\no\tCentrally collects logs and is protected according to the manufacturer’s security guidelines to protect the integrity of the event logs with cryptographic mechanisms.\no\tMonitors the organization for Indicators of Compromise (IoC) and provides 24x7x365 near real-time alerting capability.\no\tIs configured to alert incident response personnel of detected suspicious events such that incident responders can look to terminate suspicious events.\n•\tBoth inbound and outbound network traffic is monitored for unauthorized activities to identify prohibited activities and assist incident handlers with identifying potentially compromised systems.\n•\tA formal agreement exists between the organization and applicable third-parties that includes a Non-Disclosure Agreement (NDA) addressing shared sensitive data.\n•\tThe organization sets specific parameters on what type of audit information is permitted to be shared and what cannot be shared with third-parties, even with a NDA in place."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to share event logs with third-party organizations based on specific cross-organizational sharing agreements.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to share event logs with third-party organizations based on specific cross-organizational sharing agreements.
  available: false
  value: 5
