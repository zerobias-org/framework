id: 082314ec-dc58-42eb-91a5-0ccf5431731e
name: Privacy Notice Formatting
description: "Mechanisms exist to reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:\r\n(1) Screen resolution / screen sizes;\r\n(2) Multilingual support; and/or\r\n(3) Disability-specific concessions."
elementType: enhancement
externalId: PRI-02.9
parent: pri-02
controlQuestion: "Does the organization reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:\r\n(1) Screen resolution / screen sizes;\r\n(2) Multilingual support; and/or\r\n(3) Disability-specific concessions?"
functionGrouping: Protect
controlWeighting: '4'
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:
    (1) Screen resolution / screen sizes;
    (2) Multilingual support; and/or
    (3) Disability-specific concessions.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    C|P-CMM1 is N/A, since a structured process is required to reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:
    (1) Screen resolution / screen sizes;
    (2) Multilingual support; and/or
    (3) Disability-specific concessions.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Privacy (PRI) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPrivacy management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tThe data privacy program is developed to work with IT and cybersecurity staff to ensure that applicable statutory, regulatory and contractual data privacy obligations for Personal Data (PD) are properly identified and implemented across the enterprise.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls to address applicable statutory, regulatory and contractual requirements for data privacy management.\n•\tA qualified individual is formally assigned as the Chief Privacy Officer (CPO), or similar role, to lead the organization's data privacy program. This individual may be assigned to multiple duties, including that as a Data Protection Officer (DPO).\n•\tThe CPO, or similar role, identifies “data privacy principles” that systems, applications, services, processes and third-parties must adhere to, based on leading data privacy practices."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Privacy (PRI) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Chief Privacy Officer (CPO), or similar function with technical competence to address data privacy concerns, analyzes the organization's business strategy to develop and publish authoritative guidance on the organization's data privacy program.\n•\tA Privacy program, run by a CPO, or similar role, ensures that applicable statutory, regulatory and contractual data privacy obligations are properly identified and implemented to limit and secure Personal Data (PD) that the organization stores, transmits and processes.\n•\tAs part of the organization's data privacy program, the CPO publishes a clear set of “data privacy principles”, based on leading data privacy practices, that systems, applications, services, processes and third-parties must adhere to.\n•\tA Project Management Office (PMO), or project management function, ensures both cybersecurity and data privacy principles are identified and implemented within ongoing or planned projects.\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for cybersecurity-related data privacy practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for cybersecurity-related data privacy practices.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data with regards to data privacy.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program.\n•\tData/process owners operationalize data privacy controls into the processes they control.\n•\tThird-party contracts included data protection requirements, including flow-down requirements to subcontractors.\n•\tData Protection Officers (DPOs) are assigned to work closely with business units and project teams to ensure data privacy principles are being implemented.\n•\tCPO and DPO determine and document the legal authority that permits the collection, use, maintenance and sharing of PD, either generally or in support of a specific program or system need."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:
    (1) Screen resolution / screen sizes;
    (2) Multilingual support; and/or
    (3) Disability-specific concessions.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to reasonably accommodate data privacy notice formatting for consumers requiring alternative formatting due to accessibility needs through:
    (1) Screen resolution / screen sizes;
    (2) Multilingual support; and/or
    (3) Disability-specific concessions.
  available: false
  value: 5
