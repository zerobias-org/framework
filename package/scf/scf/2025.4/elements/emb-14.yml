id: 76af61c5-4226-4b59-b7c1-20c43d529d96
name: Operating Environment Certification
description: Mechanisms exist to determine if embedded technologies are certified for secure use in the proposed operating environment.
elementType: control
externalId: EMB-14
parent: emb
controlQuestion: Does the organization determine if embedded technologies are certified for secure use in the proposed operating environment?
functionGrouping: Identify
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to determine if embedded technologies are certified for secure use in the proposed operating environment.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to determine if embedded technologies are certified for secure use in the proposed operating environment.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to determine if embedded technologies are certified for secure use in the proposed operating environment.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Embedded Technology (EMB) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes embedded technologies according to the data the asset stores, transmits and/ or processes to ensure that the appropriate technology controls are applied to protect the asset and the data it stores, transmits or processes.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations for embedded technologies are designed, built and maintained for embedded technologies.\n•\tCybersecurity personnel perform annual evaluations of deployed embedded technologies to identify necessary updates to mitigate any newly discovered risks associated with legacy embedded technologies.\n•\tConfigurations for embedded technologies conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tConfiguration management of embedded technologies is centralized for all operating systems, applications, servers and other technologies that are capable of being configured.\n•\tSpecial baseline configurations for embedded technologies are created for higher-risk environments.\n•\tDeviations to baseline configurations for embedded technologies are required to have a risk assessment and the business process owner accepts the risk(s) associated with the deviation.\n•\tUnauthorized configuration changes to embedded technologies are responded to in accordance with an Incident Response Plan (IRP) to determine if the unauthorized configuration is malicious in nature.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of sensitive/regulated data processed, stored or transmitted on embedded technologies, so that cybersecurity and data protection controls are implemented in accordance with applicable statutory, regulatory and contractual obligations.\n•\tEmbedded technologies are certified for use in the proposed operating environment and the safety aspects of the technology formally evaluated using a fault tree analysis, or similar method, to determine possible consequences of misuse, misconfiguration or failure."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to determine if embedded technologies are certified for secure use in the proposed operating environment.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to determine if embedded technologies are certified for secure use in the proposed operating environment.
  available: false
  value: 5
