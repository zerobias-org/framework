id: 9352053d-61a3-48d2-8440-af0b6b4e8f0b
name: Incident Response Operations
description: Mechanisms exist to implement and govern processes and documentation to facilitate an organization-wide response capability for cybersecurity and data protection-related incidents.
elementType: control
externalId: IRO-01
parent: iro
controlQuestion: Does the organization implement and govern processes and documentation to facilitate an organization-wide response capability for cybersecurity and data protection-related incidents?
functionGrouping: Govern
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to implement and govern processes and documentation to facilitate an organization-wide response capability for cybersecurity and data protection-related incidents.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Incident Response (IRO) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to facilitate incident management operations that cover preparation, detection and analysis, containment, eradication and recovery.\n•\tIncident response operations are decentralized."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Incident Response (IRO) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIncident response operations are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for incident response operations.\no\tImplement and maintain an incident response capability using a documented and tested Incident Response Plan (IRP) to facilitate incident management operations that cover preparation, detection and analysis, containment, eradication and recovery.\n•\tIncident responders are proficient on their specific IRP role(s) and responsibilities through recurring training events (e.g., annual rock drill).\n•\tIT personnel support incident response operations by provisioning and deprovisioning incident responders with temporary emergency accounts.\n•\tIT/cybersecurity personnel update the IRP, based on lessons learned from incidents / exercises."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Incident Response (IRO) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for Incident Response (IR) practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise with regards to incident response.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data for incident response.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data protection program, including IR.\n•\tAn Integrated Security Incident Response Team (ISIRT), or similar function:\no\tExists to form an on-demand, scalable and integrated team of formally-assigned cybersecurity, IT, data protection and business function representatives that can perform coordinated incident response.\no\tDevelops and maintains a documented, program-level Integrated Incident Response Program (IIRP) that provides operational and tactical-level guidance for cybersecurity and data protection response operations.\n•\tA Security Operations Center (SOC), or similar function, facilitates incident management operations that includes preparation, detection and analysis, containment, eradication and recovery.\n•\tBusiness Process Owners (BPOs), in conjunction with the SOC and ISIRT functions, develop and maintain a documented Incident Response Plan (IRP) specific to the business process / business unit but inclusive of the organization's larger approach to incident response operations.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and provides that information to the SOC for Incident Response Operations (IRO)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to implement and govern processes and documentation to facilitate an organization-wide response capability for cybersecurity and data protection-related incidents.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to implement and govern processes and documentation to facilitate an organization-wide response capability for cybersecurity and data protection-related incidents.
  available: false
  value: 5
