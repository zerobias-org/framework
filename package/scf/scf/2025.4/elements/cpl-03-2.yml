id: 0fe52349-41e9-457e-b62c-62c482eb9ded
name: Functional Review Of Cybersecurity & Data Protection Controls
description: Mechanisms exist to regularly review Technology Assets, Applications and/or Services (TAAS) for adherence to the organization's cybersecurity and data protection policies and standards.
elementType: enhancement
externalId: CPL-03.2
parent: cpl-03
controlQuestion: Does the organization regularly review Technology Assets, Applications and/or Services (TAAS) for adherence to its cybersecurity and data protection policies and standards?
functionGrouping: Detect
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to regularly review Technology Assets, Applications and/or Services (TAAS) for adherence to its cybersecurity and data protection policies and standards.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Compliance (CPL) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to govern statutory, regulatory and contractual compliance obligations.\n•\tIT personnel self-identify a set of controls that are used to conduct cybersecurity and data privacy control assessments.\n•\tIT personnel perform internal assessments of cybersecurity and data protection controls to determine compliance status."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Compliance (CPL) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCompliance activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for compliance activities.\n•\tCybersecurity personnel use a defined set of controls to conduct cybersecurity and data privacy control assessments, as defined by the applicable statutory, regulatory and contractual requirements.\n•\tCybersecurity personnel either use an impartial member of its team or a third-party assessor to perform an independent assessment of cybersecurity and data protection controls."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Compliance (CPL) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to ensure compliance requirements are identified and documented.\n•\tThe GRC function, or similar function:\no\tEnsures data/process owners understand their requirements to manage applicable cybersecurity and data protection controls through oversight and written guidance.\no\tProvides applicable stakeholders with status reports on control execution to enable security controls oversight.\no\tWorks with data/process owners and asset custodians to document and validate the scope of cybersecurity and data protection controls to ensure statutory, regulatory and/ or contractual compliance obligations are met.\no\tConducts cybersecurity and data privacy control assessments, on a regular cadence that is defined by the applicable statutory, regulatory and contractual requirements.\n•\tCybersecurity and data privacy controls are centrally managed through a technology solution (e.g., GRC solution) to assign controls, track control activities and report on compliance efforts.\n•\tCybersecurity personnel either use an impartial member of its team or a third-party assessor to perform an independent assessment of cybersecurity and data protection controls.\n•\tUp on completing an assessment, the GRC function generates a formal report that documents the assessment of cybersecurity and data protection controls to determine the effectiveness of controls and their ability to meet regulatory and company standards requirements."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Compliance (CPL) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to regularly review Technology Assets, Applications and/or Services (TAAS) for adherence to its cybersecurity and data protection policies and standards.
  available: false
  value: 5
