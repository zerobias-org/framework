id: c67ce0ac-2126-4d61-966e-897cb4795fd2
name: Automated Records Management & Review
description: Automated mechanisms exist to facilitate the maintenance and review of visitor access records.
elementType: enhancement
externalId: PES-06.4
parent: pes-06
controlQuestion: Does the organization use automated mechanisms to facilitate the maintenance and review of visitor access records?
functionGrouping: Protect
controlWeighting: '5'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the maintenance and review of visit or access records.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to facilitate the maintenance and review of visit or access records.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to facilitate the maintenance and review of visit or access records.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Physical & Environmental Security (PES) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA physical security team, or similar function:\no\tPerforms the centralized-management of physical security controls across the enterprise.\no\tMaintains a current list of personnel with authorized access to organizational facilities and implements physical access management controls.\n•\tA facilities maintenance team, or similar function, manages the operation of environmental protection controls.\n•\tAdministrative processes exist to authorize physical access to facilities based on the position or role of the individual.\n•\tAdministrative processes and physical controls restrict unescorted access to facilities to personnel with required security clearances, formal access authorizations and validated the need for access."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to facilitate the maintenance and review of visit or access records.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to facilitate the maintenance and review of visit or access records.
  available: false
  value: 5
