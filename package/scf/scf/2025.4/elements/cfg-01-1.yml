id: 1ae3a6ea-2037-480e-91d6-1889d7d25d0b
name: Assignment of Responsibility
description: Mechanisms exist to implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties.
elementType: enhancement
externalId: CFG-01.1
parent: cfg-01
controlQuestion: Does the organization implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties?
functionGrouping: Identify
controlWeighting: '5'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Configuration Management (CFG) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tConfiguration management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for configuration management.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and mostly conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including cryptographic protections for sensitive/regulated data.\n•\tSpecial baseline configurations are created for higher-risk environments or for systems, applications and services that store, process or transmit sensitive/regulated data.\n•\tApart from workstation and server operating system baselines, configuration management is decentralized.\n•\tCybersecurity personnel use a structured process to design, build and maintain secure configurations for test, development, staging and production environments.\n•\tDeviations to baseline configurations are required to have a risk assessment and the business process owner acceptance of the risk(s) associated with the deviation.\n•\tUnauthorized configuration changes are investigated to determine if the unauthorized configuration is malicious in nature.\n•\tLogical Access Control (LAC) is enforced to prohibit non-administrative users from being able to install unauthorized software.\n•\tThe Human Resources (HR) department ensures industry-recognized HR practices are implemented for hiring, managing, training, investigating and terminating employees, contractors and other personnel that work on behalf of the organization.\n•\tHR defines terms of employment, including acceptable and unacceptable rules of behavior for the use of technologies, including consequences for unacceptable behavior."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Configuration Management (CFG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe configuration management function is formally assigned with defined roles and responsibilities.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tConfiguration management is centralized for all operating systems, applications, servers and other configurable technologies.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including test, development, staging and production environments.\n•\tConfigurations conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tDeviations to baseline configurations are required to have a risk assessment and business process owner approval of the risk(s) associated with the deviation.\n•\tSpecial baseline configurations are created for higher-risk environments or for systems, applications and services that store, process or transmit sensitive/regulated data.\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tLogical Access Control (LAC) is used to limit the ability of non-administrators from making configuration changes to systems, applications and services, including the of installation of unauthorized software.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool, monitors for unauthorized activities, accounts, connections, devices and software.\n•\tUnauthorized configuration changes are responded to in accordance with an Incident Response Plan (IRP) to determine if the unauthorized configuration is malicious in nature.\n•\tThe Human Resources (HR) department ensures industry-recognized HR practices are implemented for hiring, managing, training, investigating and terminating employees, contractors and other personnel that work on behalf of the organization.\n•\tHR defines terms of employment, including acceptable and unacceptable rules of behavior for the use of technologies, including consequences for unacceptable behavior."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to implement a segregation of duties for configuration management that prevents developers from performing production configuration management duties.
  available: false
  value: 5
