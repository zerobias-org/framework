id: 7e4f4c0b-1c3c-4a6e-88c3-d4846e43e6eb
name: Application Programming Interface (API) Security
description: Mechanisms exist to ensure support for secure interoperability between components with Application Programming Interfaces (APIs).
elementType: control
externalId: CLD-04
parent: cld
controlQuestion: Does the organization ensure support for secure interoperability between components with Application Programming Interfaces (APIs)?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to ensure support for secure interoperability between components with Application Programming Interfaces (APIs).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to ensure support for secure interoperability between components with Application Programming Interfaces (APIs).
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cloud Security (CLD) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCloud security management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cloud security management.\no\tUse an informal process to govern cloud-specific cybersecurity and data privacy-specific tools.\n•\tA Shared Responsibility Matrix (SRM), or similar Customer Responsibility Matrix (CRM), is documented for each Cloud Service Providers (CSPs) instance that takes into account differences between Software as a Service (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) methodologies.\n•\tIT personnel have a documented architecture for cloud-based technologies to support cybersecurity and data protection requirements.\n•\tCybersecurity and data privacy requirements are identified and documented for cloud-specific sensitive/regulated data processing, storing and/ or transmitting, including restrictions on data processing and storage locations.\nCloud requirements for interoperability between components (APIs) are identified and documented."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cloud Security (CLD) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tRoles and associated responsibilities for governing cloud instances, including provisioning, maintaining and deprovisioning, are formally assigned.\n•\tA Shared Responsibility Matrix (SRM), or similar Customer Responsibility Matrix (CRM), is documented for each Cloud Service Providers (CSPs) instance that takes into account differences between Software as a Service (SaaS), Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) methodologies.\n•\tIT architects, in conjunction with cybersecurity architects:\no\tEnsure the cloud security architecture supports the organization's technology strategy to securely design, configure and maintain cloud employments.\no\tEnsure multi-tenant CSP assets (physical and virtual) are designed and governed such that provider and customer (tenant) user access is appropriately segmented from other tenant users.\no\tEnsure CSPs use secure protocols for the import, export and management of data in cloud-based services.\no\tImplement a dedicated subnet to host security-specific technologies on all cloud instances, where technically feasible.\n•\tA Change Advisory Board (CAB), or similar function:\no\tGoverns changes to cloud-based systems, applications and services to ensure their stability, reliability and predictability.\no\tReviews processes to identify and prevent use of unapproved CSPs.\n•\tA dedicated IT infrastructure team, or similar function, enables the implementation of cloud management controls to ensure cloud instances are both secure and compliant, leveraging industry-recognized secure practices that are CC|P-specific.\n•\tCybersecurity and data privacy requirements are identified and documented for each CSP instance to address sensitive/regulated data processing, storing and/ or transmitting and provide restrictions on data processing and storage locations.\n•\tA Data Protection Impact Assessment (DPIA) is used to help ensure the protection of sensitive/regulated data processed, stored or transmitted on external systems.\nCloud requirements for interoperability between components (APIs) are identified and documented."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to ensure support for secure interoperability between components with Application Programming Interfaces (APIs).
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to ensure support for secure interoperability between components with Application Programming Interfaces (APIs).
  available: false
  value: 5
