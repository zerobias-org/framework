id: 4d61b565-8c1a-4599-a31f-31ed68708fcd
name: Maintaining Workforce Development Relevancy
description: "Mechanisms exist to periodically review security workforce development and awareness training to account for changes to:\r\n(1) Organizational policies, standards and procedures;\r\n(2) Assigned roles and responsibilities;\r\n(3) Relevant threats and risks; and\r\n(4) Technological developments."
elementType: enhancement
externalId: SAT-01.1
parent: sat-01
controlQuestion: "Does the organization periodically review security workforce development and awareness training to account for changes to:\r\n(1) Organizational policies, standards and procedures;\r\n(2) Assigned roles and responsibilities;\r\n(3) Relevant threats and risks; and\r\n(4) Technological developments?"
functionGrouping: Identify
controlWeighting: '6'
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to periodically review security workforce development and awareness training to account for changes to:
    (1) Organizational policies, standards and procedures;
    (2) Assigned roles and responsibilities;
    (3) Relevant threats and risks; and
    (4) Technological developments.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    C|P-CMM1 is N/A, since a structured process is required to periodically review security workforce development and awareness training to account for changes to:
    (1) Organizational policies, standards and procedures;
    (2) Assigned roles and responsibilities;
    (3) Relevant threats and risks; and
    (4) Technological developments.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Security Awareness & Training (SAT) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tTraining and awareness activities are decentralized (e.g., a localized/regionalized function) and use non-standardized methods to implement secure, resilient and compliant practices.\n•\tThe Human Resources (HR) department works with cybersecurity personnel to facilitate workforce development and awareness to help ensure secure practices are implemented.\n•\tSecurity awareness and training methods are role-based (e.g., handling sensitive/regulated data).\n•\tIT/cybersecurity personnel:\no\tIdentify cybersecurity and data protection controls to address applicable statutory, regulatory and contractual requirements for security training and awareness activities.\no\tCreate/govern security and awareness training to meet specific statutory, regulatory and/ or contractual compliance obligations.\no\tSelf-manage their professional certification requirements to support their assigned duties."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Security Awareness & Training (SAT) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for security awareness and training practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for security awareness and training.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function:\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data with regards to security awareness and training.\no\tDefines minimum cybersecurity training (including certifications) for personnel, based on their specific roles.\no\tCreates/governs security and awareness training to meet specific statutory, regulatory and/ or contractual compliance obligations.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program, including security awareness and training.\n•\tSecurity awareness and training methods are role-based (e.g., handling sensitive/regulated data).\n•\tThe Human Resources (HR) department:\no\tIdentifies and implements industry-recognized HR practices related to security workforce development and awareness to help ensure secure practices are implemented in personnel management operations.\no\tDocuments, retains and monitors individual training activities, including basic security awareness training, ongoing awareness training and specific-system training.\no\tEnsures that every user accessing a system processing, storing or transmitting sensitive/regulated data is formally trained in data handling requirements.\no\tEnsures all employees and contractors receive awareness education and training that is relevant for their job function, including social engineering-related threats."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: |-
    See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to periodically review security workforce development and awareness training to account for changes to:
    (1) Organizational policies, standards and procedures;
    (2) Assigned roles and responsibilities;
    (3) Relevant threats and risks; and
    (4) Technological developments.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to periodically review security workforce development and awareness training to account for changes to:
    (1) Organizational policies, standards and procedures;
    (2) Assigned roles and responsibilities;
    (3) Relevant threats and risks; and
    (4) Technological developments.
  available: false
  value: 5
