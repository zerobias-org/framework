id: e6cfdbd4-3331-48c9-ab36-9da585a095c9
name: Instances Requiring A Risk Assessment
description: Mechanisms exist to define instances that require a risk assessment to be performed.
elementType: enhancement
externalId: RSK-04.3
parent: rsk-04
controlQuestion: Does the organization define instances that require a risk assessment to be performed?
functionGrouping: Identify
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to define instances that require a risk assessment to be performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to define instances that require a risk assessment to be performed.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to define instances that require a risk assessment to be performed.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Risk Management efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA formal Risk Management Program (RMP) provides enterprise-wide guidance on how risk is to be identified, framed (e.g., risk appetite, risk tolerance, risk thresholds, etc.) assessed, mitigated/remediated and reported.\n•\tCriteria to define materiality for risk management decisions is defined.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program, including appropriately resourcing risk management operations.\n•\tA formally-documented Cybersecurity Supply Chain Risk Management (C-SCRM) plan exists to identify, assess and mitigate supply chain-related risks and threats;\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns,\no\tAnalyzes the organization's business strategy to determine prioritized and authoritative guidance for Risk Management (RM) practices.\no\tDevelops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for RM.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function:\no\tProvides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data with regards to RM.\no\tMaintains a common taxonomy of risk-relevant terminology to minimize assumptions and misunderstandings.\no\tEnables data/process owners to conduct annual risk assessment of their operations that includes the likelihood and magnitude of harm, from unauthorized access, use, disclosure, disruption, modification or destruction of the organization's systems and data.\no\tAssists users in making informed risk decisions to ensure data and processes are appropriately protected.\no\tEnables the documentation of risk assessments, risk response and risk monitoring to support statutory, regulatory and contractual obligations for risk management practices.\no\tMaintains a centralized risk register to reflect an active recording and disposition of identified risks. The risk register identifies and assigns a risk ranking to vulnerabilities and risks that is based on industry-recognized practices and facilitates monitoring and reporting of those risks.\no\tGoverns supply chain risks associated with the development, acquisition, maintenance and disposal of systems, system components and services.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes assets according to the data the asset stores, transmits and/ or processes, applying the appropriate technology controls to protect the asset and data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to define instances that require a risk assessment to be performed.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to define instances that require a risk assessment to be performed.
  available: false
  value: 5
