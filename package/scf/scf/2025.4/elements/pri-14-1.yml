id: add8303b-25bc-40af-8b4d-bc3f2c1159b1
name: Accounting of Disclosures
description: "Mechanisms exist to provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:\r\n(1) The organization; and/or\r\n(2) Relevant third-parties that their PD was shared with."
elementType: enhancement
externalId: PRI-14.1
parent: pri-14
controlQuestion: "Does the organization provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:\r\n(1) The organization; and/or\r\n(2) Relevant third-parties that their PD was shared with?"
functionGrouping: Identify
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:
    (1) The organization; and/or
    (2) Relevant third-parties that their PD was shared with.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: |-
    C|P-CMM1 is N/A, since a structured process is required to provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:
    (1) The organization; and/or
    (2) Relevant third-parties that their PD was shared with.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: |-
    C|P-CMM2 is N/A, since a well-defined process is required to provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:
    (1) The organization; and/or
    (2) Relevant third-parties that their PD was shared with.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Privacy (PRI) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Chief Privacy Officer (CPO), or similar function with technical competence to address data privacy concerns, analyzes the organization's business strategy to develop and publish authoritative guidance on the organization's data privacy program.\n•\tA Privacy program, run by a CPO, or similar role, ensures that applicable statutory, regulatory and contractual data privacy obligations are properly identified and implemented to limit and secure Personal Data (PD) that the organization stores, transmits and processes.\n•\tAs part of the organization's data privacy program, the CPO publishes a clear set of “data privacy principles”, based on leading data privacy practices, that systems, applications, services, processes and third-parties must adhere to.\n•\tA Project Management Office (PMO), or project management function, ensures both cybersecurity and data privacy principles are identified and implemented within ongoing or planned projects.\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for cybersecurity-related data privacy practices.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures to apply defense-in-depth techniques across the enterprise for cybersecurity-related data privacy practices.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data with regards to data privacy.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program.\n•\tData/process owners operationalize data privacy controls into the processes they control.\n•\tThird-party contracts included data protection requirements, including flow-down requirements to subcontractors.\n•\tData Protection Officers (DPOs) are assigned to work closely with business units and project teams to ensure data privacy principles are being implemented.\n•\tCPO and DPO determine and document the legal authority that permits the collection, use, maintenance and sharing of PD, either generally or in support of a specific program or system need."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Privacy (PRI) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: |-
    See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to provide data subjects with an accounting of disclosures of their Personal Data (PD) controlled by:
    (1) The organization; and/or
    (2) Relevant third-parties that their PD was shared with.
  available: false
  value: 5
