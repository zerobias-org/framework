id: aeb54b66-e962-4170-8a3d-e12352515d32
name: Sharing Identification & Authentication Information
description: Mechanisms exist to ensure external service providers provide current and accurate information for any third-party user with access to the organization's data or assets.
elementType: enhancement
externalId: IAC-05.1
parent: iac-05
controlQuestion: Does the organization ensure external service providers provide current and accurate information for any third-party user with access to its data or assets?
functionGrouping: Protect
controlWeighting: '5'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to ensure external service providers provide current and accurate information for any third-party user with access to its data or assets.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to ensure external service providers provide current and accurate information for any third-party user with access to its data or assets.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to ensure external service providers provide current and accurate information for any third-party user with access to its data or assets.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Identification & Authentication (IAC) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\n•\tThe Human Resources (HR) department governs personnel management operations and notifies IAM personnel of personnel role changes for RBAC-based provisioning and deprovisioning actions.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tActive Directory (AD), or a similar technology, is used to centrally manage identities and permissions. Only by exception due to a technical or business limitation are solutions authorized to operate a decentralized access control program for systems, applications and services."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Identification & Authentication (IAC) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: "Identification & Authentication (IAC) efforts are “world-class” capabilities that leverage predictive analysis (e.g., machine learning, AI, etc.). In addition to CMM Level 4 criteria, CMM Level 5 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tStakeholders make time-sensitive decisions to support operational efficiency, which may include automated remediation actions.\n•\tBased on predictive analysis, process improvements are implemented according to “continuous improvement” practices that affect process changes."
  available: true
  value: 5
