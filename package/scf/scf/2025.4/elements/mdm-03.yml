id: 3cfcace9-9701-4f83-bb7c-ad7780e5a636
name: Full Device & Container-Based Encryption
description: Cryptographic mechanisms exist to protect the confidentiality and integrity of information on mobile devices through full-device or container encryption.
elementType: control
externalId: MDM-03
parent: mdm
controlQuestion: Are cryptographic mechanisms utilized to protect the confidentiality and integrity of information on mobile devices through full-device or container encryption?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to Cryptographic protect the confidentiality and integrity of information on mobile devices through full-device or container encryption.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to Cryptographic protect the confidentiality and integrity of information on mobile devices through full-device or container encryption.
  available: false
