id: a1fe0d22-5c08-4fcf-a809-e74fc589252b
name: Asymmetric Keys
description: Mechanisms exist to facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key.
elementType: enhancement
externalId: CRY-09.2
parent: cry-09
controlQuestion: Does the organization facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Cryptographic Protections (CRY) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCryptographic management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for cryptographic management.\n•\tData classification and handling criteria govern requirements to encrypt sensitive/regulated data during transmission and in storage.\n•\tDecentralized technologies implement cryptographic mechanisms on endpoints to control how sensitive/regulated data is encrypted during transmission and in storage.\n•\tSystems, applications and services that store, process or transmit sensitive/regulated data use cryptographic mechanisms to prevent unauthorized disclosure of information as an alternate to physical safeguards.\n•\tThe IT department implements Public Key Infrastructure (PKI) key management controls to protect the confidentiality, integrity and availability of keys.\n•\tThe IT department implements and maintains an internal PKI infrastructure or obtains PKI services from a reputable PKI service provider.\n•\tThe PKI infrastructure enables the secure distribution of symmetric and asymmetric cryptographic keys using industry recognized key management technology and processes.\n•\tThe PKI infrastructure ensures the availability of information in the event of the loss of cryptographic keys by individual users.\n•\tThe PKI infrastructure enables the secure distribution of symmetric and asymmetric cryptographic keys using industry recognized key management technology and processes.\n•\tThe PKI management function enables the implementation of cryptographic key management controls to protect the confidentiality, integrity and availability of keys."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Cryptographic Protections (CRY) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Chief Information Security Officer (CISO), or similar function with technical competence to address cybersecurity concerns, analyzes the organization's business strategy to determine prioritized and authoritative guidance for cryptographic protections.\n•\tThe CISO, or similar function, develops a security-focused Concept of Operations (CONOPS) that documents management, operational and technical measures for cryptographic protections.\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to protect the confidentiality, integrity, availability and safety of the organization's applications, systems, services and data using cryptographic protections.\n•\tA steering committee is formally established to provide executive oversight of the cybersecurity and data privacy program, including cryptographic protections.\n•\tData classification and handling criteria govern requirements to encrypt sensitive/regulated data during transmission and in storage.\n•\tCentrally-managed technologies implement cryptographic mechanisms on endpoints to control how sensitive/regulated data is encrypted during transmission and in storage.\n•\tCertificate management is centrally-managed and the use of certificates is monitored.\n•\tCryptographic keys are proactively managed to protect the Confidentiality, Integrity and Availability (CIA) of cryptographic capabilities.\n•\tSystems, applications and services that store, process or transmit sensitive/regulated data use cryptographic mechanisms to prevent unauthorized disclosure of information as an alternate to physical safeguards.\n•\tAn IT infrastructure team, or similar function:\no\tImplements Public Key Infrastructure (PKI) key management controls to protect the confidentiality, integrity and availability of keys.\no\tImplements and maintains an internal PKI infrastructure or obtains PKI services from a reputable PKI service provider.\n•\tIT/cybersecurity personnel perform an annual review of deployed cryptographic cipher suites and protocols to identify and replace weak cryptographic cipher suites and protocols."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to facilitate the production and management of asymmetric cryptographic keys using Federal Information Processing Standards (FIPS)-compliant key management technology and processes that protect the user’s private key.
  available: false
  value: 5
