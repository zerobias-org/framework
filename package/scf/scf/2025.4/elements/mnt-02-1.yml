id: 15d8c923-c385-4013-940e-570a777e7c92
name: Automated Maintenance Activities
description: Automated mechanisms exist to schedule, conduct and document maintenance and repairs.
elementType: enhancement
externalId: MNT-02.1
parent: mnt-02
controlQuestion: Does the organization use automated mechanisms to schedule, conduct and document maintenance and repairs?
functionGrouping: Protect
controlWeighting: '5'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to schedule, conduct and document maintenance and repairs.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to schedule, conduct and document maintenance and repairs.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to schedule, conduct and document maintenance and repairs.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Maintenance (MNT) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT/cybersecurity personnel develop and disseminate formal practices to implement enterprise-wide capability to conduct secure and timely technology asset-specific maintenance operations, including preventative and reactionary maintenance operations.\n•\tTechnology asset-related maintenance operations are centralized in terms of change management and governance. Local/regional practices fall under the broader enterprise-wide technology asset maintenance program.\n•\tFacilities management uses an enterprise-wide process to facilitate the secure and timely implementation of non-IT maintenance operations, including preventative and reactionary maintenance operations. Local/regional practices fall under the broader enterprise-wide facilities management program.\n•\tA Change Control Board (CCB), or similar function, centrally manages the process of IT and non-IT maintenance operations to reduce the chance of business interruptions from maintenance operations.\n•\tMaintenance controls are primarily administrative in nature (e.g., policies & standards) to manage change control processes associated with maintenance operations, but are assisted by technology-based tools to report on maintenance status (e.g., missing patches, outdated software versions, etc.)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to schedule, conduct and document maintenance and repairs.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to schedule, conduct and document maintenance and repairs.
  available: false
  value: 5
