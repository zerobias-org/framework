id: 1f873b20-0349-4921-b6fa-094caa4f6635
name: Publicly Accessible Content Reviews
description: Mechanisms exist to routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered.
elementType: control
externalId: WEB-14
parent: web
controlQuestion: Does the organization routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered?
functionGrouping: Identify
controlWeighting: '7'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Web Security (WEB) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Validated Architecture Design Review (VADR) evaluates Internet-facing design criteria for secure practices and conformance with requirements for applicable statutory, regulatory and contractual controls to determine if the system/application/service is designed, built and operated in a secure and resilient manner.\n•\tA change notification capability exists to scan web pages for changes, which are reviewed by appropriate personnel to determine if changes are authorized or unauthorized.\n•\tOngoing content reviews are performed to ensure web pages do not contain non-public information.\n•\tSecurity engineering, or a similar function, ensures that Internet-facing devices conform to industry-recognized standards for configuration hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments. This includes creating special hardening requirements for High-Value Assets (HVAs).\n•\tAn Identity & Access Management (IAM) function, or similar function, enables the implementation of identification and access management controls for Internet-facing technologies.\n•\tTechnologies are configured to implement Strong Customer Authentication (SCA) for consumers to prove their identity.\n•\tAdministrative processes exist and technologies are configured to provide Internet-facing individuals (e.g., customers, users, clients, etc.) with clear and precise information about cookies, in accordance with regulatory requirements for cookie management.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes network devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tBoundary protections:\no\tUtilize Web Application Firewalls (WAFs) to provide defense-in-depth protection for application-specific threats.\no\tRestrict inbound traffic to authorized devices on certain services, protocols and ports."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Web Security (WEB) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to routinely review the content on publicly accessible systems for sensitive/regulated data and remove such information, if discovered.
  available: false
  value: 5
