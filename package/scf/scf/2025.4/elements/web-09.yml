id: e213a08b-f291-40f3-9807-1a1c1346f9dd
name: Validation & Sanitization
description: Mechanisms exist to ensure all input handled by a web application is validated and/or sanitized.
elementType: control
externalId: WEB-09
parent: web
controlQuestion: Does the organization ensure all input handled by a web application is validated and/or sanitized?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to ensure all input handled by a web application is validated and/ or sanitized.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to ensure all input handled by a web application is validated and/ or sanitized.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to ensure all input handled by a web application is validated and/ or sanitized.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Web Security (WEB) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Validated Architecture Design Review (VADR) evaluates Internet-facing design criteria for secure practices and conformance with requirements for applicable statutory, regulatory and contractual controls to determine if the system/application/service is designed, built and operated in a secure and resilient manner.\n•\tA change notification capability exists to scan web pages for changes, which are reviewed by appropriate personnel to determine if changes are authorized or unauthorized.\n•\tOngoing content reviews are performed to ensure web pages do not contain non-public information.\n•\tSecurity engineering, or a similar function, ensures that Internet-facing devices conform to industry-recognized standards for configuration hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments. This includes creating special hardening requirements for High-Value Assets (HVAs).\n•\tAn Identity & Access Management (IAM) function, or similar function, enables the implementation of identification and access management controls for Internet-facing technologies.\n•\tTechnologies are configured to implement Strong Customer Authentication (SCA) for consumers to prove their identity.\n•\tAdministrative processes exist and technologies are configured to provide Internet-facing individuals (e.g., customers, users, clients, etc.) with clear and precise information about cookies, in accordance with regulatory requirements for cookie management.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes network devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data.\n•\tBoundary protections:\no\tUtilize Web Application Firewalls (WAFs) to provide defense-in-depth protection for application-specific threats.\no\tRestrict inbound traffic to authorized devices on certain services, protocols and ports."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to ensure all input handled by a web application is validated and/ or sanitized.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to ensure all input handled by a web application is validated and/ or sanitized.
  available: false
  value: 5
