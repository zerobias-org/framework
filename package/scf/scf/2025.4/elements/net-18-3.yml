id: 1a564b86-a52e-420c-8fcb-98b21cf4baf6
name: Route Privileged Network Access
description: Automated mechanisms exist to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
elementType: enhancement
externalId: NET-18.3
parent: net-18
controlQuestion: Does the organization use automated mechanisms to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing?
functionGrouping: Detect
controlWeighting: '1'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Network Security (NET) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Technology Infrastructure team, or similar function, defines centrally-managed network security controls for implementation across the enterprise.\n•\tSecure engineering principles are used to design and implement network security controls (e.g., industry-recognized secure practices) to enforce the concepts of least privilege and least functionality at the network level.\n•\tIT/cybersecurity architects work with the Technology Infrastructure team to implement a “layered defense” network architecture that provides a defense-in-depth approach for redundancy and risk reduction for network-based security controls, including wired and wireless networking.\n•\tAdministrative processes and technologies configure boundary devices (e.g., firewalls, routers, etc.) to deny network traffic by default and allow network traffic by exception (e.g., deny all, permit by exception).\n•\tTechnologies automate the Access Control Lists (ACLs) and similar rulesets review process to identify security issues and/ or misconfigurations.\n•\tNetwork segmentation exists to implement separate network addresses (e.g., different subnets) to connect systems in different security domains (e.g., sensitive/regulated data environments)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to route networked, privileged accesses through a dedicated, managed interface for purposes of access control and auditing.
  available: false
  value: 5
