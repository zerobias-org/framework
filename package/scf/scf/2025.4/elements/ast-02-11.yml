id: d97ad0f8-939f-4020-85fc-dac85f06685f
name: Component Assignment
description: Mechanisms exist to bind components to a specific system.
elementType: enhancement
externalId: AST-02.11
parent: ast-02
controlQuestion: Does the organization bind components to a specific system?
functionGrouping: Identify
controlWeighting: '3'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to bind components to a specific system.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to bind components to a specific system.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to bind components to a specific system.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Asset Management (AST) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn IT Asset Management (ITAM) function, or similar function, governs asset management to help ensure compliance with requirements for asset management.\n•\tAn ITAM function, or similar function, maintains an inventory of IT assets, covering both physical and virtual assets, as well as centrally managed asset ownership assignments.\n•\tTechnology assets and data are categorized according to data classification and business criticality criteria.\n•\tA Cybersecurity Supply Chain Risk Management (C-SCRM) function oversees supply chain risks including the removal and prevention of certain technology services and/ or equipment designated as supply chain threats by a statutory or regulatory body.\n•\tData/process owners document where sensitive/regulated data is stored, transmitted and processed, generating Data Flow Diagrams (DFDs) and network diagrams to document the flow of data."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to bind components to a specific system.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to bind components to a specific system.
  available: false
  value: 5
