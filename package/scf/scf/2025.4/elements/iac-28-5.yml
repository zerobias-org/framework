id: fd57b661-ec13-43d7-b39a-4ecaf365068a
name: Address Confirmation
description: Mechanisms exist to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
elementType: enhancement
externalId: IAC-28.5
parent: iac-28
controlQuestion: Does the organization require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital)?
functionGrouping: Protect
controlWeighting: '1'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Identification & Authentication (IAC) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\n•\tThe Human Resources (HR) department governs personnel management operations and notifies IAM personnel of personnel role changes for RBAC-based provisioning and deprovisioning actions.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tActive Directory (AD), or a similar technology, is used to centrally manage identities and permissions. Only by exception due to a technical or business limitation are solutions authorized to operate a decentralized access control program for systems, applications and services.\n•\tAdministrative processes exist to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to require that a notice of proofing be delivered through an out-of-band channel to verify the user's address (physical or digital).
  available: false
  value: 5
