id: a9615b55-71cc-4507-94cf-bc0a798508fb
name: Reviews & Updates
description: "Mechanisms exist to review and update baseline configurations:\r\n(1) At least annually;\r\n(2) When required due to so; or\r\n(3) As part of system component installations and upgrades."
elementType: enhancement
externalId: CFG-02.1
parent: cfg-02
controlQuestion: "Does the organization review and update baseline configurations:\r\n (1) At least annually;\r\n (2) When required due to so; or\r\n (3) As part of system component installations and upgrades?"
functionGrouping: Detect
controlWeighting: '8'
cmm_0:
  name: Not Performed
  description: |-
    There is no evidence of a capability to review and update baseline configurations:
    (1) At least annually;
    (2) When required due to so; or
    (3) As part of system component installations and upgrades.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Configuration Management (CFG) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to design, build and maintain secure configurations for test, development, staging and production environments.\n•\tSecure configurations are not:\no\tStandardized across the organization.\no\tConsistently aligned with industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tConfigurations are reviewed only when new operating systems or versions of applications are released."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Configuration Management (CFG) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tConfiguration management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for configuration management.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and mostly conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including cryptographic protections for sensitive/regulated data.\n•\tSpecial baseline configurations are created for higher-risk environments or for systems, applications and services that store, process or transmit sensitive/regulated data.\n•\tApart from workstation and server operating system baselines, configuration management is decentralized.\n•\tCybersecurity personnel use a structured process to design, build and maintain secure configurations for test, development, staging and production environments.\n•\tDeviations to baseline configurations are required to have a risk assessment and the business process owner acceptance of the risk(s) associated with the deviation.\n•\tUnauthorized configuration changes are investigated to determine if the unauthorized configuration is malicious in nature.\n•\tLogical Access Control (LAC) is enforced to prohibit non-administrative users from being able to install unauthorized software."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Configuration Management (CFG) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe configuration management function is formally assigned with defined roles and responsibilities.\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tConfiguration management is centralized for all operating systems, applications, servers and other configurable technologies.\n•\tTechnologies are configured to protect data with the strength and integrity commensurate with the classification or sensitivity of the information and conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides), including test, development, staging and production environments.\n•\tConfigurations conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides) for test, development, staging and production environments.\n•\tDeviations to baseline configurations are required to have a risk assessment and business process owner approval of the risk(s) associated with the deviation.\n•\tSpecial baseline configurations are created for higher-risk environments or for systems, applications and services that store, process or transmit sensitive/regulated data.\n•\tAn IT Asset Management (ITAM) function, or similar function, ensures compliance with requirements for asset management.\n•\tLogical Access Control (LAC) is used to limit the ability of non-administrators from making configuration changes to systems, applications and services, including the of installation of unauthorized software.\n•\tA Security Incident Event Manager (SIEM), or similar automated tool, monitors for unauthorized activities, accounts, connections, devices and software.\n•\tUnauthorized configuration changes are responded to in accordance with an Incident Response Plan (IRP) to determine if the unauthorized configuration is malicious in nature."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Configuration Management (CFG) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: "Configuration Management (CFG) efforts are “world-class” capabilities that leverage predictive analysis (e.g., machine learning, AI, etc.). In addition to CMM Level 4 criteria, CMM Level 5 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tStakeholders make time-sensitive decisions to support operational efficiency, which may include automated remediation actions.\n•\tBased on predictive analysis, process improvements are implemented according to “continuous improvement” practices that affect process changes."
  available: true
  value: 5
