id: de2076c0-c10a-4da4-a57c-2cc3df8329ac
name: Terms of Employment
description: Mechanisms exist to require all employees and contractors to apply cybersecurity and data protection principles in their daily work.
elementType: control
externalId: HRS-05
parent: hrs
controlQuestion: Does the organization require all employees and contractors to apply cybersecurity and data protection principles in their daily work?
functionGrouping: Identify
controlWeighting: '10'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to require all employees and contractors to apply cybersecurity and data protection principles in their daily work.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to require all employees and contractors to apply cybersecurity and data protection principles in their daily work.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Human Resources Security (HRS) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPersonnel management is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for personnel management.\n•\tThe Human Resources (HR) department:\no\tEnsures industry-recognized HR practices are implemented for hiring, managing, training, investigating and terminating employees, contractors and other personnel that work on behalf of the organization.\no\tDefines terms of employment, including acceptable and unacceptable rules of behavior for the use of technologies, including consequences for unacceptable behavior.\n•\tThe responsibility for training users and enforcing policies being assigned to user’s immediate supervisor(s)/manager(s), including the definition and enforcement of the user’s specific role(s) and responsibilities.\n•\tPersonnel managers ensure personnel are routinely made aware of the organization's cybersecurity / data protection policies and provide acknowledgement.\n•\tAdministrative processes require all employees and contractors to apply cybersecurity and data protection principles in their daily work."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Human Resources Security (HRS) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tThe Human Resources (HR) department:\no\tEnsures industry-recognized HR practices are implemented for hiring, managing, training, investigating and terminating employees, contractors and other personnel that work on behalf of the organization.\no\tEnsures that every user accessing a system that processes, stores, or transmits sensitive/regulated data is cleared and regularly trained in proper data handling practices.\no\tIdentifies and implements industry-recognized HR practices related to cybersecurity and data protection training and awareness to help ensure secure practices are implemented in personnel operations to help manage risk to both technology assets and data.\no\tManages personnel security risk by assigning a risk designation to all positions and establishing screening criteria for individuals filling those positions.\n•\tAdministrative processes require Non-Disclosure Agreements (NDAs) or similar confidentiality agreements that reflect the needs to protect data and operational details, for both employees and third-parties.\n•\tThe HR department, in conjunction with a GRC function, defines terms of employment, including acceptable and unacceptable rules of behavior for the use of technologies, including consequences for unacceptable behavior.\n•\tAdministrative processes require all employees and contractors to apply cybersecurity and data protection principles in their daily work."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to require all employees and contractors to apply cybersecurity and data protection principles in their daily work.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to require all employees and contractors to apply cybersecurity and data protection principles in their daily work.
  available: false
  value: 5
