id: 52ecf333-a920-4fe6-ab8a-0f8317379064
name: Automatic Disabling of Technology Assets, Applications and/or Services (TAAS)
description: Mechanisms exist to automatically disable Technology Assets, Applications and/or Services (TAAS), upon detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
elementType: enhancement
externalId: IRO-02.6
parent: iro-02
controlQuestion: Does the organization automatically disable Technology Assets, Applications and/or Services (TAAS), upon detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed?
functionGrouping: Respond
controlWeighting: '6'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to automatically disable Technology Assets, Applications and/or Services (TAAS), up on detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to automatically disable Technology Assets, Applications and/or Services (TAAS), up on detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to automatically disable Technology Assets, Applications and/or Services (TAAS), up on detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Incident Response (IR) processes are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Integrated Security Incident Response Team (ISIRT), or similar function, exists to form an on-demand, scalable and integrated team of formally-assigned cybersecurity, IT, data privacy and business function representatives that can perform coordinated incident response.\n•\tThe ISIRT, or similar function, develops and maintains a documented, program-level Integrated Incident Response Program (IIRP) that provides operational and tactical-level guidance for cybersecurity and data privacy response operations.\n•\tA Security Operations Center (SOC), or similar function, facilitates incident management operations that includes preparation, detection and analysis, containment, eradication and recovery.\n•\tBusiness Process Owners (BPOs), in conjunction with the SOC and ISIRT functions, develop and maintain a documented Incident Response Plan (IRP) specific to the business process / business unit but inclusive of the organization's larger approach to incident response operations.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and provides that information to the SOC for Incident Response Operations (IRO)."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to automatically disable Technology Assets, Applications and/or Services (TAAS), up on detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to automatically disable Technology Assets, Applications and/or Services (TAAS), up on detection of a possible incident that meets organizational criteria, which allows for forensic analysis to be performed.
  available: false
  value: 5
