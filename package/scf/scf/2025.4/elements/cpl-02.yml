id: 8211b88e-6c7a-44c5-a097-65bd8e6c0a10
name: Cybersecurity & Data Protection Controls Oversight
description: Mechanisms exist to provide a cybersecurity and data protection controls oversight function that reports to the organization's executive leadership.
elementType: control
externalId: CPL-02
parent: cpl
controlQuestion: Does the organization provide a cybersecurity and data protection controls oversight function that reports to its executive leadership?
functionGrouping: Detect
controlWeighting: '10'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to provide a cybersecurity and data protection controls oversight function that reports to its executive leadership.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Compliance (CPL) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tIT personnel use an informal process to govern statutory, regulatory and contractual compliance obligations.\n•\tIT personnel self-identify a set of controls that are used to conduct cybersecurity and data privacy control assessments.\n•\tIT personnel perform internal assessments of cybersecurity and data protection controls to determine compliance status."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Compliance (CPL) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tCompliance activities are decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for compliance activities.\n•\tCybersecurity personnel use a defined set of controls to conduct cybersecurity and data privacy control assessments, as defined by the applicable statutory, regulatory and contractual requirements.\n•\tCybersecurity personnel generate a formal report for each security assessment to document the assessment of cybersecurity and data protection controls.\n•\tCompliance reporting is performed, as required."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Compliance (CPL) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA Governance, Risk & Compliance (GRC) function, or similar function, provides governance oversight for the implementation of applicable statutory, regulatory and contractual cybersecurity and data protection controls to ensure compliance requirements are identified and documented.\n•\tThe GRC function, or similar function:\no\tEnsures data/process owners understand their requirements to manage applicable cybersecurity and data protection controls through oversight and written guidance.\no\tProvides applicable stakeholders with status reports on control execution to enable security controls oversight.\no\tWorks with data/process owners and asset custodians to document and validate the scope of cybersecurity and data protection controls to ensure statutory, regulatory and/ or contractual compliance obligations are met.\no\tConducts cybersecurity and data privacy control assessments, on a regular cadence that is defined by the applicable statutory, regulatory and contractual requirements.\n•\tCybersecurity and data privacy controls are centrally managed through a technology solution (e.g., GRC solution) to assign controls, track control activities and report on compliance efforts.\n•\tAn Audit Committee, or similar function:\no\tReviews the findings from security assessments and oversees long-term remediation efforts, when applicable.\no\tProvides senior leaders with insights into the appropriateness of the organization's technology and information governance processes through recurring audits on pertinent cybersecurity and data privacy-related topics.\no\tGoverns changes to compliance operations to ensure its stability, reliability and ongoing improvement."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to provide a cybersecurity and data protection controls oversight function that reports to its executive leadership.
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to provide a cybersecurity and data protection controls oversight function that reports to its executive leadership.
  available: false
  value: 5
