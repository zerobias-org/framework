id: a2dbb3f4-beed-45b0-9a10-7b742a3710d9
name: Authorized System Accounts
description: Mechanisms exist to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
elementType: enhancement
externalId: IAC-20.7
parent: iac-20
controlQuestion: Does the organization define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS)?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: C|P-CMM1 is N/A, since a structured process is required to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
  available: false
  value: 1
cmm_2:
  name: Planned & Tracked
  description: C|P-CMM2 is N/A, since a well-defined process is required to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
  available: false
  value: 2
cmm_3:
  name: Well Defined
  description: "Identification & Authentication (IAC) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tAn Identity & Access Management (IAM) function, or similar function, centrally manages permissions and implements “least privileges” Role Based Access Control (RBAC) practices for the management of user, group and system accounts, including privileged accounts.\n•\tThe Human Resources (HR) department governs personnel management operations and notifies IAM personnel of personnel role changes for RBAC-based provisioning and deprovisioning actions.\n•\tAn IT Asset Management (ITAM) function, or similar function, categorizes endpoint devices according to the data the asset stores, transmits and/ or processes and applies the appropriate technology controls to protect the asset and data that conform to industry-recognized standards for hardening (e.g., DISA STIGs, CIS Benchmarks or OEM security guides).\n•\tAn IT infrastructure team, or similar function, ensures that statutory, regulatory and contractual cybersecurity and data privacy obligations are addressed to ensure secure configurations are designed, built and maintained.\n•\tActive Directory (AD), or a similar technology, is used to centrally manage identities and permissions. Only by exception due to a technical or business limitation are solutions authorized to operate a decentralized access control program for Technology Assets, Applications and/or Services (TAAS).\n•\tAdministrative processes and technologies revoke user access rights following changes in personnel roles and duties, if no longer necessary or permitted.\n•\tAdministrative processes and technologies revoke user access rights in a timely manner, up on termination of employment or contract."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: See C|P-CMM3. There are no defined C|P-CMM4 criteria, since it is reasonable to assume a quantitatively-controlled process is not necessary to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
  available: false
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to define and document the types of accounts allowed and prohibited on Technology Assets, Applications and/or Services (TAAS).
  available: false
  value: 5
