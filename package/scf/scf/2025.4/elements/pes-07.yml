id: 9d276b38-1d56-4866-a8e1-c079eed7b948
name: Supporting Utilities
description: Facility security mechanisms exist to protect power equipment and power cabling for the system from damage and destruction.
elementType: control
externalId: PES-07
parent: pes
controlQuestion: Does the organization protect power equipment and power cabling for the system from damage and destruction?
functionGrouping: Protect
controlWeighting: '9'
cmm_0:
  name: Not Performed
  description: There is no evidence of a capability to protect power equipment and power cabling for the system from damage and destruction.
  available: true
  value: 0
cmm_1:
  name: Performed Informally
  description: "Physical & Environmental Security (PES) efforts are ad hoc and inconsistent. CMM Level 1 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPhysical access control is decentralized.\n•\tPhysical security controls are primarily administrative in nature (e.g., policies & standards), focusing on protecting High Value Assets (HVAs).\n•\tHuman Resources, or a similar function, maintains a current list of personnel and facilitates the implementation of physical access management controls."
  available: true
  value: 1
cmm_2:
  name: Planned & Tracked
  description: "Physical & Environmental Security (PES) efforts are requirements-driven and governed at a local/regional level, but are not consistent across the organization. CMM Level 2 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tPhysical access control is decentralized (e.g., a localized/regionalized function) and uses non-standardized methods to implement secure, resilient and compliant practices.\n•\tIT/cybersecurity personnel identify cybersecurity and data protection controls that are appropriate to address applicable statutory, regulatory and contractual requirements for physical access control.\n•\tHuman Resources, or a similar function, maintains a current list of personnel with authorized access to organizational facilities and facilitates the implementation of physical access management controls.\n•\tPhysical security controls are primarily administrative in nature (e.g., policies & standards).\n•\tPhysical controls, administrative processes and technologies are primarily designed and implemented for offices, rooms and facilities that focus on protecting High Value Assets (HVAs), including environments where sensitive/regulated data is stored, transmitted and processed.\n•\tA facilities maintenance team, or similar function, manages the operation of automated physical and environmental protection controls."
  available: true
  value: 2
cmm_3:
  name: Well Defined
  description: "Physical & Environmental Security (PES) efforts are standardized across the organization and centrally managed, where technically feasible, to ensure consistency. CMM Level 3 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tA physical security team, or similar function:\no\tPerforms the centralized-management of physical security controls across the enterprise.\no\tMaintains a current list of personnel with authorized access to organizational facilities and implements physical access management controls.\n•\tA facilities maintenance team, or similar function, manages the operation of environmental protection controls.\n•\tAdministrative processes exist to authorize physical access to facilities based on the position or role of the individual.\n•\tAdministrative processes and physical controls restrict unescorted access to facilities to personnel with required security clearances, formal access authorizations and validated the need for access.\n•\tAdministrative processes and physical controls address system component location within the facility to minimize potential damage from physical and environmental hazards and to minimize the opportunity for unauthorized access."
  available: true
  value: 3
cmm_4:
  name: Quantitatively Controlled
  description: "Physical & Environmental Security (PES) efforts are metrics driven and provide sufficient management insight (based on a quantitative understanding of process capabilities) to predict optimal performance, ensure continued operations and identify areas for improvement. In addition to CMM Level 3 criteria, CMM Level 4 control maturity would reasonably expect all, or at least most, the following criteria to exist:\n•\tMetrics reporting includes quantitative analysis of Key Performance Indicators (KPIs).\n•\tMetrics reporting includes quantitative analysis of Key Risk Indicators (KRIs).\n•\tScope of metrics, KPIs and KRIs covers organization-wide cybersecurity and data protection controls, including functions performed by third-parties.\n•\tOrganizational leadership maintains a formal process to objectively review and respond to metrics, KPIs and KRIs (e.g., monthly or quarterly review).\n•\tBased on metrics analysis, process improvement recommendations are submitted for review and are handled in accordance with change control processes.\n•\tBoth business and technical stakeholders are involved in reviewing and approving proposed changes."
  available: true
  value: 4
cmm_5:
  name: Continuously Improving
  description: See C|P-CMM4. There are no defined C|P-CMM5 criteria, since it is reasonable to assume a continuously-improving process is not necessary to protect power equipment and power cabling for the system from damage and destruction.
  available: false
  value: 5
