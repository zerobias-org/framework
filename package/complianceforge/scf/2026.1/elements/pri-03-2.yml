id: fd124915-707f-44e8-b551-0f1ece1afa93
name: Just-In-Time Notice & Updated Consent
description: |-
  Mechanisms exist to present data subjects with a new or updated consent request to collect, receive, process, store, transmit, share, update and/or dispose Personal Data (PD) in conjunction with the data action, when:
  (1) The original circumstances under which an individual gave consent have changed; or
  (2) A significant amount of time has passed since an individual gave consent.
elementType: enhancement
externalId: PRI-03.2
parent: pri-03
controlQuestion: |-
  Does the organization present data subjects with a new or updated consent request to collect, receive, process, store, transmit, share, update and/or dispose Personal Data (PD) in conjunction with the data action, when:
  (1) The original circumstances under which an individual gave consent have changed; or
  (2) A significant amount of time has passed since an individual gave consent?
