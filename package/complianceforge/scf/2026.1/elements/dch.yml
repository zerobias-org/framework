id: ce4743a3-b099-4634-b592-6ec37a662b06
name: Data Classification & Handling
description: Data Classification & Handling
elementType: domain
externalId: DCH
intent: Organizations ensure that technology assets, both electronic and physical, are properly classified and measures implemented to protect the organization's data from unauthorized disclosure, or modification, regardless if it is being transmitted or stored. Applicable statutory, regulatory and contractual compliance requirements dictate the minimum safeguards that must be in place to protect the confidentiality, integrity and availability of data.
