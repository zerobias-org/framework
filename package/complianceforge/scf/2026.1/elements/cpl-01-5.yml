name: Declaration of Conformity
description: |-
  Mechanisms exist to generate a declaration of conformity for each conformity assessment, where the document:
  (1) Is concise;
  (2) Unambiguously reflects the current status;
  (3) Is physically or electronically signed; and
  (4) Where possible, is machine readable.
