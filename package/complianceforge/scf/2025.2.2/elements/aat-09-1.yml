name: AI & Autonomous Technologies High Risk Designations
description: "Mechanisms exist to designate Artificial Intelligence (AI) and Autonomous Technologies (AAT) \"High Risk\" if one(1), or more, of the following criteria are met:\r\n(1) AAT is used as a safety component of a product or service;\r\n(2) AAT poses a significant risk of harm to an individual's health, safety or fundamental rights; and/or\r\n(3) AAT materially influences the outcome of an individual's decision making."
