id: 711c6fca-1fc5-4d68-9dff-9e64f2b42ed7
name: Identification & Authentication
description: Enforce the concept of “least privilege” consistently across all systems, applications and services for individual, group and service accounts through a documented and standardized Identity and Access Management (IAM) capability.
elementType: domain
externalId: IAC
intent: Organizations implement the concept of “least privilege” through limiting access to the organization's systems and data to authorized users only.
