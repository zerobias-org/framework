id: 9c735b72-c88f-405f-a29a-38de5357bc9d
name: Biometric Categorization
description: |-
  Mechanisms exist to prohibit the sale, deployment and/or use of Artificial Intelligence (AI) and Autonomous Technologies (AAT) that categorize an individual based on their biometric data to deduce, or infer, the individual's:
  (1) Race; 
  (2) Political opinions;
  (3) Trade union membership;
  (4) Religious or philosophical beliefs; 
  (5) Sex life or sexual orientation; and/or
  (6) Age.
elementType: enhancement
