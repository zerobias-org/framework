name: Ownership Change Provisions
description: |-
  Mechanisms exist to contractually impose safeguards (e.g., additional controls, access modification, contract termination, etc.) from Foreign Ownership, Control or Influence (FOCI) concerns to ensure that:
  (1) Unauthorized access to sensitive and/or regulated data is prevented; and 
  (2) Performance of contracts is not adversely affected.
elementType: enhancement
