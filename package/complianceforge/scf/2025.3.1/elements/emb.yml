id: 437b305b-4f1d-49f1-aae9-8808e3f826f9
name: Embedded Technology
description: Provide additional scrutiny to reduce the risks associated with embedded technology, based on the potential damages posed from malicious use of the technology.
elementType: domain
externalId: EMB
intent: Organizations specify the development, proactive management and ongoing review of security embedded technologies, including hardening of the “stack” from the hardware, firmware and software to transmission and service protocols used for Internet of Things (IoT) and Operational Technology (OT) devices.
