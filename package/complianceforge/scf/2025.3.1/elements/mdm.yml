id: 770661b0-ff0b-4eb7-989d-1275b87a2e3d
name: Mobile Device Management
description: Implement measures to restrict mobile device connectivity with critical infrastructure and sensitive/regulated data that limit the attack surface and potential data exposure from mobile device usage.
elementType: domain
externalId: MDM
intent: Organizations govern risks associated with mobile devices, regardless of ownership (organization-owned, employee-owned or third-party owned). Wherever possible, technologies are employed to centrally manage mobile device access and data storage practices.
