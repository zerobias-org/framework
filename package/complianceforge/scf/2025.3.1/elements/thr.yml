name: Threat Management
description: Proactively identify and assess technology-related threats, to both assets and business processes, to determine the applicable risk and necessary corrective action.
elementType: domain
externalId: THR
intent: Organizations establish a capability to proactively identify and manage technology-related threats to the cybersecurity & data privacy of the organization's systems, data and business processes.
