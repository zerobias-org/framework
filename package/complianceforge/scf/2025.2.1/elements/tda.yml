id: f6bd4e34-a75d-425d-b446-e5aceebe40c1
name: Technology Development & Acquisition
description: Develop and/or acquire systems, applications and services according to a Secure Software Development Framework (SSDF) to reduce the potential impact of undetected or unaddressed vulnerabilities and design flaws.
elementType: domain
externalId: TDA
intent: Organizations ensure that cybersecurity & data privacy principles are implemented into any products/solutions, either developed internally or acquired, to make sure that the concepts of “least privilege” and “least functionality” are incorporated.
