id: 3842327a-f4d6-4d8b-817f-ad5859ae4188
name: AI & Autonomous Technologies Implementation Documentation
description: "Mechanisms exist to ensure Artificial Intelligence (AI) and Autonomous Technologies (AAT) include clear and concise documentation that is relevant, accessible and comprehensible to personnel implementing and maintaining the AAT that, at a minimum, provides: \r\n(1) Contact details of the provider; \r\n(2) Characteristics, capabilities and limitations of performance of the AAT;\r\n(3) Errata from the AAT's initial conformity assessment;\r\n(4) Details necessary to interpret the outputs of the AAT;\r\n(5) Human oversight measures necessary to facilitate the interpretation of the outputs of the AAT;\r\n(6) Computational and hardware resources needed to operate the AAT;\r\n(7) Projected useable lifetime of the AAT; and\r\n(8) A description of the mechanisms included within the AAT system to properly collect, store and interpret event logs."
elementType: enhancement
externalId: AAT-20.2
parent: aat-20
