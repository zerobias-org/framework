id: fd468e36-9658-4d46-92b6-f3963a1a74e5
name: Continued Use of Personal Data (PD)
description: "Mechanisms exist to govern the continued use of Personal Data (PD) as it is collected, received, processed, stored, transmitted and/or shared until:\r\n(1) Disposal of PD occurs when there is no longer a legitimate business purpose;\r\n(2) Disposal of PD occurs when the data retention timeline for the use case is met; and/or\r\n(3) Continued use of PD is prohibited upon withdrawal of data subject consent."
elementType: enhancement
externalId: PRI-03.9
parent: pri-03
controlQuestion: "Does the organization govern the continued use of Personal Data (PD) as it is collected, received, processed, stored, transmitted and/or shared until:\r\n (1) Disposal of PD occurs when there is no longer a legitimate business purpose;\r\n (2) Disposal of PD occurs when the data retention timeline for the use case is met; and/or\r\n (3) Continued use of PD is prohibited upon withdrawal of data subject consent?"
