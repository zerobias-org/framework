id: 28e831fd-019e-4a9d-872a-1d92b54c568e
name: Third-Party Management
description: Execute Supply Chain Risk Management (SCRM) practices so that only trustworthy third-parties are used for products and/or service delivery.
elementType: domain
externalId: TPM
intent: Organizations ensure that cybersecurity & data privacy risks associated with third-parties are minimized and enable measures to sustain operations should a third-party become compromised, untrustworthy or defunct.
