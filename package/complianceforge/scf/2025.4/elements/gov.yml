name: Cybersecurity & Data Protection Governance
description: Execute a documented, risk-based program that supports business objectives while encompassing appropriate cybersecurity & data protection principles that addresses applicable statutory, regulatory and contractual obligations.
elementType: domain
externalId: GOV
intent: Organizations specify the development of an organization's cybersecurity & data protection program, including criteria to measure success, to ensure ongoing leadership engagement and risk management.
