name: ISM-1563
description: "At the conclusion of a security assessment for a system, a
  security assessment report is produced by the assessor and covers:\r

  · \tthe scope of the security assessment\r

  · \tthe system’s strengths and weaknesses\r

  · \tsecurity risks associated with the operation of the system\r

  · \tthe effectiveness of the implementation of controls\r

  · \tany recommended remediation actions."
elementType: control
