name: ISM-1638
description: "An outsourced cloud service register contains the following for
  each outsourced cloud service:\r

  · \tcloud service provider’s name\r

  · \tcloud service’s name\r

  · \tpurpose for using the cloud service\r

  · \tsensitivity or classification of data involved\r

  · \tdue date for the next security assessment of the cloud service\r

  · \tcontractual arrangements for the cloud service\r

  · \tpoint of contact for users of the cloud service\r

  · \t24/7 contact details for the cloud service provider."
elementType: control
