externalId: ISM-1300
name: ISM-1300
description: "Upon returning from travelling overseas with mobile devices,
  personnel take the following actions:\r

  · \tsanitise and reset mobile devices, including all removable media\r

  · \tdecommission any credentials that left their possession during their
  travel\r

  · \treport if significant doubt exists as to the integrity of any mobile
  devices or removable media."
elementType: control
