id: cc190fd2-be48-44a3-ae4a-8d817bedd083
externalId: ISM-0407
name: ISM-0407
description: "A secure record is maintained for the life of each system covering
  the following for each user:\r

  · \ttheir user identification\r

  · \ttheir signed agreement to abide by usage policies for the system and its
  resources\r

  · \twho provided authorisation for their access\r

  · \twhen their access was granted\r

  · \tthe level of access that they were granted\r

  · \twhen their access, and their level of access, was last reviewed\r

  · \twhen their level of access was changed, and to what extent (if
  applicable)\r

  · \twhen their access was withdrawn (if applicable)."
elementType: control
