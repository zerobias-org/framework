externalId: ISM-1556
name: ISM-1556
description: "If returning from travelling overseas with mobile devices to high
  or extreme risk countries, personnel take the following additional actions:\r

  · \treset credentials used with mobile devices, including those used for
  remote access to their organisation’s systems\r

  · \tmonitor accounts for any indicators of compromise, such as failed logon
  attempts."
elementType: control
