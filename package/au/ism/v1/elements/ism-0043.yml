id: 10df7558-8c7c-4afc-aedd-af9b02af4d55
externalId: ISM-0043
name: ISM-0043
description: "Systems have a cyber security incident response plan that covers
  the following:\r

  · \tguidelines on what constitutes a cyber security incident\r

  · \tthe types of cyber security incidents likely to be encountered and the
  expected response to each type\r

  · \thow to report cyber security incidents, internally to an organisation and
  externally to relevant authorities\r

  · \tother parties which need to be informed in the event of a cyber security
  incident\r

  · \tthe authority, or authorities, responsible for investigating and
  responding to cyber security incidents\r

  · \tthe criteria by which an investigation of a cyber security incident would
  be requested from a law enforcement agency, the Australian Signals Directorate
  or other relevant authority\r

  · \tthe steps necessary to ensure the integrity of evidence relating to a
  cyber security incident\r

  · \tsystem contingency measures or a reference to such details if they are
  located in a separate document."
elementType: control
