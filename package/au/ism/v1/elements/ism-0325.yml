id: 57297d7a-d008-486f-bd80-474bee6dd220
externalId: ISM-0325
name: ISM-0325
description: Any media connected to a system with a higher sensitivity or
  classification than the media is reclassified to the higher sensitivity or
  classification, unless the media is read-only or the system has a mechanism
  through which read-only access can be ensured.
elementType: control
