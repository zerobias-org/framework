externalId: ISM-1439
name: ISM-1439
description: If using CDNs, disclosing the IP addresses of web servers under an
  organisation’s control (referred to as origin servers) is avoided and access
  to the origin servers is restricted to the CDNs and authorised management
  networks.
elementType: control
