name: ISM-1803
description: "A cyber security incident register contains the following for each
  cyber security incident:\r

  · \tthe date the cyber security incident occurred\r

  · \tthe date the cyber security incident was discovered\r

  · \ta description of the cyber security incident\r

  · \tany actions taken in response to the cyber security incident\r

  · \tto whom the cyber security incident was reported."
elementType: control
