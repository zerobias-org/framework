externalId: ISM-0235
name: ISM-0235
description: Speakerphones are not used on telephone systems in TOP SECRET areas
  unless the telephone system is located in an audio secure room, the room is
  audio secure during conversations and only personnel involved in conversations
  are present in the room.
elementType: control
