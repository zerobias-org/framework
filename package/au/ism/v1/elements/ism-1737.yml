description: "A managed service register contains the following for each managed
  service:\r

  · \tmanaged service provider’s name\r

  · \tmanaged service’s name\r

  · \tpurpose for using the managed service\r

  · \tsensitivity or classification of data involved\r

  · \tdue date for the next security assessment of the managed service\r

  · \tcontractual arrangements for the managed service\r

  · \tpoint of contact for users of the managed service\r

  · \t24/7 contact details for the managed service provider."
