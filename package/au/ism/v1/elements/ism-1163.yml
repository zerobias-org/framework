id: ea44d424-cc5c-41a0-9275-5493fbb43295
externalId: ISM-1163
name: ISM-1163
description: "Systems have a continuous monitoring plan that includes:\r

  · \tconducting vulnerability scans for systems at least fortnightly\r

  · \tconducting vulnerability assessments and penetration tests for systems
  prior to deployment, including prior to deployment of significant changes, and
  at least annually thereafter\r

  · \tanalysing identified vulnerabilities to determine their potential impact\r

  · \timplementing mitigations based on risk, effectiveness and cost."
elementType: control
