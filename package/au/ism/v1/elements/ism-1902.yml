externalId: ISM-1902
name: ISM-1902
description: Patches, updates or other vendor mitigations for vulnerabilities in
  operating systems of workstations, non-internet-facing servers and
  non-internet-facing network devices are applied within one month of release
  when vulnerabilities are assessed as non-critical by vendors and no working
  exploits exist.
elementType: control
