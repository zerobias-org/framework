externalId: ISM-1694
name: ISM-1694
description: Patches, updates or other vendor mitigations for vulnerabilities in
  operating systems of internet-facing servers and internet-facing network
  devices are applied within two weeks of release when vulnerabilities are
  assessed as non-critical by vendors and no working exploits exist.
elementType: control
