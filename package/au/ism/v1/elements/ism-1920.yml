id: 62a055fd-b16d-427f-8bf6-2fb9c140eeef
externalId: ISM-1920
name: ISM-1920
description: When multi-factor authentication is used to authenticate users to
  online services, online customer services, systems or data repositories – that
  process, store or communicate their organisation’s sensitive data or sensitive
  customer data – users are prevented from self-enrolling into multi-factor
  authentication from untrustworthy devices.
elementType: control
