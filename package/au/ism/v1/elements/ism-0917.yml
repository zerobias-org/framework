id: 961b84dd-a554-4f55-9303-b90c21cc2046
externalId: ISM-0917
name: ISM-0917
description: "When malicious code is detected, the following steps are taken to
  handle the infection:\r

  · \tthe infected systems are isolated\r

  · \tall previously connected media used in the period leading up to the
  infection are scanned for signs of infection and isolated if necessary\r

  · \tantivirus software is used to remove the infection from infected systems
  and media\r

  · \tif the infection cannot be reliably removed, systems are restored from a
  known good backup or rebuilt."
elementType: control
