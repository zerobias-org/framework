externalId: ISM-0306
name: ISM-0306
description: "If an appropriately cleared technician is not used to undertake
  maintenance or repairs of IT equipment, the technician is escorted by someone
  who:\r

  · \tis appropriately cleared and briefed\r

  · \ttakes due care to ensure that data is not disclosed\r

  · \ttakes all responsible measures to ensure the integrity of the IT
  equipment\r

  · \thas the authority to direct the technician\r

  · \tis sufficiently familiar with the IT equipment to understand the work
  being performed."
elementType: control
