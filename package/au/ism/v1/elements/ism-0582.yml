description: "The following events are centrally logged for operating systems:\r

  · \tapplication and operating system crashes and error messages\r

  · \tchanges to security policies and system configurations\r

  · \tsuccessful user logons and logoffs, failed user logons and account
  lockouts\r

  · \tfailures, restarts and changes to important processes and services\r

  · \trequests to access internet resources\r

  · \tsecurity product-related events\r

  · \tsystem startups and shutdowns."
