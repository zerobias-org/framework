externalId: ISM-1299
name: ISM-1299
description: "Personnel are advised to take the following precautions when using
  mobile devices:\r

  · \tnever leave mobile devices or removable media unattended, including by
  placing them in checked-in luggage or leaving them in hotel safes\r

  · \tnever store credentials with mobile devices that they grant access to,
  such as in laptop computer bags\r

  · \tnever lend mobile devices or removable media to untrusted people, even if
  briefly\r

  · \tnever allow untrusted people to connect their mobile devices or removable
  media to your mobile devices, including for charging\r

  · \tnever connect mobile devices to designated charging stations or wall
  outlet charging ports\r

  · \tnever use gifted or unauthorised peripherals, chargers or removable media
  with mobile devices\r

  · \tnever use removable media for data transfers or backups that have not been
  checked for malicious code beforehand\r

  · \tavoid reuse of removable media once used with other parties’ systems or
  mobile devices\r

  · \tavoid connecting mobile devices to open or untrusted Wi-Fi networks\r

  · \tconsider disabling any communications capabilities of mobile devices when
  not in use, such as Wi-Fi, Bluetooth, Near Field Communication and
  ultra-wideband\r

  · \tconsider periodically rebooting mobile devices\r

  · \tconsider using a VPN connection to encrypt all cellular and wireless
  communications\r

  · \tconsider using encrypted email or messaging apps for all communications."
elementType: control
