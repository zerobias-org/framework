name: ISM-1877
description: Patches, updates or other vendor mitigations for vulnerabilities in
  operating systems of internet-facing servers and internet-facing network
  devices are applied within 48 hours of release when vulnerabilities are
  assessed as critical by vendors or when working exploits exist.
elementType: control
