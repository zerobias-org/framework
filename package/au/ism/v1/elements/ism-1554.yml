id: 92427713-8171-4614-8607-f893fc3bb91f
externalId: ISM-1554
name: ISM-1554
description: "If travelling overseas with mobile devices to high or extreme risk
  countries, personnel are:\r

  · \tissued with newly provisioned accounts, mobile devices and removable media
  from a pool of dedicated travel devices which are used solely for work-related
  activities\r

  · \tadvised on how to apply and inspect tamper seals to key areas of mobile
  devices\r

  · \tadvised to avoid taking any personal mobile devices, especially if rooted
  or jailbroken."
elementType: control
