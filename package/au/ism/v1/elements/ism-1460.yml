id: 7100373a-07b0-41f3-be34-8d4ef3d6d5c2
externalId: ISM-1460
name: ISM-1460
description: When using a software-based isolation mechanism to share a physical
  server’s hardware, the isolation mechanism is from a vendor that has
  demonstrated a commitment to secure-by-design and secure-by-default
  principles, use of memory-safe programming languages where possible, secure
  programming practices, and maintaining the security of their products.
elementType: control
