id: 11b91c79-90ef-4797-b35d-ff9c9e7c193b
externalId: ISM-1431
name: ISM-1431
description: "Denial-of-service attack mitigation strategies are discussed with
  cloud service providers, specifically:\r

  · \ttheir capacity to withstand denial-of-service attacks\r

  · \tcosts likely to be incurred as a result of denial-of-service attacks\r

  · \tavailability monitoring and thresholds for notification of
  denial-of-service attacks\r

  · \tthresholds for turning off any online services or functionality during
  denial-of-service attacks\r

  · \tpre-approved actions that can be undertaken during denial-of-service
  attacks\r

  · \tany arrangements with upstream service providers to block malicious
  network traffic as far upstream as possible."
elementType: control
