externalId: ISM-1901
name: ISM-1901
description: Patches, updates or other vendor mitigations for vulnerabilities in
  office productivity suites, web browsers and their extensions, email clients,
  PDF software, and security products are applied within two weeks of release
  when vulnerabilities are assessed as non-critical by vendors and no working
  exploits exist.
