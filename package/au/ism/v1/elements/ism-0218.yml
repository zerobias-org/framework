name: ISM-0218
description: If TOP SECRET fibre-optic fly leads exceeding five metres in length
  are used to connect wall outlet boxes to IT equipment, they are run in a
  protective and easily inspected pathway that is clearly labelled at the IT
  equipment end with the wall outlet box’s identifier.
