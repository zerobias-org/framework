name: ISM-1728
description: The resulting media waste particles from the destruction of SECRET
  media is stored and handled as OFFICIAL if less than or equal to 3 mm,
  PROTECTED if greater than 3 mm and less than or equal to 6 mm, or SECRET if
  greater than 6 mm and less than or equal to 9 mm.
elementType: control
