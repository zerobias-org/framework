externalId: ISM-1555
name: ISM-1555
description: "Before travelling overseas with mobile devices, personnel take the
  following actions:\r

  · \trecord all details of the mobile devices being taken, such as product
  types, serial numbers and International Mobile Equipment Identity numbers\r

  · \tupdate all operating systems and applications\r

  · \tremove all non-essential data, applications and accounts\r

  · \tbackup all remaining data, applications and settings."
elementType: control
