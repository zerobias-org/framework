id: 70dad5b4-1b2a-4d49-8215-382a737de3e8
externalId: ISM-1751
name: ISM-1751
description: Patches, updates or other vendor mitigations for vulnerabilities in
  operating systems of IT equipment other than workstations, servers and network
  devices are applied within one month of release when vulnerabilities are
  assessed as non-critical by vendors and no working exploits exist.
elementType: control
