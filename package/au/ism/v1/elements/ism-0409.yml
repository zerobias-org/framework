id: 6889b776-2681-416e-a544-ea2016233653
externalId: ISM-0409
name: ISM-0409
description: Foreign nationals, including seconded foreign nationals, do not
  have access to systems that process, store or communicate AUSTEO or REL data
  unless effective controls are in place to ensure such data is not accessible
  to them.
elementType: control
