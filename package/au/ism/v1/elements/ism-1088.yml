id: b532534d-4db1-4dcc-bd7c-f908cb75e88b
externalId: ISM-1088
name: ISM-1088
description: "Personnel report the potential compromise of mobile devices,
  removable media or credentials to their organisation as soon as possible,
  especially if they:\r

  · \tprovide credentials to foreign government officials\r

  · \tdecrypt mobile devices for foreign government officials\r

  · \thave mobile devices taken out of sight by foreign government officials\r

  · \thave mobile devices or removable media stolen, including if later
  returned\r

  · \tlose mobile devices or removable media, including if later found\r

  · \tobserve unusual behaviour of mobile devices."
elementType: control
