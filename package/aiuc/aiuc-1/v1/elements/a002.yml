id: e1178aa2-45ab-4552-9250-9a683781e49b
externalId: A002
name: Establish output data policy
description: >-
  Organizations must establish ownership, usage, opt-out and deletion policies
  for AI outputs and communicate these policies to customers. Control type:
  Preventative. Frequency: Every 12 months. Mandatory: Yes. Shoulds: Establish
  output ownership and usage rights policies specifying customer ownership of
  AI-generated outputs versus inputs, defining permitted uses, documenting usage
  restrictions, and clarifying ownership application to different output types.
  Disclose opt-out and deletion procedures explaining how customers can opt out
  of output storage or reuse, request deletion, understand retention periods,
  and control output permissions.
elementType: requirement
parent: domain_a
