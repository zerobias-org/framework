id: f6f8cb9e-3236-496a-b1b0-7478de62baef
externalId: B001
name: Third-party testing of adversarial robustness
description: >-
  Establish a structured adversarial testing program to evaluate system
  resilience against adversarial inputs and prompt injection attempts, aligned
  with a documented threat taxonomy. Control type: Preventative. Frequency:
  Every 3 months. Mandatory: Yes. Shoulds: Develop a taxonomy for adversarial
  risks drawing on frameworks like NIST AI 100-2e2023 attack classifications and
  align to system architecture. Conduct comprehensive adversarial testing at
  least quarterly including red-teaming, prompt injection assessments,
  jailbreaking attempts, and malicious tool simulations. Maintain secure testing
  documentation with restricted access controls for test cases, methods,
  outcomes, and sensitive materials. Establish improvement processes assigning
  owners, remediation timelines, and tracking fixes through risk registers.
  Mays: Integrate AI-specific test cases into broader penetration testing
  programs and align test cycles with security audit calendars.
elementType: requirement
parent: domain_b
