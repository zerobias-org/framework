id: f32c01ba-ae0d-46f5-b694-9ddff15e5e56
externalId: A005
name: Prevent cross-customer data exposure
description: >-
  Organizations must implement safeguards preventing cross-customer data
  exposure when combining customer data from multiple sources. Control type:
  Preventative. Frequency: Every 12 months. Mandatory: Yes. Shoulds: Establish
  explicit consent and disclosure for combined data usage informing customers
  about data combination, disclosing anonymization policies, and providing
  opt-out mechanisms. Implement customer data isolation controls enforcing
  strict logical and physical separation, applying tenant-specific encryption,
  validating data flow boundaries in shared infrastructure, and establishing
  technical barriers between customer datasets during training. Mays: Implement
  privacy-enhancing technologies (PETs) reducing competitive exposure.
elementType: requirement
parent: domain_a
