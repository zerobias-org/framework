id: a3488bb1-a666-449c-b23e-e3f4554fd800
externalId: A003
name: Limit AI agent data collection
description: >-
  Organizations must implement safeguards limiting AI agent data access to
  task-relevant information based on user roles and operational context. Control
  type: Preventative. Frequency: Every 12 months. Mandatory: Yes. Shoulds:
  Configure data collection limits reducing exposure by restricting to
  task-relevant information based on context, implementing scoping by user roles
  or workflow requirements, and preventing persistent out-of-scope data access.
  Mays: Deploy monitoring mechanisms ensuring AI systems perform only necessary
  inference and log operational deviations. Integrate with existing
  authorization systems aligning agent access permissions with organizational
  policies.
elementType: requirement
parent: domain_a
