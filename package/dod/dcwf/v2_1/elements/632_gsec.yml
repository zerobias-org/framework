name: 'GSEC'
externalId: '632-GSEC'
elementType: certification
parent: '632'
description: >-
  GIAC Security Essentials Certification, issued by GIAC (Global Information
  Assurance Certification). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 632 (Systems Developer)
  at the Intermediate proficiency level, per the DoD 8140 Foundational
  Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03,
  qualification options aligned to a higher proficiency level also align to
  all lower proficiency levels.
