name: 'GICSP'
externalId: '541-GICSP'
elementType: certification
parent: '541'
description: >-
  Global Industrial Cyber Security Professional, issued by GIAC (Global
  Information Assurance Certification). Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 541
  (Vulnerability Assessment Analyst) at the Intermediate proficiency level,
  per the DoD 8140 Foundational Qualification Matrix V2.1 (effective
  2025-09-19). Per DoDM 8140.03, qualification options aligned to a higher
  proficiency level also align to all lower proficiency levels.
