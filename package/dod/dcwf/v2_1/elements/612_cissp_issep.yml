name: CISSP-ISSEP
externalId: '612-CISSP-ISSEP'
elementType: certification
parent: '612'
description: >-
  CISSP - Information Systems Security Engineering Professional, issued by ISC2 (International Information System Security Certification Consortium, Inc.). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 612 (Security Control
  Assessor) at the Advanced proficiency level, per the DoD 8140 Foundational
  Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03,
  qualification options aligned to a higher proficiency level also align to
  all lower proficiency levels.
