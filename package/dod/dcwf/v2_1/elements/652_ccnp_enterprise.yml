name: 'CCNP Enterprise'
externalId: '652-CCNP Enterprise'
elementType: certification
parent: '652'
description: >-
  Cisco Certified Network Professional, issued by Cisco Systems. Accepted DoD
  8140 foundational qualification option (personnel certification) for DCWF
  Work Role 652 (Security Architect) at the Advanced proficiency level, per
  the DoD 8140 Foundational Qualification Matrix V2.1 (effective 2025-09-19).
  Per DoDM 8140.03, qualification options aligned to a higher proficiency
  level also align to all lower proficiency levels.
