name: 'GSLC'
externalId: '611-GSLC'
elementType: certification
parent: '611'
description: >-
  GIAC Security Leadership Certification, issued by GIAC (Global Information
  Assurance Certification). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 611 (Authorizing
  Official/Designated Representative) at the Advanced proficiency level, per
  the DoD 8140 Foundational Qualification Matrix V2.1 (effective 2025-09-19).
  Per DoDM 8140.03, qualification options aligned to a higher proficiency
  level also align to all lower proficiency levels.
