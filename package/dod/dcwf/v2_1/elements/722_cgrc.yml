id: e782968b-635f-42d8-903c-6eb7c518a58d
name: 'CGRC/CAP'
externalId: '722-CGRC'
elementType: certification
parent: '722'
description: >-
  Certified in Governance, Risk, and Compliance (Formerly known as CAP),
  issued by (ISC)2 (International Information System Security Certification
  Consortium, Inc). Accepted DoD 8140 foundational qualification option
  (personnel certification) for DCWF Work Role 722 (Information Systems
  Security Manager) at the Intermediate proficiency level, per the DoD 8140
  Foundational Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM
  8140.03, qualification options aligned to a higher proficiency level also
  align to all lower proficiency levels.
