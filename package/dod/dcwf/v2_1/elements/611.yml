name: 'Authorizing Official/Designated Representative'
externalId: '611'
elementType: work_role
description: >-
  DCWF Work Role 611 — Authorizing Official/Designated Representative. Senior
  official or executive with the authority to formally assume responsibility
  for operating an information system at an acceptable level of risk to
  organizational operations (including mission, functions, image, or
  reputation), organizational assets, individuals, other organizations, and
  the Nation (CNSSI 4009).
