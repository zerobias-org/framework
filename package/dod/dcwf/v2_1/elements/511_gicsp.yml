id: 5e8d2a14-c8f4-4a5a-9bcd-973a7bd0ab39
name: 'GICSP'
externalId: '511-GICSP'
elementType: certification
parent: '511'
description: >-
  Global Industrial Cyber Security Professional, issued by GIAC (Global
  Information Assurance Certification). Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 511 (Cyber
  Defense Analyst) at the Advanced proficiency level, per the DoD 8140
  Foundational Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM
  8140.03, qualification options aligned to a higher proficiency level also
  align to all lower proficiency levels.
