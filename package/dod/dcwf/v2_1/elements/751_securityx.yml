id: 66a65610-bee5-45f2-b2a1-5f9c6da078f6
name: 'SecurityX / CASP+'
externalId: '751-SecurityX'
elementType: certification
parent: '751'
description: >-
  CompTIA SecurityX (Formerly known as Advanced Security Practitioner plus
  [CASP+]), issued by CompTIA, Inc.. Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 751 (Cyber
  Workforce Developer and Manager) at the Advanced proficiency level, per the
  DoD 8140 Foundational Qualification Matrix V2.1 (effective 2025-09-19). Per
  DoDM 8140.03, qualification options aligned to a higher proficiency level
  also align to all lower proficiency levels.
