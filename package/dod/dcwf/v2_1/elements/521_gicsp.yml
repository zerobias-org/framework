id: dab2b610-ed7b-4d1c-bcde-92c4e43c85fb
name: 'GICSP'
externalId: '521-GICSP'
elementType: certification
parent: '521'
description: >-
  Global Industrial Cyber Security Professional, issued by GIAC (Global
  Information Assurance Certification). Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 521 (Cyber
  Defense Infrastructure Support Specialist) at the Advanced proficiency
  level, per the DoD 8140 Foundational Qualification Matrix V2.1 (effective
  2025-09-19). Per DoDM 8140.03, qualification options aligned to a higher
  proficiency level also align to all lower proficiency levels.
