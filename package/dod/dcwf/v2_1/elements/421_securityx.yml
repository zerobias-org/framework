id: 3f54f064-8550-4ffd-9918-484601c71418
name: 'SecurityX / CASP+'
externalId: '421-SecurityX'
elementType: certification
parent: '421'
description: >-
  CompTIA SecurityX (Formerly known as Advanced Security Practitioner plus
  [CASP+]), issued by CompTIA, Inc.. Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 421
  (Database Administrator) at the Advanced proficiency level, per the DoD 8140
  Foundational Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM
  8140.03, qualification options aligned to a higher proficiency level also
  align to all lower proficiency levels.
