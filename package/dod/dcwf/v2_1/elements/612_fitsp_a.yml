id: 178d12e9-ddf3-41d2-82e2-e33b830ccbbd
name: FITSP-A
externalId: '612-FITSP-A'
elementType: certification
parent: '612'
description: >-
  Federal IT Security Professional - Auditor - NG, issued by FITSI (Federal IT Security Institute). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 612 (Security Control
  Assessor) at the Intermediate proficiency level, per the DoD 8140 Foundational
  Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03,
  qualification options aligned to a higher proficiency level also align to
  all lower proficiency levels.
