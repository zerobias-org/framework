id: f33b82c8-2671-4c8e-a83a-3f923f654921
name: 'Vulnerability Assessment Analyst'
externalId: '541'
elementType: work_role
description: >-
  DCWF Work Role 541 — Vulnerability Assessment Analyst. Performs assessments
  of systems and networks within the NE or enclave and identifies where those
  systems/networks deviate from acceptable configurations, enclave policy, or
  local policy. Measures effectiveness of defense-in-depth architecture
  against known vulnerabilities.
