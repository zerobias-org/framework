name: 'CISA'
externalId: '421-CISA'
elementType: certification
parent: '421'
description: >-
  Certified Information Systems Auditor, issued by ISACA (Information Systems
  Audit and Control Association). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 421 (Database
  Administrator) at the Advanced proficiency level, per the DoD 8140
  Foundational Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM
  8140.03, qualification options aligned to a higher proficiency level also
  align to all lower proficiency levels.
