description: >-
  CompTIA Security plus, issued by CompTIA, Inc.. Accepted DoD 8140
  foundational qualification option (personnel certification) for DCWF Work
  Role 661 (Research & Development Specialist) at the Intermediate proficiency
  level, per the DoD 8140 Foundational Qualification Matrix V2.1 (effective
