description: >-
  Certified Information Systems Security Officer, issued by Mile2 (United
  America Technologies, LLC). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 723 (COMSEC Manager) at
  the Advanced proficiency level, per the DoD 8140 Foundational Qualification
