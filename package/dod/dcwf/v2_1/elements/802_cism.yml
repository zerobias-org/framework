id: f27b88c3-4197-4ada-b9e5-c0a19f98e444
name: 'CISM'
externalId: '802-CISM'
elementType: certification
parent: '802'
description: >-
  Certified Information Security Manager, issued by ISACA (Information Systems
  Audit and Control Association). Accepted DoD 8140 foundational qualification
  option (personnel certification) for DCWF Work Role 802 (IT Project Manager)
  at the Advanced proficiency level, per the DoD 8140 Foundational
  Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03,
  qualification options aligned to a higher proficiency level also align to
  all lower proficiency levels.
