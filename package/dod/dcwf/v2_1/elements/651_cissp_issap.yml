id: c44fb116-e005-44d4-90f1-e3ff9becee5e
name: 'CISSP-ISSAP'
externalId: '651-CISSP-ISSAP'
elementType: certification
parent: '651'
description: >-
  Certified Information Systems Security Professional - Information Systems
  Security Architecture Professional, issued by (ISC)2 (International
  Information System Security Certification Consortium, Inc). Accepted DoD
  8140 foundational qualification option (personnel certification) for DCWF
  Work Role 651 (Enterprise Architect) at the Advanced proficiency level, per
  the DoD 8140 Foundational Qualification Matrix V2.1 (effective 2025-09-19).
  Per DoDM 8140.03, qualification options aligned to a higher proficiency
  level also align to all lower proficiency levels.
