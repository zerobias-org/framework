id: f6946f56-3826-4eef-8884-2cc2ff9775e8
name: 'CISSP'
externalId: '751-CISSP'
elementType: certification
parent: '751'
description: >-
  Certified Information Systems Security Professional, issued by (ISC)2
  (International Information System Security Certification Consortium, Inc).
  Accepted DoD 8140 foundational qualification option (personnel
  certification) for DCWF Work Role 751 (Cyber Workforce Developer and
  Manager) at the Advanced proficiency level, per the DoD 8140 Foundational
  Qualification Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03,
  qualification options aligned to a higher proficiency level also align to
  all lower proficiency levels.
