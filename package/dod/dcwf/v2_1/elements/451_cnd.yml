description: >-
  Certified Network Defender, issued by EC-Council - International Council of
  E-Commerce Consultants. Accepted DoD 8140 foundational qualification option
  (personnel certification) for DCWF Work Role 451 (System Administrator) at
  the Basic proficiency level, per the DoD 8140 Foundational Qualification
  Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03, qualification options
