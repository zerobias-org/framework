id: 4da62ae6-d8d8-4255-bba9-18b2e8bc8444
name: 'SecurityX / CASP+'
externalId: '722-SecurityX'
elementType: certification
parent: '722'
description: >-
  CompTIA SecurityX (Formerly known as Advanced Security Practitioner plus
  [CASP+]), issued by CompTIA, Inc.. Accepted DoD 8140 foundational
  qualification option (personnel certification) for DCWF Work Role 722
  (Information Systems Security Manager) at the Intermediate proficiency
  level, per the DoD 8140 Foundational Qualification Matrix V2.1 (effective
  2025-09-19). Per DoDM 8140.03, qualification options aligned to a higher
  proficiency level also align to all lower proficiency levels.
