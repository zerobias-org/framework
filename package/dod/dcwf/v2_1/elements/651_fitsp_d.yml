name: 'FITSP-D'
externalId: '651-FITSP-D'
elementType: certification
parent: '651'
description: >-
  Federal IT Security Professional-Designer-NG, issued by Federal IT Security
  Institute. Accepted DoD 8140 foundational qualification option (personnel
  certification) for DCWF Work Role 651 (Enterprise Architect) at the
  Intermediate proficiency level, per the DoD 8140 Foundational Qualification
  Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03, qualification options
  aligned to a higher proficiency level also align to all lower proficiency
  levels.
