id: 99d43b24-f3f7-41d2-b80c-780143cf15ce
name: Security Control Assessor
externalId: '612'
elementType: work_role
description: >-
  DCWF Work Role 612 — Security Control Assessor. Conducts independent
  comprehensive assessments of the management, operational, and technical
  security controls and control enhancements employed within or inherited by
  an information technology (IT) system to determine the overall effectiveness
  of the controls (as defined in NIST SP 800-37). Certification elements under
  this work role are the DoD 8140 foundational qualification options accepted
  at Intermediate or Advanced proficiency.
