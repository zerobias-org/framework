name: 'CGRC/CAP'
externalId: '805-CGRC'
elementType: certification
parent: '805'
description: >-
  Certified in Governance, Risk, and Compliance (Formerly known as CAP),
  issued by (ISC)2 (International Information System Security Certification
  Consortium, Inc). Accepted DoD 8140 foundational qualification option
  (personnel certification) for DCWF Work Role 805 (IT Program Auditor) at the
  Intermediate proficiency level, per the DoD 8140 Foundational Qualification
  Matrix V2.1 (effective 2025-09-19). Per DoDM 8140.03, qualification options
  aligned to a higher proficiency level also align to all lower proficiency
  levels.
