id: c7eb9694-3f08-45b6-a81b-f558be38421d
name: DoD 8140 Cyber Workforce Qualification Matrix
description: >-
  DoD 8140 Cyber Workforce Qualification Program Qualification Matrix for the
  DoD Cyber Workforce Framework (DCWF), per DoDM 8140.03 (Cyberspace Workforce
  Qualification and Management Program). Maps foundational qualification
  options — personnel certifications — to DCWF work roles at Basic,
  Intermediate, and Advanced proficiency levels. Matrix V2.1, effective
  2025-09-19. Covers the 34 work roles of the approved workforce elements
  (IT, Cybersecurity, Cyber Enablers) and their 384 accepted certification
  options; work roles of workforce elements the matrix marks Tentative
  (Cyber Effects, Intel, Data/AI, Software Engineering) are excluded. Work
  Role 612's Intermediate/Advanced certifications gate CMMC Certified
  Assessor (CCA) eligibility under 32 CFR 170.11.
