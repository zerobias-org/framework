externalId: "2.3"
name: Just in Time Authorization
description: Just in Time Authorization allows a timed expiration of group
  membership. In practice, this allows administrative rights to be given at the
  time of need for as long as an action or duty needs them. As a result, access
  to administrative privileges becomes limited and abuse must be timed for when
  those privileges are given.
elementType: control
