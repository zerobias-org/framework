id: 929b4dbf-7b1a-4635-b3f3-bbc80aab0f3e
externalId: "1.1"
name: Continuous Multifactor Authentication
description: "The ability to conduct authentication using two or more different
  factors to achieve authentication. Factors include: something you know (e.g.,
  password/PIN); something you have (e.g., cryptographic identification device,
  token); or something you are (e.g., biometric), something you do. Continuous
  means just-in-time authentication (just -in time usually refers to
  authorization)."
elementType: control
