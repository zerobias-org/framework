id: c37b1816-d42e-4a05-ae51-7abb8ef6b8b3
externalId: 3.PEP.UN.DLPRE
name: Data Loss Prevention
description: Mechanisms should be implemented to control the sharing of
  information between UCC participants, intentional or incidental. This may be
  integrated into additional agency DLP technologies and can include keyword
  matching, attachment file type or existence prohibitions, attachment size
  limitations, or even audio/visual filters.
elementType: control
