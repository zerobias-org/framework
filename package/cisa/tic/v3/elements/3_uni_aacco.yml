externalId: 3.UNI.AACCO
name: Auditing and Accounting
description: Auditing and accounting includes capturing business records (e.g.,
  logs and other telemetry), making them available for auditing and accounting
  as required, and designing an auditing system that considers insider threat
  (e.g., separation of duties violation tracking) such that insider abuse or
  misuse can be detected.
elementType: control
