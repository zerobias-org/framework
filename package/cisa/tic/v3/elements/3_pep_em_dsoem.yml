externalId: 3.PEP.EM.DSOEM
name: Domain Signatures for Outgoing Email
description: Domain signature protections facilitate the authentication of
  outgoing email by signing the emails and ensuring that external parties may
  validate the email signatures according to the DMARC email authentication
  protocol that is defined in RFC 7489.
elementType: control
