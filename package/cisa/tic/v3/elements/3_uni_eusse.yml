externalId: 3.UNI.EUSSE
name: Effective Use of Shared Services
description: Effective use of shared services means that shared services are
  employed, where applicable, and individually tailored and measured to
  independently validate service conformance, and offer effective protections
  for tenants against malicious actors, both external and internal to the
  service provider.
elementType: control
