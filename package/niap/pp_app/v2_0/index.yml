id: 2b47ade5-7a4f-4b3e-aa58-7a8a99681421
name: Protection Profile for Application Software Version 2.0
externalId: PP_APP_v2.0
description: The scope of this Protection Profile (PP) is to describe the security functionality of application software in terms of [CC] and to define functional and assurance requirements for such software. In recent years, software attacks have shifted from targeting operating systems to targeting applications. This has been the natural response to improvements in operating system security and development processes. As a result, it is paramount that the security of applications be improved to reduce the risk of compromise.
