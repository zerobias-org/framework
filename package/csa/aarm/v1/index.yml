id: edafee18-0439-40d6-95fd-4ec63a736a1d
name: Autonomous Action Runtime Management (AARM) v1.0
description: >-
  AARM v1.0 is a Cloud Security Alliance technical working group system
  specification for securing AI systems during action execution. It defines a
  control plane that intercepts, evaluates, decides on, and records every
  agent-initiated action before it is executed, through nine requirements
  grouped into Core (R1-R6, MUST) and Extended (R7-R9, SHOULD) conformance levels.
standardType: framework
