name: CSA AI Controls Matrix v1
externalId: CSA AICM
description: >-
  The CSA AI Controls Matrix (AICM) is a first-of-its-kind vendor-agnostic
  framework for cloud-based AI systems. It provides 243 control objectives
  distributed across 18 security domains, covering the entire spectrum of AI
  security concerns from traditional areas like Identity & Access Management
  to AI-specific domains like Model Security. The framework is aligned with
  ISO 42001, ISO 27001, NIST AI RMF 1.0, and BSI AIC4.
