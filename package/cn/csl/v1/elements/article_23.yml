id: e58ff85f-febd-4746-8b4a-ea8590551bf9
externalId: Article 23
name: Article 23
description: Critical network equipment and specialized cybersecurity products
  shall follow national standards and mandatory requirements, and be security
  certified by a qualified establishment or meet the requirements of a security
  inspection, before being sold or provided. The state cybersecurity and
  informatization departments, together with the relevant departments of the
  State Council, will formulate and release a catalog of critical network
  equipment and specialized cybersecurity products, and promote reciprocal
  recognition of security certifications and security inspection results to
  avoid duplicative certifications and inspections.
elementType: control
