externalId: Article 26
name: Article 26
description: Those carrying out cybersecurity certification, testing, risk
  assessment, or other such activities—or publicly publishing cybersecurity
  information such as system vulnerabilities, computer viruses, network attacks,
  or network incursions—shall comply with relevant national provisions.
elementType: control
