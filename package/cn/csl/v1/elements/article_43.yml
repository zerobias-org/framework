id: f19bfcc3-893d-4bd4-8efc-61d52765c8b2
externalId: Article 43
name: Article 43
description: Where individuals discover that network operators have violated the
  provisions of laws, administrative regulations, or agreements between the
  parties to gather or use their personal information, they have the right to
  demand the network operators delete their personal information; where
  discovering that personal information gathered or stored by network operators
  has errors, they have the right to demand the network operators make
  corrections. Network operators shall employ measures for deletions and
  corrections.
elementType: control
