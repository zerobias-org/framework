id: 840a635d-3143-459a-ac27-1c8da97397ff
externalId: Article 41
name: Article 41
description: "Network operators collecting and using personal information shall
  abide by the principles of legality, propriety, and necessity; they shall
  publish rules for collection and use, explicitly stating the purposes, means,
  and scope for collecting or using information, and obtain the consent of the
  persons whose data is gathered.\r

  \r

  Network operators must not gather personal information unrelated to the
  services they provide; must not violate the provisions of laws, administrative
  regulations or agreements between the parties to gather or use personal
  information; and shall follow the provisions of laws, administrative
  regulations, and agreements with users to process personal information they
  have stored."
elementType: control
