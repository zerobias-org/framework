id: e1fab304-d9dc-4f1c-855b-9a41c8bfd2f6
externalId: Article 27
name: Article 27
description: Individuals and organizations must not engage in illegal intrusion
  into the networks of other parties, disrupt the normal functioning of the
  networks of other parties, or steal network data or engage in other activities
  endangering cybersecurity; they must not provide programs, or tools specially
  used in network intrusions, that disrupt normal network functions and
  protection measures, steal network data, or engage in other acts endangering
  cybersecurity; and where they clearly are aware that others will engage in
  actions that endanger cybersecurity, they must not provide help such as
  technical support, advertisement and promotion, or payment of expenses.
elementType: control
