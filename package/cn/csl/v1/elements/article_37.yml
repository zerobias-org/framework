id: c26bc0bf-2192-443e-9c5f-a51c9b0f0552
externalId: Article 37
name: Article 37
description: Critical information infrastructure operators that gather or
  produce personal information or important data during operations within the
  mainland territory of the People’s Republic of China, shall store it within
  mainland China. Where due to business requirements it is truly necessary to
  provide it outside the mainland, they shall follow the measures jointly
  formulated by the State cybersecurity and informatization departments and the
  relevant departments of the State Council to conduct a security assessment;
  where laws and administrative regulations provide otherwise, follow those
  provisions.
elementType: control
