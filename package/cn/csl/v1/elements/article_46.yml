id: 3f751b04-11c8-4dd0-8322-eb994e755207
externalId: Article 46
name: Article 46
description: All individuals and organizations shall be responsible for their
  use of websites and must not establish websites or communications groups for
  use in perpetrating fraud, imparting criminal methods, the creation or sale of
  prohibited or controlled items, or other unlawful activities, and websites
  must not be exploited to publish information related to perpetrating fraud,
  the creation or sale of prohibited or controlled items, or other unlawful
  activities.
elementType: control
