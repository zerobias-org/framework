id: 6e7f9e26-6ed3-41cf-96fa-eafcd91b4b3a
externalId: Article 72
name: Article 72
description: Where state organization government affairs network operators do
  not perform cybersecurity protection duties as provided by this Law, the
  organization at the level above or relevant organizations will order
  corrections; sanctions will be levied on the directly responsible managers and
  other directly responsible personnel.
elementType: control
