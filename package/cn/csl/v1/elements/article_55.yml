id: cc4cc6df-2da5-45bb-aabb-ef30f502a081
externalId: Article 55
name: Article 55
description: When a cybersecurity incident occurs, the cybersecurity incident
  emergency response plan shall be immediately initiated, an evaluation and
  assessment of the cybersecurity incident shall be conducted, network operators
  shall be requested to adopt technical and other necessary measures, potential
  security risks shall be removed, the threat shall be prevented from expanding,
  and warnings relevant to the public shall be promptly published.
elementType: control
