id: dfeb1b09-2946-4bef-bb98-2a3f0adb4821
externalId: Article 24
name: Article 24
description: "Network operators handling network access and domain name
  registration services for users, handling stationary or mobile phone network
  access, or providing users with information publication or instant messaging
  services, shall require users to provide real identity information when
  signing agreements with users or confirming the provision of services. Where
  users do not provide real identity information, network operators must not
  provide them with relevant services.\r

  \r

  The State implements a network identity credibility strategy and supports
  research and development of secure and convenient electronic identity
  authentication technologies, promoting reciprocal acceptance among different
  electronic identity authentication methods."
elementType: control
