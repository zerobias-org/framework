externalId: Article 9
name: Article 9
description: Network operators carrying out business and service activities must
  follow laws and administrative regulations, respect social morality,  abide by
  commercial ethics, be honest and credible, perform obligations to protect
  cybersecurity, accept supervision from the government and public, and bear
  social responsibility.
elementType: control
