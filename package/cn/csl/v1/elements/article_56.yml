id: 9669267a-6559-4296-a437-5b10ad0b4560
externalId: Article 56
name: Article 56
description: Where, while performing cybersecurity supervision and management
  duties, relevant departments of people’s governments at the provincial level
  or above discover that networks have a relatively large security risk or the
  occurrence of a security incident, they may call in the legal representative
  or responsible party for the operator of that network to conduct interviews in
  accordance with the scope of authority and procedures provided. Network
  operators shall follow requirements to employ procedures, make corrections,
  and eliminate hidden dangers.
elementType: control
