id: f2164fff-16db-4a3b-ba63-4e4d41f034fc
externalId: Article 25
name: Article 25
description: Network operators shall formulate emergency response plans for
  cybersecurity incidents and promptly address system vulnerabilities, computer
  viruses, cyber attacks, network intrusions, and other such cybersecurity
  risks. When cybersecurity incidents occur, network operators should
  immediately initiate an emergency response plan, adopt corresponding remedial
  measures, and report to the relevant competent departments in accordance with
  relevant provisions.
elementType: control
