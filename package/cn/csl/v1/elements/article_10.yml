id: 6851e993-3149-47fe-bee8-e281f47d92d0
externalId: Article 10
name: Article 10
description: "The construction and operation of networks, or the provision of
  services through networks, shall be done: in accordance with the provisions of
  laws and administrative regulations, and with the mandatory requirements of
  national standards; adopting technical measures and other necessary measures
  to safeguard cybersecurity and operational stability; effectively responding
  to cybersecurity incidents; preventing cybercrimes and unlawful activity; and
  preserving the integrity, secrecy, and usability of online data."
elementType: control
