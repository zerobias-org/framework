id: 805b9818-a928-465c-8e19-500dc41e3f80
externalId: Article 38
name: Article 38
description: At least once a year, critical information infrastructure operators
  shall conduct an inspection and assessment of their networks’ security and
  risks that might exist, either on their own or through retaining a
  cybersecurity services organization; CII operators should submit a
  cybersecurity report on the circumstances of the inspection and assessment as
  well as improvement measures, to be sent to the relevant department
  responsible for critical information infrastructure security protection
  efforts.
elementType: control
