id: 514dff3d-1264-4ec5-873d-dd5680ead36b
externalId: Article 42
name: Article 42
description: "Network operators must not disclose, tamper with, or destroy
  personal information they gather; and, absent the consent of the person whose
  information was collected, must not provide personal information to others.
  However, this is the case with the exception that information can be provided
  if after processing there is no way to identify a specific individual, and the
  identity cannot be recovered.\r

  \r

  Network operators shall adopt technical measures and other necessary measures
  to ensure the security of personal information they gather and to prevent
  personal information from leaking, being destroyed, or lost. When the leak,
  destruction, or loss of personal information occurs, or might have occurred,
  remedial measures shall be immediately taken, and provisions followed to
  promptly inform users and to make a report to the competent departments in
  accordance with regulations."
elementType: control
