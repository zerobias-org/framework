id: 249488ea-92f3-480a-a513-8c75a9b5be15
externalId: Article 47
name: Article 47
description: Network operators shall strengthen management of information
  published by users and, upon discovering information that the law or
  administrative regulations prohibits the publication or transmission of, they
  shall immediately stop transmission of that information, employ handling
  measures such as deleting the information, prevent the information from
  spreading, save relevant records, and report to the relevant competent
  departments.
elementType: control
