id: 6b2c6544-2651-4343-b8d2-8e16ad273503
externalId: Article 29
name: Article 29
description: "The State supports cooperation between network operators in areas
  such as the gathering, analysis, reporting, and emergency handling of
  cybersecurity information, increasing the security safeguarding capacity of
  network operators.\r

  \r

  Relevant industrial organizations are to establish and complete mechanisms for
  standardization and coordination of cybersecurity for their industry,
  strengthen their analysis and assessment of cybersecurity, and periodically
  conduct risk warnings, support, and coordination for members in responding to
  cybersecurity risks."
elementType: control
