id: e5a1612b-6d2f-42b7-b4ff-2065da989d17
externalId: Article 48
name: Article 48
description: "Electronic information sent, or application software provided by
  any individual or organization, must not install malicious programs, and must
  not contain information that laws and administrative regulations prohibit the
  publication or transmission of.\r

  \r

  Electronic information distribution service providers, and application
  software download service providers, shall perform security management duties;
  where they know that their users have engaged in conduct provided for in the
  preceding paragraph, they shall: employ measures such as  stopping provision
  of services and removal of information or malicious programs; store relevant
  records; and report to the relevant competent departments."
elementType: control
