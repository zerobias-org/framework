name: This sub-capability supports on-going cybersecurity of the device by keeping customers informed of developments and new information after the initial documentation was developed and provided. Organizations may need to be informed about cybersecurityrelated activities on the IoT device, especially if the IoT device is critical to their operations. Manufacturers and/or their supporting entities can provide security alerts, advisories and other types of information to maintain situational awareness throughout the IoT device customer's system.
