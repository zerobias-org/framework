name: Organizations may need to identify specific requirements for how updates are delivered to ensure they can be effectively monitored within the broader vulnerability and patch management policies they implement. Some IoT devices may also tie application of an update with its delivery (e.g., in an automatic update mechanism), which organization may consider as part of their identification of device cybersecurity requirements.
