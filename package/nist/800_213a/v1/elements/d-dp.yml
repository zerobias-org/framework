name: Data protection on an IoT device supports cybersecurity needs and goals such as access management, system and organizational data protection, and incident detection. Confidentiality , availability, and integrity of data is central to cybersecurity. Privacy protections may also need to be specifically considered for certain use cases. Many times, data protection is implemented using cryptographic modules and functions. NIST has significant guidance around these areas through the Federal Information Processing Standards (FIPS) [NIST FIPS] and Cryptographic Module Validation Program [CMVP], and readers are referred to these publications, programs, and projects for more information about appropriate cryptographic modules for IoT data protection.
