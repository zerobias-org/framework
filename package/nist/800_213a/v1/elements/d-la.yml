name: The logical access to interfaces capability supports cybersecurity needs and goals such as vulnerability management, access management, data protection, and incident detection. The ability to access the device will support its management and use for cybersecurity. Some form factors or use cases may vary in the kinds of interfaces available for accessing the device (e.g., if a physical screen is not possible). A key aspect of this capability is the ability for organizations to control access to interfaces. Limiting access to interfaces reduces the attack surface of the device, giving attackers fewer opportunities to compromise it. For example, unrestricted network access to an IoT device enables attackers to directly interact with the device, which significantly increases the likelihood of the device being compromised. Authentication of other entities (e.g., humans, other devices) will be a common way to support logical access to interfaces, which has been addressed in FIPS 201-2 [FIPS201] and SP 800-63 [800-63].
