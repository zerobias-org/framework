name: Manufacturers and/or their supporting entities can provide basic and advanced levels of IoT device security training, using the best training method as it relates to the customers of the devices, the type of IoT devices, and other related factors, describing the customer's responsibilities for IoT device security activities, such as those related to maintenance of the IoT device. This sub-capability can help organizations fulfill their responsibilities related to the operation of the IoT device within the context of their own systems within which the IoT device is implemented, and in accordance with their own security and privacy programs.
