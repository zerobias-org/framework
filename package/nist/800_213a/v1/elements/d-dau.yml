name: Organizations may employ system-wide component authenticity controls, which may need to be supported by the IoT device. Anti-counterfeiting and authenticity measures may also need to be employed for the hardware and software within the IoT device. Sources of counterfeit hardware and software include, but are not limited to manufacturers, developers, vendors, and contractors.
