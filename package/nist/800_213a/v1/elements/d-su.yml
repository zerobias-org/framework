name: Software update is central to vulnerability management by allowing for software to be changed when vulnerabilities are found and remediated. Correcting IoT device operational problems with software updates can improve device availability, reliability, performance, and other aspects of device operation. Aspects of the software update capability may be dictated by the form factor, use case, organization, or security controls. For example, some IoT devices may have limited physical access, making remote updating more practical. Some organizations may want a rollback capability in the event that an update inadvertently impacts critical applications or integration with other systems, while other organizations may prefer to eliminate the risk of someone intentionally or inadvertently rolling software back to a vulnerable version.
