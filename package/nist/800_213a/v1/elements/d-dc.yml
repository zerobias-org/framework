name: Device configuration supports vulnerability management, access management, data protection, and incident detection. Organizations may want to alter a deviceâ€™s configuration for a variety of reasons (e.g., cybersecurity, interoperability, privacy, and usability). Without a device configuration capability, an organization cannot customize a device to meet its specific needs and may not be able to securely integrate the device into the authorized entity's environment. Many other cybersecurity capabilities will have or require a configuration capability to allow proper use of the features and functions by the organization. Protection and management of configuration data may be necessary to ensure the confidentiality, integrity, and availability of the configurations.
