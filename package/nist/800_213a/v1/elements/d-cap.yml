name: Non-technical communications and actions to explain how to most effectively use the technical abilities of an IoT device will help customers understand how to configure and implement the technical IoT device cybersecurity capabilities to limit the risks the IoT device brings to their systems. It will also help IoT device customers to comply with their associated legal requirements and support their organizational purchasing requirements.
