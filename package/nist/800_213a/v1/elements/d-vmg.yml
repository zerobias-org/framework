name: Manufacturers and/or their supporting entities can provide education describing the IoT device and/or manufacturer's threat and vulnerability monitoring for IoT device components, ensuring that potential threats are not overlooked. Education about vulnerability management options will provide organizations with the knowledge necessary for them to most effectively manage risk within the systems where the IoT device is implemented.
