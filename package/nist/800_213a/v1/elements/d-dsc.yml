name: Documentation describing the design of the device and associated cybersecurity capabilities, such as how IoT platforms were used in the development of the device, as well as documentation of the supporting entities involved with support activities throughout the manufacturer's supply chain may be important to meet the organization's purchasing requirements, to support audits, or to qualify for specific certifications that some customers may require for IoT devices they use.
