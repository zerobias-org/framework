name: Fundamentally, the goal of cybersecurity state awareness is to make an organization able to know when a device will operate as expected and when it will not. For some IoT devices and use cases, logging may not be the most effective or only way this is achieved, and other features and functions may be needed by organizations to effectively monitor cybersecurity state on the IoT device and across the system. In other cases, IoT devices may have to self-assess their state to a limited extent to help ensure secure execution.
