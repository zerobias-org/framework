name: Device identification supports many cybersecurity needs and goals, such as asset management, vulnerability management, access management, data protection, and incident detection. The unique logical identifier can be used to distinguish the device from all others, usually for automated device management and monitoring. Multiple identifiers may be necessary for an organization, each possibly to be used together or for individual purposes. For example, an IoT device may support both a way to identify it uniquely on the system or Internet as well as a way to identify its expected device behavior (e.g., using a Manufacturer Usage Description (MUD) URL).
