name: Organizations may want, or be required, to report vulnerabilities they identify within or related to an IoT device. These communications and actions also allow customers to ask questions related to the security of the IoT device, as well as provide input for the manufacturer to then use in the Information Dissemination and Education and Awareness non-technical supporting capability.
