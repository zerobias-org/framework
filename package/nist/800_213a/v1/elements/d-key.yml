name: 'Cryptographic keys are an essential element of applying cryptographic modules and functions. Proper cryptographic key management is essential to supporting and effectively using cryptographic modules and functions in the system and among system elements. There are aspects of key management related to generation, storage, distribution, use, and destruction that may have to be covered by device cybersecurity requirements. Additional guidance about cryptographic key management in systems see SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: Part 1 â€“ General [800-57].â€�'
