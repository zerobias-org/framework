name: The unique logical identifier can be used to distinguish the device from all others, usually for automated device management and monitoring. This may require that it be immutable to allow for consistent identification using the identifier. The unique logical identifier may also be used for device authentication, but consideration should be made to select an appropriate identifier for the purpose.
