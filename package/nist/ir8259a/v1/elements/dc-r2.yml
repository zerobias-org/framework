name: An authorized entity may want to alter a device’s configuration for a variety of reasons, including cybersecurity, interoperability, privacy, and usability. Without a device configuration capability, an authorized entity cannot customize a device to meet its needs, integrate the device into the authorized entity's environment, etc.
