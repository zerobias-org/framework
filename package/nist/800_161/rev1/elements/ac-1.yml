id: 93a71642-a3bc-4703-aeea-9ebc13b24ea2
externalId: AC-1
name: Policy and Procedures
description: Enterprises should specify and include in agreements (e.g.,
  contracting language) access control policies for their suppliers, developers,
  system integrators, external system service providers, and other
  ICT/OT-related service providers that have access control policies. These
  should include both physical and logical access to the supply chain and the
  information system. Enterprises should require their prime contractors to
  implement this control and flow down this requirement to relevant subtier
  contractors.
elementType: control
