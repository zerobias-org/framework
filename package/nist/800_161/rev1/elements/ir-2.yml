id: a422b63f-fd63-40db-8230-40fceee5b9da
externalId: IR-2
name: Incident Response Training
description: Enterprises should ensure that critical suppliers are included in
  incident response training. Enterprises should require their prime contractors
  to implement this control and flow down this requirement to relevant sub-tier
  contractors. Departments and agencies should refer to Appendix F to implement
  this guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
