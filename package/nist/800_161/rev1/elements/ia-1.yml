id: 1e28b8f8-d7f7-41b5-96f3-6a43e5265c7a
externalId: IA-1
name: Policy and Procedures
description: The enterprise should – at enterprise-defined intervals – review,
  enhance, and update their identity and access management policies and
  procedures to ensure that critical roles and processes within the supply chain
  network are defined and that the enterprise’s critical systems, components,
  and processes are identified for traceability. This should include the
  identity of critical components that may not have been considered under
  identification and authentication in the past. Note that providing
  identification for all items within the supply chain would be
  cost-prohibitive, and discretion should be used. The enterprise should update
  related C-SCRM Strategy/Implementation Plan(s), Policies, and C-SCRM Plans.
elementType: control
