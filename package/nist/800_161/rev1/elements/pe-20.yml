name: Asset Monitoring and Tracking
description: "The enterprise should, whenever possible and practical, use asset
  location technologies to track systems and components transported between
  entities across the supply chain, between protected areas, or in storage
  awaiting implementation, testing, maintenance, or disposal. Methods include
  RFID, digital signatures, or blockchains. These technologies help protect
  against:\r

  \r

  a. Diverting the system or component for counterfeit replacement;\r

  b. The loss of confidentiality, integrity, or availability of the system or
  component function and data (including data contained within the component and
  data about the component); and\r

  c. Interrupting supply chain and logistics processes for critical components.
  In addition to providing protection capabilities, asset location technologies
  also help gather data that can be used for incident management."
elementType: control
