id: 339cdac4-05cd-4c21-a00f-c53ffd2a65cc
externalId: AT-3(8)
name: Role-based Training | Counterintelligence Training
description: Public sector enterprises should provide specialized
  counterintelligence awareness training that enables its resources to collect,
  interpret, and act upon a range of data sources that may signal a foreign
  adversary’s presence in the supply chain. At a minimum, counterintelligence
  training should cover known red flags, key information sharing concepts, and
  reporting requirements.
elementType: control
