externalId: PE-1
name: Policy and Procedures
description: The enterprise should integrate C-SCRM practices and requirements
  into their own physical and environmental protection policy and procedures.
  The degree of protection should be commensurate with the degree of
  integration. The physical and environmental protection policy should ensure
  that the physical interfaces of the supply chain have adequate protection and
  audit for such protection.
elementType: control
