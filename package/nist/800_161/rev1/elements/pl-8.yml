id: e0fcd707-ad32-444c-85db-52077727aeb8
externalId: PL-8
name: Security and Privacy Architectures
description: Security and privacy architecture defines and directs the
  implementation of security and privacy-protection methods, mechanisms, and
  capabilities to the underlying systems and networks, as well as the
  information system that is being created. Security architecture is fundamental
  to CSCRM because it helps to ensure that security is built-in throughout the
  SDLC. Enterprises should consider implementing zero-trust architectures and
  should ensure that the security architecture is well understood by system
  developers/engineers and system security engineers. This control applies to
  both federal agency and non-federal agency employees.
elementType: control
