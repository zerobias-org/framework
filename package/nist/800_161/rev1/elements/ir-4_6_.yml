id: f2fe84bc-29b2-4a4f-b926-195cb81c6ef8
externalId: IR-4(6)
name: Incident Handling | Insider Threats
description: This enhancement helps limit exposure of the C-SCRM information
  systems, networks, and processes to insider threats. Enterprises should ensure
  that insider threat incident handling capabilities account for the potential
  of insider threats associated with suppliers, developers, system integrators,
  external system service providers, and other ICT/OT-related service providers’
  personnel with access to ICT/OT systems within the authorization boundary.
elementType: control
