externalId: PS-1
name: Policy and Procedures
description: "At each level, the personnel security policy and procedures and
  the related C-SCRM Strategy/Implementation Plan, C-SCRM Policies, and C-SCRM
  Plan(s) need to define the roles for the personnel who are engaged in the
  acquisition, management, and execution of supply chain security activities.
  These roles also need to state acquirer personnel responsibilities with regard
  to relationships with suppliers, developers, system integrators, external
  system service providers, and other ICT/OT-related service providers. Policies
  and procedures need to consider the full system development life cycle of
  systems and the roles and responsibilities needed to address the various
  supply chain infrastructure activities.\r

  \r

  Level 1: Applicable roles include risk executive, CIO, CISO, contracting,
  logistics, delivery/receiving, acquisition security, and other functions that
  provide supporting supply chain activities.\r

  Level 2: Applicable roles include program executive and individuals (e.g.,
  non-federal employees, including contractors) within the acquirer enterprise
  who are responsible for program success (e.g., Program Manager and other
  individuals).\r

  Level 3: Applicable roles include system engineers or system security
  engineers throughout the operational system life cycle from requirements
  definition, development, test, deployment, maintenance, updates, replacements,
  delivery/receiving, and IT.\r

  \r

  Roles for the supplier, developer, system integrator, external system service
  provider, and other ICT/OTrelated service provider personnel responsible for
  the success of the program should be noted in an agreement between the
  acquirer and these parties (e.g., contract).\r

  \r

  The enterprise should require its prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors."
elementType: control
