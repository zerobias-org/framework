externalId: RA-7
name: Risk Response
description: Enterprises should integrate capabilities to respond to
  cybersecurity risks throughout the supply chain into the enterprise’s overall
  response posture, ensuring that these responses are aligned to and fall within
  the boundaries of the enterprise’s tolerance for risk. Risk response should
  include consideration of risk response identification, evaluation of
  alternatives, and risk response decision activities
elementType: control
