id: bae37b26-8fc3-4d34-994d-d69094ca2045
externalId: CM-13
name: Data Action Mapping
description: In addition to personally identifiable information, understanding
  and documenting a map of system data actions for sensitive or classified
  information is necessary. Data action mapping should also be conducted to map
  Internet of Things (IoT) devices, embedded or stand-alone IoT systems, or IoT
  system of system data actions. Understanding what classified or IoT
  information is being processed, its sensitivity and/or effect on a physical
  thing or physical environment, how the sensitive or IoT information is being
  processed (e.g., if the data action is visible to an individual or is
  processed in another part of the system), and by whom provides a number of
  contextual factors that are important for assessing the degree of risk. Data
  maps can be illustrated in different ways, and the level of detail may vary
  based on the mission and business needs of the enterprise. The data map may be
  an overlay of any system design artifact that the enterprise is using. The
  development of this map may necessitate coordination between program and
  security personnel regarding the covered data actions and the components that
  are identified as part of the system.
elementType: control
