name: Supplier Assessments and Reviews
description: In general, an enterprise should consider any information pertinent
  to the security, integrity, resilience, quality, trustworthiness, or
  authenticity of the supplier or their provided services or products.
  Enterprises should consider applying this information against a consistent set
  of core baseline factors and assessment criteria to facilitate equitable
  comparison (between suppliers and over time). Depending on the specific
  context and purpose for which the assessment is being conducting, the
  enterprise may select additional factors. The quality of information (e.g.,
  its relevance, completeness, accuracy, etc.) relied upon for an assessment is
  also an important consideration. Reference sources for assessment information
  should also be documented. The C-SCRM PMO can help define requirements,
  methods, and tools for the enterprise’s supplier assessments. Departments and
  agencies should refer to Appendix E for further guidance concerning baseline
  risk factors and the documentation of assessments and Appendix F to implement
  this guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
