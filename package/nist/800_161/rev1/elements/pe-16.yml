id: 621bedd8-3b9c-4c1b-9f38-6bc4cf51c030
externalId: PE-16
name: Delivery and Removal
description: This control enhancement reduces cybersecurity risks that arise
  during the physical delivery and removal of hardware components from the
  enterprise’s information systems or supply chain. This includes transportation
  security, the validation of delivered components, and the verification of
  sanitization procedures. Risk-based considerations include component mission
  criticality as well as the development, operational, or maintenance
  environment (e.g., classified integration and test laboratory).
elementType: control
