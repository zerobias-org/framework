externalId: CP-2
name: Contingency Plan
description: Enterprises should define and implement a contingency plan for the
  supply chain information systems and network to ensure that preparations are
  in place to mitigate the loss or degradation of data or operations.
  Contingencies should be put in place for the supply chain, network,
  information systems (especially critical components), and processes to ensure
  protection against compromise and provide appropriate failover and timely
  recovery to an acceptable state of operations.
elementType: control
