name: Security and Privacy Workforce
description: Security and privacy workforce development and improvement should
  ensure that relevant C-SCRM topics are integrated into the content and
  initiatives produced by the program. Section 2 provides information on C-SCRM
  roles and responsibilities. NIST SP 800-161 can be used as a source of topics
  and activities to include in the security and privacy workforce program.
