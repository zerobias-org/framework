externalId: AU-10
name: Non-repudiation
description: "Enterprises should implement non-repudiation techniques to protect
  the originality and integrity of both information systems and the supply chain
  network. Examples of what may require non-repudiation include supply chain
  metadata that describes the components, supply chain communication, and
  delivery acceptance information. For information systems, examples may
  include\r

  patch or maintenance upgrades for software as well as component replacements
  in a large hardware system. Verifying that such components originate from the
  OEM is part of non-repudiation."
elementType: control
