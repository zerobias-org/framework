id: b2bad89e-e00e-4fc5-aef9-3199e759a033
externalId: PM-17
name: Protecting Controlled Unclassified Information on External Systems
description: The policy and procedures for controlled unclassified information
  (CUI) on external systems should include protecting relevant supply chain
  information. Conversely, it should include protecting agency information that
  resides in external systems because such external systems are part of the
  agency supply chain.
elementType: control
