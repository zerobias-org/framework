externalId: PE-17
name: Alternate Work Site
description: The enterprise should incorporate protections to guard against
  cybersecurity risks associated with enterprise employees or contractor
  personnel within or accessing the supply chain infrastructure using
  alternative work sites. This can include third-party personnel who may also
  work from alternative worksites.
elementType: control
