id: 53fa338a-8f13-40b0-971d-8f077f3f1569
externalId: SI-1
name: Policy and Procedures
description: The enterprise should include C-SCRM in system and information
  integrity policy and procedures, including ensuring that program-specific
  requirements for employing various integrity verification tools and techniques
  are clearly defined. System and information integrity for information systems,
  components, and the underlying information systems and networks is critical
  for managing cybersecurity risks throughout the supply chain. The insertion of
  malicious code and counterfeits are two primary examples of cybersecurity
  risks throughout the supply chain, both of which can be at least partially
  addressed by deploying system and information integrity controls.
elementType: control
