id: 2e58ef22-54f0-4b69-ad2c-a91f635810e8
externalId: AT-2(3)
name: Literacy Training and Awareness | Social Engineering and Mining
description: Enterprises should provide literacy training on recognizing and
  reporting potential and actual instances of supply chain-related social
  engineering and social mining. Enterprises should require their prime
  contractors to implement this control and flow down this requirement to
  relevant sub-level contractors.
elementType: control
