externalId: CA-2
name: Control Assessments
description: Ensure that the control assessment plan incorporates relevant
  C-SCRM controls and control enhancements. The control assessment should cover
  the assessment of both information systems and the supply chain and ensure
  that an enterprise-relevant baseline set of controls and control enhancements
  are identified and used for the assessment. Control assessments can include
  information from supplier audits, reviews, and supply chain-related
  information. Enterprises should develop a strategy for collecting information,
  including a strategy for engaging with providers on supply chain risk
  assessments. Such collaboration helps enterprises leverage information from
  providers, reduce redundancy, identify potential courses of action for risk
  responses, and reduce the burden on providers. CSCRM personnel should review
  the control assessment.
elementType: control
