id: 507372f5-f0f8-40f8-9bd9-5d05c4a00835
externalId: SA-9(3)
name: External System Services | Establish and Maintain Trust Relationship with
  Providers
description: "Relationships with providers should meet the following supply
  chain security requirements:\r

  a. The requirements definition is complete and reviewed for accuracy and
  completeness, including the assignment of criticality to various components
  and defining operational concepts and associated scenarios for intended and
  unintended use.\r

  b. Requirements are based on needs, relevant compliance drivers, criticality
  analysis, and assessments of cybersecurity risks throughout the supply
  chain.\r

  c. Cyber supply chain threats, vulnerabilities, and associated risks are
  identified and documented.\r

  d. Enterprise data and information integrity, confidentiality, and
  availability requirements are defined and shared with the system suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers as appropriate.\r

  e. The consequences of non-compliance with C-SCRM requirements and information
  system security requirements are defined and documented.\r

  f. There is a clear delineation of accountabilities, roles, and
  responsibilities between contractors when multiple disparate providers are
  engaged in supporting a system or mission and business function.\r

  g. The requirements detail service contract completion and what defines the
  end of the suppliers, developers, system integrators, external system service
  providers, or other ICT/OT-related service providers’ relationship. This is
  important to know for re-compete, potential change in provider, and to manage
  system end-of-life processes.\r

  h. Establish negotiated agreements for relationship termination to ensure a
  safe and secure termination, such as removing data from cloud environments.\r

  \r

  Departments and agencies should refer to Appendix F to implement this guidance
  in accordance with\r

  Executive Order 14028, Improving the Nation’s Cybersecurity."
elementType: control
