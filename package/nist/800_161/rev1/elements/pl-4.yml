id: 3063bf10-0727-4896-afc8-127a2bbd122c
externalId: PL-4
name: Rules of Behavior
description: The rules of behavior apply to contractor personnel and internal
  agency personnel. Contractor enterprises are responsible for ensuring that
  their employees follow applicable rules of behavior. Individual contractors
  should not be granted access to agency systems or data until they have
  acknowledged and demonstrated compliance with this control. Failure to meet
  this control can result in the removal of access for such individuals.
elementType: control
