name: Publicly Accessible Content
description: Within the C-SCRM context, publicly accessible content may include
  Requests for Information, Requests for Proposal, or information about delivery
  of systems and components. This information should be reviewed to ensure that
  only appropriate content is released for public consumption, whether alone or
  with other information.
