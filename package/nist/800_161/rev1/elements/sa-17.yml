id: f7111f1a-79ae-4bb8-813e-dfa5e862ff2c
externalId: SA-17
name: Developer Security and Privacy Architecture and Design
description: This control facilitates the use of C-SCRM information to influence
  system architecture, design, and component selection decisions, including
  security functions. Examples include identifying components that compose
  system architecture and design or selecting specific components to ensure
  availability through multiple supplier or component selections. Departments
  and agencies should refer to Appendix F to implement this guidance in
  accordance with Executive Order 14028 on Improving the Nation's Cybersecurity
elementType: control
