id: b63e84da-8e5f-4456-b23c-9e8b03d2db26
externalId: IR-8
name: Incident Response Plan
description: Enterprises should coordinate, develop, and implement an incident
  response plan that includes information-sharing responsibilities with critical
  suppliers and, in a federal context, interagency partners and the FASC.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors.
elementType: control
