externalId: AC-18
name: Wireless Access
description: An enterprise’s supply chain may include wireless infrastructure
  that supports supply chain logistics (e.g., radio-frequency identification
  device [RFID] support, software call home features). Supply chain
  systems/components traverse the supply chain as they are moved from one
  location to another, whether within the enterprise’s own environment or during
  delivery from system integrators or suppliers. Ensuring that appropriate and
  secure access mechanisms are in place within this supply chain enables the
  protection of the information systems and components, as well as logistics
  technologies and metadata used during shipping (e.g., within tracking
  sensors). The enterprise should explicitly define appropriate wireless access
  control mechanisms for the supply chain in policy and implement appropriate
  mechanisms.
elementType: control
