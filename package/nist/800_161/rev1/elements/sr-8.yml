externalId: SR-8
name: Notification Agreements
description: At minimum, enterprises should require their suppliers to establish
  notification agreements with entities within their supply chain that have a
  role or responsibility related to that critical service or product.
  Departments and agencies should refer to Appendix F to implement this guidance
  in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
