id: 75a63933-8e08-4755-85f7-cfbad2d30405
externalId: AU-12
name: Audit Record Generation
description: Enterprises should ensure that audit record generation mechanisms
  are in place to capture all relevant supply chain auditable events. Examples
  of such events include component version updates, component approvals from
  acceptance testing results, logistics data-capturing inventory, or
  transportation information. Enterprises should require their prime contractors
  to implement this control and flow down this requirement to relevant sub-tier
  contractors. Departments and agencies should refer to Appendix F to implement
  this guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
