externalId: AC-19
name: Access Control for Mobile Devices
description: The use of mobile devices (e.g., laptops, tablets, e-readers,
  smartphones, smartwatches) has become common in the supply chain. They are
  used in direct support of an enterprise’s operations, as well as tracking,
  supply chain logistics, data as information systems, and components that
  traverse enterprise or systems integrator supply chains. Ensure that access
  control mechanisms are clearly defined and implemented where relevant when
  managing enterprise supply chain components. An example of such an
  implementation includes access control mechanisms implemented for use with
  remote handheld units in RFID for tracking components that traverse the supply
  chain. Access control mechanisms should also be implemented on any associated
  data and metadata tied to the devices.
elementType: control
