id: 7c65529e-8426-4725-9c99-eb22cd1fd3ec
externalId: AC-3(9)
name: Access Enforcement | Controlled Release
description: Information about the supply chain should be controlled for release
  between the enterprise and third parties. Information may be exchanged between
  the enterprise and its suppliers, developers, system integrators, external
  system service providers, and other ICT/OT-related service providers. The
  controlled release of enterprise information protects against risks associated
  with disclosure.
elementType: control
