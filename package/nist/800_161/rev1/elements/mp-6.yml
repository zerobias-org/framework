id: d4117de8-a05b-4d1a-863e-3d122afc9241
externalId: MP-6
name: Media Sanitization
description: Enterprises should specify and include in agreements (e.g.,
  contracting language) media sanitization policies for their suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers. Media is used throughout the SDLC. Media
  traversing or residing in the supply chain may originate anywhere, including
  from suppliers, developers, system integrators, external system service
  providers, and other ICT/OT-related service providers. It can be new,
  refurbished, or reused. Media sanitization is critical to ensuring that
  information is removed before the media is used, reused, or discarded. For
  media that contains privacy or other sensitive information (e.g., CUI), the
  enterprise should require its prime contractors to implement this control and
  flow down this requirement to relevant sub-tier contractors.
elementType: control
