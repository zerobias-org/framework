externalId: CA-7(3)
name: Continuous Monitoring | Trend Analyses
description: The information gathered during continuous monitoring/trend
  analyses serves as input into C-SCRM decisions, including criticality
  analysis, vulnerability and threat analysis, and risk assessments. It also
  provides information that can be used in incident response and potentially
  identify a supply chain cybersecurity compromise, including an insider threat.
elementType: control
