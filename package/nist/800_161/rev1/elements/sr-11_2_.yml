id: 5f0c8ee1-af97-4944-9bd4-8e85e235108c
externalId: SR-11(2)
name: Component Authenticity | Configuration Control for Component Service and Repair
description: Information technology, IT security, or the C-SCRM PMO should be
  responsible for establishing and implementing configuration control processes
  for component service and repair, to include – if applicable – integrating
  component service and repair into the overall enterprise configuration control
  processes. Component authenticity should be addressed in contracts when
  procuring component servicing and repair support.
elementType: control
