name: Mission and Business Process Definition
description: The enterprise’s mission and business processes should address
  cybersecurity risks throughout the supply chain. When addressing mission and
  business process definitions, the enterprise should ensure that C-SCRM
  activities are incorporated into the support processes for achieving mission
  success. For example, a system supporting a critical mission function that has
  been designed and implemented for easy removal and replacement should a
  component fail may require the use of somewhat unreliable hardware components.
  A C-SCRM activity may need to be defined to ensure that the supplier makes
  component spare parts readily available if a replacement is needed.
elementType: control
