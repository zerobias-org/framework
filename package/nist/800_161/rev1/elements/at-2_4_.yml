id: fc81b468-9cbf-4ea1-b39e-f48fa0e64771
externalId: AT-2(4)
name: Literacy Training and Awareness | Suspicious Communications and Anomalous
  System Behavior
description: Provide literacy training on recognizing suspicious communications
  or anomalous behavior in enterprise supply chain systems. Enterprises should
  require their prime contractors to implement this control and flow down this
  requirement to relevant sub-level contractors.
elementType: control
