id: 43666307-f7a2-4627-a14d-cb94fed1de5b
externalId: SI-5
name: Security Alerts, Advisories, and Directives
description: The enterprise should evaluate security alerts, advisories, and
  directives for cybersecurity supply chain impacts and follow up if needed.
  US-CERT, FASC, and other authoritative entities generate security alerts and
  advisories that are applicable to C-SCRM. Additional laws and regulations will
  impact who and how additional advisories are provided. Enterprises should
  ensure that their information-sharing protocols and processes include sharing
  alerts, advisories, and directives with relevant parties with whom they have
  an agreement to deliver products or perform services. Enterprises should
  provide direction or guidance as to what actions are to be taken in response
  to sharing such an alert, advisory, or directive. Enterprises should require
  their prime contractors to implement this control and flow down this
  requirement to relevant sub-tier contractors. Departments and agencies should
  refer to Appendix F to implement this guidance in accordance with Executive
  Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
