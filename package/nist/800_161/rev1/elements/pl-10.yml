id: d9039c00-f5e7-492c-830f-90d2091474dc
externalId: PL-10
name: Baseline Selection
description: Enterprises should include C-SCRM controls in their control
  baselines. Enterprises should identify and select C-SCRM controls based on the
  C-SCRM requirements identified within each of the levels. A C-SCRM PMO may
  assist in identifying C-SCRM control baselines that meet common C-SCRM
  requirements for different groups, communities of interest, or the enterprise
  as a whole
elementType: control
