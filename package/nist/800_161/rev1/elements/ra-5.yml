id: b58fe32c-42ff-4eb2-bc3c-6e345b782a48
externalId: RA-5
name: Vulnerability Monitoring and Scanning
description: Vulnerability monitoring should cover suppliers, developers, system
  integrators, external system service providers, and other ICT/OT-related
  service providers in the enterprise’s supply chain. This includes employing
  data collection tools to maintain a continuous state of awareness about
  potential vulnerability to suppliers, as well as the information systems,
  system components, and raw inputs that they provide through the cybersecurity
  supply chain. Vulnerability monitoring activities should take place at all
  three levels of the enterprise. Scoping vulnerability monitoring activities
  requires enterprises to consider suppliers as well as their sub-suppliers.
  Enterprises, where applicable and appropriate, may consider providing
  customers with a Vulnerability Disclosure Report (VDR) to demonstrate proper
  and complete vulnerability assessments for components listed in SBOMs. The VDR
  should include the analysis and findings describing the impact (or lack of
  impact) that the reported vulnerability has on a component or product. The VDR
  should also contain information on plans to address the CVE. Enterprises
  should consider publishing the VDR within a secure portal available to
  customers and signing the VDR with a trusted, verifiable, private key that
  includes a timestamp indicating the date and time of the VDR signature and
  associated VDR. Enterprises should also consider establishing a separate
  notification channel for customers in cases where vulnerabilities arise that
  are not disclosed in the VDR. Enterprises should require their prime
  contractors to implement this control and flow down this requirement to
  relevant sub-tier contractors. Departments and agencies should refer to
  Appendix F to implement this guidance in accordance with Executive Order
  14028, Improving the Nation’s Cybersecurity.
elementType: control
