externalId: IA-4(6)
name: Identifier Management | Cross-organization Management
description: This enhancement helps the traceability and provenance of elements
  within the supply chain through the coordination of identifier management
  among the enterprise and its suppliers, developers, system integrators,
  external system service providers, and other ICT/OT-related service providers.
  This includes information systems and components as well as individuals
  engaged in supply chain activities.
elementType: control
