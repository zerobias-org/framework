externalId: SA-3
name: System Development Life Cycle
description: There is a strong relationship between the SDLC and C-SCRM
  activities. The enterprise should ensure that C-SCRM activities are integrated
  into the SDLC for both the enterprise and for applicable suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers. In addition to traditional SDLC activities,
  such as requirements and design, the SDLC includes activities such as
  inventory management, acquisition and procurement, and the logical delivery of
  systems and components. See Section 2 and Appendix C for further guidance on
  SDLC. Departments and agencies should refer to Appendix F to implement this
  guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
