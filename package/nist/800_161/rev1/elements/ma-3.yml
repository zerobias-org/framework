id: 1c354f46-f0ec-4577-b26d-c0e22f7f82b8
externalId: MA-3
name: Maintenance Tools
description: Maintenance tools are considered part of the supply chain. They
  also have a supply chain of their own. C-SCRM should be integrated when the
  enterprise acquires or upgrades a maintenance tool (e.g., an update to the
  development environment or testing tool), including during the selection,
  ordering, storage, and integration of the maintenance tool. The enterprise
  should perform continuous review and approval of maintenance tools, including
  those maintenance tools in use by external service providers. The enterprise
  should also integrate C-SCRM when evaluating replacement parts for maintenance
  tools. This control may be performed at both Level 2 and Level 3, depending on
  how an agency handles the acquisition, operations, and oversight of
  maintenance tools.
elementType: control
