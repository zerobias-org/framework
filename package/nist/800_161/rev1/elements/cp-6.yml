name: Alternate Storage Site
description: When managed by suppliers, developers, system integrators, external
  system service providers, and other ICT/OT-related service providers,
  alternative storage sites are considered within an enterprise’s supply chain
  network. Enterprises should apply appropriate cybersecurity supply chain
  controls to those storage sites.
