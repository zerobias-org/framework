id: 8a6f3710-f5b0-43e0-8225-4626735fdea7
externalId: SC-18(2)
name: Mobile Code | Acquisition, Development, and Use
description: The enterprise should employ rigorous supply chain protection
  techniques in the acquisition, development, and use of mobile code to be
  deployed in the information system. Examples include ensuring that mobile code
  originates from vetted sources when acquired, that vetted system integrators
  are used for the development of custom mobile code or prior to installing, and
  that verification processes are in place for acceptance criteria prior to
  installation in order to verify the source and integrity of code. Note that
  mobile code can be both code for the underlying information systems and
  networks (e.g., RFID device applications) or for information systems and
  components.
elementType: control
