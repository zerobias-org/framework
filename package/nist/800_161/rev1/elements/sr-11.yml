externalId: SR-11
name: Component Authenticity
description: The development of anti-counterfeit policies and procedures
  requires input from and coordination with acquisition, information technology,
  IT security, legal, and the C-SCRM PMO. The policy and procedures should
  address regulatory compliance requirements, contract requirements or clauses,
  and counterfeit reporting processes to enterprises, such as GIDEP and/or other
  appropriate enterprises. Where applicable and appropriate, the policy should
  also address the development and use of a qualified bidders list (QBL) and/or
  qualified manufacturers list (QML). This helps prevent counterfeits through
  the use of authorized suppliers, wherever possible, and their integration into
  the organization’s supply chain [CISA SCRM WG3]. Departments and agencies
  should refer to Appendix F to implement this guidance in accordance with
  Executive Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
