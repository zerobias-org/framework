id: 4074b7d9-ea48-4f17-a9aa-4fb646c5c889
externalId: AC-20(3)
name: Use of External Systems | Non-organizationally Owned Systems — Restricted Use
description: Devices that do not belong to the enterprise (e.g., bring your own
  device [BYOD] policies) increase the enterprise’s exposure to cybersecurity
  risks throughout the supply chain. This includes devices used by suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers. Enterprises should review the use of
  non-enterprise devices by non-enterprise personnel and make a risk-based
  decision as to whether it will allow the use of such devices or furnish
  devices. Enterprises should furnish devices to those nonenterprise personnel
  who present unacceptable levels of risk.
elementType: control
