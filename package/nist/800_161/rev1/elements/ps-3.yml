id: b29aa7a9-54e3-47f3-bd3b-6523fb4a9d8f
externalId: PS-3
name: Personnel Screening
description: To mitigate insider threat risk, personnel screening policies and
  procedures should be extended to any contractor personnel with authorized
  access to information systems, system components, or information system
  services. Continuous monitoring activities should be commensurate with the
  contractor’s level of access to sensitive, classified, or regulated
  information and should be consistent with broader enterprise policies.
  Screening requirements should be incorporated into agreements and flow down to
  sub-tier contractors
elementType: control
