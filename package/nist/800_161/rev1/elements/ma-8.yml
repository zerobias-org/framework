id: a2c55c01-5ee4-45ae-8a83-ed192887ecbd
externalId: MA-8
name: Maintenance Monitoring and Information Sharing
description: Tracking the failure rates of components provides useful
  information to the acquirer to help plan for contingencies, alternative
  sources of supply, and replacements. Failure rates are also useful for
  monitoring the quality and reliability of systems and components. This
  information provides useful feedback to suppliers, developers, system
  integrators, external system service providers, and other ICT/OT-related
  service providers for corrective action and continuous improvement. In Level
  2, agencies should track and communicate the failure rates to suppliers (OEM
  and/or an authorized distributor). The failure rates and the issues that can
  indicate failures, including root causes, should be identified by an
  enterprise’s technical personnel (e.g., developers, administrators, or
  maintenance engineers) in Level 3 and communicated to Level 2. These
  individuals are able to verify the problem and identify technical
  alternatives.
elementType: control
