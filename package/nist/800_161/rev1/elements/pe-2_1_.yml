id: fc7198bb-0d6e-4d7d-aed7-19749d188284
externalId: PE-2(1)
name: Physical Access Authorizations | Access by Position or Role
description: Role-based authorizations for physical access should include
  federal (e.g., agency/department employees) and non-federal employees (e.g.,
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers). When role-based authorization is
  used, the type and level of access allowed for that role or position must be
  pre-established and documented.
elementType: control
