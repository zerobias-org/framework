externalId: PM-12
name: Insider Threat Program
description: An insider threat program should include C-SCRM and be tailored for
  both federal and non-federal agency individuals who have access to agency
  systems and networks. This control applies to contractors and subcontractors
  and should be implemented throughout the SDLC.
elementType: control
