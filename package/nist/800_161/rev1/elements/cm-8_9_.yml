id: 56b1e15b-3e67-4613-aef7-fb621ad2db6d
externalId: CM-8(9)
name: System Component Inventory | Assignment of Components to Systems
description: When assigning components to systems, the enterprise should ensure
  that the information systems and networks with all relevant components are
  inventoried, marked, and properly assigned. This facilitates quick inventory
  of all components relevant to information systems and networks and enables
  tracking of components that are considered critical and require
  differentiating treatment as part of the information system and network
  protection activities.
elementType: control
