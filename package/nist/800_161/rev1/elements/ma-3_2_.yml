id: 6f572b06-20ee-497b-ab01-f936746f1000
externalId: MA-3(2)
name: Maintenance Tools | Inspect Media
description: The enterprise should verify that the media containing diagnostic
  and test programs that suppliers use on the enterprise’s information systems
  operates as expected and provides only required functions. The use of media
  from maintenance tools should be consistent with the enterprise’s policies and
  procedures and pre-approved. Enterprises should also ensure that the
  functionality does not exceed that which was agreed upon.
elementType: control
