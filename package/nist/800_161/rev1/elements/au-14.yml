id: 2e151d98-bead-41d9-b1c9-3320a3e263a3
externalId: AU-14
name: Session Audit
description: "Enterprises should include non-federal contract employees in
  session audits to identify security risks in the supply chain. Enterprises
  should require their prime contractors to implement this control and flow down
  this requirement to relevant sub-tier contractors. Departments and agencies
  should refer to Appendix F to implement this guidance in accordance with
  Executive Order\r

  14028, Improving the Nation’s Cybersecurity."
elementType: control
