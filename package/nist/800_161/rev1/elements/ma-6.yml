id: c2ec5f74-da75-421f-944f-2816d4481ebb
externalId: MA-6
name: Timely Maintenance
description: The enterprise should purchase spare parts, replacement parts, or
  alternative sources through original equipment manufacturers (OEMs),
  authorized distributors, or authorized resellers and ensure appropriate lead
  times. If OEMs are not available, it is preferred to acquire from authorized
  distributors. If an OEM or an authorized distributor is not available, then it
  is preferred to acquire from an authorized reseller. Enterprises should obtain
  verification on whether the distributor or reseller is authorized. Where
  possible, enterprises should use an authorized distributor/dealer approved
  list. If the only alternative is to purchase from a non-authorized distributor
  or secondary market, a risk assessment should be performed, including
  revisiting the criticality and threat analysis to identify additional risk
  mitigations to be used. For example, the enterprise should check the supply
  source for a history of counterfeits, inappropriate practices, or a criminal
  record. See Section 2 for criticality and threat analysis details. The
  enterprise should maintain a bench stock of critical OEM parts, if feasible,
  when the acquisition of such parts may not be accomplished within needed
  timeframes.
elementType: control
