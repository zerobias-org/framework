id: effaf1c9-9cbd-4641-8585-1b1952a53b35
externalId: AC-3
name: Access Enforcement
description: Ensure that the information systems and the supply chain have
  appropriate access enforcement mechanisms in place. This includes both
  physical and logical access enforcement mechanisms, which likely work in
  coordination for supply chain needs. Enterprises should ensure that a defined
  consequence framework is in place to address access control violations.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors. Departments
  and agencies should refer to Appendix F to implement this guidance in
  accordance with Executive Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
