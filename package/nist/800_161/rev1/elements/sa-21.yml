id: 42d83466-625c-4150-b4e3-fbc3ca56965d
externalId: SA-21
name: Developer Screening
description: The enterprise should implement screening processes for their
  internal developers. For system integrators who may be providing key
  developers that address critical components, the enterprise should ensure that
  appropriate processes for developer screening have been used. The screening of
  developers should be included as a contractual requirement and be a flow-down
  requirement to relevant sub-level subcontractors who provide development
  services or who have access to the development environment.
elementType: control
