id: 13101a9e-c93a-42cb-bb91-7cb876deea73
externalId: CP-3
name: Contingency Training
description: Enterprises should ensure that critical suppliers are included in
  contingency training. Enterprises should require their prime contractors to
  implement this control and flow down this requirement to relevant sub-tier
  contractors. Departments and agencies should refer to Appendix F to implement
  this guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
