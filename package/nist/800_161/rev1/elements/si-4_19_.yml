id: f0fb7051-049f-4fae-90c8-556dc77c36d2
externalId: SI-4(19)
name: System Monitoring | Risk for Individuals
description: Persons identified as being of higher risk may include enterprise
  employees, contractors, and other third parties (e.g., volunteers, visitors)
  who may have the need or ability to access to an enterprise’s system, network,
  or system environment. The enterprise may implement enhanced oversight of
  these higher-risk individuals in accordance with policies, procedures, and –
  if relevant – terms of an agreement and in coordination with appropriate
  officials.
elementType: control
