name: Incident Response Assistance | Coordination with External Providers
description: The enterprise’s agreements with prime contractors should specify
  the conditions under which a government-approved or -designated third party
  would be available or may be required to provide assistance with incident
  response, as well as the role and responsibility of that third party.
