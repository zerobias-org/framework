id: 0760c417-27aa-4885-a5c7-64a6cefb28cd
externalId: RA-5(3)
name: Vulnerability Monitoring and Scanning | Breadth and Depth of Coverage
description: Enterprises that monitor the supply chain for vulnerabilities
  should express the breadth of monitoring based on the criticality and/or risk
  profile of the supplier or product/component and the depth of monitoring based
  on the level of the supply chain at which the monitoring takes place (e.g.,
  sub-supplier). Where possible, a component inventory (e.g., hardware,
  software) may aid enterprises in capturing the breadth and depth of the
  products/components within their supply chain that may need to be monitored
  and scanned for vulnerabilities
elementType: control
