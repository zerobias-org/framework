id: 527937ff-ab5b-4a55-9d40-335e721b66fa
externalId: CM-8(7)
name: System Component Inventory | Centralized Repository
description: Enterprises may choose to implement centralized inventories that
  include components from all enterprise information systems, networks, and
  their components. Centralized repositories of inventories provide
  opportunities for efficiencies in accounting for information systems,
  networks, and their components. Such repositories may also help enterprises
  rapidly identify the location and responsible individuals of components that
  have been compromised, breached, or are otherwise in need of mitigation
  actions. The enterprise should ensure that centralized inventories include the
  supply chain-specific information required for proper component accountability
  (e.g., supply chain relevance and information system, network, or component
  owner).
elementType: control
