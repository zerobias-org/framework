id: 730b86a5-679c-46a0-a84e-be3927fe39d0
externalId: MA-5
name: Maintenance Personnel
description: Maintenance personnel may be employed by suppliers, developers,
  system integrators, external system service providers, or other ICT/OT-related
  service providers. As such, appropriate protections should be in place to
  manage associated risks. The same controls applied to internal maintenance
  personnel should be applied to any contractor personnel who performs a similar
  maintenance role and enforced through contractual agreements with their
  external service providers.
elementType: control
