id: 8f556880-4ea2-4087-a266-459a0c5b183e
externalId: SR-9
name: Tamper Resistance and Detection
description: Enterprises should apply tamper resistance and detection control to
  critical components, at a minimum. Criticality analysis can help determine
  which components are critical. See Section 2, Appendix C, and RA-9 for
  guidance on conducting criticality analysis. The C-SCRM PMO can help identify
  critical components, especially those that are used by multiple missions,
  functions, and systems within an enterprise. Departments and agencies should
  refer to Appendix F to implement this guidance in accordance with Executive
  Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
