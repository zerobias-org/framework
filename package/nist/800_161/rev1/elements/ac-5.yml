id: 79dbb4d3-6e5b-4eb9-bd61-58ab48f17b5f
externalId: AC-5
name: Separation of Duties
description: "The enterprise should ensure that an appropriate separation of
  duties is established for decisions that require the acquisition of both
  information system and supply chain components. The separation of duties helps
  to ensure that adequate protections are in place for components entering the
  enterprise’s supply chain, such as denying developers the privilege to promote
  code that they\r

  wrote from development to production environments. Enterprises should require
  their prime contractors to implement this control and flow down this
  requirement to relevant sub-tier contractors. Departments and agencies should
  refer to Appendix F to implement this guidance in accordance with Executive
  Order 14028, Improving the Nation’s Cybersecurity"
elementType: control
