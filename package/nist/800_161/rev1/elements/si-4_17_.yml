id: ca78477b-404d-4024-9be4-7553540d6521
externalId: SI-4(17)
name: System Monitoring | Integrated Situational Awareness
description: System monitoring information may be correlated with that of
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers, if appropriate. The results of
  correlating monitoring information may point to supply chain cybersecurity
  vulnerabilities that require mitigation or compromises.
elementType: control
