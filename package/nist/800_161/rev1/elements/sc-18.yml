name: Transmission Confidentiality and Integrity
description: The enterprise should use this control in various applications of
  mobile code within their information systems and networks. Examples include
  acquisition processes such as the electronic transmission of supply chain
  information (e.g., email), the receipt of software components, logistics
  information management in RFID, or transport sensors infrastructure.
