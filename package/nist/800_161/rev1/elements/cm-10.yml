id: 286c2466-0864-4f44-b7f5-8fc5a57656ec
externalId: CM-10
name: Software Usage Restrictions
description: Enterprises should ensure that licenses for software used within
  their information systems and networks are documented, tracked, and
  maintained. Tracking mechanisms should provide for the ability to trace users
  and the use of licenses to access control information and processes. As an
  example, when an employee is terminated, a “named user” license should be
  revoked, and the license documentation should be updated to reflect this
  change. Departments and agencies should refer to Appendix F to implement this
  guidance in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
