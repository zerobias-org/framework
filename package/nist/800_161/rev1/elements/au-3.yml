id: 65da86b6-f87a-4201-b671-386062bd1126
externalId: AU-3
name: Content of Audit Records
description: "The audit records of a supply chain event should be securely
  handled and maintained in a manner that conforms to record retention
  requirements and preserves the integrity of the findings and the
  confidentiality of the record information and its sources as appropriate. In
  certain instances, such records may be used in administrative or legal
  proceedings. Enterprises should require their\r

  prime contractors to implement this control and flow down this requirement to
  relevant sub-tier contractors. Departments and agencies should refer to
  Appendix F to implement this guidance in accordance with Executive Order
  14028, Improving the Nation’s Cybersecurity."
elementType: control
