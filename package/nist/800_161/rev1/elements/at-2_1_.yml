name: Literacy Training and Awareness | Practical Exercises
description: Enterprises should provide practical exercises in literacy training
  that simulate supply chain cybersecurity events and incidents. Enterprises
  should require their prime contractors to implement this control and flow down
  this requirement to relevant sub-level contractors.
