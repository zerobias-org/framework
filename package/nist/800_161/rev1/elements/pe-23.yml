externalId: PE-23
name: Facility Location
description: Enterprises should incorporate the facility location (e.g., data
  centers) when assessing risks associated with suppliers. Factors may include
  geographic location (e.g., Continental United States [CONUS], Outside the
  Continental United States [OCONUS]), physical protections in place at one or
  more of the relevant facilities, local management and control of such
  facilities, environmental hazard potential (e.g., located in a high-risk
  seismic zone), and alternative facility locations. Enterprises should also
  assess whether the location of a manufacturing or distribution center could be
  influenced by geopolitical, economic, or other factors. For critical vendors
  or products, enterprises should specifically address any requirements or
  restrictions concerning the facility locations of the vendors (or their
  upstream supply chain providers) in contracts and flow down this requirement
  to relevant sub-level contractors.
elementType: control
