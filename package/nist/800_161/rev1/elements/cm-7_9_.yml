id: 3d7ba6f0-ddd2-4fa9-a343-276d52f84fd1
externalId: CM-7(9)
name: Least Functionality | Prohibiting The Use of Unauthorized Hardware
description: Enterprises should define requirements and deploy appropriate
  processes to specify and detect hardware that is not allowed. This can be
  aided by defining a requirement to, at a minimum, not use disreputable or
  unauthorized hardware. Enterprises should require their prime contractors to
  implement this control and flow down this requirement to relevant sub-tier
  contractors
elementType: control
