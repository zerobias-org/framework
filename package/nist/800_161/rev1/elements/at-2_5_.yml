id: 8c0539ed-08c0-490f-b8f6-0de84d827c30
externalId: AT-2(5)
name: Literacy Training and Awareness | Advanced Persistent Threat
description: Provide literacy training on recognizing suspicious communications
  on an advanced persistent threat (APT) in the enterprise’s supply chain.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-level contractors.
elementType: control
