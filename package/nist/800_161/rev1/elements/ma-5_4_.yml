id: 4142bf3a-671d-4557-9945-548dde6c3db9
externalId: MA-5(4)
name: Maintenance Personnel | Foreign Nationals
description: The vetting of foreign nationals with access to critical
  non-national security systems/services must take C-SCRM into account and be
  extended to all relevant contractor personnel. Enterprises should specify in
  agreements any restrictions or vetting requirements that pertain to foreign
  nationals and flow the requirements down to relevant subcontractors.
elementType: control
