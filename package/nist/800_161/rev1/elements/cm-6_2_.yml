id: e0b09b78-2578-4259-ad48-19a80ce01f3e
externalId: CM-6(2)
name: Configuration Settings | Respond to Unauthorized Changes
description: "The enterprise should ensure that designated security or IT
  personnel are alerted to unauthorized changes to configuration settings. When
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers are\r

  responsible for such unauthorized changes, this qualifies as a C-SCRM incident
  that should be recorded and tracked to monitor trends. For a more
  comprehensive view, a specific, predefined set of C-SCRM stakeholders should
  assess the impact of unauthorized changes in the supply chain. When impact is
  assessed, relevant stakeholders should help define and implement appropriate
  mitigation strategies to ensure a comprehensive resolution."
elementType: control
