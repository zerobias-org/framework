id: e3b95a76-2c18-4f6e-a34b-c6e9ec78bedc
externalId: CM-4
name: Impact Analyses
description: Enterprises should take changes to the information system and
  underlying or interoperable systems and networks under consideration to
  determine whether the impact of these changes affects existing security
  controls and warrants additional or different protection to maintain an
  acceptable level of cybersecurity risk throughout the supply chain. Ensure
  that stakeholders, such as system engineers and system security engineers, are
  included in the impact analysis activities to provide their perspectives for
  C-SCRM. NIST SP 800-53, Rev. 5 control enhancement CM-4 (1) is a mechanism
  that can be used to protect the information system from vulnerabilities that
  may be introduced through the test environment.
elementType: control
