externalId: PM-26
name: Complaint Management
description: Complaint management process and mechanisms should be protected
  from cybersecurity risks throughout the supply chain. Enterprises should also
  integrate C-SCRM security and privacy controls when fielding complaints from
  vendors or the general public (e.g., departments and agencies fielding
  inquiries related to exclusions and removals).
elementType: control
