id: f1467a5a-e720-41c6-a23c-7c01aa10631a
externalId: IR-9
name: Information Spillage Response
description: The supply chain is vulnerable to information spillage. The
  enterprise should include supply chain-related information spills in its
  information spillage response plan. This may require coordination with
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers. The details of how this
  coordination is to be conducted should be included in the agreement (e.g.,
  contract). Enterprises should require their prime contractors to implement
  this control and flow down this requirement to relevant sub-tier contractors.
elementType: control
