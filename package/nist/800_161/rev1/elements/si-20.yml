id: 722e0f27-bf55-4173-ad71-ef01e4fdb048
externalId: SI-20
name: Tainting
description: Suppliers, developers, system integrators, external system service
  providers, and other ICT/OT-related service providers may have access to the
  sensitive information of a federal agency. In this instance, enterprises
  should require their prime contractors to implement this control and flow down
  this requirement to relevant sub-tier contractors.
elementType: control
