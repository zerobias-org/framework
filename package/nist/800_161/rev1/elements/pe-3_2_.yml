id: 690340ac-da69-4167-8f6d-022d110cc561
externalId: PE-3(2)
name: Physical Access Control | Facility and Systems
description: When determining the extent, frequency, and/or randomness of
  security checks of facilities, enterprises should account for exfiltration
  risks that result from covert listening devices. Such devices may include
  wiretaps, roving bugs, cell site simulators, and other eavesdropping
  technologies that can transfer sensitive information out of the enterprise.
elementType: control
