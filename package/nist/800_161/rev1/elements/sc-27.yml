externalId: SC-27
name: Platform-independent Applications
description: The use of trusted platform-independent applications is essential
  to CSCRM. The enhanced portability of platform-independent applications
  enables enterprises to switch external service providers more readily in the
  event that one becomes compromised, thereby reducing vendor-dependent
  cybersecurity risks. This is especially relevant for critical applications on
  which multiple systems may rely
elementType: control
