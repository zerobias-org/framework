name: Testing, Training, and Monitoring
description: The enterprise should implement a process to ensure that
  organizational plans for conducting supply chain risk testing, training, and
  monitoring activities associated with organizational systems are maintained.
  The C-SCRM PMO can provide guidance and support on how to integrate C-SCRM
  into testing, training, and monitoring plans.
