id: 3625967c-6d11-4eca-8019-189a3f1cdabd
externalId: IA-9
name: Service Identification and Authentication
description: Enterprises should ensure that identification and authentication
  are defined and managed for access to services (e.g., web applications using
  digital certificates, services or applications that query a database as
  opposed to labor services) throughout the supply chain. Enterprises should
  ensure that they know what services are being procured and from whom. Services
  procured should be listed on a validated list of services for the enterprise
  or have compensating controls in place. Enterprises should require their prime
  contractors to implement this control and flow down this requirement to
  relevant sub-tier contractors. Departments and agencies should refer to
  Appendix F to implement this guidance in accordance with Executive Order
  14028, Improving the Nation’s Cybersecurity.
elementType: control
