id: eeb2f4ac-2439-47b5-be72-2cd794fdf60c
externalId: AT-2(2)
name: Literacy Training and Awareness | Insider Threat
description: Enterprises should provide literacy training on recognizing and
  reporting potential indicators of insider threat within the supply chain.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors.
elementType: control
