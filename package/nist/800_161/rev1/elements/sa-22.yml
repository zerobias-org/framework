id: d84afc9d-2b31-4df0-bb6a-8039d1e9b9aa
externalId: SA-22
name: Unsupported System Components
description: Acquiring products directly from qualified original equipment
  manufacturers (OEMs) or their authorized distributors and resellers reduces
  cybersecurity risks in the supply chain. In the case of unsupported system
  components, the enterprise should use authorized resellers or distributors
  with an ongoing relationship with the supplier of the unsupported system
  components. When purchasing alternative sources for continued support,
  enterprises should acquire directly from vetted original equipment
  manufacturers (OEMs) or their authorized distributors and resellers. Decisions
  about using alternative sources require input from the enterprise’s
  engineering resources regarding the differences in alternative component
  options. For example, if an alternative is to acquire an open source software
  component, the enterprise should identify the open source community
  development, test, acceptance, and release processes. Departments and agencies
  should refer to Appendix F to implement this guidance in accordance with
  Executive Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
