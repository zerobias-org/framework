name: Security and Privacy Groups and Associations
description: Contact with security and privacy groups and associations should
  include C-SCRM practitioners and those with C-SCRM responsibilities.
  Acquisition, legal, critical infrastructure, and supply chain groups and
  associations should be incorporated. The C-SCRM PMO can help identify agency
  personnel who could benefit from participation, specific groups to participate
  in, and relevant topics.
elementType: control
