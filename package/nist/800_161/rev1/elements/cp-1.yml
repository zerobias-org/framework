id: 9f344841-2e78-4eec-b21c-0280ea563bcc
externalId: CP-1
name: Policy and Procedures
description: "Enterprises should integrate C-SCRM into the contingency planning
  policy and related SCRM Strategy/Implementation Plan, policies, and SCRM Plan.
  The policy should cover information systems and the supply chain network and,
  at a minimum, address scenarios such as:\r

  a. Unplanned component failure and subsequent replacement;\r

  b. Planned replacement related to feature improvements, maintenance, upgrades,
  and modernization; and\r

  c. Product and/or service disruption."
elementType: control
