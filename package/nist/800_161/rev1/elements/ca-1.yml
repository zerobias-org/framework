id: 10e3459e-dda1-4bba-a6d1-a743c58b780a
externalId: CA-1
name: Policy and Procedures
description: Integrate the development and implementation of assessment and
  authorization policies and procedures for supply chain cybersecurity into the
  control assessment and authorization policy and related C-SCRM
  Strategy/Implementation Plan(s), policies, and system-level plans. To address
  cybersecurity risks throughout the supply chain, enterprises should develop a
  C-SCRM policy (or, if required, integrate into existing policies) to direct
  C-SCRM activities for control assessment and authorization. The C-SCRM policy
  should define C-SCRM roles and responsibilities within the enterprise for
  conducting control assessment and authorization, any dependencies among those
  roles, and the interaction among the roles. Enterprise-wide security and
  privacy risks should be assessed on an ongoing basis and include supply chain
  risk assessment results.
elementType: control
