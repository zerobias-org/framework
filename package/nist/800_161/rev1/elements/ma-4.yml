externalId: MA-4
name: Nonlocal Maintenance
description: Nonlocal maintenance may be provided by contractor personnel.
  Appropriate protections should be in place to manage associated risks.
  Controls applied to internal maintenance personnel are applied to any
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers performing a similar maintenance
  role and enforced through contractual agreements with their external service
  providers.
elementType: control
