id: ef00ff4c-3b35-486f-ade4-ed32e7d8fc21
externalId: CP-2(8)
name: Contingency Plan | Identify Critical Assets
description: Ensure that critical assets (including hardware, software, and
  personnel) are identified and that appropriate contingency planning
  requirements are defined and applied to ensure the continuity of operations. A
  key step in this process is to complete a criticality analysis on components,
  functions, and processes to identify all critical assets. See Section 2 and
  NISTIR 8179 for additional guidance on criticality analyses.
elementType: control
