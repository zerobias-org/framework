externalId: RA-9
name: Criticality Analysis
description: "Enterprises should complete a criticality analysis as a
  prerequisite input to assessments of cybersecurity supply chain risk
  management activities. First, enterprises should complete a criticality
  analysis as part of the Frame step of the C-SCRM Risk Management Process.
  Then, findings generated in the Assess step activities (e.g., criticality
  analysis, threat analysis, vulnerability analysis, and mitigation strategies)
  update and tailor the criticality analysis. A symbiotic relationship exists
  between the criticality analysis and other Assess step activities in that they
  inform and enhance one another. For a highquality criticality analysis,
  enterprises should employ it iteratively throughout the SLDC and concurrently
  across the three levels. Enterprises should require their prime contractors to
  implement this control and flow down this requirement to relevant sub-tier
  contractors. Departments and agencies should also refer to Appendix F to
  supplement this guidance in accordance with Executive Order 14028, Improving
  the\r

  Nation’s Cybersecurity."
elementType: control
