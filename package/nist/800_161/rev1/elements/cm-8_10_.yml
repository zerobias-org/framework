id: 31ab131a-b7f3-4ef8-a166-f2be5199ee75
externalId: CM-8(10)
name: System Component Inventory | SBOMs for Open Source Projects
description: If an enterprise uses an open source project that does not have an
  SBOM and the enterprise requires one, the enterprise will need to 1)
  contribute SBOM generation to the open source project, 2) contribute resources
  to the project to add this capability, or 3) generate an SBOM on their first
  consumption of each version of the open source project that they use.
elementType: control
