id: fd787648-6bbb-45ee-b629-3e4845ca6087
externalId: AT-3(2)
name: Role-based Training | Physical Security Controls
description: C-SCRM is impacted by a number of physical security mechanisms and
  procedures within the supply chain, such as manufacturing, shipping,
  receiving, physical access to facilities, inventory management, and
  warehousing. Enterprise and system integrator personnel who provide
  development and operational support to the enterprise should receive training
  on how to handle these physical security mechanisms and on the associated
  cybersecurity risks throughout the supply chain.
elementType: control
