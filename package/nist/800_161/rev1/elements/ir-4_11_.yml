id: 95199066-d055-4534-8de2-41b282b5d953
externalId: IR-4(11)
name: Incident Handling | Integrated Incident Response Team
description: An enterprise should include a forensics team and/or capability as
  part of an integrated incident response team for supply chain incidents. Where
  relevant and practical, integrated incident response teams should also include
  necessary geographical representation as well as suppliers, developers, system
  integrators, external system service providers, and other ICT/OT-related
  service providers.
elementType: control
