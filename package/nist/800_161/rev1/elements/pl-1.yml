externalId: PL-1
name: Policy and Procedures
description: The security planning policy and procedures should integrate
  C-SCRM. This includes creating, disseminating, and updating the security
  policy, operational policy, and procedures for C-SCRM to shape acquisition or
  development requirements and the follow-on implementation, operations, and
  maintenance of systems, system interfaces, and network connections. The C-SCRM
  policy and procedures provide inputs into and take guidance from the C-SCRM
  Strategy and Implementation Plan at Level 1 and the System Security Plan and
  C-SCRM plan at Level 3. In Level 3, ensure that the full SDLC is covered from
  the C-SCRM perspective.
elementType: control
