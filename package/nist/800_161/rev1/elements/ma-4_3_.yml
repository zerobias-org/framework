id: 937bbeef-63e7-4c7b-920a-84099e994d2c
externalId: MA-4(3)
name: Nonlocal Maintenance | Comparable Security and Sanitization
description: "Should suppliers, developers, system integrators, external system
  service providers, or other ICT/OT-related service providers perform any
  nonlocal maintenance or diagnostic services on systems or system components,
  the enterprise should ensure that:\r

  • Appropriate measures are taken to verify that the nonlocal environment meets
  appropriate security levels for maintenance and diagnostics per agreements
  between the enterprise and vendor;\r

  • Appropriate levels of sanitizing are completed to remove any
  enterprise-specific data residing in components; and\r

  • Appropriate diagnostics are completed to ensure that components are
  sanitized, preventing malicious insertion prior to returning to the enterprise
  system or supply chain network. The enterprise should require its prime
  contractors to implement this control and flow down this requirement to
  relevant sub-tier contractors"
elementType: control
