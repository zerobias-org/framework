id: 31f5027e-be01-4de5-b814-fea66cb6f0c2
externalId: PS-6
name: Access Agreements
description: "The enterprise should define and document access agreements for
  all contractors or other external personnel who may need to access the
  enterprise’s data, systems, or network, whether physically or logically.
  Access agreements should state the appropriate level and method of access to
  the information system and supply chain network. Additionally, terms of access
  should be consistent with the enterprise’s information security policy and may
  need to specify additional restrictions, such as allowing access during
  specific timeframes, from specific locations, or only by personnel who have
  satisfied additional vetting requirements. The enterprise should deploy audit
  mechanisms to review, monitor, update, and track access by these parties in
  accordance with the access agreement. As personnel vary over time, the
  enterprise should implement a timely and rigorous personnel security update
  process for the access agreements. \r

  \r

  When information systems and network products and services are provided by an
  entity within the enterprise, there may be an existing access agreement in
  place. When such an agreement does not exist, it should be established.\r

  \r

  NOTE: While the audit mechanisms may be implemented in Level 3, the agreement
  process with required updates should be implemented at Level 2 as a part of
  program management activities.\r

  \r

  The enterprise should require its prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors"
elementType: control
