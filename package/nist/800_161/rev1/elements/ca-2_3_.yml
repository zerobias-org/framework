externalId: CA-2(3)
name: Control Assessments | Leveraging Results from External Organizations
description: For C-SCRM, enterprises should use external security assessments
  for suppliers, developers, system integrators, external system service
  providers, and other ICT/OTrelated service providers. External assessments
  include certifications, third-party assessments, and – in the federal context
  – prior assessments performed by other departments and agencies.
  Certifications from the International Enterprise for Standardization (ISO),
  the National Information Assurance Partnership (Common Criteria), and the Open
  Group Trusted Technology Forum (OTTF) may also be used by non-federal and
  federal enterprises alike, if such certifications meet agency needs.
elementType: control
