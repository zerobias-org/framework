id: 6adfaf38-f8dd-4c68-a22c-7b8366763b62
externalId: SR-7
name: Supply Chain Operations Security
description: The C-SCRM PMO can help determine OPSEC controls that apply to
  specific missions and functions. OPSEC controls are particularly important
  when there is specific concern about an adversarial threat from or to the
  enterprise’s supply chain or an element within the supply chain, or when the
  nature of the enterprise’s mission or business operations, its information,
  and/or its service/product offerings make it a more attractive target for an
  adversarial threat.
elementType: control
