externalId: IA-2
name: Identification and Authentication (organizational Users)
description: Enterprises should ensure that identification and requirements are
  defined and applied for enterprise users accessing an ICT/OT system or supply
  chain network. An enterprise user may include employees, individuals deemed to
  have the equivalent status of employees (e.g., contractors, guest researchers,
  etc.), and system integrators fulfilling contractor roles. Criteria such as
  “duration in role” can aid in defining which identification and authentication
  mechanisms are used. The enterprise may choose to define a set of roles and
  associate a level of authorization to ensure proper implementation.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors. Departments
  and agencies should refer to Appendix F to implement this guidance in
  accordance with Executive Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
