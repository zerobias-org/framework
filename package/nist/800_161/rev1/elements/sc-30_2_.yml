id: ee7dce21-208d-44d7-89a4-b190ec0fc856
externalId: SC-30(2)
name: Concealment and Misdirection | Randomness
description: Supply chain processes are necessarily structured with predictable,
  measurable, and repeatable processes for the purpose of efficiency and cost
  reduction. This opens up the opportunity for potential breach. In order to
  protect against compromise, the enterprise should employ techniques to
  introduce randomness into enterprise operations and assets in the enterprise’s
  systems or networks (e.g., randomly switching among several delivery
  enterprises or routes, or changing the time and date of receiving supplier
  software updates if previously predictably scheduled).
elementType: control
