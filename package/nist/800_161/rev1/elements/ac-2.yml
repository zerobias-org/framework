id: 9afcc3dd-ce5e-4bd0-8fed-9892107d5526
externalId: AC-2
name: Account Management
description: Use of this control helps establish traceability of actions and
  actors in the supply chain. This control also helps ensure access
  authorizations of actors in the supply chain is appropriate on a continuous
  basis. The enterprise may choose to define a set of roles and associate a
  level of authorization to ensure proper implementation. Enterprises must
  ensure that accounts for contractor personnel do not exceed the period of
  performance of the contract. Privileged accounts should only be established
  for appropriately vetted contractor personnel. Enterprises should also have
  processes in place to establish and manage temporary or emergency accounts for
  contractor personnel that require access to a mission-critical or
  mission-enabling system during a continuity or emergency event. For example,
  during a pandemic event, existing contractor personnel who are not able to
  work due to illness may need to be temporarily backfilled by new contractor
  staff. Enterprises should require their prime contractors to implement this
  control and flow down this requirement to relevant sub-tier contractors.
  Departments and agencies should refer to Appendix F to implement this guidance
  in accordance with Executive Order 14028, Improving the Nation’s
  Cybersecurity.
elementType: control
