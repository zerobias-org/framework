id: f1ff360d-9bc7-4069-849e-8405a7fb6d6c
externalId: IA-8
name: Identification and Authentication (non-organizational Users)
description: Suppliers, developers, system integrators, external system service
  providers, and other ICT/OT-related service providers have the potential to
  engage the enterprise’s supply chain for service delivery (e.g.,
  development/integration services, product support, etc.). Enterprises should
  manage the establishment, auditing, use, and revocation of identification
  credentials and the authentication of non-enterprise users within the supply
  chain. Enterprises should also ensure promptness in performing identification
  and authentication activities, especially in the case of revocation
  management, to help mitigate exposure to cybersecurity risks throughout the
  supply chain such as those that arise due to insider threats.
elementType: control
