id: b6312e01-5cef-4059-81b5-5f1256162264
externalId: PM-32
name: Purposing
description: Extending systems assigned to support specific mission or business
  functions beyond their initial purpose subjects those systems to unintentional
  risks, including cybersecurity risks throughout the supply chain. The
  application of this control should include the explicit incorporation of
  cybersecurity supply chain exposures.
elementType: control
