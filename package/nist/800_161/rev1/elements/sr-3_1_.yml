id: 0ff63a3d-a846-4299-92d4-5aa7aaa90066
externalId: SR-3(1)
name: Supply Chain Controls and Processes | Diverse Supply Base
description: Enterprises should diversify their supply base, especially for
  critical ICT/OT products and services. As a part of this exercise, the
  enterprise should attempt to identify single points of failure and risk among
  primes and lower-level entities in the supply chain. See Section 2, Appendix
  C, and RA-9 for guidance on conducting criticality analysis.
elementType: control
