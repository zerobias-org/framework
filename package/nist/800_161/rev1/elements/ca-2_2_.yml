externalId: CA-2(2)
name: Control Assessments | Specialized Assessments
description: Enterprises should use a variety of assessment techniques and
  methodologies, such as continuous monitoring, insider threat assessment, and
  malicious user assessment. These assessment mechanisms are context-specific
  and require the enterprise to understand its supply chain and to define the
  required set of measures for assessing and verifying that appropriate
  protections have been implemented.
elementType: control
