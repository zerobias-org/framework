id: 0542ec1a-6380-4bbb-9671-7a721babf86c
externalId: AT-3
name: Role-based Training
description: Addressing cyber supply chain risks throughout the acquisition
  process is essential to performing C-SCRM effectively. Personnel who are part
  of the acquisition workforce require training on what C-SCRM requirements,
  clauses, and evaluation factors are necessary to include when conducting
  procurement and how to incorporate C-SCRM into each acquisition phase. Similar
  enhanced training requirements should be tailored for personnel responsible
  for conducting threat assessments. Responding to threats and identified risks
  requires training in counterintelligence awareness and reporting. Enterprises
  should ensure that developers receive training on secure development practices
  as well as the use of vulnerability scanning tools. Enterprises should require
  their prime contractors to implement this control and flow down this
  requirement to relevant sub-tier contractors. Departments and agencies should
  refer to Appendix F to implement this guidance in accordance with Executive
  Order 14028, Improving the Nation’s Cybersecurity
elementType: control
