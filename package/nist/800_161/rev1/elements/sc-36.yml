id: ded1fd22-d373-4a59-b0fc-ff7264f45c5a
externalId: SC-36
name: Distributed Processing and Storage
description: Processing and storage can be distributed both across the
  enterprise’s systems and networks and across the SDLC. The enterprise should
  ensure that these techniques are applied in both contexts. Development,
  manufacturing, configuration management, test, maintenance, and operations can
  use distributed processing and storage. This control applies to the entity
  responsible for processing and storage functions or related infrastructure, to
  include federal agencies and contractors. As such, this control applies to the
  federal agency and applicable supplier information systems and networks.
  Enterprises should require their prime contractors to implement this control
  and flow down this requirement to relevant sub-tier contractors.
elementType: control
