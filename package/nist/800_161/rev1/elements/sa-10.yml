id: 447fcea3-034f-4c54-a67e-7dba572e1483
externalId: SA-10
name: Developer Configuration Management
description: Developer configuration management is critical for reducing
  cybersecurity risks throughout the supply chain. By conducting configuration
  management activities, developers reduce the occurrence and likelihood of
  flaws while increasing accountability and ownership for the changes. Developer
  configuration management should be performed both by developers internal to
  federal agencies and integrators or external service providers. Departments
  and agencies should refer to Appendix F to implement this guidance in
  accordance with Executive Order 14028, Improving the Nation’s Cybersecurity.
elementType: control
