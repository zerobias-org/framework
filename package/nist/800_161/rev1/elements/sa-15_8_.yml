id: 12c7d1ff-6d09-4e3c-b940-ce39338d9a61
externalId: SA-15(8)
name: Development Process, Standards, and Tools | Reuse of Threat and
  Vulnerability Information
description: This enhancement encourages developers to reuse the threat and
  vulnerability information produced by prior development efforts and lessons
  learned from using the tools to inform ongoing development efforts. Doing so
  will help determine the C-SCRM activities described in Section 2 and Appendix
  C.
elementType: control
