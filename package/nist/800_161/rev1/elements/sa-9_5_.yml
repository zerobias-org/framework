id: b0cc6c02-1429-493a-a271-c65258f68ecf
externalId: SA-9(5)
name: External System Services | Processing, Storage, and Service Location
description: The location may be under the control of the suppliers, developers,
  system integrators, external system service providers, and other
  ICT/OT-related service providers. Enterprises should assess C-SCRM risks
  associated with a given geographic location and apply an appropriate risk
  response, which may include defining locations that are or are not acceptable
  and ensuring that appropriate protections are in place to address associated
  C-SCRM risk.
elementType: control
