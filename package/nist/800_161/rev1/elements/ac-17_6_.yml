id: 8ff8320f-50dc-4b81-ae96-c7db14458d20
externalId: AC-17(6)
name: Remote Access | Protection of Mechanism Information
description: Enterprises should ensure that detailed requirements are properly
  defined and that access to information regarding the information system and
  supply chain is protected from unauthorized use and disclosure. Since supply
  chain data and metadata disclosure or access can have significant implications
  for an enterprise’s mission processes, appropriate measures must be taken to
  vet both the supply chain and personnel processes to ensure that adequate
  protections are implemented. Ensure that remote access to such information is
  included in requirements.
elementType: control
