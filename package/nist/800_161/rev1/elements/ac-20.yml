id: 871efbe3-6127-4cf0-a762-123663ebfd4d
externalId: AC-20
name: Use of External Systems
description: "Enterprises’ external information systems include those of
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers. Unlike in an acquirer’s internal
  enterprise where direct and continuous monitoring is possible, in the external
  supplier relationship, information may be shared on an as-needed basis and
  should be\r

  articulated in an agreement. Access to the supply chain from such external
  information systems should be monitored and audited. Enterprises should
  require their prime contractors to implement this control and flow down this
  requirement to relevant sub-tier contractors."
elementType: control
