id: bc93aa30-b210-4be5-be19-076b6569d55b
externalId: SR-11(3)
name: Component Authenticity | Anti-counterfeit Scanning
description: Enterprises should conduct anti-counterfeit scanning for critical
  components, at a minimum. Criticality analysis can help determine which
  components are critical and should be subjected to this scanning. See Section
  2, Appendix C, and RA-9 for guidance on conducting criticality analysis. The
  C-SCRM PMO can help identify critical components, especially those used by
  multiple missions, functions, and systems within an enterprise.
elementType: control
