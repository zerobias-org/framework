id: eab2ae2a-6c1d-4bdc-991d-c98efcf475da
externalId: SC-37(1)
name: Out-of-band Channels | Ensure Delivery and Transmission
description: The enterprise should employ security safeguards to ensure that
  only specific individuals or information systems receive the information about
  the information system or its development environment and processes. For
  example, proper credentialing and authorization documents should be requested
  and verified prior to the release of critical components, such as custom
  chips, custom software, or information during delivery.
elementType: control
