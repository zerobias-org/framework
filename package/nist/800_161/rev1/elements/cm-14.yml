name: Signed Components
description: Enterprises should verify that the acquired hardware and software
  components are genuine and valid by using digitally signed components from
  trusted certificate authorities. Verifying components before allowing
  installation helps enterprises reduce cybersecurity risks throughout the
  supply chain.
