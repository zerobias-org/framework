id: 6c2b5562-963b-4d6e-b64c-f39d61647490
externalId: AC-24
name: Access Control Decisions
description: Enterprises should assign access control decisions to support
  authorized access to the supply chain. Ensure that if a system integrator or
  external service provider is used, there is consistency in access control
  decision requirements and how the requirements are implemented. This may
  require defining such requirements in service-level agreements, in many cases
  as part of the upfront relationship established between the enterprise and
  system integrator or the enterprise and external service provider. Enterprises
  should require their prime contractors to implement this control and flow down
  this requirement to relevant sub-tier contractors.
elementType: control
