externalId: MA-3(1)
name: Maintenance Tools | Inspect Tools
description: The enterprise should deploy acceptance testing to verify that the
  maintenance tools of the ICT supply chain infrastructure are as expected.
  Maintenance tools should be authorized with appropriate paperwork, verified as
  claimed through initial verification, and tested for vulnerabilities,
  appropriate security configurations, and stated functionality.
elementType: control
