externalId: MP-1
name: Policy and Procedures
description: Various documents and information on a variety of physical and
  electronic media are disseminated throughout the supply chain. This
  information may contain a variety of sensitive information and intellectual
  property from suppliers, developers, system integrators, external system
  service providers, and other ICT/OT-related service providers and should be
  appropriately protected. Media protection policies and procedures should also
  address supply chain concerns, including media in the enterprise’s supply
  chain and throughout the SDLC.
elementType: control
