id: bbcab69b-0884-47fa-a72d-3fc8f64a2829
externalId: IR-4(7)
name: Incident Handling | Insider Threats — Intra-organization Coordination
description: This enhancement helps limit the exposure of C-SCRM information
  systems, networks, and processes to insider threats. Enterprises should ensure
  that insider threat coordination includes suppliers, developers, system
  integrators, external system service providers, and other ICT/OT-related
  service providers.
elementType: control
