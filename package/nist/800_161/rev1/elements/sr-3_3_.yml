id: 27ccaf2b-aa0d-4d24-aa5c-c9aae825f9e3
externalId: SR-3(3)
name: Supply Chain Controls and Processes | Sub-tier Flow Down
description: Enterprises should require their prime contractors to implement
  this control and flow down this requirement to relevant sub-tier contractors
  throughout the SDLC. The use of the acquisition process provides an important
  vehicle to protect the supply chain. As part of procurement requirements,
  enterprises should include the need for suppliers to flow down controls to
  subcontractors throughout the SDLC. As part of market research and analysis
  activities, enterprises should conduct robust due diligence research on
  potential suppliers or products, as well as their upstream dependencies (e.g.,
  fourth- and fifth-party suppliers), which can help enterprises avoid single
  points of failure within their supply chains. The results of this research can
  be helpful in shaping the sourcing approach and refining requirements. An
  evaluation of the cybersecurity risks that arise from a supplier, product, or
  service should be completed prior to the contract award decision to ensure
  that the holistic risk profile is well-understood and serves as a weighted
  factor in award decisions. During the period of performance, suppliers should
  be monitored for conformance to the defined controls and requirements, as well
  as changes in risk conditions. See Section 3 for guidance on the Role of CSCRM
  in the Acquisition Process
elementType: control
