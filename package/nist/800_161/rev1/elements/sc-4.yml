externalId: SC-4
name: Information in Shared System Resources
description: The enterprise may share information system resources with system
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers. Protecting information in shared
  resources in support of various supply chain activities is challenging when
  outsourcing key operations. Enterprises may either share too much and increase
  their risk or share too little and make it difficult for suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers to be efficient in their service delivery.
  The enterprise should work with developers to define a structure or process
  for information sharing, including the data shared, the method of sharing, and
  to whom (the specific roles) the information is provided. Appropriate privacy,
  dissemination, handling, and clearance requirements should be accounted for in
  the information-sharing process.
elementType: control
