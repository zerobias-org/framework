id: 88a6fac9-0b27-4a91-a0c9-bbdd5622b396
externalId: MP-4
name: Media Storage
description: Media storage controls should include C-SCRM activities.
  Enterprises should specify and include in agreements (e.g., contracting
  language) media storage requirements (e.g., encryption) for their suppliers,
  developers, system integrators, external system service providers, and other
  ICT/OT-related service providers. The enterprise should require its prime
  contractors to implement this control and flow down this requirement to
  relevant sub-tier contractors.
elementType: control
