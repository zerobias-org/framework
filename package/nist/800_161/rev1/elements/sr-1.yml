externalId: SR-1
name: Policy and Procedures
description: C-SCRM policies are developed at Level 1 for the overall enterprise
  and at Level 2 for specific missions and functions. C-SCRM policies can be
  implemented at Levels 1, 2, and 3, depending on the level of depth and detail.
  C-SCRM procedures are developed at Level 2 for specific missions and functions
  and at Level 3 for specific systems. Enterprise functions including but not
  limited to information security, legal, risk management, and acquisition
  should review and concur on the development of C-SCRM policies and procedures
  or provide guidance to system owners for developing system-specific C-SCRM
  procedures.
elementType: control
