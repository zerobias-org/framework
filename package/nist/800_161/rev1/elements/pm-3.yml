name: Information Security and Privacy Resources
description: An enterprise’s C-SCRM program requires dedicated, sustained
  funding and human resources to successfully implement agency C-SCRM
  requirements. Section 3 of this document provides guidance on dedicated
  funding for C-SCRM programs. The enterprise should also integrate CSCRM
  requirements into major IT investments to ensure that funding is appropriately
  allocated through the capital planning and investment request process. For
  example, should an RFID infrastructure be required to enhance C-SCRM to secure
  and improve the inventory or logistics management efficiency of the
  enterprise’s supply chain, appropriate IT investments would likely be required
  to ensure successful planning and implementation. Other examples include any
  investment into the development or test environment for critical components.
  In such cases, funding and resources are needed to acquire and maintain
  appropriate information systems, networks, and components to meet specific
  C-SCRM requirements that support the mission
elementType: control
