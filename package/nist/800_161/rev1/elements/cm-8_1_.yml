id: 0c433e3a-bddd-4286-b59e-5f111ce8c328
externalId: CM-8(1)
name: System Component Inventory | Updates During Installation and Removal
description: When installing, updating, or removing an information system,
  information system component, or network component, the enterprise needs to
  update the inventory to ensure traceability for tracking critical components.
  In addition, the information system’s configuration needs to be updated to
  ensure an accurate inventory of supply chain protections and then re-baselined
  accordingly.
elementType: control
