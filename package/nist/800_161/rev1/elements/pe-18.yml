id: ea82d16d-5d48-4b83-93c2-15fc60a4c451
externalId: PE-18
name: Location of System Components
description: Physical and environmental hazards or disruptions have an impact on
  the availability of products that are or will be acquired and physically
  transported to the enterprise’s locations. For example, enterprises should
  incorporate the manufacturing, warehousing, or the distribution location of
  information system components that are critical for agency operations when
  planning for alternative suppliers for these components.
elementType: control
