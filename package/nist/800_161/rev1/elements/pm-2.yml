externalId: PM-2
name: Information Security Program Leadership Role
description: The senior information security officer (e.g., CISO) and senior
  agency official responsible for acquisition (e.g., Chief Acquisition Officer
  [CAO] or Senior Procurement Executive [SPE]) have key responsibilities for
  C-SCRM and the overall cross-enterprise coordination and collaboration with
  other applicable senior personnel within the enterprise, such as the CIO, the
  head of facilities/physical security, and the risk executive (function). This
  coordination should occur regardless of the specific department and agency
  enterprise structure and specific titles of relevant senior personnel. The
  coordination could be executed by the C-SCRM PMO or another similar function.
  Section 2 provides more guidance on C-SCRM roles and responsibilities.
elementType: control
