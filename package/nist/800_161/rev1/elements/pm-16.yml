name: Threat Awareness Program
description: "A threat awareness program should include threats that emanate
  from the supply chain. When addressing supply chain threat awareness,
  knowledge should be shared between stakeholders within the boundaries of the
  enterprise’s information sharing policy. The C-SCRM PMO can help identify
  C-SCRM stakeholders to include in threat information sharing, as well as
  potential sources of\r

  information for supply chain threats."
