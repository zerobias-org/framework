id: 8d74aaac-5012-475b-a23d-87d09059072e
externalId: CM-8(2)
name: System Component Inventory | Automated Maintenance
description: The enterprise should implement automated maintenance mechanisms to
  ensure that changes to component inventory for the information systems and
  networks are monitored for installation, update, and removal. When automated
  maintenance is performed with a predefined frequency and with the automated
  collation of relevant inventory information about each defined component, the
  enterprise should ensure that updates are available to relevant stakeholders
  for evaluation. Predefined frequencies for data collection should be less
  predictable in order to reduce the risk of an insider threat bypassing
  security mechanisms.
elementType: control
