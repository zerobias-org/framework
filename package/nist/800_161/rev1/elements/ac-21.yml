id: bc263c10-8a93-4239-a7f9-9da804b5f315
externalId: AC-21
name: Information Sharing
description: Sharing information within the supply chain can help manage
  cybersecurity risks throughout the supply chain. This information may include
  vulnerabilities, threats, the criticality of systems and components, or
  delivery information. This information sharing should be carefully managed to
  ensure that the information is only accessible to authorized individuals
  within the enterprise’s supply chain. Enterprises should clearly define
  boundaries for information sharing with respect to temporal, informational,
  contractual, security, access, system, and other requirements. Enterprises
  should monitor and review for unintentional or intentional information sharing
  within its supply chain activities, including information sharing with
  suppliers, developers, system integrators, external system service providers,
  and other ICT/OT-related service providers.
elementType: control
