id: a950ff22-1f60-4880-97ba-4bc49b09feb7
externalId: CM-8(4)
name: System Component Inventory | Accountability Information
description: The enterprise should ensure that accountability information is
  collected for information system and network components. The system/component
  inventory information should identify those individuals who originate an
  acquisition as well as intended end users, including any associated personnel
  who may administer or use the system/components.
elementType: control
