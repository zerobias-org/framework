id: 5ffd5392-18d9-4ba3-b383-3ddab30ba22f
externalId: PM-6
name: Measures of Performance
description: Enterprises should use measures of performance to track the
  implementation, efficiency, effectiveness, and impact of C-SCRM activities.
  The C-SCRM PMO is responsible for creating C-SCRM measures of performance in
  collaboration with other applicable stakeholders to include identifying the
  appropriate audience and decision makers and providing guidance on data
  collection, analysis, and reporting.
elementType: control
