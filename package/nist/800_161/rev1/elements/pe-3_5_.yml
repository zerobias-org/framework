id: b8b7010a-ac42-45e7-a640-68ea4e032dbd
externalId: PE-3(5)
name: Physical Access Control | Logical Tampering Protection
description: Tamper protection is critical for reducing cybersecurity risk in
  products. The enterprise should implement validated tamper protection
  techniques within the supply chain. For critical products, the enterprise
  should require and assess whether and to what extent a supplier has
  implemented tamper protection mechanisms. The assessment may also include
  whether and how such mechanisms are required and applied by the supplier’s
  upstream supply chain entities.
elementType: control
