id: 230ef9fe-3156-478f-b475-6ba37c1aa250
externalId: SC-30(3)
name: Concealment and Misdirection | Change Processing and Storage Locations
description: Changes in processing or storage locations can be used to protect
  downloads, deliveries, or associated supply chain metadata. The enterprise may
  leverage such techniques within the their information systems and networks to
  create uncertainty about the activities targeted by adversaries. Establishing
  a few process changes and randomizing their use – whether it is for receiving,
  acceptance testing, storage, or other supply chain activities – can aid in
  reducing the likelihood of a supply chain event.
elementType: control
