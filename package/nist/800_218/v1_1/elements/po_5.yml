name: Implement and Maintain Secure Environments for Software Development
description: Ensure that all components of the environments for software
  development are strongly protected from internal and external threats to
  prevent compromises of the environments or the software being developed or
  maintained within them. Examples of environments for software development
  include development, build, test, and distribution environments.
