id: 9ba95445-31b7-49c8-b36e-a249a9309782
name: Design Software to Meet Security Requirements and Mitigate Security Risks
description: Identify and evaluate the security requirements for the software; determine what security risks the software is likely to face during operation and how the software’s design and architecture should mitigate those risks; and justify any cases where risk-based analysis indicates that security requirements should be relaxed or waived. Addressing security requirements and risks during software design (secure by design) is key for improving software security and also helps improve development efficiency.
elementType: practice
externalId: PW.1
