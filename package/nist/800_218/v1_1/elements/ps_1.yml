id: 721e2519-0746-4de4-b9dc-cd04e073686f
name: Protect All Forms of Code from Unauthorized Access and Tampering
description: Help prevent unauthorized changes to code, both inadvertent and intentional, which could circumvent or negate the intended security characteristics of the software. For code that is not intended to be publicly accessible, this helps prevent theft of the software and may make it more difficult or time-consuming for attackers to find vulnerabilities in the software.
elementType: practice
externalId: PS.1
