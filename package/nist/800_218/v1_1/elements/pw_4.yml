id: 1335f930-a1cd-409e-8c1c-9d20c71181db
name: Reuse Existing, Well-Secured Software When Feasible Instead of Duplicating Functionality
description: Lower the costs of software development, expedite software development, and decrease the likelihood of introducing additional security vulnerabilities into the software by reusing software modules and services that have already had their security posture checked. This is particularly important for software that implements security functionality, such as cryptographic modules and protocols.
elementType: practice
externalId: PW.4
