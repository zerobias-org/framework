name: Identification and Authentication (organizational Users) | Out-of-band Authentication
description: 'Implement the following out-of-band authentication mechanisms under
  [Assignment: organization-defined conditions]: [Assignment: organization-defined
  out-of-band authentication].'
elementType: enhancement
parent: ia-2
guidance: Out-of-band authentication refers to the use of two separate communication
  paths to identify and authenticate users or devices to an information system. The
  first path (i.e., the in-band path) is used to identify and authenticate users or
  devices and is generally the path through which information flows. The second path
  (i.e., the out-of-band path) is used to independently verify the authentication
  and/or requested action. For example, a user authenticates via a notebook computer
  to a remote server to which the user desires access and requests some action of
  the server via that communication path. Subsequently, the server contacts the user
  via the user’s cell phone to verify that the requested action originated from the
  user. The user may confirm the intended action to an individual on the telephone
  or provide an authentication code via the telephone. Out-of-band authentication
  can be used to mitigate actual or suspectedattacks. The conditions or criteria for
  activation include suspicious activities, new threat indicators, elevated threat
  levels, or the impact or classification level of information in requested transactions.
