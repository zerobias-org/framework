id: 2deee6ee-3fa5-46c4-9370-bd05e8c794ce
externalId: SR-4(2)
name: Provenance | Track and Trace
description: Establishes and maintains unique identification of systems and critical
  components to track them through the supply chain.
elementType: enhancement
parent: sr-4
guidance: Tracking the unique identification of systems and system components during
  development and transport activities provides a foundational identity structure
  for the establishment and maintenance of provenance. For example, system components
  may be labeled using serial numbers or tagged using radio-frequency identification
  tags. Labels and tags can help provide better visibility into the provenance of
  a system or system component. A system or system component may have more than one
  unique identifier. Identification methods are sufficient to support a forensic investigation
  after a supply chain compromise or event.
aliases:
