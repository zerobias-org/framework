id: d5600d7d-b666-4e84-b76a-21c440f0c5f4
externalId: AU-12(4)
name: Audit Record Generation | Query Parameter Audits of Personally Identifiable
  Information
description: Provide and implement the capability for auditing the parameters of user
  query events for data sets containing personally identifiable information.
elementType: enhancement
parent: au-12
guidance: Query parameters are explicit criteria that an individual or automated system
  submits to a system to retrieve data. Auditing of query parameters for datasets
  that contain personally identifiable information augments the capability of an organization
  to track and understand the access, usage, or sharing of personally identifiable
  information by authorized personnel.
