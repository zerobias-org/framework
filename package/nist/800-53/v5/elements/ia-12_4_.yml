id: 00cd58e2-10c3-4e75-bb4e-cb58115571f2
externalId: IA-12(4)
name: Identity Proofing | In-person Validation and Verification
description: Require that the validation and verification of identity evidence be
  conducted in person before a designated registration authority.
elementType: enhancement
parent: ia-12
guidance: In-person proofing reduces the likelihood of fraudulent credentials being
  issued because it requires the physical presence of individuals, the presentation
  of physical identity documents, and actual face-to-face interactions with designated
  registration authorities.
aliases:
