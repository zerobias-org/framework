id: c6915989-2b3a-4e58-a2f5-7527289c3aea
externalId: RA-5(11)
name: Vulnerability Monitoring and Scanning | Public Disclosure Program
description: Establish a public reporting channel for receiving reports of vulnerabilities
  in organizational systems and system components.
elementType: enhancement
parent: ra-5
guidance: The reporting channel is publicly discoverable and contains clear language
  authorizing good-faith research and the disclosure of vulnerabilities to the organization.
  The organization does not condition its authorization on an expectation of indefinite
  non-disclosure to the public by the reporting entity but may request a specific
  time period to properly remediate the vulnerability.
