externalId: CP-10(4)
name: System Recovery and Reconstitution | Restore Within Time Period
description: Provides the capability to restore system components within defined time
  periods from configuration-controlled, integrity-protected information reflecting
  a known state.
elementType: enhancement
parent: cp-10
guidance: Restoration of system components includes reimaging, which restores the
  components to known, operational states.
