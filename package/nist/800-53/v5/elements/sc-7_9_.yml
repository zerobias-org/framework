id: c715cbf3-4aac-4494-a12c-d5a4a1148a78
externalId: SC-7(9)
name: Boundary Protection | Restrict Threatening Outgoing Communications Traffic
description: (a) Detect and deny outgoing communications traffic posing a threat to
  external systems; and (b) Audit the identity of internal users associated with denied
  communications.
elementType: enhancement
parent: sc-7
guidance: Detecting outgoing communications traffic from internal actions that may
  pose threats to external systems is known as extrusion detection. Extrusion detection
  is carried out within the system at managed interfaces. Extrusion detection includes
  the analysis of incoming and outgoing communications traffic while searching for
  indications of internal threats to the security of external systems. Internal threats
  to external systems include traffic indicative of denial-of-service attacks, traffic
  with spoofed source addresses, and traffic that contains malicious code. Organizations
  have criteria to determine, update, and manage identified threats related to extrusion
  detection.
