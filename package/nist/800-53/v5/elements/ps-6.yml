id: ea21ed46-6db0-4e79-b16c-9977b2f7b130
externalId: PS-6
name: Access Agreements
description: Develops, documents, and periodically updates access agreements, requiring
  individuals to sign them before and upon renewal of system access.
elementType: control
parent: ps
guidance: Access agreements include nondisclosure agreements, acceptable use agreements,
  rules of behavior, and conflict-of-interest agreements. Signed access agreements
  include an acknowledgement that individuals have read, understand, and agree to
  abide by the constraints associated with organizational systems to which access
  is authorized. Organizations can use electronic signatures to acknowledge access
  agreements unless specifically prohibited by organizational policy.
