id: 7572021a-712d-40a3-8657-d762e9ff0b78
externalId: SA-11(6)
name: Developer Testing and Evaluation | Attack Surface Reviews
description: Require the developer of the system, system component, or system service
  to perform attack surface reviews.
elementType: enhancement
parent: sa-11
guidance: Attack surfaces of systems and system components are exposed areas that
  make those systems more vulnerable to attacks. Attack surfaces include any accessible
  areas where weaknesses or deficiencies in the hardware, software, and firmware components
  provide opportunities for adversaries to exploit vulnerabilities. Attack surface
  reviews ensure that developers analyze the design and implementation changes to
  systems and mitigate attack vectors generated as a result of the changes. The correction
  of identified flaws includes deprecation of unsafe functions.
aliases:
- SA-11(6)
- SA-11 (6)
