id: 5c41f3bb-5139-43e8-bd6d-93966a956420
externalId: PE-13(4)
name: Fire Protection | Inspections
description: Ensures the facility undergoes periodic fire protection inspections by
  qualified inspectors, with deficiencies resolved within a defined time period.
elementType: enhancement
parent: pe-13
guidance: Authorized and qualified personnel within the jurisdiction of the organization
  include state, county, and city fire inspectors and fire marshals. Organizations
  provide escorts during inspections in situations where the systems that reside within
  the facilities contain sensitive information.
