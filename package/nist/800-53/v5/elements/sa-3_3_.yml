id: 2cde6623-ae8f-44a2-9b47-8465421401f4
externalId: SA-3(3)
name: System Development Life Cycle | Technology Refresh
description: Plan for and implement a technology refresh schedule for the system throughout
  the system development life cycle.
elementType: enhancement
parent: sa-3
guidance: Technology refresh planning may encompass hardware, software, firmware,
  processes, personnel skill sets, suppliers, service providers, and facilities. The
  use of obsolete or nearing obsolete technology may increase the security and privacy
  risks associated with unsupported components, counterfeit or repurposed components,
  components unable to implement security or privacy requirements, slow or inoperable
  components, components from untrusted sources, inadvertent personnel error, or increased
  complexity. Technology refreshes typically occur during the operations and maintenance
  stage of the system development life cycle.
aliases:
