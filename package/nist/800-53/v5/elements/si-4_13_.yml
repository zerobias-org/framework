id: 28d14dc1-e203-40d5-8812-088bd767fb0a
externalId: SI-4(13)
name: System Monitoring | Analyze Traffic and Event Patterns
description: Analyzes communications traffic and event patterns, develops profiles
  of common activity, and uses those profiles to tune monitoring devices.
elementType: enhancement
parent: si-4
guidance: Identifying and understanding common communications traffic and event patterns
  help organizations provide useful information to system monitoring devices to more
  effectively identify suspicious or anomalous traffic and events when they occur.
  Such information can help reduce the number of false positives and false negatives
  during system monitoring.
