id: 27a4564b-5fe8-4de4-9068-b7c99705d101
externalId: AC-16(10)
name: Security and Privacy Attributes | Attribute Configuration by Authorized Individuals
description: Provide authorized individuals the capability to define or change the
  type and value of security and privacy attributes available for association with
  subjects and objects.
elementType: enhancement
parent: ac-16
guidance: The content or assigned values of security and privacy attributes can directly
  affect the ability of individuals to access organizational information. Thus, it
  is important for systems to be able to limit the ability to create or modify the
  type and value of attributes available for association with subjects and objects
  to authorized individuals only.
