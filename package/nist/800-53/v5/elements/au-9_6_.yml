id: eefd458e-4869-4b63-a8ec-859647cebd29
externalId: AU-9(6)
name: Protection of Audit Information | Read-only Access
description: 'Authorize read-only access to audit information to [Assignment: organization-defined
  subset of privileged users or roles].'
elementType: enhancement
parent: au-9
guidance: Restricting privileged user or role authorizations to read-only helps to
  limit the potential damage to organizations that could be initiated by such users
  or roles, such as deleting audit records to cover up malicious activity.
