id: e1967581-7c35-43dd-83a2-b30a8d5f3684
externalId: AC-6(6)
name: Least Privilege | Privileged Access by Non-organizational Users
description: Prohibit privileged access to the system by non-organizational users.
elementType: enhancement
parent: ac-6
guidance: An organizational user is an employee or an individual considered by the
  organization to have the equivalent status of an employee. Organizational users
  include contractors, guest researchers, or individuals detailed from other organizations.
  A non-organizational user is a user who is not an organizational user. Policies
  and procedures for granting equivalent status of employees to individuals include
  a need-to-know, citizenship, and the relationship to the organization.
