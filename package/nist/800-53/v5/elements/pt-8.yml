id: b1e59e9c-a18f-4f7e-bfe8-21804d81c10a
externalId: PT-8
name: Computer Matching Requirements
description: When a system or organization processes information for the purpose
  of conducting a matching program:a. Obtain approval from the Data Integrity
  Board to conduct the matching program;b. Develop and enter into a computer
  matching agreement;c. Publish a matching notice in the Federal Register;d.
  Independently verify the information produced by the matching program before
  taking adverse action against an individual, if required; ande. Provide
  individuals with notice and an opportunity to contest the findings before
  taking adverse action against an individual.
elementType: control
