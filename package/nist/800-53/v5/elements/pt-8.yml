id: e8d02e99-a484-4566-ad6b-f0cbc3d9c219
externalId: PT-8
name: Computer Matching Requirements
description: Requires Data Integrity Board approval, a matching agreement, and published
  notice before conducting a computer matching program, with verification before adverse
  action.
elementType: control
parent: pt
guidance: Theestablishes requirements for federal and non-federal agencies if they
  engage in a matching program. In general, a matching program is a computerized comparison
  of records from two or more automatedsystems of records or an automated system of
  records and automated records maintained by a non-federal agency (or agent thereof).
  A matching program either pertains to federal benefit programs or federal personnel
  or payroll records. A federal benefit match is performed to determine or verify
  eligibility for payments under federal benefit programs or to recoup payments or
  delinquent debts under federal benefit programs. A matching program involves not
  just the matching activity itself but also the investigative follow-up and ultimate
  action, if any.
