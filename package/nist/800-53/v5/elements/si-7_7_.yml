id: 250aeab6-c84d-4c6e-93f9-2bcaf7c7e143
externalId: SI-7(7)
name: Software, Firmware, and Information Integrity | Integration of Detection and
  Response
description: 'Incorporate the detection of the following unauthorized changes into
  the organizational incident response capability: [Assignment: organization-defined
  security-relevant changes to the system].'
elementType: enhancement
parent: si-7
guidance: Integrating detection and response helps to ensure that detected events
  are tracked, monitored, corrected, and available for historical purposes. Maintaining
  historical records is important for being able to identify and discern adversary
  actions over an extended time period and for possible legal actions. Security-relevant
  changes include unauthorized changes to established configuration settings or the
  unauthorized elevation of system privileges.
aliases:
