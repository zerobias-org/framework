id: 57074698-e70b-4296-8795-f820d831171a
externalId: RA-5(3)
name: Vulnerability Monitoring and Scanning | Breadth and Depth of Coverage
description: Define the breadth and depth of vulnerability scanning coverage.
elementType: enhancement
parent: ra-5
guidance: The breadth of vulnerability scanning coverage can be expressed as a percentage
  of components within the system, by the particular types of systems, by the criticality
  of systems, or by the number of vulnerabilities to be checked. Conversely, the depth
  of vulnerability scanning coverage can be expressed as the level of the system design
  that the organization intends to monitor (e.g., component, module, subsystem, element).
  Organizations can determine the sufficiency of vulnerability scanning coverage with
  regard to its risk tolerance and other factors. Scanning tools and how the tools
  are configured may affect the depth and coverage. Multiple scanning tools may be
  needed to achieve the desired depth and coverage.provides additional information
  on the breadth and depth of coverage.
