id: 06bbd932-1793-4266-88b6-2bbadc585bac
externalId: PM-24
name: Data Integrity Board
description: Establishes a Data Integrity Board to review matching program proposals
  and conduct an annual review of participating matching programs.
elementType: control
parent: pm
guidance: A Data Integrity Board is the board of senior officials designated by the
  head of a federal agency and is responsible for, among other things, reviewing the
  agency’s proposals to conduct or participate in a matching program and conducting
  an annual review of all matching programs in which the agency has participated.
  As a general matter, a matching program is a computerized comparison of records
  from two or more automatedsystems of records or an automated system of records and
  automated records maintained by a non-federal agency (or agent thereof). A matching
  program either pertains to Federal benefit programs or Federal personnel or payroll
  records. At a minimum, the Data Integrity Board includes the Inspector General of
  the agency, if any, and the senior agency official for privacy.
