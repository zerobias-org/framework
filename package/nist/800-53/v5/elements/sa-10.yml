id: 18f2d381-cf67-4d40-8a05-db433a31cd23
externalId: SA-10
name: Developer Configuration Management
description: "Require the developer of the system, system component, or system
  service to:a. Perform configuration management during system, component, or
  service [Selection (one or more): design; development; implementation;
  operation; disposal];b. Document, manage, and control the integrity of changes
  to [Assignment: organization-defined configuration items under configuration
  management];c. Implement only organization-approved changes to the system,
  component, or service;d. Document approved changes to the system, component,
  or service and the potential security and privacy impacts of such changes;
  ande. Track security flaws and flaw resolution within the system, component,
  or service and report findings to [Assignment: organization-defined
  personnel]."
elementType: control
