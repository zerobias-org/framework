id: a0ef3158-856a-4e47-93fd-1e9e2437ccc9
externalId: SC-15(3)
name: Collaborative Computing Devices and Applications | Disabling and Removal in
  Secure Work Areas
description: 'Disable or remove collaborative computing devices and applications from
  [Assignment: organization-defined systems or system components] in [Assignment:
  organization-defined secure work areas].'
elementType: enhancement
parent: sc-15
guidance: Failing to disable or remove collaborative computing devices and applications
  from systems or system components can result in compromises of information, including
  eavesdropping on conversations. A Sensitive Compartmented Information Facility (SCIF)
  is an example of a secure work area.
