id: f5874497-cacf-446b-a635-40eb2ebbc263
externalId: SA-11(3)
name: Developer Testing and Evaluation | Independent Verification of Assessment Plans
  and Evidence
description: Requires an independent agent to verify the developer's assessment plans
  and testing evidence, with sufficient access to complete the verification.
elementType: enhancement
parent: sa-11
guidance: Independent agents have the qualifications—including the expertise, skills,
  training, certifications, and experience—to verify the correct implementation of
  developer security and privacy assessment plans.
