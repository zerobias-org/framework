externalId: SA-15(8)
name: Development Process, Standards, and Tools | Reuse of Threat and
  Vulnerability Information
description: Require the developer of the system, system component, or system
  service to use threat modeling and vulnerability analyses from similar
  systems, components, or services to inform the current development process.
elementType: control
