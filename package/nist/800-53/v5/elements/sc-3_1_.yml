id: 270a6177-bbd1-4c79-bd15-9d963cde839e
externalId: SC-3(1)
name: Security Function Isolation | Hardware Separation
description: Employ hardware separation mechanisms to implement security function
  isolation.
elementType: enhancement
parent: sc-3
guidance: Hardware separation mechanisms include hardware ring architectures that
  are implemented within microprocessors and hardware-enforced address segmentation
  used to support logically distinct storage objects with separate attributes (i.e.,
  readable, writeable).
