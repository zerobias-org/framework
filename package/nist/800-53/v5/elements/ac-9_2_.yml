externalId: AC-9(2)
name: Previous Logon Notification | Successful and Unsuccessful Logons
description: 'Notify the user, upon successful logon, of the number of [Selection:
  successful logons; unsuccessful logon attempts; both] during [Assignment: organization-defined
  time period].'
elementType: enhancement
parent: ac-9
guidance: Information about the number of successful and unsuccessful logon attempts
  within a specified time period allows the user to recognize if the number and type
  of logon attempts are consistent with the user’s actual logon attempts.
