id: 23c234e4-67cb-4a28-8886-86428e727edc
externalId: AC-4(8)
name: Information Flow Enforcement | Security and Privacy Policy Filters
description: Enforces information flow control using policy filters, and blocks, strips,
  modifies, or quarantines data after a filter failure.
elementType: enhancement
parent: ac-4
guidance: Organization-defined security or privacy policy filters can address data
  structures and content. For example, security or privacy policy filters for data
  structures can check for maximum file lengths, maximum field sizes, and data/file
  types (for structured and unstructured data). Security or privacy policy filters
  for data content can check for specific words, enumerated values or data value ranges,
  and hidden content. Structured data permits the interpretation of data content by
  applications. Unstructured data refers to digital information without a data structure
  or with a data structure that does not facilitate the development of rule sets to
  address the impact or classification level of the information conveyed by the data
  or the flow enforcement decisions. Unstructured data consists of bitmap objects
  that are inherently non-language-based (i.e., image, video, or audio files) and
  textual objects that are based on written or printed languages. Organizations can
  implement more than one security or privacy policy filter to meet information flow
  control objectives.
