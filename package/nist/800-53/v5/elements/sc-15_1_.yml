id: a787e331-98f9-4a49-8325-29fe4ef5ea16
externalId: SC-15(1)
name: Collaborative Computing Devices and Applications | Physical or Logical Disconnect
description: 'Provide [Selection (one or more): physical; logical] disconnect of collaborative
  computing devices in a manner that supports ease of use.'
elementType: enhancement
parent: sc-15
guidance: Failing to disconnect from collaborative computing devices can result in
  subsequent compromises of organizational information. Providing easy methods to
  disconnect from such devices after a collaborative computing session ensures that
  participants carry out the disconnect activity without having to go through complex
  and tedious procedures. Disconnect from collaborative computing devices can be manual
  or automatic.
