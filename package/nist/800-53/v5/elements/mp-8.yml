id: 678b2725-82c4-476f-9f00-ef65e5b5d5b9
externalId: MP-8
name: Media Downgrading
description: Establishes and verifies a system media downgrading process appropriate
  to the information's classification, and downgrades identified media using it.
elementType: control
parent: mp
guidance: Media downgrading applies to digital and non-digital media subject to release
  outside of the organization, whether the media is considered removable or not. When
  applied to system media, the downgrading process removes information from the media,
  typically by security category or classification level, such that the information
  cannot be retrieved or reconstructed. Downgrading of media includes redacting information
  to enable wider release and distribution. Downgrading ensures that empty space on
  the media is devoid of information.
