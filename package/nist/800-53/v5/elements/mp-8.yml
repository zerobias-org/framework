id: fab0455d-ab06-4162-807d-70ccca34f290
externalId: MP-8
name: Media Downgrading
description: "a. Establish [Assignment: organization-defined system media
  downgrading process] that includes employing downgrading mechanisms with
  strength and integrity commensurate with the security category or
  classification of the information;b. Verify that the system media downgrading
  process is commensurate with the security category and/or classification level
  of the information to be removed and the access authorizations of the
  potential recipients of the downgraded information;c. Identify [Assignment:
  organization-defined system media requiring downgrading]; andd. Downgrade the
  identified system media using the established process."
elementType: control
