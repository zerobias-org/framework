id: b242d0e2-4c75-4042-a75c-6ed3b7271c3f
externalId: SC-7(22)
name: Boundary Protection | Separate Subnets for Connecting to Different Security
  Domains
description: Implement separate network addresses to connect to systems in different
  security domains.
elementType: enhancement
parent: sc-7
guidance: The decomposition of systems into subnetworks (i.e., subnets) helps to provide
  the appropriate level of protection for network connections to different security
  domains that contain information with different security categories or classification
  levels.
