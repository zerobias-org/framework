id: f80d2d4c-e5d7-424a-9204-9c5d99e32039
externalId: AC-3(7)
name: Access Enforcement | Role-based Access Control
description: 'Enforce a role-based access control policy over defined subjects and
  objects and control access based upon [Assignment: organization-defined roles and
  users authorized to assume such roles].'
elementType: enhancement
parent: ac-3
guidance: Role-based access control (RBAC) is an access control policy that enforces
  access to objects and system functions based on the defined role (i.e., job function)
  of the subject. Organizations can create specific roles based on job functions and
  the authorizations (i.e., privileges) to perform needed operations on the systems
  associated with the organization-defined roles. When users are assigned to specific
  roles, they inherit the authorizations or privileges defined for those roles. RBAC
  simplifies privilege administration for organizations because privileges are not
  assigned directly to every user (which can be a large number of individuals) but
  are instead acquired through role assignments. RBAC can also increase privacy and
  security risk if individuals assigned to a role are given access to information
  beyond what they need to support organizational missions or business functions.
  RBAC can be implemented as a mandatory or discretionary form of access control.
  For organizations implementing RBAC with mandatory access controls, the requirements
  indefine the scope of the subjects and objects covered by the policy.
