id: 6a2f035e-eb79-4c58-b611-347c2dfdff0d
externalId: IR-7
name: Incident Response Assistance
description: Provides an incident response support resource that offers advice and
  assistance to users for handling and reporting incidents.
elementType: control
parent: ir
guidance: Incident response support resources provided by organizations include help
  desks, assistance groups, automated ticketing systems to open and track incident
  response tickets, and access to forensics services or consumer redress services,
  when required.
