id: 9bfd2aa0-ae86-4cd7-9a7e-7e98d1a69362
externalId: SA-11(2)
name: Developer Testing and Evaluation | Threat Modeling and Vulnerability Analyses
description: "Require the developer of the system, system component, or system
  service to perform threat modeling and vulnerability analyses during
  development and the subsequent testing and evaluation of the system,
  component, or service that:a. Uses the following contextual information:
  [Assignment: organization-defined information concerning impact, environment
  of operations, known or assumed threats, and acceptable risk levels];b.
  Employs the following tools and methods: [Assignment: organization-defined
  tools and methods];c. Conducts the modeling and analyses at the following
  level of rigor: [Assignment: organization-defined breadth and depth of
  modeling and analyses]; andd. Produces evidence that meets the following
  acceptance criteria: [Assignment: organization-defined acceptance criteria]."
elementType: control
