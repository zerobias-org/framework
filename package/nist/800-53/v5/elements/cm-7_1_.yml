id: b9e7ac4c-1e71-4da5-ac82-6d2ec83cd547
externalId: CM-7(1)
name: Least Functionality | Periodic Review
description: Periodically reviews the system to identify unnecessary or nonsecure
  functions, ports, protocols, software, and services, and disables or removes them.
elementType: enhancement
parent: cm-7
guidance: Organizations review functions, ports, protocols, and services provided
  by systems or system components to determine the functions and services that are
  candidates for elimination. Such reviews are especially important during transition
  periods from older technologies to newer technologies (e.g., transition from IPv4
  to IPv6). These technology transitions may require implementing the older and newer
  technologies simultaneously during the transition period and returning to minimum
  essential functions, ports, protocols, and services at the earliest opportunity.
  Organizations can either decide the relative security of the function, port, protocol,
  and/or service or base the security decision on the assessment of other entities.
  Unsecure protocols include Bluetooth, FTP, and peer-to-peer networking.
aliases:
