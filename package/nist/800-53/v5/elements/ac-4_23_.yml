id: c7b1edcf-7f22-489a-a025-21991a8b24e6
externalId: AC-4(23)
name: Information Flow Enforcement | Modify Non-releasable Information
description: 'When transferring information between different security domains, modify
  non-releasable information by implementing [Assignment: organization-defined modification
  action].'
elementType: enhancement
parent: ac-4
guidance: Modifying non-releasable information can help prevent a data spill or attack
  when information is transferred across security domains. Modification actions include
  masking, permutation, alteration, removal, or redaction.
