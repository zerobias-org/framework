id: d3737515-00c9-4192-a4d7-faca61fbd97b
externalId: SI-13
name: Predictable Failure Prevention
description: Determines mean time to failure for defined system components and provides
  substitute components with a means to exchange active and standby units.
elementType: control
parent: si
guidance: While MTTF is primarily a reliability issue, predictable failure prevention
  is intended to address potential failures of system components that provide security
  capabilities. Failure rates reflect installation-specific consideration rather than
  the industry-average. Organizations define the criteria for the substitution of
  system components based on the MTTF value with consideration for the potential harm
  from component failures. The transfer of responsibilities between active and standby
  components does not compromise safety, operational readiness, or security capabilities.
  The preservation of system state variables is also critical to help ensure a successful
  transfer process. Standby components remain available at all times except for maintenance
  issues or recovery failures in progress.
