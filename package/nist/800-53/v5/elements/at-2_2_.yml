id: 296000a8-d234-4bfe-b44d-f20b88231649
externalId: AT-2(2)
name: Literacy Training and Awareness | Insider Threat
description: Provide literacy training on recognizing and reporting potential indicators
  of insider threat.
elementType: enhancement
parent: at-2
guidance: Potential indicators and possible precursors of insider threat can include
  behaviors such as inordinate, long-term job dissatisfaction; attempts to gain access
  to information not required for job performance; unexplained access to financial
  resources; bullying or harassment of fellow employees; workplace violence; and other
  serious violations of policies, procedures, directives, regulations, rules, or practices.
  Literacy training includes how to communicate the concerns of employees and management
  regarding potential indicators of insider threat through channels established by
  the organization and in accordance with established policies and procedures. Organizations
  may consider tailoring insider threat awareness topics to the role. For example,
  training for managers may be focused on changes in the behavior of team members,
  while training for employees may be focused on more general observations.
