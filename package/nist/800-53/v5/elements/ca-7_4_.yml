id: 51ef307f-6dba-40a4-aa67-c1f4bb86247e
externalId: CA-7(4)
name: Continuous Monitoring | Risk Monitoring
description: 'Ensure risk monitoring is an integral part of the continuous monitoring
  strategy that includes the following: (a) Effectiveness monitoring; (b) Compliance
  monitoring; and (c) Change monitoring.'
elementType: enhancement
parent: ca-7
guidance: Risk monitoring is informed by the established organizational risk tolerance.
  Effectiveness monitoring determines the ongoing effectiveness of the implemented
  risk response measures. Compliance monitoring verifies that required risk response
  measures are implemented. It also verifies that security and privacy requirements
  are satisfied. Change monitoring identifies changes to organizational systems and
  environments of operation that may affect security and privacy risk.
