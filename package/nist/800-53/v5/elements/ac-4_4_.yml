id: e028194d-73d7-4a42-84f3-4f5148d767f9
externalId: AC-4(4)
name: Information Flow Enforcement | Flow Control of Encrypted Information
description: Prevents encrypted information from bypassing flow control mechanisms
  by decrypting it, blocking it, or terminating the session.
elementType: enhancement
parent: ac-4
guidance: Flow control mechanisms include content checking, security policy filters,
  and data type identifiers. The term encryption is extended to cover encoded data
  not recognized by filtering mechanisms.
aliases:
