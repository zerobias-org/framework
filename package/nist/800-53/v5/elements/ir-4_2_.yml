id: 88894a76-5c2c-4b3f-8b82-0b57671506a7
externalId: IR-4(2)
name: Incident Handling | Dynamic Reconfiguration
description: Includes defined types of dynamic reconfiguration for system components
  as part of the incident response capability.
elementType: enhancement
parent: ir-4
guidance: Dynamic reconfiguration includes changes to router rules, access control
  lists, intrusion detection or prevention system parameters, and filter rules for
  guards or firewalls. Organizations may perform dynamic reconfiguration of systems
  to stop attacks, misdirect attackers, and isolate components of systems, thus limiting
  the extent of the damage from breaches or compromises. Organizations include specific
  time frames for achieving the reconfiguration of systems in the definition of the
  reconfiguration capability, considering the potential need for rapid response to
  effectively address cyber threats.
aliases:
