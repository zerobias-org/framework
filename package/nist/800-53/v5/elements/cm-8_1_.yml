id: 8c48a929-178f-4db3-bd63-9a654a5bf0ad
externalId: CM-8(1)
name: System Component Inventory | Updates During Installation and Removal
description: Update the inventory of system components as part of component installations,
  removals, and system updates.
elementType: enhancement
parent: cm-8
guidance: Organizations can improve the accuracy, completeness, and consistency of
  system component inventories if the inventories are updated as part of component
  installations or removals or during general system updates. If inventories are not
  updated at these key times, there is a greater likelihood that the information will
  not be appropriately captured and documented. System updates include hardware, software,
  and firmware components.
