id: 110a7fbd-ae1b-4dd6-b1b2-03b14f9399f8
externalId: AC-6(9)
name: Least Privilege | Log Use of Privileged Functions
description: Log the execution of privileged functions.
elementType: enhancement
parent: ac-6
guidance: The misuse of privileged functions, either intentionally or unintentionally
  by authorized users or by unauthorized external entities that have compromised system
  accounts, is a serious and ongoing concern and can have significant adverse impacts
  on organizations. Logging and analyzing the use of privileged functions is one way
  to detect such misuse and, in doing so, help mitigate the risk from insider threats
  and the advanced persistent threat.
