id: 377ac6f9-d759-4243-90ac-bc1a9bc5f7ad
externalId: AC-2(2)
name: Account Management | Automated Temporary and Emergency Account Management
description: 'Automatically [Selection: remove; disable] temporary and emergency accounts
  after [Assignment: organization-defined time period for each type of account].'
elementType: enhancement
parent: ac-2
guidance: Management of temporary and emergency accounts includes the removal or disabling
  of such accounts automatically after a predefined time period rather than at the
  convenience of the system administrator. Automatic removal or disabling of accounts
  provides a more consistent implementation.
