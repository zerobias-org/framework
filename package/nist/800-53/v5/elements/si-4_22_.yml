id: 1d60b3cf-2b9e-4664-8d36-ac18d3b74712
externalId: SI-4(22)
name: System Monitoring | Unauthorized Network Services
description: Detects unauthorized network services and audits or alerts designated
  personnel when they are detected.
elementType: enhancement
parent: si-4
guidance: Unauthorized or unapproved network services include services in service-oriented
  architectures that lack organizational verification or validation and may therefore
  be unreliable or serve as malicious rogues for valid services.
