id: 0c4f998b-ed00-4fce-9512-ed3e1f3b161b
externalId: PM-3
name: Information Security and Privacy Resources
description: Includes information security and privacy resource needs in capital planning
  and investment requests, and makes planned resources available.
elementType: control
parent: pm
guidance: Organizations consider establishing champions for information security and
  privacy and, as part of including the necessary resources, assign specialized expertise
  and resources as needed. Organizations may designate and empower an Investment Review
  Board or similar group to manage and provide oversight for the information security
  and privacy aspects of the capital planning and investment control process.
