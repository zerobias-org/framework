id: a71fc3aa-a835-4539-b375-fb8b3d03a3b0
externalId: AU-9
name: Protection of Audit Information
description: Protects audit information and logging tools from unauthorized access,
  modification, and deletion, alerting personnel when detected.
elementType: control
parent: au
guidance: Audit information includes all information needed to successfully audit
  system activity, such as audit records, audit log settings, audit reports, and personally
  identifiable information. Audit logging tools are those programs and devices used
  to conduct system audit and logging activities. Protection of audit information
  focuses on technical protection and limits the ability to access and execute audit
  logging tools to authorized individuals. Physical protection of audit information
  is addressed by both media protection controls and physical and environmental protection
  controls.
