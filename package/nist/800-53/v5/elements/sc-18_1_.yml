id: 087221a6-afd8-4ff2-b7a1-f1cb7ff5a446
externalId: SC-18(1)
name: Mobile Code | Identify Unacceptable Code and Take Corrective Actions
description: 'Identify [Assignment: organization-defined unacceptable mobile code]
  and take [Assignment: organization-defined corrective actions].'
elementType: enhancement
parent: sc-18
guidance: Corrective actions when unacceptable mobile code is detected include blocking,
  quarantine, or alerting administrators. Blocking includes preventing the transmission
  of word processing files with embedded macros when such macros have been determined
  to be unacceptable mobile code.
