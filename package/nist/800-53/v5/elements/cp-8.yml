id: 8973fbcf-8de9-44d6-bcc9-8bea6b491063
externalId: CP-8
name: Telecommunications Services
description: Establishes alternate telecommunications services to resume essential
  operations within a defined time period when primary services are unavailable.
elementType: control
parent: cp
guidance: Telecommunications services (for data and voice) for primary and alternate
  processing and storage sites are in scope for. Alternate telecommunications services
  reflect the continuity requirements in contingency plans to maintain essential mission
  and business functions despite the loss of primary telecommunications services.
  Organizations may specify different time periods for primary or alternate sites.
  Alternate telecommunications services include additional organizational or commercial
  ground-based circuits or lines, network-based approaches to telecommunications,
  or the use of satellites. Organizations consider factors such as availability, quality
  of service, and access when entering into alternate telecommunications agreements.
