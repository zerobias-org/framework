id: 4d295c6c-1235-4152-a82e-8e73b4199bc4
externalId: SA-11
name: Developer Testing and Evaluation
description: "Require the developer of the system, system component, or system
  service, at all post-design stages of the system development life cycle, to:a.
  Develop and implement a plan for ongoing security and privacy control
  assessments;b. Perform [Selection (one or more): unit; integration; system;
  regression] testing/evaluation [Assignment: organization-defined frequency] at
  [Assignment: organization-defined depth and coverage];c. Produce evidence of
  the execution of the assessment plan and the results of the testing and
  evaluation;d. Implement a verifiable flaw remediation process; ande. Correct
  flaws identified during testing and evaluation."
elementType: control
