id: b8391cef-88f3-41bb-a1b1-52e17baeb22c
externalId: SC-45(1)
name: System Time Synchronization | Synchronization with Authoritative Time Source
description: Compares internal system clocks with a defined authoritative time source
  on a defined schedule and synchronizes them when the difference exceeds a defined
  period.
elementType: enhancement
parent: sc-45
guidance: Synchronization of internal system clocks with an authoritative source provides
  uniformity of time stamps for systems with multiple system clocks and systems connected
  over a network.
aliases:
