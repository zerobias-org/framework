id: b7cca745-af24-467e-b063-e711d402f9c5
externalId: PS-7
name: External Personnel Security
description: "a. Establish personnel security requirements, including security
  roles and responsibilities for external providers;b. Require external
  providers to comply with personnel security policies and procedures
  established by the organization;c. Document personnel security requirements;d.
  Require external providers to notify [Assignment: organization-defined
  personnel or roles] of any personnel transfers or terminations of external
  personnel who possess organizational credentials and/or badges, or who have
  system privileges within [Assignment: organization-defined time period]; ande.
  Monitor provider compliance with personnel security requirements."
elementType: control
