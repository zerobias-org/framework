id: 02e8e1aa-1e99-463f-ba5c-013d3fb94079
externalId: AU-13(3)
name: Monitoring for Information Disclosure | Unauthorized Replication of Information
description: Employ discovery techniques, processes, and tools to determine if external
  entities are replicating organizational information in an unauthorized manner.
elementType: enhancement
parent: au-13
guidance: The unauthorized use or replication of organizational information by external
  entities can cause adverse impacts on organizational operations and assets, including
  damage to reputation. Such activity can include the replication of an organizational
  website by an adversary or hostile threat actor who attempts to impersonate the
  web-hosting organization. Discovery tools, techniques, and processes used to determine
  if external entities are replicating organizational information in an unauthorized
  manner include scanning external websites, monitoring social media, and training
  staff to recognize the unauthorized use of organizational information.
aliases:
