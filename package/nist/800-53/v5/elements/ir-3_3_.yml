id: 85c79f04-aa63-4870-806d-ed293159b1ee
externalId: IR-3(3)
name: Incident Response Testing | Continuous Improvement
description: Uses testing data to determine and continuously improve the effectiveness
  of incident response processes and produce reliable metrics.
elementType: enhancement
parent: ir-3
guidance: To help incident response activities function as intended, organizations
  may use metrics and evaluation criteria to assess incident response programs as
  part of an effort to continually improve response performance. These efforts facilitate
  improvement in incident response efficacy and lessen the impact of incidents.
