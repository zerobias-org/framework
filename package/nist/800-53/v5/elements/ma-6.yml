externalId: MA-6
name: Timely Maintenance
description: 'Obtain maintenance support and/or spare parts for [Assignment: organization-defined
  system components] within [Assignment: organization-defined time period] of failure.'
elementType: control
parent: ma
guidance: Organizations specify the system components that result in increased risk
  to organizational operations and assets, individuals, other organizations, or the
  Nation when the functionality provided by those components is not operational. Organizational
  actions to obtain maintenance support include having appropriate contracts in place.
