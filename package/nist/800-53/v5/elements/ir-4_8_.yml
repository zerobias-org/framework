id: ef02c29a-ee0d-4dc9-9870-269874f798ff
externalId: IR-4(8)
name: Incident Handling | Correlation with External Organizations
description: Coordinates with external organizations to correlate and share incident
  information for a cross-organization perspective on incidents.
elementType: enhancement
parent: ir-4
guidance: The coordination of incident information with external organizations—including
  mission or business partners, military or coalition partners, customers, and developers—can
  provide significant benefits. Cross-organizational coordination can serve as an
  important risk management capability. This capability allows organizations to leverage
  information from a variety of sources to effectively respond to incidents and breaches
  that could potentially affect the organization’s operations, assets, and individuals.
