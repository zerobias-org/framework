id: adacc2cb-715b-4353-b135-425fe8cbcd52
externalId: SA-17(6)
name: Developer Security and Privacy Architecture and Design | Structure for Testing
description: Require the developer of the system, system component, or system service
  to structure security-relevant hardware, software, and firmware to facilitate testing.
elementType: enhancement
parent: sa-17
guidance: Applying the security design principles in SP 800-160-1 promotes complete,
  consistent, and comprehensive testing and evaluation of systems, system components,
  and services. The thoroughness of such testing contributes to the evidence produced
  to generate an effective assurance case or argument as to the trustworthiness of
  the system, system component, or service.
