id: 35b57fa1-6695-480c-b3ce-f392c5c12f6d
externalId: IA-8(6)
name: Identification and Authentication (non-organizational Users) | Disassociability
description: Implements defined measures to disassociate user attributes or identifier
  assertions among individuals, credential providers, and relying parties.
elementType: enhancement
parent: ia-8
guidance: Federated identity solutions can create increased privacy risks due to the
  tracking and profiling of individuals. Using identifier mapping tables or cryptographic
  techniques to blind credential service providers and relying parties from each other
  or to make identity attributes less visible to transmitting parties can reduce these
  privacy risks.
