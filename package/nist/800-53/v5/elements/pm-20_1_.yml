id: cbb22eff-5db9-4149-8be0-7d6937ef1f83
externalId: PM-20(1)
name: Dissemination of Privacy Program Information | Privacy Policies on
  Websites, Applications, and Digital Services
description: Develop and post privacy policies on all external-facing websites,
  mobile applications, and other digital services, that:a. Are written in plain
  language and organized in a way that is easy to understand and navigate;b.
  Provide information needed by the public to make an informed decision about
  whether and how to interact with the organization; andc. Are updated whenever
  the organization makes a substantive change to the practices it describes and
  includes a time/date stamp to inform the public of the date of the most recent
  changes.
elementType: control
