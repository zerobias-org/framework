id: cbb22eff-5db9-4149-8be0-7d6937ef1f83
externalId: PM-20(1)
name: Dissemination of Privacy Program Information | Privacy Policies on Websites,
  Applications, and Digital Services
description: Develops and posts plain-language privacy policies on external-facing
  websites and applications, updated whenever practices substantively change.
elementType: enhancement
parent: pm-20
guidance: Organizations post privacy policies on all external-facing websites, mobile
  applications, and other digital services. Organizations post a link to the relevant
  privacy policy on any known, major entry points to the website, application, or
  digital service. In addition, organizations provide a link to the privacy policy
  on any webpage that collects personally identifiable information. Organizations
  may be subject to applicable laws, executive orders, directives, regulations, or
  policies that require the provision of specific information to the public. Organizational
  personnel consult with the senior agency official for privacy and legal counsel
  regarding such requirements.
aliases:
