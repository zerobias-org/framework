id: dce50bce-9f83-4598-8654-611b25476e4c
externalId: RA-3(1)
name: Risk Assessment | Supply Chain Risk Assessment
description: Assesses supply chain risks for defined systems and components, and updates
  the assessment when the supply chain or system conditions change significantly.
elementType: enhancement
parent: ra-3
guidance: Supply chain-related events include disruption, use of defective components,
  insertion of counterfeits, theft, malicious development practices, improper delivery
  practices, and insertion of malicious code. These events can have a significant
  impact on the confidentiality, integrity, or availability of a system and its information
  and, therefore, can also adversely impact organizational operations (including mission,
  functions, image, or reputation), organizational assets, individuals, other organizations,
  and the Nation. The supply chain-related events may be unintentional or malicious
  and can occur at any point during the system life cycle. An analysis of supply chain
  risk can help an organization identify systems or components for which additional
  supply chain risk mitigations are required.
aliases:
