id: fd9cf8fb-96df-4e2d-8e19-fdbbdf44dc9e
externalId: IR-5
name: Incident Monitoring
description: Track and document incidents.
elementType: control
parent: ir
guidance: Documenting incidents includes maintaining records about each incident,
  the status of the incident, and other pertinent information necessary for forensics
  as well as evaluating incident details, trends, and handling. Incident information
  can be obtained from a variety of sources, including network monitoring, incident
  reports, incident response teams, user complaints, supply chain partners, audit
  monitoring, physical access monitoring, and user and administrator reports.provides
  information on the types of incidents that are appropriate for monitoring.
