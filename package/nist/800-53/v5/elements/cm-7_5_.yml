id: a141d30e-eda1-437c-8e68-7903e61b2045
externalId: CM-7(5)
name: Least Functionality | Authorized Software — Allow-by-exception
description: "a. Identify [Assignment: organization-defined software programs
  authorized to execute on the system];b. Employ a deny-all, permit-by-exception
  policy to allow the execution of authorized software programs on the system;
  andc. Review and update the list of authorized software programs [Assignment:
  organization-defined frequency]."
elementType: control
