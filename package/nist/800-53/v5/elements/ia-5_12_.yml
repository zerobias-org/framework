id: cb1cc70e-f66b-4021-8e6e-2c1b41a77d6f
externalId: IA-5(12)
name: Authenticator Management | Biometric Authentication Performance
description: 'For biometric-based authentication, employ mechanisms that satisfy the
  following biometric quality requirements [Assignment: organization-defined biometric
  quality requirements].'
elementType: enhancement
parent: ia-5
guidance: Unlike password-based authentication, which provides exact matches of user-input
  passwords to stored passwords, biometric authentication does not provide exact matches.
  Depending on the type of biometric and the type of collection mechanism, there is
  likely to be some divergence from the presented biometric and the stored biometric
  that serves as the basis for comparison. Matching performance is the rate at which
  a biometric algorithm correctly results in a match for a genuine user and rejects
  other users. Biometric performance requirements include the match rate, which reflects
  the accuracy of the biometric matching algorithm used by a system.
