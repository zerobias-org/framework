id: 4abc241a-8102-4007-b66d-aa767e956ebd
externalId: SC-28(2)
name: Protection of Information at Rest | Offline Storage
description: 'Remove the following information from online storage and store offline
  in a secure location: [Assignment: organization-defined information].'
elementType: enhancement
parent: sc-28
guidance: Removing organizational information from online storage to offline storage
  eliminates the possibility of individuals gaining unauthorized access to the information
  through a network. Therefore, organizations may choose to move information to offline
  storage in lieu of protecting such information in online storage.
