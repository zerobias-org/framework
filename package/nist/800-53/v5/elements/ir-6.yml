id: 53171fd4-3830-424a-8889-013c941f36f6
externalId: IR-6
name: Incident Reporting
description: Requires personnel to report suspected incidents within a defined time
  period, and reports incident information to designated authorities.
elementType: control
parent: ir
guidance: The types of incidents reported, the content and timeliness of the reports,
  and the designated reporting authorities reflect applicable laws, executive orders,
  directives, regulations, policies, standards, and guidelines. Incident information
  can inform risk assessments, control effectiveness assessments, security requirements
  for acquisitions, and selection criteria for technology products.
