id: 4789f5e1-b4d1-4159-8579-1759e4f497d3
externalId: CP-9(1)
name: System Backup | Testing for Reliability and Integrity
description: 'Test backup information [Assignment: organization-defined frequency]
  to verify media reliability and information integrity.'
elementType: enhancement
parent: cp-9
guidance: Organizations need assurance that backup information can be reliably retrieved.
  Reliability pertains to the systems and system components where the backup information
  is stored, the operations used to retrieve the information, and the integrity of
  the information being retrieved. Independent and specialized tests can be used for
  each of the aspects of reliability. For example, decrypting and transporting (or
  transmitting) a random sample of backup files from the alternate storage or backup
  site and comparing the information to the same information at the primary processing
  site can provide such assurance.
