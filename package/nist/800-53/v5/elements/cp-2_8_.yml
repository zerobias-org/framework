id: 6eac0713-9b4c-4d8d-80bb-d1a7cf7c64f3
externalId: CP-2(8)
name: Contingency Plan | Identify Critical Assets
description: 'Identify critical system assets supporting [Selection: all; essential]
  mission and business functions.'
elementType: enhancement
parent: cp-2
guidance: Organizations may choose to identify critical assets as part of criticality
  analysis, business continuity planning, or business impact analyses. Organizations
  identify critical system assets so that additional controls can be employed (beyond
  the controls routinely implemented) to help ensure that organizational mission and
  business functions can continue to be conducted during contingency operations. The
  identification of critical information assets also facilitates the prioritization
  of organizational resources. Critical system assets include technical and operational
  aspects. Technical aspects include system components, information technology services,
  information technology products, and mechanisms. Operational aspects include procedures
  (i.e., manually executed operations) and personnel (i.e., individuals operating
  technical controls and/or executing manual procedures). Organizational program protection
  plans can assist in identifying critical assets. If critical assets are resident
  within or supported by external service providers, organizations consider implementingas
  a control enhancement.
