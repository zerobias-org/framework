id: 9b549f7e-8897-4d1c-9347-d3cabb75f346
externalId: CM-3(4)
name: Configuration Change Control | Security and Privacy Representatives
description: 'Require [Assignment: organization-defined security and privacy representatives]
  to be members of the [Assignment: organization-defined configuration change control
  element].'
elementType: enhancement
parent: cm-3
guidance: Information security and privacy representatives include system security
  officers, senior agency information security officers, senior agency officials for
  privacy, or system privacy officers. Representation by personnel with information
  security and privacy expertise is important because changes to system configurations
  can have unintended side effects, some of which may be security- or privacy-relevant.
  Detecting such changes early in the process can help avoid unintended, negative
  consequences that could ultimately affect the security and privacy posture of systems.
  The configuration change control element referred to in the second organization-defined
  parameter reflects the change control elements defined by organizations in.
