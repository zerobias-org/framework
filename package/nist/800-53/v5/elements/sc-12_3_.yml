id: 6f473352-c5b9-4af4-bee6-62642ae28dfc
externalId: SC-12(3)
name: Cryptographic Key Establishment and Management | Asymmetric Keys
description: Produces, controls, and distributes asymmetric cryptographic keys using
  approved key management technology, PKI certificates, or hardware security tokens.
elementType: enhancement
parent: sc-12
guidance: SP 800-56A, SP 800-56B, and SP 800-56C provide guidance on cryptographic
  key establishment schemes and key derivation methods. SP 800-57-1, SP 800-57-2,
  and SP 800-57-3 provide guidance on cryptographic key management.
