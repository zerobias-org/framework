id: b36c4aa7-28cd-42b2-a7e5-16630fc944bf
externalId: IR-9
name: Information Spillage Response
description: "Respond to information spills by:a. Assigning [Assignment:
  organization-defined personnel or roles] with responsibility for responding to
  information spills;b. Identifying the specific information involved in the
  system contamination;c. Alerting [Assignment: organization-defined personnel
  or roles] of the information spill using a method of communication not
  associated with the spill;d. Isolating the contaminated system or system
  component;e. Eradicating the information from the contaminated system or
  component;f. Identifying other systems or system components that may have been
  subsequently contaminated; andg. Performing the following additional actions:
  [Assignment: organization-defined actions]."
elementType: control
