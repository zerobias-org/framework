id: 563233da-d6ec-4825-817b-462eebc42911
externalId: SC-12(1)
name: Cryptographic Key Establishment and Management | Availability
description: Maintain availability of information in the event of the loss of cryptographic
  keys by users.
elementType: enhancement
parent: sc-12
guidance: Escrowing of encryption keys is a common practice for ensuring availability
  in the event of key loss. A forgotten passphrase is an example of losing a cryptographic
  key.
