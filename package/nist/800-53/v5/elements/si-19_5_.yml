id: 486881f8-eed6-49fe-9b7b-0f6d229eb472
externalId: SI-19(5)
name: De-identification | Statistical Disclosure Control
description: Manipulate numerical data, contingency tables, and statistical findings
  so that no individual or organization is identifiable in the results of the analysis.
elementType: enhancement
parent: si-19
guidance: Many types of statistical analyses can result in the disclosure of information
  about individuals even if only summary information is provided. For example, if
  a school that publishes a monthly table with the number of minority students enrolled,
  reports that it has 10-19 such students in January, and subsequently reports that
  it has 20-29 such students in March, then it can be inferred that the student who
  enrolled in February was a minority.
