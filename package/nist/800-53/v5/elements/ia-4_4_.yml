id: 1abd190f-b720-41c8-88db-4ecd418eecf5
externalId: IA-4(4)
name: Identifier Management | Identify User Status
description: 'Manage individual identifiers by uniquely identifying each individual
  as [Assignment: organization-defined characteristic identifying individual status].'
elementType: enhancement
parent: ia-4
guidance: Characteristics that identify the status of individuals include contractors,
  foreign nationals, and non-organizational users. Identifying the status of individuals
  by these characteristics provides additional information about the people with whom
  organizational personnel are communicating. For example, it might be useful for
  a government employee to know that one of the individuals on an email message is
  a contractor.
