id: 280f53d1-f6fb-44dc-be97-771142481feb
externalId: SC-8(4)
name: Transmission Confidentiality and Integrity | Conceal or Randomize Communications
description: 'Implement cryptographic mechanisms to conceal or randomize communication
  patterns unless otherwise protected by [Assignment: organization-defined alternative
  physical controls].'
elementType: enhancement
parent: sc-8
guidance: Concealing or randomizing communication patterns addresses protection from
  unauthorized disclosure of information. Communication patterns include frequency,
  periods, predictability, and amount. Changes to communications patterns can reveal
  information with intelligence value, especially when combined with other available
  information related to the mission and business functions of the organization. Concealing
  or randomizing communications prevents the derivation of intelligence based on communications
  patterns and applies to both internal and external networks or links that may be
  visible to individuals who are not authorized users. Encrypting the links and transmitting
  in continuous, fixed, or random patterns prevents the derivation of intelligence
  from the system communications patterns. Alternative physical controls include protected
  distribution systems.
aliases:
