id: ebbee022-770e-413e-a847-61cedb019aba
externalId: AC-11(1)
name: Device Lock | Pattern-hiding Displays
description: Conceal, via the device lock, information previously visible on the display
  with a publicly viewable image.
elementType: enhancement
parent: ac-11
guidance: The pattern-hiding display can include static or dynamic images, such as
  patterns used with screen savers, photographic images, solid colors, clock, battery
  life indicator, or a blank screen with the caveat that controlled unclassified information
  is not displayed.
