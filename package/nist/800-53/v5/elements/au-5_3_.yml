id: 27accff2-919f-4ed4-a5dd-fe473c7af9c5
externalId: AU-5(3)
name: Response to Audit Logging Process Failures | Configurable Traffic Volume Thresholds
description: 'Enforce configurable network communications traffic volume thresholds
  reflecting limits on audit log storage capacity and [Selection: reject; delay] network
  traffic above those thresholds.'
elementType: enhancement
parent: au-5
guidance: Organizations have the capability to reject or delay the processing of network
  communications traffic if audit logging information about such traffic is determined
  to exceed the storage capacity of the system audit logging function. The rejection
  or delay response is triggered by the established organizational traffic volume
  thresholds that can be adjusted based on changes to audit log storage capacity.
