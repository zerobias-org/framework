id: bed18ee1-5cb8-42df-bfec-8dd1d41cd0f8
externalId: AC-4(21)
name: Information Flow Enforcement | Physical or Logical Separation of Information
  Flows
description: Separates information flows logically or physically to achieve defined
  required separations by information type.
elementType: enhancement
parent: ac-4
guidance: Enforcing the separation of information flows associated with defined types
  of data can enhance protection by ensuring that information is not commingled while
  in transit and by enabling flow control by transmission paths that are not otherwise
  achievable. Types of separable information include inbound and outbound communications
  traffic, service requests and responses, and information of differing security impact
  or classification levels.
