externalId: CP-2(1)
name: Contingency Plan | Coordinate with Related Plans
description: Coordinate contingency plan development with organizational elements
  responsible for related plans.
elementType: enhancement
parent: cp-2
guidance: Plans that are related to contingency plans include Business Continuity
  Plans, Disaster Recovery Plans, Critical Infrastructure Plans, Continuity of Operations
  Plans, Crisis Communications Plans, Insider Threat Implementation Plans, Data Breach
  Response Plans, Cyber Incident Response Plans, Breach Response Plans, and Occupant
  Emergency Plans.
