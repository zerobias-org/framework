id: b5b13aeb-48a0-4577-9b20-962dc31f26c0
externalId: SC-7(28)
name: Boundary Protection | Connections to Public Networks
description: 'Prohibit the direct connection of [Assignment: organization-defined
  system] to a public network.'
elementType: enhancement
parent: sc-7
guidance: A direct connection is a dedicated physical or virtual connection between
  two or more systems. A public network is a network accessible to the public, including
  the Internet and organizational extranets with public access.
