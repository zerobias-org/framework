id: 2678f357-300b-46ef-89ac-7b335d7f50fb
externalId: SR-11
name: Component Authenticity
description: Develops anti-counterfeit policy and procedures to detect and prevent
  counterfeit components, and reports counterfeit components when found.
elementType: control
parent: sr
guidance: Sources of counterfeit components include manufacturers, developers, vendors,
  and contractors. Anti-counterfeiting policies and procedures support tamper resistance
  and provide a level of protection against the introduction of malicious code. External
  reporting organizations include CISA.
aliases:
