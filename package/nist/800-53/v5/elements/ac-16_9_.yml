id: 699ab596-6edb-4aca-a307-3b21f348e992
externalId: AC-16(9)
name: Security and Privacy Attributes | Attribute Reassignment — Regrading Mechanisms
description: 'Change security and privacy attributes associated with information only
  via regrading mechanisms validated using [Assignment: organization-defined techniques
  or procedures].'
elementType: enhancement
parent: ac-16
guidance: A regrading mechanism is a trusted process authorized to re-classify and
  re-label data in accordance with a defined policy exception. Validated regrading
  mechanisms are used by organizations to provide the requisite levels of assurance
  for attribute reassignment activities. The validation is facilitated by ensuring
  that regrading mechanisms are single purpose and of limited function. Since security
  and privacy attribute changes can directly affect policy enforcement actions, implementing
  trustworthy regrading mechanisms is necessary to help ensure that such mechanisms
  perform in a consistent and correct mode of operation.
