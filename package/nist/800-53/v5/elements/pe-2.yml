name: Physical Access Authorizations
description: "a. Develop, approve, and maintain a list of individuals with
  authorized access to the facility where the system resides;b. Issue
  authorization credentials for facility access;c. Review the access list
  detailing authorized facility access by individuals [Assignment:
  organization-defined frequency]; andd. Remove individuals from the facility
  access list when access is no longer required."
