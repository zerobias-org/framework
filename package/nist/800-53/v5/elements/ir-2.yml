id: b20e6f47-eaf4-4a6c-af85-c92ed44d8ef2
externalId: IR-2
name: Incident Response Training
description: Provides incident response training to system users based on their roles,
  before assuming responsibilities and periodically thereafter.
elementType: control
parent: ir
guidance: Incident response training is associated with the assigned roles and responsibilities
  of organizational personnel to ensure that the appropriate content and level of
  detail are included in such training. For example, users may only need to know who
  to call or how to recognize an incident; system administrators may require additional
  training on how to handle incidents; and incident responders may receive more specific
  training on forensics, data collection techniques, reporting, system recovery, and
  system restoration. Incident response training includes user training in identifying
  and reporting suspicious activities from external and internal sources. Incident
  response training for users may be provided as part ofor. Events that may precipitate
  an update to incident response training content include, but are not limited to,
  incident response plan testing or response to an actual incident (lessons learned),
  assessment or audit findings, or changes in applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines.
