id: 56f4d47f-a767-43af-a6da-4977b0f1674d
externalId: PS-6(2)
name: Access Agreements | Classified Information Requiring Special Protection
description: Verify that access to classified information requiring special
  protection is granted only to individuals who:a. Have a valid access
  authorization that is demonstrated by assigned official government duties;b.
  Satisfy associated personnel security criteria; andc. Have read, understood,
  and signed a nondisclosure agreement.
elementType: control
