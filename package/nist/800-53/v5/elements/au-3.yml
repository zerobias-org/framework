externalId: AU-3
name: Content of Audit Records
description: Ensure that audit records contain information that establishes the
  following:a. What type of event occurred;b. When the event occurred;c. Where
  the event occurred;d. Source of the event;e. Outcome of the event; andf.
  Identity of any individuals, subjects, or objects/entities associated with the
  event.
elementType: control
