id: 59e3782b-b341-4ad3-961f-3f78acbacb29
externalId: SC-5
name: Denial-of-service Protection
description: Protects against or limits the effects of defined denial-of-service event
  types, employing defined controls for each event type.
elementType: control
parent: sc
guidance: Denial-of-service events may occur due to a variety of internal and external
  causes, such as an attack by an adversary or a lack of planning to support organizational
  needs with respect to capacity and bandwidth. Such attacks can occur across a wide
  range of network protocols (e.g., IPv4, IPv6). A variety of technologies are available
  to limit or eliminate the origination and effects of denial-of-service events. For
  example, boundary protection devices can filter certain types of packets to protect
  system components on internal networks from being directly affected by or the source
  of denial-of-service attacks. Employing increased network capacity and bandwidth
  combined with service redundancy also reduces the susceptibility to denial-of-service
  events.
