id: 379c99bb-020b-4243-8987-5c796d945d5d
externalId: CA-8(2)
name: Penetration Testing | Red Team Exercises
description: Employs red-team exercises to simulate adversary attempts to compromise
  organizational systems under defined rules of engagement.
elementType: enhancement
parent: ca-8
guidance: Red team exercises extend the objectives of penetration testing by examining
  the security and privacy posture of organizations and the capability to implement
  effective cyber defenses. Red team exercises simulate attempts by adversaries to
  compromise mission and business functions and provide a comprehensive assessment
  of the security and privacy posture of systems and organizations. Such attempts
  may include technology-based attacks and social engineering-based attacks. Technology-based
  attacks include interactions with hardware, software, or firmware components and/or
  mission and business processes. Social engineering-based attacks include interactions
  via email, telephone, shoulder surfing, or personal conversations. Red team exercises
  are most effective when conducted by penetration testing agents and teams with knowledge
  of and experience with current adversarial tactics, techniques, procedures, and
  tools. While penetration testing may be primarily laboratory-based testing, organizations
  can use red team exercises to provide more comprehensive assessments that reflect
  real-world conditions. The results from red team exercises can be used by organizations
  to improve security and privacy awareness and training and to assess control effectiveness.
