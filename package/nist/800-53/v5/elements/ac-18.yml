id: e0f7ae77-dbcf-4a35-bcff-83e28b9fc04d
externalId: AC-18
name: Wireless Access
description: Requires organizations to establish requirements for wireless access
  and authorize each type before allowing connections.
elementType: control
parent: ac
guidance: Wireless technologies include microwave, packet radio (ultra-high frequency
  or very high frequency), 802.11x, and Bluetooth. Wireless networks use authentication
  protocols that provide authenticator protection and mutual authentication.
