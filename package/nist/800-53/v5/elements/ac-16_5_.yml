id: 72dae0f7-e77b-463d-a554-2d8dad835899
externalId: AC-16(5)
name: Security and Privacy Attributes | Attribute Displays on Objects to Be Output
description: Displays security and privacy attributes in human-readable form on objects
  sent to output devices, using standard naming conventions.
elementType: enhancement
parent: ac-16
guidance: System outputs include printed pages, screens, or equivalent items. System
  output devices include printers, notebook computers, video displays, smart phones,
  and tablets. To mitigate the risk of unauthorized exposure of information (e.g.,
  shoulder surfing), the outputs display full attribute values when unmasked by the
  subscriber.
