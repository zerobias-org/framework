id: 86f2c414-0a59-4142-b1ae-17f917204382
externalId: SR-4(1)
name: Provenance | Identity
description: Establishes and maintains unique identification of supply chain elements,
  processes, and personnel associated with the system and its critical components.
elementType: enhancement
parent: sr-4
guidance: Knowing who and what is in the supply chains of organizations is critical
  to gaining visibility into supply chain activities. Visibility into supply chain
  activities is also important for monitoring and identifying high-risk events and
  activities. Without reasonable visibility into supply chains elements, processes,
  and personnel, it is very difficult for organizations to understand and manage risk
  and reduce their susceptibility to adverse events. Supply chain elements include
  organizations, entities, or tools used for the research and development, design,
  manufacturing, acquisition, delivery, integration, operations, maintenance, and
  disposal of systems and system components. Supply chain processes include development
  processes for hardware, software, and firmware; shipping and handling procedures;
  configuration management tools, techniques, and measures to maintain provenance;
  personnel and physical security programs; or other programs, processes, or procedures
  associated with the production and distribution of supply chain elements. Supply
  chain personnel are individuals with specific roles and responsibilities related
  to the secure the research and development, design, manufacturing, acquisition,
  delivery, integration, operations and maintenance, and disposal of a system or system
  component. Identification methods are sufficient to support an investigation in
  case of a supply chain change (e.g. if a supply company is purchased), compromise,
  or event.
