id: d9c0ee2e-bcf6-41af-bf44-d5b3ed3d0eb0
externalId: SC-12
name: Cryptographic Key Establishment and Management
description: Establishes and manages cryptographic keys according to defined requirements
  for generation, distribution, storage, access, and destruction.
elementType: control
parent: sc
guidance: Cryptographic key management and establishment can be performed using manual
  procedures or automated mechanisms with supporting manual procedures. Organizations
  define key management requirements in accordance with applicable laws, executive
  orders, directives, regulations, policies, standards, and guidelines and specify
  appropriate options, parameters, and levels. Organizations manage trust stores to
  ensure that only approved trust anchors are part of such trust stores. This includes
  certificates with visibility external to organizational systems and certificates
  related to the internal operations of systems. NIST CMVP and NIST CAVP provide additional
  information on validated cryptographic modules and algorithms that can be used in
  cryptographic key management and establishment.
aliases:
