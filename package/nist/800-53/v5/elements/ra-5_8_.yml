id: 3120dcd4-f39f-4833-aea6-54e95c803892
externalId: RA-5(8)
name: Vulnerability Monitoring and Scanning | Review Historic Audit Logs
description: Reviews historic audit logs to determine whether an identified vulnerability
  was previously exploited within a defined time period.
elementType: enhancement
parent: ra-5
guidance: Reviewing historic audit logs to determine if a recently detected vulnerability
  in a system has been previously exploited by an adversary can provide important
  information for forensic analyses. Such analyses can help identify, for example,
  the extent of a previous intrusion, the trade craft employed during the attack,
  organizational information exfiltrated or modified, mission or business capabilities
  affected, and the duration of the attack.
aliases:
