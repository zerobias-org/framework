id: ce1fc492-6a32-433d-aa21-c04ece91911b
externalId: MP-5(3)
name: Media Transport | Custodians
description: Employ an identified custodian during transport of system media outside
  of controlled areas.
elementType: enhancement
parent: mp-5
guidance: Identified custodians provide organizations with specific points of contact
  during the media transport process and facilitate individual accountability. Custodial
  responsibilities can be transferred from one individual to another if an unambiguous
  custodian is identified.
aliases:
