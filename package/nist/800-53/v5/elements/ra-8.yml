id: 5b656851-aed9-43f2-9506-4719233e9796
externalId: RA-8
name: Privacy Impact Assessments
description: Conduct privacy impact assessments for systems, programs, or other
  activities before:a. Developing or procuring information technology that
  processes personally identifiable information; andb. Initiating a new
  collection of personally identifiable information that:1. Will be processed
  using information technology; and2. Includes personally identifiable
  information permitting the physical or virtual (online) contacting of a
  specific individual, if identical questions have been posed to, or identical
  reporting requirements imposed on, ten or more individuals, other than
  agencies, instrumentalities, or employees of the federal government.
elementType: control
