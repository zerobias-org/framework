id: 501ee4bb-d7c3-40c7-a16a-57dfb43f9e56
externalId: PM-16(1)
name: Threat Awareness Program | Automated Means for Sharing Threat Intelligence Feeds
description: Employ automated mechanisms to maximize the effectiveness of sharing
  threat intelligence information.
elementType: enhancement
parent: pm-16
guidance: To maximize the effectiveness of monitoring, it is important to know what
  threat observables and indicators the sensors need to be searching for. By using
  well-established frameworks, services, and automated tools, organizations improve
  their ability to rapidly share and feed the relevant threat detection signatures
  into monitoring tools.
