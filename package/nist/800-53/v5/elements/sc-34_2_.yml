id: d4a7601e-9be5-4927-ba0f-f8bdbb6f24d8
externalId: SC-34(2)
name: Non-modifiable Executable Programs | Integrity Protection on Read-only Media
description: Protect the integrity of information prior to storage on read-only media
  and control the media after such information has been recorded onto the media.
elementType: enhancement
parent: sc-34
guidance: Controls prevent the substitution of media into systems or the reprogramming
  of programmable read-only media prior to installation into the systems. Integrity
  protection controls include a combination of prevention, detection, and response.
aliases:
