id: 3a3e69d0-aa22-4797-898a-da4390912ffb
externalId: SC-5(1)
name: Denial-of-service Protection | Restrict Ability to Attack Other Systems
description: 'Restrict the ability of individuals to launch the following denial-of-service
  attacks against other systems: [Assignment: organization-defined denial-of-service
  attacks].'
elementType: enhancement
parent: sc-5
guidance: Restricting the ability of individuals to launch denial-of-service attacks
  requires the mechanisms commonly used for such attacks to be unavailable. Individuals
  of concern include hostile insiders or external adversaries who have breached or
  compromised the system and are using it to launch a denial-of-service attack. Organizations
  can restrict the ability of individuals to connect and transmit arbitrary information
  on the transport medium (i.e., wired networks, wireless networks, spoofed Internet
  protocol packets). Organizations can also limit the ability of individuals to use
  excessive system resources. Protection against individuals having the ability to
  launch denial-of-service attacks may be implemented on specific systems or boundary
  devices that prohibit egress to potential target systems.
aliases:
