id: 5faf95c2-565c-47fa-9722-251bb2fdb1d4
externalId: SC-7(26)
name: Boundary Protection | Classified National Security System Connections
description: 'Prohibit the direct connection of a classified national security system
  to an external network without the use of [Assignment: organization-defined boundary
  protection device].'
elementType: enhancement
parent: sc-7
guidance: A direct connection is a dedicated physical or virtual connection between
  two or more systems. Organizations typically do not have complete control over external
  networks, including the Internet. Boundary protection devices (e.g., firewalls,
  gateways, and routers) mediate communications and information flows between classified
  national security systems and external networks. In addition, approved boundary
  protection devices (typically managed interface or cross-domain systems) provide
  information flow enforcement from systems to external networks.
aliases:
