id: b9ebecf9-583e-4de8-ba6b-3f21d14e3ee6
externalId: PM-32
name: Purposing
description: Analyzes systems supporting essential functions to ensure information
  resources are used consistent with their intended purpose.
elementType: control
parent: pm
guidance: Systems are designed to support a specific mission or business function.
  However, over time, systems and system components may be used to support services
  and functions that are outside of the scope of the intended mission or business
  functions. This can result in exposing information resources to unintended environments
  and uses that can significantly increase threat exposure. In doing so, the systems
  are more vulnerable to compromise, which can ultimately impact the services and
  functions for which they were intended. This is especially impactful for mission-essential
  services and functions. By analyzing resource use, organizations can identify such
  potential exposures.
