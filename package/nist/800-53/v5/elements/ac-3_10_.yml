id: 4f2b029a-0c36-4ae3-bd9e-0d004941e749
externalId: AC-3(10)
name: Access Enforcement | Audited Override of Access Control Mechanisms
description: 'Employ an audited override of automated access control mechanisms under
  [Assignment: organization-defined conditions] by [Assignment: organization-defined
  roles].'
elementType: enhancement
parent: ac-3
guidance: In certain situations, such as when there is a threat to human life or an
  event that threatens the organization’s ability to carry out critical missions or
  business functions, an override capability for access control mechanisms may be
  needed. Override conditions are defined by organizations and used only in those
  limited circumstances. Audit events are defined in. Audit records are generated
  in.
aliases:
