id: 10f3c1ef-20d5-4e5d-95ad-1c8deffaf1bc
externalId: SA-4(5)
name: Acquisition Process | System, Component, and Service Configurations
description: Requires the developer to deliver the system, component, or service with
  defined security configurations implemented and used as the default thereafter.
elementType: enhancement
parent: sa-4
guidance: Examples of security configurations include the U.S. Government Configuration
  Baseline (USGCB), Security Technical Implementation Guides (STIGs), and any limitations
  on functions, ports, protocols, and services. Security characteristics can include
  requiring that default passwords have been changed.
