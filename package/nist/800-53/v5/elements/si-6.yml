id: 9fb0cff6-fedc-4677-afa3-ad118dfaf5c5
externalId: SI-6
name: Security and Privacy Function Verification
description: Verifies the correct operation of defined security and privacy functions,
  alerts personnel on failure, and shuts down, restarts, or takes alternative action
  on anomalies.
elementType: control
parent: si
guidance: Transitional states for systems include system startup, restart, shutdown,
  and abort. System notifications include hardware indicator lights, electronic alerts
  to system administrators, and messages to local computer consoles. In contrast to
  security function verification, privacy function verification ensures that privacy
  functions operate as expected and are approved by the senior agency official for
  privacy or that privacy attributes are applied or used as expected.
aliases:
- SI-6
