id: 19876e00-0827-4c10-80a5-7692fe5f31b5
externalId: SC-12(6)
name: Cryptographic Key Establishment and Management | Physical Control of Keys
description: Maintain physical control of cryptographic keys when stored information
  is encrypted by external service providers.
elementType: enhancement
parent: sc-12
guidance: For organizations that use external service providers (e.g., cloud service
  or data center providers), physical control of cryptographic keys provides additional
  assurance that information stored by such external providers is not subject to unauthorized
  disclosure or modification.
