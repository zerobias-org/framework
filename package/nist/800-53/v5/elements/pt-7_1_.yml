id: baad2da6-2d8f-4263-b402-87b7b63a70e8
externalId: PT-7(1)
name: Specific Categories of Personally Identifiable Information | Social Security
  Numbers
description: Eliminates unnecessary collection and use of Social Security numbers,
  and informs individuals whether disclosure is mandatory and how the number will
  be used.
elementType: enhancement
parent: pt-7
guidance: Federal law and policy establish specific requirements for organizations’
  processing of Social Security numbers. Organizations take steps to eliminate unnecessary
  uses of Social Security numbers and other sensitive information and observe any
  particular requirements that apply.
aliases:
