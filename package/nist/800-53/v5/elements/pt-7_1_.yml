id: baad2da6-2d8f-4263-b402-87b7b63a70e8
externalId: PT-7(1)
name: Specific Categories of Personally Identifiable Information | Social
  Security Numbers
description: When a system processes Social Security numbers:a. Eliminate
  unnecessary collection, maintenance, and use of Social Security numbers, and
  explore alternatives to their use as a personal identifier;b. Do not deny any
  individual any right, benefit, or privilege provided by law because of such
  individual’s refusal to disclose his or her Social Security number; andc.
  Inform any individual who is asked to disclose his or her Social Security
  number whether that disclosure is mandatory or voluntary, by what statutory or
  other authority such number is solicited, and what uses will be made of it.
elementType: control
