id: 7955a1ea-0989-4474-987e-ea3fbf523db6
externalId: AC-6(5)
name: Least Privilege | Privileged Accounts
description: 'Restrict privileged accounts on the system to [Assignment: organization-defined
  personnel or roles].'
elementType: enhancement
parent: ac-6
guidance: Privileged accounts, including super user accounts, are typically described
  as system administrator for various types of commercial off-the-shelf operating
  systems. Restricting privileged accounts to specific personnel or roles prevents
  day-to-day users from accessing privileged information or privileged functions.
  Organizations may differentiate in the application of restricting privileged accounts
  between allowed privileges for local accounts and for domain accounts provided that
  they retain the ability to control system configurations for key parameters and
  as otherwise necessary to sufficiently mitigate risk.
aliases:
