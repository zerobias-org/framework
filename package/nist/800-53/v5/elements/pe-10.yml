id: 5b4cdd41-5547-4a8d-b350-a53ecf389c0e
externalId: PE-10
name: Emergency Shutoff
description: Provides an emergency power shutoff capability for the system, places
  switches for authorized access, and protects them from unauthorized activation.
elementType: control
parent: pe
guidance: Emergency power shutoff primarily applies to organizational facilities that
  contain concentrations of system resources, including data centers, mainframe computer
  rooms, server rooms, and areas with computer-controlled machinery.
