id: 7cebe6f6-5120-45ca-8654-602bc86353ac
externalId: SR-3(2)
name: Supply Chain Controls and Processes | Limitation of Harm
description: 'Employ the following controls to limit harm from potential adversaries
  identifying and targeting the organizational supply chain: [Assignment: organization-defined
  controls].'
elementType: enhancement
parent: sr-3
guidance: Controls that can be implemented to reduce the probability of adversaries
  successfully identifying and targeting the supply chain include avoiding the purchase
  of custom or non-standardized configurations, employing approved vendor lists with
  standing reputations in industry, following pre-agreed maintenance schedules and
  update and patch delivery mechanisms, maintaining a contingency plan in case of
  a supply chain event, using procurement carve-outs that provide exclusions to commitments
  or obligations, using diverse delivery routes, and minimizing the time between purchase
  decisions and delivery.
