id: 371aa2a6-e8f4-4a97-a4d0-6ad5797ce90b
externalId: AU-12(1)
name: Audit Record Generation | System-wide and Time-correlated Audit Trail
description: Compiles audit records from system components into a system-wide, time-correlated
  audit trail within a defined tolerance.
elementType: enhancement
parent: au-12
guidance: Audit trails are time-correlated if the time stamps in the individual audit
  records can be reliably related to the time stamps in other audit records to achieve
  a time ordering of the records within organizational tolerances.
aliases:
