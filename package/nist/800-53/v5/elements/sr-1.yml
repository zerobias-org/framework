name: Policy and Procedures
description: "a. Develop, document, and disseminate to [Assignment:
  organization-defined personnel or roles]:1. [Selection (one or more):
  Organization-level; Mission/business process-level; System-level] supply chain
  risk management policy that:a. Addresses purpose, scope, roles,
  responsibilities, management commitment, coordination among organizational
  entities, and compliance; andb. Is consistent with applicable laws, executive
  orders, directives, regulations, policies, standards, and guidelines; and2.
  Procedures to facilitate the implementation of the supply chain risk
  management policy and the associated supply chain risk management controls;b.
  Designate an [Assignment: organization-defined official] to manage the
  development, documentation, and dissemination of the supply chain risk
  management policy and procedures; andc. Review and update the current supply
  chain risk management:1. Policy [Assignment: organization-defined frequency]
  and following [Assignment: organization-defined events]; and2. Procedures
  [Assignment: organization-defined frequency] and following [Assignment:
  organization-defined events]."
