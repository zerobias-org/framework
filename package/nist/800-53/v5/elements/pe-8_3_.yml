id: 4231c612-57a0-407f-a996-34e35e7f72de
externalId: PE-8(3)
name: Visitor Access Records | Limit Personally Identifiable Information Elements
description: 'Limit personally identifiable information contained in visitor access
  records to the following elements identified in the privacy risk assessment: [Assignment:
  organization-defined elements].'
elementType: enhancement
parent: pe-8
guidance: Organizations may have requirements that specify the contents of visitor
  access records. Limiting personally identifiable information in visitor access records
  when such information is not needed for operational purposes helps reduce the level
  of privacy risk created by a system.
