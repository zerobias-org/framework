id: 3f15e62b-ded7-48ca-abe6-21253ed3ea33
externalId: CA-2(2)
name: Control Assessments | Specialized Assessments
description: Includes specialized forms of assessment such as in-depth monitoring,
  security instrumentation, or penetration testing as part of control assessments.
elementType: enhancement
parent: ca-2
guidance: Organizations can conduct specialized assessments, including verification
  and validation, system monitoring, insider threat assessments, malicious user testing,
  and other forms of testing. These assessments can improve readiness by exercising
  organizational capabilities and indicating current levels of performance as a means
  of focusing actions to improve security and privacy. Organizations conduct specialized
  assessments in accordance with applicable laws, executive orders, directives, regulations,
  policies, standards, and guidelines. Authorizing officials approve the assessment
  methods in coordination with the organizational risk executive function. Organizations
  can include vulnerabilities uncovered during assessments into vulnerability remediation
  processes. Specialized assessments can also be conducted early in the system development
  life cycle (e.g., during initial design, development, and unit testing).
aliases:
