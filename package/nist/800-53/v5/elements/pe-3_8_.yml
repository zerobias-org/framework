id: 6988c3a9-6873-4c34-a247-41857b20dd61
externalId: PE-3(8)
name: Physical Access Control | Access Control Vestibules
description: 'Employ access control vestibules at [Assignment: organization-defined
  locations within the facility].'
elementType: enhancement
parent: pe-3
guidance: An access control vestibule is part of a physical access control system
  that typically provides a space between two sets of interlocking doors. Vestibules
  are designed to prevent unauthorized individuals from following authorized individuals
  into facilities with controlled access. This activity, also known as piggybacking
  or tailgating, results in unauthorized access to the facility. Interlocking door
  controllers can be used to limit the number of individuals who enter controlled
  access points and to provide containment areas while authorization for physical
  access is verified. Interlocking door controllers can be fully automated (i.e.,
  controlling the opening and closing of the doors) or partially automated (i.e.,
  using security guards to control the number of individuals entering the containment
  area).
