id: 28f85ec5-7c2b-4bf1-be7a-e7c0ec25c120
externalId: AU-9(1)
name: Protection of Audit Information | Hardware Write-once Media
description: Write audit trails to hardware-enforced, write-once media.
elementType: enhancement
parent: au-9
guidance: Writing audit trails to hardware-enforced, write-once media applies to the
  initial generation of audit trails (i.e., the collection of audit records that represents
  the information to be used for detection, analysis, and reporting purposes) and
  to the backup of those audit trails. Writing audit trails to hardware-enforced,
  write-once media does not apply to the initial generation of audit records prior
  to being written to an audit trail. Write-once, read-many (WORM) media includes
  Compact Disc-Recordable (CD-R), Blu-Ray Disc Recordable (BD-R), and Digital Versatile
  Disc-Recordable (DVD-R). In contrast, the use of switchable write-protection media,
  such as tape cartridges, Universal Serial Bus (USB) drives, Compact Disc Re-Writeable
  (CD-RW), and Digital Versatile Disc-Read Write (DVD-RW) results in write-protected
  but not write-once media.
