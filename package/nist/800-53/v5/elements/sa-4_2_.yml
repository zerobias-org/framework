id: 18f641a6-b7d5-4db4-86e0-4499bd7037eb
externalId: SA-4(2)
name: Acquisition Process | Design and Implementation Information for Controls
description: "Require the developer of the system, system component, or system
  service to provide design and implementation information for the controls that
  includes: [Selection (one or more): security-relevant external system
  interfaces; high-level design; low-level design; source code or hardware
  schematics; [Assignment: organization-defined design and implementation
  information]] at [Assignment: organization-defined level of detail]."
elementType: control
