id: 2bf4047b-a604-499f-951c-cdf96aa2b32c
externalId: SA-4(2)
name: Acquisition Process | Design and Implementation Information for Controls
description: Requires the developer to provide defined design and implementation information
  for controls at a defined level of detail.
elementType: enhancement
parent: sa-4
guidance: Organizations may require different levels of detail in the documentation
  for the design and implementation of controls in organizational systems, system
  components, or system services based on mission and business requirements, requirements
  for resiliency and trustworthiness, and requirements for analysis and testing. Systems
  can be partitioned into multiple subsystems. Each subsystem within the system can
  contain one or more modules. The high-level design for the system is expressed in
  terms of subsystems and the interfaces between subsystems providing security-relevant
  functionality. The low-level design for the system is expressed in terms of modules
  and the interfaces between modules providing security-relevant functionality. Design
  and implementation documentation can include manufacturer, version, serial number,
  verification hash signature, software libraries used, date of purchase or download,
  and the vendor or download source. Source code and hardware schematics are referred
  to as the implementation representation of the system.
