id: 88def3a5-6bca-4e04-bf4e-b1a0956f89b9
externalId: SI-7
name: Software, Firmware, and Information Integrity
description: Employs integrity verification tools to detect unauthorized changes to
  defined software, firmware, and information, and takes defined action when detected.
elementType: control
parent: si
guidance: Unauthorized changes to software, firmware, and information can occur due
  to errors or malicious activity. Software includes operating systems (with key internal
  components, such as kernels or drivers), middleware, and applications. Firmware
  interfaces include Unified Extensible Firmware Interface (UEFI) and Basic Input/Output
  System (BIOS). Information includes personally identifiable information and metadata
  that contains security and privacy attributes associated with information. Integrity-checking
  mechanisms—including parity checks, cyclical redundancy checks, cryptographic hashes,
  and associated tools—can automatically monitor the integrity of systems and hosted
  applications.
