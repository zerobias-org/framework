name: Non-persistence | Refresh from Trusted Sources
description: 'Obtain software and data employed during system component and service
  refreshes from the following trusted sources: [Assignment: organization-defined
  trusted sources].'
elementType: enhancement
parent: si-14
guidance: Trusted sources include software and data from write-once, read-only media
  or from selected offline secure storage facilities.
