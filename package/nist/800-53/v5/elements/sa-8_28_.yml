id: 64bd98e0-b315-43df-8c3d-3f58fb899fa0
externalId: SA-8(28)
name: Security and Privacy Engineering Principles | Acceptable Security
description: 'Implement the security design principle of acceptable security in [Assignment:
  organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of acceptable security requires that the level of privacy
  and performance that the system provides is consistent with the users’ expectations.
  The perception of personal privacy may affect user behavior, morale, and effectiveness.
  Based on the organizational privacy policy and the system design, users should be
  able to restrict their actions to protect their privacy. When systems fail to provide
  intuitive interfaces or meet privacy and performance expectations, users may either
  choose to completely avoid the system or use it in ways that may be inefficient
  or even insecure.
