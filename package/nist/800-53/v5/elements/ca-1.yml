  monitoring controls;b. Designate an [Assignment: organization-defined
  official] to manage the development, documentation, and dissemination of the
  assessment, authorization, and monitoring policy and procedures; andc. Review
  and update the current assessment, authorization, and monitoring:1. Policy
  [Assignment: organization-defined frequency] and following [Assignment:
  organization-defined events]; and2. Procedures [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]."
