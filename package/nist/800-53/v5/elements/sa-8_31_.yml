id: d2cda45a-bf22-48e2-bece-2ca6c8824aa8
externalId: SA-8(31)
name: Security and Privacy Engineering Principles | Secure System Modification
description: 'Implement the security design principle of secure system modification
  in [Assignment: organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of secure system modification states that system modification
  maintains system security with respect to the security requirements and risk tolerance
  of stakeholders. Upgrades or modifications to systems can transform secure systems
  into systems that are not secure. The procedures for system modification ensure
  that if the system is to maintain its trustworthiness, the same rigor that was applied
  to its initial development is applied to any system changes. Because modifications
  can affect the ability of the system to maintain its secure state, a careful security
  analysis of the modification is needed prior to its implementation and deployment.
  This principle parallels the principle of secure evolvability.
