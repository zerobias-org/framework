id: b3e6a54d-e1d9-4c8a-8772-53fdae743362
externalId: PE-6(3)
name: Monitoring Physical Access | Video Surveillance
description: Employs video surveillance of defined operational areas, reviews recordings
  periodically, and retains them for a defined period.
elementType: enhancement
parent: pe-6
guidance: Video surveillance focuses on recording activity in specified areas for
  the purposes of subsequent review, if circumstances so warrant. Video recordings
  are typically reviewed to detect anomalous events or incidents. Monitoring the surveillance
  video is not required, although organizations may choose to do so. There may be
  legal considerations when performing and retaining video surveillance, especially
  if such surveillance is in a public location.
aliases:
