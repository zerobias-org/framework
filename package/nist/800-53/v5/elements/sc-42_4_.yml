id: 706c6d9f-6882-46ed-9b8f-5ed183a601d8
externalId: SC-42(4)
name: Sensor Capability and Data | Notice of Collection
description: Employs defined measures to facilitate individuals' awareness that personally
  identifiable information is being collected by defined sensors.
elementType: enhancement
parent: sc-42
guidance: Awareness that organizational sensors are collecting data enables individuals
  to more effectively engage in managing their privacy. Measures can include conventional
  written notices and sensor configurations that make individuals directly or indirectly
  aware through other devices that the sensor is collecting information. The usability
  and efficacy of the notice are important considerations.
