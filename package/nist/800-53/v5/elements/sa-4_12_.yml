id: a7ce8179-9cb0-427f-8fa1-9ee7e3ff1362
externalId: SA-4(12)
name: Acquisition Process | Data Ownership
description: Includes data ownership requirements in acquisition contracts and requires
  contractor data be returned within a defined time frame.
elementType: enhancement
parent: sa-4
guidance: Contractors who operate a system that contains data owned by an organization
  initiating the contract have policies and procedures in place to remove the data
  from their systems and/or return the data in a time frame defined by the contract.
aliases:
