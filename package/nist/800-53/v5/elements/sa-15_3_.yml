id: eb99be15-47b7-4ebe-99dd-7546fae19fb7
externalId: SA-15(3)
name: Development Process, Standards, and Tools | Criticality Analysis
description: Requires the developer to perform a criticality analysis at defined decision
  points and level of rigor during the development life cycle.
elementType: enhancement
parent: sa-15
guidance: Criticality analysis performed by the developer provides input to the criticality
  analysis performed by organizations. Developer input is essential to organizational
  criticality analysis because organizations may not have access to detailed design
  documentation for system components that are developed as commercial off-the-shelf
  products. Such design documentation includes functional specifications, high-level
  designs, low-level designs, source code, and hardware schematics. Criticality analysis
  is important for organizational systems that are designated as high value assets.
  High value assets can be moderate- or high-impact systems due to heightened adversarial
  interest or potential adverse effects on the federal enterprise. Developer input
  is especially important when organizations conduct supply chain criticality analyses.
aliases:
