id: d4f43bee-c768-4c96-8c64-5a5740382a31
externalId: AC-3(8)
name: Access Enforcement | Revocation of Access Authorizations
description: Revokes access authorizations when the security attributes of subjects
  or objects change, per defined timing rules.
elementType: enhancement
parent: ac-3
guidance: Revocation of access rules may differ based on the types of access revoked.
  For example, if a subject (i.e., user or process acting on behalf of a user) is
  removed from a group, access may not be revoked until the next time the object is
  opened or the next time the subject attempts to access the object. Revocation based
  on changes to security labels may take effect immediately. Organizations provide
  alternative approaches on how to make revocations immediate if systems cannot provide
  such capability and immediate revocation is necessary.
aliases:
