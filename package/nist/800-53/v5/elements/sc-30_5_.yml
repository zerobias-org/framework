name: Concealment and Misdirection | Concealment of System Components
description: 'Employ the following techniques to hide or conceal [Assignment: organization-defined
  system components]: [Assignment: organization-defined techniques].'
elementType: enhancement
parent: sc-30
guidance: By hiding, disguising, or concealing critical system components, organizations
  may be able to decrease the probability that adversaries target and successfully
  compromise those assets. Potential means to hide, disguise, or conceal system components
  include the configuration of routers or the use of encryption or virtualization
  techniques.
