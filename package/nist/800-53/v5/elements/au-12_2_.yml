id: 81d3edfb-7c4a-45a4-929c-dd3064cff149
externalId: AU-12(2)
name: Audit Record Generation | Standardized Formats
description: Produce a system-wide (logical or physical) audit trail composed of audit
  records in a standardized format.
elementType: enhancement
parent: au-12
guidance: Audit records that follow common standards promote interoperability and
  information exchange between devices and systems. Promoting interoperability and
  information exchange facilitates the production of event information that can be
  readily analyzed and correlated. If logging mechanisms do not conform to standardized
  formats, systems may convert individual audit records into standardized formats
  when compiling system-wide audit trails.
