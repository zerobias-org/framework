externalId: IA-5(9)
name: Authenticator Management | Federated Credential Management
description: 'Use the following external organizations to federate credentials: [Assignment:
  organization-defined external organizations].'
elementType: enhancement
parent: ia-5
guidance: Federation provides organizations with the capability to authenticate individuals
  and devices when conducting cross-organization activities involving the processing,
  storage, or transmission of information. Using a specific list of approved external
  organizations for authentication helps to ensure that those organizations are vetted
  and trusted.
