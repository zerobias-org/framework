id: befee547-0069-4308-bc2d-fae91e4e12be
externalId: SR-6(1)
name: Supplier Assessments and Reviews | Testing and Analysis
description: Employs organizational or independent analysis and testing of supply
  chain elements, processes, and actors associated with the system.
elementType: enhancement
parent: sr-6
guidance: Relationships between entities and procedures within the supply chain, including
  development and delivery, are considered. Supply chain elements include organizations,
  entities, or tools that are used for the research and development, design, manufacturing,
  acquisition, delivery, integration, operations, maintenance, and disposal of systems,
  system components, or system services. Supply chain processes include supply chain
  risk management programs; SCRM strategies and implementation plans; personnel and
  physical security programs; hardware, software, and firmware development processes;
  configuration management tools, techniques, and measures to maintain provenance;
  shipping and handling procedures; and programs, processes, or procedures associated
  with the production and distribution of supply chain elements. Supply chain actors
  are individuals with specific roles and responsibilities in the supply chain. The
  evidence generated and collected during analyses and testing of supply chain elements,
  processes, and actors is documented and used to inform organizational risk management
  activities and decisions.
aliases:
