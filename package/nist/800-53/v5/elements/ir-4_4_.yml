externalId: IR-4(4)
name: Incident Handling | Information Correlation
description: Correlate incident information and individual incident responses to achieve
  an organization-wide perspective on incident awareness and response.
elementType: enhancement
parent: ir-4
guidance: Sometimes, a threat event, such as a hostile cyber-attack, can only be observed
  by bringing together information from different sources, including various reports
  and reporting procedures established by organizations.
