id: 6b541d7e-ec50-4d79-8291-7d63c2ba4be2
externalId: AU-14(1)
name: Session Audit | System Start-up
description: Initiate session audits automatically at system start-up.
elementType: enhancement
parent: au-14
guidance: The automatic initiation of session audits at startup helps to ensure that
  the information being captured on selected individuals is complete and not subject
  to compromise through tampering by malicious threat actors.
