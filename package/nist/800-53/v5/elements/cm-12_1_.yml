id: 1b487d5b-b627-436f-80f1-358e2180504b
externalId: CM-12(1)
name: Information Location | Automated Tools to Support Information Location
description: Uses automated tools to identify defined information types on system
  components to ensure appropriate protection controls are in place.
elementType: enhancement
parent: cm-12
guidance: The use of automated tools helps to increase the effectiveness and efficiency
  of the information location capability implemented within the system. Automation
  also helps organizations manage the data produced during information location activities
  and share such information across the organization. The output of automated information
  location tools can be used to guide and inform system architecture and design decisions.
