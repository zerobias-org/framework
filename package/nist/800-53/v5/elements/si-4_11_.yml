id: 3d6ed004-a86f-48e3-9ed4-d80181937ba6
externalId: SI-4(11)
name: System Monitoring | Analyze Communications Traffic Anomalies
description: 'Analyze outbound communications traffic at the external interfaces to
  the system and selected [Assignment: organization-defined interior points within
  the system] to discover anomalies.'
elementType: enhancement
parent: si-4
guidance: Organization-defined interior points include subnetworks and subsystems.
  Anomalies within organizational systems include large file transfers, long-time
  persistent connections, attempts to access information from unexpected locations,
  the use of unusual protocols and ports, the use of unmonitored network protocols
  (e.g., IPv6 usage during IPv4 transition), and attempted communications with suspected
  malicious external addresses.
