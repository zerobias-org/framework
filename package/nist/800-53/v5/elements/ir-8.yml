id: 61a50aff-9259-45be-832d-e51bd4d0d553
externalId: IR-8
name: Incident Response Plan
description: Develops, distributes, reviews, and updates an incident response plan
  describing the organization's incident response capability, roles, and metrics.
elementType: control
parent: ir
guidance: It is important that organizations develop and implement a coordinated approach
  to incident response. Organizational mission and business functions determine the
  structure of incident response capabilities. As part of the incident response capabilities,
  organizations consider the coordination and sharing of information with external
  organizations, including external service providers and other organizations involved
  in the supply chain. For incidents involving personally identifiable information
  (i.e., breaches), include a process to determine whether notice to oversight organizations
  or affected individuals is appropriate and provide that notice accordingly.
