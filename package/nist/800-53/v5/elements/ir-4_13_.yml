id: 3da99f01-241c-4a2b-83fa-a692ecd2ff13
externalId: IR-4(13)
name: Incident Handling | Behavior Analysis
description: 'Analyze anomalous or suspected adversarial behavior in or related to
  [Assignment: organization-defined environments or resources].'
elementType: enhancement
parent: ir-4
guidance: If the organization maintains a deception environment, an analysis of behaviors
  in that environment, including resources targeted by the adversary and timing of
  the incident or event, can provide insight into adversarial tactics, techniques,
  and procedures. External to a deception environment, the analysis of anomalous adversarial
  behavior (e.g., changes in system performance or usage patterns) or suspected behavior
  (e.g., changes in searches for the location of specific resources) can give the
  organization such insight.
aliases:
