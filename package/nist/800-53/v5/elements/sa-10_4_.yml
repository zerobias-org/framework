id: 17601093-80cd-454b-afd1-1a765ca2a838
externalId: SA-10(4)
name: Developer Configuration Management | Trusted Generation
description: Requires the developer to use tools comparing newly generated hardware
  descriptions, source code, and object code against previous versions.
elementType: enhancement
parent: sa-10
guidance: The trusted generation of descriptions, source code, and object code addresses
  authorized changes to hardware, software, and firmware components between versions
  during development. The focus is on the efficacy of the configuration management
  process by the developer to ensure that newly generated versions of security-relevant
  hardware descriptions, source code, and object code continue to enforce the security
  policy for the system, system component, or system service. In contrast, SA-10(1)
  and SA-10(3) allow organizations to detect unauthorized changes to hardware, software,
  and firmware components using tools, techniques, or mechanisms provided by developers.
aliases:
- SA-10(4)
- SA-10 (4)
