id: d0838646-9fd7-4a72-9021-84d94082f48c
externalId: PS-5
name: Personnel Transfer
description: "a. Review and confirm ongoing operational need for current logical
  and physical access authorizations to systems and facilities when individuals
  are reassigned or transferred to other positions within the organization;b.
  Initiate [Assignment: organization-defined transfer or reassignment actions]
  within [Assignment: organization-defined time period following the formal
  transfer action];c. Modify access authorization as needed to correspond with
  any changes in operational need due to reassignment or transfer; andd. Notify
  [Assignment: organization-defined personnel or roles] within [Assignment:
  organization-defined time period]."
elementType: control
