id: bebeba75-33c4-41f5-afbe-80fe096aee8f
externalId: SR-9(1)
name: Tamper Resistance and Detection | Multiple Stages of System Development Life
  Cycle
description: Employ anti-tamper technologies, tools, and techniques throughout the
  system development life cycle.
elementType: enhancement
parent: sr-9
guidance: The system development life cycle includes research and development, design,
  manufacturing, acquisition, delivery, integration, operations and maintenance, and
  disposal. Organizations use a combination of hardware and software techniques for
  tamper resistance and detection. Organizations use obfuscation and self-checking
  to make reverse engineering and modifications more difficult, time-consuming, and
  expensive for adversaries. The customization of systems and system components can
  make substitutions easier to detect and therefore limit damage.
