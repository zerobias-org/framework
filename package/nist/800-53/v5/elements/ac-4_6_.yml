id: 8a1fe3ba-98c5-4d44-895e-ccdc04a87807
externalId: AC-4(6)
name: Information Flow Enforcement | Metadata
description: 'Enforce information flow control based on [Assignment: organization-defined
  metadata].'
elementType: enhancement
parent: ac-4
guidance: Metadata is information that describes the characteristics of data. Metadata
  can include structural metadata describing data structures or descriptive metadata
  describing data content. Enforcement of allowed information flows based on metadata
  enables simpler and more effective flow control. Organizations consider the trustworthiness
  of metadata regarding data accuracy (i.e., knowledge that the metadata values are
  correct with respect to the data), data integrity (i.e., protecting against unauthorized
  changes to metadata tags), and the binding of metadata to the data payload (i.e.,
  employing sufficiently strong binding techniques with appropriate assurance).
