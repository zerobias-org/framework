id: efbd3dbb-53e4-4d75-aa29-2b74ae3d0935
externalId: AC-18(3)
name: Wireless Access | Disable Wireless Networking
description: Disable, when not intended for use, wireless networking capabilities
  embedded within system components prior to issuance and deployment.
elementType: enhancement
parent: ac-18
guidance: Wireless networking capabilities that are embedded within system components
  represent a significant potential vulnerability that can be exploited by adversaries.
  Disabling wireless capabilities when not needed for essential organizational missions
  or functions can reduce susceptibility to threats by adversaries involving wireless
  technologies.
aliases:
