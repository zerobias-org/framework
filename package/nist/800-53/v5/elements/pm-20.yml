id: f789b8f3-50c7-48e8-9fbe-1f3356df05dc
externalId: PM-20
name: Dissemination of Privacy Program Information
description: Maintains a public webpage as a central source of information about the
  organization's privacy program, practices, and contact channels.
elementType: control
parent: pm
guidance: For federal agencies, the webpage is located at www.[agency].gov/privacy.
  Federal agencies include public privacy impact assessments, system of records notices,
  computer matching notices and agreements,exemption and implementation rules, privacy
  reports, privacy policies, instructions for individuals making an access or amendment
  request, email addresses for questions/complaints, blogs, and periodic publications.
