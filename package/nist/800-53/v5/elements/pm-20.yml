id: f789b8f3-50c7-48e8-9fbe-1f3356df05dc
externalId: PM-20
name: Dissemination of Privacy Program Information
description: Maintain a central resource webpage on the organization’s principal
  public website that serves as a central source of information about the
  organization’s privacy program and that:a. Ensures that the public has access
  to information about organizational privacy activities and can communicate
  with its senior agency official for privacy;b. Ensures that organizational
  privacy practices and reports are publicly available; andc. Employs publicly
  facing email addresses and/or phone lines to enable the public to provide
  feedback and/or direct questions to privacy offices regarding privacy
  practices.
elementType: control
