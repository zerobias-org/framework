id: 483fc023-18a7-4164-98af-6e306c1d7014
externalId: PT-2(1)
name: Authority to Process Personally Identifiable Information | Data Tagging
description: 'Attach data tags containing [Assignment: organization-defined authorized
  processing] to [Assignment: organization-defined elements of personally identifiable
  information].'
elementType: enhancement
parent: pt-2
guidance: Data tags support the tracking and enforcement of authorized processing
  by conveying the types of processing that are authorized along with the relevant
  elements of personally identifiable information throughout the system. Data tags
  may also support the use of automated tools.
