id: d3995ed8-3bca-4129-852d-c7e3eaba24d4
externalId: SC-42(2)
name: Sensor Capability and Data | Authorized Use
description: 'Employ the following measures so that data or information collected
  by [Assignment: organization-defined sensors] is only used for authorized purposes:
  [Assignment: organization-defined measures].'
elementType: enhancement
parent: sc-42
guidance: Information collected by sensors for a specific authorized purpose could
  be misused for some unauthorized purpose. For example, GPS sensors that are used
  to support traffic navigation could be misused to track the movements of individuals.
  Measures to mitigate such activities include additional training to help ensure
  that authorized individuals do not abuse their authority and, in the case where
  sensor data is maintained by external parties, contractual restrictions on the use
  of such data.
