id: 25b163cd-0dbd-4642-a23d-d4270788429c
externalId: SI-7(2)
name: Software, Firmware, and Information Integrity | Automated Notifications of Integrity
  Violations
description: 'Employ automated tools that provide notification to [Assignment: organization-defined
  personnel or roles] upon discovering discrepancies during integrity verification.'
elementType: enhancement
parent: si-7
guidance: The employment of automated tools to report system and information integrity
  violations and to notify organizational personnel in a timely matter is essential
  to effective risk response. Personnel with an interest in system and information
  integrity violations include mission and business owners, system owners, senior
  agency information security official, senior agency official for privacy, system
  administrators, software developers, systems integrators, information security officers,
  and privacy officers.
