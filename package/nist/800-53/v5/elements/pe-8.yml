id: c1170953-8b69-4a6c-8dc9-8e24278be4da
externalId: PE-8
name: Visitor Access Records
description: Maintains visitor access records for a defined period, reviews them periodically,
  and reports anomalies to designated personnel.
elementType: control
parent: pe
guidance: Visitor access records include the names and organizations of individuals
  visiting, visitor signatures, forms of identification, dates of access, entry and
  departure times, purpose of visits, and the names and organizations of individuals
  visited. Access record reviews determine if access authorizations are current and
  are still required to support organizational mission and business functions. Access
  records are not required for publicly accessible areas.
