id: 5d4e489b-db81-4734-83e5-a2de6e13344e
externalId: CM-9
name: Configuration Management Plan
description: "Develop, document, and implement a configuration management plan
  for the system that:a. Addresses roles, responsibilities, and configuration
  management processes and procedures;b. Establishes a process for identifying
  configuration items throughout the system development life cycle and for
  managing the configuration of the configuration items;c. Defines the
  configuration items for the system and places the configuration items under
  configuration management;d. Is reviewed and approved by [Assignment:
  organization-defined personnel or roles]; ande. Protects the configuration
  management plan from unauthorized disclosure and modification."
elementType: control
