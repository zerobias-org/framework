id: fde186f5-f92b-4ba8-9eb4-bfa1f7a259ca
externalId: SI-7(6)
name: Software, Firmware, and Information Integrity | Cryptographic Protection
description: Implement cryptographic mechanisms to detect unauthorized changes to
  software, firmware, and information.
elementType: enhancement
parent: si-7
guidance: Cryptographic mechanisms used to protect integrity include digital signatures
  and the computation and application of signed hashes using asymmetric cryptography,
  protecting the confidentiality of the key used to generate the hash, and using the
  public key to verify the hash information. Organizations that employ cryptographic
  mechanisms also consider cryptographic key management solutions.
