id: 1e8b31f6-8261-45b1-85f1-6e9cbec9ccd3
externalId: MA-4
name: Nonlocal Maintenance
description: a. Approve and monitor nonlocal maintenance and diagnostic
  activities;b. Allow the use of nonlocal maintenance and diagnostic tools only
  as consistent with organizational policy and documented in the security plan
  for the system;c. Employ strong authentication in the establishment of
  nonlocal maintenance and diagnostic sessions;d. Maintain records for nonlocal
  maintenance and diagnostic activities; ande. Terminate session and network
  connections when nonlocal maintenance is completed.
elementType: control
