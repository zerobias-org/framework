name: Facility Location
description: Considers physical and environmental hazards when planning facility location,
  and factors existing facility hazards into the risk management strategy.
elementType: control
parent: pe
guidance: Physical and environmental hazards include floods, fires, tornadoes, earthquakes,
  hurricanes, terrorism, vandalism, an electromagnetic pulse, electrical interference,
  and other forms of incoming electromagnetic radiation. The location of system components
  within the facility is addressed in.
