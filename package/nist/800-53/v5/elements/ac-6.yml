id: da87511c-c182-47b2-a99f-114ba77148d3
externalId: AC-6
name: Least Privilege
description: Employ the principle of least privilege, allowing only authorized accesses
  for users (or processes acting on behalf of users) that are necessary to accomplish
  assigned organizational tasks.
elementType: control
parent: ac
guidance: Organizations employ least privilege for specific duties and systems. The
  principle of least privilege is also applied to system processes, ensuring that
  the processes have access to systems and operate at privilege levels no higher than
  necessary to accomplish organizational missions or business functions. Organizations
  consider the creation of additional processes, roles, and accounts as necessary
  to achieve least privilege. Organizations apply least privilege to the development,
  implementation, and operation of organizational systems.
