name: Supply Chain Risk Management Plan
description: "a. Develop a plan for managing supply chain risks associated with
  the research and development, design, manufacturing, acquisition, delivery,
  integration, operations and maintenance, and disposal of the following
  systems, system components or system services: [Assignment:
  organization-defined systems, system components, or system services];b. Review
  and update the supply chain risk management plan [Assignment:
  organization-defined frequency] or as required, to address threat,
  organizational or environmental changes; andc. Protect the supply chain risk
  management plan from unauthorized disclosure and modification."
