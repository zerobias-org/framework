id: b6ff3378-2b51-44b1-83c1-44d9a76f4262
externalId: SI-19(2)
name: De-identification | Archiving
description: Prohibit archiving of personally identifiable information elements if
  those elements in a dataset will not be needed after the dataset is archived.
elementType: enhancement
parent: si-19
guidance: Datasets can be archived for many reasons. The envisioned purposes for the
  archived dataset are specified, and if personally identifiable information elements
  are not required, the elements are not archived. For example, social security numbers
  may have been collected for record linkage, but the archived dataset may include
  the required elements from the linked records. In this case, it is not necessary
  to archive the social security numbers.
