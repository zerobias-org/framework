id: 1dd5bd37-8292-470d-a107-6644ed7d4234
externalId: SC-7(15)
name: Boundary Protection | Networked Privileged Accesses
description: Route networked, privileged accesses through a dedicated, managed interface
  for purposes of access control and auditing.
elementType: enhancement
parent: sc-7
guidance: Privileged access provides greater accessibility to system functions, including
  security functions. Adversaries attempt to gain privileged access to systems through
  remote access to cause adverse mission or business impacts, such as by exfiltrating
  information or bringing down a critical system capability. Routing networked, privileged
  access requests through a dedicated, managed interface further restricts privileged
  access for increased access control and auditing.
aliases:
