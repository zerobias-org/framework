id: 5ccc60e0-64e5-48b9-b548-7d085a8b923a
externalId: MP-6(1)
name: Media Sanitization | Review, Approve, Track, Document, and Verify
description: Review, approve, track, document, and verify media sanitization and disposal
  actions.
elementType: enhancement
parent: mp-6
guidance: Organizations review and approve media to be sanitized to ensure compliance
  with records retention policies. Tracking and documenting actions include listing
  personnel who reviewed and approved sanitization and disposal actions, types of
  media sanitized, files stored on the media, sanitization methods used, date and
  time of the sanitization actions, personnel who performed the sanitization, verification
  actions taken and personnel who performed the verification, and the disposal actions
  taken. Organizations verify that the sanitization of the media was effective prior
  to disposal.
aliases:
