name: Timely Maintenance | Automated Support for Predictive Maintenance
description: 'Transfer predictive maintenance data to a maintenance management system
  using [Assignment: organization-defined automated mechanisms].'
elementType: enhancement
parent: ma-6
guidance: A computerized maintenance management system maintains a database of information
  about the maintenance operations of organizations and automates the processing of
  equipment condition data to trigger maintenance planning, execution, and reporting.
