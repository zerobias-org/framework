id: bbe10b32-fd74-4336-87cd-f7a166718ab9
externalId: PE-6
name: Monitoring Physical Access
description: Monitors physical access to the facility to detect and respond to incidents,
  reviews access logs periodically, and coordinates findings with incident response.
elementType: control
parent: pe
guidance: Physical access monitoring includes publicly accessible areas within organizational
  facilities. Examples of physical access monitoring include the employment of guards,
  video surveillance equipment (i.e., cameras), and sensor devices. Reviewing physical
  access logs can help identify suspicious activity, anomalous events, or potential
  threats. The reviews can be supported by audit logging controls, such as, if the
  access logs are part of an automated system. Organizational incident response capabilities
  include investigations of physical security incidents and responses to the incidents.
  Incidents include security violations or suspicious physical access activities.
  Suspicious physical access activities include accesses outside of normal work hours,
  repeated accesses to areas not normally accessed, accesses for unusual lengths of
  time, and out-of-sequence accesses.
