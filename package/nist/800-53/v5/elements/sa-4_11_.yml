id: 33e20af9-7149-4cc1-81d8-60be74c5433f
externalId: SA-4(11)
name: Acquisition Process | System of Records
description: Includes defined Privacy Act requirements in acquisition contracts for
  operating a system of records on the organization's behalf.
elementType: enhancement
parent: sa-4
guidance: When, by contract, an organization provides for the operation of a system
  of records to accomplish an organizational mission or function, the organization,
  consistent with its authority, causes the requirements of the PRIVACT to be applied
  to the system of records.
