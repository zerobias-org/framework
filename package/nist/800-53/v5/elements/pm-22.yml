id: 198f68d6-38a0-4be0-91f1-07d536a8e077
externalId: PM-22
name: Personally Identifiable Information Quality Management
description: Develop and document organization-wide policies and procedures
  for:a. Reviewing for the accuracy, relevance, timeliness, and completeness of
  personally identifiable information across the information life cycle;b.
  Correcting or deleting inaccurate or outdated personally identifiable
  information;c. Disseminating notice of corrected or deleted personally
  identifiable information to individuals or other appropriate entities; andd.
  Appeals of adverse decisions on correction or deletion requests.
elementType: control
