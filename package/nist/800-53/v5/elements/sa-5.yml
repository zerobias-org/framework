id: 9cf3904f-d404-45f0-a2f7-18493e6507e5
externalId: SA-5
name: System Documentation
description: "a. Obtain or develop administrator documentation for the system,
  system component, or system service that describes:1. Secure configuration,
  installation, and operation of the system, component, or service;2. Effective
  use and maintenance of security and privacy functions and mechanisms; and3.
  Known vulnerabilities regarding configuration and use of administrative or
  privileged functions;b. Obtain or develop user documentation for the system,
  system component, or system service that describes:1. User-accessible security
  and privacy functions and mechanisms and how to effectively use those
  functions and mechanisms;2. Methods for user interaction, which enables
  individuals to use the system, component, or service in a more secure manner
  and protect individual privacy; and3. User responsibilities in maintaining the
  security of the system, component, or service and privacy of individuals;c.
  Document attempts to obtain system, system component, or system service
  documentation when such documentation is either unavailable or nonexistent and
  take [Assignment: organization-defined actions] in response; andd. Distribute
  documentation to [Assignment: organization-defined personnel or roles]."
elementType: control
