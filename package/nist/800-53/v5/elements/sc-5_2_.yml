id: 7f441ac5-6756-44ae-b627-4bca32c81870
externalId: SC-5(2)
name: Denial-of-service Protection | Capacity, Bandwidth, and Redundancy
description: Manage capacity, bandwidth, or other redundancy to limit the effects
  of information flooding denial-of-service attacks.
elementType: enhancement
parent: sc-5
guidance: Managing capacity ensures that sufficient capacity is available to counter
  flooding attacks. Managing capacity includes establishing selected usage priorities,
  quotas, partitioning, or load balancing.
