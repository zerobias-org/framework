id: c51a15c2-b201-4a5c-8683-90bb41908d30
externalId: PE-6(4)
name: Monitoring Physical Access | Monitoring Physical Access to Systems
description: Monitors physical access to defined spaces containing system components,
  in addition to overall facility access monitoring.
elementType: enhancement
parent: pe-6
guidance: Monitoring physical access to systems provides additional monitoring for
  those areas within facilities where there is a concentration of system components,
  including server rooms, media storage areas, and communications centers. Physical
  access monitoring can be coordinated with intrusion detection systems and system
  monitoring capabilities to provide comprehensive and integrated threat coverage
  for the organization.
