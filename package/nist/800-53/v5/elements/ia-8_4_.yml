id: 697e9ba8-e3b6-4843-9cca-1f3e8f7aabff
externalId: IA-8(4)
name: Identification and Authentication (non-organizational Users) | Use of Defined
  Profiles
description: 'Conform to the following profiles for identity management [Assignment:
  organization-defined identity management profiles].'
elementType: enhancement
parent: ia-8
guidance: Organizations define profiles for identity management based on open identity
  management standards. To ensure that open identity management standards are viable,
  robust, reliable, sustainable, and interoperable as documented, the Federal Government
  assesses and scopes the standards and technology implementations against applicable
  laws, executive orders, directives, policies, regulations, standards, and guidelines.
