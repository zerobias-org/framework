id: 48d963a0-d9c6-43b3-ae1d-86f722785bc9
externalId: AC-3
name: Access Enforcement
description: Enforce approved authorizations for logical access to information and
  system resources in accordance with applicable access control policies.
elementType: control
parent: ac
guidance: Access control policies control access between active entities or subjects
  (i.e., users or processes acting on behalf of users) and passive entities or objects
  (i.e., devices, files, records, domains) in organizational systems. In addition
  to enforcing authorized access at the system level and recognizing that systems
  can host many applications and services in support of mission and business functions,
  access enforcement mechanisms can also be employed at the application and service
  level to provide increased information security and privacy. In contrast to logical
  access controls that are implemented within the system, physical access controls
  are addressed by the controls in the Physical and Environmental Protection () family.
