id: 3bbc2398-7219-4c31-8c23-6a385102758e
externalId: SC-23(5)
name: Session Authenticity | Allowed Certificate Authorities
description: 'Only allow the use of [Assignment: organization-defined certificate
  authorities] for verification of the establishment of protected sessions.'
elementType: enhancement
parent: sc-23
guidance: Reliance on certificate authorities for the establishment of secure sessions
  includes the use of Transport Layer Security (TLS) certificates. These certificates,
  after verification by their respective certificate authorities, facilitate the establishment
  of protected sessions between web clients and web servers.
