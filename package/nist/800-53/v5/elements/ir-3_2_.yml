name: Incident Response Testing | Coordination with Related Plans
description: Coordinate incident response testing with organizational elements responsible
  for related plans.
elementType: enhancement
parent: ir-3
guidance: Organizational plans related to incident response testing include business
  continuity plans, disaster recovery plans, continuity of operations plans, contingency
  plans, crisis communications plans, critical infrastructure plans, and occupant
  emergency plans.
