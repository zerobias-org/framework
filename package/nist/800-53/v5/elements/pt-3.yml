id: 49da1106-9497-4a0e-a887-2c0e5b813d87
externalId: PT-3
name: Personally Identifiable Information Processing Purposes
description: "a. Identify and document the [Assignment: organization-defined
  purpose(s)] for processing personally identifiable information;b. Describe the
  purpose(s) in the public privacy notices and policies of the organization;c.
  Restrict the [Assignment: organization-defined processing] of personally
  identifiable information to only that which is compatible with the identified
  purpose(s); andd. Monitor changes in processing personally identifiable
  information and implement [Assignment: organization-defined mechanisms] to
  ensure that any changes are made in accordance with [Assignment:
  organization-defined requirements]."
elementType: control
