  organization-defined official] to manage the development, documentation, and
  dissemination of the personnel security policy and procedures; andc. Review
  and update the current personnel security:1. Policy [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]; and2. Procedures [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]."
