id: 85d79c2e-9d2f-4c1d-898d-a30b968b9a8a
externalId: CM-7
name: Least Functionality
description: Configures the system to provide only essential capabilities, and prohibits
  or restricts unnecessary functions, ports, protocols, software, and services.
elementType: control
parent: cm
guidance: Systems provide a wide variety of functions and services. Some of the functions
  and services routinely provided by default may not be necessary to support essential
  organizational missions, functions, or operations. Additionally, it is sometimes
  convenient to provide multiple services from a single system component, but doing
  so increases risk over limiting the services provided by that single component.
  Where feasible, organizations limit component functionality to a single function
  per component. Organizations consider removing unused or unnecessary software and
  disabling unused or unnecessary physical and logical ports and protocols to prevent
  unauthorized connection of components, transfer of information, and tunneling. Organizations
  employ network scanning tools, intrusion detection and prevention systems, and end-point
  protection technologies, such as firewalls and host-based intrusion detection systems,
  to identify and prevent the use of prohibited functions, protocols, ports, and services.
  Least functionality can also be achieved as part of the fundamental design and development
  of the system (see,, and).
