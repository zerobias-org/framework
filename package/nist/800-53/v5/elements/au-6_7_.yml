id: 70dd00b3-3c38-4f01-9e7f-7e6e56424fe3
externalId: AU-6(7)
name: Audit Record Review, Analysis, and Reporting | Permitted Actions
description: 'Specify the permitted actions for each [Selection (one or more): system
  process; role; user] associated with the review, analysis, and reporting of audit
  record information.'
elementType: enhancement
parent: au-6
guidance: Organizations specify permitted actions for system processes, roles, and
  users associated with the review, analysis, and reporting of audit records through
  system account management activities. Specifying permitted actions on audit record
  information is a way to enforce the principle of least privilege. Permitted actions
  are enforced by the system and include read, write, execute, append, and delete.
