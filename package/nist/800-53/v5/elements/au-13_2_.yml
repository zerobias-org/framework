id: f2d25d0c-3e86-494a-8b7b-d540d8bffc16
externalId: AU-13(2)
name: Monitoring for Information Disclosure | Review of Monitored Sites
description: 'Review the list of open-source information sites being monitored [Assignment:
  organization-defined frequency].'
elementType: enhancement
parent: au-13
guidance: Reviewing the current list of open-source information sites being monitored
  on a regular basis helps to ensure that the selected sites remain relevant. The
  review also provides the opportunity to add new open-source information sites with
  the potential to provide evidence of unauthorized disclosure of organizational information.
  The list of sites monitored can be guided and informed by threat intelligence of
  other credible sources of information.
