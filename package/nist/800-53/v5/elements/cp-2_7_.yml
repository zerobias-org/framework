id: 3de8db65-f2eb-46a8-8615-b5858f768a53
externalId: CP-2(7)
name: Contingency Plan | Coordinate with External Service Providers
description: Coordinate the contingency plan with the contingency plans of external
  service providers to ensure that contingency requirements can be satisfied.
elementType: enhancement
parent: cp-2
guidance: When the capability of an organization to carry out its mission and business
  functions is dependent on external service providers, developing a comprehensive
  and timely contingency plan may become more challenging. When mission and business
  functions are dependent on external service providers, organizations coordinate
  contingency planning activities with the external entities to ensure that the individual
  plans reflect the overall contingency needs of the organization.
