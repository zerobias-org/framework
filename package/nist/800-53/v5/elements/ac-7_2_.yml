id: 7b29afc4-8c25-4391-af2a-63be41dd947c
externalId: AC-7(2)
name: Unsuccessful Logon Attempts | Purge or Wipe Mobile Device
description: Purges or wipes mobile devices after a defined number of consecutive
  unsuccessful logon attempts.
elementType: enhancement
parent: ac-7
guidance: A mobile device is a computing device that has a small form factor such
  that it can be carried by a single individual; is designed to operate without a
  physical connection; possesses local, non-removable or removable data storage; and
  includes a self-contained power source. Purging or wiping the device applies only
  to mobile devices for which the organization-defined number of unsuccessful logons
  occurs. The logon is to the mobile device, not to any one account on the device.
  Successful logons to accounts on mobile devices reset the unsuccessful logon count
  to zero. Purging or wiping may be unnecessary if the information on the device is
  protected with sufficiently strong encryption mechanisms.
aliases:
