name: Information Input Validation | Review and Resolve Errors
description: 'Review and resolve input validation errors within [Assignment: organization-defined
  time period].'
elementType: enhancement
parent: si-10
guidance: Resolution of input validation errors includes correcting systemic causes
  of errors and resubmitting transactions with corrected input. Input validation errors
  are those related to the information inputs defined by the organization in the base
  control (SI-10).
