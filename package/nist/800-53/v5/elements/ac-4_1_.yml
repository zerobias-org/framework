id: 152cb3c9-1464-4432-87fa-05dd2b533713
externalId: AC-4(1)
name: Information Flow Enforcement | Object Security and Privacy Attributes
description: Uses security and privacy attributes on information, sources, and destinations
  as the basis for information flow control decisions.
elementType: enhancement
parent: ac-4
guidance: Information flow enforcement mechanisms compare security and privacy attributes
  associated with information (i.e., data content and structure) and source and destination
  objects and respond appropriately when the enforcement mechanisms encounter information
  flows not explicitly allowed by information flow policies. For example, an information
  object labeled Secret would be allowed to flow to a destination object labeled Secret,
  but an information object labeled Top Secret would not be allowed to flow to a destination
  object labeled Secret. A dataset of personally identifiable information may be tagged
  with restrictions against combining with other types of datasets and, thus, would
  not be allowed to flow to the restricted dataset. Security and privacy attributes
  can also include source and destination addresses employed in traffic filter firewalls.
  Flow enforcement using explicit security or privacy attributes can be used, for
  example, to control the release of certain types of information.
