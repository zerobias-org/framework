id: 81169f21-fc2c-4f56-81c4-e6ecccb7bb99
externalId: PE-3(4)
name: Physical Access Control | Lockable Casings
description: 'Use lockable physical casings to protect [Assignment: organization-defined
  system components] from unauthorized physical access.'
elementType: enhancement
parent: pe-3
guidance: The greatest risk from the use of portable devices—such as smart phones,
  tablets, and notebook computers—is theft. Organizations can employ lockable, physical
  casings to reduce or eliminate the risk of equipment theft. Such casings come in
  a variety of sizes, from units that protect a single notebook computer to full cabinets
  that can protect multiple servers, computers, and peripherals. Lockable physical
  casings can be used in conjunction with cable locks or lockdown plates to prevent
  the theft of the locked casing containing the computer equipment.
