id: a7e53591-9d1a-4f9e-afee-38850d3e8c87
externalId: SA-11(4)
name: Developer Testing and Evaluation | Manual Code Reviews
description: Requires the developer to perform manual code review of defined code
  using defined processes, procedures, or techniques.
elementType: enhancement
parent: sa-11
guidance: Manual code reviews are usually reserved for the critical software and firmware
  components of systems. Manual code reviews are effective at identifying weaknesses
  that require knowledge of the application’s requirements or context that, in most
  cases, is unavailable to automated analytic tools and techniques, such as static
  and dynamic analysis. The benefits of manual code review include the ability to
  verify access control matrices against application controls and review detailed
  aspects of cryptographic implementations and controls.
aliases:
