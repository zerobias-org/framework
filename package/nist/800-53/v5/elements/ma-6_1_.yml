id: 5f7909a9-630d-4e54-adbb-cf9c6c92c097
externalId: MA-6(1)
name: Timely Maintenance | Preventive Maintenance
description: 'Perform preventive maintenance on [Assignment: organization-defined
  system components] at [Assignment: organization-defined time intervals].'
elementType: enhancement
parent: ma-6
guidance: Preventive maintenance includes proactive care and the servicing of system
  components to maintain organizational equipment and facilities in satisfactory operating
  condition. Such maintenance provides for the systematic inspection, tests, measurements,
  adjustments, parts replacement, detection, and correction of incipient failures
  either before they occur or before they develop into major defects. The primary
  goal of preventive maintenance is to avoid or mitigate the consequences of equipment
  failures. Preventive maintenance is designed to preserve and restore equipment reliability
  by replacing worn components before they fail. Methods of determining what preventive
  (or other) failure management policies to apply include original equipment manufacturer
  recommendations; statistical failure records; expert opinion; maintenance that has
  already been conducted on similar equipment; requirements of codes, laws, or regulations
  within a jurisdiction; or measured values and performance indications.
