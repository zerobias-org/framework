id: a5aebe65-c48e-4f5f-b2f6-cc8d95f9b42e
externalId: SI-15
name: Information Output Filtering
description: Validates information output from defined software programs or applications
  to ensure it is consistent with expected content.
elementType: control
parent: si
guidance: Certain types of attacks, including SQL injections, produce output results
  that are unexpected or inconsistent with the output results that would be expected
  from software programs or applications. Information output filtering focuses on
  detecting extraneous content, preventing such extraneous content from being displayed,
  and then alerting monitoring tools that anomalous behavior has been discovered.
