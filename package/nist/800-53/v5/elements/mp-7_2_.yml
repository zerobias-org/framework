id: e64dab48-321d-44ee-af3d-48473e1c1b0e
externalId: MP-7(2)
name: Media Use | Prohibit Use of Sanitization-resistant Media
description: Prohibit the use of sanitization-resistant media in organizational systems.
elementType: enhancement
parent: mp-7
guidance: Sanitization resistance refers to how resistant media are to non-destructive
  sanitization techniques with respect to the capability to purge information from
  media. Certain types of media do not support sanitization commands, or if supported,
  the interfaces are not supported in a standardized way across these devices. Sanitization-resistant
  media includes compact flash, embedded flash on boards and devices, solid state
  drives, and USB removable media.
