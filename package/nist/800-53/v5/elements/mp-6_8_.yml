id: 95246a6a-90c0-4f2f-aeab-29478a92cf80
externalId: MP-6(8)
name: Media Sanitization | Remote Purging or Wiping of Information
description: Provides the capability to remotely purge or wipe information from systems
  or components under defined conditions.
elementType: enhancement
parent: mp-6
guidance: Remote purging or wiping of information protects information on organizational
  systems and system components if systems or components are obtained by unauthorized
  individuals. Remote purge or wipe commands require strong authentication to help
  mitigate the risk of unauthorized individuals purging or wiping the system, component,
  or device. The purge or wipe function can be implemented in a variety of ways, including
  by overwriting data or information multiple times or by destroying the key necessary
  to decrypt encrypted data.
aliases:
