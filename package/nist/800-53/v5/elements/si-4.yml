id: e37667be-bcb0-4cd4-a03a-468d81278f4d
externalId: SI-4
name: System Monitoring
description: "a. Monitor the system to detect:1. Attacks and indicators of
  potential attacks in accordance with the following monitoring objectives:
  [Assignment: organization-defined monitoring objectives]; and2. Unauthorized
  local, network, and remote connections;b. Identify unauthorized use of the
  system through the following techniques and methods: [Assignment:
  organization-defined techniques and methods];c. Invoke internal monitoring
  capabilities or deploy monitoring devices:1. Strategically within the system
  to collect organization-determined essential information; and2. At ad hoc
  locations within the system to track specific types of transactions of
  interest to the organization;d. Analyze detected events and anomalies;e.
  Adjust the level of system monitoring activity when there is a change in risk
  to organizational operations and assets, individuals, other organizations, or
  the Nation;f. Obtain legal opinion regarding system monitoring activities;
  andg. Provide [Assignment: organization-defined system monitoring information]
  to [Assignment: organization-defined personnel or roles] [Selection (one or
  more): as needed; [Assignment: organization-defined frequency]]."
elementType: control
