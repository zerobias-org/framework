id: 6b7811a2-af20-46ab-b250-d97e011b0931
externalId: IA-2(12)
name: Identification and Authentication (organizational Users) | Acceptance of PIV
  Credentials
description: Accept and electronically verify Personal Identity Verification-compliant
  credentials.
elementType: enhancement
parent: ia-2
guidance: Acceptance of Personal Identity Verification (PIV)-compliant credentials
  applies to organizations implementing logical access control and physical access
  control systems. PIV-compliant credentials are those credentials issued by federal
  agencies that conform to FIPS Publication 201 and supporting guidance documents.
  The adequacy and reliability of PIV card issuers are authorized using. Acceptance
  of PIV-compliant credentials includes derived PIV credentials, the use of which
  is addressed in. The DOD Common Access Card (CAC) is an example of a PIV credential.
