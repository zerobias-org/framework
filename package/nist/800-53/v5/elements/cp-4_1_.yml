id: 7072b9be-0b60-48cb-9f86-3766547cc82f
externalId: CP-4(1)
name: Contingency Plan Testing | Coordinate with Related Plans
description: Coordinate contingency plan testing with organizational elements responsible
  for related plans.
elementType: enhancement
parent: cp-4
guidance: Plans related to contingency planning for organizational systems include
  Business Continuity Plans, Disaster Recovery Plans, Continuity of Operations Plans,
  Crisis Communications Plans, Critical Infrastructure Plans, Cyber Incident Response
  Plans, and Occupant Emergency Plans. Coordination of contingency plan testing does
  not require organizations to create organizational elements to handle related plans
  or to align such elements with specific plans. However, it does require that if
  such organizational elements are responsible for related plans, organizations coordinate
  with those elements.
aliases:
