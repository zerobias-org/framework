id: 96c3086d-eb72-4926-9de7-b48985f480e1
externalId: SC-40(4)
name: Wireless Link Protection | Signal Parameter Identification
description: 'Implement cryptographic mechanisms to prevent the identification of
  [Assignment: organization-defined wireless transmitters] by using the transmitter
  signal parameters.'
elementType: enhancement
parent: sc-40
guidance: The implementation of cryptographic mechanisms to prevent the identification
  of wireless transmitters protects against the unique identification of wireless
  transmitters for the purposes of intelligence exploitation by ensuring that anti-fingerprinting
  alterations to signal parameters are not predictable by unauthorized individuals.
  It also provides anonymity when required. Radio fingerprinting techniques identify
  the unique signal parameters of transmitters to fingerprint such transmitters for
  purposes of tracking and mission or user identification.
