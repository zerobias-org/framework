id: 1697d169-9767-44e9-8756-0d3d4a13fa5e
externalId: SC-7(18)
name: Boundary Protection | Fail Secure
description: Prevent systems from entering unsecure states in the event of an operational
  failure of a boundary protection device.
elementType: enhancement
parent: sc-7
guidance: Fail secure is a condition achieved by employing mechanisms to ensure that
  in the event of operational failures of boundary protection devices at managed interfaces,
  systems do not enter into unsecure states where intended security properties no
  longer hold. Managed interfaces include routers, firewalls, and application gateways
  that reside on protected subnetworks (commonly referred to as demilitarized zones).
  Failures of boundary protection devices cannot lead to or cause information external
  to the devices to enter the devices nor can failures permit unauthorized information
  releases.
