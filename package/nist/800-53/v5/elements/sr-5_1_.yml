id: f6cfd943-d99c-42e8-a552-947754a0691b
externalId: SR-5(1)
name: Acquisition Strategies, Tools, and Methods | Adequate Supply
description: 'Employ the following controls to ensure an adequate supply of [Assignment:
  organization-defined critical system components]: [Assignment: organization-defined
  controls].'
elementType: enhancement
parent: sr-5
guidance: Adversaries can attempt to impede organizational operations by disrupting
  the supply of critical system components or corrupting supplier operations. Organizations
  may track systems and component mean time to failure to mitigate the loss of temporary
  or permanent system function. Controls to ensure that adequate supplies of critical
  system components include the use of multiple suppliers throughout the supply chain
  for the identified critical components, stockpiling spare components to ensure operation
  during mission-critical times, and the identification of functionally identical
  or similar components that may be used, if necessary.
