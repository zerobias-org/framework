id: eb5ad20f-b271-441f-82e7-e093f605954f
externalId: SI-17
name: Fail-safe Procedures
description: 'Implement the indicated fail-safe procedures when the indicated failures
  occur: [Assignment: organization-defined list of failure conditions and associated
  fail-safe procedures].'
elementType: control
parent: si
guidance: Failure conditions include the loss of communications among critical system
  components or between system components and operational facilities. Fail-safe procedures
  include alerting operator personnel and providing specific instructions on subsequent
  steps to take. Subsequent steps may include doing nothing, reestablishing system
  settings, shutting down processes, restarting the system, or contacting designated
  organizational personnel.
