id: 458cf20f-662d-4e04-848d-b19b19a4265a
externalId: SC-29
name: Heterogeneity
description: 'Employ a diverse set of information technologies for the following system
  components in the implementation of the system: [Assignment: organization-defined
  system components].'
elementType: control
parent: sc
guidance: Increasing the diversity of information technologies within organizational
  systems reduces the impact of potential exploitations or compromises of specific
  technologies. Such diversity protects against common mode failures, including those
  failures induced by supply chain attacks. Diversity in information technologies
  also reduces the likelihood that the means adversaries use to compromise one system
  component will be effective against other system components, thus further increasing
  the adversary work factor to successfully complete planned attacks. An increase
  in diversity may add complexity and management overhead that could ultimately lead
  to mistakes and unauthorized configurations.
