id: ad3e0495-aae1-4504-a86f-f5a5f7697cfa
externalId: CP-10(6)
name: System Recovery and Reconstitution | Component Protection
description: Protect system components used for recovery and reconstitution.
elementType: enhancement
parent: cp-10
guidance: Protection of system recovery and reconstitution components (i.e., hardware,
  firmware, and software) includes physical and technical controls. Backup and restoration
  components used for recovery and reconstitution include router tables, compilers,
  and other system software.
