externalId: AC-16(6)
name: Security and Privacy Attributes | Maintenance of Attribute Association
description: Requires personnel to associate and maintain security and privacy attributes
  on subjects and objects per policy.
elementType: enhancement
parent: ac-16
guidance: Maintaining attribute association requires individual users (as opposed
  to the system) to maintain associations of defined security and privacy attributes
  with subjects and objects.
