id: b566f8d0-66f8-4ca0-a4ae-02522b414f85
externalId: IA-2(2)
name: Identification and Authentication (organizational Users) | Multi-factor Authentication
  to Non-privileged Accounts
description: Implement multi-factor authentication for access to non-privileged accounts.
elementType: enhancement
parent: ia-2
guidance: 'Multi-factor authentication requires the use of two or more different factors
  to achieve authentication. The authentication factors are defined as follows: something
  you know (e.g., a personal identification number [PIN]), something you have (e.g.,
  a physical authenticator such as a cryptographic private key), or something you
  are (e.g., a biometric). Multi-factor authentication solutions that feature physical
  authenticators include hardware authenticators that provide time-based or challenge-response
  outputs and smart cards such as the U.S. Government Personal Identity Verification
  card or the DoD Common Access Card. In addition to authenticating users at the system
  level, organizations may also employ authentication mechanisms at the application
  level, at their discretion, to provide increased information security. Regardless
  of the type of access (i.e., local, network, remote), non-privileged accounts are
  authenticated using multi-factor options appropriate for the level of risk. Organizations
  can provide additional security measures, such as additional or more rigorous authentication
  mechanisms, for specific types of access.'
