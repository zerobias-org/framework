id: cb65f625-fbcf-45df-9846-aaf90eecb35c
externalId: MA-4(5)
name: Nonlocal Maintenance | Approvals and Notifications
description: Requires approval of each nonlocal maintenance session and notifies designated
  personnel of its planned date and time.
elementType: enhancement
parent: ma-4
guidance: Notification may be performed by maintenance personnel. Approval of nonlocal
  maintenance is accomplished by personnel with sufficient information security and
  system knowledge to determine the appropriateness of the proposed maintenance.
