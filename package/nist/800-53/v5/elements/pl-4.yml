id: 419261b2-5af2-49a9-8a14-d7cf9eb4f8e0
externalId: PL-4
name: Rules of Behavior
description: Establishes rules of behavior for system users, obtains their acknowledgment
  before granting access, and periodically reviews and re-acknowledges the rules.
elementType: control
parent: pl
guidance: Rules of behavior represent a type of access agreement for organizational
  users. Other types of access agreements include nondisclosure agreements, conflict-of-interest
  agreements, and acceptable use agreements (see). Organizations consider rules of
  behavior based on individual user roles and responsibilities and differentiate between
  rules that apply to privileged users and rules that apply to general users. Establishing
  rules of behavior for some types of non-organizational users, including individuals
  who receive information from federal systems, is often not feasible given the large
  number of such users and the limited nature of their interactions with the systems.
  Rules of behavior for organizational and non-organizational users can also be established
  in. The related controls section provides a list of controls that are relevant to
  organizational rules of behavior., the documented acknowledgment portion of the
  control, may be satisfied by the literacy training and awareness and role-based
  training programs conducted by organizations if such training includes rules of
  behavior. Documented acknowledgements for rules of behavior include electronic or
  physical signatures and electronic agreement check boxes or radio buttons.
