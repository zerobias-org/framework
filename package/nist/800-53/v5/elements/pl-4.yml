id: db96ee00-c793-480f-96ce-33a75612e812
externalId: PL-4
name: Rules of Behavior
description: "a. Establish and provide to individuals requiring access to the
  system, the rules that describe their responsibilities and expected behavior
  for information and system usage, security, and privacy;b. Receive a
  documented acknowledgment from such individuals, indicating that they have
  read, understand, and agree to abide by the rules of behavior, before
  authorizing access to information and the system;c. Review and update the
  rules of behavior [Assignment: organization-defined frequency]; andd. Require
  individuals who have acknowledged a previous version of the rules of behavior
  to read and re-acknowledge [Selection (one or more): [Assignment:
  organization-defined frequency]; when the rules are revised or updated]."
elementType: control
