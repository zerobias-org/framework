id: 4f4d5339-f200-482b-ac8b-c414a79ad80c
externalId: SA-8(4)
name: Security and Privacy Engineering Principles | Partially Ordered Dependencies
description: 'Implement the security design principle of partially ordered dependencies
  in [Assignment: organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of partially ordered dependencies states that the synchronization,
  calling, and other dependencies in the system are partially ordered. A fundamental
  concept in system design is layering, whereby the system is organized into well-defined,
  functionally related modules or components. The layers are linearly ordered with
  respect to inter-layer dependencies, such that higher layers are dependent on lower
  layers. While providing functionality to higher layers, some layers can be self-contained
  and not dependent on lower layers. While a partial ordering of all functions in
  a given system may not be possible, if circular dependencies are constrained to
  occur within layers, the inherent problems of circularity can be more easily managed.
  Partially ordered dependencies and system layering contribute significantly to the
  simplicity and coherency of the system design. Partially ordered dependencies also
  facilitate system testing and analysis.
