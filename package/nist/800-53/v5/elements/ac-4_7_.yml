id: 1e45b80e-4819-4e80-b0cd-a34017150635
externalId: AC-4(7)
name: Information Flow Enforcement | One-way Flow Mechanisms
description: Enforce one-way information flows through hardware-based flow control
  mechanisms.
elementType: enhancement
parent: ac-4
guidance: One-way flow mechanisms may also be referred to as a unidirectional network,
  unidirectional security gateway, or data diode. One-way flow mechanisms can be used
  to prevent data from being exported from a higher impact or classified domain or
  system while permitting data from a lower impact or unclassified domain or system
  to be imported.
