id: 6c7bdaa7-0b45-438b-abbf-43386b258f6a
externalId: PT-6(2)
name: System of Records Notice | Exemption Rules
description: Reviews Privacy Act exemptions claimed for the system of records to ensure
  they remain appropriate, properly promulgated, and accurately described.
elementType: enhancement
parent: pt-6
guidance: Theincludes two sets of provisions that allow federal agencies to claim
  exemptions from certain requirements in the statute. In certain circumstances, these
  provisions allow agencies to promulgate regulations to exempt a system of records
  from select provisions of the. At a minimum, organizations’exemption regulations
  include the specific name(s) of any system(s) of records that will be exempt, the
  specific provisions of thefrom which the system(s) of records is to be exempted,
  the reasons for the exemption, and an explanation for why the exemption is both
  necessary and appropriate.
