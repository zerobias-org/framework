id: 268539b5-9399-4ab2-be07-c551f60ecd8f
externalId: SC-7(4)
name: Boundary Protection | External Telecommunications Services
description: Implements a managed interface and traffic flow policy for each external
  telecommunications service, protecting transmitted information and controlling exceptions
  and control plane traffic.
elementType: enhancement
parent: sc-7
guidance: External telecommunications services can provide data and/or voice communications
  services. Examples of control plane traffic include Border Gateway Protocol (BGP)
  routing, Domain Name System (DNS), and management protocols. See SP 800-189 for
  additional information on the use of the resource public key infrastructure (RPKI)
  to protect BGP routes and detect unauthorized BGP announcements.
