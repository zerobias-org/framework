id: 7644614c-d911-460c-8ec1-a36312dafd4b
externalId: IA-4(5)
name: Identifier Management | Dynamic Management
description: 'Manage individual identifiers dynamically in accordance with [Assignment:
  organization-defined dynamic identifier policy].'
elementType: enhancement
parent: ia-4
guidance: In contrast to conventional approaches to identification that presume static
  accounts for preregistered users, many distributed systems establish identifiers
  at runtime for entities that were previously unknown. When identifiers are established
  at runtime for previously unknown entities, organizations can anticipate and provision
  for the dynamic establishment of identifiers. Pre-established trust relationships
  and mechanisms with appropriate authorities to validate credentials and related
  identifiers are essential.
