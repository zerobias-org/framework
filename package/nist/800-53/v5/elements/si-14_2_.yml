id: 327e8620-89af-4e62-8cb1-1d49afbc7627
externalId: SI-14(2)
name: Non-persistence | Non-persistent Information
description: Refreshes or regenerates defined information on a schedule or on demand,
  and deletes it when no longer needed.
elementType: enhancement
parent: si-14
guidance: Retaining information longer than is needed makes the information a potential
  target for advanced adversaries searching for high value assets to compromise through
  unauthorized disclosure, unauthorized modification, or exfiltration. For system-related
  information, unnecessary retention provides advanced adversaries information that
  can assist in their reconnaissance and lateral movement through the system.
aliases:
