id: 36971e5a-64b6-4a0e-a973-18585dd98b93
externalId: SA-15(1)
name: Development Process, Standards, and Tools | Quality Metrics
description: Requires the developer to define quality metrics at the start of development
  and provide evidence of meeting them.
elementType: enhancement
parent: sa-15
guidance: Organizations use quality metrics to establish acceptable levels of system
  quality. Metrics can include quality gates, which are collections of completion
  criteria or sufficiency standards that represent the satisfactory execution of specific
  phases of the system development project. For example, a quality gate may require
  the elimination of all compiler warnings or a determination that such warnings have
  no impact on the effectiveness of required security or privacy capabilities. During
  the execution phases of development projects, quality gates provide clear, unambiguous
  indications of progress. Other metrics apply to the entire development project.
  Metrics can include defining the severity thresholds of vulnerabilities in accordance
  with organizational risk tolerance, such as requiring no known vulnerabilities in
  the delivered system with a Common Vulnerability Scoring System (CVSS) severity
  of medium or high.
