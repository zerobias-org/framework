id: cc09e9f7-6f0b-4760-b623-7b43ff578193
externalId: SI-4(10)
name: System Monitoring | Visibility of Encrypted Communications
description: 'Make provisions so that [Assignment: organization-defined encrypted
  communications traffic] is visible to [Assignment: organization-defined system monitoring
  tools and mechanisms].'
elementType: enhancement
parent: si-4
guidance: Organizations balance the need to encrypt communications traffic to protect
  data confidentiality with the need to maintain visibility into such traffic from
  a monitoring perspective. Organizations determine whether the visibility requirement
  applies to internal encrypted traffic, encrypted traffic intended for external destinations,
  or a subset of the traffic types.
