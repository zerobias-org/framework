id: f148093c-d02b-4604-8c7a-3514c848907c
externalId: AC-10
name: Concurrent Session Control
description: 'Limit the number of concurrent sessions for each [Assignment: organization-defined
  account and/or account type] to [Assignment: organization-defined number].'
elementType: control
parent: ac
guidance: Organizations may define the maximum number of concurrent sessions for system
  accounts globally, by account type, by account, or any combination thereof. For
  example, organizations may limit the number of concurrent sessions for system administrators
  or other individuals working in particularly sensitive domains or mission-critical
  applications. Concurrent session control addresses concurrent sessions for system
  accounts. It does not, however, address concurrent sessions by single users via
  multiple system accounts.
