id: 6a132811-ec2a-434b-af63-01d3c323b04d
externalId: CA-6
name: Authorization
description: "a. Assign a senior official as the authorizing official for the
  system;b. Assign a senior official as the authorizing official for common
  controls available for inheritance by organizational systems;c. Ensure that
  the authorizing official for the system, before commencing operations:1.
  Accepts the use of common controls inherited by the system; and2. Authorizes
  the system to operate;d. Ensure that the authorizing official for common
  controls authorizes the use of those controls for inheritance by
  organizational systems;e. Update the authorizations [Assignment:
  organization-defined frequency]."
elementType: control
