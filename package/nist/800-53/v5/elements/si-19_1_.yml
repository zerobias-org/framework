id: 00eb3a46-a853-4d4d-ac8a-3bff8784cce8
externalId: SI-19(1)
name: De-identification | Collection
description: De-identify the dataset upon collection by not collecting personally
  identifiable information.
elementType: enhancement
parent: si-19
guidance: If a data source contains personally identifiable information but the information
  will not be used, the dataset can be de-identified when it is created by not collecting
  the data elements that contain the personally identifiable information. For example,
  if an organization does not intend to use the social security number of an applicant,
  then application forms do not ask for a social security number.
