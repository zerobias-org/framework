id: 60045e60-f820-448f-abf9-c75975c284c7
externalId: CM-5
name: Access Restrictions for Change
description: Define, document, approve, and enforce physical and logical access restrictions
  associated with changes to the system.
elementType: control
parent: cm
guidance: Changes to the hardware, software, or firmware components of systems or
  the operational procedures related to the system can potentially have significant
  effects on the security of the systems or individuals’ privacy. Therefore, organizations
  permit only qualified and authorized individuals to access systems for purposes
  of initiating changes. Access restrictions include physical and logical access controls
  (seeand), software libraries, workflow automation, media libraries, abstract layers
  (i.e., changes implemented into external interfaces rather than directly into systems),
  and change windows (i.e., changes occur only during specified times).
