id: e157d2f9-92ad-42bb-9e1c-7aa47805392f
externalId: CP-2
name: Contingency Plan
description: "a. Develop a contingency plan for the system that:1. Identifies
  essential mission and business functions and associated contingency
  requirements;2. Provides recovery objectives, restoration priorities, and
  metrics;3. Addresses contingency roles, responsibilities, assigned individuals
  with contact information;4. Addresses maintaining essential mission and
  business functions despite a system disruption, compromise, or failure;5.
  Addresses eventual, full system restoration without deterioration of the
  controls originally planned and implemented;6. Addresses the sharing of
  contingency information; and7. Is reviewed and approved by [Assignment:
  organization-defined personnel or roles];b. Distribute copies of the
  contingency plan to [Assignment: organization-defined key contingency
  personnel (identified by name and/or by role) and organizational elements];c.
  Coordinate contingency planning activities with incident handling
  activities;d. Review the contingency plan for the system [Assignment:
  organization-defined frequency];e. Update the contingency plan to address
  changes to the organization, system, or environment of operation and problems
  encountered during contingency plan implementation, execution, or testing;f.
  Communicate contingency plan changes to [Assignment: organization-defined key
  contingency personnel (identified by name and/or by role) and organizational
  elements];g. Incorporate lessons learned from contingency plan testing,
  training, or actual contingency activities into contingency testing and
  training; andh. Protect the contingency plan from unauthorized disclosure and
  modification."
elementType: control
