id: 44ccd5e0-351a-4021-92e7-6c3d088335ab
externalId: CP-7
name: Alternate Processing Site
description: Establishes an alternate processing site with agreements, equipment,
  and controls to transfer and resume essential operations within a defined time period.
elementType: control
parent: cp
guidance: Alternate processing sites are geographically distinct from primary processing
  sites and provide processing capability if the primary processing site is not available.
  The alternate processing capability may be addressed using a physical processing
  site or other alternatives, such as failover to a cloud-based service provider or
  other internally or externally provided processing service. Geographically distributed
  architectures that support contingency requirements may also be considered alternate
  processing sites. Controls that are covered by alternate processing site agreements
  include the environmental conditions at alternate sites, access rules, physical
  and environmental protection requirements, and the coordination for the transfer
  and assignment of personnel. Requirements are allocated to alternate processing
  sites that reflect the requirements in contingency plans to maintain essential mission
  and business functions despite disruption, compromise, or failure in organizational
  systems.
