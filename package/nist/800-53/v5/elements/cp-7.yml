id: 9e0b6d23-a976-4418-af2c-be56fdbbafcc
externalId: CP-7
name: Alternate Processing Site
description: "a. Establish an alternate processing site, including necessary
  agreements to permit the transfer and resumption of [Assignment:
  organization-defined system operations] for essential mission and business
  functions within [Assignment: organization-defined time period consistent with
  recovery time and recovery point objectives] when the primary processing
  capabilities are unavailable;b. Make available at the alternate processing
  site, the equipment and supplies required to transfer and resume operations or
  put contracts in place to support delivery to the site within the
  organization-defined time period for transfer and resumption; andc. Provide
  controls at the alternate processing site that are equivalent to those at the
  primary site."
elementType: control
