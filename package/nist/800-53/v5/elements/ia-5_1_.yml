id: 4ca546c7-9930-4879-9ab8-05f2b008e4a0
externalId: IA-5(1)
name: Authenticator Management | Password-based Authentication
description: Enforces password-based authentication requirements, including checks
  against compromised-password lists, protected transmission and storage, and complexity
  rules.
elementType: enhancement
parent: ia-5
guidance: Password-based authentication applies to passwords regardless of whether
  they are used in single-factor or multi-factor authentication. Long passwords or
  passphrases are preferable over shorter passwords. Enforced composition rules provide
  marginal security benefits while decreasing usability. However, organizations may
  choose to establish certain rules for password generation (e.g., minimum character
  length for long passwords) under certain circumstances and can enforce this requirement
  in IA-5(1)(h). Account recovery can occur, for example, in situations when a password
  is forgotten. Cryptographically protected passwords include salted one-way cryptographic
  hashes of passwords. The list of commonly used, compromised, or expected passwords
  includes passwords obtained from previous breach corpuses, dictionary words, and
  repetitive or sequential characters. The list includes context-specific words, such
  as the name of the service, username, and derivatives thereof.
aliases:
