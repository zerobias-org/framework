id: 732a1485-a62e-48e3-a22e-a2a944b26bb0
externalId: AU-10(2)
name: Non-repudiation | Validate Binding of Information Producer Identity
description: Validates the binding of an information producer's identity to the information
  on a defined schedule, and responds to validation errors.
elementType: enhancement
parent: au-10
guidance: Validating the binding of the information producer identity to the information
  prevents the modification of information between production and review. The validation
  of bindings can be achieved by, for example, using cryptographic checksums. Organizations
  determine if validations are in response to user requests or generated automatically.
