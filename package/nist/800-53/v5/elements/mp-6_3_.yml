id: cab37998-6b78-46f9-8918-82d39d7dbbb9
externalId: MP-6(3)
name: Media Sanitization | Nondestructive Techniques
description: Applies nondestructive sanitization techniques to portable storage devices
  before connecting them to the system under defined circumstances.
elementType: enhancement
parent: mp-6
guidance: Portable storage devices include external or removable hard disk drives
  (e.g., solid state, magnetic), optical discs, magnetic or optical tapes, flash memory
  devices, flash memory cards, and other external or removable disks. Portable storage
  devices can be obtained from untrustworthy sources and contain malicious code that
  can be inserted into or transferred to organizational systems through USB ports
  or other entry portals. While scanning storage devices is recommended, sanitization
  provides additional assurance that such devices are free of malicious code. Organizations
  consider nondestructive sanitization of portable storage devices when the devices
  are purchased from manufacturers or vendors prior to initial use or when organizations
  cannot maintain a positive chain of custody for the devices.
aliases:
