id: 0cef08e4-6a94-4796-bc50-69b9bdfaa248
externalId: SA-9(4)
name: External System Services | Consistent Interests of Consumers and Providers
description: Verifies that the interests of defined external service providers are
  consistent with and reflect organizational interests.
elementType: enhancement
parent: sa-9
guidance: As organizations increasingly use external service providers, it is possible
  that the interests of the service providers may diverge from organizational interests.
  In such situations, simply having the required technical, management, or operational
  controls in place may not be sufficient if the providers that implement and manage
  those controls are not operating in a manner consistent with the interests of the
  consuming organizations. Actions that organizations take to address such concerns
  include requiring background checks for selected service provider personnel; examining
  ownership records; employing only trustworthy service providers, such as providers
  with which organizations have had successful trust relationships; and conducting
  routine, periodic, unscheduled visits to service provider facilities.
aliases:
