name: Maintenance Tools | Software Updates and Patches
description: Inspect maintenance tools to ensure the latest software updates and patches
  are installed.
elementType: enhancement
parent: ma-3
guidance: Maintenance tools using outdated and/or unpatched software can provide a
  threat vector for adversaries and result in a significant vulnerability for organizations.
