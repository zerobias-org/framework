name: Audit Record Review, Analysis, and Reporting
description: "a. Review and analyze system audit records [Assignment:
  organization-defined frequency] for indications of [Assignment:
  organization-defined inappropriate or unusual activity] and the potential
  impact of the inappropriate or unusual activity;b. Report findings to
  [Assignment: organization-defined personnel or roles]; andc. Adjust the level
  of audit record review, analysis, and reporting within the system when there
  is a change in risk based on law enforcement information, intelligence
  information, or other credible sources of information."
