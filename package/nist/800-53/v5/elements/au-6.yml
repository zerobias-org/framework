id: ca0577f4-b4c7-4725-a734-62d46d2b95cd
externalId: AU-6
name: Audit Record Review, Analysis, and Reporting
description: Reviews and analyzes audit records for unusual activity on a defined
  schedule, reports findings, and adjusts review intensity based on risk.
elementType: control
parent: au
guidance: Audit record review, analysis, and reporting covers information security-
  and privacy-related logging performed by organizations, including logging that results
  from the monitoring of account usage, remote access, wireless connectivity, mobile
  device connection, configuration settings, system component inventory, use of maintenance
  tools and non-local maintenance, physical access, temperature and humidity, equipment
  delivery and removal, communications at system interfaces, and use of mobile code
  or Voice over Internet Protocol (VoIP). Findings can be reported to organizational
  entities that include the incident response team, help desk, and security or privacy
  offices. If organizations are prohibited from reviewing and analyzing audit records
  or unable to conduct such activities, the review or analysis may be carried out
  by other organizations granted such authority. The frequency, scope, and/or depth
  of the audit record review, analysis, and reporting may be adjusted to meet organizational
  needs based on new information received.
