id: 4bea5365-4705-4429-897f-1c510d938b46
externalId: SC-30(2)
name: Concealment and Misdirection | Randomness
description: 'Employ [Assignment: organization-defined techniques] to introduce randomness
  into organizational operations and assets.'
elementType: enhancement
parent: sc-30
guidance: Randomness introduces increased levels of uncertainty for adversaries regarding
  the actions that organizations take to defend their systems against attacks. Such
  actions may impede the ability of adversaries to correctly target information resources
  of organizations that support critical missions or business functions. Uncertainty
  may also cause adversaries to hesitate before initiating or continuing attacks.
  Misdirection techniques that involve randomness include performing certain routine
  actions at different times of day, employing different information technologies,
  using different suppliers, and rotating roles and responsibilities of organizational
  personnel.
