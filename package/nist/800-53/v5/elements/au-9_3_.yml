id: eb4b5e81-285c-4132-bd4f-ea9efe11871b
externalId: AU-9(3)
name: Protection of Audit Information | Cryptographic Protection
description: Implement cryptographic mechanisms to protect the integrity of audit
  information and audit tools.
elementType: enhancement
parent: au-9
guidance: Cryptographic mechanisms used for protecting the integrity of audit information
  include signed hash functions using asymmetric cryptography. This enables the distribution
  of the public key to verify the hash information while maintaining the confidentiality
  of the secret key used to generate the hash.
