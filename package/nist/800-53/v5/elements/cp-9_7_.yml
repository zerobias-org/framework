id: 6ce2121c-907a-4303-965b-a60bc020fd3f
externalId: CP-9(7)
name: System Backup | Dual Authorization for Deletion or Destruction
description: 'Enforce dual authorization for the deletion or destruction of [Assignment:
  organization-defined backup information].'
elementType: enhancement
parent: cp-9
guidance: Dual authorization ensures that deletion or destruction of backup information
  cannot occur unless two qualified individuals carry out the task. Individuals deleting
  or destroying backup information possess the skills or expertise to determine if
  the proposed deletion or destruction of information reflects organizational policies
  and procedures. Dual authorization may also be known as two-person control. To reduce
  the risk of collusion, organizations consider rotating dual authorization duties
  to other individuals.
