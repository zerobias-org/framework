externalId: CA-5
name: Plan of Action and Milestones
description: Develops a plan of action and milestones to remediate weaknesses found
  during assessments, and updates it based on ongoing findings.
elementType: control
parent: ca
guidance: Plans of action and milestones are useful for any type of organization to
  track planned remedial actions. Plans of action and milestones are required in authorization
  packages and subject to federal reporting requirements established by OMB.
