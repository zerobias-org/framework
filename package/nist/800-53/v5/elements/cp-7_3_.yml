id: 8244c83f-b544-4bbc-8127-ba06cf914937
externalId: CP-7(3)
name: Alternate Processing Site | Priority of Service
description: Develop alternate processing site agreements that contain priority-of-service
  provisions in accordance with availability requirements (including recovery time
  objectives).
elementType: enhancement
parent: cp-7
guidance: Priority of service agreements refer to negotiated agreements with service
  providers that ensure that organizations receive priority treatment consistent with
  their availability requirements and the availability of information resources for
  logical alternate processing and/or at the physical alternate processing site. Organizations
  establish recovery time objectives as part of contingency planning.
