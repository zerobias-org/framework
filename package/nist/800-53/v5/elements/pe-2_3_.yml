id: afe09f54-5dee-4abd-a706-637ca2fe1de4
externalId: PE-2(3)
name: Physical Access Authorizations | Restrict Unescorted Access
description: Restricts unescorted facility access to personnel with clearance, authorization,
  or need for access to all information in the system.
elementType: enhancement
parent: pe-2
guidance: Individuals without required security clearances, access approvals, or need
  to know are escorted by individuals with appropriate physical access authorizations
  to ensure that information is not exposed or otherwise compromised.
aliases:
