name: Mission and Business Process Definition
description: "a. Define organizational mission and business processes with
  consideration for information security and privacy and the resulting risk to
  organizational operations, organizational assets, individuals, other
  organizations, and the Nation; andb. Determine information protection and
  personally identifiable information processing needs arising from the defined
  mission and business processes; andc. Review and revise the mission and
  business processes [Assignment: organization-defined frequency]."
