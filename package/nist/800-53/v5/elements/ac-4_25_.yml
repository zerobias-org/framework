externalId: AC-4(25)
name: Information Flow Enforcement | Data Sanitization
description: Sanitizes data transferred between security domains to minimize malicious
  content or sensitive information spillage.
elementType: enhancement
parent: ac-4
guidance: Data sanitization is the process of irreversibly removing or destroying
  data stored on a memory device (e.g., hard drives, flash memory/solid state drives,
  mobile devices, CDs, and DVDs) or in hard copy form.
