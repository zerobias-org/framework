id: 35489217-b437-4ef5-8a68-fa8a3ac0b0a4
externalId: PM-30(1)
name: Supply Chain Risk Management Strategy | Suppliers of Critical or Mission-essential
  Items
description: Identify, prioritize, and assess suppliers of critical or mission-essential
  technologies, products, and services.
elementType: enhancement
parent: pm-30
guidance: The identification and prioritization of suppliers of critical or mission-essential
  technologies, products, and services is paramount to the mission/business success
  of organizations. The assessment of suppliers is conducted using supplier reviews
  (see) and supply chain risk assessment processes (see). An analysis of supply chain
  risk can help an organization identify systems or components for which additional
  supply chain risk mitigations are required.
