id: b4354faa-8f5e-4a64-97d4-0795ce21a4a1
externalId: MA-5(4)
name: Maintenance Personnel | Foreign Nationals
description: Permits foreign nationals to perform maintenance on jointly or foreign-owned
  classified systems only with documented approvals and operational conditions.
elementType: enhancement
parent: ma-5
guidance: Personnel who conduct maintenance and diagnostic activities on organizational
  systems may be exposed to classified information. If non-U.S. citizens are permitted
  to perform maintenance and diagnostics activities on classified systems, then additional
  vetting is required to ensure agreements and restrictions are not being violated.
