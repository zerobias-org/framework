id: b4354faa-8f5e-4a64-97d4-0795ce21a4a1
externalId: MA-5(4)
name: Maintenance Personnel | Foreign Nationals
description: Ensure that:a. Foreign nationals with appropriate security
  clearances are used to conduct maintenance and diagnostic activities on
  classified systems only when the systems are jointly owned and operated by the
  United States and foreign allied governments, or owned and operated solely by
  foreign allied governments; andb. Approvals, consents, and detailed
  operational conditions regarding the use of foreign nationals to conduct
  maintenance and diagnostic activities on classified systems are fully
  documented within Memoranda of Agreements.
elementType: control
