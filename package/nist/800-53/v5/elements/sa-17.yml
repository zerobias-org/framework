id: 17e962e2-d35a-4075-95f1-e915be8f7798
externalId: SA-17
name: Developer Security and Privacy Architecture and Design
description: Require the developer of the system, system component, or system
  service to produce a design specification and security and privacy
  architecture that:a. Is consistent with the organization’s security and
  privacy architecture that is an integral part the organization’s enterprise
  architecture;b. Accurately and completely describes the required security and
  privacy functionality, and the allocation of controls among physical and
  logical components; andc. Expresses how individual security and privacy
  functions, mechanisms, and services work together to provide required security
  and privacy capabilities and a unified approach to protection.
elementType: control
