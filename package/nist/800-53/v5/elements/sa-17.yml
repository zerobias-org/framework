id: ef7e0c1d-ce46-4259-8d7a-d49a1581c2ad
externalId: SA-17
name: Developer Security and Privacy Architecture and Design
description: Requires the developer to produce a design specification and security
  and privacy architecture consistent with the organization's enterprise architecture.
elementType: control
parent: sa
guidance: Developer security and privacy architecture and design are directed at external
  developers, although they could also be applied to internal (in-house) development.
  In contrast, PL-8 is directed at internal developers to ensure that organizations
  develop a security and privacy architecture that is integrated with the enterprise
  architecture. The distinction between SA-17 and PL-8 is especially important when
  organizations outsource the development of systems, system components, or system
  services and when there is a requirement to demonstrate consistency with the enterprise
  architecture and security and privacy architecture of the organization. ISO 15408-2,
  ISO 15408-3, and SP 800-160-1 provide information on security architecture and design,
  including formal policy models, security-relevant components, formal and informal
  correspondence, conceptually simple design, and structuring for least privilege
  and testing.
aliases:
- SA-17
