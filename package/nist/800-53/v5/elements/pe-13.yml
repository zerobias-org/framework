id: 73d94d55-fde6-428a-bf38-722138e78e5c
externalId: PE-13
name: Fire Protection
description: Employ and maintain fire detection and suppression systems that are supported
  by an independent energy source.
elementType: control
parent: pe
guidance: The provision of fire detection and suppression systems applies primarily
  to organizational facilities that contain concentrations of system resources, including
  data centers, server rooms, and mainframe computer rooms. Fire detection and suppression
  systems that may require an independent energy source include sprinkler systems
  and smoke detectors. An independent energy source is an energy source, such as a
  microgrid, that is separate, or can be separated, from the energy sources providing
  power for the other parts of the facility.
