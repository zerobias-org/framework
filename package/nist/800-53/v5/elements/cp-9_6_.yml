id: 1fbf7b9a-762c-4589-823f-61392b8cdf55
externalId: CP-9(6)
name: System Backup | Redundant Secondary System
description: Conduct system backup by maintaining a redundant secondary system that
  is not collocated with the primary system and that can be activated without loss
  of information or disruption to operations.
elementType: enhancement
parent: cp-9
guidance: The effect of system backup can be achieved by maintaining a redundant secondary
  system that mirrors the primary system, including the replication of information.
  If this type of redundancy is in place and there is sufficient geographic separation
  between the two systems, the secondary system can also serve as the alternate processing
  site.
