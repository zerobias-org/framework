id: db5f3657-5a89-45f2-b538-c2a009072a20
externalId: CA-6(2)
name: Authorization | Joint Authorization — Inter-organization
description: Employs a joint authorization process including at least one authorizing
  official from an external organization.
elementType: enhancement
parent: ca-6
guidance: Assigning multiple authorizing officials, at least one of whom comes from
  an external organization, to serve as co-authorizing officials for the system increases
  the level of independence in the risk-based decision-making process. It implements
  the concepts of separation of duties and dual authorization as applied to the system
  authorization process. Employing authorizing officials from external organizations
  to supplement the authorizing official from the organization that owns or hosts
  the system may be necessary when the external organizations have a vested interest
  or equities in the outcome of the authorization decision. The inter-organization
  joint authorization process is relevant and appropriate for connected systems, shared
  systems or services, and systems with multiple information owners. The authorizing
  officials from the external organizations are key stakeholders of the system undergoing
  authorization.
aliases:
