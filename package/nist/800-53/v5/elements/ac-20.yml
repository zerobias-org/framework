name: Use of External Systems
description: "a. [Selection (one or more): Establish [Assignment:
  organization-defined terms and conditions]; Identify [Assignment:
  organization-defined controls asserted to be implemented on external
  systems]], consistent with the trust relationships established with other
  organizations owning, operating, and/or maintaining external systems, allowing
  authorized individuals to:1. Access the system from external systems; and2.
  Process, store, or transmit organization-controlled information using external
  systems; orb. Prohibit the use of [Assignment: organizationally-defined types
  of external systems]."
