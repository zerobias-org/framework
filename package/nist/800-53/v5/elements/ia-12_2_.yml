id: b618b6b9-59af-40ca-bdf8-c1f191354616
externalId: IA-12(2)
name: Identity Proofing | Identity Evidence
description: Require evidence of individual identification be presented to the registration
  authority.
elementType: enhancement
parent: ia-12
guidance: Identity evidence, such as documentary evidence or a combination of documents
  and biometrics, reduces the likelihood of individuals using fraudulent identification
  to establish an identity or at least increases the work factor of potential adversaries.
  The forms of acceptable evidence are consistent with the risks to the systems, roles,
  and privileges associated with the user’s account.
