id: ac317d95-874c-4249-888d-6ec62ae100e8
externalId: AC-17(4)
name: Remote Access | Privileged Commands and Access
description: Authorizes privileged commands and access to security-relevant information
  over remote access only with assessable evidence, and documents the rationale.
elementType: enhancement
parent: ac-17
guidance: Remote access to systems represents a significant potential vulnerability
  that can be exploited by adversaries. As such, restricting the execution of privileged
  commands and access to security-relevant information via remote access reduces the
  exposure of the organization and the susceptibility to threats by adversaries to
  the remote access capability.
