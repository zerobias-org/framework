id: 35dfaaf6-f7c4-41fc-a61f-510cd68ecd14
externalId: MA-5(5)
name: Maintenance Personnel | Non-system Maintenance
description: Ensure that non-escorted personnel performing maintenance activities
  not directly associated with the system but in the physical proximity of the system,
  have required access authorizations.
elementType: enhancement
parent: ma-5
guidance: Personnel who perform maintenance activities in other capacities not directly
  related to the system include physical plant personnel and custodial personnel.
