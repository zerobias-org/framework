id: b1b16e2d-1185-4cc8-8736-e06ddb77239c
externalId: AC-6(4)
name: Least Privilege | Separate Processing Domains
description: Provide separate processing domains to enable finer-grained allocation
  of user privileges.
elementType: enhancement
parent: ac-6
guidance: Providing separate processing domains for finer-grained allocation of user
  privileges includes using virtualization techniques to permit additional user privileges
  within a virtual machine while restricting privileges to other virtual machines
  or to the underlying physical machine, implementing separate physical domains, and
  employing hardware or software domain separation mechanisms.
aliases:
