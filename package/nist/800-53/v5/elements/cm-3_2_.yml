id: 3a660114-a767-4a12-8ee0-e03f415e685b
externalId: CM-3(2)
name: Configuration Change Control | Testing, Validation, and Documentation of Changes
description: Test, validate, and document changes to the system before finalizing
  the implementation of the changes.
elementType: enhancement
parent: cm-3
guidance: Changes to systems include modifications to hardware, software, or firmware
  components and configuration settings defined in. Organizations ensure that testing
  does not interfere with system operations that support organizational mission and
  business functions. Individuals or groups conducting tests understand security and
  privacy policies and procedures, system security and privacy policies and procedures,
  and the health, safety, and environmental risks associated with specific facilities
  or processes. Operational systems may need to be taken offline, or replicated to
  the extent feasible, before testing can be conducted. If systems must be taken offline
  for testing, the tests are scheduled to occur during planned system outages whenever
  possible. If the testing cannot be conducted on operational systems, organizations
  employ compensating controls.
