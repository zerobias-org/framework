id: bc2a747c-5a60-4c90-a9f5-38d2bee20539
externalId: AC-6(7)
name: Least Privilege | Review of User Privileges
description: Periodically reviews assigned privileges to validate the need for them,
  and reassigns or removes them as needed.
elementType: enhancement
parent: ac-6
guidance: The need for certain assigned user privileges may change over time to reflect
  changes in organizational mission and business functions, environments of operation,
  technologies, or threats. A periodic review of assigned user privileges is necessary
  to determine if the rationale for assigning such privileges remains valid. If the
  need cannot be revalidated, organizations take appropriate corrective actions.
