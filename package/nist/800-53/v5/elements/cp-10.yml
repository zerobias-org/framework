id: 8eb1c8a3-9936-4691-96ee-27ff30e11c96
externalId: CP-10
name: System Recovery and Reconstitution
description: Provides for recovery and reconstitution of the system to a known state
  within a defined time period after a disruption, compromise, or failure.
elementType: control
parent: cp
guidance: Recovery is executing contingency plan activities to restore organizational
  mission and business functions. Reconstitution takes place following recovery and
  includes activities for returning systems to fully operational states. Recovery
  and reconstitution operations reflect mission and business priorities; recovery
  point, recovery time, and reconstitution objectives; and organizational metrics
  consistent with contingency plan requirements. Reconstitution includes the deactivation
  of interim system capabilities that may have been needed during recovery operations.
  Reconstitution also includes assessments of fully restored system capabilities,
  reestablishment of continuous monitoring activities, system reauthorization (if
  required), and activities to prepare the system and organization for future disruptions,
  breaches, compromises, or failures. Recovery and reconstitution capabilities can
  include automated mechanisms and manual procedures. Organizations establish recovery
  time and recovery point objectives as part of contingency planning.
