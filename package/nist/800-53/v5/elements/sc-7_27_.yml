id: 2a180c86-d121-46cc-bc77-035991765ce6
externalId: SC-7(27)
name: Boundary Protection | Unclassified Non-national Security System Connections
description: Prohibits direct connection of defined unclassified non-national security
  systems to an external network without a defined boundary protection device.
elementType: enhancement
parent: sc-7
guidance: A direct connection is a dedicated physical or virtual connection between
  two or more systems. Organizations typically do not have complete control over external
  networks, including the Internet. Boundary protection devices (e.g., firewalls,
  gateways, and routers) mediate communications and information flows between unclassified
  non-national security systems and external networks.
