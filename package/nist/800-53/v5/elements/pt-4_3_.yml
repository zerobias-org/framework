externalId: PT-4(3)
name: Consent | Revocation
description: 'Implement [Assignment: organization-defined tools or mechanisms] for
  individuals to revoke consent to the processing of their personally identifiable
  information.'
elementType: enhancement
parent: pt-4
guidance: Revocation of consent enables individuals to exercise control over their
  initial consent decision when circumstances change. Organizations consider usability
  factors in enabling easy-to-use revocation capabilities.
