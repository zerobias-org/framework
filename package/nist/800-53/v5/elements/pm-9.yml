name: Risk Management Strategy
description: "a. Develops a comprehensive strategy to manage:1. Security risk to
  organizational operations and assets, individuals, other organizations, and
  the Nation associated with the operation and use of organizational systems;
  and2. Privacy risk to individuals resulting from the authorized processing of
  personally identifiable information;b. Implement the risk management strategy
  consistently across the organization; andc. Review and update the risk
  management strategy [Assignment: organization-defined frequency] or as
  required, to address organizational changes."
elementType: control
