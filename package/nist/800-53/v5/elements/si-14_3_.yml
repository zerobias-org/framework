id: dd2e61e7-2353-4d33-b537-275c86f41187
externalId: SI-14(3)
name: Non-persistence | Non-persistent Connectivity
description: 'Establish connections to the system on demand and terminate connections
  after [Selection: completion of a request; a period of non-use].'
elementType: enhancement
parent: si-14
guidance: Persistent connections to systems can provide advanced adversaries with
  paths to move laterally through systems and potentially position themselves closer
  to high value assets. Limiting the availability of such connections impedes the
  adversary’s ability to move freely through organizational systems.
aliases:
