id: 87d7b837-3a38-43b3-8397-080e892ade04
externalId: AC-16(4)
name: Security and Privacy Attributes | Association of Attributes by Authorized Individuals
description: Provides the capability for authorized individuals to associate security
  and privacy attributes with subjects and objects.
elementType: enhancement
parent: ac-16
guidance: Systems, in general, provide the capability for privileged users to assign
  security and privacy attributes to system-defined subjects (e.g., users) and objects
  (e.g., directories, files, and ports). Some systems provide additional capability
  for general users to assign security and privacy attributes to additional objects
  (e.g., files, emails). The association of attributes by authorized individuals is
  described in the design documentation. The support provided by systems can include
  prompting users to select security and privacy attributes to be associated with
  information objects, employing automated mechanisms to categorize information with
  attributes based on defined policies, or ensuring that the combination of the security
  or privacy attributes selected is valid. Organizations consider the creation, deletion,
  or modification of attributes when defining auditable events.
