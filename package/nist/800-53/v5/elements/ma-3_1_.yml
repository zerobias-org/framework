id: 07f6bd80-e206-441c-ad3e-1342e3f43406
externalId: MA-3(1)
name: Maintenance Tools | Inspect Tools
description: Inspect the maintenance tools used by maintenance personnel for improper
  or unauthorized modifications.
elementType: enhancement
parent: ma-3
guidance: Maintenance tools can be directly brought into a facility by maintenance
  personnel or downloaded from a vendor’s website. If, upon inspection of the maintenance
  tools, organizations determine that the tools have been modified in an improper
  manner or the tools contain malicious code, the incident is handled consistent with
  organizational policies and procedures for incident handling.
