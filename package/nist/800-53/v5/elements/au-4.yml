id: 01b56413-7223-4f6e-b172-54e7bde575cf
externalId: AU-4
name: Audit Log Storage Capacity
description: 'Allocate audit log storage capacity to accommodate [Assignment: organization-defined
  audit log retention requirements].'
elementType: control
parent: au
guidance: Organizations consider the types of audit logging to be performed and the
  audit log processing requirements when allocating audit log storage capacity. Allocating
  sufficient audit log storage capacity reduces the likelihood of such capacity being
  exceeded and resulting in the potential loss or reduction of audit logging capability.
