id: 59483b41-5d67-4a0f-ace7-271aeda1741f
externalId: PM-4
name: Plan of Action and Milestones Process
description: Implements a process ensuring plans of action and milestones for security,
  privacy, and supply chain risk programs are developed, documented, and reported.
elementType: control
parent: pm
guidance: The plan of action and milestones is a key organizational document and is
  subject to reporting requirements established by the Office of Management and Budget.
  Organizations develop plans of action and milestones with an organization-wide perspective,
  prioritizing risk response actions and ensuring consistency with the goals and objectives
  of the organization. Plan of action and milestones updates are based on findings
  from control assessments and continuous monitoring activities. There can be multiple
  plans of action and milestones corresponding to the information system level, mission/business
  process level, and organizational/governance level. While plans of action and milestones
  are required for federal organizations, other types of organizations can help reduce
  risk by documenting and tracking planned remediations. Specific guidance on plans
  of action and milestones at the system level is provided in.
