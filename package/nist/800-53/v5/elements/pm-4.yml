id: e304bcc2-db26-4595-94ac-4ea991d23435
externalId: PM-4
name: Plan of Action and Milestones Process
description: a. Implement a process to ensure that plans of action and
  milestones for the information security, privacy, and supply chain risk
  management programs and associated organizational systems:1. Are developed and
  maintained;2. Document the remedial information security, privacy, and supply
  chain risk management actions to adequately respond to risk to organizational
  operations and assets, individuals, other organizations, and the Nation; and3.
  Are reported in accordance with established reporting requirements.b. Review
  plans of action and milestones for consistency with the organizational risk
  management strategy and organization-wide priorities for risk response
  actions.
elementType: control
