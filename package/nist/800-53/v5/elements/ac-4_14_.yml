id: 85e3f6f0-c31f-49a8-b59d-eea16b0180ce
externalId: AC-4(14)
name: Information Flow Enforcement | Security or Privacy Policy Filter Constraints
description: Requires policy filters between security domains to use fully enumerated
  formats that restrict data structure and content.
elementType: enhancement
parent: ac-4
guidance: Data structure and content restrictions reduce the range of potential malicious
  or unsanctioned content in cross-domain transactions. Security or privacy policy
  filters that restrict data structures include restricting file sizes and field lengths.
  Data content policy filters include encoding formats for character sets, restricting
  character data fields to only contain alpha-numeric characters, prohibiting special
  characters, and validating schema structures.
