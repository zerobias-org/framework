id: 4d3e7726-caa4-4e79-8938-764f53ee142f
externalId: CM-8(2)
name: System Component Inventory | Automated Maintenance
description: 'Maintain the currency, completeness, accuracy, and availability of the
  inventory of system components using [Assignment: organization-defined automated
  mechanisms].'
elementType: enhancement
parent: cm-8
guidance: Organizations maintain system inventories to the extent feasible. For example,
  virtual machines can be difficult to monitor because such machines are not visible
  to the network when not in use. In such cases, organizations maintain as up-to-date,
  complete, and accurate an inventory as is deemed reasonable. Automated maintenance
  can be achieved by the implementation offor organizations that combine system component
  inventory and baseline configuration activities.
