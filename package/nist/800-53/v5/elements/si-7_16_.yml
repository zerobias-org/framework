id: 02a761a9-1bd9-45a5-8545-5b8c8b7b20eb
externalId: SI-7(16)
name: Software, Firmware, and Information Integrity | Time Limit on Process Execution
  Without Supervision
description: 'Prohibit processes from executing without supervision for more than
  [Assignment: organization-defined time period].'
elementType: enhancement
parent: si-7
guidance: Placing a time limit on process execution without supervision is intended
  to apply to processes for which typical or normal execution periods can be determined
  and situations in which organizations exceed such periods. Supervision includes
  timers on operating systems, automated responses, and manual oversight and response
  when system process anomalies occur.
