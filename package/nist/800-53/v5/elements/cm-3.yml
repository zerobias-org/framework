id: 7e964bb8-7219-473e-908e-dc5ea828d3dc
externalId: CM-3
name: Configuration Change Control
description: Determines configuration-controlled change types, reviews and approves
  proposed changes, documents decisions, implements approved changes, and provides
  oversight.
elementType: control
parent: cm
guidance: Configuration change control for organizational systems involves the systematic
  proposal, justification, implementation, testing, review, and disposition of system
  changes, including system upgrades and modifications. Configuration change control
  includes changes to baseline configurations, configuration items of systems, operational
  procedures, configuration settings for system components, remediate vulnerabilities,
  and unscheduled or unauthorized changes. Processes for managing configuration changes
  to systems include Configuration Control Boards or Change Advisory Boards that review
  and approve proposed changes. For changes that impact privacy risk, the senior agency
  official for privacy updates privacy impact assessments and system of records notices.
  For new systems or major upgrades, organizations consider including representatives
  from the development organizations on the Configuration Control Boards or Change
  Advisory Boards. Auditing of changes includes activities before and after changes
  are made to systems and the auditing activities required to implement such changes.
  See also.
