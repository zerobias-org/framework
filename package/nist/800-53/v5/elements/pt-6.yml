id: 6f0a03f2-8320-4970-be22-0f2d3b1ba2c4
externalId: PT-6
name: System of Records Notice
description: Drafts, submits for review, and publishes system of records notices for
  systems maintaining Privacy Act records, and keeps them accurate and current.
elementType: control
parent: pt
guidance: Therequires that federal agencies publish a system of records notice in
  the Federal Register upon the establishment and/or modification of asystem of records.
  As a general matter, a system of records notice is required when an agency maintains
  a group of any records under the control of the agency from which information is
  retrieved by the name of an individual or by some identifying number, symbol, or
  other identifier. The notice describes the existence and character of the system
  and identifies the system of records, the purpose(s) of the system, the authority
  for maintenance of the records, the categories of records maintained in the system,
  the categories of individuals about whom records are maintained, the routine uses
  to which the records are subject, and additional details about the system as described
  in.
