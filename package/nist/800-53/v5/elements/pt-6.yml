externalId: PT-6
name: System of Records Notice
description: For systems that process information that will be maintained in a
  Privacy Act system of records:a. Draft system of records notices in accordance
  with OMB guidance and submit new and significantly modified system of records
  notices to the OMB and appropriate congressional committees for advance
  review;b. Publish system of records notices in the Federal Register; andc.
  Keep system of records notices accurate, up-to-date, and scoped in accordance
  with policy.
elementType: control
