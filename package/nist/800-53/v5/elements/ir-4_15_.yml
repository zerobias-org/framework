id: 48a8e5c7-8f2f-4344-97e1-159fb27a9229
externalId: IR-4(15)
name: Incident Handling | Public Relations and Reputation Repair
description: (a) Manage public relations associated with an incident; and (b) Employ
  measures to repair the reputation of the organization.
elementType: enhancement
parent: ir-4
guidance: It is important for an organization to have a strategy in place for addressing
  incidents that have been brought to the attention of the general public, have cast
  the organization in a negative light, or have affected the organization’s constituents
  (e.g., partners, customers). Such publicity can be extremely harmful to the organization
  and affect its ability to carry out its mission and business functions. Taking proactive
  steps to repair the organization’s reputation is an essential aspect of reestablishing
  the trust and confidence of its constituents.
