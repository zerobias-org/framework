id: 7c8accc4-f7b3-448d-8c85-0dc45ce4a6dd
externalId: SC-7(5)
name: Boundary Protection | Deny by Default — Allow by Exception
description: 'Deny network communications traffic by default and allow network communications
  traffic by exception [Selection (one or more): at managed interfaces; for [Assignment:
  organization-defined systems]].'
elementType: enhancement
parent: sc-7
guidance: Denying by default and allowing by exception applies to inbound and outbound
  network communications traffic. A deny-all, permit-by-exception network communications
  traffic policy ensures that only those system connections that are essential and
  approved are allowed. Deny by default, allow by exception also applies to a system
  that is connected to an external system.
aliases:
