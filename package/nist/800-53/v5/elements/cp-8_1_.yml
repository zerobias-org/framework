id: a042b591-646d-4da7-b6e2-9a0f3fe5616f
externalId: CP-8(1)
name: Telecommunications Services | Priority of Service Provisions
description: a. Develop primary and alternate telecommunications service
  agreements that contain priority-of-service provisions in accordance with
  availability requirements (including recovery time objectives); andb. Request
  Telecommunications Service Priority for all telecommunications services used
  for national security emergency preparedness if the primary and/or alternate
  telecommunications services are provided by a common carrier.
elementType: control
