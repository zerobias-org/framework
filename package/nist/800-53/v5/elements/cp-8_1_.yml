id: a042b591-646d-4da7-b6e2-9a0f3fe5616f
externalId: CP-8(1)
name: Telecommunications Services | Priority of Service Provisions
description: Develops telecommunications service agreements with priority-of-service
  provisions, requesting Telecommunications Service Priority where a common carrier
  is used.
elementType: enhancement
parent: cp-8
guidance: Organizations consider the potential mission or business impact in situations
  where telecommunications service providers are servicing other organizations with
  similar priority of service provisions. Telecommunications Service Priority (TSP)
  is a Federal Communications Commission (FCC) program that directs telecommunications
  service providers (e.g., wireline and wireless phone companies) to give preferential
  treatment to users enrolled in the program when they need to add new lines or have
  their lines restored following a disruption of service, regardless of the cause.
  The FCC sets the rules and policies for the TSP program, and the Department of Homeland
  Security manages the TSP program. The TSP program is always in effect and not contingent
  on a major disaster or attack taking place. Federal sponsorship is required to enroll
  in the TSP program.
