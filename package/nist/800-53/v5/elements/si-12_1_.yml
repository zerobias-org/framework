id: b7fb8f91-2ccb-4757-ad1f-9ba13715665a
externalId: SI-12(1)
name: Information Management and Retention | Limit Personally Identifiable Information
  Elements
description: Limits personally identifiable information processed in the information
  life cycle to defined elements.
elementType: enhancement
parent: si-12
guidance: Limiting the use of personally identifiable information throughout the information
  life cycle when the information is not needed for operational purposes helps to
  reduce the level of privacy risk created by a system. The information life cycle
  includes information creation, collection, use, processing, storage, maintenance,
  dissemination, disclosure, and disposition. Risk assessments as well as applicable
  laws, regulations, and policies can provide useful inputs to determining which elements
  of personally identifiable information may create risk.
