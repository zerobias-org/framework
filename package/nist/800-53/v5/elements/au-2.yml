id: 388675e1-fe04-4854-adf2-a26f5fa358f6
externalId: AU-2
name: Event Logging
description: "a. Identify the types of events that the system is capable of
  logging in support of the audit function: [Assignment: organization-defined
  event types that the system is capable of logging];b. Coordinate the event
  logging function with other organizational entities requiring audit-related
  information to guide and inform the selection criteria for events to be
  logged;c. Specify the following event types for logging within the system:
  [Assignment: organization-defined event types (subset of the event types
  defined in AU-02a.) along with the frequency of (or situation requiring)
  logging for each identified event type];d. Provide a rationale for why the
  event types selected for logging are deemed to be adequate to support
  after-the-fact investigations of incidents; ande. Review and update the event
  types selected for logging [Assignment: organization-defined frequency]."
elementType: control
