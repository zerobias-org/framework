id: 24a345bc-c3ba-45a3-861d-e4fb77966e7f
externalId: AU-6(8)
name: Audit Record Review, Analysis, and Reporting | Full Text Analysis of Privileged
  Commands
description: Perform a full text analysis of logged privileged commands in a physically
  distinct component or subsystem of the system, or other system that is dedicated
  to that analysis.
elementType: enhancement
parent: au-6
guidance: Full text analysis of privileged commands requires a distinct environment
  for the analysis of audit record information related to privileged users without
  compromising such information on the system where the users have elevated privileges,
  including the capability to execute privileged commands. Full text analysis refers
  to analysis that considers the full text of privileged commands (i.e., commands
  and parameters) as opposed to analysis that considers only the name of the command.
  Full text analysis includes the use of pattern matching and heuristics.
aliases:
