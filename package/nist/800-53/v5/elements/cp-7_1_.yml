id: 6d5901d8-07ba-4d87-9f88-758cf906b3f0
externalId: CP-7(1)
name: Alternate Processing Site | Separation from Primary Site
description: Identify an alternate processing site that is sufficiently separated
  from the primary processing site to reduce susceptibility to the same threats.
elementType: enhancement
parent: cp-7
guidance: Threats that affect alternate processing sites are defined in organizational
  assessments of risk and include natural disasters, structural failures, hostile
  attacks, and errors of omission or commission. Organizations determine what is considered
  a sufficient degree of separation between primary and alternate processing sites
  based on the types of threats that are of concern. For threats such as hostile attacks,
  the degree of separation between sites is less relevant.
