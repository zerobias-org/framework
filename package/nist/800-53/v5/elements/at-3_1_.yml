externalId: AT-3(1)
name: Role-based Training | Environmental Controls
description: 'Provide [Assignment: organization-defined personnel or roles] with initial
  and [Assignment: organization-defined frequency] training in the employment and
  operation of environmental controls.'
elementType: enhancement
parent: at-3
guidance: Environmental controls include fire suppression and detection devices or
  systems, sprinkler systems, handheld fire extinguishers, fixed fire hoses, smoke
  detectors, temperature or humidity, heating, ventilation, air conditioning, and
  power within the facility.
