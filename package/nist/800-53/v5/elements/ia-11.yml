id: a0b5fcae-f9b5-401e-932b-6c6313ea791e
externalId: IA-11
name: Re-authentication
description: 'Require users to re-authenticate when [Assignment: organization-defined
  circumstances or situations requiring re-authentication].'
elementType: control
parent: ia
guidance: In addition to the re-authentication requirements associated with device
  locks, organizations may require re-authentication of individuals in certain situations,
  including when roles, authenticators or credentials change, when security categories
  of systems change, when the execution of privileged functions occurs, after a fixed
  time period, or periodically.
