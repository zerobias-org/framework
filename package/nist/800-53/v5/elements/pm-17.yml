id: c54ce4d6-cc9d-40e2-80eb-df8b785cf99f
externalId: PM-17
name: Protecting Controlled Unclassified Information on External Systems
description: Establishes and reviews policy and procedures to protect controlled unclassified
  information processed, stored, or transmitted on external systems.
elementType: control
parent: pm
guidance: Controlled unclassified information is defined by the National Archives
  and Records Administration along with the safeguarding and dissemination requirements
  for such information and is codified inand, specifically for systems external to
  the federal organization,. The policy prescribes the specific use and conditions
  to be implemented in accordance with organizational procedures, including via its
  contracting processes.
