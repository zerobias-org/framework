id: 1db90b61-fc1e-45ee-81df-d512e6081c72
externalId: IR-4(12)
name: Incident Handling | Malicious Code and Forensic Analysis
description: Analyze malicious code and/or other residual artifacts remaining in the
  system after the incident.
elementType: enhancement
parent: ir-4
guidance: When conducted carefully in an isolated environment, analysis of malicious
  code and other residual artifacts of a security incident or breach can give the
  organization insight into adversary tactics, techniques, and procedures. It can
  also indicate the identity or some defining characteristics of the adversary. In
  addition, malicious code analysis can help the organization develop responses to
  future incidents.
