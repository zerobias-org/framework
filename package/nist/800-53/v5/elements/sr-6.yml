id: 8f8aaf49-d3e3-41ef-9c25-b7eed9ed3746
externalId: SR-6
name: Supplier Assessments and Reviews
description: Assesses and reviews supply chain risks associated with suppliers, contractors,
  and what they provide, on a defined schedule.
elementType: control
parent: sr
guidance: An assessment and review of supplier risk includes security and supply chain
  risk management processes, foreign ownership, control or influence (FOCI), and the
  ability of the supplier to effectively assess subordinate second-tier and third-tier
  suppliers and contractors. The reviews may be conducted by the organization or by
  an independent third party. The reviews consider documented processes, documented
  controls, all-source intelligence, and publicly available information related to
  the supplier or contractor. Organizations can use open-source information to monitor
  for indications of stolen information, poor development and quality control practices,
  information spillage, or counterfeits. In some cases, it may be appropriate or required
  to share assessment and review results with other organizations in accordance with
  any applicable rules, policies, or inter-organizational agreements or contracts.
