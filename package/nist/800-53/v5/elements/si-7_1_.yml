id: 8b387dc5-3b83-43b3-a6ad-4a80981febca
externalId: SI-7(1)
name: Software, Firmware, and Information Integrity | Integrity Checks
description: Performs an integrity check of defined software, firmware, and information
  at startup, transitional states, or on a defined schedule.
elementType: enhancement
parent: si-7
guidance: Security-relevant events include the identification of new threats to which
  organizational systems are susceptible and the installation of new hardware, software,
  or firmware. Transitional states include system startup, restart, shutdown, and
  abort.
aliases:
