id: 29b670cc-5365-4817-9439-258c462a154b
externalId: IR-4(5)
name: Incident Handling | Automatic Disabling of System
description: 'Implement a configurable capability to automatically disable the system
  if [Assignment: organization-defined security violations] are detected.'
elementType: enhancement
parent: ir-4
guidance: Organizations consider whether the capability to automatically disable the
  system conflicts with continuity of operations requirements specified as part ofor.
  Security violations include cyber-attacks that have compromised the integrity of
  the system or exfiltrated organizational information and serious errors in software
  programs that could adversely impact organizational missions or functions or jeopardize
  the safety of individuals.
