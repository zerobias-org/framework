id: dd63bd1a-189d-4229-bc39-6ccd5da1de44
externalId: SC-23
name: Session Authenticity
description: Protect the authenticity of communications sessions.
elementType: control
parent: sc
guidance: Protecting session authenticity addresses communications protection at the
  session level, not at the packet level. Such protection establishes grounds for
  confidence at both ends of communications sessions in the ongoing identities of
  other parties and the validity of transmitted information. Authenticity protection
  includes protecting against man-in-the-middle attacks, session hijacking, and the
  insertion of false information into sessions.
aliases:
