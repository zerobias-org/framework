id: d9a443a9-cbd4-456e-b17c-687cb7127c48
externalId: SC-39(1)
name: Process Isolation | Hardware Separation
description: Implement hardware separation mechanisms to facilitate process isolation.
elementType: enhancement
parent: sc-39
guidance: Hardware-based separation of system processes is generally less susceptible
  to compromise than software-based separation, thus providing greater assurance that
  the separation will be enforced. Hardware separation mechanisms include hardware
  memory management.
