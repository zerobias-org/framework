id: 2f2ba192-378b-494e-836e-8629bd9dbae0
externalId: IR-7(1)
name: Incident Response Assistance | Automation Support for Availability of Information
  and Support
description: 'Increase the availability of incident response information and support
  using [Assignment: organization-defined automated mechanisms].'
elementType: enhancement
parent: ir-7
guidance: Automated mechanisms can provide a push or pull capability for users to
  obtain incident response assistance. For example, individuals may have access to
  a website to query the assistance capability, or the assistance capability can proactively
  send incident response information to users (general distribution or targeted) as
  part of increasing understanding of current response capabilities and support.
