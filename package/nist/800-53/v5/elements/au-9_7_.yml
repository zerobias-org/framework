id: bdd2ffdc-afbe-4616-bdf0-8682f82dac47
externalId: AU-9(7)
name: Protection of Audit Information | Store on Component with Different Operating
  System
description: Store audit information on a component running a different operating
  system than the system or component being audited.
elementType: enhancement
parent: au-9
guidance: Storing auditing information on a system component running a different operating
  system reduces the risk of a vulnerability specific to the system, resulting in
  a compromise of the audit records.
aliases:
