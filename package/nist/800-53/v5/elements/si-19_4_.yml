id: 3e5133a4-f46f-4775-a89d-c023213a005d
externalId: SI-19(4)
name: De-identification | Removal, Masking, Encryption, Hashing, or Replacement of
  Direct Identifiers
description: Remove, mask, encrypt, hash, or replace direct identifiers in a dataset.
elementType: enhancement
parent: si-19
guidance: There are many possible processes for removing direct identifiers from a
  dataset. Columns in a dataset that contain a direct identifier can be removed. In
  masking, the direct identifier is transformed into a repeating character, such as
  XXXXXX or 999999.  Identifiers can be encrypted or hashed so that the linked records
  remain linked. In the case of encryption or hashing, algorithms are employed that
  require the use of a key, including the Advanced Encryption Standard or a Hash-based
  Message Authentication Code. Implementations may use the same key for all identifiers
  or use a different key for each identifier. Using a different key for each identifier
  provides a higher degree of security and privacy. Identifiers can alternatively
  be replaced with a keyword, including transforming George Washington to PATIENT
  or replacing it with a surrogate value, such as transforming George Washington to
  Abraham Polk.
