id: 93980a16-1a3a-482f-974f-04bab2b065de
externalId: SR-5(2)
name: Acquisition Strategies, Tools, and Methods | Assessments Prior to Selection,
  Acceptance, Modification, or Update
description: Assess the system, system component, or system service prior to selection,
  acceptance, modification, or update.
elementType: enhancement
parent: sr-5
guidance: Organizational personnel or independent, external entities conduct assessments
  of systems, components, products, tools, and services to uncover evidence of tampering,
  unintentional and intentional vulnerabilities, or evidence of non-compliance with
  supply chain controls. These include malicious code, malicious processes, defective
  software, backdoors, and counterfeits. Assessments can include evaluations; design
  proposal reviews; visual or physical inspection; static and dynamic analyses; visual,
  x-ray, or magnetic particle inspections; simulations; white, gray, or black box
  testing; fuzz testing; stress testing; and penetration testing (see SR-6(1)). Evidence
  generated during assessments is documented for follow-on actions by organizations.
  The evidence generated during the organizational or independent assessments of supply
  chain elements may be used to improve supply chain processes and inform the supply
  chain risk management process. The evidence can be leveraged in follow-on assessments.
  Evidence and other documentation may be shared in accordance with organizational
  agreements.
