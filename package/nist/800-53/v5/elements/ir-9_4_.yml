name: Information Spillage Response | Exposure to Unauthorized Personnel
description: 'Employ the following controls for personnel exposed to information not
  within assigned access authorizations: [Assignment: organization-defined controls].'
elementType: enhancement
parent: ir-9
guidance: Controls include ensuring that personnel who are exposed to spilled information
  are made aware of the laws, executive orders, directives, regulations, policies,
  standards, and guidelines regarding the information and the restrictions imposed
  based on exposure to such information.
