id: dade87aa-eae6-4c59-a196-9e22740a8c32
externalId: AC-6(3)
name: Least Privilege | Network Access to Privileged Commands
description: Authorizes network access to privileged commands only for compelling
  operational needs and documents the rationale.
elementType: enhancement
parent: ac-6
guidance: Network access is any access across a network connection in lieu of local
  access (i.e., user being physically present at the device).
