id: 88805eef-2710-4b6d-ba06-fee285ac6eab
externalId: AC-16(8)
name: Security and Privacy Attributes | Association Techniques and Technologies
description: 'Implement [Assignment: organization-defined techniques and technologies]
  in associating security and privacy attributes to information.'
elementType: enhancement
parent: ac-16
guidance: The association of security and privacy attributes to information within
  systems is important for conducting automated access enforcement and flow enforcement
  actions. The association of such attributes to information (i.e., binding) can be
  accomplished with technologies and techniques that provide different levels of assurance.
  For example, systems can cryptographically bind attributes to information using
  digital signatures that support cryptographic keys protected by hardware devices
  (sometimes known as hardware roots of trust).
