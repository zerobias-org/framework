id: a18f73ce-6425-4f8b-a329-acf7d71cd332
externalId: PE-15
name: Water Damage Protection
description: Protect the system from damage resulting from water leakage by providing
  master shutoff or isolation valves that are accessible, working properly, and known
  to key personnel.
elementType: control
parent: pe
guidance: The provision of water damage protection primarily applies to organizational
  facilities that contain concentrations of system resources, including data centers,
  server rooms, and mainframe computer rooms. Isolation valves can be employed in
  addition to or in lieu of master shutoff valves to shut off water supplies in specific
  areas of concern without affecting entire organizations.
