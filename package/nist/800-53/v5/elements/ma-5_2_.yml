id: e1c96975-2647-496c-912f-feaf4f00677a
externalId: MA-5(2)
name: Maintenance Personnel | Security Clearances for Classified Systems
description: Verifies that personnel performing maintenance on classified systems
  hold security clearances and formal access approvals for the applicable classification
  level.
elementType: enhancement
parent: ma-5
guidance: Personnel who conduct maintenance on organizational systems may be exposed
  to classified information during the course of their maintenance activities. To
  mitigate the inherent risk of such exposure, organizations use maintenance personnel
  that are cleared (i.e., possess security clearances) to the classification level
  of the information stored on the system.
