id: e1c96975-2647-496c-912f-feaf4f00677a
externalId: MA-5(2)
name: Maintenance Personnel | Security Clearances for Classified Systems
description: Verify that personnel performing maintenance and diagnostic
  activities on a system processing, storing, or transmitting classified
  information possess security clearances and formal access approvals for at
  least the highest classification level and for compartments of information on
  the system.
elementType: control
