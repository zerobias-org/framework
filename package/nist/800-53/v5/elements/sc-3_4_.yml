id: 51d9af14-d920-4b31-8390-838d31fa826f
externalId: SC-3(4)
name: Security Function Isolation | Module Coupling and Cohesiveness
description: Implement security functions as largely independent modules that maximize
  internal cohesiveness within modules and minimize coupling between modules.
elementType: enhancement
parent: sc-3
guidance: The reduction of inter-module interactions helps to constrain security functions
  and manage complexity. The concepts of coupling and cohesion are important with
  respect to modularity in software design. Coupling refers to the dependencies that
  one module has on other modules. Cohesion refers to the relationship between functions
  within a module. Best practices in software engineering and systems security engineering
  rely on layering, minimization, and modular decomposition to reduce and manage complexity.
  This produces software modules that are highly cohesive and loosely coupled.
