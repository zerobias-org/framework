name: System Component Inventory | Assessed Configurations and Approved Deviations
description: Include assessed component configurations and any approved deviations
  to current deployed configurations in the system component inventory.
elementType: enhancement
parent: cm-8
guidance: Assessed configurations and approved deviations focus on configuration settings
  established by organizations for system components, the specific components that
  have been assessed to determine compliance with the required configuration settings,
  and any approved deviations from established configuration settings.
