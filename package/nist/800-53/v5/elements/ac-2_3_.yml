id: 759c91e8-5256-48cc-8c1a-7ed09a0bba1f
externalId: AC-2(3)
name: Account Management | Disable Accounts
description: Disables accounts within a defined period after they expire, lose their
  association with a user, violate policy, or go inactive.
elementType: enhancement
parent: ac-2
guidance: Disabling expired, inactive, or otherwise anomalous accounts supports the
  concepts of least privilege and least functionality which reduce the attack surface
  of the system.
aliases:
