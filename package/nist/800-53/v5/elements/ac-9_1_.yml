id: 9a2a2001-c000-4c04-a385-32e273feb89a
externalId: AC-9(1)
name: Previous Logon Notification | Unsuccessful Logons
description: Notify the user, upon successful logon, of the number of unsuccessful
  logon attempts since the last successful logon.
elementType: enhancement
parent: ac-9
guidance: Information about the number of unsuccessful logon attempts since the last
  successful logon allows the user to recognize if the number of unsuccessful logon
  attempts is consistent with the user’s actual logon attempts.
aliases:
