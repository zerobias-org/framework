id: 5784ec02-77ec-4f12-bcd7-e683c0330a71
externalId: SA-9(3)
name: External System Services | Establish and Maintain Trust Relationship with Providers
description: Establishes, documents, and maintains trust relationships with external
  service providers based on defined requirements, properties, or conditions.
elementType: enhancement
parent: sa-9
guidance: Trust relationships between organizations and external service providers
  reflect the degree of confidence that the risk from using external services is at
  an acceptable level. Trust relationships can help organizations gain increased levels
  of confidence that service providers are providing adequate protection for the services
  rendered and can also be useful when conducting incident response or when planning
  for upgrades or obsolescence. Trust relationships can be complicated due to the
  potentially large number of entities participating in the consumer-provider interactions,
  subordinate relationships and levels of trust, and types of interactions between
  the parties. In some cases, the degree of trust is based on the level of control
  that organizations can exert on external service providers regarding the controls
  necessary for the protection of the service, information, or individual privacy
  and the evidence brought forth as to the effectiveness of the implemented controls.
  The level of control is established by the terms and conditions of the contracts
  or service-level agreements.
