name: Use of External Systems | Portable Storage Devices — Restricted Use
description: 'Restrict the use of organization-controlled portable storage devices
  by authorized individuals on external systems using [Assignment: organization-defined
  restrictions].'
elementType: enhancement
parent: ac-20
guidance: Limits on the use of organization-controlled portable storage devices in
  external systems include restrictions on how the devices may be used and under what
  conditions the devices may be used.
