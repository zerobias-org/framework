id: d01a4782-982f-4be0-b7a5-a7256fa72a4f
externalId: SC-7(24)
name: Boundary Protection | Personally Identifiable Information
description: "For systems that process personally identifiable information:a.
  Apply the following processing rules to data elements of personally
  identifiable information: [Assignment: organization-defined processing
  rules];b. Monitor for permitted processing at the external interfaces to the
  system and at key internal boundaries within the system;c. Document each
  processing exception; andd. Review and remove exceptions that are no longer
  supported."
elementType: control
