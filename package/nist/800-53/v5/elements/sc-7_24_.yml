id: fa7d3ad6-5b0e-4ed7-809b-328193856aac
externalId: SC-7(24)
name: Boundary Protection | Personally Identifiable Information
description: Applies defined processing rules to personally identifiable information,
  monitors for permitted processing at boundaries, and documents and reviews exceptions.
elementType: enhancement
parent: sc-7
guidance: Managing the processing of personally identifiable information is an important
  aspect of protecting an individual’s privacy. Applying, monitoring for, and documenting
  exceptions to processing rules ensure that personally identifiable information is
  processed only in accordance with established privacy requirements.
