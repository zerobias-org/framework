id: 31ca5100-838a-4dd4-be8f-cbb146ae467c
externalId: PE-2(2)
name: Physical Access Authorizations | Two Forms of Identification
description: Requires two forms of identification from defined acceptable forms for
  visitor access to the facility.
elementType: enhancement
parent: pe-2
guidance: Acceptable forms of identification include passports, REAL ID-compliant
  drivers’ licenses, and Personal Identity Verification (PIV) cards. For gaining access
  to facilities using automated mechanisms, organizations may use PIV cards, key cards,
  PINs, and biometrics.
