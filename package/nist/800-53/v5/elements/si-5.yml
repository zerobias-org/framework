id: f597b562-eb4c-4498-bf93-b3aebc20cc89
externalId: SI-5
name: Security Alerts, Advisories, and Directives
description: "a. Receive system security alerts, advisories, and directives from
  [Assignment: organization-defined external organizations] on an ongoing
  basis;b. Generate internal security alerts, advisories, and directives as
  deemed necessary;c. Disseminate security alerts, advisories, and directives
  to: [Selection (one or more): [Assignment: organization-defined personnel or
  roles]; [Assignment: organization-defined elements within the organization];
  [Assignment: organization-defined external organizations]]; andd. Implement
  security directives in accordance with established time frames, or notify the
  issuing organization of the degree of noncompliance."
elementType: control
