externalId: AU-5(1)
name: Response to Audit Logging Process Failures | Storage Capacity Warning
description: Provides a warning to designated personnel when allocated audit log storage
  reaches a defined percentage of capacity.
elementType: enhancement
parent: au-5
guidance: Organizations may have multiple audit log storage repositories distributed
  across multiple system components with each repository having different storage
  volume capacities.
