id: ece478ba-a555-4f92-9459-07b3a5f35343
externalId: SC-42(5)
name: Sensor Capability and Data | Collection Minimization
description: 'Employ [Assignment: organization-defined sensors] that are configured
  to minimize the collection of information about individuals that is not needed.'
elementType: enhancement
parent: sc-42
guidance: Although policies to control for authorized use can be applied to information
  once it is collected, minimizing the collection of information that is not needed
  mitigates privacy risk at the system entry point and mitigates the risk of policy
  control failures. Sensor configurations include the obscuring of human features,
  such as blurring or pixelating flesh tones.
