id: 15cfc6b1-7bae-49c7-835b-3af227f2bd9a
externalId: PL-4(1)
name: Rules of Behavior | Social Media and External Site/application Usage Restrictions
description: Restricts use of social media and external sites, posting organizational
  information publicly, and using organizational credentials to create external accounts.
elementType: enhancement
parent: pl-4
guidance: Social media, social networking, and external site/application usage restrictions
  address rules of behavior related to the use of social media, social networking,
  and external sites when organizational personnel are using such sites for official
  duties or in the conduct of official business, when organizational information is
  involved in social media and social networking transactions, and when personnel
  access social media and networking sites from organizational systems. Organizations
  also address specific rules that prevent unauthorized entities from obtaining non-public
  organizational information from social media and networking sites either directly
  or through inference. Non-public information includes personally identifiable information
  and system account information.
