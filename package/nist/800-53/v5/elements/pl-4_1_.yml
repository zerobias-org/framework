id: a306e710-046a-43a3-847d-acd6582883e9
externalId: PL-4(1)
name: Rules of Behavior | Social Media and External Site/application Usage
  Restrictions
description: Include in the rules of behavior, restrictions on:a. Use of social
  media, social networking sites, and external sites/applications;b. Posting
  organizational information on public websites; andc. Use of
  organization-provided identifiers (e.g., email addresses) and authentication
  secrets (e.g., passwords) for creating accounts on external
  sites/applications.
elementType: control
