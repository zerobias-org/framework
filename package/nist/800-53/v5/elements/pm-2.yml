id: aaff6991-c04d-4787-b1cb-cf33f77f51f7
externalId: PM-2
name: Information Security Program Leadership Role
description: Appoint a senior agency information security officer with the mission
  and resources to coordinate, develop, implement, and maintain an organization-wide
  information security program.
elementType: control
parent: pm
guidance: The senior agency information security officer is an organizational official.
  For federal agencies (as defined by applicable laws, executive orders, regulations,
  directives, policies, and standards), this official is the senior agency information
  security officer. Organizations may also refer to this official as the senior information
  security officer or chief information security officer.
