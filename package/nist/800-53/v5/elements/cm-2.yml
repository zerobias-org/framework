id: eb231e28-25e1-406e-b609-c04522588842
externalId: CM-2
name: Baseline Configuration
description: Develops, documents, and maintains a current baseline configuration of
  the system under configuration control, reviewed and updated periodically.
elementType: control
parent: cm
guidance: Baseline configurations for systems and system components include connectivity,
  operational, and communications aspects of systems. Baseline configurations are
  documented, formally reviewed, and agreed-upon specifications for systems or configuration
  items within those systems. Baseline configurations serve as a basis for future
  builds, releases, or changes to systems and include security and privacy control
  implementations, operational procedures, information about system components, network
  topology, and logical placement of components in the system architecture. Maintaining
  baseline configurations requires creating new baselines as organizational systems
  change over time. Baseline configurations of systems reflect the current enterprise
  architecture.
