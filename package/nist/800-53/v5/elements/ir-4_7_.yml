id: 90b197c0-516e-4b46-a508-c053dd0388ed
externalId: IR-4(7)
name: Incident Handling | Insider Threats — Intra-organization Coordination
description: 'Coordinate an incident handling capability for insider threats that
  includes the following organizational entities [Assignment: organization-defined
  entities].'
elementType: enhancement
parent: ir-4
guidance: Incident handling for insider threat incidents (e.g., preparation, detection
  and analysis, containment, eradication, and recovery) requires coordination among
  many organizational entities, including mission or business owners, system owners,
  human resources offices, procurement offices, personnel offices, physical security
  offices, senior agency information security officer, operations personnel, risk
  executive (function), senior agency official for privacy, and legal counsel. In
  addition, organizations may require external support from federal, state, and local
  law enforcement agencies.
