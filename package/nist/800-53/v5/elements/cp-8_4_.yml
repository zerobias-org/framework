id: 88feb4cc-0ceb-4e08-9f90-b5fffbca276a
externalId: CP-8(4)
name: Telecommunications Services | Provider Contingency Plan
description: Requires telecommunications providers to have contingency plans, reviews
  those plans, and obtains evidence of their contingency testing and training.
elementType: enhancement
parent: cp-8
guidance: Reviews of provider contingency plans consider the proprietary nature of
  such plans. In some situations, a summary of provider contingency plans may be sufficient
  evidence for organizations to satisfy the review requirement. Telecommunications
  service providers may also participate in ongoing disaster recovery exercises in
  coordination with the Department of Homeland Security and state and local governments.
  Organizations may use these types of activities to satisfy evidentiary requirements
  related to service provider contingency plan reviews, testing, and training.
aliases:
