id: 99098dfb-d066-4b8f-a3c0-bb12db79fc67
externalId: IA-4(1)
name: Identifier Management | Prohibit Account Identifiers as Public Identifiers
description: Prohibit the use of system account identifiers that are the same as public
  identifiers for individual accounts.
elementType: enhancement
parent: ia-4
guidance: Prohibiting account identifiers as public identifiers applies to any publicly
  disclosed account identifier used for communication such as, electronic mail and
  instant messaging. Prohibiting the use of systems account identifiers that are the
  same as some public identifier, such as the individual identifier section of an
  electronic mail address, makes it more difficult for adversaries to guess user identifiers.
  Prohibiting account identifiers as public identifiers without the implementation
  of other supporting controls only complicates guessing of identifiers. Additional
  protections are required for authenticators and credentials to protect the account.
aliases:
