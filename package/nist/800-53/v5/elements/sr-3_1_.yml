id: 517f6c7a-b1ff-47ac-9fc2-36d48c596138
externalId: SR-3(1)
name: Supply Chain Controls and Processes | Diverse Supply Base
description: 'Employ a diverse set of sources for the following system components
  and services:  [Assignment: organization-defined system components and services].'
elementType: enhancement
parent: sr-3
guidance: Diversifying the supply of systems, system components, and services can
  reduce the probability that adversaries will successfully identify and target the
  supply chain and can reduce the impact of a supply chain event or compromise. Identifying
  multiple suppliers for replacement components can reduce the probability that the
  replacement component will become unavailable. Employing a diverse set of developers
  or logistics service providers can reduce the impact of a natural disaster or other
  supply chain event. Organizations consider designing the system to include diverse
  materials and components.
