id: 536f8376-2374-4b70-996c-a288695af9d0
externalId: SC-42
name: Sensor Capability and Data
description: Prohibits environmental sensing devices or remote activation of sensing
  capabilities, with defined exceptions, and indicates sensor use to defined users.
elementType: control
parent: sc
guidance: Sensor capability and data applies to types of systems or system components
  characterized as mobile devices, such as cellular telephones, smart phones, and
  tablets. Mobile devices often include sensors that can collect and record data regarding
  the environment where the system is in use. Sensors that are embedded within mobile
  devices include microphones, cameras, Global Positioning System (GPS) mechanisms,
  and accelerometers. While the sensors on mobiles devices provide an important function,
  if activated covertly, such devices can potentially provide a means for adversaries
  to learn valuable information about individuals and organizations. For example,
  remotely activating the GPS function on a mobile device could provide an adversary
  with the ability to track the movements of an individual. Organizations may prohibit
  individuals from bringing cellular telephones or digital cameras into certain designated
  facilities or controlled areas within facilities where classified information is
  stored or sensitive conversations are taking place.
