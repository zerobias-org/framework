name: Configuration Change Control | Review System Changes
description: 'Review changes to the system [Assignment: organization-defined frequency]
  or when [Assignment: organization-defined circumstances] to determine whether unauthorized
  changes have occurred.'
elementType: enhancement
parent: cm-3
guidance: Indications that warrant a review of changes to the system and the specific
  circumstances justifying such reviews may be obtained from activities carried out
  by organizations during the configuration change process or continuous monitoring
  process.
