id: 74925af1-2dfc-447c-af7f-9b53c2b0b69a
externalId: CM-8(8)
name: System Component Inventory | Automated Location Tracking
description: 'Support the tracking of system components by geographic location using
  [Assignment: organization-defined automated mechanisms].'
elementType: enhancement
parent: cm-8
guidance: The use of automated mechanisms to track the location of system components
  can increase the accuracy of component inventories. Such capability may help organizations
  rapidly identify the location and responsible individuals of system components that
  have been compromised, breached, or are otherwise in need of mitigation actions.
  The use of tracking mechanisms can be coordinated with senior agency officials for
  privacy if there are implications that affect individual privacy.
