id: fd3a4384-45c4-4c58-97bb-c183d2d3a43f
externalId: AU-7
name: Audit Record Reduction and Report Generation
description: Provides audit record reduction and report generation supporting review
  and investigation, without altering the original records.
elementType: control
parent: au
guidance: Audit record reduction is a process that manipulates collected audit log
  information and organizes it into a summary format that is more meaningful to analysts.
  Audit record reduction and report generation capabilities do not always emanate
  from the same system or from the same organizational entities that conduct audit
  logging activities. The audit record reduction capability includes modern data mining
  techniques with advanced data filters to identify anomalous behavior in audit records.
  The report generation capability provided by the system can generate customizable
  reports. Time ordering of audit records can be an issue if the granularity of the
  timestamp in the record is insufficient.
