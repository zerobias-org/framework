id: d9b1720e-0f6d-4f67-814d-5a899e66a4f9
externalId: CM-5(4)
name: Access Restrictions for Change | Dual Authorization
description: 'Enforce dual authorization for implementing changes to [Assignment:
  organization-defined system components and system-level information].'
elementType: enhancement
parent: cm-5
guidance: Organizations employ dual authorization to help ensure that any changes
  to selected system components and information cannot occur unless two qualified
  individuals approve and implement such changes. The two individuals possess the
  skills and expertise to determine if the proposed changes are correct implementations
  of approved changes. The individuals are also accountable for the changes. Dual
  authorization may also be known as two-person control. To reduce the risk of collusion,
  organizations consider rotating dual authorization duties to other individuals.
  System-level information includes operational procedures.
