id: ff33b3dc-986a-44d0-a09d-aa690f1cb549
externalId: PM-31
name: Continuous Monitoring Strategy
description: Develops an organization-wide continuous monitoring strategy that establishes
  metrics, conducts ongoing assessments, and reports security and privacy status.
elementType: control
parent: pm
guidance: Continuous monitoring at the organization level facilitates ongoing awareness
  of the security and privacy posture across the organization to support organizational
  risk management decisions. The termsandimply that organizations assess and monitor
  their controls and risks at a frequency sufficient to support risk-based decisions.
  Different types of controls may require different monitoring frequencies. The results
  of continuous monitoring guide and inform risk response actions by organizations.
  Continuous monitoring programs allow organizations to maintain the authorizations
  of systems and common controls in highly dynamic environments of operation with
  changing mission and business needs, threats, vulnerabilities, and technologies.
  Having access to security- and privacy-related information on a continuing basis
  through reports and dashboards gives organizational officials the capability to
  make effective, timely, and informed risk management decisions, including ongoing
  authorization decisions. To further facilitate security and privacy risk management,
  organizations consider aligning organization-defined monitoring metrics with organizational
  risk tolerance as defined in the risk management strategy. Monitoring requirements,
  including the need for monitoring, may be referenced in other controls and control
