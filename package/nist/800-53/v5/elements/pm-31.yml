name: Continuous Monitoring Strategy
description: "Develop an organization-wide continuous monitoring strategy and
  implement continuous monitoring programs that include:a. Establishing the
  following organization-wide metrics to be monitored: [Assignment:
  organization-defined metrics];b. Establishing [Assignment:
  organization-defined monitoring frequencies] and [Assignment:
  organization-defined assessment frequencies] for control effectiveness; c.
  Ongoing monitoring of organizationally-defined metrics in accordance with the
  continuous monitoring strategy;d. Correlation and analysis of information
  generated by control assessments and monitoring;e. Response actions to address
  results of the analysis of control assessment and monitoring information;
  andf. Reporting the security and privacy status of organizational systems to
  [Assignment: organization-defined personnel or roles] [Assignment:
  organization-defined frequency]."
elementType: control
