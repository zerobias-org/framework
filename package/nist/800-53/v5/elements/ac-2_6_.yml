id: cee89e1b-bee6-49dd-a27d-e8ff276b2afe
externalId: AC-2(6)
name: Account Management | Dynamic Privilege Management
description: 'Implement [Assignment: organization-defined dynamic privilege management
  capabilities].'
elementType: enhancement
parent: ac-2
guidance: In contrast to access control approaches that employ static accounts and
  predefined user privileges, dynamic access control approaches rely on runtime access
  control decisions facilitated by dynamic privilege management, such as attribute-based
  access control. While user identities remain relatively constant over time, user
  privileges typically change more frequently based on ongoing mission or business
  requirements and the operational needs of organizations. An example of dynamic privilege
  management is the immediate revocation of privileges from users as opposed to requiring
  that users terminate and restart their sessions to reflect changes in privileges.
  Dynamic privilege management can also include mechanisms that change user privileges
  based on dynamic rules as opposed to editing specific user profiles. Examples include
  automatic adjustments of user privileges if they are operating out of their normal
  work times, if their job function or assignment changes, or if systems are under
  duress or in emergency situations. Dynamic privilege management includes the effects
  of privilege changes, for example, when there are changes to encryption keys used
  for communications.
