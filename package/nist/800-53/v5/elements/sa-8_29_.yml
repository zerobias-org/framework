id: 13a82272-c01d-47ff-a4be-e1ca62dad8d7
externalId: SA-8(29)
name: Security and Privacy Engineering Principles | Repeatable and Documented Procedures
description: 'Implement the security design principle of repeatable and documented
  procedures in [Assignment: organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of repeatable and documented procedures states that the techniques
  and methods employed to construct a system component permit the same component to
  be completely and correctly reconstructed at a later time. Repeatable and documented
  procedures support the development of a component that is identical to the component
  created earlier, which may be in widespread use. In the case of other system artifacts
  (e.g., documentation and testing results), repeatability supports consistency and
  the ability to inspect the artifacts. Repeatable and documented procedures can be
  introduced at various stages within the system development life cycle and contribute
  to the ability to evaluate assurance claims for the system. Examples include systematic
  procedures for code development and review, procedures for the configuration management
  of development tools and system artifacts, and procedures for system delivery.
