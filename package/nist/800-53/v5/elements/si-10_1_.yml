id: 294a0982-510a-46d5-8633-0ead53ab13bd
externalId: SI-10(1)
name: Information Input Validation | Manual Override Capability
description: Provides a manual override for input validation, restricted to authorized
  individuals, with the override's use audited.
elementType: enhancement
parent: si-10
guidance: In certain situations, such as during events that are defined in contingency
  plans, a manual override capability for input validation may be needed. Manual overrides
  are used only in limited circumstances and with the inputs defined by the organization.
aliases:
