id: 4b376b62-9531-4775-9256-15b901bcd712
externalId: IA-2(6)
name: Identification and Authentication (organizational Users) | Access to Accounts
  —separate Device
description: Implements multi-factor authentication for account access where one factor
  is provided by a separate device meeting defined strength requirements.
elementType: enhancement
parent: ia-2
guidance: The purpose of requiring a device that is separate from the system to which
  the user is attempting to gain access for one of the factors during multi-factor
  authentication is to reduce the likelihood of compromising authenticators or credentials
  stored on the system. Adversaries may be able to compromise such authenticators
  or credentials and subsequently impersonate authorized users. Implementing one of
  the factors on a separate device (e.g., a hardware token), provides a greater strength
  of mechanism and an increased level of assurance in the authentication process.
aliases:
