id: ad591e16-629c-492f-ba00-26ed0969ed27
externalId: SA-3(2)
name: System Development Life Cycle | Use of Live or Operational Data
description: a. Approve, document, and control the use of live data in
  preproduction environments for the system, system component, or system
  service; andb. Protect preproduction environments for the system, system
  component, or system service at the same impact or classification level as any
  live data in use within the preproduction environments.
elementType: control
