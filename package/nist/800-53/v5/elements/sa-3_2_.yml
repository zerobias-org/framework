id: ad591e16-629c-492f-ba00-26ed0969ed27
externalId: SA-3(2)
name: System Development Life Cycle | Use of Live or Operational Data
description: Approves, documents, and controls the use of live data in preproduction
  environments, protecting those environments at the same level as the live data.
elementType: enhancement
parent: sa-3
guidance: Live data is also referred to as operational data. The use of live or operational
  data in preproduction (i.e., development, test, and integration) environments can
  result in significant risks to organizations. In addition, the use of personally
  identifiable information in testing, research, and training increases the risk of
  unauthorized disclosure or misuse of such information. Therefore, it is important
  for the organization to manage any additional risks that may result from the use
  of live or operational data. Organizations can minimize such risks by using test
  or dummy data during the design, development, and testing of systems, system components,
  and system services. Risk assessment techniques may be used to determine if the
  risk of using live or operational data is acceptable.
