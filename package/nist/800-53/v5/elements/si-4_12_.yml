id: 45dde7dd-5a0b-43a3-9f59-6e8374bca16b
externalId: SI-4(12)
name: System Monitoring | Automated Organization-generated Alerts
description: Alerts designated personnel using automated mechanisms when defined indications
  of inappropriate or unusual security- or privacy-related activity occur.
elementType: enhancement
parent: si-4
guidance: Organizational personnel on the system alert notification list include system
  administrators, mission or business owners, system owners, senior agency information
  security officer, senior agency official for privacy, system security officers,
  or privacy officers. Automated organization-generated alerts are the security alerts
  generated by organizations and transmitted using automated means. The sources for
  organization-generated alerts are focused on other entities such as suspicious activity
  reports and reports on potential insider threats. In contrast to alerts generated
  by the organization, alerts generated by the system in SI-4(5) focus on information
  sources that are internal to the systems, such as audit records.
aliases:
