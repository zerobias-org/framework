id: 80c2f3ec-1fde-431b-a28f-f228467df496
externalId: SC-7(3)
name: Boundary Protection | Access Points
description: Limit the number of external network connections to the system.
elementType: enhancement
parent: sc-7
guidance: Limiting the number of external network connections facilitates monitoring
  of inbound and outbound communications traffic. The Trusted Internet Connection
  DHS TIC initiative is an example of a federal guideline that requires limits on
  the number of external network connections. Limiting the number of external network
  connections to the system is  important during transition periods from older to
  newer technologies (e.g., transitioning from IPv4 to IPv6 network protocols). Such
  transitions may require implementing the older and newer technologies simultaneously
  during the transition period and thus increase the number of access points to the
  system.
