externalId: IR-2(1)
name: Incident Response Training | Simulated Events
description: Incorporate simulated events into incident response training to facilitate
  the required response by personnel in crisis situations.
elementType: enhancement
parent: ir-2
guidance: Organizations establish requirements for responding to incidents in incident
  response plans. Incorporating simulated events into incident response training helps
  to ensure that personnel understand their individual responsibilities and what specific
  actions to take in crisis situations.
