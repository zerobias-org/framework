id: d04e3953-2c19-4803-a7b4-af5199fd31e4
externalId: MA-5(3)
name: Maintenance Personnel | Citizenship Requirements for Classified Systems
description: Verify that personnel performing maintenance and diagnostic activities
  on a system processing, storing, or transmitting classified information are U.S.
  citizens.
elementType: enhancement
parent: ma-5
guidance: Personnel who conduct maintenance on organizational systems may be exposed
  to classified information during the course of their maintenance activities. If
  access to classified information on organizational systems is restricted to U.S.
  citizens, the same restriction is applied to personnel performing maintenance on
  those systems.
