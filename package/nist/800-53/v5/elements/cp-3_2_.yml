id: f67c1019-233c-4764-89b7-aa14df5ded89
externalId: CP-3(2)
name: Contingency Training | Mechanisms Used in Training Environments
description: Employ mechanisms used in operations to provide a more thorough and realistic
  contingency training environment.
elementType: enhancement
parent: cp-3
guidance: Operational mechanisms refer to processes that have been established to
  accomplish an organizational goal or a system that supports a particular organizational
  mission or business objective. Actual mission and business processes, systems, and/or
  facilities may be used to generate simulated events and enhance the realism of simulated
  events during contingency training.
