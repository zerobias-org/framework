id: 0d1fe34d-892c-40b9-ac50-d62e7bb05eb3
externalId: SA-4(3)
name: Acquisition Process | Development Methods, Techniques, and Practices
description: Requires the developer to demonstrate use of defined systems engineering,
  security and privacy engineering, and development and testing methods.
elementType: enhancement
parent: sa-4
guidance: Following a system development life cycle that includes state-of-the-practice
  software development methods, systems engineering methods, systems security and
  privacy engineering methods, and quality control processes helps to reduce the number
  and severity of latent errors within systems, system components, and system services.
  Reducing the number and severity of such errors reduces the number of vulnerabilities
  in those systems, components, and services. Transparency in the methods and techniques
  that developers select and implement for systems engineering, systems security and
  privacy engineering, software development, component and system assessments, and
  quality control processes provides an increased level of assurance in the trustworthiness
  of the system, system component, or system service being acquired.
aliases:
