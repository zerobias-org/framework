externalId: PS-3(2)
name: Personnel Screening | Formal Indoctrination
description: Verify that individuals accessing a system processing, storing, or
  transmitting types of classified information that require formal
  indoctrination, are formally indoctrinated for all the relevant types of
  information to which they have access on the system.
elementType: control
