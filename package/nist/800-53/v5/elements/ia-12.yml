id: ef0efe99-adc8-4ec6-a6dd-b85cc9bebc89
externalId: IA-12
name: Identity Proofing
description: Identity-proofs users requiring system access accounts, resolves identities
  to a unique individual, and collects and verifies identity evidence.
elementType: control
parent: ia
guidance: Identity proofing is the process of collecting, validating, and verifying
  a user’s identity information for the purposes of establishing credentials for accessing
  a system. Identity proofing is intended to mitigate threats to the registration
  of users and the establishment of their accounts. Standards and guidelines specifying
  identity assurance levels for identity proofing includeand. Organizations may be
  subject to laws, executive orders, directives, regulations, or policies that address
  the collection of identity evidence. Organizational personnel consult with the senior
  agency official for privacy and legal counsel regarding such requirements.
