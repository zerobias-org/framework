name: Information Management and Retention | Information Disposal
description: 'Use the following techniques to dispose of, destroy, or erase information
  following the retention period: [Assignment: organization-defined techniques].'
elementType: enhancement
parent: si-12
guidance: Organizations can minimize both security and privacy risks by disposing
  of information when it is no longer needed. The disposal or destruction of information
  applies to originals as well as copies and archived records, including system logs
  that may contain personally identifiable information.
