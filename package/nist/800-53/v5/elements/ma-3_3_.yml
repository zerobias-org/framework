id: d2a8759a-3f5d-4247-b724-040708d887cb
externalId: MA-3(3)
name: Maintenance Tools | Prevent Unauthorized Removal
description: Prevents removal of maintenance equipment containing organizational information
  by verifying, sanitizing, retaining it, or obtaining an explicit exemption.
elementType: enhancement
parent: ma-3
guidance: Organizational information includes all information owned by organizations
  and any information provided to organizations for which the organizations serve
  as information stewards.
