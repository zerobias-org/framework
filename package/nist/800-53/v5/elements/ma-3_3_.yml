id: 5ac683fe-f187-4e37-ad3d-486bd0324efc
externalId: MA-3(3)
name: Maintenance Tools | Prevent Unauthorized Removal
description: "Prevent the removal of maintenance equipment containing
  organizational information by:a. Verifying that there is no organizational
  information contained on the equipment;b. Sanitizing or destroying the
  equipment;c. Retaining the equipment within the facility; ord. Obtaining an
  exemption from [Assignment: organization-defined personnel or roles]
  explicitly authorizing removal of the equipment from the facility."
elementType: control
