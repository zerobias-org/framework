id: 7b90c566-24c8-4a27-ba28-1c2b0ea24316
externalId: SC-16(1)
name: Transmission of Security and Privacy Attributes | Integrity Verification
description: Verify the integrity of transmitted security and privacy attributes.
elementType: enhancement
parent: sc-16
guidance: Part of verifying the integrity of transmitted information is ensuring that
  security and privacy attributes that are associated with such information have not
  been modified in an unauthorized manner. Unauthorized modification of security or
  privacy attributes can result in a loss of integrity for transmitted information.
