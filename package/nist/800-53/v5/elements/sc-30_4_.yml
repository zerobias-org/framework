id: 485e2809-ba22-4afa-9d43-849c9a8f59d1
externalId: SC-30(4)
name: Concealment and Misdirection | Misleading Information
description: 'Employ realistic, but misleading information in [Assignment: organization-defined
  system components] about its security state or posture.'
elementType: enhancement
parent: sc-30
guidance: Employing misleading information is intended to confuse potential adversaries
  regarding the nature and extent of controls deployed by organizations. Thus, adversaries
  may employ incorrect and ineffective attack techniques. One technique for misleading
  adversaries is for organizations to place misleading information regarding the specific
  controls deployed in external systems that are known to be targeted by adversaries.
  Another technique is the use of deception nets that mimic actual aspects of organizational
  systems but use, for example, out-of-date software configurations.
