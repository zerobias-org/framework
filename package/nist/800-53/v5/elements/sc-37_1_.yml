id: 92e121ee-3aed-4065-93ef-57b0b46213a7
externalId: SC-37(1)
name: Out-of-band Channels | Ensure Delivery and Transmission
description: Employs defined controls to ensure only defined individuals or systems
  receive defined information, system components, or devices.
elementType: enhancement
parent: sc-37
guidance: Techniques employed by organizations to ensure that only designated systems
  or individuals receive certain information, system components, or devices include
  sending authenticators via an approved courier service but requiring recipients
  to show some form of government-issued photographic identification as a condition
  of receipt.
