externalId: PE-3(3)
name: Physical Access Control | Continuous Guards
description: 'Employ guards to control [Assignment: organization-defined physical
  access points] to the facility where the system resides 24 hours per day, 7 days
  per week.'
elementType: enhancement
parent: pe-3
guidance: Employing guards at selected physical access points to the facility provides
  a more rapid response capability for organizations. Guards also provide the opportunity
  for human surveillance in areas of the facility not covered by video surveillance.
