externalId: PS-4
name: Personnel Termination
description: "Upon termination of individual employment:a. Disable system access
  within [Assignment: organization-defined time period];b. Terminate or revoke
  any authenticators and credentials associated with the individual;c. Conduct
  exit interviews that include a discussion of [Assignment: organization-defined
  information security topics];d. Retrieve all security-related organizational
  system-related property; ande. Retain access to organizational information and
  systems formerly controlled by terminated individual."
elementType: control
