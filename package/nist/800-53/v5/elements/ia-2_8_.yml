id: f6bb6066-c3db-4ae9-a095-f0654e26a8f5
externalId: IA-2(8)
name: Identification and Authentication (organizational Users) | Access to Accounts
  — Replay Resistant
description: 'Implement replay-resistant authentication mechanisms for access to [Selection
  (one or more): privileged accounts; non-privileged accounts].'
elementType: enhancement
parent: ia-2
guidance: Authentication processes resist replay attacks if it is impractical to achieve
  successful authentications by replaying previous authentication messages. Replay-resistant
  techniques include protocols that use nonces or challenges such as time synchronous
  or cryptographic authenticators.
