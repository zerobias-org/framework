id: 9d77131b-cc80-4c55-8111-69f76ff3cced
externalId: SA-15
name: Development Process, Standards, and Tools
description: "a. Require the developer of the system, system component, or
  system service to follow a documented development process that:1. Explicitly
  addresses security and privacy requirements;2. Identifies the standards and
  tools used in the development process;3. Documents the specific tool options
  and tool configurations used in the development process; and4. Documents,
  manages, and ensures the integrity of changes to the process and/or tools used
  in development; andb. Review the development process, standards, tools, tool
  options, and tool configurations [Assignment: organization-defined frequency]
  to determine if the process, standards, tools, tool options and tool
  configurations selected and employed can satisfy the following security and
  privacy requirements: [Assignment: organization-defined security and privacy
  requirements]."
elementType: control
