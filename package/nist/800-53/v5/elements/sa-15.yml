id: 2e3479d4-7dcc-4341-a43a-e7cb200da681
externalId: SA-15
name: Development Process, Standards, and Tools
description: Requires the developer to follow a documented development process addressing
  security and privacy, and reviews that process, standards, and tools periodically.
elementType: control
parent: sa
guidance: Development tools include programming languages and computer-aided design
  systems. Reviews of development processes include the use of maturity models to
  determine the potential effectiveness of such processes. Maintaining the integrity
  of changes to tools and processes facilitates effective supply chain risk assessment
  and mitigation. Such integrity requires configuration control throughout the system
  development life cycle to track authorized changes and prevent unauthorized changes.
