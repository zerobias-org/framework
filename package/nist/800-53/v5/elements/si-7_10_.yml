id: 34d382d1-c69a-42e3-ad19-2fa87ac20162
externalId: SI-7(10)
name: Software, Firmware, and Information Integrity | Protection of Boot Firmware
description: 'Implement the following mechanisms to protect the integrity of boot
  firmware in [Assignment: organization-defined system components]: [Assignment: organization-defined
  mechanisms].'
elementType: enhancement
parent: si-7
guidance: Unauthorized modifications to boot firmware may indicate a sophisticated,
  targeted attack. These types of targeted attacks can result in a permanent denial
  of service or a persistent malicious code presence. These situations can occur if
  the firmware is corrupted or if the malicious code is embedded within the firmware.
  System components can protect the integrity of boot firmware in organizational systems
  by verifying the integrity and authenticity of all updates to the firmware prior
  to applying changes to the system component and preventing unauthorized processes
  from modifying the boot firmware.
