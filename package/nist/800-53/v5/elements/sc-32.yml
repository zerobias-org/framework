id: b2920df7-ca8d-48ec-a163-612f62517cad
externalId: SC-32
name: System Partitioning
description: Partitions the system into defined components residing in separate physical
  or logical domains based on defined circumstances.
elementType: control
parent: sc
guidance: System partitioning is part of a defense-in-depth protection strategy. Organizations
  determine the degree of physical separation of system components. Physical separation
  options include physically distinct components in separate racks in the same room,
  critical components in separate rooms, and geographical separation of critical components.
  Security categorization can guide the selection of candidates for domain partitioning.
  Managed interfaces restrict or prohibit network access and information flow among
  partitioned system components.
