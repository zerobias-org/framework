id: 35b741af-5941-45b4-b78d-c005ff66baed
externalId: SA-4
name: Acquisition Process
description: "Include the following requirements, descriptions, and criteria,
  explicitly or by reference, using [Selection (one or more): standardized
  contract language; [Assignment: organization-defined contract language]] in
  the acquisition contract for the system, system component, or system
  service:a. Security and privacy functional requirements;b. Strength of
  mechanism requirements;c. Security and privacy assurance requirements;d.
  Controls needed to satisfy the security and privacy requirements.e. Security
  and privacy documentation requirements;f. Requirements for protecting security
  and privacy documentation;g. Description of the system development environment
  and environment in which the system is intended to operate;h. Allocation of
  responsibility or identification of parties responsible for information
  security, privacy, and supply chain risk management; andi. Acceptance
  criteria."
elementType: control
