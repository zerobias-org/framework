id: aae3b7ef-bf0d-4a45-9356-6aae9ae36cc8
externalId: PT-7(2)
name: Specific Categories of Personally Identifiable Information | First
  Amendment Information
description: Prohibit the processing of information describing how any
  individual exercises rights guaranteed by the First Amendment unless expressly
  authorized by statute or by the individual or unless pertinent to and within
  the scope of an authorized law enforcement activity.
elementType: control
