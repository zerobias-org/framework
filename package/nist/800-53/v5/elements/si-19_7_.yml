id: 3915dd0c-4711-4fb8-a9db-6ecc973442d0
externalId: SI-19(7)
name: De-identification | Validated Algorithms and Software
description: Perform de-identification using validated algorithms and software that
  is validated to implement the algorithms.
elementType: enhancement
parent: si-19
guidance: Algorithms that appear to remove personally identifiable information from
  a dataset may in fact leave information that is personally identifiable or data
  that is re-identifiable. Software that is claimed to implement a validated algorithm
  may contain bugs or implement a different algorithm. Software may de-identify one
  type of data, such as integers, but not de-identify another type of data, such as
  floating point numbers. For these reasons, de-identification is performed using
  algorithms and software that are validated.
aliases:
