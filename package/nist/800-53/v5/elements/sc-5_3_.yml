id: 0a26ec4c-68bb-47c6-b2ce-b4ea2c024330
externalId: SC-5(3)
name: Denial-of-service Protection | Detection and Monitoring
description: Employs defined monitoring tools to detect denial-of-service attack indicators
  and monitors system resources to ensure sufficient capacity remains.
elementType: enhancement
parent: sc-5
guidance: Organizations consider the utilization and capacity of system resources
  when managing risk associated with a denial of service due to malicious attacks.
  Denial-of-service attacks can originate from external or internal sources. System
  resources that are sensitive to denial of service include physical disk storage,
  memory, and CPU cycles. Techniques used to prevent denial-of-service attacks related
  to storage utilization and capacity include instituting disk quotas, configuring
  systems to automatically alert administrators when specific storage capacity thresholds
  are reached, using file compression technologies to maximize available storage space,
  and imposing separate partitions for system and user data.
