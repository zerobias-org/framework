id: 32896aba-ffb4-436d-8f56-841d8c195366
externalId: SC-7(14)
name: Boundary Protection | Protect Against Unauthorized Physical Connections
description: 'Protect against unauthorized physical connections at [Assignment: organization-defined
  managed interfaces].'
elementType: enhancement
parent: sc-7
guidance: Systems that operate at different security categories or classification
  levels may share common physical and environmental controls, since the systems may
  share space within the same facilities. In practice, it is possible that these separate
  systems may share common equipment rooms, wiring closets, and cable distribution
  paths. Protection against unauthorized physical connections can be achieved by using
  clearly identified and physically separated cable trays, connection frames, and
  patch panels for each side of managed interfaces with physical access controls that
  enforce limited authorized access to these items.
