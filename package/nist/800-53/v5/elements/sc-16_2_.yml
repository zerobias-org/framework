id: 9151c510-c917-49f5-990a-607ba9de78ec
externalId: SC-16(2)
name: Transmission of Security and Privacy Attributes | Anti-spoofing Mechanisms
description: Implement anti-spoofing mechanisms to prevent adversaries from falsifying
  the security attributes indicating the successful application of the security process.
elementType: enhancement
parent: sc-16
guidance: Some attack vectors operate by altering the security attributes of an information
  system to intentionally and maliciously implement an insufficient level of security
  within the system. The alteration of attributes leads organizations to believe that
  a greater number of security functions are in place and operational than have actually
  been implemented.
