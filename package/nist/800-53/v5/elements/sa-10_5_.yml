id: 21f3f232-40f6-4b4d-8788-9f4d1d807da6
externalId: SA-10(5)
name: Developer Configuration Management | Mapping Integrity for Version Control
description: Requires the developer to maintain the integrity of the mapping between
  master build data and the on-site master copy for the current version.
elementType: enhancement
parent: sa-10
guidance: Mapping integrity for version control addresses changes to hardware, software,
  and firmware components during both initial development and system development life
  cycle updates. Maintaining the integrity between the master copies of security-relevant
  hardware, software, and firmware (including designs, hardware drawings, source code)
  and the equivalent data in master copies in operational environments is essential
  to ensuring the availability of organizational systems that support critical mission
  and business functions.
