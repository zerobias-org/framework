  among organizational entities, and compliance; andb. Is consistent with
  applicable laws, executive orders, directives, regulations, policies,
  standards, and guidelines; and2. Procedures to facilitate the implementation
  of the personally identifiable information processing and transparency policy
  and the associated personally identifiable information processing and
  transparency controls;b. Designate an [Assignment: organization-defined
  official] to manage the development, documentation, and dissemination of the
  personally identifiable information processing and transparency policy and
  procedures; andc. Review and update the current personally identifiable
  information processing and transparency:1. Policy [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]; and2. Procedures [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]."
