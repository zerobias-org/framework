externalId: MA-3(5)
name: Maintenance Tools | Execution with Privilege
description: Monitor the use of maintenance tools that execute with increased privilege.
elementType: enhancement
parent: ma-3
guidance: Maintenance tools that execute with increased system privilege can result
  in unauthorized access to organizational information and assets that would otherwise
  be inaccessible.
