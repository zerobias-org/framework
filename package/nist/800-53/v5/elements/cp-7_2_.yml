externalId: CP-7(2)
name: Alternate Processing Site | Accessibility
description: Identify potential accessibility problems to alternate processing sites
  in the event of an area-wide disruption or disaster and outlines explicit mitigation
  actions.
elementType: enhancement
parent: cp-7
guidance: Area-wide disruptions refer to those types of disruptions that are broad
  in geographic scope with such determinations made by organizations based on organizational
  assessments of risk.
