id: 6d3aa74a-7727-4955-a243-438f88a8a6df
externalId: AC-9
name: Previous Logon Notification
description: Notify the user, upon successful logon to the system, of the date and
  time of the last logon.
elementType: control
parent: ac
guidance: Previous logon notification is applicable to system access via human user
  interfaces and access to systems that occurs in other types of architectures. Information
  about the last successful logon allows the user to recognize if the date and time
  provided is not consistent with the user’s last access.
