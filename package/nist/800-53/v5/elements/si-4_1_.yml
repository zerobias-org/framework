id: 1f827be4-1d0a-4c0a-9fec-8b0033fab9b1
externalId: SI-4(1)
name: System Monitoring | System-wide Intrusion Detection System
description: Connect and configure individual intrusion detection tools into a system-wide
  intrusion detection system.
elementType: enhancement
parent: si-4
guidance: Linking individual intrusion detection tools into a system-wide intrusion
  detection system provides additional coverage and effective detection capabilities.
  The information contained in one intrusion detection tool can be shared widely across
  the organization, making the system-wide detection capability more robust and powerful.
