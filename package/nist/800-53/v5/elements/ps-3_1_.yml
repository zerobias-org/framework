id: 604a173e-85a3-4a8f-a0bb-a745104b3e8a
externalId: PS-3(1)
name: Personnel Screening | Classified Information
description: Verifies that individuals accessing classified systems are cleared and
  indoctrinated to the highest classification level they can access.
elementType: enhancement
parent: ps-3
guidance: Classified information is the most sensitive information that the Federal
  Government processes, stores, or transmits. It is imperative that individuals have
  the requisite security clearances and system access authorizations prior to gaining
  access to such information. Access authorizations are enforced by system access
  controls (see) and flow controls (see).
