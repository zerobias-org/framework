id: 1c442ad2-6999-42a7-9853-b6aa4d77f9be
externalId: PE-13(1)
name: Fire Protection | Detection Systems — Automatic Activation and Notification
description: Employs fire detection systems that activate automatically and notify
  designated personnel and emergency responders.
elementType: enhancement
parent: pe-13
guidance: Organizations can identify personnel, roles, and emergency responders if
  individuals on the notification list need to have access authorizations or clearances
  (e.g., to enter to facilities where access is restricted due to the classification
  or impact level of information within the facility). Notification mechanisms may
  require independent energy sources to ensure that the notification capability is
  not adversely affected by the fire.
