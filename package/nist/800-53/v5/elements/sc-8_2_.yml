id: 4ad43eea-2343-435a-980a-100f611a6f44
externalId: SC-8(2)
name: Transmission Confidentiality and Integrity | Pre- and Post-transmission Handling
description: 'Maintain the [Selection (one or more): confidentiality; integrity] of
  information during preparation for transmission and during reception.'
elementType: enhancement
parent: sc-8
guidance: Information can be unintentionally or maliciously disclosed or modified
  during preparation for transmission or during reception, including during aggregation,
  at protocol transformation points, and during packing and unpacking. Such unauthorized
  disclosures or modifications compromise the confidentiality or integrity of the
  information.
