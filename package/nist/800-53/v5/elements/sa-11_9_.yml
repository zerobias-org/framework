id: 7b38c32b-6480-411e-a865-c0d4ecb8f166
externalId: SA-11(9)
name: Developer Testing and Evaluation | Interactive Application Security Testing
description: Require the developer of the system, system component, or system service
  to employ interactive application security testing tools to identify flaws and document
  the results.
elementType: enhancement
parent: sa-11
guidance: Interactive (also known as instrumentation-based) application security testing
  is a method of detecting vulnerabilities by observing applications as they run during
  testing. The use of instrumentation relies on direct measurements of the actual
  running applications and uses access to the code, user interaction, libraries, frameworks,
  backend connections, and configurations to directly measure control effectiveness.
  When combined with analysis techniques, interactive application security testing
  can identify a broad range of potential vulnerabilities and confirm control effectiveness.
  Instrumentation-based testing works in real time and can be used continuously throughout
  the system development life cycle.
aliases:
