id: 5ece105e-c90a-4981-9665-95cc53bde592
externalId: SC-8(3)
name: Transmission Confidentiality and Integrity | Cryptographic Protection for Message
  Externals
description: 'Implement cryptographic mechanisms to protect message externals unless
  otherwise protected by [Assignment: organization-defined alternative physical controls].'
elementType: enhancement
parent: sc-8
guidance: Cryptographic protection for message externals addresses protection from
  the unauthorized disclosure of information. Message externals include message headers
  and routing information. Cryptographic protection prevents the exploitation of message
  externals and applies to internal and external networks or links that may be visible
  to individuals who are not authorized users. Header and routing information is sometimes
  transmitted in clear text (i.e., unencrypted) because the information is not identified
  by organizations as having significant value or because encrypting the information
  can result in lower network performance or higher costs. Alternative physical controls
  include protected distribution systems.
