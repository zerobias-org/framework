id: 21071c8e-db3c-4c3a-b283-5cb0f77e81a0
externalId: AC-20(1)
name: Use of External Systems | Limits on Authorized Use
description: Permit authorized individuals to use an external system to access
  the system or to process, store, or transmit organization-controlled
  information only after:a. Verification of the implementation of controls on
  the external system as specified in the organization’s security and privacy
  policies and security and privacy plans; orb. Retention of approved system
  connection or processing agreements with the organizational entity hosting the
  external system.
elementType: control
