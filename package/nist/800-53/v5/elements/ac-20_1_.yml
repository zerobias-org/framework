id: 1cb03df8-a357-44ec-a0ea-443db9140852
externalId: AC-20(1)
name: Use of External Systems | Limits on Authorized Use
description: Permits external system use for accessing or processing organizational
  information only after verifying its controls or retaining a connection agreement.
elementType: enhancement
parent: ac-20
guidance: Limiting authorized use recognizes circumstances where individuals using
  external systems may need to access organizational systems. Organizations need assurance
  that the external systems contain the necessary controls so as not to compromise,
  damage, or otherwise harm organizational systems. Verification that the required
  controls have been implemented can be achieved by external, independent assessments,
  attestations, or other means, depending on the confidence level required by organizations.
aliases:
