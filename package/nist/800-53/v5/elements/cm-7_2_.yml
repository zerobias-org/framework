id: 26947eca-4954-4292-9389-eb5c56993799
externalId: CM-7(2)
name: Least Functionality | Prevent Program Execution
description: Prevents program execution except in accordance with defined policies,
  rules of behavior, or access agreements governing software usage.
elementType: enhancement
parent: cm-7
guidance: Prevention of program execution addresses organizational policies, rules
  of behavior, and/or access agreements that restrict software usage and the terms
  and conditions imposed by the developer or manufacturer, including software licensing
  and copyrights. Restrictions include prohibiting auto-execute features, restricting
  roles allowed to approve program execution, permitting or prohibiting specific software
  programs, or restricting the number of program instances executed at the same time.
aliases:
