externalId: CA-3
name: Information Exchange
description: "a. Approve and manage the exchange of information between the
  system and other systems using [Selection (one or more): interconnection
  security agreements; information exchange security agreements; memoranda of
  understanding or agreement; service level agreements; user agreements;
  nondisclosure agreements; [Assignment: organization-defined type of
  agreement]];b. Document, as part of each exchange agreement, the interface
  characteristics, security and privacy requirements, controls, and
  responsibilities for each system, and the impact level of the information
  communicated; andc. Review and update the agreements [Assignment:
  organization-defined frequency]."
elementType: control
