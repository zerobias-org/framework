id: 802bd0e4-c1c6-45b6-8eaf-4d115ee10e03
externalId: IR-6(2)
name: Incident Reporting | Vulnerabilities Related to Incidents
description: 'Report system vulnerabilities associated with reported incidents to
  [Assignment: organization-defined personnel or roles].'
elementType: enhancement
parent: ir-6
guidance: Reported incidents that uncover system vulnerabilities are analyzed by organizational
  personnel including system owners, mission and business owners, senior agency information
  security officers, senior agency officials for privacy, authorizing officials, and
  the risk executive (function). The analysis can serve to prioritize and initiate
  mitigation actions to address the discovered system vulnerability.
aliases:
