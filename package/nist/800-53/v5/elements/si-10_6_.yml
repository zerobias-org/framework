id: e53da065-7fc7-44b5-b849-b5bdf7b59051
externalId: SI-10(6)
name: Information Input Validation | Injection Prevention
description: Prevent untrusted data injections.
elementType: enhancement
parent: si-10
guidance: Untrusted data injections may be prevented using a parameterized interface
  or output escaping (output encoding). Parameterized interfaces separate data from
  code so that injections of malicious or unintended data cannot change the semantics
  of commands being sent. Output escaping uses specified characters to inform the
  interpreter’s parser whether data is trusted. Prevention of untrusted data injections
  are with respect to the information inputs defined by the organization in the base
  control (SI-10).
