id: 74fca74f-6fac-437d-bd26-15075701590a
externalId: SC-3(5)
name: Security Function Isolation | Layered Structures
description: Implements security functions as a layered structure that minimizes interactions
  between layers and avoids dependence by lower layers on higher ones.
elementType: enhancement
parent: sc-3
guidance: The implementation of layered structures with minimized interactions among
  security functions and non-looping layers (i.e., lower-layer functions do not depend
  on higher-layer functions) enables the isolation of security functions and the management
  of complexity.
