id: 7546a23b-4d05-42a2-936c-db35778aaf02
externalId: SI-13(1)
name: Predictable Failure Prevention | Transferring Component Responsibilities
description: Transfers component responsibilities to substitutes no later than a defined
  fraction of mean time to failure.
elementType: enhancement
parent: si-13
guidance: Transferring primary system component responsibilities to other substitute
  components prior to primary component failure is important to reduce the risk of
  degraded or debilitated mission or business functions. Making such transfers based
  on a percentage of mean time to failure allows organizations to be proactive based
  on their risk tolerance. However, the premature replacement of system components
  can result in the increased cost of system operations.
