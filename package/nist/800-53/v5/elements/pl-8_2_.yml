id: 40cfc0f1-cc80-47c1-b19f-724ec9dfa970
externalId: PL-8(2)
name: Security and Privacy Architectures | Supplier Diversity
description: 'Require that [Assignment: organization-defined controls] allocated to
  [Assignment: organization-defined locations and architectural layers] are obtained
  from different suppliers.'
elementType: enhancement
parent: pl-8
guidance: Information technology products have different strengths and weaknesses.
  Providing a broad spectrum of products complements the individual offerings. For
  example, vendors offering malicious code protection typically update their products
  at different times, often developing solutions for known viruses, Trojans, or worms
  based on their priorities and development schedules. By deploying different products
  at different locations, there is an increased likelihood that at least one of the
  products will detect the malicious code. With respect to privacy, vendors may offer
  products that track personally identifiable information in systems. Products may
  use different tracking methods. Using multiple products may result in more assurance
  that personally identifiable information is inventoried.
