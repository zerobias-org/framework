id: 8dab87c3-ea8d-4cdb-be09-86fb90f357c3
externalId: SR-10
name: Inspection of Systems or Components
description: Inspects defined systems or components at random or on a schedule to
  detect tampering.
elementType: control
parent: sr
guidance: The inspection of systems or systems components for tamper resistance and
  detection addresses physical and logical tampering and is applied to systems and
  system components removed from organization-controlled areas. Indications of a need
  for inspection include changes in packaging, specifications, factory location, or
  entity in which the part is purchased, and when individuals return from travel to
  high-risk locations.
