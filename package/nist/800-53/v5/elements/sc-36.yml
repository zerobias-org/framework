id: 44963b44-6d62-4cff-b294-23f60eae1553
externalId: SC-36
name: Distributed Processing and Storage
description: 'Distribute the following processing and storage components across multiple
  [Selection: physical locations; logical domains]: [Assignment: organization-defined
  processing and storage components].'
elementType: control
parent: sc
guidance: Distributing processing and storage across multiple physical locations or
  logical domains provides a degree of redundancy or overlap for organizations. The
  redundancy and overlap increase the work factor of adversaries to adversely impact
  organizational operations, assets, and individuals. The use of distributed processing
  and storage does not assume a single primary processing or storage location. Therefore,
  it allows for parallel processing and storage.
