id: 37e79c74-3baa-4316-82aa-4f82c71f0a2c
externalId: CP-9(3)
name: System Backup | Separate Storage for Critical Information
description: Stores backup copies of critical system software and security-related
  information in a separate facility away from the operational system.
elementType: enhancement
parent: cp-9
guidance: Separate storage for critical information applies to all critical information
  regardless of the type of backup storage media. Critical system software includes
  operating systems, middleware, cryptographic key management systems, and intrusion
  detection systems. Security-related information includes inventories of system hardware,
  software, and firmware components. Alternate storage sites, including geographically
  distributed architectures, serve as separate storage facilities for organizations.
  Organizations may provide separate storage by implementing automated backup processes
  at alternative storage sites (e.g., data centers). The General Services Administration
  (GSA) establishes standards and specifications for security and fire rated containers.
aliases:
