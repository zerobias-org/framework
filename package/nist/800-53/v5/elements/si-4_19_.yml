id: 7b01c9ec-f6d7-49d3-861c-5f47ee87f79a
externalId: SI-4(19)
name: System Monitoring | Risk for Individuals
description: 'Implement [Assignment: organization-defined additional monitoring] of
  individuals who have been identified by [Assignment: organization-defined sources]
  as posing an increased level of risk.'
elementType: enhancement
parent: si-4
guidance: Indications of increased risk from individuals can be obtained from different
  sources, including personnel records, intelligence agencies, law enforcement organizations,
  and other sources. The monitoring of individuals is coordinated with the management,
  legal, security, privacy, and human resource officials who conduct such monitoring.
  Monitoring is conducted in accordance with applicable laws, executive orders, directives,
  regulations, policies, standards, and guidelines.
