id: e764594e-cc8e-4481-80e5-c702454954f2
externalId: CP-9(2)
name: System Backup | Test Restoration Using Sampling
description: Use a sample of backup information in the restoration of selected system
  functions as part of contingency plan testing.
elementType: enhancement
parent: cp-9
guidance: Organizations need assurance that system functions can be restored correctly
  and can support established organizational missions. To ensure that the selected
  system functions are thoroughly exercised during contingency plan testing, a sample
  of backup information is retrieved to determine whether the functions are operating
  as intended. Organizations can determine the sample size for the functions and backup
  information based on the level of assurance needed.
