id: 46c8ecae-948c-43d9-a0b0-e3be95f9c833
externalId: SC-7(17)
name: Boundary Protection | Automated Enforcement of Protocol Formats
description: Enforce adherence to protocol formats.
elementType: enhancement
parent: sc-7
guidance: System components that enforce protocol formats include deep packet inspection
  firewalls and XML gateways. The components verify adherence to protocol formats
  and specifications at the application layer and identify vulnerabilities that cannot
  be detected by devices operating at the network or transport layers.
