id: 53b60ca2-cc6e-44ba-af3a-34acefa8545d
externalId: IR-6(3)
name: Incident Reporting | Supply Chain Coordination
description: Provides incident information to the product or service provider and
  other organizations in the supply chain related to the incident.
elementType: enhancement
parent: ir-6
guidance: Organizations involved in supply chain activities include product developers,
  system integrators, manufacturers, packagers, assemblers, distributors, vendors,
  and resellers. Entities that provide supply chain governance include the Federal
  Acquisition Security Council (FASC). Supply chain incidents include compromises
  or breaches that involve information technology products, system components, development
  processes or personnel, distribution processes, or warehousing facilities. Organizations
  determine the appropriate information to share and consider the value gained from
  informing external organizations about supply chain incidents, including the ability
  to improve processes or to identify the root cause of an incident.
aliases:
