id: d48ef6c2-fa9a-4e0c-a31c-6d941b4f1cbc
externalId: SI-4(17)
name: System Monitoring | Integrated Situational Awareness
description: Correlate information from monitoring physical, cyber, and supply chain
  activities to achieve integrated, organization-wide situational awareness.
elementType: enhancement
parent: si-4
guidance: Correlating monitoring information from a more diverse set of information
  sources helps to achieve integrated situational awareness. Integrated situational
  awareness from a combination of physical, cyber, and supply chain monitoring activities
  enhances the capability of organizations to more quickly detect sophisticated attacks
  and investigate the methods and techniques employed to carry out such attacks. In
  contrast to SI-4(16), which correlates the various cyber monitoring information,
  integrated situational awareness is intended to correlate monitoring beyond the
  cyber domain. Correlation of monitoring information from multiple activities may
  help reveal attacks on organizations that are operating across multiple attack vectors.
aliases:
