id: 07ba7bc2-176e-4f8a-80be-b78a946f2706
externalId: CP-9(8)
name: System Backup | Cryptographic Protection
description: 'Implement cryptographic mechanisms to prevent unauthorized disclosure
  and modification of [Assignment: organization-defined backup information].'
elementType: enhancement
parent: cp-9
guidance: The selection of cryptographic mechanisms is based on the need to protect
  the confidentiality and integrity of backup information. The strength of mechanisms
  selected is commensurate with the security category or classification of the information.
  Cryptographic protection applies to system backup information in storage at both
  primary and alternate locations. Organizations that implement cryptographic mechanisms
  to protect information at rest also consider cryptographic key management solutions.
