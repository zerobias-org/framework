id: 51482bac-410b-4ca9-a30f-2051b43bd621
externalId: IA-5(2)
name: Authenticator Management | Public Key-based Authentication
description: Enforces public key-based authentication, including access to private
  keys, identity mapping, and certificate path validation with revocation checking.
elementType: enhancement
parent: ia-5
guidance: Public key cryptography is a valid authentication mechanism for individuals,
  machines, and devices. For PKI solutions, status information for certification paths
  includes certificate revocation lists or certificate status protocol responses.
  For PIV cards, certificate validation involves the construction and verification
  of a certification path to the Common Policy Root trust anchor, which includes certificate
  policy processing. Implementing a local cache of revocation data to support path
  discovery and validation also supports system availability in situations where organizations
  are unable to access revocation information via the network.
aliases:
