id: 649597fd-4aa2-4ed2-9544-1bed6fd53bc8
externalId: CM-8(7)
name: System Component Inventory | Centralized Repository
description: Provide a centralized repository for the inventory of system components.
elementType: enhancement
parent: cm-8
guidance: Organizations may implement centralized system component inventories that
  include components from all organizational systems. Centralized repositories of
  component inventories provide opportunities for efficiencies in accounting for organizational
  hardware, software, and firmware assets. Such repositories may also help organizations
  rapidly identify the location and responsible individuals of components that have
  been compromised, breached, or are otherwise in need of mitigation actions. Organizations
  ensure that the resulting centralized inventories include system-specific information
  required for proper component accountability.
aliases:
