id: c2d9a0c3-df92-4314-baf5-8421fd2e669e
externalId: CM-14
name: Signed Components
description: Prevents installation of defined software and firmware components unless
  digitally signed with an organization-approved certificate.
elementType: control
parent: cm
guidance: Software and firmware components prevented from installation unless signed
  with recognized and approved certificates include software and firmware version
  updates, patches, service packs, device drivers, and basic input/output system updates.
  Organizations can identify applicable software and firmware components by type,
  by specific items, or a combination of both. Digital signatures and organizational
  verification of such signatures is a method of code authentication.
