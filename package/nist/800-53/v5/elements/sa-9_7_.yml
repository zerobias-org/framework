id: 104e03f5-4478-4b57-b3a2-f1eb295946c8
externalId: SA-9(7)
name: External System Services | Organization-controlled Integrity Checking
description: Provide the capability to check the integrity of information while it
  resides in the external system.
elementType: enhancement
parent: sa-9
guidance: Storage of organizational information in an external system could limit
  visibility into the security status of its data. The ability of the organization
  to verify and validate the integrity of its stored data without transferring it
  out of the external system provides such visibility.
