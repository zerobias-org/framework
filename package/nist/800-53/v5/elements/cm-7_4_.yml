id: 79e47b38-3190-4b2c-b910-fef9ec7df8e3
externalId: CM-7(4)
name: Least Functionality | Unauthorized Software — Deny-by-exception
description: "a. Identify [Assignment: organization-defined software programs
  not authorized to execute on the system];b. Employ an allow-all,
  deny-by-exception policy to prohibit the execution of unauthorized software
  programs on the system; andc. Review and update the list of unauthorized
  software programs [Assignment: organization-defined frequency]."
elementType: control
