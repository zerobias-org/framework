id: 28956ca1-27ad-45d1-9eb5-4c1b603ad674
externalId: SA-8(5)
name: Security and Privacy Engineering Principles | Efficiently Mediated Access
description: 'Implement the security design principle of efficiently mediated access
  in [Assignment: organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of efficiently mediated access states that policy enforcement
  mechanisms utilize the least common mechanism available while satisfying stakeholder
  requirements within expressed constraints. The mediation of access to system resources
  (i.e., CPU, memory, devices, communication ports, services, infrastructure, data,
  and information) is often the predominant security function of secure systems. It
  also enables the realization of protections for the capability provided to stakeholders
  by the system. Mediation of resource access can result in performance bottlenecks
  if the system is not designed correctly. For example, by using hardware mechanisms,
  efficiently mediated access can be achieved. Once access to a low-level resource
  such as memory has been obtained, hardware protection mechanisms can ensure that
  out-of-bounds access does not occur.
