id: a29de775-daad-40e0-8710-d7af42ea2bbe
externalId: PE-6(1)
name: Monitoring Physical Access | Intrusion Alarms and Surveillance Equipment
description: Monitor physical access to the facility where the system resides using
  physical intrusion alarms and surveillance equipment.
elementType: enhancement
parent: pe-6
guidance: Physical intrusion alarms can be employed to alert security personnel when
  unauthorized access to the facility is attempted. Alarm systems work in conjunction
  with physical barriers, physical access control systems, and security guards by
  triggering a response when these other forms of security have been compromised or
  breached. Physical intrusion alarms can include different types of sensor devices,
  such as motion sensors, contact sensors, and broken glass sensors. Surveillance
  equipment includes video cameras installed at strategic locations throughout the
  facility.
