id: 7d980dcd-a061-4951-aac9-13a3f1e878cd
externalId: SC-7(20)
name: Boundary Protection | Dynamic Isolation and Segregation
description: 'Provide the capability to dynamically isolate [Assignment: organization-defined
  system components] from other system components.'
elementType: enhancement
parent: sc-7
guidance: The capability to dynamically isolate certain internal system components
  is useful when it is necessary to partition or separate system components of questionable
  origin from components that possess greater trustworthiness. Component isolation
  reduces the attack surface of organizational systems. Isolating selected system
  components can also limit the damage from successful attacks when such attacks occur.
