id: bb2d7b2b-310f-4672-b1cb-99235ab18cb1
externalId: PM-7(1)
name: Enterprise Architecture | Offloading
description: 'Offload [Assignment: organization-defined non-essential functions or
  services] to other systems, system components, or an external provider.'
elementType: enhancement
parent: pm-7
guidance: Not every function or service that a system provides is essential to organizational
  mission or business functions. Printing or copying is an example of a non-essential
  but supporting service for an organization. Whenever feasible, such supportive but
  non-essential functions or services are not co-located with the functions or services
  that support essential mission or business functions. Maintaining such functions
  on the same system or system component increases the attack surface of the organization’s
  mission-essential functions or services. Moving supportive but non-essential functions
  to a non-critical system, system component, or external provider can also increase
  efficiency by putting those functions or services under the control of individuals
  or providers who are subject matter experts in the functions or services.
aliases:
