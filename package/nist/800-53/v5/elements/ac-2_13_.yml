id: 71b84daf-b154-4474-8ad8-fe52be99a592
externalId: AC-2(13)
name: Account Management | Disable Accounts for High-risk Individuals
description: 'Disable accounts of individuals within [Assignment: organization-defined
  time period] of discovery of [Assignment: organization-defined significant risks].'
elementType: enhancement
parent: ac-2
guidance: Users who pose a significant security and/or privacy risk include individuals
  for whom reliable evidence indicates either the intention to use authorized access
  to systems to cause harm or through whom adversaries will cause harm. Such harm
  includes adverse impacts to organizational operations, organizational assets, individuals,
  other organizations, or the Nation. Close coordination among system administrators,
  legal staff, human resource managers, and authorizing officials is essential when
  disabling system accounts for high-risk individuals.
