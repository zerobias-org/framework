id: 528d00e3-f2ed-4a99-8b91-ef668ad7e56e
externalId: CA-7(3)
name: Continuous Monitoring | Trend Analyses
description: Uses trend analyses of empirical data to determine whether control implementations
  or monitoring activities need modification.
elementType: enhancement
parent: ca-7
guidance: Trend analyses include examining recent threat information that addresses
  the types of threat events that have occurred in the organization or the Federal
  Government, success rates of certain types of attacks, emerging vulnerabilities
  in technologies, evolving social engineering techniques, the effectiveness of configuration
  settings, results from multiple control assessments, and findings from Inspectors
  General or auditors.
