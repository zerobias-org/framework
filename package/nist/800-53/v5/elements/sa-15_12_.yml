id: c44999a9-dbb6-4d7f-8f0e-b19a115a6bb9
externalId: SA-15(12)
name: Development Process, Standards, and Tools | Minimize Personally Identifiable
  Information
description: Require the developer of the system or system component to minimize the
  use of personally identifiable information in development and test environments.
elementType: enhancement
parent: sa-15
guidance: Organizations can minimize the risk to an individual’s privacy by using
  techniques such as de-identification or synthetic data. Limiting the use of personally
  identifiable information in development and test environments helps reduce the level
  of privacy risk created by a system.
