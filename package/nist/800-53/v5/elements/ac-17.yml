id: bc656f11-b977-4f4f-91f6-845bfc5d8b6c
externalId: AC-17
name: Remote Access
description: Establishes usage restrictions and connection requirements for each type
  of remote access, and authorizes each type before allowing it.
elementType: control
parent: ac
guidance: Remote access is access to organizational systems (or processes acting on
  behalf of users) that communicate through external networks such as the Internet.
  Types of remote access include dial-up, broadband, and wireless. Organizations use
  encrypted virtual private networks (VPNs) to enhance confidentiality and integrity
  for remote connections. The use of encrypted VPNs provides sufficient assurance
  to the organization that it can effectively treat such connections as internal networks
  if the cryptographic mechanisms used are implemented in accordance with applicable
  laws, executive orders, directives, regulations, policies, standards, and guidelines.
  Still, VPN connections traverse external networks, and the encrypted VPN does not
  enhance the availability of remote connections. VPNs with encrypted tunnels can
  also affect the ability to adequately monitor network communications traffic for
  malicious code. Remote access controls apply to systems other than public web servers
  or systems designed for public access. Authorization of each remote access type
  addresses authorization prior to allowing remote access without specifying the specific
  formats for such authorization. While organizations may use information exchange
  and system connection security agreements to manage remote access connections to
  other systems, such agreements are addressed as part of. Enforcing access restrictions
  for remote access is addressed via.
