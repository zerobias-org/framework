id: 649875f6-3956-4081-ad6e-fa37bb1eff3a
externalId: SA-8(25)
name: Security and Privacy Engineering Principles | Economic Security
description: 'Implement the security design principle of economic security in [Assignment:
  organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of economic security states that security mechanisms are not
  costlier than the potential damage that could occur from a security breach. This
  is the security-relevant form of the cost-benefit analyses used in risk management.
  The cost assumptions of cost-benefit analysis prevent the system designer from incorporating
  security mechanisms of greater strength than necessary, where strength of mechanism
  is proportional to cost. The principle of economic security also requires analysis
  of the benefits of assurance relative to the cost of that assurance in terms of
  the effort expended to obtain relevant and credible evidence as well as the necessary
  analyses to assess and draw trustworthiness and risk conclusions from the evidence.
