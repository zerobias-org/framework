id: 4b049720-2ea0-4d3f-b3ba-8948f2f2d3f7
externalId: SA-11(5)
name: Developer Testing and Evaluation | Penetration Testing
description: Requires the developer to perform penetration testing at a defined level
  of rigor and under defined constraints.
elementType: enhancement
parent: sa-11
guidance: Penetration testing is an assessment methodology in which assessors, using
  all available information technology product or system documentation and working
  under specific constraints, attempt to circumvent the implemented security and privacy
  features of information technology products and systems. Useful information for
  assessors who conduct penetration testing includes product and system design specifications,
  source code, and administrator and operator manuals. Penetration testing can include
  white-box, gray-box, or black-box testing with analyses performed by skilled professionals
  who simulate adversary actions. The objective of penetration testing is to discover
  vulnerabilities in systems, system components, and services that result from implementation
  errors, configuration faults, or other operational weaknesses or deficiencies. Penetration
  tests can be performed in conjunction with automated and manual code reviews to
  provide a greater level of analysis than would ordinarily be possible. When user
  session information and other personally identifiable information is captured or
  recorded during penetration testing, such information is handled appropriately to
  protect privacy.
