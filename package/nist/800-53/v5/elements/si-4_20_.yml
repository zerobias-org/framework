id: 64dad942-6d80-4b45-9183-db5591cfb5ac
externalId: SI-4(20)
name: System Monitoring | Privileged Users
description: 'Implement the following additional monitoring of privileged users: [Assignment:
  organization-defined additional monitoring].'
elementType: enhancement
parent: si-4
guidance: Privileged users have access to more sensitive information, including security-related
  information, than the general user population. Access to such information means
  that privileged users can potentially do greater damage to systems and organizations
  than non-privileged users. Therefore, implementing additional monitoring on privileged
  users helps to ensure that organizations can identify malicious activity at the
  earliest possible time and take appropriate actions.
