id: 39f5e44d-ca1a-469a-937d-9e5945687b9c
externalId: IA-4(8)
name: Identifier Management | Pairwise Pseudonymous Identifiers
description: Generate pairwise pseudonymous identifiers.
elementType: enhancement
parent: ia-4
guidance: A pairwise pseudonymous identifier is an opaque unguessable subscriber identifier
  generated by an identity provider for use at a specific individual relying party.
  Generating distinct pairwise pseudonymous identifiers with no identifying information
  about a subscriber discourages subscriber activity tracking and profiling beyond
  the operational requirements established by an organization. The pairwise pseudonymous
  identifiers are unique to each relying party except in situations where relying
  parties can show a demonstrable relationship justifying an operational need for
  correlation, or all parties consent to being correlated in such a manner.
aliases:
