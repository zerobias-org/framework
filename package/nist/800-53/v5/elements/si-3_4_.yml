id: c62403b9-f943-4d57-9488-754ba2454a4f
externalId: SI-3(4)
name: Malicious Code Protection | Updates Only by Privileged Users
description: Update malicious code protection mechanisms only when directed by a privileged
  user.
elementType: enhancement
parent: si-3
guidance: Protection mechanisms for malicious code are typically categorized as security-related
  software and, as such, are only updated by organizational personnel with appropriate
  access privileges.
