id: e92668d9-3be0-46ce-8d9e-b99aecc8bdae
externalId: RA-3(4)
name: Risk Assessment | Predictive Cyber Analytics
description: Employs advanced automation and analytics capabilities to predict and
  identify risks to defined systems or components.
elementType: enhancement
parent: ra-3
guidance: A properly resourced Security Operations Center (SOC) or Computer Incident
  Response Team (CIRT) may be overwhelmed by the volume of information generated by
  the proliferation of security tools and appliances unless it employs advanced automation
  and analytics to analyze the data. Advanced automation and analytics capabilities
  are typically supported by artificial intelligence concepts, including machine learning.
  Examples include Automated Threat Discovery and Response (which includes broad-based
  collection, context-based analysis, and adaptive response capabilities), automated
  workflow operations, and machine assisted decision tools. Note, however, that sophisticated
  adversaries may be able to extract information related to analytic parameters and
  retrain the machine learning to classify malicious activity as benign. Accordingly,
  machine learning is augmented by human monitoring to ensure that sophisticated adversaries
  are not able to conceal their activities.
