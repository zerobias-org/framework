id: 8a1bc0df-602b-4dfd-b130-2c2d730141d3
externalId: AC-22
name: Publicly Accessible Content
description: "a. Designate individuals authorized to make information publicly
  accessible;b. Train authorized individuals to ensure that publicly accessible
  information does not contain nonpublic information;c. Review the proposed
  content of information prior to posting onto the publicly accessible system to
  ensure that nonpublic information is not included; andd. Review the content on
  the publicly accessible system for nonpublic information [Assignment:
  organization-defined frequency] and remove such information, if discovered."
elementType: control
