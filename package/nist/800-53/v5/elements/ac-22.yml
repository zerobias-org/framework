id: 8a1bc0df-602b-4dfd-b130-2c2d730141d3
externalId: AC-22
name: Publicly Accessible Content
description: Designates and trains authorized individuals to review content before
  and after it is posted publicly, removing any nonpublic information found.
elementType: control
parent: ac
guidance: In accordance with applicable laws, executive orders, directives, policies,
  regulations, standards, and guidelines, the public is not authorized to have access
  to nonpublic information, including information protected under theand proprietary
  information. Publicly accessible content addresses systems that are controlled by
  the organization and accessible to the public, typically without identification
  or authentication. Posting information on non-organizational systems (e.g., non-organizational
  public websites, forums, and social media) is covered by organizational policy.
  While organizations may have individuals who are responsible for developing and
  implementing policies about the information that can be made publicly accessible,
  publicly accessible content addresses the management of the individuals who make
  such information publicly accessible.
