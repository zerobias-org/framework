id: 5cc5b13c-e6dc-471d-a3d9-eaf96ca52d91
externalId: AU-7(1)
name: Audit Record Reduction and Report Generation | Automatic Processing
description: 'Provide and implement the capability to process, sort, and search audit
  records for events of interest based on the following content: [Assignment: organization-defined
  fields within audit records].'
elementType: enhancement
parent: au-7
guidance: Events of interest can be identified by the content of audit records, including
  system resources involved, information objects accessed, identities of individuals,
  event types, event locations, event dates and times, Internet Protocol addresses
  involved, or event success or failure. Organizations may define event criteria to
  any degree of granularity required, such as locations selectable by a general networking
  location or by specific system component.
