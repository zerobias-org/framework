id: 30d1725c-a389-4a8e-8479-b2155ff64751
externalId: SA-8(2)
name: Security and Privacy Engineering Principles | Least Common Mechanism
description: 'Implement the security design principle of least common mechanism in
  [Assignment: organization-defined systems or system components].'
elementType: enhancement
parent: sa-8
guidance: The principle of least common mechanism states that the amount of mechanism
  common to more than one user and depended on by all users is minimized POPEK74.
  Mechanism minimization implies that different components of a system refrain from
  using the same mechanism to access a system resource. Every shared mechanism (especially
  a mechanism involving shared variables) represents a potential information path
  between users and is designed with care to ensure that it does not unintentionally
  compromise security SALTZER75. Implementing the principle of least common mechanism
  helps to reduce the adverse consequences of sharing the system state among different
  programs. A single program that corrupts a shared state (including shared variables)
  has the potential to corrupt other programs that are dependent on the state. The
  principle of least common mechanism also supports the principle of simplicity of
  design and addresses the issue of covert storage channels LAMPSON73.
