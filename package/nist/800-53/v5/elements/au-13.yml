id: 6bd1b240-13f1-4a46-b40d-f4fc80175fcd
externalId: AU-13
name: Monitoring for Information Disclosure
description: Monitors defined open-source information for evidence of unauthorized
  disclosure and notifies designated personnel when disclosure is found.
elementType: control
parent: au
guidance: Unauthorized disclosure of information is a form of data leakage. Open-source
  information includes social networking sites and code-sharing platforms and repositories.
  Examples of organizational information include personally identifiable information
  retained by the organization or proprietary information generated by the organization.
