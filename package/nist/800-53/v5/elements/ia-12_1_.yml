id: a3375471-fa8d-4a1d-9240-850df63afc12
externalId: IA-12(1)
name: Identity Proofing | Supervisor Authorization
description: Require that the registration process to receive an account for logical
  access includes supervisor or sponsor authorization.
elementType: enhancement
parent: ia-12
guidance: Including supervisor or sponsor authorization as part of the registration
  process provides an additional level of scrutiny to ensure that the user’s management
  chain is aware of the account, the account is essential to carry out organizational
  missions and functions, and the user’s privileges are appropriate for the anticipated
  responsibilities and authorities within the organization.
