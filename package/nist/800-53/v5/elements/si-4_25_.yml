id: c1db7233-133f-4d06-bd03-cd4018e25b0b
externalId: SI-4(25)
name: System Monitoring | Optimize Network Traffic Analysis
description: Provide visibility into network traffic at external and key internal
  system interfaces to optimize the effectiveness of monitoring devices.
elementType: enhancement
parent: si-4
guidance: Encrypted traffic, asymmetric routing architectures, capacity and latency
  limitations, and transitioning from older to newer technologies (e.g., IPv4 to IPv6
  network protocol transition) may result in blind spots for organizations when analyzing
  network traffic. Collecting, decrypting, pre-processing, and distributing only relevant
  traffic to monitoring devices can streamline the efficiency and use of devices and
  optimize traffic analysis.
aliases:
