id: 1f57cfe4-8d82-4674-a834-5478c7ed5eef
externalId: IA-8(2)
name: Identification and Authentication (non-organizational Users) | Acceptance of
  External Authenticators
description: (a) Accept only external authenticators that are NIST-compliant; and
  (b) Document and maintain a list of accepted external authenticators.
elementType: enhancement
parent: ia-8
guidance: Acceptance of only NIST-compliant external authenticators applies to organizational
  systems that are accessible to the public (e.g., public-facing websites). External
  authenticators are issued by nonfederal government entities and are compliant with.
  Approved external authenticators meet or exceed the minimum Federal Government-wide
  technical, security, privacy, and organizational maturity requirements. Meeting
  or exceeding Federal requirements allows Federal Government relying parties to trust
  external authenticators in connection with an authentication transaction at a specified
  authenticator assurance level.
