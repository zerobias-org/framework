id: dbdb2c91-41b8-45bd-8a84-73e279a67fd4
externalId: CP-6(3)
name: Alternate Storage Site | Accessibility
description: Identify potential accessibility problems to the alternate storage site
  in the event of an area-wide disruption or disaster and outline explicit mitigation
  actions.
elementType: enhancement
parent: cp-6
guidance: Area-wide disruptions refer to those types of disruptions that are broad
  in geographic scope with such determinations made by organizations based on organizational
  assessments of risk. Explicit mitigation actions include duplicating backup information
  at other alternate storage sites if access problems occur at originally designated
  alternate sites or planning for physical access to retrieve backup information if
  electronic accessibility to the alternate site is disrupted.
aliases:
