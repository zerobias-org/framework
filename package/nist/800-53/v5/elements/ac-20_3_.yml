id: 01b8728e-3b38-4476-b746-cb2df97726fb
externalId: AC-20(3)
name: Use of External Systems | Non-organizationally Owned Systems — Restricted Use
description: 'Restrict the use of non-organizationally owned systems or system components
  to process, store, or transmit organizational information using [Assignment: organization-defined
  restrictions].'
elementType: enhancement
parent: ac-20
guidance: Non-organizationally owned systems or system components include systems
  or system components owned by other organizations as well as personally owned devices.
  There are potential risks to using non-organizationally owned systems or components.
  In some cases, the risk is sufficiently high as to prohibit such use (see). In other
  cases, the use of such systems or system components may be allowed but restricted
  in some way. Restrictions include requiring the implementation of approved controls
  prior to authorizing the connection of non-organizationally owned systems and components;
  limiting access to types of information, services, or applications; using virtualization
  techniques to limit processing and storage activities to servers or system components
  provisioned by the organization; and agreeing to the terms and conditions for usage.
  Organizations consult with the Office of the General Counsel regarding legal issues
  associated with using personally owned devices, including requirements for conducting
  forensic analyses during investigations after an incident.
