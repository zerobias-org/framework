id: 357bdfd8-d686-4bc7-844f-a55d83d1d364
externalId: RA-5(2)
name: Vulnerability Monitoring and Scanning | Update Vulnerabilities to Be Scanned
description: 'Update the system vulnerabilities to be scanned [Selection (one or more):
  [Assignment: organization-defined frequency]; prior to a new scan; when new vulnerabilities
  are identified and reported].'
elementType: enhancement
parent: ra-5
guidance: Due to the complexity of modern software, systems, and other factors, new
  vulnerabilities are discovered on a regular basis. It is important that newly discovered
  vulnerabilities are added to the list of vulnerabilities to be scanned to ensure
  that the organization can take steps to mitigate those vulnerabilities in a timely
  manner.
