id: a507b502-6f77-47b2-9af2-0d99c22196a7
externalId: SI-21
name: Information Refresh
description: 'Refresh [Assignment: organization-defined information] at [Assignment:
  organization-defined frequencies] or generate the information on demand and delete
  the information when no longer needed.'
elementType: control
parent: si
guidance: Retaining information for longer than it is needed makes it an increasingly
  valuable and enticing target for adversaries. Keeping information available for
  the minimum period of time needed to support organizational missions or business
  functions reduces the opportunity for adversaries to compromise, capture, and exfiltrate
  that information.
aliases:
- SI-21
