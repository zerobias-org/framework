id: 0773d43e-6fdf-4870-80cd-603ea338abf4
externalId: AU-9(2)
name: Protection of Audit Information | Store on Separate Physical Systems or Components
description: 'Store audit records [Assignment: organization-defined frequency] in
  a repository that is part of a physically different system or system component than
  the system or component being audited.'
elementType: enhancement
parent: au-9
guidance: Storing audit records in a repository separate from the audited system or
  system component helps to ensure that a compromise of the system being audited does
  not also result in a compromise of the audit records. Storing audit records on separate
  physical systems or components also preserves the confidentiality and integrity
  of audit records and facilitates the management of audit records as an organization-wide
  activity. Storing audit records on separate systems or components applies to initial
  generation as well as backup or long-term storage of audit records.
aliases:
