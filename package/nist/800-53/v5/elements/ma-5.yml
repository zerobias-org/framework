id: 02d0b56f-8cdb-43ee-8f62-7aff6917493f
externalId: MA-5
name: Maintenance Personnel
description: a. Establish a process for maintenance personnel authorization and
  maintain a list of authorized maintenance organizations or personnel;b. Verify
  that non-escorted personnel performing maintenance on the system possess the
  required access authorizations; andc. Designate organizational personnel with
  required access authorizations and technical competence to supervise the
  maintenance activities of personnel who do not possess the required access
  authorizations.
elementType: control
