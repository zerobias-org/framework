id: d8eb7262-ce60-428e-bf04-d0a3f3b5ec9b
externalId: MA-5
name: Maintenance Personnel
description: Establishes and maintains a process for authorizing maintenance personnel,
  verifies their access authorizations, and designates supervisors for unauthorized
  personnel.
elementType: control
parent: ma
guidance: Maintenance personnel refers to individuals who perform hardware or software
  maintenance on organizational systems, whileaddresses physical access for individuals
  whose maintenance duties place them within the physical protection perimeter of
  the systems. Technical competence of supervising individuals relates to the maintenance
  performed on the systems, while having required access authorizations refers to
  maintenance on and near the systems. Individuals not previously identified as authorized
  maintenance personnel—such as information technology manufacturers, vendors, systems
  integrators, and consultants—may require privileged access to organizational systems,
  such as when they are required to conduct maintenance activities with little or
  no notice. Based on organizational assessments of risk, organizations may issue
  temporary credentials to these individuals. Temporary credentials may be for one-time
  use or for very limited time periods.
