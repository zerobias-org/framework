id: a19ecb47-8dc3-4f21-9e04-fd7a6d97d013
externalId: AC-20(5)
name: Use of External Systems | Portable Storage Devices — Prohibited Use
description: Prohibit the use of organization-controlled portable storage devices
  by authorized individuals on external systems.
elementType: enhancement
parent: ac-20
guidance: Limits on the use of organization-controlled portable storage devices in
  external systems include a complete prohibition of the use of such devices. Prohibiting
  such use is enforced using technical methods and/or nontechnical (i.e., process-based)
  methods.
