id: 2452abe8-e384-4bda-8f69-8f37a1e739c7
externalId: SC-7(16)
name: Boundary Protection | Prevent Discovery of System Components
description: Prevent the discovery of specific system components that represent a
  managed interface.
elementType: enhancement
parent: sc-7
guidance: Preventing the discovery of system components representing a managed interface
  helps protect network addresses of those components from discovery through common
  tools and techniques used to identify devices on networks. Network addresses are
  not available for discovery and require prior knowledge for access. Preventing the
  discovery of components and devices can be accomplished by not publishing network
  addresses, using network address translation, or not entering the addresses in domain
  name systems. Another prevention technique is to periodically change network addresses.
