id: c0ec3ea5-a1e4-4ad0-ad78-533816ef90e0
externalId: CM-7(8)
name: Least Functionality | Binary or Machine Executable Code
description: Prohibits use of binary or machine-executable code without source code
  or warranty, allowing exceptions only with authorizing official approval.
elementType: enhancement
parent: cm-7
guidance: Binary or machine executable code applies to all sources of binary or machine-executable
  code, including commercial software and firmware and open-source software. Organizations
  assess software products without accompanying source code or from sources with limited
  or no warranty for potential security impacts. The assessments address the fact
  that software products without the provision of source code may be difficult to
  review, repair, or extend. In addition, there may be no owners to make such repairs
  on behalf of organizations. If open-source software is used, the assessments address
  the fact that there is no warranty, the open-source software could contain back
  doors or malware, and there may be no support available.
aliases:
