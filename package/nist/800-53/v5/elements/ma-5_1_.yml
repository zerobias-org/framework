id: 1b5bfe58-9aa3-4c72-a71f-f2aa5a8c79b4
externalId: MA-5(1)
name: Maintenance Personnel | Individuals Without Appropriate Access
description: Implements procedures for maintenance personnel lacking appropriate clearances,
  including escort, supervision, and alternate controls when components cannot be
  sanitized or removed.
elementType: enhancement
parent: ma-5
guidance: Procedures for individuals who lack appropriate security clearances or who
  are not U.S. citizens are intended to deny visual and electronic access to classified
  or controlled unclassified information contained on organizational systems. Procedures
  for the use of maintenance personnel can be documented in security plans for the
  systems.
aliases:
