id: 4cf833cb-d3e4-4b63-8223-64920919854c
externalId: AC-3(2)
name: Access Enforcement | Dual Authorization
description: 'Enforce dual authorization for [Assignment: organization-defined privileged
  commands and/or other organization-defined actions].'
elementType: enhancement
parent: ac-3
guidance: Dual authorization, also known as two-person control, reduces risk related
  to insider threats. Dual authorization mechanisms require the approval of two authorized
  individuals to execute. To reduce the risk of collusion, organizations consider
  rotating dual authorization duties. Organizations consider the risk associated with
  implementing dual authorization mechanisms when immediate responses are necessary
  to ensure public and environmental safety.
