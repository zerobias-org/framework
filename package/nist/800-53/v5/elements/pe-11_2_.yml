id: a963ffee-510e-4b34-bbf7-474a1f00d716
externalId: PE-11(2)
name: Emergency Power | Alternate Power Supply — Self-contained
description: Provides a self-contained alternate power supply, not reliant on external
  generation, capable of maintaining operational capability during extended outages.
elementType: enhancement
parent: pe-11
guidance: The provision of a long-term, self-contained power supply can be satisfied
  by using one or more generators with sufficient capacity to meet the needs of the
  organization.
aliases:
