externalId: AC-4(11)
name: Information Flow Enforcement | Configuration of Security or Privacy Policy Filters
description: 'Provide the capability for privileged administrators to configure [Assignment:
  organization-defined security or privacy policy filters] to support different security
  or privacy policies.'
elementType: enhancement
parent: ac-4
guidance: Documentation contains detailed information for configuring security or
  privacy policy filters. For example, administrators can configure security or privacy
  policy filters to include the list of inappropriate words that security or privacy
  policy mechanisms check in accordance with the definitions provided by organizations.
