id: dcf929b6-6fc4-49c5-9d62-5b80104ac830
externalId: IA-5(18)
name: Authenticator Management | Password Managers
description: '(a) Employ [Assignment: organization-defined password managers] to generate
  and manage passwords; and (b) Protect the passwords using [Assignment: organization-defined
  controls].'
elementType: enhancement
parent: ia-5
guidance: For systems where static passwords are employed, it is often a challenge
  to ensure that the passwords are suitably complex and that the same passwords are
  not employed on multiple systems. A password manager is a solution to this problem
  as it automatically generates and stores strong and different passwords for various
  accounts. A potential risk of using password managers is that adversaries can target
  the collection of passwords generated by the password manager. Therefore, the collection
  of passwords requires protection including encrypting the passwords (see) and storing
  the collection offline in a token.
