id: de0ea50b-578b-49cf-8a35-88977b399fc0
externalId: PE-5
name: Access Control for Output Devices
description: 'Control physical access to output from [Assignment: organization-defined
  output devices] to prevent unauthorized individuals from obtaining the output.'
elementType: control
parent: pe
guidance: Controlling physical access to output devices includes placing output devices
  in locked rooms or other secured areas with keypad or card reader access controls
  and allowing access to authorized individuals only, placing output devices in locations
  that can be monitored by personnel, installing monitor or screen filters, and using
  headphones. Examples of output devices include monitors, printers, scanners, audio
  devices, facsimile machines, and copiers.
