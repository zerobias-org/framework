id: 91fa7f5e-67ee-46ee-a7ed-7fbf67beb9e7
externalId: CP-4
name: Contingency Plan Testing
description: Tests the contingency plan on a defined schedule to determine its effectiveness,
  reviews the results, and initiates corrective actions as needed.
elementType: control
parent: cp
guidance: Methods for testing contingency plans to determine the effectiveness of
  the plans and identify potential weaknesses include checklists, walk-through and
  tabletop exercises, simulations (parallel or full interrupt), and comprehensive
  exercises. Organizations conduct testing based on the requirements in contingency
  plans and include a determination of the effects on organizational operations, assets,
  and individuals due to contingency operations. Organizations have flexibility and
  discretion in the breadth, depth, and timelines of corrective actions.
