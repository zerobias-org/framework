externalId: MP-8(1)
name: Media Downgrading | Documentation of Process
description: Document system media downgrading actions.
elementType: enhancement
parent: mp-8
guidance: Organizations can document the media downgrading process by providing information,
  such as the downgrading technique employed, the identification number of the downgraded
  media, and the identity of the individual that authorized and/or performed the downgrading
  action.
