id: 371c2408-5e0f-4a81-a85a-8647e5a4c5de
externalId: SI-4(4)
name: System Monitoring | Inbound and Outbound Communications Traffic
description: Determines criteria for unusual or unauthorized communications activity
  and monitors inbound and outbound traffic against those criteria.
elementType: enhancement
parent: si-4
guidance: Unusual or unauthorized activities or conditions related to system inbound
  and outbound communications traffic includes internal traffic that indicates the
  presence of malicious code or unauthorized use of legitimate code or credentials
  within organizational systems or propagating among system components, signaling
  to external systems, and the unauthorized exporting of information. Evidence of
  malicious code or unauthorized use of legitimate code or credentials is used to
  identify potentially compromised systems or system components.
aliases:
