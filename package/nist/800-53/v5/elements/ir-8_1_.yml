id: 569fa4df-6667-4bb8-a5b5-c7771d169471
externalId: IR-8(1)
name: Incident Response Plan | Breaches
description: Include the following in the Incident Response Plan for breaches
  involving personally identifiable information:a. A process to determine if
  notice to individuals or other organizations, including oversight
  organizations, is needed;b. An assessment process to determine the extent of
  the harm, embarrassment, inconvenience, or unfairness to affected individuals
  and any mechanisms to mitigate such harms; andc. Identification of applicable
  privacy requirements.
elementType: control
