externalId: IR-8(1)
name: Incident Response Plan | Breaches
description: Includes a process to determine notification needs, assess harm, and
  identify privacy requirements in the plan for breaches involving PII.
elementType: enhancement
parent: ir-8
guidance: Organizations may be required by law, regulation, or policy to follow specific
  procedures relating to breaches, including notice to individuals, affected organizations,
  and oversight bodies; standards of harm; and mitigation or other specific requirements.
