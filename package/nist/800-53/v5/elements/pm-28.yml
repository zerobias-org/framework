id: 3887f372-c2c6-478f-8fd6-597c69761c1c
externalId: PM-28
name: Risk Framing
description: Identifies, documents, and distributes assumptions, constraints, priorities,
  and risk tolerance considered in the organization's risk framing.
elementType: control
parent: pm
guidance: Risk framing is most effective when conducted at the organization level
  and in consultation with stakeholders throughout the organization including mission,
  business, and system owners. The assumptions, constraints, risk tolerance, priorities,
  and trade-offs identified as part of the risk framing process inform the risk management
  strategy, which in turn informs the conduct of risk assessment, risk response, and
  risk monitoring activities. Risk framing results are shared with organizational
  personnel, including mission and business owners, information owners or stewards,
  system owners, authorizing officials, senior agency information security officer,
  senior agency official for privacy, and senior accountable official for risk management.
