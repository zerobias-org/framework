id: d55e6341-b58b-4769-807e-62e0b99f608d
externalId: RA-3(2)
name: Risk Assessment | Use of All-source Intelligence
description: Use all-source intelligence to assist in the analysis of risk.
elementType: enhancement
parent: ra-3
guidance: Organizations employ all-source intelligence to inform engineering, acquisition,
  and risk management decisions. All-source intelligence consists of information derived
  from all available sources, including publicly available or open-source information,
  measurement and signature intelligence, human intelligence, signals intelligence,
  and imagery intelligence. All-source intelligence is used to analyze the risk of
  vulnerabilities (both intentional and unintentional) from development, manufacturing,
  and delivery processes, people, and the environment. The risk analysis may be performed
  on suppliers at multiple tiers in the supply chain sufficient to manage risks. Organizations
  may develop agreements to share all-source intelligence information or resulting
  decisions with other organizations, as appropriate.
