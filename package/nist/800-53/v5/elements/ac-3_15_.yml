id: ce66fe4a-36b9-49b6-a47f-144e04f1643e
externalId: AC-3(15)
name: Access Enforcement | Discretionary and Mandatory Access Control
description: Enforces both a mandatory and a discretionary access control policy over
  the same set of covered subjects and objects.
elementType: enhancement
parent: ac-3
guidance: Simultaneously implementing a mandatory access control policy and a discretionary
  access control policy can provide additional protection against the unauthorized
  execution of code by users or processes acting on behalf of users. This helps prevent
  a single compromised user or process from compromising the entire system.
aliases:
