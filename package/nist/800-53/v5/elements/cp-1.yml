  management commitment, coordination among organizational entities, and
  compliance; andb. Is consistent with applicable laws, executive orders,
  directives, regulations, policies, standards, and guidelines; and2. Procedures
  to facilitate the implementation of the contingency planning policy and the
  associated contingency planning controls;b. Designate an [Assignment:
  organization-defined official] to manage the development, documentation, and
  dissemination of the contingency planning policy and procedures; andc. Review
  and update the current contingency planning:1. Policy [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]; and2. Procedures [Assignment:
  organization-defined frequency] and following [Assignment:
  organization-defined events]."
