id: af07d2dd-1e5d-4ba2-a668-b890897c879d
externalId: AC-4(10)
name: Information Flow Enforcement | Enable and Disable Security or Privacy Policy
  Filters
description: Lets privileged administrators enable and disable defined security or
  privacy policy filters under specified conditions.
elementType: enhancement
parent: ac-4
guidance: For example, as allowed by the system authorization, administrators can
  enable security or privacy policy filters to accommodate approved data types. Administrators
  also have the capability to select the filters that are executed on a specific data
  flow based on the type of data that is being transferred, the source and destination
  security domains, and other security or privacy relevant features, as needed.
