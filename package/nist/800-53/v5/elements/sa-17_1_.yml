id: e27b2bb7-5ff0-43aa-9232-4778ec70712c
externalId: SA-17(1)
name: Developer Security and Privacy Architecture and Design | Formal Policy Model
description: Requires the developer to produce and prove a formal policy model that
  is internally consistent and sufficient to enforce defined security and privacy
  policy.
elementType: enhancement
parent: sa-17
guidance: Formal models describe specific behaviors or security and privacy policies
  using formal languages, thus enabling the correctness of those behaviors and policies
  to be formally proven. Not all components of systems can be modeled. Generally,
  formal specifications are scoped to the behaviors or policies of interest, such
  as nondiscretionary access control policies. Organizations choose the formal modeling
  language and approach based on the nature of the behaviors and policies to be described
  and the available tools.
aliases:
