id: b1360477-f247-4d4a-8ae7-596927a198b2
externalId: SA-4(6)
name: Acquisition Process | Use of Information Assurance Products
description: a. Employ only government off-the-shelf or commercial off-the-shelf
  information assurance and information assurance-enabled information technology
  products that compose an NSA-approved solution to protect classified
  information when the networks used to transmit the information are at a lower
  classification level than the information being transmitted; andb. Ensure that
  these products have been evaluated and/or validated by NSA or in accordance
  with NSA-approved procedures.
elementType: control
