id: b1360477-f247-4d4a-8ae7-596927a198b2
externalId: SA-4(6)
name: Acquisition Process | Use of Information Assurance Products
description: Requires use of NSA-approved information assurance products to protect
  classified information on lower-classification networks, evaluated per NSA procedures.
elementType: enhancement
parent: sa-4
guidance: Commercial off-the-shelf IA or IA-enabled information technology products
  used to protect classified information by cryptographic means may be required to
  use NSA-approved key management. See NSA CSFC.
