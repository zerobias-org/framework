id: b6afdc41-45f8-4414-873c-1c1e23bf4b4d
externalId: CM-4(1)
name: Impact Analyses | Separate Test Environments
description: Analyzes system changes in a separate test environment before operational
  implementation to identify security and privacy impacts.
elementType: enhancement
parent: cm-4
guidance: A separate test environment requires an environment that is physically or
  logically separate and distinct from the operational environment. The separation
  is sufficient to ensure that activities in the test environment do not impact activities
  in the operational environment and that information in the operational environment
  is not inadvertently transmitted to the test environment. Separate environments
  can be achieved by physical or logical means. If physically separate test environments
  are not implemented, organizations determine the strength of mechanism required
  when implementing logical separation.
aliases:
