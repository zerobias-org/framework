id: ba5d0ccd-afe0-4251-b876-083284693ded
externalId: SC-3(2)
name: Security Function Isolation | Access and Flow Control Functions
description: Isolate security functions enforcing access and information flow control
  from nonsecurity functions and from other security functions.
elementType: enhancement
parent: sc-3
guidance: Security function isolation occurs because of implementation. The functions
  can still be scanned and monitored. Security functions that are potentially isolated
  from access and flow control enforcement functions include auditing, intrusion detection,
  and malicious code protection functions.
aliases:
