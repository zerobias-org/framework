id: 0b79d41f-6385-4596-9004-37b59feba7d4
externalId: SI-2(5)
name: Flaw Remediation | Automatic Software and Firmware Updates
description: 'Install [Assignment: organization-defined security-relevant software
  and firmware updates] automatically to [Assignment: organization-defined system
  components].'
elementType: enhancement
parent: si-2
guidance: Due to system integrity and availability concerns, organizations consider
  the methodology used to carry out automatic updates. Organizations balance the need
  to ensure that the updates are installed as soon as possible with the need to maintain
  configuration management and control with any mission or operational impacts that
  automatic updates might impose.
