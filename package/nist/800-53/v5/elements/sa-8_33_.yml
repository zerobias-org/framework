id: 317cbb53-fc0a-4b1f-92d5-05d8e7a52f7e
externalId: SA-8(33)
name: Security and Privacy Engineering Principles | Minimization
description: 'Implement the privacy principle of minimization using [Assignment: organization-defined
  processes].'
elementType: enhancement
parent: sa-8
guidance: The principle of minimization states that organizations should only process
  personally identifiable information that is directly relevant and necessary to accomplish
  an authorized purpose and should only maintain personally identifiable information
  for as long as is necessary to accomplish the purpose. Organizations have processes
  in place, consistent with applicable laws and policies, to implement the principle
  of minimization.
