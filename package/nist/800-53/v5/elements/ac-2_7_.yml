id: 39ce08c3-ed40-4d25-a9b3-fab292d8e0a9
externalId: AC-2(7)
name: Account Management | Privileged User Accounts
description: Establishes and monitors privileged user accounts by role or attribute,
  and revokes access when it is no longer appropriate.
elementType: enhancement
parent: ac-2
guidance: Privileged roles are organization-defined roles assigned to individuals
  that allow those individuals to perform certain security-relevant functions that
  ordinary users are not authorized to perform. Privileged roles include key management,
  account management, database administration, system and network administration,
  and web administration. A role-based access scheme organizes permitted system access
  and privileges into roles. In contrast, an attribute-based access scheme specifies
  allowed system access and privileges based on attributes.
aliases:
