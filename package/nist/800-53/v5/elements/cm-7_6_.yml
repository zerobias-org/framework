name: Least Functionality | Confined Environments with Limited Privileges
description: 'Require that the following user-installed software execute in a confined
  physical or virtual machine environment with limited privileges: [Assignment: organization-defined
  user-installed software].'
elementType: enhancement
parent: cm-7
guidance: Organizations identify software that may be of concern regarding its origin
  or potential for containing malicious code. For this type of software, user installations
  occur in confined environments of operation to limit or contain damage from malicious
  code that may be executed.
