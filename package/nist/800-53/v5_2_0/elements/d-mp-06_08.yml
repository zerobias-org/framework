id: a2e4b02c-1c6a-4c41-b3d8-292ec1f42a87
name: <p>Remote purging or wiping of information protects information on organizational systems and system components if systems or components are obtained by unauthorized individuals. Remote purge or wipe commands require strong authentication to help mitigate the risk of unauthorized individuals purging or wiping the system, component, or device. The purge or wipe function can be implemented in a variety of ways, including by overwriting data or information multiple times or by destroying the key necessary to decrypt encrypted data.</p>
elementType: discussion
externalId: D-MP-06(08)
