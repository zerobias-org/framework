name: '<p>Information management and retention requirements cover the full life cycle of information, in some cases extending beyond system disposal. Information to be retained may also include policies, procedures, plans, reports, data output from control implementation, and other types of administrative information. The National Archives and Records Administration (NARA) provides federal policy and guidance on records retention and schedules. If organizations have a records management office, consider coordinating with records management personnel. Records produced from the output of implemented controls that may require management and retention include, but are not limited to: All XX-1, <a href="#ac-06.09">AC-06(09)</a>, <a href="#at-04">AT-04</a>, <a href="#au-12">AU-12</a>, <a href="#ca-02">CA-02</a>, <a href="#ca-03">CA-03</a>, <a href="#ca-05">CA-05</a>, <a href="#ca-06">CA-06</a>, <a href="#ca-07">CA-07</a>, <a href="#ca-08">CA-08</a>, <a href="#ca-09">CA-09</a>, <a href="#cm-02">CM-02</a>, <a href="#cm-03">CM-03</a>, <a href="#cm-04">CM-04</a>, <a href="#cm-06">CM-06</a>, <a href="#cm-08">CM-08</a>, <a href="#cm-09">CM-09</a>, <a href="#cm-12">CM-12</a>, <a href="#cm-13">CM-13</a>, <a href="#cp-02">CP-02</a>, <a href="#ir-06">IR-06</a>, <a href="#ir-08">IR-08</a>, <a href="#ma-02">MA-02</a>, <a href="#ma-04">MA-04</a>, <a href="#pe-02">PE-02</a>, <a href="#pe-08">PE-08</a>, <a href="#pe-16">PE-16</a>, <a href="#pe-17">PE-17</a>, <a href="#pl-02">PL-02</a>, <a href="#pl-04">PL-04</a>, <a href="#pl-07">PL-07</a>, <a href="#pl-08">PL-08</a>, <a href="#pm-05">PM-05</a>, <a href="#pm-08">PM-08</a>, <a href="#pm-09">PM-09</a>, <a href="#pm-18">PM-18</a>, <a href="#pm-21">PM-21</a>, <a href="#pm-27">PM-27</a>, <a href="#pm-28">PM-28</a>, <a href="#pm-30">PM-30</a>, <a href="#pm-31">PM-31</a>, <a href="#ps-02">PS-02</a>, <a href="#ps-06">PS-06</a>, <a href="#ps-07">PS-07</a>, <a href="#pt-02">PT-02</a>, <a href="#pt-03">PT-03</a>, <a href="#pt-07">PT-07</a>, <a hre