id: f4fa20e6-23ad-45e6-99f4-a218755a0f7f
name: <p>Classes of incidents include malfunctions due to design or implementation errors and omissions, targeted malicious attacks, and untargeted malicious attacks. Incident response actions include orderly system degradation, system shutdown, fall back to manual mode or activation of alternative technology whereby the system operates differently, employing deceptive measures, alternate information flows, or operating in a mode that is reserved for when systems are under attack. Organizations consider whether continuity of operations requirements during an incident conflict with the capability to automatically disable the system as specified as part of <a href="#ir-04.05">IR-04(05)</a>.</p>
elementType: discussion
externalId: D-IR-04(03)
