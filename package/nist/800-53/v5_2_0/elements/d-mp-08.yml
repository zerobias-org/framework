id: 89b281c6-5d66-4e14-b4c9-cf8e22f5d93a
name: <p>Media downgrading applies to digital and non-digital media subject to release outside of the organization, whether the media is considered removable or not. When applied to system media, the downgrading process removes information from the media, typically by security category or classification level, such that the information cannot be retrieved or reconstructed. Downgrading of media includes redacting information to enable wider release and distribution. Downgrading ensures that empty space on the media is devoid of information.</p>
elementType: discussion
externalId: D-MP-08
