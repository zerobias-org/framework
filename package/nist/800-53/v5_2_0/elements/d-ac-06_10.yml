id: 05af16f5-d15e-40c0-9737-f0b0386d4d53
name: <p>Privileged functions include disabling, circumventing, or altering implemented security or privacy controls, establishing system accounts, performing system integrity checks, and administering cryptographic key management activities. Non-privileged users are individuals who do not possess appropriate authorizations. Privileged functions that require protection from non-privileged users include circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms. Preventing non-privileged users from executing privileged functions is enforced by <a href="#ac-03">AC-03</a>.</p>
elementType: discussion
externalId: D-AC-06(10)
