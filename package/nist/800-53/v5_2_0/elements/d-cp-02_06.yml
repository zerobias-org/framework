id: 0c40c27b-3b73-4481-9a9e-c95fec139d35
name: <p>Organizations may choose to conduct contingency planning activities for alternate processing and storage sites as part of business continuity planning or business impact analyses. Primary processing and/or storage sites defined by organizations as part of contingency planning may change depending on the circumstances associated with the contingency. </p>
elementType: discussion
externalId: D-CP-02(06)
