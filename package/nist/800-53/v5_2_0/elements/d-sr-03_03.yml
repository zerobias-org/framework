id: 2d24909b-3609-468a-b12a-00c27f02a0c0
name: <p>To manage supply chain risk effectively and holistically, it is important that organizations ensure that supply chain risk management controls are included at all tiers in the supply chain. This includes ensuring that Tier 1 (prime) contractors have implemented processes to facilitate the <q>flow down</q> of supply chain risk management controls to sub-tier contractors. The controls subject to flow down are identified in <a href="#sr-03_smt.b">SR-03b</a>.</p>
elementType: discussion
externalId: D-SR-03(03)
