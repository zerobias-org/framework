id: 33e11b1e-b6b4-42e2-bb28-34e2812b4e6e
name: <p>The selection of cryptographic mechanisms is based on the need to protect the confidentiality and integrity of backup information. The strength of mechanisms selected is commensurate with the security category or classification of the information. Cryptographic protection applies to system backup information in storage at both primary and alternate locations. Organizations that implement cryptographic mechanisms to protect information at rest also consider cryptographic key management solutions. </p>
elementType: discussion
externalId: D-CP-09(08)
