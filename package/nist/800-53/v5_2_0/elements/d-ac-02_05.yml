id: cea30ed4-58b5-4d20-b63f-3a28db8b7b88
name: <p>Inactivity logout is behavior- or policy-based and requires users to take physical action to log out when they are expecting inactivity longer than the defined period. Automatic enforcement of inactivity logout is addressed by <a href="#ac-11">AC-11</a>.</p>
elementType: discussion
externalId: D-AC-02(05)
