id: 2f3c79f8-2c05-41fe-b9d2-d0487f770795
name: <p>Organizations can implement tamper detection and prevention at selected hardware components or implement tamper detection at some components and tamper prevention at other components. Detection and prevention activities can employ many types of anti-tamper technologies, including tamper-detection seals and anti-tamper coatings. Anti-tamper programs help to detect hardware alterations through counterfeiting and other supply chain-related risks.</p>
elementType: discussion
externalId: D-PE-03(05)
