name: D-PL-08
description: |-
  <p>The security and privacy architectures at the system level are consistent with the organization-wide security and privacy architectures described in <a href="#pm-07">PM-07</a>, which are integral to and developed as part of the enterprise architecture. The architectures include an architectural description, the allocation of security and privacy functionality (including controls), security- and privacy-related information for external interfaces, information being exchanged across the interfaces, and the protection mechanisms associated with each interface. The architectures can also include other information, such as user roles and the access privileges assigned to each role; security and privacy requirements; types of information processed, stored, and transmitted by the system; supply chain risk management requirements; restoration priorities of information and system services; and other protection needs.</p>
  <p><a href="https://doi.org/10.6028/NIST.SP.800-160v1">SP 800-160-1</a> provides guidance on the use of security architectures as part of the system development life cycle process. <a href="https://www.whitehouse.gov/wp-content/uploads/2018/12/M-19-03.pdf">OMB M-19-03</a> requires the use of the systems security engineering concepts described in <a href="https://doi.org/10.6028/NIST.SP.800-160v1">SP 800-160-1</a> for high value assets. Security and privacy architectures are reviewed and updated throughout the system development life cycle, from analysis of alternatives through review of the proposed architecture in the RFP responses to the design reviews before and during implementation (e.g., during preliminary design reviews and critical design reviews).</p>
  <p>In today&rsquo;s modern computing architectures, it is becoming less common for organizations to control all information resources. There may be key dependencies on external information services and service providers. Describing such dependencies in the security and privacy architectures is necessary for developing a comprehensive mission and business protection strategy. Establishing, developing, documenting, and maintaining under configuration control a baseline configuration for organizational systems is critical to implementing and maintaining effective architectures. The development of the architectures is coordinated with the senior agency information security officer and the senior agency official for privacy to ensure that the controls needed to support security and privacy requirements are identified and effectively implemented. In many circumstances, there may be no distinction between the security and privacy architecture for a system. In other circumstances, security objectives may be adequately satisfied, but privacy objectives may only be partially satisfied by the security requirements. In these cases, consideration of the privacy requirements needed to achieve satisfaction will result in a distinct privacy architecture. The documentation, however, may simply reflect the combined architectures.</p>
  <p><a href="#pl-08">PL-08</a> is primarily directed at organizations to ensure that architectures are developed for the system and, moreover, that the architectures are integrated with or tightly coupled to the enterprise architecture. In contrast, <a href="#sa-17">SA-17</a> is primarily directed at the external information technology product and system developers and integrators. <a href="#sa-17">SA-17</a>, which is complementary to <a href="#pl-08">PL-08</a>, is selected when organizations outsource the development of systems or components to external entities and when there is a need to demonstrate consistency with the organization&rsquo;s enterprise architecture and security and privacy architectures.</p>
