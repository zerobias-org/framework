id: 13613c14-3855-4c7d-b643-3fc32f07aaee
name: <p>Remote access to organizational information by non-organizational entities can increase the risk of unauthorized use and disclosure about remote access mechanisms. The organization considers including remote access requirements in the information exchange agreements with other organizations, as applicable. Remote access requirements can also be included in rules of behavior (see <a href="#pl-04">PL-04</a>) and access agreements (see <a href="#ps-06">PS-06</a>).</p>
elementType: discussion
externalId: D-AC-17(06)
