id: eb7bbbee-8ffd-4e56-82ba-a1b6d0d45ab6
name: <p>The principle of minimization states that organizations should only process personally identifiable information that is directly relevant and necessary to accomplish an authorized purpose and should only maintain personally identifiable information for as long as is necessary to accomplish the purpose. Organizations have processes in place, consistent with applicable laws and policies, to implement the principle of minimization.</p>
elementType: discussion
externalId: D-SA-08(33)
