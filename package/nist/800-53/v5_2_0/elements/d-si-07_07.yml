id: ea28f694-9254-4d7a-a52b-1fd55ac6f788
name: <p>Integrating detection and response helps to ensure that detected events are tracked, monitored, corrected, and available for historical purposes. Maintaining historical records is important for being able to identify and discern adversary actions over an extended time period and for possible legal actions. Security-relevant changes include unauthorized changes to established configuration settings or the unauthorized elevation of system privileges.</p>
elementType: discussion
externalId: D-SI-07(07)
