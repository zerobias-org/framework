id: 9cc6f821-122f-408a-bfda-89a9b7a94082
name: <p>Reviewing the current list of open-source information sites being monitored on a regular basis helps to ensure that the selected sites remain relevant. The review also provides the opportunity to add new open-source information sites with the potential to provide evidence of unauthorized disclosure of organizational information. The list of sites monitored can be guided and informed by threat intelligence of other credible sources of information. </p>
elementType: discussion
externalId: D-AU-13(02)
