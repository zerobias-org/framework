id: aa91db34-432b-4b57-ae54-ae16175e92ef
name: <p>Prevention of program execution addresses organizational policies, rules of behavior, and/or access agreements that restrict software usage and the terms and conditions imposed by the developer or manufacturer, including software licensing and copyrights. Restrictions include prohibiting auto-execute features, restricting roles allowed to approve program execution, permitting or prohibiting specific software programs, or restricting the number of program instances executed at the same time.</p>
elementType: discussion
externalId: D-CM-07(02)
