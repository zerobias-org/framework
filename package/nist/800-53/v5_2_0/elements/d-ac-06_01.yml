id: 1c8213a1-adc3-4b6e-a009-6d893a42c4f1
name: <p>Security functions include establishing system accounts, configuring access authorizations (i.e., permissions, privileges), configuring settings for events to be audited, and establishing intrusion detection parameters. Security-relevant information includes filtering rules for routers or firewalls, configuration parameters for security services, cryptographic key management information, and access control lists. Authorized personnel include security administrators, system administrators, system security officers, system programmers, and other privileged users.</p>
elementType: discussion
externalId: D-AC-06(01)
