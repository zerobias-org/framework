id: b1c099f5-7af3-4a4a-b8fd-648cf0d8d581
name: <p>Cryptographic key management and establishment can be performed using manual procedures or automated mechanisms with supporting manual procedures. Organizations define key management requirements in accordance with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines and specify appropriate options, parameters, and levels. Organizations manage trust stores to ensure that only approved trust anchors are part of such trust stores. This includes certificates with visibility external to organizational systems and certificates related to the internal operations of systems. <a xmlns="" href="https://csrc.nist.gov/projects/cryptographic-module-validation-program">NIST CMVP</a> and <a xmlns="" href="https://csrc.nist.gov/projects/cryptographic-algorithm-validation-program">NIST CAVP</a> provide additional information on validated cryptographic modules and algorithms that can be used in cryptographic key management and establishment.</p>
elementType: discussion
externalId: D-SC-12
