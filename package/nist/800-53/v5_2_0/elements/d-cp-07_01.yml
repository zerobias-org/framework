id: 4c0364d9-02b0-4f73-bf3b-8e63192263d4
name: <p>Threats that affect alternate processing sites are defined in organizational assessments of risk and include natural disasters, structural failures, hostile attacks, and errors of omission or commission. Organizations determine what is considered a sufficient degree of separation between primary and alternate processing sites based on the types of threats that are of concern. For threats such as hostile attacks, the degree of separation between sites is less relevant.</p>
elementType: discussion
externalId: D-CP-07(01)
