name: <p>Due to system integrity and availability concerns, organizations consider the methodology used to carry out automatic updates. Organizations balance the need to ensure that the updates are installed as soon as possible with the need to maintain configuration management and control, and with any mission or operational impacts that automatic updates might impose (i.e., implementing a staggered deployment strategy).</p>
elementType: discussion
externalId: D-SI-02(05)
