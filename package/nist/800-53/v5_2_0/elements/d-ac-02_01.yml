id: 7d99ee51-a6c8-4989-87c6-f3f1254a6a00
name: <p>Automated system account management includes using automated mechanisms to create, enable, modify, disable, and remove accounts; notify account managers when an account is created, enabled, modified, disabled, or removed, or when users are terminated or transferred; monitor system account usage; and report atypical system account usage. Automated mechanisms can include internal system functions and email, telephonic, and text messaging notifications.</p>
elementType: discussion
externalId: D-AC-02(01)
