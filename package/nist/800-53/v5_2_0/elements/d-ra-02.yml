name: <p>Security categories describe the potential adverse impacts or negative consequences to organizational operations, organizational assets, and individuals if organizational information and systems are compromised through a loss of confidentiality, integrity, or availability. Security categorization is also a type of asset loss characterization in systems security engineering processes that is carried out throughout the system development life cycle. Organizations can use privacy risk assessments or privacy impact assessments to better understand the potential adverse effects on individuals. <a xmlns="" href="https://www.cnss.gov/CNSS/issuances/Instructions.cfm">CNSSI 1253</a> provides additional guidance on categorization for national security systems.</p><p>Organizations conduct the security categorization process as an organization-wide activity with the direct involvement of chief information officers, senior agency information security officers, senior agency officials for privacy, system owners, mission and business owners, and information owners or stewards. Organizations consider the potential adverse impacts to other organizations and, in accordance with <a xmlns="" href="https://www.congress.gov/107/plaws/publ56/PLAW-107publ56.pdf">USA PATRIOT</a> and Homeland Security Presidential Directives, potential national-level adverse impacts.</p><p>Security categorization processes facilitate the development of inventories of information assets and, along with <a href="#cm-8">CM-8</a>, mappings to specific system components where information is processed, stored, or transmitted. The security categorization process is revisited throughout the system development life cycle to ensure that the security categories remain accurate and relevant.</p>
