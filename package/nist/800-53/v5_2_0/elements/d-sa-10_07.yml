id: 1b7666a7-72cb-4f97-af8f-21123c4670d5
name: <p>Information security and privacy representatives can include system security officers, senior agency information security officers, senior agency officials for privacy, and system privacy officers. Representation by personnel with information security and privacy expertise is important because changes to system configurations can have unintended side effects, some of which may be security- or privacy-relevant. Detecting such changes early in the process can help avoid unintended, negative consequences that could ultimately affect the security and privacy posture of systems. The configuration change management and control process in this control enhancement refers to the change management and control process defined by organizations in <a href="#sa-10_smt.b">SA-10b</a>.</p>
elementType: discussion
externalId: D-SA-10(07)
