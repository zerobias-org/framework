id: 869d25ee-ff2d-41ac-a2ce-d6d836904127
name: <p>The association of security and privacy attributes to information within systems is important for conducting automated access enforcement and flow enforcement actions. The association of such attributes to information (i.e., binding) can be accomplished with technologies and techniques that provide different levels of assurance. For example, systems can cryptographically bind attributes to information using digital signatures that support cryptographic keys protected by hardware devices (sometimes known as hardware roots of trust).</p>
elementType: discussion
externalId: D-AC-16(08)
