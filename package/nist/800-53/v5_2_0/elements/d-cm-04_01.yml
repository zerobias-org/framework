id: 351a6ec0-5b02-46ea-a5c7-63f9f358566b
name: <p>A separate test environment requires an environment that is physically or logically separate and distinct from the operational environment. The separation is sufficient to ensure that activities in the test environment do not impact activities in the operational environment and that information in the operational environment is not inadvertently transmitted to the test environment. Separate environments can be achieved by physical or logical means. If physically separate test environments are not implemented, organizations determine the strength of mechanism required when implementing logical separation.</p>
elementType: discussion
externalId: D-CM-04(01)
