id: 8460833e-55b5-46a9-b83c-d6bf7adffc33
name: <p>Data tags support the tracking of processing purposes by conveying the purposes along with the relevant elements of personally identifiable information throughout the system. By conveying the processing purposes in a data tag along with the personally identifiable information as the information transits a system, a system owner or operator can identify whether a change in processing would be compatible with the identified and documented purposes. Data tags may also support the use of automated tools.</p>
elementType: discussion
externalId: D-PT-03(01)
