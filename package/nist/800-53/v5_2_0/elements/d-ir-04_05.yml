id: cb419b2f-f97c-4e1a-b23c-d28c82d49524
name: <p>Organizations consider whether the capability to automatically disable the system conflicts with continuity of operations requirements specified as part of <a href="#cp-02">CP-02</a> or <a href="#ir-04.03">IR-04(03)</a>. Security violations include cyber-attacks that have compromised the integrity of the system or exfiltrated organizational information and serious errors in software programs that could adversely impact organizational missions or functions or jeopardize the safety of individuals.</p>
elementType: discussion
externalId: D-IR-04(05)
