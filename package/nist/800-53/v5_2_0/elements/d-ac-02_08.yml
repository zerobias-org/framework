id: 5d4f26e0-4973-4b48-ac86-64de4c50b403
name: <p>Approaches for dynamically creating, activating, managing, and deactivating system accounts rely on automatically provisioning the accounts at runtime for entities that were previously unknown. Organizations plan for the dynamic management, creation, activation, and deactivation of system accounts by establishing trust relationships, business rules, and mechanisms with appropriate authorities to validate related authorizations and privileges.</p>
elementType: discussion
externalId: D-AC-02(08)
