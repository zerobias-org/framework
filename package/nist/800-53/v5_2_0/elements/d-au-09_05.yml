id: 685eabb0-69da-4259-b335-680cb848ef85
name: <p>Organizations may choose different selection options for different types of audit information. Dual authorization mechanisms (also known as two-person control) require the approval of two authorized individuals to execute audit functions. To reduce the risk of collusion, organizations consider rotating dual authorization duties to other individuals. Organizations do not require dual authorization mechanisms when immediate responses are necessary to ensure public and environmental safety.</p>
elementType: discussion
externalId: D-AU-09(05)
