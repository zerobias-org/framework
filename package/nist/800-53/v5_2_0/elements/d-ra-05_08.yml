id: 31e2d1f7-0420-4075-8d94-91750b2d5f5a
name: <p>Reviewing historic audit logs to determine if a recently detected vulnerability in a system has been previously exploited by an adversary can provide important information for forensic analyses. Such analyses can help identify, for example, the extent of a previous intrusion, the trade craft employed during the attack, organizational information exfiltrated or modified, mission or business capabilities affected, and the duration of the attack.</p>
elementType: discussion
externalId: D-RA-05(08)
