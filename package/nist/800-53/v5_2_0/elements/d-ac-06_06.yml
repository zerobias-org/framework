id: d98a5583-9d3f-4a2a-855f-004c07cc7e15
name: <p>An organizational user is an employee or an individual considered by the organization to have the equivalent status of an employee. Organizational users include contractors, guest researchers, or individuals detailed from other organizations. A non-organizational user is a user who is not an organizational user. Policies and procedures for granting equivalent status of employees to individuals include a need-to-know, citizenship, and the relationship to the organization.</p>
elementType: discussion
externalId: D-AC-06(06)
