name: <p>Protecting session authenticity addresses communications protection at the session level, not at the packet level. Such protection establishes grounds for confidence at both ends of communications sessions in the ongoing identities of other parties and the validity of transmitted information. Authenticity protection includes protecting against <q>man-in-the-middle</q> attacks, session hijacking, and the insertion of false information into sessions.</p>
