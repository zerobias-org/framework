id: 01ba6814-a9b6-4a17-8a9b-d0776aba2331
name: 'IDENTITY PROVIDERS AND AUTHORIZATION SERVERS: The control statement for this proposal is extremely vague as to what managing entails. The justification of this control is to address a gap within identity and access management systems; thus, the statement should be more explicit as to what ends the providers should further manage authorization and authentication. Within the discussion, the purpose again references management as a way to fill the gap within the systems but fails to elaborate any further on what should be done within the management of the systems. The discussion should instead be entirely rewritten to state what management controls should be implemented to address the specific gap within identity and access management systems stated within the justification statement. PROTECTION OF CRYPTOGRAPHIC KEYS: Overall, this additional control does not offer any new concepts already outlined within SC-12 and SC-13 and is unnecessary in its current writing. The control statement is almost the same as SC-12 but is more of a definition than a statement regarding a security control to be implemented. As in, the control statement does not direct any actions other than to protect from disclosure and misuse. The control statement should instead direct the establishment of a system to ensure the safeguard of cryptographic keys to an organizationally determined level and call relevant assignments such as [Assignment: organization-defined requirements for key generation, distribution, storage, access, and destruction]. VERIFICATION OF IDENTITY ASSERTIONS AND ACCESS TOKENS: To address the potential gap in controls, this control should instead be replaced by implementing a new way for organizations to verify that the identity providers and authorization servers are in a verifiable and auditable state. Authentication and verification of digital signatures are performed automatically, so the concern should be more focused on ensuring the automation is done correctly. Creating an additional measure to verify that the systems providing the private keys are working as intended would better suit the justification.'
