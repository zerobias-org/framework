id: e61b3499-bb64-4b43-85f3-73aa0fadcc0a
name: <p>To enforce security and privacy policies across multiple system components in distributed systems, organizations provide a consistent interpretation of security and privacy attributes employed in access enforcement and flow enforcement decisions. Organizations can establish agreements and processes to help ensure that distributed system components implement attributes with consistent interpretations in automated access enforcement and flow enforcement actions.</p>
elementType: discussion
externalId: D-AC-16(07)
