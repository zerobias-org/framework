id: 0d6adc57-4abc-4aed-b7e4-411f1e51b707
name: <p>Retaining information longer than is needed makes the information a potential target for advanced adversaries searching for high value assets to compromise through unauthorized disclosure, unauthorized modification, or exfiltration. For system-related information, unnecessary retention provides advanced adversaries information that can assist in their reconnaissance and lateral movement through the system.</p>
elementType: discussion
externalId: D-SI-14(02)
