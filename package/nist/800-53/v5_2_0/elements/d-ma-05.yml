id: c5a177aa-c698-47bc-8472-fe30274b1785
name: <p>Maintenance personnel refers to individuals who perform hardware or software maintenance on organizational systems, while <a href="#pe-2">PE-2</a> addresses physical access for individuals whose maintenance duties place them within the physical protection perimeter of the systems. Technical competence of supervising individuals relates to the maintenance performed on the systems, while having required access authorizations refers to maintenance on and near the systems. Individuals not previously identified as authorized maintenance personnel—such as information technology manufacturers, vendors, systems integrators, and consultants—may require privileged access to organizational systems, such as when they are required to conduct maintenance activities with little or no notice. Based on organizational assessments of risk, organizations may issue temporary credentials to these individuals. Temporary credentials may be for one-time use or for very limited time periods.</p>
elementType: discussion
