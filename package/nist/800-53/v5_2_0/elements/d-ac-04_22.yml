id: 9210484b-a8f2-4a2c-8487-158e4f8ebc9d
name: <p>The system provides a capability for users to access each connected security domain without providing any mechanisms to allow users to transfer data or information between the different security domains. An example of an access-only solution is a terminal that provides a user access to information with different security classifications while assuredly keeping the information separate.</p>
elementType: discussion
externalId: D-AC-04(22)
