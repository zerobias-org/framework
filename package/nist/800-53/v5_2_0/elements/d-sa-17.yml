id: 06d9b50f-4d25-4b72-8846-ef9605daef67
name: <p>Developer security and privacy architecture and design are directed at external developers, although they could also be applied to internal (in-house) development. In contrast, <a href="#pl-8">PL-8</a> is directed at internal developers to ensure that organizations develop a security and privacy architecture that is integrated with the enterprise architecture. The distinction between SA-17 and <a href="#pl-8">PL-8</a> is especially important when organizations outsource the development of systems, system components, or system services and when there is a requirement to demonstrate consistency with the enterprise architecture and security and privacy architecture of the organization. <a xmlns="" href="https://www.commoncriteriaportal.org/files/ccfiles/CCPART2V3.1R5.pdf">ISO 15408-2</a>, <a xmlns="" href="https://www.commoncriteriaportal.org/files/ccfiles/CCPART3V3.1R5.pdf">ISO 15408-3</a>, and <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-160v1">SP 800-160-1</a> provide information on security architecture and design, including formal policy models, security-relevant components, formal and informal correspondence, conceptually simple design, and structuring for least privilege and testing.</p>
elementType: discussion
externalId: D-SA-17
