id: a105e657-2dac-40f9-8a3d-886aab2b0a16
name: <p>Preventing the discovery of system components representing a managed interface helps protect network addresses of those components from discovery through common tools and techniques used to identify devices on networks. Network addresses are not available for discovery and require prior knowledge for access. Preventing the discovery of components and devices can be accomplished by not publishing network addresses, using network address translation, or not entering the addresses in domain name systems. Another prevention technique is to periodically change network addresses.</p>
elementType: discussion
externalId: D-SC-07(16)
