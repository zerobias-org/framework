id: 7ad9ef02-9ad4-498c-aac6-2d2b28a2ebc8
name: <p>Dual authorization, also known as two-person control, reduces risk related to insider threats. Dual authorization mechanisms require the approval of two authorized individuals to execute. To reduce the risk of collusion, organizations consider rotating dual authorization duties. Organizations consider the risk associated with implementing dual authorization mechanisms when immediate responses are necessary to ensure public and environmental safety. </p>
elementType: discussion
externalId: D-AC-03(02)
