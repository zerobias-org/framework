name: <p>The identification of functions, ports, protocols, and services early in the system development life cycle (e.g., during the initial requirements definition and design stages) allows organizations to influence the design of the system, system component, or system service. This early involvement in the system development life cycle helps organizations avoid or minimize the use of functions, ports, protocols, or services that pose unnecessarily high risks and understand the trade-offs involved in blocking specific ports, protocols, or services or requiring system service providers to do so. Early identification of functions, ports, protocols, and services avoids costly retrofitting of controls after the system, component, or system service has been implemented. <a href="#sa-09">SA-09</a> describes the requirements for external system services. Organizations identify which functions, ports, protocols, and services are provided from external sources.</p>
elementType: discussion
externalId: D-SA-04(09)
