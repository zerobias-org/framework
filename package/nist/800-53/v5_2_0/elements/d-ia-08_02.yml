id: 46d48d9e-dd9b-4395-8fe0-eeb45c5250e9
name: <p>Acceptance of only NIST-compliant external authenticators applies to organizational systems that are accessible to the public (e.g., public-facing websites). External authenticators are issued by nonfederal government entities and are compliant with <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-63b">SP 800-63B</a>. Approved external authenticators meet or exceed the minimum Federal Government-wide technical, security, privacy, and organizational maturity requirements. Meeting or exceeding Federal requirements allows Federal Government relying parties to trust external authenticators in connection with an authentication transaction at a specified authenticator assurance level.</p>
elementType: discussion
externalId: D-IA-08(02)
