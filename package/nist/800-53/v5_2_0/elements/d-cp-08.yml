id: a1aeff05-e753-4fa7-a54c-b9f87b4679f8
name: <p>Telecommunications services (for data and voice) for primary and alternate processing and storage sites are in scope for <a href="#cp-08">CP-08</a>. Alternate telecommunications services reflect the continuity requirements in contingency plans to maintain essential mission and business functions despite the loss of primary telecommunications services. Organizations may specify different time periods for primary or alternate sites. Alternate telecommunications services include additional organizational or commercial ground-based circuits or lines, network-based approaches to telecommunications, or the use of satellites. Organizations consider factors such as availability, quality of service, and access when entering into alternate telecommunications agreements.</p>
elementType: discussion
externalId: D-CP-08
