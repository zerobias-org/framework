id: 6c7b6133-abb0-4539-83f7-662a1eb7bf22
name: <p>Classified information is the most sensitive information that the Federal Government processes, stores, or transmits. It is imperative that individuals have the requisite security clearances and system access authorizations prior to gaining access to such information. Access authorizations are enforced by system access controls (see <a href="#ac-03">AC-03</a>) and flow controls (see <a href="#ac-04">AC-04</a>).</p>
elementType: discussion
externalId: D-PS-03(01)
