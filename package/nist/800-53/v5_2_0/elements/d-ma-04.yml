id: f49910b5-95f7-4850-8a9d-e7251728c420
name: <p>Nonlocal maintenance and diagnostic activities are conducted by individuals who communicate through either an external or internal network. Local maintenance and diagnostic activities are carried out by individuals who are physically present at the system location and not communicating across a network connection. Authentication techniques used to establish nonlocal maintenance and diagnostic sessions reflect the network access requirements in <a href="#ia-02">IA-02</a>. Strong authentication requires authenticators that are resistant to replay attacks and employ multi-factor authentication. Strong authenticators include PKI where certificates are stored on a token protected by a password, passphrase, or biometric. Enforcing requirements in <a href="#ma-04">MA-04</a> is accomplished, in part, by other controls. <a href="https://doi.org/10.6028/NIST.SP.800-63b">SP 800-63B</a> provides additional guidance on strong authentication and authenticators.</p>
elementType: discussion
externalId: D-MA-04
