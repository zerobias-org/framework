id: 7a47bc35-25d8-4ef9-bf2f-1759f9e1c6f8
name: <p>The capability to dynamically isolate certain internal system components is useful when it is necessary to partition or separate system components of questionable origin from components that possess greater trustworthiness. Component isolation reduces the attack surface of organizational systems. Isolating selected system components can also limit the damage from successful attacks when such attacks occur.</p>
elementType: discussion
externalId: D-SC-07(20)
