id: ce5913b1-7f6f-4936-a829-cd1609ae167d
name: <p>Mapping integrity for version control addresses changes to hardware, software, and firmware components during both initial development and system development life cycle updates. Maintaining the integrity between the master copies of security-relevant hardware, software, and firmware (including designs, hardware drawings, source code) and the equivalent data in master copies in operational environments is essential to ensuring the availability of organizational systems that support critical mission and business functions.</p>
elementType: discussion
externalId: D-SA-10(05)
