id: 45d92401-4fd2-4eee-8fde-5ab7da778d86
name: <p>Monitoring physical access to systems provides additional monitoring for those areas within facilities where there is a concentration of system components, including server rooms, media storage areas, and communications centers. Physical access monitoring can be coordinated with intrusion detection systems and system monitoring capabilities to provide comprehensive and integrated threat coverage for the organization.</p>
elementType: discussion
externalId: D-PE-06(04)
