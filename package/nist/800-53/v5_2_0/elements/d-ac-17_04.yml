id: 80f4d87a-2df5-43bc-af20-15495c6bb1e9
name: <p>Remote access to systems represents a significant potential vulnerability that can be exploited by adversaries. As such, restricting the execution of privileged commands and access to security-relevant information via remote access reduces the exposure of the organization and the susceptibility to threats by adversaries to the remote access capability.</p>
elementType: discussion
externalId: D-AC-17(04)
