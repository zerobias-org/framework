name: <p>Organizations verify the integrity of software prior to execution to reduce the likelihood of executing malicious code or programs that contains errors from unauthorized modifications. Organizations consider the source of the software, ensuring the software and updates come from authorized sources and/or sites, and the practicality of approaches to verifying software integrity, including the availability of trustworthy checksums from software developers and vendors.&nbsp;</p>
elementType: discussion
externalId: D-SI-07(12)
