id: 7a62c25f-5e5c-4285-9c90-030269c66552
name: <p>Awareness that organizational sensors are collecting data enables individuals to more effectively engage in managing their privacy. Measures can include conventional written notices and sensor configurations that make individuals directly or indirectly aware through other devices that the sensor is collecting information. The usability and efficacy of the notice are important considerations.</p>
elementType: discussion
externalId: D-SC-42(04)
