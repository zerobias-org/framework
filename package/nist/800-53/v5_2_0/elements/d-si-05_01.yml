id: 2bf67c83-9e4d-47d4-b5f7-49f8b67cb812
name: <p>The significant number of changes to organizational systems and environments of operation requires the dissemination of security-related information to a variety of organizational entities that have a direct interest in the success of organizational mission and business functions. Based on information provided by security alerts and advisories, changes may be required at one or more of the three levels related to the management of risk, including the governance level, mission and business process level, and the information system level.</p>
elementType: discussion
externalId: D-SI-05(01)
