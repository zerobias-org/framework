id: 0868a229-b8d0-47ec-b7c9-c9b36a5730c0
name: <p>Part of verifying the integrity of transmitted information is ensuring that security and privacy attributes that are associated with such information have not been modified in an unauthorized manner. Unauthorized modification of security or privacy attributes can result in a loss of integrity for transmitted information.</p>
elementType: discussion
externalId: D-SC-16(01)
