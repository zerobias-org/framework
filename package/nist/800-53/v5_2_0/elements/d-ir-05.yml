id: 0c2c0a27-86f8-42dd-aa83-f8ef6cfd8e62
name: <p>Documenting incidents includes maintaining records about each incident, the status of the incident, and other pertinent information necessary for forensics as well as evaluating incident details, trends, and handling. Incident information can be obtained from a variety of sources, including network monitoring, incident reports, incident response teams, user complaints, supply chain partners, audit monitoring, physical access monitoring, and user and administrator reports. <a href="#ir-04">IR-04</a> provides information on the types of incidents that are appropriate for monitoring.</p>
elementType: discussion
externalId: D-IR-05
