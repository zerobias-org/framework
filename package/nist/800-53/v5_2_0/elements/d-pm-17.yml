name: <p>Controlled unclassified information is defined by the National Archives and Records Administration along with the safeguarding and dissemination requirements for such information and is codified in <a xmlns="" href="https://www.federalregister.gov/documents/2016/09/14/2016-21665/controlled-unclassified-information">32 CFR 2002</a> and, specifically for systems external to the federal organization, <a href="https://www.govinfo.gov/content/pkg/CFR-2017-title32-vol6/xml/CFR-2017-title32-vol6-part2002.xml">32 CFR 2002.14h</a>. The policy prescribes the specific use and conditions to be implemented in accordance with organizational procedures, including via its contracting processes.</p>
