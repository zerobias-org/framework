id: ad1cc3f5-e2cd-4495-907a-0db7def71dff
name: <p>A direct connection is a dedicated physical or virtual connection between two or more systems. Organizations typically do not have complete control over external networks, including the Internet. Boundary protection devices (e.g., firewalls, gateways, and routers) mediate communications and information flows between unclassified non-national security systems and external networks.</p>
elementType: discussion
externalId: D-SC-07(27)
