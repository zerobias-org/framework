name: <p><a href="#sc-36">SC-36</a> and <a href="#cp-09.06">CP-09(06)</a> require the duplication of systems or system components in distributed locations. The synchronization of duplicated and redundant services and data helps to ensure that information contained in the distributed locations can be used in the mission or business functions of organizations, as needed.</p>
