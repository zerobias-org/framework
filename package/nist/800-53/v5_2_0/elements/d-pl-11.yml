id: 96b5b6a4-3793-4d22-a005-51309255d1f8
name: <p>The concept of tailoring allows organizations to specialize or customize a set of baseline controls by applying a defined set of tailoring actions. Tailoring actions facilitate such specialization and customization by allowing organizations to develop security and privacy plans that reflect their specific mission and business functions, the environments where their systems operate, the threats and vulnerabilities that can affect their systems, and any other conditions or situations that can impact their mission or business success. Tailoring guidance is provided in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-53B">SP 800-53B</a>. Tailoring a control baseline is accomplished by identifying and designating common controls, applying scoping considerations, selecting compensating controls, assigning values to control parameters, supplementing the control baseline with additional controls as needed, and providing information for control implementation. The general tailoring actions in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-53B">SP 800-53B</a> can be supplemented with additional actions based on the needs of organizations. Tailoring actions can be applied to the baselines in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-53B">SP 800-53B</a> in accordance with the security and privacy requirements from <a xmlns="" href="https://www.congress.gov/113/plaws/publ283/PLAW-113publ283.pdf">FISMA</a>, <a xmlns="" href="https://www.govinfo.gov/content/pkg/STATUTE-88/pdf/STATUTE-88-Pg1896.pdf">PRIVACT</a>, and <a xmlns="" href="https://www.whitehouse.gov/sites/whitehouse.gov/files/omb/circulars/A130/a130revised.pdf">OMB A-130</a>. Alternatively, other communities of interest adopting different control baselines can apply the tailoring actions in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-53B">SP 800-53B</a> to specialize or customize the controls that represent the specific needs and concerns of those entities.</p>
