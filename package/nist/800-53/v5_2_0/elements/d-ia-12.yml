name: <p>Identity proofing is the process of collecting, validating, and verifying a user’s identity information for the purposes of establishing credentials for accessing a system. Identity proofing is intended to mitigate threats to the registration of users and the establishment of their accounts. Standards and guidelines specifying identity assurance levels for identity proofing include <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-63-3">SP 800-63-3</a> and <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-63a">SP 800-63A</a>. Organizations may be subject to laws, executive orders, directives, regulations, or policies that address the collection of identity evidence. Organizational personnel consult with the senior agency official for privacy and legal counsel regarding such requirements.</p>
elementType: discussion
externalId: D-IA-12
