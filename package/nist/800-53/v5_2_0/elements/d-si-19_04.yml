id: 3ab27aa7-d8a2-4633-9ead-530b169b691e
name: <p>There are many possible processes for removing direct identifiers from a dataset. Columns in a dataset that contain a direct identifier can be removed. In masking, the direct identifier is transformed into a repeating character, such as XXXXXX or 999999.  Identifiers can be encrypted or hashed so that the linked records remain linked. In the case of encryption or hashing, algorithms are employed that require the use of a key, including the Advanced Encryption Standard or a Hash-based Message Authentication Code. Implementations may use the same key for all identifiers or use a different key for each identifier. Using a different key for each identifier provides a higher degree of security and privacy. Identifiers can alternatively be replaced with a keyword, including transforming <q>George Washington</q> to <q>PATIENT</q> or replacing it with a surrogate value, such as transforming <q>George Washington</q> to <q>Abraham Polk.</q></p>
