id: 016a81e7-5e7b-4cc5-88ce-29b9013abeb4
name: <p>Content filtering is the process of inspecting information as it traverses a cross-domain solution and determines if the information meets a predefined policy. The use of linear content filter pipelines ensures that filter processes are non-bypassable and always invoked. In general, the use of parallel filtering architectures for content filtering of a single data type introduces bypass and non-invocation issues.</p>
elementType: discussion
externalId: D-AC-04(28)
