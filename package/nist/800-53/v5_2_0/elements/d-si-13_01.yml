id: c7e13cc4-d156-4b73-a2a4-cf16d0b65df9
name: <p>Transferring primary system component responsibilities to other substitute components prior to primary component failure is important to reduce the risk of degraded or debilitated mission or business functions. Making such transfers based on a percentage of mean time to failure allows organizations to be proactive based on their risk tolerance. However, the premature replacement of system components can result in the increased cost of system operations.</p>
elementType: discussion
externalId: D-SI-13(01)
