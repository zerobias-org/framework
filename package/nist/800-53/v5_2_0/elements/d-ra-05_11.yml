id: dfc789d4-614c-485a-9fd0-766c6d8531fc
name: <p>The reporting channel is publicly discoverable and contains clear language authorizing good-faith research and the disclosure of vulnerabilities to the organization. The organization does not condition its authorization on an expectation of indefinite non-disclosure to the public by the reporting entity but may request a specific time period to properly remediate the vulnerability.</p>
elementType: discussion
externalId: D-RA-05(11)
