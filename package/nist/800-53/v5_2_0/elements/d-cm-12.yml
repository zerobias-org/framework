id: f523f5b9-4669-4155-b97c-c7d0ec8d1ec5
name: <p>Information location addresses the need to understand where information is being processed and stored. Information location includes identifying where specific information types and information reside in system components and how information is being processed so that information flow can be understood and adequate protection and policy management provided for such information and system components. The security category of the information is also a factor in determining the controls necessary to protect the information and the system component where the information resides (see <a xmlns="" href="https://doi.org/10.6028/NIST.FIPS.199">FIPS 199</a>). The location of the information and system components is also a factor in the architecture and design of the system (see <a href="#sa-4">SA-4</a>, <a href="#sa-8">SA-8</a>, <a href="#sa-17">SA-17</a>).</p>
elementType: discussion
externalId: D-CM-12
