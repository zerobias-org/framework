id: 8c5b14ed-84b7-4e95-9a66-0f179167c597
name: <p>Automated mechanisms that help organizations maintain consistent baseline configurations for systems include configuration management tools, hardware, software, firmware inventory tools, and network management tools. Automated tools can be used at the organization level, mission and business process level, or system level on workstations, servers, notebook computers, network components, or mobile devices. Tools can be used to track version numbers on operating systems, applications, types of software installed, and current patch levels. Automation support for accuracy and currency can be satisfied by the implementation of <a href="#cm-08.02">CM-08(02)</a> for organizations that combine system component inventory and baseline configuration activities.</p>
elementType: discussion
externalId: D-CM-02(02)
