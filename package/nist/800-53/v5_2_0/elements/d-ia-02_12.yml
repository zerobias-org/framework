name: <p>Acceptance of Personal Identity Verification (PIV)-compliant credentials applies to organizations implementing logical access control and physical access control systems. PIV-compliant credentials are those credentials issued by federal agencies that conform to FIPS Publication 201 and supporting guidance documents. The adequacy and reliability of PIV card issuers are authorized using <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-79-2">SP 800-79-2</a>. Acceptance of PIV-compliant credentials includes derived PIV credentials, the use of which is addressed in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-166">SP 800-166</a>. The DOD Common Access Card (CAC) is an example of a PIV credential.</p>
elementType: discussion
externalId: D-IA-02(12)
