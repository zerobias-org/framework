id: d92b8f42-bad1-4496-a2a7-9c1ba8eab848
name: <p>The misuse of privileged functions, either intentionally or unintentionally by authorized users or by unauthorized external entities that have compromised system accounts, is a serious and ongoing concern and can have significant adverse impacts on organizations. Logging and analyzing the use of privileged functions is one way to detect such misuse and, in doing so, help mitigate the risk from insider threats and the advanced persistent threat.</p>
elementType: discussion
externalId: D-AC-06(09)
