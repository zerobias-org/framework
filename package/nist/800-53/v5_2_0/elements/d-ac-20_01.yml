id: 256d1a58-d885-4a6c-b9a6-6a571d996991
name: <p>Limiting authorized use recognizes circumstances where individuals using external systems may need to access organizational systems. Organizations need assurance that the external systems contain the necessary controls so as not to compromise, damage, or otherwise harm organizational systems. Verification that the required controls have been implemented can be achieved by external, independent assessments, attestations, or other means, depending on the confidence level required by organizations.</p>
elementType: discussion
externalId: D-AC-20(01)
