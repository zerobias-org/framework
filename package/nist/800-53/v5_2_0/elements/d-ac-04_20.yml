name: <p>Organizations define approved solutions and configurations in cross-domain policies and guidance in accordance with the types of information flows across classification boundaries. The National Security Agency (NSA) National Cross Domain Strategy and Management Office provides a listing of approved cross-domain solutions. Contact <a href="\mailto:ncdsmo@nsa.gov">ncdsmo@nsa.gov</a> for more information.</p>
