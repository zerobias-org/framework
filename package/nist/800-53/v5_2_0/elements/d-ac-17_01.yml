name: <p>Monitoring and control of remote access methods allows organizations to detect attacks and help ensure compliance with remote access policies by auditing the connection activities of remote users on a variety of system components, including servers, notebook computers, workstations, smart phones, and tablets. Audit logging for remote access is enforced by <a href="#au-02">AU-02</a>. Audit events are defined in <a href="#au-02_smt.a">AU-02a</a>.</p>
