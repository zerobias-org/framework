name: <p>Applying the security design principles in <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-160v1">SP 800-160-1</a> promotes complete, consistent, and comprehensive testing and evaluation of systems, system components, and services. The thoroughness of such testing contributes to the evidence produced to generate an effective assurance case or argument as to the trustworthiness of the system, system component, or service.</p>
