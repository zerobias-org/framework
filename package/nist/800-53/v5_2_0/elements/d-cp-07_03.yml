id: d1c5f5e0-dd6c-4e77-b4e7-51186662b524
name: <p>Priority of service agreements refer to negotiated agreements with service providers that ensure that organizations receive priority treatment consistent with their availability requirements and the availability of information resources for logical alternate processing and/or at the physical alternate processing site. Organizations establish recovery time objectives as part of contingency planning.</p>
elementType: discussion
externalId: D-CP-07(03)
