name: <p>External telecommunications services can provide data and/or voice communications services. Examples of control plane traffic include Border Gateway Protocol (BGP) routing, Domain Name System (DNS), and management protocols. See <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-189">SP 800-189</a> for additional information on the use of the resource public key infrastructure (RPKI) to protect BGP routes and detect unauthorized BGP announcements.</p>
