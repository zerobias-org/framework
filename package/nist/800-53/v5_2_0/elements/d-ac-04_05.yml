id: 82e83501-6d18-4bc2-93de-4b2a0b273478
name: <p>Embedding data types within other data types may result in reduced flow control effectiveness. Data type embedding includes inserting files as objects within other files and using compressed or archived data types that may include multiple embedded data types. Limitations on data type embedding consider the levels of embedding and prohibit levels of data type embedding that are beyond the capability of the inspection tools.</p>
elementType: discussion
externalId: D-AC-04(05)
