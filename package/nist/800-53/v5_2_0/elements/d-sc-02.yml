id: 35540fcf-87e9-423c-992c-c302293a7f39
name: <p>System management functionality includes functions that are necessary to administer databases, network components, workstations, or servers. These functions typically require privileged user access. The separation of user functions from system management functions is physical or logical. Organizations may separate system management functions from user functions by using different computers, instances of operating systems, central processing units, or network addresses; by employing virtualization techniques; or some combination of these or other methods. Separation of system management functions from user functions includes web administrative interfaces that employ separate authentication methods for users of any other system resources. Separation of system and user functions may include isolating administrative interfaces on different domains and with additional access controls. The separation of system and user functionality can be achieved by applying the systems security engineering design principles in <a href="#sa-08">SA-08</a>, including <a href="#sa-08.01">SA-08(01)</a>, <a href="#sa-08.03">SA-08(03)</a>, <a href="#sa-08.04">SA-08(04)</a>, <a href="#sa-08.10">SA-08(10)</a>, <a href="#sa-08.12">SA-08(12)</a>, <a href="#sa-08.13">SA-08(13)</a>, <a href="#sa-08.14">SA-08(14)</a>, and <a href="#sa-08.18">SA-08(18)</a>.</p>
