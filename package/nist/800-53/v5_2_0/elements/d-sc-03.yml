name: <p>Security functions are isolated from nonsecurity functions by means of an isolation boundary implemented within a system via partitions and domains. The isolation boundary controls access to and protects the integrity of the hardware, software, and firmware that perform system security functions. Systems implement code separation in many ways, such as through the provision of security kernels via processor rings or processor modes. For non-kernel code, security function isolation is often achieved through file system protections that protect the code on disk and address space protections that protect executing code. Systems can restrict access to security functions using access control mechanisms and by implementing least privilege capabilities. While the ideal is for all code within the defined security function isolation boundary to only contain security-relevant code, it is sometimes necessary to include nonsecurity functions as an exception. The isolation of security functions from nonsecurity functions can be achieved by applying the systems security engineering design principles in <a href="#sa-08">SA-08</a>, including <a href="#sa-08.01">SA-08(01)</a>, <a href="#sa-08.03">SA-08(03)</a>, <a href="#sa-08.04">SA-08(04)</a>, <a href="#sa-08.10">SA-08(10)</a>, <a href="#sa-08.12">SA-08(12)</a>, <a href="#sa-08.13">SA-08(13)</a>, <a href="#sa-08.14">SA-08(14)</a>, and <a href="#sa-08.18">SA-08(18)</a>.</p>
