id: 26b49a93-c3ea-4d65-9764-26b753bf184a
name: <p>In contrast to conventional approaches to identification that presume static accounts for preregistered users, many distributed systems establish identifiers at runtime for entities that were previously unknown. When identifiers are established at runtime for previously unknown entities, organizations can anticipate and provision for the dynamic establishment of identifiers. Pre-established trust relationships and mechanisms with appropriate authorities to validate credentials and related identifiers are essential.</p>
elementType: discussion
externalId: D-IA-04(05)
