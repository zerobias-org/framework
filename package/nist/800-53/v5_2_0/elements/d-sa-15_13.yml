name: <p>In support of better incident response and the ability to more quickly reconstruct security-related actions, identifying specific requirements for secure logging facilitates the ability to connect application-produced audit event logs with operational data. &nbsp;Event types are consistent with the event types defined in AU-02. &nbsp;</p>
