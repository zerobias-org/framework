id: 5bcffff7-32c3-422c-afc3-da56ef5c3b8d
name: <p>When the capability of an organization to carry out its mission and business functions is dependent on external service providers, developing a comprehensive and timely contingency plan may become more challenging. When mission and business functions are dependent on external service providers, organizations coordinate contingency planning activities with the external entities to ensure that the individual plans reflect the overall contingency needs of the organization.</p>
elementType: discussion
externalId: D-CP-02(07)
