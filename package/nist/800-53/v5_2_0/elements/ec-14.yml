name: 'I have an administrative note, relating to the section on Protection of Cryptographic Keys, particularly in the subsection for Discussion. Specifically, there is a sentence that reads: "The private keys used to sign these assertions and tokens are protected commensurate with the impact of the system and information resources they can be accessed." This is worded somewhat confusingly. I''m fairly sure the author meant something to the effect of "...the impact of the system and information resources they can access" or "...information resources that can be accessed." However, the wording of "...information resources they can be accessed" suggests that there''s some nuance to the proposed subject that the non-expert reader (myself included) are missing.'
elementType: public_comment
externalId: EC-14
