id: 7874a568-b00c-4130-9ed1-4cac4fa5bb3b
name: <p>Organizations maintain system inventories to the extent feasible. For example, virtual machines can be difficult to monitor because such machines are not visible to the network when not in use. In such cases, organizations maintain as up-to-date, complete, and accurate an inventory as is deemed reasonable. Automated maintenance can be achieved by the implementation of <a href="#cm-02.02">CM-02(02)</a> for organizations that combine system component inventory and baseline configuration activities.</p>
