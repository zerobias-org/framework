id: 1d953a68-ffb5-4b3e-83c7-2a3550aa4058
name: <p>Maintaining exclusive control of cryptographic keys in an external system prevents decryption of organizational data by external system staff. Organizational control of cryptographic keys can be implemented by encrypting and decrypting data inside the organization as data is sent to and received from the external system or by employing a component that permits encryption and decryption functions to be local to the external system but allows exclusive organizational access to the encryption keys. </p>
elementType: discussion
externalId: D-SA-09(06)
