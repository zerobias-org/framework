id: fea26909-a5d7-403f-bfb8-e193e531f794
name: <p>Organizations need assurance that system functions can be restored correctly and can support established organizational missions. To ensure that the selected system functions are thoroughly exercised during contingency plan testing, a sample of backup information is retrieved to determine whether the functions are operating as intended. Organizations can determine the sample size for the functions and backup information based on the level of assurance needed.</p>
elementType: discussion
externalId: D-CP-09(02)
