name: |-
  While this specification primarily focuses on enhancing the security management process, we firmly believe that security controls deserve paramount attention.

  Security controls are put in place to ensure that a particular application or environment is configured to operate securely and with a high level of confidence. These protective measures fall within the broader realm of Identity Governance Administration (IGA). Actively collecting and processing data pertaining to user identities, entitlements, and policies will enable oversight for access in both on-premises and cloud-based environments. Expanding this to encompass the analysis of usage and configuration data offers a holistic perspective on security controls. This empowers enterprises to efficiently manage the named control in the specification, in harmony with the compliance requirements of the organization.

  Furthermore, this security control affords enterprises improved visibility into security risks across on-premises and cloud environments and mitigate them.
