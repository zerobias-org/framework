id: 69b879fd-029f-48e0-8270-3ccb0b1c365e
name: <p>Limiting the number of external network connections facilitates monitoring of inbound and outbound communications traffic. The Trusted Internet Connection <a xmlns="" href="https://www.dhs.gov/trusted-internet-connections">DHS TIC</a> initiative is an example of a federal guideline that requires limits on the number of external network connections. Limiting the number of external network connections to the system is  important during transition periods from older to newer technologies (e.g., transitioning from IPv4 to IPv6 network protocols). Such transitions may require implementing the older and newer technologies simultaneously during the transition period and thus increase the number of access points to the system.</p>
elementType: discussion
externalId: D-SC-07(03)
