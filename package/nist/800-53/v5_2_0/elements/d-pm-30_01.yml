name: <p>The identification and prioritization of suppliers of critical or mission-essential technologies, products, and services is paramount to the mission/business success of organizations. The assessment of suppliers is conducted using supplier reviews (see <a href="#sr-06">SR-06</a>) and supply chain risk assessment processes (see <a href="#ra-03.01">RA-03(01)</a>). An analysis of supply chain risk can help an organization identify systems or components for which additional supply chain risk mitigations are required.</p>
