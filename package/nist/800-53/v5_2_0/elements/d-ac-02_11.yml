id: ecf17d6b-0a9d-4fe8-a003-4dc790a36850
name: <p>Specifying and enforcing usage conditions helps to enforce the principle of least privilege, increase user accountability, and enable effective account monitoring. Account monitoring includes alerts generated if the account is used in violation of organizational parameters. Organizations can describe specific conditions or circumstances under which system accounts can be used, such as by restricting usage to certain days of the week, time of day, or specific durations of time.</p>
elementType: discussion
externalId: D-AC-02(11)
