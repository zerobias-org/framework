id: 7a961ac9-00d3-4b58-b3e3-07d167acef8f
name: <p>Organizations can specify additional information to be provided to users upon logon, including the location of the last logon. User location is defined as information that can be determined by systems, such as Internet Protocol (IP) addresses from which network logons occurred, notifications of local logons, or device identifiers.</p>
elementType: discussion
externalId: D-AC-09(04)
