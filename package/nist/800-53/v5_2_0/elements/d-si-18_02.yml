id: e9f767f8-e8cf-499c-bd2e-2edf3d47b96d
name: <p>Data tagging personally identifiable information includes tags that note processing permissions, authority to process, de-identification, impact level, information life cycle stage, and retention or last updated dates. Employing data tags for personally identifiable information can support the use of automation tools to correct or delete relevant personally identifiable information.</p>
elementType: discussion
externalId: D-SI-18(02)
