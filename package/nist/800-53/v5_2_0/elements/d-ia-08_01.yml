name: <p>Acceptance of Personal Identity Verification (PIV) credentials from other federal agencies applies to both logical and physical access control systems. PIV credentials are those credentials issued by federal agencies that conform to FIPS Publication 201 and supporting guidelines. The adequacy and reliability of PIV card issuers are addressed and authorized using <a xmlns="" href="https://doi.org/10.6028/NIST.SP.800-79-2">SP 800-79-2</a>. </p>
