id: b95f3374-f5e3-4ecd-a688-ac616aeabd42
name: <p>Personnel who conduct maintenance on organizational systems may be exposed to classified information during the course of their maintenance activities. To mitigate the inherent risk of such exposure, organizations use maintenance personnel that are cleared (i.e., possess security clearances) to the classification level of the information stored on the system.</p>
elementType: discussion
externalId: D-MA-05(02)
