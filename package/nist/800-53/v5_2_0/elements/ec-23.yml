name: 'PROTECTION OF ACCESS TOKEN GENERATION SYSTEM. Would be a better suited control name, the system that provides this information is vital to the authentication and trustworthiness of the token itself. The risk of this system being compromised is detrimental to the integrity of the verification process. A key / token provides no security value if stolen or cloned. New control statement: The system source and identity that generates access tokens is verified for its integrity before granting access to resources. I would like to see mention of ensuring 2 factor authorization is being used on the systems in question to help prove the trustworthiness of the tokens being generated. Some discussion of redundancy would be worthy addition because if the system goes down with no replacement that is a vulnerability.'
