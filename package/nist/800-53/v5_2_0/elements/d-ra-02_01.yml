id: f98bd158-634b-4df8-b50e-a3e93f6bd647
name: '<p>Organizations apply the <q>high-water mark</q> concept to each system categorized in accordance with <a xmlns="" href="https://doi.org/10.6028/NIST.FIPS.199">FIPS 199</a>, resulting in systems designated as low impact, moderate impact, or high impact. Organizations that desire additional granularity in the system impact designations for risk-based decision-making, can further partition the systems into sub-categories of the initial system categorization. For example, an impact-level prioritization on a moderate-impact system can produce three new sub-categories: low-moderate systems, moderate-moderate systems, and high-moderate systems. Impact-level prioritization and the resulting sub-categories of the system give organizations an opportunity to focus their investments related to security control selection and the tailoring of control baselines in responding to identified risks. Impact-level prioritization can also be used to determine those systems that may be of heightened interest or value to adversaries or represent a critical loss to the federal enterprise, sometimes described as high value assets. For such high value assets, organizations may be more focused on complexity, aggregation, and information exchanges. Systems with high value assets can be prioritized by partitioning high-impact systems into low-high systems, moderate-high systems, and high-high systems. Alternatively, organizations can apply the guidance in <a xmlns="" href="https://www.cnss.gov/CNSS/issuances/Instructions.cfm">CNSSI 1253</a> for security objective-related categorization.</p>'
elementType: discussion
externalId: D-RA-02(01)
