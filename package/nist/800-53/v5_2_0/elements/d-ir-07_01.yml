id: 63cd0a99-72e5-4a7b-97f5-73b4cee75da6
name: <p>Automated mechanisms can provide a push or pull capability for users to obtain incident response assistance. For example, individuals may have access to a website to query the assistance capability, or the assistance capability can proactively send incident response information to users (general distribution or targeted) as part of increasing understanding of current response capabilities and support.</p>
elementType: discussion
externalId: D-IR-07(01)
