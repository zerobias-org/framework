id: 0490cc7b-0340-47f8-a562-1e67d2ac9e7a
name: <p>Many types of statistical analyses can result in the disclosure of information about individuals even if only summary information is provided. For example, if a school that publishes a monthly table with the number of minority students enrolled, reports that it has 10-19 such students in January, and subsequently reports that it has 20-29 such students in March, then it can be inferred that the student who enrolled in February was a minority.</p>
elementType: discussion
externalId: D-SI-19(05)
