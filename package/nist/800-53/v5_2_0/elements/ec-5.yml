id: 0090d7ef-461b-438f-937c-48e59d513f94
name: CrowdStrike considers extensive, real-time logging practices essential. Robust logging data underpins numerous core enterprise security functions—not just incident response. Security requirements have shifted towards achieving visibly over federated networks and adoption of Next-Generation Security Information and Event Management (SIEM) solutions. These solutions enable security teams to aggregate logs for the purposes of real-time threat hunting and automated prevention and remediation across multiple security tools. As artificial intelligence (AI) becomes more salient for defenders, logging data captured by Next Gen SIEMs, and the subsequent action security teams take to perform remediations in particular, is extremely valuable for training.
