name: <p>Continuous monitoring at the organization level facilitates ongoing awareness of the security and privacy posture across the organization to support organizational risk management decisions. The terms <q>continuous</q> and <q>ongoing</q> imply that organizations assess and monitor their controls and risks at a frequency sufficient to support risk-based decisions. Different types of controls may require different monitoring frequencies. The results of continuous monitoring guide and inform risk response actions by organizations. Continuous monitoring programs allow organizations to maintain the authorizations of systems and common controls in highly dynamic environments of operation with changing mission and business needs, threats, vulnerabilities, and technologies. Having access to security- and privacy-related information on a continuing basis through reports and dashboards gives organizational officials the capability to make effective, timely, and informed risk management decisions, including ongoing authorization decisions. To further facilitate security and privacy risk management, organizations consider aligning organization-defined monitoring metrics with organizational risk tolerance as defined in the risk management strategy. Monitoring requirements, including the need for monitoring, may be referenced in other controls and control enhancements such as, <a href="#ac-02_smt.g">AC-02g</a>, <a href="#ac-02.07">AC-02(07)</a>, <a href="#ac-02.12_smt.a">AC-02(12)(a)</a>, <a href="#ac-02.07_smt.b">AC-02(07)(b)</a>, <a href="#ac-02.07_smt.c">AC-02(07)(c)</a>, <a href="#ac-17.01">AC-17(01)</a>, <a href="#at-04_smt.a">AT-04a</a>, <a href="#au-13">AU-13</a>, <a href="#au-13.01">AU-13(01)</a>, <a href="#au-13.02">AU-13(02)</a>, <a href="#ca-07">CA-07</a>, <a href="#cm-03_smt.f">CM-03f</a>, <a href="#cm-06_smt.d">CM-06d</a>, <a href="#cm-11_smt.c">CM-11c</a>, <a href="#ir-05">IR-05</a>, <a href="#ma-02_smt.b">MA-02b</a>, <a href="#ma-03_smt.a">MA-03a</a>, <a href="#ma-04_smt.a">MA-04a</a>, <a href="#pe-03_smt.d">PE-03d</a>, <a href="#pe-06">PE-06</a>, <a href="#pe-14_smt.b">PE-14b</a>, <a href="#pe-16">PE-16</a>, <a href="#pe-20">PE-20</a>, <a href="#pm-06">PM-06</a>, <a href="#pm-23">PM-23</a>, <a href="#ps-07_smt.e">PS-07e</a>, <a href="#sa-09_smt.c">SA-09c</a>, <a href="#sc-05.03_smt.b">SC-05(03)(b)</a>, <a href="#sc-07_smt.a">SC-07a</a>, <a href="#sc-07.24_smt.b">SC-07(24)(b)</a>, <a href="#sc-18_smt.b">SC-18b</a>, <a href="#sc-43_smt.b">SC-43b</a>, <a href="#si-04">SI-04</a>.</p>
