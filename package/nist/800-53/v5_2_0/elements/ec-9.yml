id: 003d7a97-a531-4d3d-ab02-e3c759bc0671
name: IA-4 and IA-5 describe how specific items must be managed. This, in turn, provides opportunities to describe the activities the reader's org must take to ensure successful management. The proposed language here simply says "manage X" without providing context or instructions. The assessment opportunities provide no additional help, instructing the reader that managing X means "Manage Y", "Manage Z", etc. Without an effective description of what must be done to "manage" something, backed up in the assessment guidance, the control is unusable and un-auditable. Suggest a total re-write to define what actions need to happen.
elementType: public_comment
