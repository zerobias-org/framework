name: <p>In certain situations, such as when there is a threat to human life or an event that threatens the organization’s ability to carry out critical missions or business functions, an override capability for access control mechanisms may be needed. Override conditions are defined by organizations and used only in those limited circumstances. Audit events are defined in <a href="#au-2">AU-2</a>. Audit records are generated in <a href="#au-12">AU-12</a>.</p>
