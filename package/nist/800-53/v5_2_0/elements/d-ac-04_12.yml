id: ce746f67-c6b0-4e82-baa3-da17a10d2122
name: <p>Data type identifiers include filenames, file types, file signatures or tokens, and multiple internal file signatures or tokens. Systems only allow transfer of data that is compliant with data type format specifications. Identification and validation of data types is based on defined specifications associated with each allowed data format. The filename and number alone are not used for data type identification. Content is validated syntactically and semantically against its specification to ensure that it is the proper data type.</p>
elementType: discussion
externalId: D-AC-04(12)
