id: 76b88186-aeca-4022-8562-0b3806585ca3
name: <p>The provision of environmental controls applies primarily to organizational facilities that contain concentrations of system resources (e.g., data centers, mainframe computer rooms, and server rooms). Insufficient environmental controls, especially in very harsh environments, can have a significant adverse impact on the availability of systems and system components that are needed to support organizational mission and business functions.</p>
elementType: discussion
externalId: D-PE-14
