id: 7a514db4-d483-466d-ae8c-ee0c1be4fa42
name: <p>Training feedback includes awareness training results and role-based training results. Training results, especially failures of personnel in critical roles, can be indicative of a potentially serious problem. Therefore, it is important that senior managers are made aware of such situations so that they can take appropriate response actions. Training feedback supports the evaluation and update of organizational training described in <a href="#at-02_smt.b">AT-02b</a> and <a href="#at-03_smt.b">AT-03b</a>.</p>
elementType: discussion
externalId: D-AT-06
