description: |-
  <p class="MsoNormal" style="margin-bottom: 9.0pt; line-height: normal; background: white;"><span style="font-size: 11.0pt; mso-fareast-font-family: 'Times New Roman'; mso-bidi-font-family: Calibri; color: black; mso-color-alt: windowtext; mso-font-kerning: 0pt; mso-ligatures: none;">Cyber resiliency is critical to ensuring the survivability of mission-critical systems and high value assets. Cyber resiliency focuses on limiting the damage from adversity or the conditions that can cause a loss of assets. Damage can affect (1) organizations (e.g., loss of reputation, increased existential risk), (2) mission or business functions (e.g., decreased capability to complete current missions and to accomplish future missions), (3) security (e.g., decreased capability to achieve security objectives or to prevent, detect, and respond to cyber incidents), (4) systems (e.g., unauthorized use of system resources or decreased capability to meet system requirements), or (5) specific system elements (e.g., physical destruction; corruption, modification, or fabrication of information).</span></p>
  <p class="MsoNormal" style="margin-bottom: 9.0pt; line-height: normal; background: white;"><span style="font-size: 11.0pt; mso-fareast-font-family: 'Times New Roman'; mso-bidi-font-family: Calibri; color: black; mso-color-alt: windowtext; mso-font-kerning: 0pt; mso-ligatures: none;">Cyber resiliency goals are intended to help organizations maintain a state of informed preparedness for adversity, continue essential mission or business functions despite adversity, restore mission or business functions during and after adversity, and modify mission or business functions and their supporting capabilities in response to predicted changes in technical, operational, or threat environments.</span></p>
  <p class="MsoNormal" style="margin-bottom: 9.0pt; line-height: normal; background: white;"><span style="font-size: 11.0pt; mso-fareast-font-family: 'Times New Roman'; mso-bidi-font-family: Calibri; color: black; mso-color-alt: windowtext; mso-font-kerning: 0pt; mso-ligatures: none;">SP 800-160v2 (Volume 2) provides additional information on the Cyber Resiliency Engineering Framework, including detailed descriptions of cyber resiliency goals, objectives, techniques, implementation approaches, and design principles. SP 800-160v1 provides additional information on achieving cyber resiliency as an emergent property of an engineered system.</span></p>
