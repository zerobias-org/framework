id: 73b50ec2-dcd8-4321-bae9-a1044926eb53
name: <p>Failure to protect nonlocal maintenance and diagnostic communications can result in unauthorized individuals gaining access to organizational information. Unauthorized access during remote maintenance sessions can result in a variety of hostile actions, including malicious code insertion, unauthorized changes to system parameters, and exfiltration of organizational information. Such actions can result in the loss or degradation of mission or business capabilities.</p>
elementType: discussion
externalId: D-MA-04(06)
