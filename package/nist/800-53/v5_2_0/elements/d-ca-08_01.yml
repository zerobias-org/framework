id: 488e2ca7-7e73-4cb6-90f9-350bc102595c
name: <p>Independent penetration testing agents or teams are individuals or groups who conduct impartial penetration testing of organizational systems. Impartiality implies that penetration testing agents or teams are free from perceived or actual conflicts of interest with respect to the development, operation, or management of the systems that are the targets of the penetration testing. <a href="#ca-02.01">CA-02(01)</a> provides additional information on independent assessments that can be applied to penetration testing.</p>
elementType: discussion
externalId: D-CA-08(01)
