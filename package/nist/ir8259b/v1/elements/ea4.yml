id: 6cc803ea-31b5-495a-9f2f-203719982081
name: Make customers and others aware of key assumptions and expectations related to the cybersecurity of the IoT device that were documented, throughout the full lifecycle of use of the IoT devices, taking into consideration the purpose of the IoT device and the intended uses. Such assumptions should include key dependencies of the IoT device that impact cybersecurity (e.g., connectivity requirements and use of third-party services when in operation).
