name: This capability supports on-going cybersecurity of the device by keeping customers informed of developments and new information and configuration capabilities after the initial documentation was developed and provided.  Information dissemination enables the support, administration, and maintenance necessary to ensure effective and efficient IoT device and system performance and cybersecurity.
