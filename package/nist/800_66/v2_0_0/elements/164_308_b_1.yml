id: e54cc544-1e67-4db5-90d1-4d65fefa2bdc
name: Business Associate Contracts and Other Arrangements
description: 'HIPAA Standard: A covered entity may permit a business associate to create, receive, maintain, or transmit electronic protected health information on the covered entity’s behalf only if the covered entity obtains satisfactory assurances, in accordance with § 164.314(a), that the business associate will appropriately safeguard the information. A covered entity is not required to obtain such satisfactory assurances from a business associate that is a subcontractor.'
elementType: nist_standard
externalId: 164.308(b)(1)
