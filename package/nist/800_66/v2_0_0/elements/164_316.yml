id: 2e00def2-37a0-4c05-8213-6bb7cb852c5e
name: Policies and Procedures and Documentation Requirements
description: Requires the implementation of reasonable and appropriate policies and procedures to comply with the standards, implementation specifications, and other requirements of the Security Rule; the maintenance of written (may be electronic) documentation and/or records that include the policies, procedures, actions, activities, or assessments required by the Security Rule; and retention, availability, and update requirements related to the documentation.
elementType: security_rule
externalId: '164.316'
