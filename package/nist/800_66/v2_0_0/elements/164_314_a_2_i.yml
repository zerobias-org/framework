id: 29341704-c43d-4014-9348-2bf722969e34
name: Business Associate Contracts
description: Contracts between covered entities and business associates must provide that business associates will implement administrative, physical, and technical safeguards that reasonably and appropriately protect the confidentiality, integrity, and availability of the ePHI that the business associate creates, receives, maintains, or transmits on behalf of the covered entity.
elementType: imp_spec
externalId: 164.314(a)(2)(i)
