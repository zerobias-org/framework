id: 9b4ec02c-8df8-4f2e-8d21-fb46c85a4d61
name: Requirements for Group Health Plans
description: 'HIPAA Standard: Except when the only electronic protected health information disclosed to a plan sponsor is disclosed pursuant to § 164.504(f)(1)(ii) or (iii), or as authorized under § 164.508, a group health plan must ensure that its plan documents provide that the plan sponsor will reasonably and appropriately safeguard electronic protected health information created, received, maintained, or transmitted to or by the plan sponsor on behalf of the group health plan.'
elementType: nist_standard
externalId: 164.314(b)
