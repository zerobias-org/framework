id: ce0b77bd-9dd5-47f3-b85a-5f2208c8c1ed
name: Evaluation
description: 'HIPAA Standard: Perform a periodic technical and nontechnical evaluation, based initially upon the standards implemented under this rule and subsequently, in response to environmental or operational changes affecting the security of electronic protected health information, that establishes the extent to which a covered entity’s or business associate’s security policies and procedures meet the requirements of this subpart.'
elementType: nist_standard
externalId: 164.308(a)(8)
