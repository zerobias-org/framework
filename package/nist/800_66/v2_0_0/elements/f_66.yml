name: '66'
description: Note that a business associate is responsible for implementing appropriate physical security measures for its own facilities. Business associates should approach these key activities, descriptions, and sample questions from the perspective of their own facilities. A covered entity requires written satisfactory assurances that ePHI will be protected by the business associate.
