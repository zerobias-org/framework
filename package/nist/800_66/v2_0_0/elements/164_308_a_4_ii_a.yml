id: c3284540-0a35-4712-a64d-7ea40ee4b534
name: Isolating Health care Clearinghouse Function
description: If a healthcare clearinghouse is part of a larger organization, the clearinghouse must implement policies and procedures that protect the ePHI of the clearinghouse from unauthorized access by the larger organization.
elementType: imp_spec
externalId: 164.308(a)(4)(ii)(A)
