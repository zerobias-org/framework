id: 1d923ee5-fa77-4c21-9965-d4b73ba87b25
name: Workforce Security
description: 'HIPAA Standard: Implement policies and procedures to ensure that all members of its workforce have appropriate access to electronic protected health information, as provided under paragraph (a)(4) of this section, and to prevent those workforce members who do not have access under paragraph (a)(4) of this section from obtaining access to electronic protected health information.'
elementType: nist_standard
externalId: 164.308(a)(3)
