externalId: MG-3.1-004
name: MG-3.1-004
description: Take reasonable measures to review training data for CBRN
  information, and intellectual property, and where appropriate, remove it.
  Implement reasonable measures to prevent, ﬂag, or take other action in
  response to outputs that reproduce particular training data (e.g.,
  plagiarized, trademarked, patented, licensed content or trade secret
  material).
elementType: control
