name: MEASURE 2.6
description: The AI system is evaluated regularly for safety risks – as
  identiﬁed in the MAP function. The AI system to be  deployed is demonstrated
  to be safe, its residual negative risk does not exceed the risk tolerance, and
  it can fail safely, particularly if made to operate beyond its knowledge
  limits. Safety metrics reﬂect system reliability and robustness, real-time
  monitoring, and response times for AI system failures.
