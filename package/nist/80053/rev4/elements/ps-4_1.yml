id: 4929b32a-7153-5a6c-a43d-fc623a2c260e
name: Post-employment Requirements
description: |-
  The organization:
    (a) Notifies terminated individuals of applicable, legally binding post-employment requirements for the protection of organizational information; and
    (b) Requires terminated individuals to sign an acknowledgment of post-employment requirements as part of the organizational termination process.
elementType: enhancement
externalId: PS-4 (1)
guidance: Organizations consult with the Office of the General Counsel regarding matters of post-employment requirements on terminated individuals.
parent: ps-4
