id: 25d66534-9eb7-530e-9fc8-48bdf04c3379
name: Covert Channel Analysis
description: |-
  The organization:
    a. Performs a covert channel analysis to identify those aspects of communications within the information system that are potential avenues for covert [Selection (one or more): storage; timing] channels; and
    b. Estimates the maximum bandwidth of those channels.
elementType: control
externalId: SC-31
guidance: Developers are in the best position to identify potential areas within systems that might lead to covert channels. Covert channel analysis is a meaningful activity when there is the potential for unauthorized information flows across security domains, for example, in the case of information systems containing export-controlled information and having connections to external networks (i.e., networks not controlled by organizations). Covert channel analysis is also meaningful for multilevel secure (MLS) information systems, multiple security level (MSL) systems, and cross-domain systems.
parent: sc
