id: c721d1ba-80e5-52b4-8376-38bf72a28bbb
name: Cryptographic Protection
description: The information system implements cryptographic mechanisms to protect the integrity of audit information and audit tools.
elementType: enhancement
externalId: AU-9 (3)
guidance: Cryptographic mechanisms used for protecting the integrity of audit information include, for example, signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining the confidentiality of the secret key used to generate the hash.
