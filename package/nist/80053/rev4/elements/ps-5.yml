id: 94927b48-b5b3-5f11-ab63-95f650c63a5a
name: Personnel Transfer
description: |-
  The organization:
    a. Reviews and confirms ongoing operational need for current logical and physical access authorizations to information systems/facilities when individuals are reassigned or transferred to other positions within the organization;
    b. Initiates [Assignment: organization-defined transfer or reassignment actions] within [Assignment: organization-defined time period following the formal transfer action];
    c. Modifies access authorization as needed to correspond with any changes in operational need due to reassignment or transfer; and
    d. Notifies [Assignment: organization-defined personnel or roles] within [Assignment: organization-defined time period].
elementType: control
externalId: PS-5
guidance: 'This control applies when reassignments or transfers of individuals are permanent or of such extended durations as to make the actions warranted. Organizations define actions appropriate for the types of reassignments or transfers, whether permanent or extended. Actions that may be required for personnel transfers or reassignments to other positions within organizations include, for example: (i) returning old and issuing new keys, identification cards, and building passes; (ii) closing information system accounts and establishing new accounts; (iii) changing information system access authorizations (i.e., privileges); and (iv) providing for access to official records to which individuals had access at previous work locations and in previous information system accounts.'
parent: ps
