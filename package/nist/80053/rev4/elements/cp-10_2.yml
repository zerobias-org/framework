name: Transaction Recovery
description: The information system implements transaction recovery for systems that are transaction-based.
elementType: enhancement
externalId: CP-10 (2)
guidance: Transaction-based information systems include, for example, database management systems and transaction processing systems. Mechanisms supporting transaction recovery include, for example, transaction rollback and transaction journaling.
