id: b71ed4a1-c068-59b6-a9cd-54edde5a8340
name: System and Services Acquisition Policy and Procedures
description: |-
  The organization:
    a. Develops, documents, and disseminates to [Assignment: organization-defined personnel or roles]:
      1. A system and services acquisition policy that addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
      2. Procedures to facilitate the implementation of the system and services acquisition policy and associated system and services acquisition controls; and
    b. Reviews and updates the current:
      1. System and services acquisition policy [Assignment: organization-defined frequency]; and
      2. System and services acquisition procedures [Assignment: organization-defined frequency].
elementType: control
externalId: SA-1
guidance: This control addresses the establishment of policy and procedures for the effective implementation of selected security controls and control enhancements in the SA family. Policy and procedures reflect applicable federal laws, Executive Orders, directives, regulations, policies, standards, and guidance. Security program policies and procedures at the organization level may make the need for system-specific policies and procedures unnecessary. The policy can be included as part of the general information security policy for organizations or conversely, can be represented by multiple policies reflecting the complex nature of certain organizations. The procedures can be established for the security program in general and for particular information systems, if needed. The organizational risk management strategy is a key factor in establishing policy and procedures.
