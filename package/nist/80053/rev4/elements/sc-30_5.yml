id: a85a7c82-83f8-5493-87e6-11da8f555520
name: Concealment Of System Components
description: "The organization employs [Assignment: organization-defined techniques] to hide or conceal [Assignment: organization-defined information system components]."
elementType: enhancement
externalId: SC-30 (5)
guidance: By hiding, disguising, or otherwise concealing critical information system components, organizations may be able to decrease the probability that adversaries target and successfully compromise those assets. Potential means for organizations to hide and/or conceal information system components include, for example, configuration of routers or the use of honeynets or virtualization techniques.
