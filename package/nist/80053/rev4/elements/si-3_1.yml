name: Central Management
description: The organization centrally manages malicious code protection mechanisms.
elementType: enhancement
externalId: SI-3 (1)
guidance: Central management is the organization-wide management and implementation of malicious code protection mechanisms. Central management includes planning, implementing, assessing, authorizing, and monitoring the organization-defined, centrally managed flaw malicious code protection security controls.
