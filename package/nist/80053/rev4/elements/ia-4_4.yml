id: be3f49f7-11e9-53c8-ae0a-dedf6cf3a3f8
name: Identify User Status
description: "The organization manages individual identifiers by uniquely identifying each individual as [Assignment: organization-defined characteristic identifying individual status]."
elementType: enhancement
externalId: IA-4 (4)
guidance: Characteristics identifying the status of individuals include, for example, contractors and foreign nationals. Identifying the status of individuals by specific characteristics provides additional information about the people with whom organizational personnel are communicating. For example, it might be useful for a government employee to know that one of the individuals on an email message is a contractor.
