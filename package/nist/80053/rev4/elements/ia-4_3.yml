id: a7917572-8947-5b63-a6b5-795e3f4421a4
name: Multiple Forms Of Certification
description: The organization requires multiple forms of certification of individual identification be presented to the registration authority.
elementType: enhancement
externalId: IA-4 (3)
guidance: Requiring multiple forms of identification, such as documentary evidence or a combination of documents and biometrics, reduces the likelihood of individuals using fraudulent identification to establish an identity, or at least increases the work factor of potential adversaries.
