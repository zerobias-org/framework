id: 46d3a796-7ac3-53e8-a5bb-3e0311f98c75
name: Embedded Data Types
description: "The information system enforces [Assignment: organization-defined limitations] on embedding data types within other data types."
elementType: enhancement
externalId: AC-4 (5)
guidance: Embedding data types within other data types may result in reduced flow control effectiveness. Data type embedding includes, for example, inserting executable files as objects within word processing files, inserting references or descriptive information into a media file, and compressed or archived data types that may include multiple embedded data types. Limitations on data type embedding consider the levels of embedding and prohibit levels of data type embedding that are beyond the capability of the inspection tools.
parent: ac-4
