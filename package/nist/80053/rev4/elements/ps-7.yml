id: cb0001dd-0b55-5a0c-93e1-df4689216cf1
name: Third-party Personnel Security
description: |-
  The organization:
    a. Establishes personnel security requirements including security roles and responsibilities for third-party providers;
    b. Requires third-party providers to comply with personnel security policies and procedures established by the organization;
    c. Documents personnel security requirements;
    d. Requires third-party providers to notify [Assignment: organization-defined personnel or roles] of any personnel transfers or terminations of third-party personnel who possess organizational credentials and/or badges, or who have information system privileges within [Assignment: organization-defined time period]; and
    e. Monitors provider compliance.
elementType: control
externalId: PS-7
guidance: Third-party providers include, for example, service bureaus, contractors, and other organizations providing information system development, information technology services, outsourced applications, and network and security management. Organizations explicitly include personnel security requirements in acquisition-related documents. Third-party providers may have personnel working at organizational facilities with credentials, badges, or information system privileges issued by organizations. Notifications of third-party personnel changes ensure appropriate termination of privileges and credentials. Organizations define the transfers and terminations deemed reportable by security-related characteristics that include, for example, functions, roles, and nature of credentials/privileges associated with individuals transferred or terminated.
parent: ps
