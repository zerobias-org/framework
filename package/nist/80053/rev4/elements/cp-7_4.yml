id: 38b78d87-eb5b-55c9-86c0-5ba3134335bf
name: Preparation For Use
description: The organization prepares the alternate processing site so that the site is ready to be used as the operational site supporting essential missions and business functions.
elementType: enhancement
externalId: CP-7 (4)
guidance: Site preparation includes, for example, establishing configuration settings for information system components at the alternate processing site consistent with the requirements for such settings at the primary site and ensuring that essential supplies and other logistical considerations are in place.
