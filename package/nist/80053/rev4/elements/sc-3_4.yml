id: adce866b-6efd-5c82-9d4a-3a6b5c946d5b
name: Module Coupling and Cohesiveness
description: The organization implements security functions as largely independent modules that maximize internal cohesiveness within modules and minimize coupling between modules.
elementType: enhancement
externalId: SC-3 (4)
guidance: The reduction in inter-module interactions helps to constrain security functions and to manage complexity. The concepts of coupling and cohesion are important with respect to modularity in software design. Coupling refers to the dependencies that one module has on other modules. Cohesion refers to the relationship between the different functions within a particular module. Good software engineering practices rely on modular decomposition, layering, and minimization to reduce and manage complexity, thus producing software modules that are highly cohesive and loosely coupled.
