id: 7a126f8c-e4d4-5e5f-aea8-38bb03bcfbd9
name: Automatic Processing
description: "The information system provides the capability to process audit records for events of interest based on [Assignment: organization-defined audit fields within audit records]."
elementType: enhancement
externalId: AU-7 (1)
guidance: Events of interest can be identified by the content of specific audit record fields including, for example, identities of individuals, event types, event locations, event times, event dates, system resources involved, IP addresses involved, or information objects accessed. Organizations may define audit event criteria to any degree of granularity required, for example, locations selectable by general networking location (e.g., by network or subnetwork) or selectable by specific information system component.
parent: au-7
