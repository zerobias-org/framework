id: 0bc95c35-10eb-5d5f-86e5-0b72aa801fe7
name: Invalidate Session Identifiers At Logout
description: The information system invalidates session identifiers upon user logout or other session termination.
elementType: enhancement
externalId: SC-23 (1)
guidance: This control enhancement curtails the ability of adversaries from capturing and continuing to employ previously valid session IDs.
