id: b9339992-c1b1-57b2-afa9-13301f6235f7
name: User-initiated Logouts / Message Displays
description: |-
  The information system:
    (a) Provides a logout capability for user-initiated communications sessions whenever authentication is used to gain access to [Assignment: organization-defined information resources]; and
    (b) Displays an explicit logout message to users indicating the reliable termination of authenticated communications sessions.
elementType: enhancement
externalId: AC-12 (1)
guidance: Information resources to which users gain access via authentication include, for example, local workstations, databases, and password-protected websites/web-based services. Logout messages for web page access, for example, can be displayed after authenticated sessions have been terminated. However, for some types of interactive sessions including, for example, file transfer protocol (FTP) sessions, information systems typically send logout messages as final messages prior to terminating sessions.
parent: ac-12
aliases:
  - AC-12 (1)
  - AC-12(1)
