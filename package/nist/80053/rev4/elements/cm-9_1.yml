id: 2cfc523c-37c0-556e-9be7-167362fcda60
name: Assignment Of Responsibility
description: The organization assigns responsibility for developing the configuration management process to organizational personnel that are not directly involved in information system development.
elementType: enhancement
externalId: CM-9 (1)
guidance: In the absence of dedicated configuration management teams assigned within organizations, system developers may be tasked to develop configuration management processes using personnel who are not directly involved in system development or integration. This separation of duties ensures that organizations establish and maintain a sufficient degree of independence between the information system development and integration processes and configuration management processes to facilitate quality control and more effective oversight.
