id: 2955a0d2-0a16-58cc-9459-85a4c2fe265a
name: Multiple Information System Accounts
description: "The organization implements [Assignment: organization-defined security safeguards] to manage the risk of compromise due to individuals having accounts on multiple information systems."
elementType: enhancement
externalId: IA-5 (8)
guidance: "When individuals have accounts on multiple information systems, there is the risk that the compromise of one account may lead to the compromise of other accounts if individuals use the same authenticators. Possible alternatives include, for example: (i) having different authenticators on all systems; (ii) employing some form of single sign-on mechanism; or (iii) including some form of one-time passwords on all systems."
parent: ia-5
