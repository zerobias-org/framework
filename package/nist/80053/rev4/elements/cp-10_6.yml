id: b0ec0db6-edc8-522a-aefb-735915bf6086
name: Component Protection
description: The organization protects backup and restoration hardware, firmware, and software.
elementType: enhancement
externalId: CP-10 (6)
guidance: Protection of backup and restoration hardware, firmware, and software components includes both physical and technical safeguards. Backup and restoration software includes, for example, router tables, compilers, and other security-relevant system software.
