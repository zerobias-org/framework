id: 107a8f2b-bd9e-59e6-a884-0272b7a56cc6
name: Information Output Filtering
description: 'The information system validates information output from [Assignment: organization-defined software programs and/or applications] to ensure that the information is consistent with the expected content.'
elementType: control
externalId: SI-15
guidance: Certain types of cyber attacks (e.g., SQL injections) produce output results that are unexpected or inconsistent with the output results that would normally be expected from software programs or applications. This control enhancement focuses on detecting extraneous content, preventing such extraneous content from being displayed, and alerting monitoring tools that anomalous behavior has been discovered.
parent: si
