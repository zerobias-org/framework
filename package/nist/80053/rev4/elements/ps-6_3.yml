id: fc9f3d29-be2e-5937-bd5a-5b2d2a91cbaa
name: Post-employment Requirements
description: |-
  The organization:
    (a) Notifies individuals of applicable, legally binding post-employment requirements for protection of organizational information; and
    (b) Requires individuals to sign an acknowledgment of these requirements, if applicable, as part of granting initial access to covered information.
elementType: enhancement
externalId: PS-6 (3)
guidance: Organizations consult with the Office of the General Counsel regarding matters of post-employment requirements on terminated individuals.
parent: ps-6
