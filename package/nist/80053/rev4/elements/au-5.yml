id: b212642f-15ed-51a4-8e98-ec2a996d7ea0
name: Response To Audit Processing Failures
description: |-
  The information system:
    a. Alerts [Assignment: organization-defined personnel or roles] in the event of an audit processing failure; and
    b. Takes the following additional actions: [Assignment: organization-defined actions to be taken (e.g., shut down information system, overwrite oldest audit records, stop generating audit records)].
elementType: control
externalId: AU-5
guidance: Audit processing failures include, for example, software/hardware errors, failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. Organizations may choose to define additional actions for different audit processing failures (e.g., by type, by location, by severity, or a combination of such factors). This control applies to each audit data storage repository (i.e., distinct information system component where audit records are stored), the total audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
parent: au
