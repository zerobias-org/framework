name: Automated Testing
description: The organization employs automated mechanisms to more thoroughly and effectively test the contingency plan.
elementType: enhancement
externalId: CP-4 (3)
guidance: "Automated mechanisms provide more thorough and effective testing of contingency plans, for example: (i) by providing more complete coverage of contingency issues; (ii) by selecting more realistic test scenarios and environments; and (iii) by effectively stressing the information system and supported missions."
