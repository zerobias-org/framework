id: 16eb17d5-1c02-5adc-8af7-cbda4e40a8af
name: Correlate Monitoring Information
description: The organization correlates information from monitoring tools employed throughout the information system.
elementType: enhancement
externalId: SI-4 (16)
guidance: Correlating information from different monitoring tools can provide a more comprehensive view of information system activity. The correlation of monitoring tools that usually work in isolation (e.g., host monitoring, network monitoring, anti-virus software) can provide an organization-wide view and in so doing, may reveal otherwise unseen attack patterns. Understanding the capabilities/limitations of diverse monitoring tools and how to maximize the utility of information generated by those tools can help organizations to build, operate, and maintain effective monitoring programs.
parent: si-4
