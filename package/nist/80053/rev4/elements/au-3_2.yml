id: 9619daa0-b81a-5b98-bed2-5be7a458fbba
name: Centralized Management Of Planned Audit Record Content
description: "The information system provides centralized management and configuration of the content to be captured in audit records generated by [Assignment: organization-defined information system components]."
elementType: enhancement
externalId: AU-3 (2)
guidance: This control enhancement requires that the content to be captured in audit records be configured from a central location (necessitating automation). Organizations coordinate the selection of required audit content to support the centralized management and configuration capability provided by the information system.
