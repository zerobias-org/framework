id: daa5b5e5-be56-5978-9771-976d80e40cd6
name: Privilege Levels For Code Execution
description: "The information system prevents [Assignment: organization-defined software] from executing at higher privilege levels than users executing the software."
elementType: enhancement
externalId: AC-6 (8)
guidance: In certain situations, software applications/programs need to execute with elevated privileges to perform required functions. However, if the privileges required for execution are at a higher level than the privileges assigned to organizational users invoking such applications/programs, those users are indirectly provided with greater privileges than assigned by organizations.
parent: ac-6
