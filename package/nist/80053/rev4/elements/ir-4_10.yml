id: a728a304-7d6d-5093-80d9-af4c35bedcd7
name: Supply Chain Coordination
description: The organization coordinates incident handling activities involving supply chain events with other organizations involved in the supply chain.
elementType: enhancement
externalId: IR-4 (10)
guidance: Organizations involved in supply chain activities include, for example, system/product developers, integrators, manufacturers, packagers, assemblers, distributors, vendors, and resellers. Supply chain incidents include, for example, compromises/breaches involving information system components, information technology products, development processes or personnel, and distribution processes or warehousing facilities.
