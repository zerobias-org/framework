id: fcbb3ae1-c8cd-54af-8bbd-115b81fda32a
name: Publicly Accessible Content
description: |-
  The organization:
    a. Designates individuals authorized to post information onto a publicly accessible information system;
    b. Trains authorized individuals to ensure that publicly accessible information does not contain nonpublic information;
    c. Reviews the proposed content of information prior to posting onto the publicly accessible information system to ensure that nonpublic information is not included; and
    d. Reviews the content on the publicly accessible information system for nonpublic information [Assignment: organization-defined frequency] and removes such information, if discovered.
elementType: control
externalId: AC-22
guidance: In accordance with federal laws, Executive Orders, directives, policies, regulations, standards, and/or guidance, the general public is not authorized access to nonpublic information (e.g., information protected under the Privacy Act and proprietary information). This control addresses information systems that are controlled by the organization and accessible to the general public, typically without identification or authentication. The posting of information on non-organization information systems is covered by organizational policy.
parent: ac
