id: 413ce1cf-7769-5f6e-8aaa-6db1cceffdeb
name: Mechanisms Supporting Itemized or Tiered Consent
description: "The organization implements mechanisms to support itemized or tiered consent for specific uses of data"
elementType: enhancement
externalId: IP-1 (1)
guidance: "Organizations can provide, for example, individuals' itemized choices as to whether they wish to be contacted for any of a variety of purposes. In this situation, organizations construct consent mechanisms to ensure that organizational operations comply with individual choices"
parent: ip-1
