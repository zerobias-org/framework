id: a6401158-7ce6-59be-b3d6-1a696fef7eaf
name: Contacts With Security Groups and Associations
description: |-
  The organization establishes and institutionalizes contact with selected groups and associations within the security community:
    a. To facilitate ongoing security education and training for organizational personnel;
    b. To maintain currency with recommended security practices, techniques, and technologies; and
    c. To share current security-related information including threats, vulnerabilities, and incidents.
elementType: control
externalId: PM-15
guidance: Ongoing contact with security groups and associations is of paramount importance in an environment of rapidly changing technologies and threats. Security groups and associations include, for example, special interest groups, forums, professional associations, news groups, and/or peer groups of security professionals in similar organizations. Organizations select groups and associations based on organizational missions/business functions. Organizations share threat, vulnerability, and incident information consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.
parent: pm
