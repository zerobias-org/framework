id: 34a40969-81f6-553a-b435-a35e056d268d
name: Marking Output Devices
description: "The organization marks [Assignment: organization-defined information system output devices] indicating the appropriate security marking of the information permitted to be output from the device."
elementType: enhancement
externalId: PE-5 (3)
guidance: Outputs devices include, for example, printers, monitors, facsimile machines, scanners, copiers, and audio devices. This control enhancement is generally applicable to information system output devices other than mobiles devices.
