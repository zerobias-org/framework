name: Information Security Measures Of Performance
description: The organization develops, monitors, and reports on the results of information security measures of performance.
elementType: control
externalId: PM-6
guidance: Measures of performance are outcome-based metrics used by an organization to measure the effectiveness or efficiency of the information security program and the security controls employed in support of the program.
