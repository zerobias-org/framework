name: Reviews and Updates
description: "The organization reviews and updates the audited events [Assignment: organization-defined frequency]."
elementType: enhancement
externalId: AU-2 (3)
guidance: Over time, the events that organizations believe should be audited may change. Reviewing and updating the set of audited events periodically is necessary to ensure that the current set is still necessary and sufficient.
