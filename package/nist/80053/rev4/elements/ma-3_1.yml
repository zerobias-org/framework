id: 22a5357d-cae2-5540-a19d-45db40395bfd
name: Inspect Tools
description: The organization inspects the maintenance tools carried into a facility by maintenance personnel for improper or unauthorized modifications.
elementType: enhancement
externalId: MA-3 (1)
guidance: If, upon inspection of maintenance tools, organizations determine that the tools have been modified in an improper/unauthorized manner or contain malicious code, the incident is handled consistent with organizational policies and procedures for incident handling.
