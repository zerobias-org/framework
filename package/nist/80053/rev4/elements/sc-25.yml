name: Thin Nodes
description: 'The organization employs [Assignment: organization-defined information system components] with minimal functionality and information storage.'
elementType: control
externalId: SC-25
guidance: The deployment of information system components with reduced/minimal functionality (e.g., diskless nodes and thin client technologies) reduces the need to secure every user endpoint, and may reduce the exposure of information, information systems, and services to cyber attacks.
