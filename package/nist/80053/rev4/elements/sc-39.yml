id: 4d5f4b49-b9de-5c09-b20e-2623111de9e1
name: Process Isolation
description: The information system maintains a separate execution domain for each executing process.
elementType: control
externalId: SC-39
guidance: Information systems can maintain separate execution domains for each executing process by assigning each process a separate address space. Each information system process has a distinct address space so that communication between processes is performed in a manner controlled through the security functions, and one process cannot modify the executing code of another process. Maintaining separate execution domains for executing processes can be achieved, for example, by implementing separate address spaces. This capability is available in most commercial operating systems that employ multi-state processor technologies.
parent: sc
