id: 11e2ec53-84c5-53b9-b6bd-f611a068b909
name: Separate Processing Domains
description: The information system provides separate processing domains to enable finer-grained allocation of user privileges.
elementType: enhancement
externalId: AC-6 (4)
guidance: "Providing separate processing domains for finer-grained allocation of user privileges includes, for example: (i) using virtualization techniques to allow additional privileges within a virtual machine while restricting privileges to other virtual machines or to the underlying actual machine; (ii) employing hardware and/or software domain separation mechanisms; and (iii) implementing separate physical domains."
parent: ac-6
