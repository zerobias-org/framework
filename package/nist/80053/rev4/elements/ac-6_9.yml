id: 6dbd3080-f677-50b3-bc0f-7c48f3644dad
name: Auditing Use Of Privileged Functions
description: The information system audits the execution of privileged functions.
elementType: enhancement
externalId: AC-6 (9)
guidance: Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse, and in doing so, help mitigate the risk from insider threats and the advanced persistent threat (APT).
