id: 18e7cdf5-63fd-59cd-9210-19014f839bc9
name: No Writable Storage
description: "The organization employs [Assignment: organization-defined information system components] with no writeable storage that is persistent across component restart or power on/off."
elementType: enhancement
externalId: SC-34 (1)
guidance: "This control enhancement: (i) eliminates the possibility of malicious code insertion via persistent, writeable storage within the designated information system components; and (ii) applies to both fixed and removable storage, with the latter being addressed directly or as specific restrictions imposed through access controls for mobile devices."
parent: sc-34
