id: 93994703-7335-534a-aa7c-76b1b093edc4
name: Open Source Software
description: "The organization establishes the following restrictions on the use of open source software: [Assignment: organization-defined restrictions]."
elementType: enhancement
externalId: CM-10 (1)
guidance: Open source software refers to software that is available in source code form. Certain software rights normally reserved for copyright holders are routinely provided under software license agreements that permit individuals to study, change, and improve the software. From a security perspective, the major advantage of open source software is that it provides organizations with the ability to examine the source code. However, there are also various licensing issues associated with open source software including, for example, the constraints on derivative use of such software.
