id: fbb3e4b8-2020-5433-9d65-4c35c777f54f
name: Custodians
description: The organization employs an identified custodian during transport of information system media outside of controlled areas.
elementType: enhancement
externalId: MP-5 (3)
guidance: Identified custodians provide organizations with specific points of contact during the media transport process and facilitate individual accountability. Custodial responsibilities can be transferred from one individual to another as long as an unambiguous custodian is identified at all times.
parent: mp-5
