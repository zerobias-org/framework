id: dd5f2294-5ea0-5142-8a1d-ed51213b71e6
name: Pattern-hiding Displays
description: The information system conceals, via the session lock, information previously visible on the display with a publicly viewable image.
elementType: enhancement
externalId: AC-11 (1)
guidance: Publicly viewable images can include static or dynamic images, for example, patterns used with screen savers, photographic images, solid colors, clock, battery life indicator, or a blank screen, with the additional caveat that none of the images convey sensitive information.
parent: ac-11
