id: c9e2980f-57b4-5c73-a661-0b4b199ad122
name: Acceptance Of Piv Credentials
description: The information system accepts and electronically verifies Personal Identity Verification (PIV) credentials.
elementType: enhancement
externalId: IA-2 (12)
guidance: This control enhancement applies to organizations implementing logical access control systems (LACS) and physical access control systems (PACS). Personal Identity Verification (PIV) credentials are those credentials issued by federal agencies that conform to FIPS Publication 201 and supporting guidance documents. OMB Memorandum 11-11 requires federal agencies to continue implementing the requirements specified in HSPD-12 to enable agency-wide use of PIV credentials.
