id: c06cc569-1695-5e80-8f73-409ad23628d7
name: Compliant Management
description: "The organization implements a process for receiving and responding to complaints, concerns, or questions from individuals about the organizational privacy practices."
elementType: control
externalId: IP-4
guidance: "Complaints, concerns, and questions from individuals can serve as a valuable source of external input that ultimately improves operational models, uses of technology, data collection practices, and privacy and security safeguards. Organizations provide complaint mechanisms that are readily accessible by the public, include all information necessary for successfully filing complaints (including contact information for the Senior Agency Official for Privacy (SAOP)/Chief Privacy Officer (CPO) or other official designated to receive complaints), and are easy to use. Organizational complaint management processes include tracking mechanisms to ensure that all complaints received are reviewed and appropriately addressed in a timely manner."
parent: ip
