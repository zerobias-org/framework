id: a44de809-f20d-56b9-93af-72b5069e10da
name: Long-term Retrieval Capability
description: "The organization employs [Assignment: organization-defined measures] to ensure that long-term audit records generated by the information system can be retrieved."
elementType: enhancement
externalId: AU-11 (1)
guidance: Measures employed by organizations to help facilitate the retrieval of audit records include, for example, converting records to newer formats, retaining equipment capable of reading the records, and retaining necessary documentation to help organizational personnel understand how to interpret the records.
