id: 80e95fe1-6db3-5cb4-89eb-3ecb415702e3
name: Emergency Lighting
description: The organization employs and maintains automatic emergency lighting for the information system that activates in the event of a power outage or disruption and that covers emergency exits and evacuation routes within the facility.
elementType: control
externalId: PE-12
guidance: This control applies primarily to facilities containing concentrations of information system resources including, for example, data centers, server rooms, and mainframe computer rooms.
parent: pe
