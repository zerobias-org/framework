id: 68e65a75-b4bd-5a2b-ab9d-dd1f3ccacc93
name: Automated Maintenance
description: The organization employs automated mechanisms to help maintain an up-to-date, complete, accurate, and readily available inventory of information system components.
elementType: enhancement
externalId: CM-8 (2)
guidance: Organizations maintain information system inventories to the extent feasible. Virtual machines, for example, can be difficult to monitor because such machines are not visible to the network when not in use. In such cases, organizations maintain as up-to-date, complete, and accurate an inventory as is deemed reasonable. This control enhancement can be satisfied by the implementation of CM-2 (2) for organizations that choose to combine information system component inventory and baseline configuration activities.
parent: cm-8
aliases:
