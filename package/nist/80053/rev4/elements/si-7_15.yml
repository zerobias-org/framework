id: cfa1f055-b446-5f20-8dcc-edde907a0599
name: Code Authentication
description: "The information system implements cryptographic mechanisms to authenticate [Assignment: organization-defined software or firmware components] prior to installation."
elementType: enhancement
externalId: SI-7 (15)
guidance: Cryptographic authentication includes, for example, verifying that software or firmware components have been digitally signed using certificates recognized and approved by organizations. Code signing is an effective method to protect against malicious code.
