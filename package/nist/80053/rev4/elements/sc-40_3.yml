id: 0c94c6bb-00a9-57b9-b48b-c0cfe1e61691
name: Imitative Or Manipulative Communications Deception
description: The information system implements cryptographic mechanisms to identify and reject wireless transmissions that are deliberate attempts to achieve imitative or manipulative communications deception based on signal parameters.
elementType: enhancement
externalId: SC-40 (3)
guidance: This control enhancement ensures that the signal parameters of wireless transmissions are not predictable by unauthorized individuals. Such unpredictability reduces the probability of imitative or manipulative communications deception based upon signal parameters alone.
parent: sc-40
