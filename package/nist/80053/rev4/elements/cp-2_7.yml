id: 2fa859ae-2c3e-5dfb-b0ad-1d044d3a5369
name: Coordinate  With External Service Providers
description: The organization coordinates its contingency plan with the contingency plans of external service providers to ensure that contingency requirements can be satisfied.
elementType: enhancement
externalId: CP-2 (7)
guidance: When the capability of an organization to successfully carry out its core missions/business functions is dependent on external service providers, developing a timely and comprehensive contingency plan may become more challenging. In this situation, organizations coordinate contingency planning activities with the external entities to ensure that the individual plans reflect the overall contingency needs of the organization.
parent: cp-2
