id: 98d601ea-f979-5f03-9cca-2d6b2054dbf4
name: Automated Notification
description: "The organization employs automated mechanisms to notify [Assignment: organization-defined personnel or roles] upon termination of an individual."
elementType: enhancement
externalId: PS-4 (2)
guidance: In organizations with a large number of employees, not all personnel who need to know about termination actions receive the appropriate notifications - or, if such notifications are received, they may not occur in a timely manner. Automated mechanisms can be used to send automatic alerts or notifications to specific organizational personnel or roles (e.g., management personnel, supervisors, personnel security officers, information security officers, systems administrators, or information technology administrators) when individuals are terminated. Such automatic alerts or notifications can be conveyed in a variety of ways, including, for example, telephonically, via electronic mail, via text message, or via websites.
parent: ps-4
aliases:
