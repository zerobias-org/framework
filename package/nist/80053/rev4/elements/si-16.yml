id: 6b3e7170-b2e2-5c1e-ab22-b0a6f6d75842
name: Memory Protection
description: 'The information system implements [Assignment: organization-defined security safeguards] to protect its memory from unauthorized code execution.'
elementType: control
externalId: SI-16
guidance: Some adversaries launch attacks with the intent of executing code in non-executable regions of memory or in memory locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can either be hardware-enforced or software-enforced with hardware providing the greater strength of mechanism.
parent: si
