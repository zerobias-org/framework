id: 10f5b642-4ba4-5a79-92e0-138dab7adcb6
name: Dynamic Information Flow Control
description: "The information system enforces dynamic information flow control based on [Assignment: organization-defined policies]."
elementType: enhancement
externalId: AC-4 (3)
guidance: Organizational policies regarding dynamic information flow control include, for example, allowing or disallowing information flows based on changing conditions or mission/operational considerations. Changing conditions include, for example, changes in organizational risk tolerance due to changes in the immediacy of mission/business needs, changes in the threat environment, and detection of potentially harmful or adverse events.
