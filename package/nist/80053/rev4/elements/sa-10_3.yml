id: 8b8962be-2a11-5a92-a2c0-4be1f5be2014
name: Hardware Integrity Verification
description: The organization requires the developer of the information system, system component, or information system service to enable integrity verification of hardware components.
elementType: enhancement
externalId: SA-10 (3)
guidance: This control enhancement allows organizations to detect unauthorized changes to hardware components through the use of tools, techniques, and/or mechanisms provided by developers. Organizations verify the integrity of hardware components, for example, with hard-to-copy labels and verifiable serial numbers provided by developers, and by requiring the implementation of anti-tamper technologies. Delivered hardware components also include updates to such components.
parent: sa-10
aliases:
