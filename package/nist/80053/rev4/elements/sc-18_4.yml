id: 8de921b4-4e9d-57fb-9db4-5cf524c7538c
name: Prevent Automatic Execution
description: "The information system prevents the automatic execution of mobile code in [Assignment: organization-defined software applications] and enforces [Assignment: organization-defined actions] prior to executing the code."
elementType: enhancement
externalId: SC-18 (4)
guidance: Actions enforced before executing mobile code, include, for example, prompting users prior to opening electronic mail attachments. Preventing automatic execution of mobile code includes, for example, disabling auto execute features on information system components employing portable storage devices such as Compact Disks (CDs), Digital Video Disks (DVDs), and Universal Serial Bus (USB) devices.
parent: sc-18
