id: 8c5576e3-ec71-518c-a8f8-5702c0721c26
name: Insider Threats - Intra-organization Coordination
description: "The organization coordinates incident handling capability for insider threats across [Assignment: organization-defined components or elements of the organization]."
elementType: enhancement
externalId: IR-4 (7)
guidance: Incident handling for insider threat incidents (including preparation, detection and analysis, containment, eradication, and recovery) requires close coordination among a variety of organizational components or elements to be effective. These components or elements include, for example, mission/business owners, information system owners, human resources offices, procurement offices, personnel/physical security offices, operations personnel, and risk executive (function). In addition, organizations may require external support from federal, state, and local law enforcement agencies.
