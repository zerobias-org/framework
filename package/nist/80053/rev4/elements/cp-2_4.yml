id: 90317162-a651-553b-b414-efbcd29938d8
name: Resume All Missions / Business Functions
description: "The organization plans for the resumption of all missions and business functions within [Assignment: organization-defined time period] of contingency plan activation."
elementType: enhancement
externalId: CP-2 (4)
guidance: Organizations may choose to carry out the contingency planning activities in this control enhancement as part of organizational business continuity planning including, for example, as part of business impact analyses. The time period for resumption of all missions/business functions may be dependent on the severity/extent of disruptions to the information system and its supporting infrastructure.
