id: 08bd94df-a2b1-5163-9875-4a3ba3fc201b
name: In-person Registration
description: The organization requires that the registration process to receive an individual identifier be conducted in person before a designated registration authority.
elementType: enhancement
externalId: IA-4 (7)
guidance: In-person registration reduces the likelihood of fraudulent identifiers being issued because it requires the physical presence of individuals and actual face-to-face interactions with designated registration authorities.
