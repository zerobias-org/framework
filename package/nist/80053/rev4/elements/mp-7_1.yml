id: 14ffae5a-b6a5-5fb6-ba14-ef75e7ea938d
name: Prohibit Use Without Owner
description: The organization prohibits the use of portable storage devices in organizational information systems when such devices have no identifiable owner.
elementType: enhancement
externalId: MP-7 (1)
guidance: Requiring identifiable owners (e.g., individuals, organizations, or projects) for portable storage devices reduces the risk of using such technologies by allowing organizations to assign responsibility and accountability for addressing known vulnerabilities in the devices (e.g., malicious code insertion).
parent: mp-7
aliases:
