id: 5e00507a-0d7d-59ed-b6f4-19152a50477b
name: No Embedded Unencrypted Static Authenticators
description: The organization ensures that unencrypted static authenticators are not embedded in applications or access scripts or stored on function keys.
elementType: enhancement
externalId: IA-5 (7)
guidance: Organizations exercise caution in determining whether embedded or stored authenticators are in encrypted or unencrypted form. If authenticators are used in the manner stored, then those representations are considered unencrypted authenticators. This is irrespective of whether that representation is perhaps an encrypted version of something else (e.g., a password).
