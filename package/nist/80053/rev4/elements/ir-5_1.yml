name: Automated Tracking / Data Collection / Analysis
description: The organization employs automated mechanisms to assist in the tracking of security incidents and in the collection and analysis of incident information.
elementType: enhancement
externalId: IR-5 (1)
guidance: Automated mechanisms for tracking security incidents and collecting/analyzing incident information include, for example, the Einstein network monitoring device and monitoring online Computer Incident Response Centers (CIRCs) or other electronic databases of incidents.
