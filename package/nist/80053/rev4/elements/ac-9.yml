id: 653e9149-cdae-5ed9-9b32-c60c415ac41e
name: Previous Logon (access) Notification
description: The information system notifies the user, upon successful logon (access) to the system, of the date and time of the last logon (access).
elementType: control
externalId: AC-9
guidance: This control is applicable to logons to information systems via human user interfaces and logons to systems that occur in other types of architectures (e.g., service-oriented architectures).
parent: ac
