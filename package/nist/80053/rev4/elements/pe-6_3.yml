id: 68666991-68dc-5ad5-a68f-0bad6be01b34
name: Video Surveillance
description: "The organization employs video surveillance of [Assignment: organization-defined operational areas] and retains video recordings for [Assignment: organization-defined time period]."
elementType: enhancement
externalId: PE-6 (3)
guidance: This control enhancement focuses on recording surveillance video for purposes of subsequent review, if circumstances so warrant (e.g., a break-in detected by other means). It does not require monitoring surveillance video although organizations may choose to do so. Note that there may be legal considerations when performing and retaining video surveillance, especially if such surveillance is in a public location.
parent: pe-6
