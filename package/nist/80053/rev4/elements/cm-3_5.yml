name: Automated Security Response
description: "The information system implements [Assignment: organization-defined security responses] automatically if baseline configurations are changed in an unauthorized manner."
elementType: enhancement
externalId: CM-3 (5)
guidance: Security responses include, for example, halting information system processing, halting selected system functions, or issuing alerts/notifications to organizational personnel when there is an unauthorized modification of a configuration item.
