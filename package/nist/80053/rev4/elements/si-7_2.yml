id: 3a6002e7-6e91-5bf7-a11b-184af4e2697a
name: Automated Notifications Of Integrity Violations
description: "The organization employs automated tools that provide notification to [Assignment: organization-defined personnel or roles] upon discovering discrepancies during integrity verification."
elementType: enhancement
externalId: SI-7 (2)
guidance: The use of automated tools to report integrity violations and to notify organizational personnel in a timely matter is an essential precursor to effective risk response. Personnel having an interest in integrity violations include, for example, mission/business owners, information system owners, systems administrators, software developers, systems integrators, and information security officers.
