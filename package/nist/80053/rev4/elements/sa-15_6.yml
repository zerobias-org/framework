name: Continuous Improvement
description: The organization requires the developer of the information system, system component, or information system service to implement an explicit process to continuously improve the development process.
elementType: enhancement
externalId: SA-15 (6)
guidance: Developers of information systems, information system components, and information system services consider the effectiveness/efficiency of current development processes for meeting quality objectives and addressing security capabilities in current threat environments.
