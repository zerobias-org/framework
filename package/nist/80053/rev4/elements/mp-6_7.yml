id: cd24eca7-0686-5ec0-a3d0-42d537ea2e78
name: Dual Authorization
description: "The organization enforces dual authorization for the sanitization of [Assignment: organization-defined information system media]."
elementType: enhancement
externalId: MP-6 (7)
guidance: Organizations employ dual authorization to ensure that information system media sanitization cannot occur unless two technically qualified individuals conduct the task. Individuals sanitizing information system media possess sufficient skills/expertise to determine if the proposed sanitization reflects applicable federal/organizational standards, policies, and procedures. Dual authorization also helps to ensure that sanitization occurs as intended, both protecting against errors and false claims of having performed the sanitization actions. Dual authorization may also be known as two-person control.
parent: mp-6
aliases:
