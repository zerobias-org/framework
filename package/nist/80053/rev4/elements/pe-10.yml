id: 065fc9bc-1ea6-5a4a-8dec-e5a692d756c4
name: Emergency Shutoff
description: |-
  The organization:
    a. Provides the capability of shutting off power to the information system or individual system components in emergency situations;
    b. Places emergency shutoff switches or devices in [Assignment: organization-defined location by information system or system component] to facilitate safe and easy access for personnel; and
    c. Protects emergency power shutoff capability from unauthorized activation.
elementType: control
externalId: PE-10
guidance: This control applies primarily to facilities containing concentrations of information system resources including, for example, data centers, server rooms, and mainframe computer rooms.
parent: pe
