id: ba117d4e-a037-50a8-b6f5-148b9ec17a68
name: Predictable Behavior
description: The information system behaves in a predictable and documented manner that reflects organizational and system objectives when invalid inputs are received.
elementType: enhancement
externalId: SI-10 (3)
guidance: A common vulnerability in organizational information systems is unpredictable behavior when invalid inputs are received. This control enhancement ensures that there is predictable behavior in the face of invalid inputs by specifying information system responses that facilitate transitioning the system to known states without adverse, unintended side effects.
parent: si-10
