id: fb96705c-749b-5a67-9a5c-5e534d55a7ab
name: System and Information Integrity Policy and Procedures
description: |-
  The organization:
    a. Develops, documents, and disseminates to [Assignment: organization-defined personnel or roles]:
      1. A system and information integrity policy that addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
      2. Procedures to facilitate the implementation of the system and information integrity policy and associated system and information integrity controls; and
    b. Reviews and updates the current:
      1. System and information integrity policy [Assignment: organization-defined frequency]; and
      2. System and information integrity procedures [Assignment: organization-defined frequency].
elementType: control
externalId: SI-1
guidance: This control addresses the establishment of policy and procedures for the effective implementation of selected security controls and control enhancements in the SI family. Policy and procedures reflect applicable federal laws, Executive Orders, directives, regulations, policies, standards, and guidance. Security program policies and procedures at the organization level may make the need for system-specific policies and procedures unnecessary. The policy can be included as part of the general information security policy for organizations or conversely, can be represented by multiple policies reflecting the complex nature of certain organizations. The procedures can be established for the security program in general and for particular information systems, if needed. The organizational risk management strategy is a key factor in establishing policy and procedures.
parent: si
