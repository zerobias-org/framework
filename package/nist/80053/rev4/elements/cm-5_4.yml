id: c9242152-3ce4-5039-9dcd-6ea645b0eb08
name: Dual Authorization
description: "The organization enforces dual authorization for implementing changes to [Assignment: organization-defined information system components and system-level information]."
elementType: enhancement
externalId: CM-5 (4)
guidance: Organizations employ dual authorization to ensure that any changes to selected information system components and information cannot occur unless two qualified individuals implement such changes. The two individuals possess sufficient skills/expertise to determine if the proposed changes are correct implementations of approved changes. Dual authorization may also be known as two-person control.
parent: cm-5
