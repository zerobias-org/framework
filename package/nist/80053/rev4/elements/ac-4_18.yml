id: 32acf922-2719-58fa-9bbe-765b1df57cc2
name: Security Attribute Binding
description: "The information system binds security attributes to information using [Assignment: organization-defined binding techniques] to facilitate information flow policy enforcement."
elementType: enhancement
externalId: AC-4 (18)
guidance: Binding techniques implemented by information systems affect the strength of security attribute binding to information. Binding strength and the assurance associated with binding techniques play an important part in the trust organizations have in the information flow enforcement process. The binding techniques affect the number and degree of additional reviews required by organizations.
