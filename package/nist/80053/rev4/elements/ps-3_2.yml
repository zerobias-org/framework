id: 91bfa48c-d3cc-5827-95a0-beffecff129f
name: Formal Indoctrination
description: The organization ensures that individuals accessing an information system processing, storing, or transmitting types of classified information which require formal indoctrination, are formally indoctrinated for all of the relevant types of information to which they have access on the system.
elementType: enhancement
externalId: PS-3 (2)
guidance: Types of classified information requiring formal indoctrination include, for example, Special Access Program (SAP), Restricted Data (RD), and Sensitive Compartment Information (SCI).
parent: ps-3
aliases:
