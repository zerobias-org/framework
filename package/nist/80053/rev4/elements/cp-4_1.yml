id: 5256b29d-5005-5c45-9d92-82c71030e83e
name: Coordinate With Related Plans
description: The organization coordinates contingency plan testing with organizational elements responsible for related plans.
elementType: enhancement
externalId: CP-4 (1)
guidance: Plans related to contingency plans for organizational information systems include, for example, Business Continuity Plans, Disaster Recovery Plans, Continuity of Operations Plans, Crisis Communications Plans, Critical Infrastructure Plans, Cyber Incident Response Plans, and Occupant Emergency Plans. This control enhancement does not require organizations to create organizational elements to handle related plans or to align such elements with specific plans. It does require, however, that if such organizational elements are responsible for related plans, organizations should coordinate with those elements.
parent: cp-4
aliases:
