id: bfa823cd-8263-5421-a6f4-28a4c775b09d
name: Audit Reduction and Report Generation
description: |-
  The information system provides an audit reduction and report generation capability that:
    a. Supports on-demand audit review, analysis, and reporting requirements and after-the-fact investigations of security incidents; and
    b. Does not alter the original content or time ordering of audit records.
elementType: control
externalId: AU-7
guidance: Audit reduction is a process that manipulates collected audit information and organizes such information in a summary format that is more meaningful to analysts. Audit reduction and report generation capabilities do not always emanate from the same information system or from the same organizational entities conducting auditing activities. Audit reduction capability can include, for example, modern data mining techniques with advanced data filters to identify anomalous behavior in audit records. The report generation capability provided by the information system can generate customizable reports. Time ordering of audit records can be a significant issue if the granularity of the timestamp in the record is insufficient.
parent: au
