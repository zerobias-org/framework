id: 9c6718f7-020a-53a9-b627-85bf8f36f299
name: Access Only
description: The information system provides access from a single device to computing platforms, applications, or data residing on multiple different security domains, while preventing any information flow between the different security domains.
elementType: enhancement
externalId: AC-4 (22)
guidance: The information system, for example, provides a desktop for users to access each connected security domain without providing any mechanisms to allow transfer of information between the different security domains.
