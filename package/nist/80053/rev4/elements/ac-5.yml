id: cfb0d879-b0bc-525c-9328-d182eef424e7
name: Separation Of Duties
description: |-
  The organization:
    a. Separates [Assignment: organization-defined duties of individuals];
    b. Documents separation of duties of individuals; and
    c. Defines information system access authorizations to support separation of duties.
elementType: control
externalId: AC-5
guidance: 'Separation of duties addresses the potential for abuse of authorized privileges and helps to reduce the risk of malevolent activity without collusion. Separation of duties includes, for example: (i) dividing mission functions and information system support functions among different individuals and/or roles; (ii) conducting information system support functions with different individuals (e.g., system management, programming, configuration management, quality assurance and testing, and network security); and (iii) ensuring security personnel administering access control functions do not also administer audit functions.'
parent: ac
