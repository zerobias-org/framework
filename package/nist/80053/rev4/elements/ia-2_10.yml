name: Single Sign-on
description: "The information system provides a single sign-on capability for [Assignment: organization-defined information system accounts and services]."
elementType: enhancement
externalId: IA-2 (10)
guidance: Single sign-on enables users to log in once and gain access to multiple information system resources. Organizations consider the operational efficiencies provided by single sign-on capabilities with the increased risk from disclosures of single authenticators providing access to multiple system resources.
