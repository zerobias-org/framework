id: d85224f3-1c70-5025-b26b-e8f0402f2cf9
name: Off-line Storage
description: "The organization removes from online storage and stores off-line in a secure location [Assignment: organization-defined information]."
elementType: enhancement
externalId: SC-28 (2)
guidance: Removing organizational information from online information system storage to off-line storage eliminates the possibility of individuals gaining unauthorized access to the information through a network. Therefore, organizations may choose to move information to off-line storage in lieu of protecting such information in online storage.
