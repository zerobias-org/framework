id: dd8b81cf-3330-5635-87e8-079def5a9af8
name: Automated Tools For Real-time Analysis
description: The organization employs automated tools to support near real-time analysis of events.
elementType: enhancement
externalId: SI-4 (2)
guidance: Automated tools include, for example, host-based, network-based, transport-based, or storage-based event monitoring tools or Security Information and Event Management (SIEM) technologies that provide real time analysis of alerts and/or notifications generated by organizational information systems.
