id: ea656a44-775f-5059-a4a4-5701883d866f
name: Insider Threat
description: The organization includes security awareness training on recognizing and reporting potential indicators of insider threat.
elementType: enhancement
externalId: AT-2 (2)
guidance: Potential indicators and possible precursors of insider threat can include behaviors such as inordinate, long-term job dissatisfaction, attempts to gain access to information not required for job performance, unexplained access to financial resources, bullying or sexual harassment of fellow employees, workplace violence, and other serious violations of organizational policies, procedures, directives, rules, or practices. Security awareness training includes how to communicate employee and management concerns regarding potential indicators of insider threat through appropriate organizational channels in accordance with established organizational policies and procedures.
parent: at-2
