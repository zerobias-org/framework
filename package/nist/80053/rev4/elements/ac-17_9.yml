id: 7ae4913b-455e-5b98-88a5-cd1428b35d03
name: Disconnect / Disable Access
description: "The organization provides the capability to expeditiously disconnect or disable remote access to the information system within [Assignment: organization-defined time period]."
elementType: enhancement
externalId: AC-17 (9)
guidance: This control enhancement requires organizations to have the capability to rapidly disconnect current users remotely accessing the information system and/or disable further remote access. The speed of disconnect or disablement varies based on the criticality of missions/business functions and the need to eliminate immediate or future remote access to organizational information systems.
parent: ac-17
