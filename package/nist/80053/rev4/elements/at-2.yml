id: 1bbb1fb2-5c38-5fa1-b244-60fbe01d233b
name: Security Awareness Training
description: |-
  The organization provides basic security awareness training to information system users (including managers, senior executives, and contractors):
    a. As part of initial training for new users;
    b. When required by information system changes; and
    c. [Assignment: organization-defined frequency] thereafter.
elementType: control
externalId: AT-2
guidance: Organizations determine the appropriate content of security awareness training and security awareness techniques based on the specific organizational requirements and the information systems to which personnel have authorized access. The content includes a basic understanding of the need for information security and user actions to maintain security and to respond to suspected security incidents. The content also addresses awareness of the need for operations security. Security awareness techniques can include, for example, displaying posters, offering supplies inscribed with security reminders, generating email advisories/notices from senior organizational officials, displaying logon screen messages, and conducting information security awareness events.
parent: at
