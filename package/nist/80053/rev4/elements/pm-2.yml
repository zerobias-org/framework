id: 5df5560f-f9c9-54f9-8ebf-b52725d363b9
name: Senior Information Security Officer
description: The organization appoints a senior information security officer with the mission and resources to coordinate, develop, implement, and maintain an organization-wide information security program.
elementType: control
externalId: PM-2
guidance: The security officer described in this control is an organizational official.  For a federal agency (as defined in applicable federal laws, Executive Orders, directives, policies, or regulations) this official is the Senior Agency Information Security Officer. Organizations may also refer to this official as the Senior Information Security Officer or Chief Information Security Officer.
parent: pm
