id: 5258b9cf-7819-5c1c-ace1-4b9567e5521f
name: Plan Of Action and Milestones Process
description: |-
  The organization:
    a. Implements a process for ensuring that plans of action and milestones for the security program and associated organizational information systems:
      1. Are developed and maintained;
      2. Document the remedial information security actions to adequately respond to risk to organizational operations and assets, individuals, other organizations, and the Nation; and
      3. Are reported in accordance with OMB FISMA reporting requirements.
    b. Reviews plans of action and milestones for consistency with the organizational risk management strategy and organization-wide priorities for risk response actions.
elementType: control
externalId: PM-4
guidance: The plan of action and milestones is a key document in the information security program and is subject to federal reporting requirements established by OMB. With the increasing emphasis on organization-wide risk management across all three tiers in the risk management hierarchy (i.e., organization, mission/business process, and information system), organizations view plans of action and milestones from an organizational perspective, prioritizing risk response actions and ensuring consistency with the goals and objectives of the organization. Plan of action and milestones updates are based on findings from security control assessments and continuous monitoring activities. OMB FISMA reporting guidance contains instructions regarding organizational plans of action and milestones.
parent: pm
