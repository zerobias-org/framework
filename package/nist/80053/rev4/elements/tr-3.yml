id: eb23c5b7-66ca-57c3-b543-9450e0f1155f
name: Dissemination of Privacy Program Information
description: |-
  The organization:
    a. Ensures that the public has access to information about its privacy activities and is able to communicate with its Senior Agency Official for Privacy (SAOP)/Chief Privacy Officer (CPO); and
    b. Ensures that its privacy practices are publicly available through organizational websites or otherwise.
elementType: control
externalId: TR-3
guidance: "Organizations employ different mechanisms for informing the public about their privacy practices including, but not limited to, Privacy Impact Assessments (PIAs), System of Records Notices (SORNs), privacy reports, publicly available web pages, email distributions, blogs, and periodic publications (e.g., quarterly newsletters). Organizations also employ publicly facing email addresses and/or phone lines that enable the public to provide feedback and/or direct questions to privacy offices regarding privacy practices."
parent: tr
