id: 15480230-6bc8-5917-b418-824158c8c95a
name: Post-spill Operations
description: "The organization implements [Assignment: organization-defined procedures] to ensure that organizational personnel impacted by information spills can continue to carry out assigned tasks while contaminated systems are undergoing corrective actions."
elementType: enhancement
externalId: IR-9 (3)
guidance: Correction actions for information systems contaminated due to information spillages may be very time-consuming. During those periods, personnel may not have access to the contaminated systems, which may potentially affect their ability to conduct organizational business.
