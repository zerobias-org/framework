id: 1fcdd497-5c35-56ed-987f-7a521bfc69aa
name: Automation Support For Availability Of Information / Support
description: The organization employs automated mechanisms to increase the availability of incident response-related information and support.
elementType: enhancement
externalId: IR-7 (1)
guidance: Automated mechanisms can provide a push and/or pull capability for users to obtain incident response assistance. For example, individuals might have access to a website to query the assistance capability, or conversely, the assistance capability may have the ability to proactively send information to users (general distribution or targeted) as part of increasing understanding of current response capabilities and support.
parent: ir-7
