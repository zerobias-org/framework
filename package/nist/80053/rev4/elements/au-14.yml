id: 2902d337-1f7c-586c-955a-e2aaaf4c5338
name: Session Audit
description: The information system provides the capability for authorized users to select a user session to capture/record or view/hear.
elementType: control
externalId: AU-14
guidance: Session audits include, for example, monitoring keystrokes, tracking websites visited, and recording information and/or file transfers. Session auditing activities are developed, integrated, and used in consultation with legal counsel in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, or standards.
parent: au
