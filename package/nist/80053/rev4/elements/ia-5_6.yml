id: 57988604-0365-576d-87c5-c4a507696bec
name: Protection Of Authenticators
description: The organization protects authenticators commensurate with the security category of the information to which use of the authenticator permits access.
elementType: enhancement
externalId: IA-5 (6)
guidance: For information systems containing multiple security categories of information without reliable physical or logical separation between categories, authenticators used to grant access to the systems are protected commensurate with the highest security category of information on the systems.
