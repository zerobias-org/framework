id: cce8b4ca-299a-590f-bd44-d060652955e2
name: Power Equipment and Cabling
description: The organization protects power equipment and power cabling for the information system from damage and destruction.
elementType: control
externalId: PE-9
guidance: Organizations determine the types of protection necessary for power equipment and cabling employed at different locations both internal and external to organizational facilities and environments of operation. This includes, for example, generators and power cabling outside of buildings, internal cabling and uninterruptable power sources within an office or data center, and power sources for self-contained entities such as vehicles and satellites.
parent: pe
