id: 23a595f0-30fa-5661-ad14-e48420e5e73f
name: Review Of User Privileges
description: |-
  The organization:
    (a) Reviews [Assignment: organization-defined frequency] the privileges assigned to [Assignment: organization-defined roles or classes of users] to validate the need for such privileges; and
    (b) Reassigns or removes privileges, if necessary, to correctly reflect organizational mission/business needs.
elementType: enhancement
externalId: AC-6 (7)
guidance: The need for certain assigned user privileges may change over time reflecting changes in organizational missions/business function, environments of operation, technologies, or threat. Periodic review of assigned user privileges is necessary to determine if the rationale for assigning such privileges remains valid. If the need cannot be revalidated, organizations take appropriate corrective actions.
parent: ac-6
