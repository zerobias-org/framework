id: 662469b0-786a-5ac5-abbb-1335486ebbd9
name: Processes To Address Weaknesses Or Deficiencies
description: The organization establishes a process to address weaknesses or deficiencies in supply chain elements identified during independent or organizational assessments of such elements.
elementType: enhancement
externalId: SA-12 (15)
guidance: Evidence generated during independent or organizational assessments of supply chain elements (e.g., penetration testing, audits, verification/validation activities) is documented and used in follow-on processes implemented by organizations to respond to the risks related to the identified weaknesses and deficiencies. Supply chain elements include, for example, supplier development processes and supplier distribution systems.
