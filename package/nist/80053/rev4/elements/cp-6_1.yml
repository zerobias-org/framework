id: e092899f-8651-56d0-85d9-0e0130666642
name: Separation From Primary Site
description: The organization identifies an alternate storage site that is separated from the primary storage site to reduce susceptibility to the same threats.
elementType: enhancement
externalId: CP-6 (1)
guidance: Threats that affect alternate storage sites are typically defined in organizational assessments of risk and include, for example, natural disasters, structural failures, hostile cyber attacks, and errors of omission/commission. Organizations determine what is considered a sufficient degree of separation between primary and alternate storage sites based on the types of threats that are of concern. For one particular type of threat (i.e., hostile cyber attack), the degree of separation between sites is less relevant.
parent: cp-6
