id: 51673cd0-bd3d-5a18-9e90-37b96aa472f8
name: Individual Access
description: |-
  The organization:
    a. Provides individuals the ability to have access to their personally identifiable information (PII) maintained in its system(s) of records;
    b. Publishes rules and regulations governing how individuals may request access to records maintained in a Privacy Act system of records;
    c. Publishes access procedures in System of Records Notices (SORNs); and
    d. Adheres to Privacy Act requirements and OMB policies and guidance for the proper processing of Privacy Act requests.
elementType: control
externalId: IP-2
guidance: "Access affords individuals the ability to review PII about them held within organizational systems of records. Access includes timely, simplified, and inexpensive access to data. Organizational processes for allowing access to records may differ based on resources, legal requirements, or other factors. The organization Senior Agency Official for Privacy (SAOP)/Chief Privacy Officer (CPO) is responsible for the content of Privacy Act regulations and record request processing, in consultation with legal counsel. Access to certain types of records may not be appropriate, however, and heads of agencies may promulgate rules exempting particular systems from the access provision of the Privacy Act. In addition, individuals are not entitled to access to information compiled in reasonable anticipation of a civil action or proceeding."
parent: ip
