id: d037ffc4-3246-563e-9b96-b43dfdfcca07
name: Prohibit Non-privileged Users From Executing Privileged Functions
description: The information system prevents non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures.
elementType: enhancement
externalId: AC-6 (10)
guidance: Privileged functions include, for example, establishing information system accounts, performing system integrity checks, or administering cryptographic key management activities. Non-privileged users are individuals that do not possess appropriate authorizations. Circumventing intrusion detection and prevention mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from non-privileged users.
parent: ac-6
aliases:
