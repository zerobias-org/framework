name: Account Monitoring / Atypical Usage
description: |-
  The organization:
    (a) Monitors information system accounts for [Assignment: organization-defined atypical usage]; and
    (b) Reports atypical usage of information system accounts to [Assignment: organization-defined personnel or roles].
elementType: enhancement
externalId: AC-2 (12)
guidance: Atypical usage includes, for example, accessing information systems at certain times of the day and from locations that are not consistent with the normal usage patterns of individuals working in organizations.
