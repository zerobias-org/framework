id: fbca5b06-d5d0-5b74-b8ea-a5b886354ac8
name: Identification and Authentication Policy and Procedures
description: |-
  The organization:
    a. Develops, documents, and disseminates to [Assignment: organization-defined personnel or roles]:
      1. An identification and authentication policy that addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
      2. Procedures to facilitate the implementation of the identification and authentication policy and associated identification and authentication controls; and
    b. Reviews and updates the current:
      1. Identification and authentication policy [Assignment: organization-defined frequency]; and
      2. Identification and authentication procedures [Assignment: organization-defined frequency].
elementType: control
externalId: IA-1
guidance: This control addresses the establishment of policy and procedures for the effective implementation of selected security controls and control enhancements in the IA family. Policy and procedures reflect applicable federal laws, Executive Orders, directives, regulations, policies, standards, and guidance. Security program policies and procedures at the organization level may make the need for system-specific policies and procedures unnecessary. The policy can be included as part of the general information security policy for organizations or conversely, can be represented by multiple policies reflecting the complex nature of certain organizations. The procedures can be established for the security program in general and for particular information systems, if needed. The organizational risk management strategy is a key factor in establishing policy and procedures.
