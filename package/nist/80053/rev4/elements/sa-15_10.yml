id: d778d04c-b61d-56c6-abd6-8095a934bf70
name: Incident Response Plan
description: The organization requires the developer of the information system, system component, or information system service to provide an incident response plan.
elementType: enhancement
externalId: SA-15 (10)
guidance: The incident response plan for developers of information systems, system components, and information system services is incorporated into organizational incident response plans to provide the type of incident response information not readily available to organizations. Such information may be extremely helpful, for example, when organizations respond to vulnerabilities in commercial off-the-shelf (COTS) information technology products.
parent: sa-15
