id: ea6c154a-c680-5f76-b71b-6d6ee1ce55b9
name: Incident Monitoring
description: The organization tracks and documents information system security incidents.
elementType: control
externalId: IR-5
guidance: Documenting information system security incidents includes, for example, maintaining records about each incident, the status of the incident, and other pertinent information necessary for forensics, evaluating incident details, trends, and handling. Incident information can be obtained from a variety of sources including, for example, incident reports, incident response teams, audit monitoring, network monitoring, physical access monitoring, and user/administrator reports.
parent: ir
