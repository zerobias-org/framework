id: 0fa8b3dc-ce32-5bc5-85aa-4b2bcefc31ce
name: Identify Unacceptable Code / Take Corrective Actions
description: "The information system identifies [Assignment: organization-defined unacceptable mobile code] and takes [Assignment: organization-defined corrective actions]."
elementType: enhancement
externalId: SC-18 (1)
guidance: Corrective actions when unacceptable mobile code is detected include, for example, blocking, quarantine, or alerting administrators. Blocking includes, for example, preventing transmission of word processing files with embedded macros when such macros have been defined to be unacceptable mobile code.
