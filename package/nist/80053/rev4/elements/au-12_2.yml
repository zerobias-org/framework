id: 974e602f-606d-5b42-83e8-15d555fb94e1
name: Standardized Formats
description: The information system produces a system-wide (logical or physical) audit trail composed of audit records in a standardized format.
elementType: enhancement
externalId: AU-12 (2)
guidance: Audit information that is normalized to common standards promotes interoperability and exchange of such information between dissimilar devices and information systems. This facilitates production of event information that can be more readily analyzed and correlated. Standard formats for audit records include, for example, system log records and audit records compliant with Common Event Expressions (CEE). If logging mechanisms within information systems do not conform to standardized formats, systems may convert individual audit records into standardized formats when compiling system-wide audit trails.
parent: au-12
