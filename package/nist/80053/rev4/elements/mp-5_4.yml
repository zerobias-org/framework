id: 836178e8-e318-59a1-a569-b2d6ba31ad3c
name: Cryptographic Protection
description: The information system implements cryptographic mechanisms to protect the confidentiality and integrity of information stored on digital media during transport outside of controlled areas.
elementType: enhancement
externalId: MP-5 (4)
guidance: This control enhancement applies to both portable storage devices (e.g., USB memory sticks, compact disks, digital video disks, external/removable hard disk drives) and mobile devices with storage capability (e.g., smart phones, tablets, E-readers).
parent: mp-5
