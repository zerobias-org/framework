id: 1982241c-eab7-5936-bdfb-7b9d694eafbb
name: Physical Disconnect
description: The information system provides physical disconnect of collaborative computing devices in a manner that supports ease of use.
elementType: enhancement
externalId: SC-15 (1)
guidance: Failing to physically disconnect from collaborative computing devices can result in subsequent compromises of organizational information. Providing easy methods to physically disconnect from such devices after a collaborative computing session helps to ensure that participants actually carry out the disconnect activity without having to go through complex and tedious procedures.
parent: sc-15
