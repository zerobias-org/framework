id: 6adf26f8-6bdd-5485-8550-d8269b5cf564
name: Change Authenticators Prior To Delivery
description: The organization requires developers/installers of information system components to provide unique authenticators or change default authenticators prior to delivery/installation.
elementType: enhancement
externalId: IA-5 (5)
guidance: This control enhancement extends the requirement for organizations to change default authenticators upon information system installation, by requiring developers and/or installers to provide unique authenticators or change default authenticators for system components prior to delivery and/or installation. However, it typically does not apply to the developers of commercial off-the-shelve information technology products. Requirements for unique authenticators can be included in acquisition documents prepared by organizations when procuring information systems or system components.
parent: ia-5
