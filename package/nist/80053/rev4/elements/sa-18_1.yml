id: 916a5fae-dc6d-5b64-84ca-f24e7ad9664c
name: Multiple Phases Of Sdlc
description: The organization employs anti-tamper technologies and techniques during multiple phases in the system development life cycle including design, development, integration, operations, and maintenance.
elementType: enhancement
externalId: SA-18 (1)
guidance: Organizations use a combination of hardware and software techniques for tamper resistance and detection. Organizations employ obfuscation and self-checking, for example, to make reverse engineering and modifications more difficult, time-consuming, and expensive for adversaries. Customization of information systems and system components can make substitutions easier to detect and therefore limit damage.
parent: sa-18
