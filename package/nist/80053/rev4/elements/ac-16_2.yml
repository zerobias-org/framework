id: 8287a03c-e29c-5cd2-8f62-8f23a6323f51
name: Attribute Value Changes By Authorized Individuals
description: The information system provides authorized individuals (or processes acting on behalf of individuals) the capability to define or change the value of associated security attributes.
elementType: enhancement
externalId: AC-16 (2)
guidance: The content or assigned values of security attributes can directly affect the ability of individuals to access organizational information. Therefore, it is important for information systems to be able to limit the ability to create or modify security attributes to authorized individuals.
parent: ac-16
