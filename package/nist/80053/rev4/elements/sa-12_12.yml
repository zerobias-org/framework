id: 63dd6fed-8341-546b-9737-191e28d2200a
name: Inter-organizational Agreements
description: The organization establishes inter-organizational agreements and procedures with entities involved in the supply chain for the information system, system component, or information system service.
elementType: enhancement
externalId: SA-12 (12)
guidance: The establishment of inter-organizational agreements and procedures provides for notification of supply chain compromises. Early notification of supply chain compromises that can potentially adversely affect or have adversely affected organizational information systems, including critical system components, is essential for organizations to provide appropriate responses to such incidents.
parent: sa-12
