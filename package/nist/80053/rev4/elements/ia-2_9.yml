id: 327348fd-c03a-548c-baa7-633c490fdff7
name: Network Access To Non-privileged Accounts - Replay Resistant
description: The information system implements replay-resistant authentication mechanisms for network access to non-privileged accounts.
elementType: enhancement
externalId: IA-2 (9)
guidance: Authentication processes resist replay attacks if it is impractical to achieve successful authentications by recording/replaying previous authentication messages. Replay-resistant techniques include, for example, protocols that use nonces or challenges such as Transport Layer Security (TLS) and time synchronous or challenge-response one-time authenticators.
