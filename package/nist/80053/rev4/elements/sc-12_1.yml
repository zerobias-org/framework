name: Availability
description: The organization maintains availability of information in the event of the loss of cryptographic keys by users.
elementType: enhancement
externalId: SC-12 (1)
guidance: Escrowing of encryption keys is a common practice for ensuring availability in the event of loss of keys (e.g., due to forgotten passphrase).
