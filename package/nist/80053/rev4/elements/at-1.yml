id: 896fbbca-c111-57ee-ac92-08d0d7088d07
name: Security Awareness and Training Policy and Procedures
description: |-
  The organization:
    a. Develops, documents, and disseminates to [Assignment: organization-defined personnel or roles]:
      1. A security awareness and training policy that addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
      2. Procedures to facilitate the implementation of the security awareness and training policy and associated security awareness and training controls; and
    b. Reviews and updates the current:
      1. Security awareness and training policy [Assignment: organization-defined frequency]; and
      2. Security awareness and training procedures [Assignment: organization-defined frequency].
elementType: control
externalId: AT-1
guidance: This control addresses the establishment of policy and procedures for the effective implementation of selected security controls and control enhancements in the AT family. Policy and procedures reflect applicable federal laws, Executive Orders, directives, regulations, policies, standards, and guidance. Security program policies and procedures at the organization level may make the need for system-specific policies and procedures unnecessary. The policy can be included as part of the general information security policy for organizations or conversely, can be represented by multiple policies reflecting the complex nature of certain organizations. The procedures can be established for the security program in general and for particular information systems, if needed. The organizational risk management strategy is a key factor in establishing policy and procedures.
