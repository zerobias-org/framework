id: f26c1284-9a35-5475-adb2-62e708d68a34
name: Public Key Infrastructure Certificates
description: 'The organization issues public key certificates under an [Assignment: organization-defined certificate policy] or obtains public key certificates from an approved service provider.'
elementType: control
externalId: SC-17
guidance: For all certificates, organizations manage information system trust stores to ensure only approved trust anchors are in the trust stores. This control addresses both certificates with visibility external to organizational information systems and certificates related to the internal operations of systems, for example, application-specific time services.
parent: sc
