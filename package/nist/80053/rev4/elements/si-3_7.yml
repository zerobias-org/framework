id: 5a2f3e82-976b-53f0-8ea7-dfccb01dd892
name: Nonsignature-based Detection
description: The information system implements nonsignature-based malicious code detection mechanisms.
elementType: enhancement
externalId: SI-3 (7)
guidance: Nonsignature-based detection mechanisms include, for example, the use of heuristics to detect, analyze, and describe the characteristics or behavior of malicious code and to provide safeguards against malicious code for which signatures do not yet exist or for which existing signatures may not be effective. This includes polymorphic malicious code (i.e., code that changes signatures when it replicates). This control enhancement does not preclude the use of signature-based detection mechanisms.
parent: si-3
