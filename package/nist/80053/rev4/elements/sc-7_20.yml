id: 7dda9810-99de-59ac-967e-9b5779365a3d
name: Dynamic Isolation / Segregation
description: "The information system provides the capability to dynamically isolate/segregate [Assignment: organization-defined information system components] from other components of the system."
elementType: enhancement
externalId: SC-7 (20)
guidance: The capability to dynamically isolate or segregate certain internal components of organizational information systems is useful when it is necessary to partition or separate certain components of dubious origin from those components possessing greater trustworthiness. Component isolation reduces the attack surface of organizational information systems. Isolation of selected information system components is also a means of limiting the damage from successful cyber attacks when those attacks occur.
parent: sc-7
