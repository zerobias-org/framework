id: 9fd883f1-f443-51a1-b427-71c4c31e1789
name: Deny By Default / Allow By Exception
description: The information system at managed interfaces denies network communications traffic by default and allows network communications traffic by exception (i.e., deny all, permit by exception).
elementType: enhancement
externalId: SC-7 (5)
guidance: This control enhancement applies to both inbound and outbound network communications traffic. A deny-all, permit-by-exception network communications traffic policy ensures that only those connections which are essential and approved are allowed.
parent: sc-7
aliases:
