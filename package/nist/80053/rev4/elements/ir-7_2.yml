id: 5eb3f12f-ed38-5fe4-8073-274022132189
name: Coordination With External Providers
description: |-
  The organization:
    (a) Establishes a direct, cooperative relationship between its incident response capability and external providers of information system protection capability; and
    (b) Identifies organizational incident response team members to the external providers.
elementType: enhancement
externalId: IR-7 (2)
guidance: External providers of information system protection capability include, for example, the Computer Network Defense program within the U.S. Department of Defense. External providers help to protect, monitor, analyze, detect, and respond to unauthorized activity within organizational information systems and networks.
parent: ir-7
aliases:
