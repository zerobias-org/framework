id: 0d30d543-87ca-52c3-aba2-95ed61bcb18f
name: Automated Support For Predictive Maintenance
description: The organization employs automated mechanisms to transfer predictive maintenance data to a computerized maintenance management system.
elementType: enhancement
externalId: MA-6 (3)
guidance: A computerized maintenance management system maintains a computer database of information about the maintenance operations of organizations and automates processing equipment condition data in order to trigger maintenance planning, execution, and reporting.
