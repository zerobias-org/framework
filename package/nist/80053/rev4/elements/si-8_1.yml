name: Central Management
description: The organization centrally manages spam protection mechanisms.
elementType: enhancement
externalId: SI-8 (1)
guidance: Central management is the organization-wide management and implementation of spam protection mechanisms. Central management includes planning, implementing, assessing, authorizing, and monitoring the organization-defined, centrally managed spam protection security controls.
