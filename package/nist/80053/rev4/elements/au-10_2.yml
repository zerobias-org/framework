id: a50e8384-138d-5a27-a93a-c7b0171007c2
name: Validate Binding Of Information Producer Identity
description: |-
  The information system:
    (a) Validates the binding of the information producer identity to the information at [Assignment: organization-defined frequency]; and
    (b) Performs [Assignment: organization-defined actions] in the event of a validation error.
elementType: enhancement
externalId: AU-10 (2)
guidance: This control enhancement prevents the modification of information between production and review. The validation of bindings can be achieved, for example, by the use of cryptographic checksums. Organizations determine if validations are in response to user requests or generated automatically.
parent: au-10
aliases:
  - AU-10 (2)
  - AU-10(2)
