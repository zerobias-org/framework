id: b6afb9e8-346a-5a7d-a8cf-8764fc8386a0
name: Cryptographic Protection
description: The information system implements cryptographic mechanisms to detect unauthorized changes to software, firmware, and information.
elementType: enhancement
externalId: SI-7 (6)
guidance: Cryptographic mechanisms used for the protection of integrity include, for example, digital signatures and the computation and application of signed hashes using asymmetric cryptography, protecting the confidentiality of the key used to generate the hash, and using the public key to verify the hash information.
