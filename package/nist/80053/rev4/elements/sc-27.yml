id: b0c35759-4fba-55b7-aaf7-d774aaaf5c7d
name: Platform-independent Applications
description: 'The information system includes: [Assignment: organization-defined platform-independent applications].'
elementType: control
externalId: SC-27
guidance: 'Platforms are combinations of hardware and software used to run software applications. Platforms include: (i) operating systems; (ii) the underlying computer architectures, or (iii) both. Platform-independent applications are applications that run on multiple platforms. Such applications promote portability and reconstitution on different platforms, increasing the availability of critical functions within organizations while information systems with specific operating systems are under attack.'
parent: sc
