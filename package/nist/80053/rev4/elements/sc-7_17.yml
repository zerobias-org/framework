id: 0aa15838-eeb9-54c7-8cf4-db9d7aa4618f
name: Automated Enforcement Of Protocol Formats
description: The information system enforces adherence to protocol formats.
elementType: enhancement
externalId: SC-7 (17)
guidance: Information system components that enforce protocol formats include, for example, deep packet inspection firewalls and XML gateways. Such system components verify adherence to protocol formats/specifications (e.g., IEEE) at the application layer and identify significant vulnerabilities that cannot be detected by devices operating at the network or transport layers.
parent: sc-7
