id: f47e2e77-1a40-532a-beb0-cdb9a6acf29f
name: Detection Devices / Systems
description: "The organization employs fire detection devices/systems for the information system that activate automatically and notify [Assignment: organization-defined personnel or roles] and [Assignment: organization-defined emergency responders] in the event of a fire."
elementType: enhancement
externalId: PE-13 (1)
guidance: Organizations can identify specific personnel, roles, and emergency responders in the event that individuals on the notification list must have appropriate access authorizations and/or clearances, for example, to obtain access to facilities where classified operations are taking place or where there are information systems containing classified information.
