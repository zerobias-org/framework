id: 91ed2fe0-d049-55fd-bf04-1176cd0733fa
name: Security Concept Of Operations
description: |-
  The organization:
    a. Develops a security Concept of Operations (CONOPS) for the information system containing at a minimum, how the organization intends to operate the system from the perspective of information security; and
    b. Reviews and updates the CONOPS [Assignment: organization-defined frequency].
elementType: control
externalId: PL-7
guidance: The security CONOPS may be included in the security plan for the information system or in other system development life cycle-related documents, as appropriate. Changes to the CONOPS are reflected in ongoing updates to the security plan, the information security architecture, and other appropriate organizational documents (e.g., security specifications for procurements/acquisitions, system development life cycle documents, and systems/security engineering documents).
parent: pl
