id: 6192029c-88c8-5758-b9cc-3c4fa00b7345
name: Cryptographic Module Authentication
description: The information system implements mechanisms for authentication to a cryptographic module that meet the requirements of applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance for such authentication.
elementType: control
externalId: IA-7
guidance: Authentication mechanisms may be required within a cryptographic module to authenticate an operator accessing the module and to verify that the operator is authorized to assume the requested role and perform services within that role.
parent: ia
