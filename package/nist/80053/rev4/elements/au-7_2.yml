id: 3a565066-5d05-5361-862b-4fe63195c4c4
name: Automatic Sort and Search
description: "The information system provides the capability to sort and search audit records for events of interest based on the content of [Assignment: organization-defined audit fields within audit records]."
elementType: enhancement
externalId: AU-7 (2)
guidance: "Sorting and searching of audit records may be based upon the contents of audit record fields, for example: (i) date/time of events; (ii) user identifiers; (iii) Internet Protocol (IP) addresses involved in the event; (iv) type of event; or (v) event success/failure."
