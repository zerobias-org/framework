id: f6b4b370-fa79-5923-a680-0ce4cb0e8ca8
name: Authenticate Remote Commands
description: "The information system implements [Assignment: organization-defined security safeguards] to authenticate [Assignment: organization-defined remote commands]."
elementType: enhancement
externalId: SI-3 (9)
guidance: This control enhancement protects against unauthorized commands and replay of authorized commands. This capability is important for those remote information systems whose loss, malfunction, misdirection, or exploitation would have immediate and/or serious consequences (e.g., injury or death, property damage, loss of high-valued assets or sensitive information, or failure of important missions/business functions). Authentication safeguards for remote commands help to ensure that information systems accept and execute in the order intended, only authorized commands, and that unauthorized commands are rejected. Cryptographic mechanisms can be employed, for example, to authenticate remote commands.
parent: si-3
aliases:
