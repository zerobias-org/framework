id: d85d8779-447e-5092-b630-3897a14150b9
name: Use Of Live Data
description: The organization approves, documents, and controls the use of live data in development and test environments for the information system, system component, or information system service.
elementType: enhancement
externalId: SA-15 (9)
guidance: The use of live data in preproduction environments can result in significant risk to organizations. Organizations can minimize such risk by using test or dummy data during the development and testing of information systems, information system components, and information system services.
parent: sa-15
