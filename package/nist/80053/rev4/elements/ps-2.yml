id: 828d3d23-13e7-5b47-8aad-d6760fdf676c
name: Position Risk Designation
description: |-
  The organization:
    a. Assigns a risk designation to all organizational positions;
    b. Establishes screening criteria for individuals filling those positions; and
    c. Reviews and updates position risk designations [Assignment: organization-defined frequency].
elementType: control
externalId: PS-2
guidance: Position risk designations reflect Office of Personnel Management policy and guidance. Risk designations can guide and inform the types of authorizations individuals receive when accessing organizational information and information systems. Position screening criteria include explicit information security role appointment requirements (e.g., training, security clearances).
parent: ps
