id: a3da8961-f06b-575c-bf3c-c398f8b958cf
name: Binary Or Machine Executable Code
description: |-
  The organization:
    (a) Prohibits the use of binary or machine-executable code from sources with limited or no warranty and without the provision of source code; and
    (b) Provides exceptions to the source code requirement only for compelling mission/operational requirements and with the approval of the authorizing official.
elementType: enhancement
externalId: SI-7 (14)
guidance: This control enhancement applies to all sources of binary or machine-executable code including, for example, commercial software/firmware and open source software. Organizations assess software products without accompanying source code from sources with limited or no warranty for potential security impacts. The assessments address the fact that these types of software products may be very difficult to review, repair, or extend, given that organizations, in most cases, do not have access to the original source code, and there may be no owners who could make such repairs on behalf of organizations.
parent: si-7
aliases:
