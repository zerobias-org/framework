id: 9c44145e-5c9e-563c-98ab-37fa5ea04481
name: Alternate Audit Capability
description: 'The organization provides an alternate audit capability in the event of a failure in primary audit capability that provides [Assignment: organization-defined alternate audit functionality].'
elementType: control
externalId: AU-15
guidance: Since an alternate audit capability may be a short-term protection employed until the failure in the primary auditing capability is corrected, organizations may determine that the alternate audit capability need only provide a subset of the primary audit functionality that is impacted by the failure.
parent: au
