id: 7b788090-fc37-5138-a25f-ec7b2b078f0b
name: Disabling / Removal In Secure Work Areas
description: "The organization disables or removes collaborative computing devices from [Assignment: organization-defined information systems or information system components] in [Assignment: organization-defined secure work areas]."
elementType: enhancement
externalId: SC-15 (3)
guidance: Failing to disable or remove collaborative computing devices from information systems or information system components can result in subsequent compromises of organizational information including, for example, eavesdropping on conversations.
