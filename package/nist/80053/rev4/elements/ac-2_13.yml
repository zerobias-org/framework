id: 01b6e35e-dfbb-5fdd-adaa-940637a1d4c4
name: Disable Accounts For High-risk Individuals
description: "The organization disables accounts of users posing a significant risk within [Assignment: organization-defined time period] of discovery of the risk."
elementType: enhancement
externalId: AC-2 (13)
guidance: Users posing a significant risk to organizations include individuals for whom reliable evidence or intelligence indicates either the intention to use authorized access to information systems to cause harm or through whom adversaries will cause harm. Harm includes potential adverse impacts to organizational operations and assets, individuals, other organizations, or the Nation. Close coordination between authorizing officials, information system administrators, and human resource managers is essential in order for timely execution of this control enhancement.
parent: ac-2
