id: 2437a807-c433-5c0a-adb7-f0117b8794b9
name: Timely Maintenance
description: 'The organization obtains maintenance support and/or spare parts for [Assignment: organization-defined information system components] within [Assignment: organization-defined time period] of failure.'
elementType: control
externalId: MA-6
guidance: Organizations specify the information system components that result in increased risk to organizational operations and assets, individuals, other organizations, or the Nation when the functionality provided by those components is not operational. Organizational actions to obtain maintenance support typically include having appropriate contracts in place.
parent: ma
