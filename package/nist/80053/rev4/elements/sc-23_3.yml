id: 32573103-12c7-5349-9135-89b4bd2dbe4b
name: Unique Session Identifiers With Randomization
description: "The information system generates a unique session identifier for each session with [Assignment: organization-defined randomness requirements] and recognizes only session identifiers that are system-generated."
elementType: enhancement
externalId: SC-23 (3)
guidance: This control enhancement curtails the ability of adversaries from reusing previously valid session IDs. Employing the concept of randomness in the generation of unique session identifiers helps to protect against brute-force attacks to determine future session identifiers.
parent: sc-23
