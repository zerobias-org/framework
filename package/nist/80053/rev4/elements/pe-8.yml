name: Visitor Access Records
description: |-
  The organization:
    a. Maintains visitor access records to the facility where the information system resides for [Assignment: organization-defined time period]; and
    b. Reviews visitor access records [Assignment: organization-defined frequency].
elementType: control
externalId: PE-8
guidance: Visitor access records include, for example, names and organizations of persons visiting, visitor signatures, forms of identification, dates of access, entry and departure times, purposes of visits, and names and organizations of persons visited. Visitor access records are not required for publicly accessible areas.
