id: 014b3a35-309e-5fe2-b95f-35e6de0b2db3
name: Re-authentication
description: 'The organization requires users and devices to re-authenticate when [Assignment: organization-defined circumstances or situations requiring re-authentication].'
elementType: control
externalId: IA-11
guidance: 'In addition to the re-authentication requirements associated with session locks, organizations may require re-authentication of individuals and/or devices in other situations including, for example: (i) when authenticators change; (ii), when roles change; (iii) when security categories of information systems change; (iv), when the execution of privileged functions occurs; (v) after a fixed period of time; or (vi) periodically.'
parent: ia
