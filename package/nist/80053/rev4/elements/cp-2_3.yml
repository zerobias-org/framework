id: abeb91ad-fd80-5e50-9081-7c383f246595
name: Resume Essential Missions / Business Functions
description: "The organization plans for the resumption of essential missions and business functions within [Assignment: organization-defined time period] of contingency plan activation."
elementType: enhancement
externalId: CP-2 (3)
guidance: Organizations may choose to carry out the contingency planning activities in this control enhancement as part of organizational business continuity planning including, for example, as part of business impact analyses. The time period for resumption of essential missions/business functions may be dependent on the severity/extent of disruptions to the information system and its supporting infrastructure.
