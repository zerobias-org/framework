id: f9297e64-e1aa-5023-8d0e-10681f93a386
name: Tamper Resistance and Detection
description: The organization implements a tamper protection program for the information system, system component, or information system service.
elementType: control
externalId: SA-18
guidance: Anti-tamper technologies and techniques provide a level of protection for critical information systems, system components, and information technology products against a number of related threats including modification, reverse engineering, and substitution. Strong identification combined with tamper resistance and/or tamper detection is essential to protecting information systems, components, and products during distribution and when in use.
parent: sa
