id: 635a83d4-ab5a-5e2c-905e-eba3dfde8e03
name: Automated System Account Management
description: The organization employs automated mechanisms to support the management of information system accounts.
elementType: enhancement
externalId: AC-2 (1)
guidance: "The use of automated mechanisms can include, for example: using email or text messaging to automatically notify account managers when users are terminated or transferred; using the information system to monitor account usage; and using telephonic notification to report atypical system account usage."
parent: ac-2
