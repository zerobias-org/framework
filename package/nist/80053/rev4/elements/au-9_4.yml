id: d3a85227-6347-5f47-a48c-86f629222c42
name: Access By Subset Of Privileged Users
description: "The organization authorizes access to management of audit functionality to only [Assignment: organization-defined subset of privileged users]."
elementType: enhancement
externalId: AU-9 (4)
guidance: Individuals with privileged access to an information system and who are also the subject of an audit by that system, may affect the reliability of audit information by inhibiting audit activities or modifying audit records. This control enhancement requires that privileged access be further defined between audit-related privileges and other privileges, thus limiting the users with audit-related privileges.
parent: au-9
