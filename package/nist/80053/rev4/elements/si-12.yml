id: 5af55090-c56a-59cc-9f14-423421b6996f
name: Information Handling and Retention
description: The organization handles and retains information within the information system and information output from the system in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and operational requirements.
elementType: control
externalId: SI-12
guidance: Information handling and retention requirements cover the full life cycle of information, in some cases extending beyond the disposal of information systems. The National Archives and Records Administration provides guidance on records retention.
parent: si
