name: Real-Time or Layered Notice
description: "The organization provides real-time and/or layered notice when it collects PII."
elementType: control
externalId: TR-1 (1)
guidance: "Real-time notice is defined as notice at the point of collection. A layered notice approach involves providing individuals with a summary of key points in the organization’s privacy policy. A second notice provides more detailed/specific information"
