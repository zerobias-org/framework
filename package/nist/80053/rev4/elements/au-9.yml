id: b9ba5f2a-57b0-5ac0-b3ac-662f5585e21e
name: Protection Of Audit Information
description: The information system protects audit information and audit tools from unauthorized access, modification, and deletion.
elementType: control
externalId: AU-9
guidance: Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity. This control focuses on technical protection of audit information. Physical protection of audit information is addressed by media protection controls and physical and environmental protection controls.
parent: au
