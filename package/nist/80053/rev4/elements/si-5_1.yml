id: b58c406f-e081-543c-9def-3cf28a0546e7
name: Automated Alerts and Advisories
description: The organization employs automated mechanisms to make security alert and advisory information available throughout the organization.
elementType: enhancement
externalId: SI-5 (1)
guidance: The significant number of changes to organizational information systems and the environments in which those systems operate requires the dissemination of security-related information to a variety of organizational entities that have a direct interest in the success of organizational missions and business functions. Based on the information provided by the security alerts and advisories, changes may be required at one or more of the three tiers related to the management of information security risk including the governance level, mission/business process/enterprise architecture level, and the information system level.
parent: si-5
