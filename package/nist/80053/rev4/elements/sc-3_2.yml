id: d7dca662-827f-5bb7-98c0-76d8c1466fc8
name: Access / Flow Control Functions
description: The information system isolates security functions enforcing access and information flow control from nonsecurity functions and from other security functions.
elementType: enhancement
externalId: SC-3 (2)
guidance: Security function isolation occurs as a result of implementation; the functions can still be scanned and monitored. Security functions that are potentially isolated from access and flow control enforcement functions include, for example, auditing, intrusion detection, and anti-virus functions.
parent: sc-3
