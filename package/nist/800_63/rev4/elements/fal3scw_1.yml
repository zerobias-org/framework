name: 'FAL3 Hosted Wallet: HoK or Bound Authenticator'
description: To reach FAL3, federation transactions with a subscriber-controlled wallet on a hosted service SHALL use either a holder-of-key assertion (see Sec. 3.15) or a bound authenticator (see Sec. 3.16).
