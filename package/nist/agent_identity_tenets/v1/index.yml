name: NIST Design Tenets for Agent Identity Management Systems
description: >-
  Ten design tenets for identity, authentication and authorization of software and
  AI agents, published on the NIST Cybersecurity Insights blog on October 27, 2026.
  This is an interim source: a blog post with no SP, IR or CSWP number, not a formal
  NIST standard. The tenets are guideposts for NCCoE agent identity demonstrations,
  and NCCoE plans an SP 1800 practice guide on the topic. Credit: Harold Booth, Bill
  Fisher, Ryan Galluzzo and Tom Clancy.
