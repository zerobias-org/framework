externalId: MAP 1.1
name: MAP 1.1
description: "Intended purposes, potentially beneficial uses, context specific
  laws, norms and expectations, and prospective settings in which the AI system
  will be deployed are understood and documented. Considerations include: the
  specific set or types of users along with their expectations; potential
  positive and negative impacts of system uses to individuals, communities,
  organizations, society, and the planet; assumptions and related limitations
  about AI system purposes, uses, and risks across the development or product AI
  lifecycle; and related TEVV and system metrics."
elementType: control
