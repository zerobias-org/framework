name: Prepare the Organization (PO)
description: >-
  Organizations should ensure that their people, processes, and technology are
  prepared to perform secure software development at the organization level.
  Many organizations will find some PO practices to also be applicable to
  subsets of their software development, like individual development groups or
  projects.
