id: 5a14f969-14e8-489e-b494-83c9db0c5217
name: >-
  Review and/or Analyze Human-Readable Code to Identify Vulnerabilities and
  Verify Compliance with Security Requirements (PW.7)
description: >-
  Help identify vulnerabilities so that they can be corrected before the
  software is released to prevent exploitation. Using automated methods lowers
  the effort and resources needed to detect vulnerabilities. Human-readable code
  includes source code, scripts, and any other form of code that an organization
  deems human-readable.
elementType: practice
externalId: PW.7
parent: pw
