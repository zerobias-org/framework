description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. A system and communications protection policy that addresses purpose,
  scope, roles, responsibilities, management commitment, coordination among
  organizational entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the system and
  communications protection policy and associated system and communications
  protection controls; and\r

  b. Reviews and updates the current:\r

  1. System and communications protection policy [Assignment:
  organization-defined frequency]; and\r

  2. System and communications protection procedures [Assignment:
  organization-defined frequency]."
