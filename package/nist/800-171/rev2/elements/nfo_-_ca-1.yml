description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. A security assessment and authorization policy that addresses purpose,
  scope, roles, responsibilities, management commitment, coordination among
  organizational entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the security assessment and
  authorization policy and associated security assessment and authorization
  controls; and\r

  b. Reviews and updates the current:\r

  1. Security assessment and authorization policy [Assignment:
  organization-defined frequency]; and\r

  2. Security assessment and authorization procedures [Assignment:
  organization-defined frequency]."
