externalId: NFO - SA-11
name: NFO - SA-11
description: "The organization requires the developer of the information system,
  system component, or information system service to:\r

  a. Create and implement a security assessment plan;\r

  b. Perform [Selection (one or more): unit; integration; system; regression]
  testing/evaluation at [Assignment: organization-defined depth and coverage];\r

  c. Produce evidence of the execution of the security assessment plan and the
  results of the security testing/evaluation;\r

  d. Implement a verifiable flaw remediation process; and\r

  e. Correct flaws identified during security testing/evaluation."
elementType: control
