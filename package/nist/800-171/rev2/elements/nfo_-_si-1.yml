externalId: NFO - SI-1
name: NFO - SI-1
description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. A system and information integrity policy that addresses purpose, scope,
  roles, responsibilities, management commitment, coordination among
  organizational entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the system and information
  integrity policy and associated system and information integrity controls;
  and\r

  b. Reviews and updates the current:\r

  1. System and information integrity policy [Assignment: organization-defined
  frequency]; and\r

  2. System and information integrity procedures [Assignment:
  organization-defined frequency]."
elementType: control
