  entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the media protection policy
  and associated media protection controls; and\r

  b. Reviews and updates the current:\r

  1. Media protection policy [Assignment: organization-defined frequency]; and\r

  2. Media protection procedures [Assignment: organization-defined frequency]."
