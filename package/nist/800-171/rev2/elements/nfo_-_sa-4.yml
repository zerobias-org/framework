externalId: NFO - SA-4
name: NFO - SA-4
description: "The organization includes the following requirements,
  descriptions, and criteria, explicitly or by reference, in the acquisition
  contract for the information system, system component, or information system
  service in accordance with applicable federal laws, Executive Orders,
  directives, policies, regulations, standards, guidelines, and organizational
  mission/business needs:\r

  a. Security functional requirements;\r

  b. Security strength requirements;\r

  c. Security assurance requirements;\r

  d. Security-related documentation requirements;\r

  e. Requirements for protecting security-related documentation;\r

  f. Description of the information system development environment and
  environment in which the system is intended to operate; and\r

  g. Acceptance criteria."
elementType: control
