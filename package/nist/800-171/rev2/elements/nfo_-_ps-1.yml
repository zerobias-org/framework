description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. A personnel security policy that addresses purpose, scope, roles,
  responsibilities, management commitment, coordination among organizational
  entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the personnel security
  policy and associated personnel security controls; and\r

  b. Reviews and updates the current:\r

  1. Personnel security policy [Assignment: organization-defined frequency];
  and\r

  2. Personnel security procedures [Assignment: organization-defined
  frequency]."
