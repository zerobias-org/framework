name: NFO - IA-1
description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. An identification and authentication policy that addresses purpose, scope,
  roles, responsibilities, management commitment, coordination among
  organizational entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the identification and
  authentication policy and associated identification and authentication
  controls; and\r

  b. Reviews and updates the current:\r

  1. Identification and authentication policy [Assignment: organization-defined
  frequency]; and\r

  2. Identification and authentication procedures [Assignment:
  organization-defined frequency]."
