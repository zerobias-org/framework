description: "The organization:\r

  a. Develops, documents, and disseminates to [Assignment: organization-defined
  personnel or roles]:\r

  1. An incident response policy that addresses purpose, scope, roles,
  responsibilities, management commitment, coordination among organizational
  entities, and compliance; and\r

  2. Procedures to facilitate the implementation of the incident response policy
  and associated incident response controls; and\r

  b. Reviews and updates the current:\r

  1. Incident response policy [Assignment: organization-defined frequency];
  and\r

  2. Incident response procedures [Assignment: organization-defined frequency]."
