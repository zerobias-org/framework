id: 40f1712d-ae2b-49e1-bb4f-9d6cdc59e91f
name: The zero-based review of a system does not require a zero-based review of the common controls that are available for inheritance by that system. The common controls are authorized under a separate authorization process with a separate authorizing official accepting the risk associated with the provision of those controls. The review of the security and privacy plans containing common controls is necessary to understand the current state of the controls being inherited by organizational systems and factoring this information into risk-based decisions associated with the system.
