name: For example, in Task C-2 of the Categorize step, privacy and security programs work together to consider potential adverse impacts to organizational operations, organizational assets, individuals, other organizations, and the Nation resulting from the loss of confidentiality, integrity, or availability of PII in order to determine the impact level for the information system. The resulting impact level drives the selection of a security control baseline in Task S-1 of the Select step.
