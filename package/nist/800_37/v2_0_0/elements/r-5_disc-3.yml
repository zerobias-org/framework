name: The authorization decision is conveyed by the authorizing official to the system owner or common control provider, and other organizational officials, as appropriate.  The authorization decision also conveys the terms and conditions for the authorization to operate; the authorization termination date or time-driven authorization frequency; input from the senior accountable official for risk management or risk executive (function), if provided; and for common control authorizations, the system impact level supported by the common controls.
