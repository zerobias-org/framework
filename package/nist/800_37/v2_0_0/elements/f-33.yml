name: Historically, NIST has used the terms authorization boundary and system boundary interchangeably. In the interest of clarity, accuracy, and use of standardized terminology, the term authorization boundary is now used exclusively to refer to the set of system elements comprising the system to be authorized for operation or authorized for use by an authorizing official (i.e., the scope of the authorization). Authorization boundary can also refer to the set of common controls to be authorized for inheritance purposes.
