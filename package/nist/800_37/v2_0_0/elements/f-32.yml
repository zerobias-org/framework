name: The terms system element and information resource are used interchangeably in this publication. Information resources as defined in 44 U.S.C. Sec. 3502 include information and related resources, such as personnel, equipment, funds, and information technology. By law, a system is composed of a discrete set of information resources. 35 The term system component refers to a system element that is implemented via hardware, software, or firmware.
