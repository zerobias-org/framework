name: Information systems are discrete sets of information resources organized for the collection, processing, use, sharing, maintenance, dissemination, or disposition of information, whether such information is in digital or nondigital form. Information resources include information and related resources, such as personnel, equipment, funds, and information technology. Information systems may or may not include hardware, firmware, and software.
