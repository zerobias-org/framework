name: This task is carried out only after organizational systems have been categorized (see Task C1). This task requires organizations to first apply the high-water mark concept to each of their information systems categorized in accordance with [FIPS 199] and [FIPS 200].  The application of the high-water mark concept results in systems designated as low impact, moderate impact, or high impact.
