name: Supply chain risk means risks that arise from the loss of confidentiality, integrity, or availability of information or information systems and reflect the potential adverse impacts to organizational operations (including mission, functions, image, or reputation), organizational assets, individuals, other organizations, and the Nation [OMB A-130]. When system elements process PII, SCRM practices address both information security and privacy risk.
