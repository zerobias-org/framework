name: Organizations decide on the level of detail and the presentation format of security and privacy information that is made available to authorizing officials through automation. Decisions about level of detail and format are based on organizational needs with the automated presentation of security and privacy information tailored to the decision-making needs of the authorizing officials. For example, detailed security and privacy information may be generated and collected at the operational level of the organization with information subsequently analyzed, distilled, and presented to authorizing officials in a summarized or highlighted format using automation.
