name: The four security risk factors are threat, vulnerability, likelihood, and impact. [SP 800-30] and [SP 800-39] provide information about security risk assessments and associated risk factors. [IR 8062] and Section 2.3 provide additional information on privacy risk factors and conducting privacy risk assessments.
