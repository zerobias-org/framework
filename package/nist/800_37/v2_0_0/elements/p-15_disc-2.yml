name: Organizations can use the Cybersecurity Framework to manage security and privacy requirements and express those requirements in Cybersecurity Framework Profiles defined for the organization. For instance, multiple requirements can be aligned and even deconflicted using the Function-Category-Subcategory structure of the Framework Core. The Profiles can then be used to inform the development of organizationally-tailored control baselines described in the RMF Prepare-Organization Level step, Task P-4.
