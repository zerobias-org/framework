name: Enterprise architecture defines the mission, information, and the technologies necessary to perform the mission, and transitional processes for implementing new technologies in response to changing mission needs. It also includes a baseline architecture, a target architecture, and a sequencing plan. [OMB FEA] provides guidance for implementing enterprise architectures.
