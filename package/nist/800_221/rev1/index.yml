id: 54d50d32-78bf-4208-a522-9c717bb3b300
name: NIST SP 800-221 Rev. 1 (Initial Public Draft) - Enterprise Impact of Information and Communications Technology Risk
description: >-
  Initial Public Draft (October 2026) of NIST SP 800-221 Revision 1, Enterprise Impact of
  Information and Communications Technology Risk: Governing and Managing ICT Risk Programs
  Within an Enterprise Risk Portfolio. Helps organizations within an enterprise improve ICT
  risk management (ICTRM) in alignment with the NIST Cybersecurity Framework (CSF) 2.0,
  integrating ICT risk registers into the enterprise risk register and enterprise risk
  profile, with cybersecurity governance central to all risk management activities. Draft
  for public comment; subject to change before final publication.
