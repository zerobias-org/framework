id: 0baed0a6-c6c2-49c4-8aa6-61161295a357
name: Privacy Program Review
description: >-
  On an annual basis, Organization performs a review of privacy practices to
  ensure the following:

  • consent is obtained for users whose personal information (PI) is managed by
  Organization

  • PI inventory integrity and accuracy

  • data access request response template is understandable

  • standard agreement templates are up-to-date

  • requests to delete, access or update PI are processed accurately and within
  a timeframe consistent with Organization policy

  • compliance with Organization's privacy commitments

  • known privacy issues are remediated

  • opt-in and opt-out compliance with applicable law

  • Organization privacy documentation and practices are relevant to applicable
  law

  • compliance with relevant industry Codes of Conduct (e.g., EDAA)

  • if applicable, joint controller responsibilities are clearly defined and
  communicated to both data controllers and the data subject
elementType: control
