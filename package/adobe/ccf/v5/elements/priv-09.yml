name: 'Document Management Standard: HIPAA'
description: >-
  Documentation that impacts personal health information, including policies,
  procedures, and the documentation of actions, activities, or assessments, are
  retained for 6 years from the date of its creation, or the date when it last
  was in effect, whichever is later.
