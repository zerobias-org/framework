id: 7f178aa2-ae99-42d9-8789-3791f4778783
name: Payment Card Processing Security Awareness Training
description: >-
  Organization personnel that interact with cardholder data systems receive
  awareness training to be aware of attempted tampering or replacement of
  devices. Training should include the following:

  • verify the identity of third-party persons claiming to be repair or
  maintenance personnel, prior to granting them access to modify or troubleshoot
  devices.

  • do not install, replace, or return devices without verification

  • be aware of suspicious behavior around devices (e.g., attempts by unknown
  persons to unplug or open devices)

  • report suspicious behavior and indications of device tampering or
  substitution to authorized personnel (e.g., to a manager or security officer)
