name: Board of Directors Structure and Purpose
description: >-
  The Board of Directors provides corporate oversight, strategic direction, and
  review of management for Organization. The Board of Directors meets at least
  quarterly and has 3 sub-committees: 

  • Audit Committee

  • Executive Compensation and Nominating Committee

  • Governance Committee
