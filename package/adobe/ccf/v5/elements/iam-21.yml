name: Credentials Validation
description: >
  Organization systems utilize Federal Identity, Credential, and Access
  Management (FICAM) components and conform to FICAM-issued profiles; systems
  verify and accept the following external credentials:

  • personal Identity Verification (PIV) credentials from federal agencies, and

  • FICAM-approved credentials from non-federal third-parties
