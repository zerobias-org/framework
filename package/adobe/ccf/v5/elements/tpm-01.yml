id: 5420817d-1125-46b6-946d-948b099b9a9b
name: Third-Party Assurance Review
description: >-
  On a periodic basis, management reviews controls within third-party assurance
  reports to ensure that they meet organizational requirements; if control gaps
  are identified in the assurance reports, management takes action to address
  impact the disclosed gaps have on the organization.
elementType: control
