name: Audit Committee
description: >-
  The Audit Committee is governed by a Charter, is independent from Organization
  Management, composed of outside directors (Industry Experts), and meets
  quarterly. The Audit Committee oversees: 

  •Financial Statement Quality 

  •Enterprise Risk Management

  •Regulatory & Legal Compliance

  •Internal Audit Functions

  •Information Security Functions

  •External Audit Functions
