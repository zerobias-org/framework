name: 'Self-Assessments: PCI'
description: >-
  On a quarterly basis, reviews shall be performed with approved documented
  specification to confirm personnel are following security policies and
  operational procedures pertaining to:

  • daily log reviews

  • firewall rule-set reviews

  • applying configuration standards to new systems

  • responding to security alerts

  • change management processes
