id: 9f2d4743-c4ea-430b-911d-6ffb6fbfcfd6
name: National Security Clearance
description: >-
  Organization conducts screening and rescreening of authorized personnel for
  roles that require national security clearances. For national security
  clearances; a reinvestigation is required during the 5th year for top secret
  security clearance, the 10th year for secret security clearance, and 15th year
  for confidential security clearance. In addition, for law enforcement and high
  impact public trust level, a reinvestigation is required during the 5th year.
