id: a4b0dac3-f172-4c2e-b1b3-81472297a96c
name: Role-based Security Training
description: >-
  Organization personnel with key security responsibilities complete relevant
  role-based training on an annual basis:

  • personnel must complete training prior to obtaining access to privileged
  security systems

  • personnel with contingency responsibilities must complete role-based
  training within 10 days of assuming the role

  • records of training completion are documented and retained for tracking
  purposes
