id: bce48279-ae63-4ba6-9d56-f763fdd5d60a
name: HIPAA Business Associate Subcontractor Agreement
description: >-
  Organization requires a Business Associate Subcontractor Agreement with
  Business Associates from which it receives or transmits protected health
  information (PHI); Business Associates under contract are required to provide
  assurance that they adhere to Organization's security standards, which
  includes the security of PHI and reporting security events that potentially
  expose PHI.
