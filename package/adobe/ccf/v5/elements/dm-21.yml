name: Publicly Accessible Content
description: >-
  Organization protects its public information system presence with the
  following processes: only authorized and trained individuals may post public
  information, content is reviewed prior to publishing, information on public
  systems is reviewed periodically, and non-public information is removed from
  public systems upon discovery.
