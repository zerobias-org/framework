name: 'Remote Maintenance: Unique Authentication Credentials for each Customer'
description: >-
  Where applicable, Service providers with remote access to customer premises
  (e.g., for support of POS systems or servers) must use a unique authentication
  credential (such as a password/phrase) for each customer.
