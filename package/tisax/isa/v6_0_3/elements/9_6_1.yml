externalId: 9.6.1
name: 9.6.1
description: "+ Requests from data subjects are processed in a timely manner.\r

  \  - Procedures are in place to assist the controller in responding to data
  subject requests.\r

  \  - Employees are trained to the effect that they must immediately contact
  the respective person responsible in the event of an incoming request from a
  data subject and coordinate the further procedure with this person."
elementType: control
