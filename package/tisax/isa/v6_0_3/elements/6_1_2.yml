name: 6.1.2
description: "+ The non-disclosure requirements are determined and fulfilled.\r

  + Requirements and procedures for applying non-disclosure agreements are known
  to all persons passing on information in need of protection.\r

  + Valid non-disclosure agreements are concluded prior to  forwarding sensitive
  information.\r

  + The requirements and procedures for the use of non-disclosure agreements and
  the handling of information requiring protection are reviewed at regular
  intervals."
elementType: control
