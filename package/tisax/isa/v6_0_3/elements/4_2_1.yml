externalId: 4.2.1
name: 4.2.1
description: "+ The requirements for the management of access rights
  (authorization) are determined and fulfilled. The following aspects are
  considered:\r

  \  - Procedure for application, verification, and approval,\r

  \  - Applying the minimum (“need-to-know”/\"least privilege\") principle.\r

  \  - Access rights are revoked when no longer needed\r

  + The access rights granted for normal and privileged user accounts and
  technical accounts are reviewed at regular intervals also within IT systems of
  customers."
elementType: control
