id: 40c499d0-72e4-4bcc-abbd-e4a788de0fd7
externalId: 9.2.1
name: 9.2.1
description: "+ A data protection officer is appointed, if required by Art. 37
  GDPR\r

  \ - Determination of whether the appointment of a data protection officer is
  voluntary or mandatory\r

  \ - otherwise determination of a data protection function or comparable\r

  + Publication of contact details (e.g. on the Internet)\r

  + Integration into the organization's structure\r

  + Exercise of the control obligations as defined in Art. 39 (1) (b) GDPR and
  corresponding documentation\r

  + Documentation of the data protection status and report to organization's top
  management\r

  + Equipped with sufficient capacities and resources   \r

  \ - Determination of whether the data protection function is full-time or
  part-time\r

  \ - adequate professional qualification\r

  \ - regular professional training\r

  \ - access to specialist literature\r

  \ - support of the data protection officer by data protection coordinators in
  the companies organizational units, depending on the company size (e.g.
  marketing, sales, personnel, logistics, development, etc.)"
elementType: control
