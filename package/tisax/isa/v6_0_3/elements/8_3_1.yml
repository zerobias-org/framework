description: "+ A process for obtaining customer-specific requirements for the
  transport of vehicles, components and parts classified as requiring protection
  is described and implemented. \r

  + The security requirements defined by the customer are known and observed.\r

  + The logistics/transport companies explicitly approved by the customer are
  commissioned.\r

  + A process for reporting any security-relevant events to the customer is
  described and implemented."
