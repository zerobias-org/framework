id: b81fe8c4-592c-4c59-abfd-3f43fb94cda4
externalId: 1.6.1
name: 1.6.1
description: "+ A definition for a reportable security event or observation
  exists and is known by employees and relevant stakeholders. The following
  aspects are considered:\r

  \  - Events and observations related to personnel (e.g., misconduct /
  misbehaviour)\r

  \  - Events and observations related to physical security (e.g., intrusion,
  theft, unauthorized access to security zones, vulnerabilities in the security
  zones)\r

  \  - Events and observations related to IT and cyber security (e.g.,
  vulnerable IT-systems, detected successful or unsuccessful attacks)\r

  \  - Events and observations related to suppliers and other business partners
  (e.g., any incidents that can have negative effect on the security of own
  organization)\r

  + Adequate mechanisms based on perceived risks to report security events are
  defined, implemented, and known to all relevant potential reporters\r

  + Adequate channels for communication with event reporters exist."
elementType: control
