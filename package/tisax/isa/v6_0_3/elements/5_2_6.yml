externalId: 5.2.6
name: 5.2.6
description: "+ Requirements for auditing IT systems or services are
  determined.\r

  + The scope of the system audit is specified in a timely manner.\r

  + System or service audits are coordinated with the operator and users of the
  IT systems or services.\r

  + The results of system or service audits are stored in a traceable manner and
  reported to the relevant management.\r

  + Measures are derived from the results."
elementType: control
