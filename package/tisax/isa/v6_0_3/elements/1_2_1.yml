externalId: 1.2.1
name: 1.2.1
description: "+ The scope of the ISMS (the organization managed by the ISMS) is
  defined.\r

  + The organization's requirements for the ISMS are determined.\r

  + The organizational management has commissioned and approved the ISMS.\r

  + The ISMS provides the organizational management with suitable monitoring and
  control means (e.g. management review).\r

  + Applicable controls have been determined (e.g. ISO 27001 Statement of
  Applicability, completed ISA catalogue).\r

  + The effectiveness of the ISMS is regularly reviewed by the management."
elementType: control
