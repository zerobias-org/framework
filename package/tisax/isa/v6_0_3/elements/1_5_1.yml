description: "+ Observation of policies is verified throughout the
  organization.\r

  + Information security policies and procedures are reviewed at regular
  intervals.\r

  + Measures for correcting potential non-conformities (deviations) are
  initiated and pursued.\r

  + Compliance with information security requirements (e.g. technical
  specifications) is verified at regular intervals.\r

  + The results of the conducted reviews are recorded and retained."
