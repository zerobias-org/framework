externalId: 4.1.3
name: 4.1.3
description: "+ The creating, changing, and deleting of user accounts is
  conducted.\r

  + Unique and personalized user accounts are used.\r

  + The use of “collective accounts” is regulated (e.g. restricted to cases
  where traceability of actions is dispensable).\r

  + User accounts are disabled immediately after the user has resigned from or
  left the organization (e.g. upon termination of the employment contract).\r

  + User accounts are regularly reviewed.\r

  + The login information is provided to the user in a secure manner.\r

  + A policy for the handling of login information is defined and implemented.
  The following aspects are considered:\r

  \  - No disclosure of login information to third parties\r

  \  - not even to persons of authority\r

  \  - under observation of legal parameters\r

  \  - No writing down or unencrypted storing of login information\r

  \  - Immediate changing of login information whenever potential compromising
  is suspected\r

  \  - No use of identical login information for business and non-business
  purposes\r

  \  - Changing of temporary or initial login information following the 1st
  login   - Requirements for the quality of authentication information (e.g.
  length of password, types of characters to be used).\r

  + The login information (e.g. passwords) of a personalized user account must
  be known to the assigned user only."
elementType: control
