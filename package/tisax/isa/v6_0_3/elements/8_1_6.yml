name: 8.1.6
description: "+ Intrusion monitoring of the premises to be secured is ensured:\r

  \  - An intrusion detection system exists which complies with DIN EN 50131 or
  conforms to VDS or similar and functions with alarm tracking to a certified
  security service or control unit (e.g., according to DIN 77200, VdS 3138),\r

  \  - or 24/7 guarding by a certified security service.\r

  + Alarm plans are available.\r

  + Timely alarm processing is ensured."
elementType: control
