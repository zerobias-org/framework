name: 2.1.4
description: "+ The requirements for teleworking are determined and fulfilled.
  The following aspects are considered:\r

  \  - Secure handling of and access to information (in both electronic and
  paper form) while considering the protection needs and the contractual
  requirements applying to private (e.g. home office) and public surroundings
  (e.g. during travels),\r

  \  - Behavior in private surroundings,\r

  \  - Behavior in public surroundings,\r

  \  - Measures for protection from theft (e.g. in public surroundings),\r

  + The organization’s network is accessed via a secured connection (e.g. VPN)
  and strong authentication."
elementType: control
