id: 2d06c14d-3d8f-4b55-96bd-d22acdbb692e
externalId: 8.2.3
name: 8.2.3
description: "+ Ensuring execution of trainings / awareness programs by the
  management.\r

  + Training of employees and project members when joining the project regarding
  the handling of prototypes.\r

  + Regular (at least annual) training of employees regarding the handling of
  prototypes.\r

  + Ensuring knowledge among employees and project members regarding the
  respective protection needs and the resulting measures within the company.\r

  + Mandatory participation of each employee and project member in the trainings
  and awareness measures.\r

  + The completed measures are to be documented. \r

  + The training concept for prototype protection is an integral part of the
  general training concept (see also control question 2.1.3 Information
  Security)."
elementType: control
