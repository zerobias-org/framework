id: 4683b0f3-a4e2-4f11-a4b7-fcf9275da614
externalId: 9.5.3
name: 9.5.3
description: "+ Transfers to third countries are known and systematically
  recorded.\r

  \  - e.g. through corresponding documentation in the processing directory\r

  + Sufficient guarantees (Chapter V GDPR, consideration of decisions of the ECJ
  on international data transfer, Transfer Impact Assessment in case of
  relevance, especially in the role of data exporter) are available for data
  transfers.\r

  + In the case of data transfers to third countries, it is determined whether
  the consent of the person responsible is to be obtained for each transfer to
  third countries."
elementType: control
