externalId: 9.6.2
name: 9.6.2
description: "+ Data protection incidents (e.g. unauthorized access to personal
  data) are processed in a timely manner.\r

  + The requirements from 1.6 of the information security questionnaire also
  take into account data protection incidents or, alternatively, there is an
  emergency plan for dealing with data protection incidents.\r

  + In addition, procedures are established and documented to ensure the
  following aspects:\r

  \  - immediate notification to the respective responsible person, as far as
  his order is affected\r

  \  - Documentation of the incident handling activities\r

  \  - Training of employees on the defined measures/processes\r

  \  - Support of the respective controller in the processing of data protection
  incidents"
elementType: control
