name: 1.3.2
description: "+ A consistent scheme for the classification of information assets
  regarding the protection goal of confidentiality is available.\r

  + Evaluation of the identified information assets is carried out according to
  the defined criteria and assigned to the existing classification scheme. \r

  + Specifications for the handling of supporting assets (e.g. identification,
  correct handling, transport, storage, return, deletion/disposal) depending on
  the classification of information assets are in place and implemented."
