id: bbf7b6e9-f8f1-42c1-995b-deff173f61e5
externalId: Article 49.1(g)
name: Article 49.1(g)
description: the transfer is made from a register which according to Union or
  Member State law is intended to provide information to the public and which is
  open to consultation either by the public in general or by any person who can
  demonstrate a legitimate interest, but only to the extent that the conditions
  laid down by Union or Member State law for consultation are fulfilled in the
  particular case.
elementType: control
