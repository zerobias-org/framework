id: 83ad4a80-31db-4d4b-9f42-533b47a90a15
externalId: Article 17.2
name: Article 17.2
description: Where the controller has made the personal data public and is
  obliged pursuant to paragraph 1 to erase the personal data, the controller,
  taking account of available technology and the cost of implementation, shall
  take reasonable steps, including technical measures, to inform controllers
  which are processing the personal data that the data subject has requested the
  erasure by such controllers of any links to, or copy or replication of, those
  personal data.
elementType: control
