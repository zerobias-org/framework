id: 69dbed37-aa99-4418-a24f-bfa25f9b92a7
externalId: Article 19
name: Notification obligation regarding rectification or erasure of personal
  data or restriction of processing
description: The controller shall communicate any rectification or erasure of
  personal data or restriction of processing carried out in accordance with
  Article 16, Article 17(1) and Article 18 to each recipient to whom the
  personal data have been disclosed, unless this proves impossible or involves
  disproportionate effort. The controller shall inform the data subject about
  those recipients if the data subject requests it.
elementType: control
