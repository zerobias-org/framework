id: db31cd38-07f8-469c-adf9-8148ec2409e8
externalId: Article 28.4
name: Article 28.4
description: Where a processor engages another processor for carrying out
  specific processing activities on behalf of the controller, the same data
  protection obligations as set out in the contract or other legal act between
  the controller and the processor as referred to in paragraph 3 shall be
  imposed on that other processor by way of a contract or other legal act under
  Union or Member State law, in particular providing sufficient guarantees to
  implement appropriate technical and organisational measures in such a manner
  that the processing will meet the requirements of this Regulation. Where that
  other processor fails to fulfil its data protection obligations, the initial
  processor shall remain fully liable to the controller for the performance of
  that other processor's obligations.
elementType: control
