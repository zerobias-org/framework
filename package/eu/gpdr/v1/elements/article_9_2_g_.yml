externalId: Article 9.2(g)
name: Article 9.2(g)
description: processing is necessary for reasons of substantial public interest,
  on the basis of Union or Member State law which shall be proportionate to the
  aim pursued, respect the essence of the right to data protection and provide
  for suitable and specific measures to safeguard the fundamental rights and the
  interests of the data subject;
elementType: control
