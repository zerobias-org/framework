id: b8cd2c00-b015-4724-8e99-568f8d1f42a9
externalId: Article 28.2
name: Article 28.2
description: The processor shall not engage another processor without prior
  specific or general written authorisation of the controller. In the case of
  general written authorisation, the processor shall inform the controller of
  any intended changes concerning the addition or replacement of other
  processors, thereby giving the controller the opportunity to object to such
  changes.
elementType: control
