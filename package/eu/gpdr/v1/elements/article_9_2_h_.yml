externalId: Article 9.2(h)
name: Article 9.2(h)
description: processing is necessary for the purposes of preventive or
  occupational medicine, for the assessment of the working capacity of the
  employee, medical diagnosis, the provision of health or social care or
  treatment or the management of health or social care systems and services on
  the basis of Union or Member State law or pursuant to contract with a health
  professional and subject to the conditions and safeguards referred to in
  paragraph 3;
