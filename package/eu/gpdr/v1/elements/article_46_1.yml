id: f0050922-3613-419d-a506-c4b46c941ebb
externalId: Article 46.1
name: Article 46.1
description: In the absence of a decision pursuant to Article 45(3), a
  controller or processor may transfer personal data to a third country or an
  international organisation only if the controller or processor has provided
  appropriate safeguards, and on condition that enforceable data subject rights
  and effective legal remedies for data subjects are available.
elementType: control
