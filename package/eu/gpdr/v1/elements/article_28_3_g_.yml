externalId: Article 28.3(g)
name: Article 28.3(g)
description: at the choice of the controller, deletes or returns all the
  personal data to the controller after the end of the provision of services
  relating to processing, and deletes existing copies unless Union or Member
  State law requires storage of the personal data;
