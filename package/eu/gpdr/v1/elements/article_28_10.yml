id: f753e081-8b89-4763-90e4-7dd1424b7283
externalId: Article 28.10
name: Article 28.10
description: Without prejudice to Articles 82, 83 and 84, if a processor
  infringes this Regulation by determining the purposes and means of processing,
  the processor shall be considered to be a controller in respect of that
  processing.
elementType: control
