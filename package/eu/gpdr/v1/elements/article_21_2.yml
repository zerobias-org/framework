id: c525af9a-8bd5-4eae-ba8b-7e2646fafb81
externalId: Article 21.2
name: Article 21.2
description: Where personal data are processed for direct marketing purposes,
  the data subject shall have the right to object at any time to processing of
  personal data concerning him or her for such marketing, which includes
  profiling to the extent that it is related to such direct marketing.
elementType: control
