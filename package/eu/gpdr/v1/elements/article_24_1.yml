id: bf47a045-9dd5-45a4-bb19-44a528c7724a
externalId: Article 24.1
name: Article 24.1
description: Taking into account the nature, scope, context and purposes of
  processing as well as the risks of varying likelihood and severity for the
  rights and freedoms of natural persons, the controller shall implement
  appropriate technical and organisational measures to ensure and to be able to
  demonstrate that processing is performed in accordance with this Regulation.
  Those measures shall be reviewed and updated where necessary.
elementType: control
