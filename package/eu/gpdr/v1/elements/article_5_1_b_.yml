id: 2b39cef3-c646-43ac-991f-af6aa2edc772
externalId: Article 5.1(b)
name: Article 5.1(b)
description: collected for specified, explicit and legitimate purposes and not
  further processed in a manner that is incompatible with those purposes;
  further processing for archiving purposes in the public interest, scientific
  or historical research purposes or statistical purposes shall, in accordance
  with Article 89(1), not be considered to be incompatible with the initial
  purposes (‘purpose limitation’);
elementType: control
