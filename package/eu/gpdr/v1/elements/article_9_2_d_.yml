id: 97ef1c1d-2a3b-4d4c-9e04-3f00b14c2b52
externalId: Article 9.2(d)
name: Article 9.2(d)
description: processing is carried out in the course of its legitimate
  activities with appropriate safeguards by a foundation, association or any
  other not-for-profit body with a political, philosophical, religious or trade
  union aim and on condition that the processing relates solely to the members
  or to former members of the body or to persons who have regular contact with
  it in connection with its purposes and that the personal data are not
  disclosed outside that body without the consent of the data subjects;
elementType: control
