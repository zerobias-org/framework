id: 0310789c-6fe6-4285-9060-738402a7f665
externalId: Article 12.4
name: Article 12.4
description: If the controller does not take action on the request of the data
  subject, the controller shall inform the data subject without delay and at the
  latest within one month of receipt of the request of the reasons for not
  taking action and on the possibility of lodging a complaint with a supervisory
  authority and seeking a judicial remedy.
elementType: control
