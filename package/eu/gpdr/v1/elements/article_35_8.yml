externalId: Article 35.8
name: Article 35.8
description: Compliance with approved codes of conduct referred to in Article 40
  by the relevant controllers or processors shall be taken into due account in
  assessing the impact of the processing operations performed by such
  controllers or processors, in particular for the purposes of a data protection
  impact assessment.
elementType: control
