id: 60bcd73f-8d8f-439a-a414-5b59b3c905d0
externalId: Article 37.4
name: Article 37.4
description: In cases other than those referred to in paragraph 1, the
  controller or processor or associations and other bodies representing
  categories of controllers or processors may or, where required by Union or
  Member State law shall, designate a data protection officer. The data
  protection officer may act for such associations and other bodies representing
  controllers or processors.
elementType: control
