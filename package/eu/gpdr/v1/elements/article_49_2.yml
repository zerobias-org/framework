id: be9cbffe-8634-4717-bfc3-6a7dc3e12c3f
externalId: Article 49.2
name: Article 49.2
description: A transfer pursuant to point (g) of the first subparagraph of
  paragraph 1 shall not involve the entirety of the personal data or entire
  categories of the personal data contained in the register. Where the register
  is intended for consultation by persons having a legitimate interest, the
  transfer shall be made only at the request of those persons or if they are to
  be the recipients.
elementType: control
