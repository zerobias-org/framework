id: 1c76a688-308a-4ffa-bef2-76af8eab485c
externalId: Article 28.3
name: Article 28.3
description: "Processing by a processor shall be governed by a contract or other
  legal act under Union or Member State law, that is binding on the processor
  with regard to the controller and that sets out the subject-matter and
  duration of the processing, the nature and purpose of the processing, the type
  of personal data and categories of data subjects and the obligations and
  rights of the controller. That contract or other legal act shall stipulate, in
  particular, that the processor:\r

  \r

  With regard to point (h) of the first subparagraph, the processor shall
  immediately inform the controller if, in its opinion, an instruction infringes
  this Regulation or other Union or Member State data protection provisions."
elementType: control
