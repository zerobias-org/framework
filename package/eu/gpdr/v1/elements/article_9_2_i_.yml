id: c6ea84c0-efc9-4708-9253-89608a3c821a
externalId: Article 9.2(i)
name: Article 9.2(i)
description: processing is necessary for reasons of public interest in the area
  of public health, such as protecting against serious cross-border threats to
  health or ensuring high standards of quality and safety of health care and of
  medicinal products or medical devices, on the basis of Union or Member State
  law which provides for suitable and specific measures to safeguard the rights
  and freedoms of the data subject, in particular professional secrecy;
elementType: control
