id: c6726e1d-b7dc-4ae8-aaa9-b022dc96b64e
externalId: Article 9.2(j)
name: Article 9.2(j)
description: processing is necessary for archiving purposes in the public
  interest, scientific or historical research purposes or statistical purposes
  in accordance with Article 89(1) based on Union or Member State law which
  shall be proportionate to the aim pursued, respect the essence of the right to
  data protection and provide for suitable and specific measures to safeguard
  the fundamental rights and the interests of the data subject.
elementType: control
