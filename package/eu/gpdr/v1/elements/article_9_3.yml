id: 295bb98a-4693-477d-9b5a-fad73d5c0a7b
externalId: Article 9.3
name: Article 9.3
description: Personal data referred to in paragraph 1 may be processed for the
  purposes referred to in point (h) of paragraph 2 when those data are processed
  by or under the responsibility of a professional subject to the obligation of
  professional secrecy under Union or Member State law or rules established by
  national competent bodies or by another person also subject to an obligation
  of secrecy under Union or Member State law or rules established by national
  competent bodies.
elementType: control
