id: e17fac5a-431f-47c1-942a-42f34a6e77e1
externalId: Article 7.3
name: Article 7.3
description: The data subject shall have the right to withdraw his or her
  consent at any time. The withdrawal of consent shall not affect the lawfulness
  of processing based on consent before its withdrawal. Prior to giving consent,
  the data subject shall be informed thereof. It shall be as easy to withdraw as
  to give consent.
elementType: control
