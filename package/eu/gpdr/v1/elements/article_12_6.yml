id: a14975b9-0494-48b0-8017-039cd594dde7
externalId: Article 12.6
name: Article 12.6
description: Without prejudice to Article 11, where the controller has
  reasonable doubts concerning the identity of the natural person making the
  request referred to in Articles 15 to 21, the controller may request the
  provision of additional information necessary to confirm the identity of the
  data subject.
elementType: control
