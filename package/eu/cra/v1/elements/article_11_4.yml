externalId: Article 11.4
name: Article 11.4
description: The manufacturer shall inform, without undue delay and after
  becoming aware, the users of the product with digital elements about the
  incident and, where necessary, about corrective measures that the user can
  deploy to mitigate the impact of the incident.
elementType: control
