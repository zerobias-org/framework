id: a04df6f1-132a-4d91-9116-c8101079b9e8
externalId: Article 23.1
name: Article 23.1
description: The technical documentation shall contain all relevant data or
  details of the means used by the manufacturer to ensure that the product with
  digital elements and the processes put in place by the manufacturer comply
  with the essential requirements set out in Annex I. It shall at least contain
  the elements set out in Annex V.
elementType: control
