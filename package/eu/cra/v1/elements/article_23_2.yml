id: b0a060c2-7661-4a04-8dcb-781b6d2e07e7
externalId: Article 23.2
name: Article 23.2
description: The technical documentation shall be drawn up before the product
  with digital elements is placed on the market and shall be continuously
  updated, where appropriate, during the expected product lifetime or during a
  period of five years after the placing on the market of a product with digital
  elements, whichever is shorter.
elementType: control
