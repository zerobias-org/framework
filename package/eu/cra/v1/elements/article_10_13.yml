id: 31a8f8dd-39f0-4476-a152-8b915d8598ce
externalId: Article 10.13
name: Article 10.13
description: Manufacturers shall, further to a reasoned request from a market
  surveillance authority, provide that authority, in a language which can be
  easily understood by it, with all the information and documentation, in paper
  or electronic form, necessary to demonstrate the conformity of the product
  with digital elements and of the processes put in place by the manufacturer
  with the essential requirements set out in Annex I. They shall cooperate with
  that authority, at its request, on any measures taken to eliminate the
  cybersecurity risks posed by the product with digital elements, which they
  have placed on the market.
elementType: control
