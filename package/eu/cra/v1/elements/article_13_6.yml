id: 25d81ee6-3048-42f9-8b57-f6df61da9f8b
externalId: Article 13.6
name: Article 13.6
description: Importers who know or have reason to believe that a product with
  digital elements, which they have placed on the market, or the processes put
  in place by its manufacturer, are not in conformity with the essential
  requirements set out in Annex I shall immediately take the corrective measures
  necessary to bring that product with digital elements or the processes put in
  place by its manufacturer into conformity with the essential requirements set
  out in Annex I, or to withdraw or recall the product, if appropriate. Upon
  identifying a vulnerability in the product with digital elements, importers
  shall inform the manufacturer without undue delay about that vulnerability.
  Furthermore, where the product with digital elements presents a significant
  cybersecurity risk, importers shall immediately inform the market surveillance
  authorities of the Member States in which they made the product with digital
  elements available on the market to that effect, giving details, in
  particular, of the non-conformity and of any corrective measures taken.
elementType: control
