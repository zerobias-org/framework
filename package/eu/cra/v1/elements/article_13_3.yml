id: 6678a174-c465-4f53-96b9-e048985ce0ea
externalId: Article 13.3
name: Article 13.3
description: Where an importer considers or has reason to believe that a product
  with digital elements or the processes put in place by the manufacturer are
  not in conformity with the essential requirements set out in Annex I, the
  importer shall not place the product on the market until that product or the
  processes put in place by the manufacturer have been brought into conformity
  with the essential requirements set out in Annex I. Furthermore, where the
  product with digital elements presents a significant cybersecurity risk, the
  importer shall inform the manufacturer and the market surveillance authorities
  to that effect.
elementType: control
