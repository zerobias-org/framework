id: c092e4d9-629b-4d9d-ac9a-924d90b36ee1
externalId: Article 10.2
name: Article 10.2
description: For the purposes of complying with the obligation laid down in
  paragraph 1, manufacturers shall undertake an assessment of the cybersecurity
  risks associated with a product with digital elements and take the outcome of
  that assessment into account during the planning, design, development,
  production, delivery and maintenance phases of the product with digital
  elements with a view to minimising cybersecurity risks, preventing security
  incidents and minimising the impacts of such incidents, including in relation
  to the health and safety of users.
elementType: control
