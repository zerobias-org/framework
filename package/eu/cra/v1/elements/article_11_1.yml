id: f51add67-e690-42c7-8cdc-d8a86e7d88a5
externalId: Article 11.1
name: Article 11.1
description: The manufacturer shall, without undue delay and in any event within
  24 hours of becoming aware of it, notify to ENISA any actively exploited
  vulnerability contained in the product with digital elements. The notification
  shall include details concerning that vulnerability and, where applicable, any
  corrective or mitigating measures taken. ENISA shall, without undue delay,
  unless for justified cybersecurity risk-related grounds, forward the
  notification to the CSIRT designated for the purposes of coordinated
  vulnerability disclosure in accordance with Article [Article X] of Directive
  [Directive XXX/XXXX (NIS2)] of Member States concerned upon receipt and inform
  the market surveillance authority about the notified vulnerability.
elementType: control
