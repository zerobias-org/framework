id: fcf7affa-f0c6-47e6-ad91-7fbc4dfd8bc2
externalId: Article 14.4
name: Article 14.4
description: Distributors who know or have reason to believe that a product with
  digital elements, which they have made available on the market, or the
  processes put in place by its manufacturer are not in conformity with the
  essential requirements set out in Annex I shall make sure that the corrective
  measures necessary to bring that product with digital elements or the
  processes put in place by its manufacturer into conformity are taken, or to
  withdraw or recall the product, if appropriate. Upon identifying a
  vulnerability in the product with digital elements, distributors shall inform
  the manufacturer without undue delay about that vulnerability. Furthermore,
  where the product with digital elements presents a significant cybersecurity
  risk, distributors shall immediately inform the market surveillance
  authorities of the Member States in which they have made the product with
  digital elements available on the market to that effect, giving details, in
  particular, of the non-conformity and of any corrective measures taken.
elementType: control
