id: 7bcd0146-eaca-44ab-a159-78c28ddabe02
externalId: Article 14.5
name: Article 14.5
description: Distributors shall, further to a reasoned request from a market
  surveillance authority, provide it with all the information and documentation,
  in paper or electronic form, necessary to demonstrate the conformity of the
  product with digital elements and the processes put in place by its
  manufacturer with the essential requirements set out in Annex I in a language
  that can be easily understood by that authority. They shall cooperate with
  that authority, at its request, on any measures taken to eliminate the
  cybersecurity risks posed by a product with digital elements, which they have
  made available on the market.
elementType: control
