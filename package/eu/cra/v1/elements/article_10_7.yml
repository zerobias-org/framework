id: e072d148-c406-4f0f-a65a-b5c28c63b31c
externalId: Article 10.7
name: Article 10.7
description: Before placing a product with digital elements on the market,
  manufacturers shall draw up the technical documentation referred to in Article
  23. They shall carry out the chosen conformity assessment procedures referred
  to in Article 24 or have them carried out. Where compliance of the product
  with digital elements with the essential requirements set out in Section 1 of
  Annex I and of the processes put in place by the manufacturer with the
  essential requirements set out in Section 2 of Annex I has been demonstrated
  by that conformity assessment procedure, manufacturers shall draw up the EU
  declaration of conformity in accordance with Article 20 and affix the CE
  marking in accordance with Article 22.
elementType: control
