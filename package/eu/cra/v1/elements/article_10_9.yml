id: 0905bfbd-b5e2-470b-9318-dde264c2cff1
externalId: Article 10.9
name: Article 10.9
description: Manufacturers shall ensure that procedures are in place for
  products with digital elements that are part of a series of production to
  remain in conformity. The manufacturer shall adequately take into account
  changes in the development and production process or in the design or
  characteristics of the product with digital elements and changes in the
  harmonised standards, European cybersecurity certification schemes or the
  common specifications referred to in Article 19 by reference to which the
  conformity of the product with digital elements is declared or by application
  of which its conformity is verified.
elementType: control
