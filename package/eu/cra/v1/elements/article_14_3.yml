id: a9414c32-6a17-4145-90b7-07c98a17ad65
externalId: Article 14.3
name: Article 14.3
description: Where a distributor considers or has reason to believe that a
  product with digital elements or the processes put in place by the
  manufacturer are not in conformity with the essential requirements set out in
  Annex I, the distributor shall not make the product with digital elements
  available on the market until that product or the processes put in place by
  the manufacturer have been brought into conformity. Furthermore, where the
  product with digital elements poses a significant cybersecurity risk, the
  distributor shall inform the manufacturer and the market surveillance
  authorities to that effect.
elementType: control
