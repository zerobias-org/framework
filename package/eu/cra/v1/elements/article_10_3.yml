id: 1bf87a9b-25c7-44c6-a76e-2a8e72ee7ee7
externalId: Article 10.3
name: Article 10.3
description: When placing a product with digital elements on the market, the
  manufacturer shall include a cybersecurity risk assessment in the technical
  documentation as set out in Article 23 and Annex V. For products with digital
  elements referred to in Articles 8 and 24(4) that are also subject to other
  Union acts, the cybersecurity risk assessment may be part of the risk
  assessment required by those respective Union acts. Where certain essential
  requirements are not applicable to the marketed product with digital elements,
  the manufacturer shall include a clear justification in that documentation.
elementType: control
