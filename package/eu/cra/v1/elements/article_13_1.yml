id: 0a8002a9-f37c-48ce-b833-6684b8190bee
externalId: Article 13.1
name: Article 13.1
description: Importers shall only place on the market products with digital
  elements that comply with the essential requirements set out in Section 1 of
  Annex I and where the processes put in place by the manufacturer are compliant
  with the essential requirements set out in Section 2 of Annex I.
elementType: control
