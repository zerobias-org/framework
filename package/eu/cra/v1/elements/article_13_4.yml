id: 7df198c0-4a40-4cca-b4f2-7b3fa7e237e0
externalId: Article 13.4
name: Article 13.4
description: Importers shall indicate their name, registered trade name or
  registered trademark, the postal address and the email address at which they
  can be contacted on the product with digital elements or, where that is not
  possible, on its packaging or in a document accompanying the product with
  digital elements. The contact details shall be in a language easily understood
  by users and market surveillance authorities
elementType: control
