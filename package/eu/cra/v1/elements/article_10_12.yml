id: 29486d77-2ab0-4493-b494-3d5bb2a6e88f
externalId: Article 10.12
name: Article 10.12
description: From the placing on the market and for the expected product
  lifetime or for a period of five years after the placing on the market of a
  product with digital elements, whichever is shorter, manufacturers who know or
  have reason to believe that the product with digital elements or the processes
  put in place by the manufacturer are not in conformity with the essential
  requirements set out in Annex I shall immediately take the corrective measures
  necessary to bring that product with digital elements or the manufacturer’s
  processes into conformity, to withdraw or to recall the product, as
  appropriate.
elementType: control
