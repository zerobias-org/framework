externalId: Article 10.8
name: Article 10.8
description: Manufacturers shall keep the technical documentation and the EU
  declaration of conformity, where relevant, at the disposal of the market
  surveillance authorities for ten years after the product with digital elements
  has been placed on the market.
elementType: control
