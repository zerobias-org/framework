externalId: Article 23.3
name: Article 23.3
description: For products with digital elements referred to in Articles 8 and
  24(4) that are also subject to other Union acts, one single technical
  documentation shall be drawn up containing the information referred to in
  Annex V of this Regulation and the information required by those respective
  Union acts.
elementType: control
