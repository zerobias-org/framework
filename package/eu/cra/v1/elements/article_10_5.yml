id: 72a96b7d-a273-45ab-b072-293950b6e680
externalId: Article 10.5
name: Article 10.5
description: The manufacturer shall systematically document, in a manner that is
  proportionate to the nature and the cybersecurity risks, relevant
  cybersecurity aspects concerning the product with digital elements, including
  vulnerabilities they become aware of and any relevant information provided by
  third parties, and, where applicable, update the risk assessment of the
  product.
elementType: control
