id: bc3d4ba4-cde7-4379-95bb-7adc4b07aa9b
externalId: Article 13.7
name: Article 13.7
description: Importers shall, for ten years after the product with digital
  elements has been placed on the market, keep a copy of the EU declaration of
  conformity at the disposal of the market surveillance authorities and ensure
  that the technical documentation can be made available to those authorities,
  upon request.
elementType: control
