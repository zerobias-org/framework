id: d266dd06-e48d-4c8d-83d8-031fbe137e69
externalId: Article 10.6
name: Article 10.6
description: When placing a product with digital elements on the market, and for
  the expected product lifetime or for a period of five years from the placing
  of the product on the market, whichever is shorter, manufacturers shall ensure
  that vulnerabilities of that product are handled effectively and in accordance
  with the essential requirements set out in Section 2 of Annex I. Manufacturers
  shall have appropriate policies and procedures, including coordinated
  vulnerability disclosure policies, referred to in Section 2, point (5), of
  Annex I, to process and remediate potential vulnerabilities in the product
  with digital elements reported from internal or external sources.
elementType: control
