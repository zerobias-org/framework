id: a993b7d7-0601-4723-a3a4-f82954dd9a3a
externalId: Article 13.8
name: Article 13.8
description: Importers shall, further to a reasoned request from a market
  surveillance authority, provide it with all the information and documentation,
  in paper or electronic form, necessary to demonstrate the conformity of the
  product with digital elements with the essential requirements set out in
  Section 1 of Annex I as well as of the processes put in place by the
  manufacturer with the essential requirements set out in Section 2 of Annex I
  in a language that can be easily understood by that authority. They shall
  cooperate with that authority, at its request, on any measures taken to
  eliminate the cybersecurity risks posed by a product with digital elements,
  which they have placed on the market.
elementType: control
