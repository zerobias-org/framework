id: 9012cdca-a28f-46c1-88c9-11b01c287944
externalId: Article 10.4
name: Article 10.4
description: For the purposes of complying with the obligation laid down in
  paragraph 1, manufacturers shall exercise due diligence when integrating
  components sourced from third parties in products with digital elements. They
  shall ensure that such components do not compromise the security of the
  product with digital elements.
elementType: control
