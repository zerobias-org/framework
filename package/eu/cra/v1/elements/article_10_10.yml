id: 7d2caede-f8e6-4f21-b380-88e703bb8001
externalId: Article 10.10
name: Article 10.10
description: Manufacturers shall ensure that products with digital elements are
  accompanied by the information and instructions set out in Annex II, in an
  electronic or physical form. Such information and instructions shall be in a
  language which can be easily understood by users. They shall be clear,
  understandable, intelligible and legible. They shall allow for a secure
  installation, operation and use of the products with digital elements.
elementType: control
