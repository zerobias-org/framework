id: 3e312e7a-bca9-4253-94b8-b36dc5bd95b2
externalId: Article 11.2
name: Article 11.2
description: The manufacturer shall, without undue delay and in any event within
  24 hours of becoming aware of it, notify to ENISA any incident having impact
  on the security of the product with digital elements. ENISA shall, without
  undue delay, unless for justified cybersecurity risk-related grounds, forward
  the notifications to the single point of contact designated in accordance with
  Article [Article X] of Directive [Directive XXX/XXXX (NIS2)] of the Member
  States concerned and inform the market surveillance authority about the
  notified incidents. The incident notification shall include information on the
  severity and impact of the incident and, where applicable, indicate whether
  the manufacturer suspects the incident to be caused by unlawful or malicious
  acts or considers it to have a cross-border impact.
elementType: control
