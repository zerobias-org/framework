id: 6d47aada-78fa-42a7-b314-4afda3c6b8db
externalId: Article 11.7
name: Article 11.7
description: Manufacturers shall, upon identifying a vulnerability in a
  component, including in an open source component, which is integrated in the
  product with digital elements, report the vulnerability to the person or
  entity maintaining the component.
elementType: control
