id: c6cc6307-9929-442d-a669-26ad4ea523c6
externalId: Article 32.2
name: Article 32.2
description: In assessing the appropriate level of security account shall be
  taken in particular of the risks that are presented by processing, in
  particular from accidental or unlawful destruction, loss, alteration,
  unauthorised disclosure of, or access to personal data transmitted, stored or
  otherwise processed.
elementType: control
