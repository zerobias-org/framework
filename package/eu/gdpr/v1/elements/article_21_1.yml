id: 4c7bf2a1-79a4-4b4c-8e47-3be9a3754e36
externalId: Article 21.1
name: Article 21.1
description: The data subject shall have the right to object, on grounds
  relating to his or her particular situation, at any time to processing of
  personal data concerning him or her which is based on point (e) or (f) of
  Article 6(1), including profiling based on those provisions. The controller
  shall no longer process the personal data unless the controller demonstrates
  compelling legitimate grounds for the processing which override the interests,
  rights and freedoms of the data subject or for the establishment, exercise or
  defence of legal claims.
elementType: control
