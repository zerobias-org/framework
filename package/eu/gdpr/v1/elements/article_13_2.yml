id: 7aa868bc-10ea-440f-ac8f-326b7f0af8c2
externalId: Article 13.2
name: Article 13.2
description: where applicable, the fact that the controller intends to transfer
  personal data to a third country or international organisation and the
  existence or absence of an adequacy decision by the Commission, or in the case
  of transfers referred to in Article 46 or 47, or the second subparagraph of
  Article 49(1), reference to the appropriate or suitable safeguards and the
  means by which to obtain a copy of them or where they have been made
  available.
elementType: control
