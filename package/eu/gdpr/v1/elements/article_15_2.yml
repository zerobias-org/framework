id: dd439877-b901-4d56-b22a-986d1f621f70
externalId: Article 15.2
name: Article 15.2
description: Where personal data are transferred to a third country or to an
  international organisation, the data subject shall have the right to be
  informed of the appropriate safeguards pursuant to Article 46 relating to the
  transfer.
elementType: control
