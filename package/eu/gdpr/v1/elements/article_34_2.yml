externalId: Article 34.2
name: Article 34.2
description: The communication to the data subject referred to in paragraph 1 of
  this Article shall describe in clear and plain language the nature of the
  personal data breach and contain at least the information and measures
  referred to in points (b), (c) and (d) of Article 33(3).
elementType: control
