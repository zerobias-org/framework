id: b2124055-f8fd-4300-85e3-92759b7df4fa
externalId: Article 38.3
name: Article 38.3
description: The controller and processor shall ensure that the data protection
  officer does not receive any instructions regarding the exercise of those
  tasks. He or she shall not be dismissed or penalised by the controller or the
  processor for performing his tasks. The data protection officer shall directly
  report to the highest management level of the controller or the processor.
elementType: control
