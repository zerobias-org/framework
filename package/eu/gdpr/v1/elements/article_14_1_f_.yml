id: 2ebb629f-9542-490b-accb-a64398063bdb
externalId: Article 14.1(f)
name: Article 14.1(f)
description: where applicable, that the controller intends to transfer personal
  data to a recipient in a third country or international organisation and the
  existence or absence of an adequacy decision by the Commission, or in the case
  of transfers referred to in Article 46 or 47, or the second subparagraph of
  Article 49(1), reference to the appropriate or suitable safeguards and the
  means to obtain a copy of them or where they have been made available.
elementType: control
