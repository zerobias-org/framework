id: 5f924162-aa3c-403e-8580-c3e5a2eba1b3
externalId: Article 19
name: Notification obligation regarding rectification or erasure of personal
  data or restriction of processing
description: Requires the controller to notify each recipient of any rectification, erasure or restriction of processing, unless impossible or disproportionately effortful.
elementType: control
