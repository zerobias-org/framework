id: 96dd1d31-00db-47dc-aeb5-dea899d95857
externalId: Article 13.3
name: Article 13.3
description: Where the controller intends to further process the personal data
  for a purpose other than that for which the personal data were collected, the
  controller shall provide the data subject prior to that further processing
  with information on that other purpose and with any relevant further
  information as referred to in paragraph 2.
elementType: control
