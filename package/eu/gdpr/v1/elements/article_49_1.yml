id: 38f320d3-bb1a-48f7-b157-f5fce01a2935
externalId: Article 49.1
name: Article 49.1
description: "In the absence of an adequacy decision pursuant to Article 45(3),
  or of appropriate safeguards pursuant to Article 46, including binding
  corporate rules, a transfer or a set of transfers of personal data to a third
  country or an international organisation shall take place only on one of the
  following conditions:\r

  \r

  Where a transfer could not be based on a provision in Article 45 or 46,
  including the provisions on binding corporate rules, and none of the
  derogations for a specific situation referred to in the first subparagraph of
  this paragraph is applicable, a transfer to a third country or an
  international organisation may take place only if the transfer is not
  repetitive, concerns only a limited number of data subjects, is necessary for
  the purposes of compelling legitimate interests pursued by the controller
  which are not overridden by the interests or rights and freedoms of the data
  subject, and the controller has assessed all the circumstances surrounding the
  data transfer and has on the basis of that assessment provided suitable
  safeguards with regard to the protection of personal data. The controller
  shall inform the supervisory authority of the transfer. The controller shall,
  in addition to providing the information referred to in Articles 13 and 14,
  inform the data subject of the transfer and on the compelling legitimate
  interests pursued."
elementType: control
