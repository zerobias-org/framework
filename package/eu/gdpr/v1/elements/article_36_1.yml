id: d786e952-0c9c-4448-ac7c-372ab37df3c7
externalId: Article 36.1
name: Article 36.1
description: The controller shall consult the supervisory authority prior to
  processing where a data protection impact assessment under Article 35
  indicates that the processing would result in a high risk in the absence of
  measures taken by the controller to mitigate the risk.
elementType: control
