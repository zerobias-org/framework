id: 92f7bc95-4429-4c13-93b1-89aff942ab3c
externalId: 3.2.6
name: 3.2.6
description: To the extent feasible, the relevant entities shall ensure that all
  systems have synchronised time sources to be able to correlate logs between
  systems for event assessment. The relevant entities shall establish and keep a
  list of all assets that are being logged and ensure that monitoring and
  logging systems are redundant. The availability of the monitoring and logging
  systems shall be monitored independent of the systems they are monitoring.
elementType: control
