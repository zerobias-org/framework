id: bada2357-6a38-45c2-ae6c-adce0e337649
externalId: Article 23.1
name: Article 23.1
description: "Each Member State shall ensure that essential and important
  entities notify, without undue delay, its CSIRT or, where applicable, its
  competent authority in accordance with paragraph 4 of any incident that has a
  significant impact on the provision of their services as referred to in
  paragraph 3 (significant incident). Where appropriate, entities concerned
  shall notify, without undue delay, the recipients of their services of
  significant incidents that are likely to adversely affect the provision of
  those services. Each Member State shall ensure that those entities report,
  inter alia, any information enabling the CSIRT or, where applicable, the
  competent authority to determine any cross-border impact of the incident. The
  mere act of notification shall not subject the notifying entity to increased
  liability.\r

  \r

  Where the entities concerned notify the competent authority of a significant
  incident under the first subparagraph, the Member State shall ensure that that
  competent authority forwards the notification to the CSIRT upon receipt.\r

  \r

  In the case of a cross-border or cross-sectoral significant incident, Member
  States shall ensure that their single points of contact are provided in due
  time with relevant information notified in accordance with paragraph 4."
elementType: control
