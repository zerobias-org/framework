id: ca637c0b-b568-4ce1-a2ae-37f2e214629a
externalId: Article 23.2
name: Article 23.2
description: Where applicable, Member States shall ensure that essential and
  important entities communicate, without undue delay, to the recipients of
  their services that are potentially affected by a significant cyber threat any
  measures or remedies that those recipients are able to take in response to
  that threat. Where appropriate, the entities shall also inform those
  recipients of the significant cyber threat itself.
elementType: control
