id: 739a9773-4928-4cc7-89ee-a485776f5e10
externalId: "12.5"
name: Deposit, return or deletion of assets upon termination of employment
description: The relevant entities shall establish, implement and apply
  procedures which ensure that their assets which are under custody of personnel
  are deposited, returned or deleted upon termination of employment, and shall
  document the deposit, return and deletion of those assets. Where the deposit,
  return or deletion of assets is not possible, the relevant entities shall
  ensure that the assets can no longer access the relevant entities’ network and
  information systems in accordance with point 12.2.2.
elementType: control
