id: 708e7270-269c-4669-bcdc-87c650721682
externalId: 6.1.1
name: 6.1.1
description: For the purpose of Article 21(2), point (e) of Directive (EU)
  2022/2555, the relevant entities shall set and implement processes to manage
  risks stemming from the acquisition of ICT services or ICT products for
  components that are critical for the relevant entities’ security of network
  and information systems, based on the risk assessment carried out pursuant to
  point 2.1, from suppliers or service providers throughout their life cycle.
elementType: control
