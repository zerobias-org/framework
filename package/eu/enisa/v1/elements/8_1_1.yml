id: 7dbea34b-2887-4932-abd0-240eea02ce62
externalId: 8.1.1
name: 8.1.1
description: For the purpose of Article 21(2), point (g) of Directive (EU)
  2022/2555, the relevant entities shall ensure that their employees, including
  members of management bodies, as well as direct suppliers and service
  providers are aware of risks, are informed of the importance of cybersecurity
  and apply cyber hygiene practices.
elementType: control
