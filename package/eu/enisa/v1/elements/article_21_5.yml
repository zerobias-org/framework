id: 2ea1eb10-d926-4091-835b-a016036a56b0
externalId: Article 21.5
name: Article 21.5
description: By 17 October 2024, the Commission shall adopt implementing acts
  laying down the technical and the methodological requirements of the measures
  referred to in paragraph 2 with regard to DNS service providers, TLD name
  registries, cloud computing service providers, data centre service providers,
  content delivery network providers, managed service providers, managed
  security service providers, providers of online market places, of online
  search engines and of social networking services platforms, and trust service
  providers.
elementType: control
