id: 33f24c44-e601-4558-9726-faff22ee03c0
externalId: Article 23.4
name: Article 23.4
description: "Member States shall ensure that, for the purpose of notification
  under paragraph 1, the entities concerned submit to the CSIRT or, where
  applicable, the competent authority:\r

  \r

  By way of derogation from the first subparagraph, point (b), a trust service
  provider shall, with regard to significant incidents that have an impact on
  the provision of its trust services, notify the CSIRT or, where applicable,
  the competent authority, without undue delay and in any event within 24 hours
  of becoming aware of the significant incident."
elementType: control
