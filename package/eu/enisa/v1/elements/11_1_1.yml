id: 204d059c-35ae-45f5-9732-897d01e9338a
externalId: 11.1.1
name: 11.1.1
description: For the purpose of Article 21(2), point (i) of Directive (EU)
  2022/2555, the relevant entities shall establish, document and implement
  logical and physical access control policies for the access to their network
  and information systems, based on business requirements as well as network and
  information system security requirements.
elementType: control
