externalId: 2.2.1
name: 2.2.1
description: The relevant entities shall regularly review the compliance with
  their policies on network and information system security, topic-specific
  policies, rules, and standards. The management bodies shall be informed of the
  status of network and information security on the basis of the compliance
  reviews by means of regular reporting.
elementType: control
