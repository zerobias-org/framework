name: 11.7.1
description: The relevant entities shall ensure that users are authenticated by
  multiple authentication factors or continuous authentication mechanisms for
  accessing the relevant entities’ network and information systems, where
  appropriate, in accordance with the classification of the asset to be
  accessed.
