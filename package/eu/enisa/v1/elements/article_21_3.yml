id: 298ef5e5-d4ce-48ff-a974-13fa79484296
externalId: Article 21.3
name: Article 21.3
description: Member States shall ensure that, when considering which measures
  referred to in paragraph 2, point (d), of this Article are appropriate,
  entities take into account the vulnerabilities specific to each direct
  supplier and service provider and the overall quality of products and
  cybersecurity practices of their suppliers and service providers, including
  their secure development procedures. Member States shall also ensure that,
  when considering which measures referred to in that point are appropriate,
  entities are required to take into account the results of the coordinated
  security risk assessments of critical supply chains carried out in accordance
  with Article 22(1).
elementType: control
