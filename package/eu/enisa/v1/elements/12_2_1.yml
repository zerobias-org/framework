externalId: 12.2.1
name: 12.2.1
description: The relevant entities shall establish, implement and apply a policy
  for the proper handling of assets, including information, in accordance with
  their network and information security policy, and shall communicate the
  policy on proper handling of assets to anyone who uses or handles assets.
elementType: control
