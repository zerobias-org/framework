id: 3aa0b09e-a192-413c-9c71-35230e6827e2
externalId: Article 23.4(b)
name: Article 23.4(b)
description: without undue delay and in any event within 72 hours of becoming
  aware of the significant incident, an incident notification, which, where
  applicable, shall update the information referred to in point (a) and indicate
  an initial assessment of the significant incident, including its severity and
  impact, as well as, where available, the indicators of compromise;
elementType: control
