externalId: "9.1"
name: "9.1"
description: For the purpose of Article 21(2), point (h) of Directive (EU)
  2022/2555, the relevant entities shall establish, implement and apply a policy
  and procedures related to cryptography, with a view to ensuring adequate and
  effective use of cryptography to protect the confidentiality, authenticity and
  integrity of data in line with the relevant entities’ asset classification and
  the results of the risk assessment carried out pursuant to point 2.1.
elementType: control
