id: 1de8214e-3c31-4d8c-b064-07ddbdf9f24e
externalId: 6.2.1
name: 6.2.1
description: Before developing a network and information system, including
  software, the relevant entities shall lay down rules for the secure
  development of network and information systems and apply them when developing
  network and information systems in-house, or when outsourcing the development
  of network and information systems. The rules shall cover all development
  phases, including specification, design, development, implementation and
  testing.
elementType: control
