externalId: Article 23.4(a)
name: Article 23.4(a)
description: without undue delay and in any event within 24 hours of becoming
  aware of the significant incident, an early warning, which, where applicable,
  shall indicate whether the significant incident is suspected of being caused
  by unlawful or malicious acts or could have a cross-border impact;
elementType: control
