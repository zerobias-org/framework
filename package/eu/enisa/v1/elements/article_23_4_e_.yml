externalId: Article 23.4(e)
name: Article 23.4(e)
description: in the event of an ongoing incident at the time of the submission
  of the final report referred to in point (d), Member States shall ensure that
  entities concerned provide a progress report at that time and a final report
  within one month of their handling of the incident.
elementType: control
