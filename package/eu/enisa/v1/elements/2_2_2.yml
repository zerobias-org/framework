externalId: 2.2.2
name: 2.2.2
description: The relevant entities shall put in place an effective compliance
  reporting system which shall be appropriate to their structures, operating
  environments and threat landscapes. The compliance reporting system shall be
  capable to provide to the management bodies an informed view of the current
  state of the relevant entities’ management of risks.
elementType: control
