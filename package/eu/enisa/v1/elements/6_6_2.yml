externalId: 6.6.2
name: 6.6.2
description: By way of derogation from point 6.6.1.(a), the relevant entities
  may choose not to apply security patches when the disadvantages of applying
  the security patches outweigh the cybersecurity benefits. The relevant
  entities shall duly document and substantiate the reasons for any such
  decision.
elementType: control
