externalId: 4.2.6
name: 4.2.6
description: The relevant entities shall carry out regular testing of the
  recovery of backup copies and redundancies to ensure that, in recovery
  conditions, they can be relied upon and cover the copies, processes and
  knowledge to perform an effective recovery. The relevant entities shall
  document the results of the tests and, where needed, take corrective action.
elementType: control
