id: b1fc9a35-ab15-4456-8984-6e1cbe469075
externalId: 5.1.1
name: 5.1.1
description: For the purpose of Article 21(2), point (d) of Directive (EU)
  2022/2555, the relevant entities shall establish, implement and apply a supply
  chain security policy which governs the relations with their direct suppliers
  and service providers in order to mitigate the identified risks to the
  security of network and information systems. In the supply chain security
  policy, the relevant entities shall identify their role in the supply chain
  and communicate it to their direct suppliers and service providers.
elementType: control
