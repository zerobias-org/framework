id: e742299b-0c8c-4647-9a4d-880ad5043d65
externalId: 11.5.3
name: 11.5.3
description: The relevant entities shall only permit identities assigned to
  multiple persons, such as shared identities, where they are necessary for
  business or operational reasons and are subject to an explicit approval
  process and documentation. The relevant entities shall take identities
  assigned to multiple persons into account in the cybersecurity risk management
  framework referred to in point 2.1.
elementType: control
