id: b6b58bf9-b93b-485f-b6f6-f188775f02f4
externalId: 5.1.6
name: 5.1.6
description: The relevant entities shall review the supply chain security
  policy, and monitor, evaluate and, where necessary, act upon changes in the
  cybersecurity practices of suppliers and service providers, at planned
  intervals and when significant changes to operations or risks or significant
  incidents related to the provision of ICT services or having impact on the
  security of the ICT products from suppliers and service providers occur.
elementType: control
