externalId: 3.1.1
name: 3.1.1
description: For the purpose of Article 21(2), point (b) of Directive (EU)
  2022/2555, the relevant entities shall establish and implement an incident
  handling policy laying down the roles, responsibilities, and procedures for
  detecting, analysing, containing or responding to, recovering from,
  documenting and reporting of incidents in a timely manner.
elementType: control
