externalId: 10.1.1
name: 10.1.1
description: For the purpose of Article 21(2), point (i) of Directive (EU)
  2022/2555, the relevant entities shall ensure that their employees and direct
  suppliers and service providers, wherever applicable, understand and commit to
  their security responsibilities, as appropriate for the offered services and
  the job and in line with the relevant entities’ policy on the security of
  network and information systems.
elementType: control
