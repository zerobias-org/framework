id: f1f25d9d-3f2e-45b0-8371-ea491f3f4f9b
externalId: 6.4.2
name: 6.4.2
description: The procedures referred to in point 6.4.1. shall be applied for
  releases, modifications and emergency changes of any software and hardware in
  operation and changes to the configuration. The procedures shall ensure that
  those changes are documented and, based on the risk assessment carried out
  pursuant to point 2.1, tested and assessed in view of the potential impact
  before being implemented.
elementType: control
