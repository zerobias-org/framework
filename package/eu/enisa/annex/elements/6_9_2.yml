id: 3a90d3df-40f1-4852-bbbd-2ea41b7d510f
externalId: 6.9.2
name: 6.9.2
description: For that purpose, the relevant entities shall in particular
  implement measures that detect or prevent the use of malicious or unauthorised
  software. The relevant entities shall, where appropriate, ensure that their
  network and information systems are equipped with detection and response
  software, which is updated regularly in accordance with the risk assessment
  carried out pursuant to point 2.1 and the contractual agreements with the
  providers.
elementType: control
