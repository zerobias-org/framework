id: ae99beca-db2a-490d-a93f-9bfb5dcc099e
externalId: 2.1.1
name: 2.1.1
description: For the purpose of Article 21(2), point (a) of Directive (EU)
  2022/2555, the relevant entities shall establish and maintain an appropriate
  risk management framework to identify and address the risks posed to the
  security of network and information systems. The relevant entities shall
  perform and document risk assessments and, based on the results, establish,
  implement and monitor a risk treatment plan. Risk assessment results and
  residual risks shall be accepted by management bodies or, where applicable, by
  persons who are accountable and have the authority to manage risks, provided
  that the relevant entities ensure adequate reporting to the management bodies.
elementType: control
