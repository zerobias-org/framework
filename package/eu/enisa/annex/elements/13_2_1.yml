id: 0d99c93d-e9a2-4c42-a3e1-5ffb0125e029
externalId: 13.2.1
name: 13.2.1
description: For the purpose of Article 21(2)(e) of Directive (EU) 2022/2555,
  the relevant entities shall prevent or reduce the consequences of events
  originating from physical and environmental threats, such as natural disasters
  and other intentional or unintentional threats, based on the results of the
  risk assessment carried out pursuant to point 2.1.
elementType: control
