id: 01b0adc6-681e-4686-8fdf-3fd1b4c201b3
externalId: 2.3.2
name: 2.3.2
description: The relevant entities shall develop and maintain processes to
  conduct independent reviews which shall be carried out by individuals with
  appropriate audit competence. Where the independent review is conducted by
  staff members of the relevant entity, the persons conducting the reviews shall
  not be in the line of authority of the personnel of the area under review. If
  the size of the relevant entities does not allow such separation of line of
  authority, the relevant entities shall put in place alternative measures to
  guarantee the impartiality of the reviews.
elementType: control
