id: 131d3d68-78ad-46dd-bdd7-81330eaf17bb
externalId: 3.6.1
name: 3.6.1
description: Where appropriate, the relevant entities shall carry out
  post-incident reviews after recovery from incidents. The post-incident reviews
  shall identify, where possible, the root cause of the incident and result in
  documented lessons learned to reduce the occurrence and consequences of future
  incidents.
elementType: control
