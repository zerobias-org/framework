name: 13.1.1
description: For the purpose of Article 21(2)(c) of Directive (EU) 2022/2555,
  the relevant entities shall prevent loss, damage or compromise of network and
  information systems or interruption to their operations due to the failure and
  disruption of supporting utilities.
