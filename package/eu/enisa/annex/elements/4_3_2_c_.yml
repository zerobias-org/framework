externalId: 4.3.2(c)
name: 4.3.2(c)
description: "application of appropriate measures to ensure the maintenance of
  network and information system security in crisis situations.\r

  \r

  For the purpose of point (b), the flow of information between the relevant
  entities and relevant competent authorities shall include both obligatory
  communications, such as incident reports and related timelines, and
  non-obligatory communications."
elementType: control
