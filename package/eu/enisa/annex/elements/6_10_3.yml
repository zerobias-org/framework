externalId: 6.10.3
name: 6.10.3
description: When justified by the potential impact of the vulnerability, the
  relevant entities shall create and implement a plan to mitigate the
  vulnerability. In other cases, the relevant entities shall document and
  substantiate the reason why the vulnerability does not require remediation.
elementType: control
