name: EU Artificial Intelligence (AI) Act (Regulation (EU) 2024/1689)
externalId: EU AI Act (Regulation (EU) 2024/1689)
description: The EU AI Act (Regulation (EU) 2024/1689) establishes a comprehensive legal framework for the development, deployment, and use of artificial intelligence systems within the European Union. It introduces a risk-based classification system with requirements ranging from transparency obligations for limited-risk AI to strict prohibitions on unacceptable-risk practices, and mandates conformity assessments, risk management, and human oversight for high-risk AI systems.
