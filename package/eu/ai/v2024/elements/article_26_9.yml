name: Article 26.9
description: Where applicable, deployers of high-risk AI systems shall use the information
  provided under Article 13 of this Regulation to comply with their obligation to
  carry out a data protection impact assessment under Article 35 of Regulation (EU)
  2016/679 or Article 27 of Directive (EU) 2016/680.
