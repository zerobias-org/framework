name: Article 48.4
description: Where applicable, the CE marking shall be followed by the identification
  number of the notified body responsible for the conformity assessment procedures
  set out in Article 43. The identification number of the notified body shall be affixed
  by the body itself or, under its instructions, by the provider or by the provider’s
  authorised representative. The identification number shall also be indicated in
  any promotional material which mentions that the high-risk AI system fulfils the
  requirements for CE marking.
