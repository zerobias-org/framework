name: Article 43.4
description: "High-risk AI systems that have already been subject to a conformity\
  \ assessment procedure shall undergo a new conformity assessment procedure in the\
  \ event of a substantial modification, regardless of whether the modified system\
  \ is intended to be further distributed or continues to be used by the current deployer.\
  \ \r\n\r\nFor high-risk AI systems that continue to learn after being placed on\
  \ the market or put into service, changes to the high-risk AI system and its performance\
  \ that have been pre-determined by the provider at the moment of the initial conformity\
  \ assessment and are part of the information contained in the technical documentation\
  \ referred to in point 2(f) of Annex IV, shall not constitute a substantial modification."
elementType: control
