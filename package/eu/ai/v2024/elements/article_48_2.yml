externalId: Article 48.2
name: Article 48.2
description: For high-risk AI systems provided digitally, a digital CE marking
  shall be used, only if it can easily be accessed via the interface from which
  that system is accessed or via an easily accessible machine-readable code or
  other electronic means.
elementType: control
