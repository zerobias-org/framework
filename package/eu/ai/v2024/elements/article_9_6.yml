id: 971f7ce4-db57-4407-9bc9-1ca9dd667392
externalId: Article 9.6
name: Article 9.6
description: High-risk AI systems shall be tested for the purpose of identifying
  the most appropriate and targeted risk management measures. Testing shall
  ensure that high-risk AI systems perform consistently for their intended
  purpose and that they are in compliance with the requirements set out in this
  Section.
elementType: control
