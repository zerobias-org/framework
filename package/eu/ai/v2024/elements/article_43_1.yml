name: Article 43.1
description: "For high-risk AI systems listed in point 1 of Annex III, where, in demonstrating\
  \ the compliance of a high-risk AI system with the requirements set out in Section\
  \ 2, the provider has applied harmonised standards referred to in Article 40, or,\
  \ where applicable, common specifications referred to in Article 41, the provider\
  \ shall opt for one of the following conformity assessment procedures based on:\
  \  \r\n\r\nEnd - For the purposes of the conformity assessment procedure referred\
  \ to in Annex VII, the provider may choose any of the notified bodies. However,\
  \ where the high-risk AI system is intended to be put into service by law enforcement,\
  \ immigration or asylum authorities or by Union institutions, bodies, offices or\
  \ agencies, the market surveillance authority referred to in Article 74(8) or (9),\
  \ as applicable, shall act as a notified body"
elementType: control
