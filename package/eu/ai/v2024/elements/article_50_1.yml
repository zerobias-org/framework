name: Article 50.1
description: Providers shall ensure that AI systems intended to interact directly
  with natural persons are designed and developed in such a way that the natural persons
  concerned are informed that they are interacting with an AI system, unless this
  is obvious from the point of view of a natural person who is reasonably well-informed,
  observant and circumspect, taking into account the circumstances and the context
  of use. This obligation shall not apply to AI systems authorised by law to detect,
  prevent, investigate or prosecute criminal offences, subject to appropriate safeguards
  for the rights and freedoms of third parties, unless those systems are available
  for the public to report a criminal offence.
elementType: control
