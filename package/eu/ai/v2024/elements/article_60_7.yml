id: eaf155c5-7e28-49a6-8dca-e808c3e3bed4
externalId: Article 60.7
name: Article 60.7
description: Any serious incident identified in the course of the testing in
  real world conditions shall be reported to the national market surveillance
  authority in accordance with Article 73. The provider or prospective provider
  shall adopt immediate mitigation measures or, failing that, shall suspend the
  testing in real world conditions until such mitigation takes place, or
  otherwise terminate it. The provider or prospective provider shall establish a
  procedure for the prompt recall of the AI system upon such termination of the
  testing in real world conditions.
elementType: control
