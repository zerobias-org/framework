id: e27adf6b-6efa-4952-ae0c-d399db41bb40
externalId: Article 48.5
name: Article 48.5
description: Where high-risk AI systems are subject to other Union law which
  also provides for the affixing of the CE marking, the CE marking shall
  indicate that the high-risk AI system also fulfil the requirements of that
  other law.
elementType: control
