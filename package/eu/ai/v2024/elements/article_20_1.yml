id: 0e7acdd0-3c6c-4406-97ec-a0e42b78970a
externalId: Article 20.1
name: Article 20.1
description: Providers of high-risk AI systems which consider or have reason to
  consider that a high-risk AI system that they have placed on the market or put
  into service is not in conformity with this Regulation shall immediately take
  the necessary corrective actions to bring that system into conformity, to
  withdraw it, to disable it, or to recall it, as appropriate. They shall inform
  the distributors of the high-risk AI system concerned and, where applicable,
  the deployers, the authorised representative and importers accordingly.
elementType: control
