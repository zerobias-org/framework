name: Article 24.4
description: A distributor that considers or has reason to consider, on the basis
  of the information in its possession, a high-risk AI system which it has made available
  on the market not to be in conformity with the requirements set out in Section 2,
  shall take the corrective actions necessary to bring that system into conformity
  with those requirements, to withdraw it or recall it, or shall ensure that the provider,
  the importer or any relevant operator, as appropriate, takes those corrective actions.
  Where the high-risk AI system presents a risk within the meaning of Article 79(1),
  the distributor shall immediately inform the provider or importer of the system
  and the authorities competent for the high-risk AI system concerned, giving details,
  in particular, of the non-compliance and of any corrective actions taken.
elementType: control
