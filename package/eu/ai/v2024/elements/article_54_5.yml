id: 710979c2-d8fb-4031-b916-565d01889c24
externalId: Article 54.5
name: Article 54.5
description: The authorised representative shall terminate the mandate if it
  considers or has reason to consider the provider to be acting contrary to its
  obligations pursuant to this Regulation. In such a case, it shall also
  immediately inform the AI Office about the termination of the mandate and the
  reasons therefor.
elementType: control
