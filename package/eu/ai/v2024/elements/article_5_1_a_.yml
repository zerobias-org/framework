id: 943dc163-36b5-4276-a291-a5d7bcb6349e
externalId: Article 5.1(a)
name: Article 5.1(a)
description: the placing on the market, the putting into service or the use of
  an AI system that deploys subliminal techniques beyond a person’s
  consciousness or purposefully manipulative or deceptive techniques, with the
  objective, or the effect of materially distorting the behaviour of a person or
  a group of persons by appreciably impairing their ability to make an informed
  decision, thereby causing them to take a decision that they would not have
  otherwise taken in a manner that causes or is reasonably likely to cause that
  person, another person or group of persons significant harm;
elementType: control
