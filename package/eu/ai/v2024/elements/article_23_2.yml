id: 65421dfc-ec3c-44a2-b20a-4bf656616788
externalId: Article 23.2
name: Article 23.2
description: Where an importer has sufficient reason to consider that a
  high-risk AI system is not in conformity with this Regulation, or is
  falsified, or accompanied by falsified documentation, it shall not place the
  system on the market until it has been brought into conformity. Where the
  high-risk AI system presents a risk within the meaning of Article 79(1), the
  importer shall inform the provider of the system, the authorised
  representative and the market surveillance authorities to that effect.
elementType: control
