id: 49af00d1-56fc-44f5-a6c1-ef3fabb0b3d4
externalId: Article 50.3
name: Article 50.3
description: Deployers of an emotion recognition system or a biometric
  categorisation system shall inform the natural persons exposed thereto of the
  operation of the system, and shall process the personal data in accordance
  with Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680,
  as applicable. This obligation shall not apply to AI systems used for
  biometric categorisation and emotion recognition, which are permitted by law
  to detect, prevent or investigate criminal offences, subject to appropriate
  safeguards for the rights and freedoms of third parties, and in accordance
  with Union law.
elementType: control
