name: Article 72.3
description: The post-market monitoring system shall actively and systematically collect,
  document and analyse relevant data which may be provided by deployers or which may
  be collected through other sources on the performance of high-risk AI systems throughout
  their lifetime, and which allow the provider to evaluate the continuous compliance
  of AI systems with the requirements set out in Chapter III, Section 2. Where relevant,
  post-market monitoring shall include an analysis of the interaction with other AI
  systems. This obligation shall not cover sensitive operational data of deployers
  which are law-enforcement authorities.
elementType: control
