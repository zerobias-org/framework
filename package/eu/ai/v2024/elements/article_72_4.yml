name: Article 72.4
description: "For high-risk AI systems covered by the Union harmonisation legislation\
  \ listed in Section A of Annex I, where a post-market monitoring system and plan\
  \ are already established under that legislation, in order to ensure consistency,\
  \ avoid duplications and minimise additional burdens, providers shall have a choice\
  \ of integrating, as appropriate, the necessary elements described in paragraphs\
  \ 1, 2 and 3 using the template referred in paragraph 3 into systems and plans already\
  \ existing under that legislation, provided that it achieves an equivalent level\
  \ of protection. \r\n\r\nThe first subparagraph of this paragraph shall also apply\
  \ to high-risk AI systems referred to in point 5 of Annex III placed on the market\
  \ or put into service by financial institutions that are subject to requirements\
  \ under Union financial services law regarding their internal governance, arrangements\
  \ or processes."
elementType: control
