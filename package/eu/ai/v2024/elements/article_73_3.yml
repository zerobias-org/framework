id: ac62bf8e-e063-4d9a-a997-8f818cb5fc62
externalId: Article 73.3
name: Article 73.3
description: Notwithstanding paragraph 2 of this Article, in the event of a
  widespread infringement or a serious incident as defined in Article 3, point
  (49)(b), the report referred to in paragraph 1 of this Article shall be
  provided immediately, and not later than two days after the provider or, where
  applicable, the deployer becomes aware of that incident.
elementType: control
