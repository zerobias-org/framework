name: Article 23.6
description: Importers shall provide the relevant competent authorities, upon a reasoned
  request, with all the necessary information and documentation, including that referred
  to in paragraph 5, to demonstrate the conformity of a high-risk AI system with the
  requirements set out in Section 2 in a language which can be easily understood by
  them. For this purpose, they shall also ensure that the technical documentation
  can be made available to those authorities.
