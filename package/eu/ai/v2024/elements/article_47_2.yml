id: 5f5e4c28-ca80-414c-a770-5cc26663bdd0
externalId: Article 47.2
name: Article 47.2
description: The EU declaration of conformity shall state that the high-risk AI
  system concerned meets the requirements set out in Section 2. The EU
  declaration of conformity shall contain the information set out in Annex V,
  and shall be translated into a language that can be easily understood by the
  national competent authorities of the Member States in which the high-risk AI
  system is placed on the market or made available.
elementType: control
