name: Article 8.2
description: Where a product contains an AI system, to which the requirements of this
  Regulation as well as requirements of the Union harmonisation legislation listed
  in Section A of Annex I apply, providers shall be responsible for ensuring that
  their product is fully compliant with all applicable requirements under applicable
  Union harmonisation legislation. In ensuring the compliance of high-risk AI systems
  referred to in paragraph 1 with the requirements set out in this Section, and in
  order to ensure consistency, avoid duplication and minimise additional burdens,
  providers shall have a choice of integrating, as appropriate, the necessary testing
  and reporting processes, information and documentation they provide with regard
  to their product into documentation and procedures that already exist and are required
  under the Union harmonisation legislation listed in Section A of Annex I.
elementType: control
