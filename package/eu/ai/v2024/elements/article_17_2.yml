name: Article 17.2
description: The implementation of the aspects referred to in paragraph 1 shall be
  proportionate to the size of the provider’s organisation. Providers shall, in any
  event, respect the degree of rigour and the level of protection required to ensure
  the compliance of their high-risk AI systems with this Regulation
