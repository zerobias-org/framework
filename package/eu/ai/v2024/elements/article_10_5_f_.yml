externalId: Article 10.5(f)
name: Article 10.5(f)
description: the records of processing activities pursuant to Regulations (EU)
  2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680 include the reasons
  why the processing of special categories of personal data was strictly
  necessary to detect and correct biases, and why that objective could not be
  achieved by processing other data.
