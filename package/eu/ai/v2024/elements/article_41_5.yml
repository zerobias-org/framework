id: 66feef56-32a2-46c4-a70a-b37c6dcda800
externalId: Article 41.5
name: Article 41.5
description: Where providers of high-risk AI systems or general-purpose AI
  models do not comply with the common specifications referred to in paragraph
  1, they shall duly justify that they have adopted technical solutions that
  meet the requirements referred to in Section 2 of this Chapter or, as
  applicable, comply with the obligations set out in Sections 2 and 3 of Chapter
  V to a level at least equivalent thereto.
elementType: control
