id: c7dfcdcc-0f9f-4758-ac5d-e34b4d477398
externalId: Article 9.4
name: Article 9.4
description: The risk management measures referred to in paragraph 2, point (d),
  shall give due consideration to the effects and possible interaction resulting
  from the combined application of the requirements set out in this Section,
  with a view to minimising risks more effectively while achieving an
  appropriate balance in implementing the measures to fulfil those requirements.
elementType: control
