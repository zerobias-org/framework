name: Article 9.4
description: The risk management measures referred to in paragraph 2, point (d), shall
  give due consideration to the effects and possible interaction resulting from the
  combined application of the requirements set out in this Section, with a view to
  minimising risks more effectively while achieving an appropriate balance in implementing
  the measures to fulfil those requirements.
