name: Article 52.2
description: The provider of a general-purpose AI model that meets the condition referred
  to in Article 51(1), point (a), may present, with its notification, sufficiently
  substantiated arguments to demonstrate that, exceptionally, although it meets that
  requirement, the general-purpose AI model does not present, due to its specific
  characteristics, systemic risks and therefore should not be classified as a general-purpose
  AI model with systemic risk.
