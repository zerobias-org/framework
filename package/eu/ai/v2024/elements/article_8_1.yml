name: Article 8.1
description: High-risk AI systems shall comply with the requirements laid down in
  this Section, taking into account their intended purpose as well as the generally
  acknowledged state of the art on AI and AI-related technologies. The risk management
  system referred to in Article 9 shall be taken into account when ensuring compliance
  with those requirements.
