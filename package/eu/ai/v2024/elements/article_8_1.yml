id: c633013e-5a1f-426f-b5c0-b1b8c6be7076
externalId: Article 8.1
name: Article 8.1
description: High-risk AI systems shall comply with the requirements laid down
  in this Section, taking into account their intended purpose as well as the
  generally acknowledged state of the art on AI and AI-related technologies. The
  risk management system referred to in Article 9 shall be taken into account
  when ensuring compliance with those requirements.
elementType: control
