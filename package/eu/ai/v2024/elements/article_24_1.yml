name: Article 24.1
description: Before making a high-risk AI system available on the market, distributors
  shall verify that it bears the required CE marking, that it is accompanied by a
  copy of the EU declaration of conformity referred to in Article 47 and instructions
  for use, and that the provider and the importer of that system, as applicable, have
  complied with their respective obligations as laid down in Article 16, points (b)
  and (c) and Article 23(3).
