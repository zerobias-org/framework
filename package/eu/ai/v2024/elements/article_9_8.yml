id: 2b0980af-90c9-4812-9cc9-9eb6f7f91186
externalId: Article 9.8
name: Article 9.8
description: The testing of high-risk AI systems shall be performed, as
  appropriate, at any time throughout the development process, and, in any
  event, prior to their being placed on the market or put into service. Testing
  shall be carried out against prior defined metrics and probabilistic
  thresholds that are appropriate to the intended purpose of the high-risk AI
  system.
elementType: control
