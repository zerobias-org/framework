id: 918c1163-a3a7-4b41-9aa7-27788f962af5
externalId: Article 55.2
name: Article 55.2
description: Providers of general-purpose AI models with systemic risk may rely
  on codes of practice within the meaning of Article 56 to demonstrate
  compliance with the obligations set out in paragraph 1 of this Article, until
  a harmonised standard is published. Compliance with European harmonised
  standards grants providers the presumption of conformity to the extent that
  those standards cover those obligations. Providers of general-purpose AI
  models with systemic risks who do not adhere to an approved code of practice
  or do not comply with a European harmonised standard shall demonstrate
  alternative adequate means of compliance for assessment by the Commission.
elementType: control
