id: 39edf9c3-7520-4c4c-a8b0-a8c0d394a65b
externalId: Article 27.4
name: Article 27.4
description: If any of the obligations laid down in this Article is already met
  through the data protection impact assessment conducted pursuant to Article 35
  of Regulation (EU) 2016/679 or Article 27 of Directive (EU) 2016/680, the
  fundamental rights impact assessment referred to in paragraph 1 of this
  Article shall complement that data protection impact assessment.
elementType: control
