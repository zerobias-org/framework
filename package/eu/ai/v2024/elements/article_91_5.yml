id: 2ca93221-0a65-4ecf-b3cb-3c8b6a1a03d9
externalId: Article 91.5
name: Article 91.5
description: The provider of the general-purpose AI model concerned, or its
  representative shall supply the information requested. In the case of legal
  persons, companies or firms, or where the provider has no legal personality,
  the persons authorised to represent them by law or by their statutes, shall
  supply the information requested on behalf of the provider of the
  general-purpose AI model concerned. Lawyers duly authorised to act may supply
  information on behalf of their clients. The clients shall nevertheless remain
  fully responsible if the information supplied is incomplete, incorrect or
  misleading.
elementType: control
