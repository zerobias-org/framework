name: Article 60.1
description: "Testing of high-risk AI systems in real world conditions outside AI\
  \ regulatory sandboxes may be conducted by providers or prospective providers of\
  \ high-risk AI systems listed in Annex III, in accordance with this Article and\
  \ the real-world testing plan referred to in this Article, without prejudice to\
  \ the prohibitions under Article 5. \r\n\r\nThe Commission shall, by means of implementing\
  \ acts, specify the detailed elements of the real-world testing plan. Those implementing\
  \ acts shall be adopted in accordance with the examination procedure referred to\
  \ in Article 98(2). \r\n\r\nThis paragraph shall be without prejudice to Union or\
  \ national law on the testing in real world conditions of high-risk AI systems related\
  \ to products covered by Union harmonisation legislation listed in Annex I."
elementType: control
