id: dfa209af-d0d0-43b2-b7f7-a179bcb641c7
externalId: Article 23.7
name: Article 23.7
description: Importers shall cooperate with the relevant competent authorities
  in any action those authorities take in relation to a high-risk AI system
  placed on the market by the importers, in particular to reduce and mitigate
  the risks posed by it.
elementType: control
