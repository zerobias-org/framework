id: 9322e4fe-53ec-4e44-a183-96dca13ab028
externalId: Article 82.2
name: Article 82.2
description: The provider or other relevant operator shall ensure that
  corrective action is taken in respect of all the AI systems concerned that it
  has made available on the Union market within the timeline prescribed by the
  market surveillance authority of the Member State referred to in paragraph 1.
elementType: control
