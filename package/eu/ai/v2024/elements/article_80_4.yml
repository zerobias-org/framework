name: Article 80.4
description: The provider shall ensure that all necessary action is taken to bring
  the AI system into compliance with the requirements and obligations laid down in
  this Regulation. Where the provider of an AI system concerned does not bring the
  AI system into compliance with those requirements and obligations within the period
  referred to in paragraph 2 of this Article, the provider shall be subject to fines
  in accordance with Article 99.
elementType: control
