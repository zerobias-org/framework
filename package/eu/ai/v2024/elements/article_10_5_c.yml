name: Article 10.5(c)
description: the special categories of personal data are subject to measures to ensure
  that the personal data processed are secured, protected, subject to suitable safeguards,
  including strict controls and documentation of the access, to avoid misuse and ensure
  that only authorised persons have access to those personal data with appropriate
  confidentiality obligations;
