id: 90b3c3f8-cf3f-42a5-a500-fbc21a74ede2
externalId: Article 73.2
name: Article 73.2
description: "The report referred to in paragraph 1 shall be made immediately
  after the provider has established a causal link between the AI system and the
  serious incident or the reasonable likelihood of such a link, and, in any
  event, not later than 15 days after the provider or, where applicable, the
  deployer, becomes aware of the serious incident.  \r

  \r

  The period for the reporting referred to in the first subparagraph shall take
  account of the severity of the serious incident."
elementType: control
