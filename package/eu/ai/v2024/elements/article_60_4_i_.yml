id: 1f0023c3-3bca-4212-92aa-84a039e91dbf
externalId: Article 60.4(i)
name: Article 60.4(i)
description: the subjects of the testing in real world conditions have given
  informed consent in accordance with Article 61, or in the case of law
  enforcement, where the seeking of informed consent would prevent the AI system
  from being tested, the testing itself and the outcome of the testing in the
  real world conditions shall not have any negative effect on the subjects, and
  their personal data shall be deleted after the test is performed;
elementType: control
