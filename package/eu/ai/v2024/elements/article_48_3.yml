name: Article 48.3
description: The CE marking shall be affixed visibly, legibly and indelibly for high-risk
  AI systems. Where that is not possible or not warranted on account of the nature
  of the high-risk AI system, it shall be affixed to the packaging or to the accompanying
  documentation, as appropriate.
