name: Article 6.3
description: "By derogation from paragraph 2, an AI system referred to in Annex III\
  \ shall not be considered to be high-risk where it does not pose a significant risk\
  \ of harm to the health, safety or fundamental rights of natural persons, including\
  \ by not materially influencing the outcome of decision making.   The first subparagraph\
  \ shall apply where any of the following conditions is fulfilled:    \r\n\r\nEnd\
  \ - Notwithstanding the first subparagraph, an AI system referred to in Annex III\
  \ shall always be considered to be high-risk where the AI system performs profiling\
  \ of natural persons."
elementType: control
