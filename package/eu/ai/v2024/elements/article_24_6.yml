id: ac280a69-d5ed-4c35-9a61-1e4e8ef64ade
externalId: Article 24.6
name: Article 24.6
description: Distributors shall cooperate with the relevant competent
  authorities in any action those authorities take in relation to a high-risk AI
  system made available on the market by the distributors, in particular to
  reduce or mitigate the risk posed by it.
elementType: control
