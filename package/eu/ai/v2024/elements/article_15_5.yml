name: Article 15.5
description: "High-risk AI systems shall be resilient against attempts by unauthorised\
  \ third parties to alter their use, outputs or performance by exploiting system\
  \ vulnerabilities. \r\n\r\nThe technical solutions aiming to ensure the cybersecurity\
  \ of high-risk AI systems shall be appropriate to the relevant circumstances and\
  \ the risks. \r\n\r\nThe technical solutions to address AI specific vulnerabilities\
  \ shall include, where appropriate, measures to prevent, detect, respond to, resolve\
  \ and control for attacks trying to manipulate the training data set (data poisoning),\
  \ or pre-trained components used in training (model poisoning), inputs designed\
  \ to cause the AI model to make a mistake (adversarial examples or model evasion),\
  \ confidentiality attacks or model flaws."
elementType: control
