externalId: Article 27.3
name: Article 27.3
description: Once the assessment referred to in paragraph 1 of this Article has
  been performed, the deployer shall notify the market surveillance authority of
  its results, submitting the filled-out template referred to in paragraph 5 of
  this Article as part of the notification. In the case referred to in Article
  46(1), deployers may be exempt from that obligation to notify
elementType: control
