id: 94744b70-bc8f-4629-84d7-0223c245bcc1
externalId: Article 24.2
name: Article 24.2
description: Where a distributor considers or has reason to consider, on the
  basis of the information in its possession, that a high-risk AI system is not
  in conformity with the requirements set out in Section 2, it shall not make
  the high-risk AI system available on the market until the system has been
  brought into conformity with those requirements. Furthermore, where the
  high-risk AI system presents a risk within the meaning of Article 79(1), the
  distributor shall inform the provider or the importer of the system, as
  applicable, to that effect.
elementType: control
