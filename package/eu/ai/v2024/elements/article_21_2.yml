externalId: Article 21.2
name: Article 21.2
description: Upon a reasoned request by a competent authority, providers shall
  also give the requesting competent authority, as applicable, access to the
  automatically generated logs of the high-risk AI system referred to in Article
  12(1), to the extent such logs are under their control.
elementType: control
