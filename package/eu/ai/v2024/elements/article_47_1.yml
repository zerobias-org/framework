name: Article 47.1
description: The provider shall draw up a written machine readable, physical or electronically
  signed EU declaration of conformity for each high-risk AI system, and keep it at
  the disposal of the national competent authorities for 10 years after the high-risk
  AI system has been placed on the market or put into service. The EU declaration
  of conformity shall identify the high-risk AI system for which it has been drawn
  up. A copy of the EU declaration of conformity shall be submitted to the relevant
  national competent authorities upon request.
