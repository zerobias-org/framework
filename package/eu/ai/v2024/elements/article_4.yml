id: a5f2f3df-dccd-414f-a74f-0828e1c2273c
externalId: Article 4
name: AI literacy
description: Providers and deployers of AI systems shall take measures to
  ensure, to their best extent, a sufficient level of AI literacy of their staff
  and other persons dealing with the operation and use of AI systems on their
  behalf, taking into account their technical knowledge, experience, education
  and training and the context the AI systems are to be used in, and considering
  the persons or groups of persons on whom the AI systems are to be used.
elementType: control
