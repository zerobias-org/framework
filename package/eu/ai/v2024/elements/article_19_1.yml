name: Article 19.1
description: Providers of high-risk AI systems shall keep the logs referred to in
  Article 12(1), automatically generated by their high-risk AI systems, to the extent
  such logs are under their control. Without prejudice to applicable Union or national
  law, the logs shall be kept for a period appropriate to the intended purpose of
  the high-risk AI system, of at least six months, unless provided otherwise in the
  applicable Union or national law, in particular in Union law on the protection of
  personal data.
elementType: control
