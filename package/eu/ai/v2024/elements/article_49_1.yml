id: 1ae52895-51f1-47ca-938c-22479b19ac93
externalId: Article 49.1
name: Article 49.1
description: Before placing on the market or putting into service a high-risk AI
  system listed in Annex III, with the exception of high-risk AI systems
  referred to in point 2 of Annex III, the provider or, where applicable, the
  authorised representative shall register themselves and their system in the EU
  database referred to in Article 71.
elementType: control
