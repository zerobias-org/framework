id: 42c546bb-1eab-4060-aa01-243cad167a28
externalId: Article 22.3(c)
name: Article 22.3(c)
description: provide a competent authority, upon a reasoned request, with all
  the information and documentation, including that referred to in point (b) of
  this subparagraph, necessary to demonstrate the conformity of a high-risk AI
  system with the requirements set out in Section 2, including access to the
  logs, as referred to in Article 12(1), automatically generated by the
  high-risk AI system, to the extent such logs are under the control of the
  provider;
elementType: control
