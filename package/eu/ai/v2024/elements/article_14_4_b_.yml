name: Article 14.4(b)
description: to remain aware of the possible tendency of automatically relying
  or over-relying on the output produced by a high-risk AI system (automation
  bias), in particular for high-risk AI systems used to provide information or
  recommendations for decisions to be taken by natural persons;
