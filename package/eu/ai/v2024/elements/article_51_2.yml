externalId: Article 51.2
name: Article 51.2
description: A general-purpose AI model shall be presumed to have high impact
  capabilities pursuant to paragraph 1, point (a), when the cumulative amount of
  computation used for its training measured in floating point operations is
  greater than 1025.
elementType: control
