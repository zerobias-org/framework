id: 97a4f58a-fbcf-491f-abb5-cc09ec7f5da0
externalId: Article 26.6
name: Article 26.6
description: "Deployers of high-risk AI systems shall keep the logs
  automatically generated by that high-risk AI system to the extent such logs
  are under their control, for a period appropriate to the intended purpose of
  the high-risk AI system, of at least six months, unless provided otherwise in
  applicable Union or national law, in particular in Union law on the protection
  of personal data. \r

  \r

  Deployers that are financial institutions subject to requirements regarding
  their internal governance, arrangements or processes under Union financial
  services law shall maintain the logs as part of the documentation kept
  pursuant to the relevant Union financial service law"
elementType: control
