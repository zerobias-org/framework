name: Article 26.7
description: Before putting into service or using a high-risk AI system at the workplace,
  deployers who are employers shall inform workers’ representatives and the affected
  workers that they will be subject to the use of the high-risk AI system. This information
  shall be provided, where applicable, in accordance with the rules and procedures
  laid down in Union and national law and practice on information of workers and their
  representatives.
