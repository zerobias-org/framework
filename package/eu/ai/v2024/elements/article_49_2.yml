id: 76f10b5e-47ac-4b1c-8b74-a84f51135db7
externalId: Article 49.2
name: Article 49.2
description: Before placing on the market or putting into service an AI system
  for which the provider has concluded that it is not high-risk according to
  Article 6(3), that provider or, where applicable, the authorised
  representative shall register themselves and that system in the EU database
  referred to in Article 71.
elementType: control
