name: Article 25.4
description: "The provider of a high-risk AI system and the third party that supplies\
  \ an AI system, tools, services, components, or processes that are used or integrated\
  \ in a high-risk AI system shall, by written agreement, specify the necessary information,\
  \ capabilities, technical access and other assistance based on the generally acknowledged\
  \ state of the art, in order to enable the provider of the high-risk AI system to\
  \ fully comply with the obligations set out in this Regulation. This paragraph shall\
  \ not apply to third parties making accessible to the public tools, services, processes,\
  \ or components, other than general-purpose AI models, under a free and open-source\
  \ licence. \r\n\r\nThe AI Office may develop and recommend voluntary model terms\
  \ for contracts between providers of high-risk AI systems and third parties that\
  \ supply tools, services, components or processes that are used for or integrated\
  \ into high-risk AI systems. When developing those voluntary model terms, the AI\
  \ Office shall take into account possible contractual requirements applicable in\
  \ specific sectors or business cases. The voluntary model terms shall be published\
  \ and be available free of charge in an easily usable electronic format."
