name: Article 20.2
description: Where the high-risk AI system presents a risk within the meaning of Article
  79(1) and the provider becomes aware of that risk, it shall immediately investigate
  the causes, in collaboration with the reporting deployer, where applicable, and
  inform the market surveillance authorities competent for the high-risk AI system
  concerned and, where applicable, the notified body that issued a certificate for
  that high-risk AI system in accordance with Article 44, in particular, of the nature
  of the non-compliance and of any relevant corrective action taken.
elementType: control
