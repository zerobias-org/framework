externalId: Article 50.5
name: Article 50.5
description: The information referred to in paragraphs 1 to 4 shall be provided
  to the natural persons concerned in a clear and distinguishable manner at the
  latest at the time of the first interaction or exposure. The information shall
  conform to the applicable accessibility requirements.
