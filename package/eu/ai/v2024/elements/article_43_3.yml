name: Article 43.3
description: "For high-risk AI systems covered by the Union harmonisation legislation\
  \ listed in Section A of Annex I, the provider shall follow the relevant conformity\
  \ assessment procedure as required under those legal acts. The requirements set\
  \ out in Section 2 of this Chapter shall apply to those high-risk AI systems and\
  \ shall be part of that assessment. Points 4.3., 4.4., 4.5. and the fifth paragraph\
  \ of point 4.6 of Annex VII shall also apply. \r\n\r\nFor the purposes of that assessment,\
  \ notified bodies which have been notified under those legal acts shall be entitled\
  \ to control the conformity of the high-risk AI systems with the requirements set\
  \ out in Section 2, provided that the compliance of those notified bodies with requirements\
  \ laid down in Article 31(4), (5), (10) and (11) has been assessed in the context\
  \ of the notification procedure under those legal acts. \r\n\r\nWhere a legal act\
  \ listed in Section A of Annex I enables the product manufacturer to opt out from\
  \ a third-party conformity assessment, provided that that manufacturer has applied\
  \ all harmonised standards covering all the relevant requirements, that manufacturer\
  \ may use that option only if it has also applied harmonised standards or, where\
  \ applicable, common specifications referred to in Article 41, covering all requirements\
  \ set out in Section 2 of this Chapter."
elementType: control
