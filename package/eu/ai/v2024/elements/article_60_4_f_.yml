id: 8de1729e-bdfd-44a0-8ffc-8317796511e6
externalId: Article 60.4(f)
name: Article 60.4(f)
description: the testing in real world conditions does not last longer than
  necessary to achieve its objectives and in any case not longer than six
  months, which may be extended for an additional period of six months, subject
  to prior notification by the provider or prospective provider to the market
  surveillance authority, accompanied by an explanation of the need for such an
  extension;
elementType: control
