name: Article 60.2
description: Providers or prospective providers may conduct testing of high-risk
  AI systems referred to in Annex III in real world conditions at any time
  before the placing on the market or the putting into service of the AI system
  on their own or in partnership with one or more deployers or prospective
  deployers.
