id: b5cf371a-be51-47bc-ad71-aa72091556a0
externalId: Article 24.5
name: Article 24.5
description: Upon a reasoned request from a relevant competent authority,
  distributors of a high-risk AI system shall provide that authority with all
  the information and documentation regarding their actions pursuant to
  paragraphs 1 to 4 necessary to demonstrate the conformity of that system with
  the requirements set out in Section 2.
elementType: control
