externalId: Article 22.3
name: Article 22.3
description: "The authorised representative shall perform the tasks specified in
  the mandate received from the provider. It shall provide a copy of the mandate
  to the market surveillance authorities upon request, in one of the official
  languages of the institutions of the Union, as indicated by the competent
  authority. For the purposes of this Regulation, the mandate shall empower the
  authorised representative to carry out the following tasks:  \r

  \r

  End - The mandate shall empower the authorised representative to be addressed,
  in addition to or instead of the provider, by the competent authorities, on
  all issues related to ensuring compliance with this Regulation."
elementType: control
