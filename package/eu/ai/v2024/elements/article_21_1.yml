id: bb5006f8-6d02-4064-b0c4-93175ead2812
externalId: Article 21.1
name: Article 21.1
description: Providers of high-risk AI systems shall, upon a reasoned request by
  a competent authority, provide that authority all the information and
  documentation necessary to demonstrate the conformity of the high-risk AI
  system with the requirements set out in Section 2, in a language which can be
  easily understood by the authority in one of the official languages of the
  institutions of the Union as indicated by the Member State concerned.
elementType: control
