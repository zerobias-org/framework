name: Article 14.5
description: "For high-risk AI systems referred to in point 1(a) of Annex III, the\
  \ measures referred to in paragraph 3 of this Article shall be such as to ensure\
  \ that, in addition, no action or decision is taken by the deployer on the basis\
  \ of the identification resulting from the system unless that identification has\
  \ been separately verified and confirmed by at least two natural persons with the\
  \ necessary competence, training and authority. \r\n\r\nThe requirement for a separate\
  \ verification by at least two natural persons shall not apply to high-risk AI systems\
  \ used for the purposes of law enforcement, migration, border control or asylum,\
  \ where Union or national law considers the application of this requirement to be\
  \ disproportionate."
elementType: control
