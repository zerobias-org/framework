name: Annex 6 Module H.5.1
description: The manufacturer shall affix the CE marking, and, under the
  responsibility of the notified body referred to in point 3.1, the latter's
  identification number to each individual product that satisfies the
  requirements set out in Section 1 of Annex I to this Regulation.
