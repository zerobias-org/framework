externalId: Annex 6 Module H.6
name: Annex 6 Module H.6
description: "The manufacturer shall, for a period ending at least 10 years
  after the product has been placed on the market, keep at the disposal of the
  national authorities:\r

  \ - the technical documentation referred to in point 3.1;\r

  \ - the documentation concerning the quality system referred to in point
  3.1;\r

  \ - the change referred to in point 3.5, as approved;\r

  \ - the decisions and reports of the notified body referred to in points 3.5,
  4.3 and 4.4."
elementType: control
