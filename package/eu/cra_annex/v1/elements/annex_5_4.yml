id: a937ddc5-042a-4d12-a416-1d99332137b0
externalId: Annex 5.4
name: Annex 5.4
description: a list of the harmonised standards applied in full or in part the
  references of which have been published in the Official Journal of the
  European Union, common specifications as set out in Article 19 of this
  Regulation or cybersecurity certification schemes under Regulation (EU)
  2019/881 pursuant to Article 18(3), and, where those harmonised standards,
  common specifications or cybersecurity certification schemes have not been
  applied, descriptions of the solutions adopted to meet the essential
  requirements set out in Sections 1 and 2 of Annex I, including a list of other
  relevant technical specifications applied. In the event of partly applied
  harmonised standards, common specifications or cybersecurity certifications,
  the technical documentation shall specify the parts which have been applied;
elementType: control
