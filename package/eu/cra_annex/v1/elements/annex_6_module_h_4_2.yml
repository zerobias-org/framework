id: 4f70021e-78f3-4bfd-8432-1c8ceb2ed849
externalId: Annex 6 Module H.4.2
name: Annex 6 Module H.4.2
description: "The manufacturer shall, for assessment purposes, allow the
  notified body access to the design, development, production, inspection,
  testing and storage sites, and shall provide it with all necessary
  information, in particular:\r

  \ - the quality system documentation;\r

  \ - the quality records as provided for by the design part of the quality
  system, such as results of analyses, calculations, tests, etc.;\r

  \ - the quality records as provided for by the manufacturing part of the
  quality system, such as inspection reports and test data, calibration data,
  qualification reports on the personnel concerned, etc."
elementType: control
