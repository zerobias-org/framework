id: 8e6a9079-f976-49a0-91ae-3443678a0d9c
externalId: Annex 6 Module A.4.2
name: Annex 6 Module A.4.2
description: The manufacturer shall draw up a written EU declaration of
  conformity for each product with digital elements in accordance with Article
  20 and keep it together with the technical documentation at the disposal of
  the national authorities for 10 years after the product with digital elements
  has been placed on the market. The EU declaration of conformity shall identify
  the product with digital elements for which it has been drawn up. A copy of
  the EU declaration of conformity shall be made available to the relevant
  authorities upon request.
elementType: control
