id: 3945b5e4-f379-46c7-a4a9-aec935751ba3
externalId: Annex 6 Module H.2
name: Annex 6 Module H.2
description: "Design, development, production and vulnerability handling of
  products with digital elements.\r

  \r

  The manufacturer shall operate an approved quality system as specified in
  point 3 for the design, development, and production of the products concerned
  and for handling vulnerabilities, maintain its effectiveness throughout the
  lifecycle of the products concerned, and shall be subject to surveillance as
  specified in point 4."
elementType: control
