id: d6b640ba-195b-4a7e-9d73-cd0342cdd26f
externalId: Annex 6 Module A.3
name: Annex 6 Module A.3
description: "Design, development, production and vulnerability handling of
  products with digital elements.\r

  \r

  The manufacturer shall take all measures necessary so that the design,
  development, production and vulnerability handling processes and their
  monitoring ensure compliance of the manufactured or developed products with
  digital elements and of the processes put in place by the manufacturer with
  the essential requirements set out in sections 1 and 2 of Annex I."
elementType: control
