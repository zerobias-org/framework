id: 8dbf8d8f-3076-46c2-9cfe-862a0879dd6b
externalId: Annex 6 Module H.3.5
name: Annex 6 Module H.3.5
description: The manufacturer shall keep the notified body that has approved the
  quality system informed of any intended change to the quality system. The
  notified body shall evaluate any proposed changes and decide whether the
  modified quality system will continue to satisfy the requirements referred to
  in point 3.2 or whether a reassessment is necessary. It shall notify the
  manufacturer of its decision. The notification shall contain the conclusions
  of the examination and the reasoned assessment decision.
elementType: control
