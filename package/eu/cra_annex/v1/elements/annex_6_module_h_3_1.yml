externalId: Annex 6 Module H.3.1
name: Annex 6 Module H.3.1
description: "The manufacturer shall lodge an application for assessment of his
  quality system with the notified body of his choice, for the products
  concerned. \r

  \r

  The application shall include:\r

  \ - the name and address of the manufacturer and, if the application is lodged
  by the authorised representative, his name and address as well;\r

  \ - the technical documentation for one model of each category of products
  intended to be manufactured or developed. The technical documentation shall,
  wherever applicable, contain at least the elements as set out in Annex V;\r

  \ - the documentation concerning the quality system; and\r

  \ - a written declaration that the same application has not been lodged with
  any other notified body."
elementType: control
