id: 3d892562-7f46-48ad-ba9a-76f41db6bb6f
externalId: Article 45.2
name: Article 45.2
description: For the purpose of paragraph 1, point (c), the information-sharing
  arrangements shall define the conditions for participation and, where
  appropriate, shall set out the details on the involvement of public
  authorities and the capacity in which they may be associated to the
  information-sharing arrangements, on the involvement of ICT third-party
  service providers, and on operational elements, including the use of dedicated
  IT platforms.
elementType: control
