id: 4b635228-4e3e-4f44-8f70-ec1f20792e5b
externalId: Article 11.7
name: Article 11.7
description: Financial entities, other than microenterprises, shall have a
  crisis management function, which, in the event of activation of their ICT
  business continuity plans or ICT response and recovery plans, shall, inter
  alia, set out clear procedures to manage internal and external crisis
  communications in accordance with Article 14.
elementType: control
