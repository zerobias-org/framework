id: 4e9ab289-d202-4cfd-8355-585ee3328bd6
externalId: Article 9.2
name: Article 9.2
description: Financial entities shall design, procure and implement ICT security
  policies, procedures, protocols and tools that aim to ensure the resilience,
  continuity and availability of ICT systems, in particular for those supporting
  critical or important functions, and to maintain high standards of
  availability, authenticity, integrity and confidentiality of data, whether at
  rest, in use or in transit.
elementType: control
