id: efffc745-c45c-4835-9463-a50e9e7c1543
externalId: Article 17.2
name: Article 17.2
description: Financial entities shall record all ICT-related incidents and
  significant cyber threats. Financial entities shall establish appropriate
  procedures and processes to ensure a consistent and integrated monitoring,
  handling and follow-up of ICT- related incidents, to ensure that root causes
  are identified, documented and addressed in order to prevent the occurrence of
  such incidents.
elementType: control
