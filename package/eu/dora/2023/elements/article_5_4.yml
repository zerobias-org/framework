id: 3b75015a-1310-402f-b056-cb5930ce03e2
externalId: Article 5.4
name: Article 5.4
description: Members of the management body of the financial entity shall
  actively keep up to date with sufficient knowledge and skills to understand
  and assess ICT risk and its impact on the operations of the financial entity,
  including by following specific training on a regular basis, commensurate to
  the ICT risk being managed.
elementType: control
