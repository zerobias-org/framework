id: 2c7f8494-4561-4bed-b2d5-5ce2c291c088
externalId: Article 24.1
name: Article 24.1
description: For the purpose of assessing preparedness for handling ICT-related
  incidents, of identifying weaknesses, deficiencies and gaps in digital
  operational resilience, and of promptly implementing corrective measures,
  financial entities, other than microenterprises, shall, taking into account
  the criteria set out in Article 4(2), establish, maintain and review a sound
  and comprehensive digital operational resilience testing programme as an
  integral part of the ICT risk-management framework referred to in Article 6.
elementType: control
