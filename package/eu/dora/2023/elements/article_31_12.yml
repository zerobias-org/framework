id: 289a49f9-6924-434e-8534-70295e51db96
externalId: Article 31.12
name: Article 31.12
description: Financial entities shall only make use of the services of an ICT
  third-party service provider established in a third country and which has been
  designated as critical in accordance with paragraph 1, point (a), if the
  latter has established a subsidiary in the Union within the 12 months
  following the designation.
elementType: control
