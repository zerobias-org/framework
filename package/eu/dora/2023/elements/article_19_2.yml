id: d67f5b09-b978-4f6c-a792-3fde9272318c
externalId: Article 19.2
name: Article 19.2
description: "Financial entities may, on a voluntary basis, notify significant
  cyber threats to the relevant competent authority when they deem the threat to
  be of relevance to the financial system, service users or clients. The
  relevant competent authority may provide such information to other relevant
  authorities referred to in paragraph 6.\r

  \r

  Credit institutions classified as significant, in accordance with Article 6(4)
  of Regulation (EU) No 1024/2013, may, on a voluntary basis, notify significant
  cyber threats to relevant national competent authority, designated in
  accordance with Article 4 of Directive 2013/36/EU, which shall immediately
  transmit the notification to the ECB.\r

  \r

  Member States may determine that those financial entities that on a voluntary
  basis notify in accordance with the first subparagraph may also transmit that
  notification to the CSIRTs designated or established in accordance with
  Directive (EU) 2022/2555."
elementType: control
