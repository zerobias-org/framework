id: f122eaca-790e-47de-b8c1-ab2ccdebec52
externalId: Article 25.3
name: Article 25.3
description: Microenterprises shall perform the tests referred to in paragraph 1
  by combining a risk-based approach with a strategic planning of ICT testing,
  by duly considering the need to maintain a balanced approach between the scale
  of resources and the time to be allocated to the ICT testing provided for in
  this Article, on the one hand, and the urgency, type of risk, criticality of
  information assets and of services provided, as well as any other relevant
  factor, including the financial entity’s ability to take calculated risks, on
  the other hand.
elementType: control
