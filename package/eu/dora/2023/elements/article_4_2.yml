externalId: Article 4.2
name: Article 4.2
description: In addition, the application by financial entities of Chapters III,
  IV and V, Section I, shall be proportionate to their size and overall risk
  profile, and to the nature, scale and complexity of their services, activities
  and operations, as specifically provided for in the relevant rules of those
  Chapters.
