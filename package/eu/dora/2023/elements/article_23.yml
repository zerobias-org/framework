externalId: Article 23
name: Article 23
description: The requirements laid down in this Chapter shall also apply to
  operational or security payment-related incidents and to major operational or
  security payment-related incidents, where they concern credit institutions,
  payment institutions, account information service providers, and electronic
  money institutions.
