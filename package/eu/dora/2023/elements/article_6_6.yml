id: 0b80707b-a1ab-48e5-b2d5-f507a147be78
externalId: Article 6.6
name: Article 6.6
description: The ICT risk management framework of financial entities, other than
  microenterprises, shall be subject to internal audit by auditors on a regular
  basis in line with the financial entities’ audit plan. Those auditors shall
  possess sufficient knowledge, skills and expertise in ICT risk, as well as
  appropriate independence. The frequency and focus of ICT audits shall be
  commensurate to the ICT risk of the financial entity.
elementType: control
