id: 3ac50ff3-028b-4bc7-983e-4be4109d70af
externalId: Article 11.6 (end)
name: Article 11.6 (end)
description: "For the purposes of the first subparagraph, point (a), financial
  entities, other than microenterprises, shall include in the testing plans
  scenarios of cyber-attacks and switchovers between the primary ICT
  infrastructure and the redundant capacity, backups and redundant facilities
  necessary to meet the obligations set out in Article 12.\r

  \r

  Financial entities shall regularly review their ICT business continuity policy
  and ICT response and recovery plans, taking into account the results of tests
  carried out in accordance with the first subparagraph and recommendations
  stemming from audit checks or supervisory reviews."
elementType: control
