id: 30b13946-3415-45c4-b81c-7f08448af106
externalId: Article 12.7
name: Article 12.7
description: When recovering from an ICT-related incident, financial entities
  shall perform necessary checks, including any multiple checks and
  reconciliations, in order to ensure that the highest level of data integrity
  is maintained. These checks shall also be performed when reconstructing data
  from external stakeholders, in order to ensure that all data is consistent
  between systems.
elementType: control
