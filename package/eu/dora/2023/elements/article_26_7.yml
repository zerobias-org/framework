id: 35d8abde-3ebb-43a9-acac-f495f5185dae
externalId: Article 26.7
name: Article 26.7
description: "Authorities shall provide financial entities with an attestation
  confirming that the test was performed in accordance with the requirements as
  evidenced in the documentation in order to allow for mutual recognition of
  threat led penetration tests between competent authorities. The financial
  entity shall notify the relevant competent authority of the attestation, the
  summary of the relevant findings and the remediation plans.\r

  \r

  Without prejudice to such attestation, financial entities shall remain at all
  times fully responsible for the impact of the tests referred to in paragraph
  4."
elementType: control
