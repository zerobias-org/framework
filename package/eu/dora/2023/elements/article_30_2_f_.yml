id: 1134bd3b-692f-4e34-8dd4-806ca5123662
externalId: Article 30.2(f)
name: Article 30.2(f)
description: the obligation of the ICT third-party service provider to provide
  assistance to the financial entity at no additional cost, or at a cost that is
  determined ex-ante, when an ICT incident that is related to the ICT service
  provided to the financial entity occurs;
elementType: control
