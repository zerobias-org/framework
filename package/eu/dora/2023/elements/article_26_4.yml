id: 26cde5c4-7dfe-4945-bb2d-b59803e10830
externalId: Article 26.4
name: Article 26.4
description: "Without prejudice to paragraph 2, first and second subparagraphs,
  where the participation of an ICT third-party service provider in the TLPT,
  referred to in paragraph 3, is reasonably expected to have an adverse impact
  on the quality or security of services delivered by the ICT third-party
  service provider to customers that are entities falling outside the scope of
  this Regulation, or on the confidentiality of the data related to such
  services, the financial entity and the ICT third-party service provider may
  agree in writing that the ICT third-party service provider directly enters
  into contractual arrangements with an external tester, for the purpose of
  conducting, under the direction of one designated financial entity, a pooled
  TLPT involving several financial entities (pooled testing) to which the ICT
  third-party service provider provides ICT services.\r

  \r

  That pooled testing shall cover the relevant range of ICT services supporting
  critical or important functions contracted to the respective ICT third-party
  service provider by the financial entities. The pooled testing shall be
  considered TLPT carried out by the financial entities participating in the
  pooled testing.\r

  \r

  The number of financial entities participating in the pooled testing shall be
  duly calibrated taking into account the complexity and types of services
  involved."
elementType: control
