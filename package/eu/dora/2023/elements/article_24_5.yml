id: 65a156e2-16f2-4e9b-a1b4-949df5f6ece7
externalId: Article 24.5
name: Article 24.5
description: Financial entities, other than microenterprises, shall establish
  procedures and policies to prioritise, classify and remedy all issues revealed
  throughout the performance of the tests and shall establish internal
  validation methodologies to ascertain that all identified weaknesses,
  deficiencies or gaps are fully addressed.
elementType: control
