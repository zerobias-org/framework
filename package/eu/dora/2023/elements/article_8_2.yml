id: bf38b81a-d710-47e8-94d6-1f0135e10256
externalId: Article 8.2
name: Article 8.2
description: Financial entities shall, on a continuous basis, identify all
  sources of ICT risk, in particular the risk exposure to and from other
  financial entities, and assess cyber threats and ICT vulnerabilities relevant
  to their ICT supported business functions, information assets and ICT assets.
  Financial entities shall review on a regular basis, and at least yearly, the
  risk scenarios impacting them.
elementType: control
