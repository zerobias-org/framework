id: 1744038a-30e8-469d-88d6-a546972a1ae7
externalId: Article 26.5
name: Article 26.5
description: Financial entities shall, with the cooperation of ICT third-party
  service providers and other parties involved, including the testers but
  excluding the competent authorities, apply effective risk management controls
  to mitigate the risks of any potential impact on data, damage to assets, and
  disruption to critical or important functions, services or operations at the
  financial entity itself, its counterparts or to the financial sector.
elementType: control
