externalId: Article 8.3
name: Article 8.3
description: Financial entities, other than microenterprises, shall perform a
  risk assessment upon each major change in the network and information system
  infrastructure, in the processes or procedures affecting their ICT supported
  business functions, information assets or ICT assets.
elementType: control
