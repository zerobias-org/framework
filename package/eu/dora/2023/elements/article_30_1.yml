id: ed4a6f2e-5061-4dfa-aff1-557033492e73
externalId: Article 30.1
name: Article 30.1
description: The rights and obligations of the financial entity and of the ICT
  third-party service provider shall be clearly allocated and set out in
  writing. The full contract shall include the service level agreements and be
  documented in one written document which shall be available to the parties on
  paper, or in a document with another downloadable, durable and accessible
  format.
elementType: control
