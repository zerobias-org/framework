externalId: Article 28.8 (end)
name: Article 28.8 (end)
description: "Exit plans shall be comprehensive, documented and, in accordance
  with the criteria set out in Article 4(2), shall be sufficiently tested and
  reviewed periodically.\r

  \r

  Financial entities shall identify alternative solutions and develop transition
  plans enabling them to remove the contracted ICT services and the relevant
  data from the ICT third-party service provider and to securely and integrally
  transfer them to alternative providers or reincorporate them in-house.\r

  \r

  Financial entities shall have appropriate contingency measures in place to
  maintain business continuity in the event of the circumstances referred to in
  the first subparagraph."
elementType: control
