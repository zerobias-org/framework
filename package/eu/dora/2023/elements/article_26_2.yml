id: d0d279b7-6f09-426b-848f-c16ee86c8385
externalId: Article 26.2
name: Article 26.2
description: "Each threat-led penetration test shall cover several or all
  critical or important functions of a financial entity, and shall be performed
  on live production systems supporting such functions.\r

  \r

  Financial entities shall identify all relevant underlying ICT systems,
  processes and technologies supporting critical or important functions and ICT
  services, including those supporting the critical or important functions which
  have been outsourced or contracted to ICT third-party service providers.\r

  \r

  Financial entities shall assess which critical or important functions need to
  be covered by the TLPT. The result of this assessment shall determine the
  precise scope of TLPT and shall be validated by the competent authorities."
elementType: control
