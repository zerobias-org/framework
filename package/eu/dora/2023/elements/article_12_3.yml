id: 3be95f44-2fdf-4e81-9920-5aac6e852a3d
externalId: Article 12.3
name: Article 12.3
description: "When restoring backup data using own systems, financial entities
  shall use ICT systems that are physically and logically segregated from the
  source ICT system. The ICT systems shall be securely protected from any
  unauthorised access or ICT corruption and allow for the timely restoration of
  services making use of data and system backups as necessary.\r

  \r

  For central counterparties, the recovery plans shall enable the recovery of
  all transactions at the time of disruption to allow the central counterparty
  to continue to operate with certainty and to complete settlement on the
  scheduled date.\r

  \r

  Data reporting service providers shall additionally maintain adequate
  resources and have back-up and restoration facilities in place in order to
  offer and maintain their services at all times."
elementType: control
