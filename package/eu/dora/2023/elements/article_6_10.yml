id: 3b3c1ffd-cd04-4b52-b894-547e65b649fc
externalId: Article 6.10
name: Article 6.10
description: Financial entities may, in accordance with Union and national
  sectoral law, outsource the tasks of verifying compliance with ICT risk
  management requirements to intra-group or external undertakings. In case of
  such outsourcing, the financial entity remains fully responsible for the
  verification of compliance with the ICT risk management requirements.
elementType: control
