id: f4eea54b-6c7e-472a-b31d-07f88c05dcfe
externalId: Article 9 (end)
name: Article 9 (end)
description: "For the purposes of the first subparagraph, point (b), financial
  entities shall design the network connection infrastructure in a way that
  allows it to be instantaneously severed or segmented in order to minimise and
  prevent contagion, especially for interconnected financial processes.\r

  \r

  For the purposes of the first subparagraph, point (e), the ICT change
  management process shall be approved by appropriate lines of management and
  shall have specific protocols in place."
elementType: control
