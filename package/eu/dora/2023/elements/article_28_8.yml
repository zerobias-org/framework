id: 46d8ea59-81cc-4db9-a229-20110552c30e
externalId: Article 28.8
name: Article 28.8
description: "For ICT services supporting critical or important functions,
  financial entities shall put in place exit strategies. The exit strategies
  shall take into account risks that may emerge at the level of ICT third-party
  service providers, in particular a possible failure on their part, a
  deterioration of the quality of the ICT services provided, any business
  disruption due to inappropriate or failed provision of ICT services or any
  material risk arising in relation to the appropriate and continuous deployment
  of the respective ICT service, or the termination of contractual arrangements
  with ICT third-party service providers under any of the circumstances listed
  in paragraph 7.\r

  \r

  Financial entities shall ensure that they are able to exit contractual
  arrangements without:"
elementType: control
