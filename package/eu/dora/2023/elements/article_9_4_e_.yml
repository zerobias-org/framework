id: 8436dc04-7af8-47cd-89a0-41bd8abdbb65
externalId: Article 9.4(e)
name: Article 9.4(e)
description: implement documented policies, procedures and controls for ICT
  change management, including changes to software, hardware, firmware
  components, systems or security parameters, that are based on a risk
  assessment approach and are an integral part of the financial entity’s overall
  change management process, in order to ensure that all changes to ICT systems
  are recorded, tested, assessed, approved, implemented and verified in a
  controlled manner;
elementType: control
