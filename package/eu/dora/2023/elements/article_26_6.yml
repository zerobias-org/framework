id: 401ffc0b-2ee2-4c06-aed5-f89219a00ac4
externalId: Article 26.6
name: Article 26.6
description: At the end of the testing, after reports and remediation plans have
  been agreed, the financial entity and, where applicable, the external testers
  shall provide to the authority, designated in accordance with paragraph 9 or
  10, a summary of the relevant findings, the remediation plans and the
  documentation demonstrating that the TLPT has been conducted in accordance
  with the requirements.
elementType: control
