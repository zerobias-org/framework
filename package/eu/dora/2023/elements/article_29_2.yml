id: e546ddb2-9dc4-4b6e-af55-d70a8919fad5
externalId: Article 29.2
name: Article 29.2
description: "Where the contractual arrangements on the use of ICT services
  supporting critical or important functions include the possibility that an ICT
  third-party service provider further subcontracts ICT services supporting a
  critical or important function to other ICT third-party service providers,
  financial entities shall weigh benefits and risks that may arise in connection
  with such subcontracting, in particular in the case of an ICT subcontractor
  established in a third-country.\r

  \r

  Where contractual arrangements concern ICT services supporting critical or
  important functions, financial entities shall duly consider the insolvency law
  provisions that would apply in the event of the ICT third-party service
  provider’s bankruptcy as well as any constraint that may arise in respect to
  the urgent recovery of the financial entity’s data.\r

  \r

  Where contractual arrangements on the use of ICT services supporting critical
  or important functions are concluded with an ICT third-party service provider
  established in a third country, financial entities shall, in addition to the
  considerations referred to in the second subparagraph, also consider the
  compliance with Union data protection rules and the effective enforcement of
  the law in that third country.\r

  \r

  Where the contractual arrangements on the use of ICT services supporting
  critical or important functions provide for subcontracting, financial entities
  shall assess whether and how potentially long or complex chains of
  subcontracting may impact their ability to fully monitor the contracted
  functions and the ability of the competent authority to effectively supervise
  the financial entity in that respect."
elementType: control
