id: f320a0aa-e7a3-4bee-960a-5625f1cb1127
externalId: Article 6.2
name: Article 6.2
description: The ICT risk management framework shall include at least
  strategies, policies, procedures, ICT protocols and tools that are necessary
  to duly and adequately protect all information assets and ICT assets,
  including computer software, hardware, servers, as well as to protect all
  relevant physical components and infrastructures, such as premises, data
  centres and sensitive designated areas, to ensure that all information assets
  and ICT assets are adequately protected from risks including damage and
  unauthorised access or usage.
elementType: control
