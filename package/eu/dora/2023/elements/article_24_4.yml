id: de925b72-b598-4cc4-bd58-73d700f8ea3d
externalId: Article 24.4
name: Article 24.4
description: Financial entities, other than microenterprises, shall ensure that
  tests are undertaken by independent parties, whether internal or external.
  Where tests are undertaken by an internal tester, financial entities shall
  dedicate sufficient resources and ensure that conflicts of interest are
  avoided throughout the design and execution phases of the test.
elementType: control
