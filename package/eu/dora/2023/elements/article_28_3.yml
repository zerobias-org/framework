id: 8f52a398-08ce-4949-a931-d2ad2bd1ce0b
externalId: Article 28.3
name: Article 28.3
description: "As part of their ICT risk management framework, financial entities
  shall maintain and update at entity level, and at sub-consolidated and
  consolidated levels, a register of information in relation to all contractual
  arrangements on the use of ICT services provided by ICT third-party service
  providers.\r

  \r

  The contractual arrangements referred to in the first subparagraph shall be
  appropriately documented, distinguishing between those that cover ICT services
  supporting critical or important functions and those that do not.\r

  \r

  Financial entities shall report at least yearly to the competent authorities
  on the number of new arrangements on the use of ICT services, the categories
  of ICT third-party service providers, the type of contractual arrangements and
  the ICT services and functions which are being provided.\r

  \r

  Financial entities shall make available to the competent authority, upon its
  request, the full register of information or, as requested, specified sections
  thereof, along with any information deemed necessary to enable the effective
  supervision of the financial entity.\r

  Financial entities shall inform the competent authority in a timely manner
  about any planned contractual arrangement on the use of ICT services
  supporting critical or important functions as well as when a function has
  become critical or important."
elementType: control
