id: 672a5e2c-0579-44de-889d-95c4b7a95855
externalId: Article 18.2
name: Article 18.2
description: Financial entities shall classify cyber threats as significant
  based on the criticality of the services at risk, including the financial
  entity’s transactions and operations, number and/or relevance of clients or
  financial counterparts targeted and the geographical spread of the areas at
  risk.
elementType: control
