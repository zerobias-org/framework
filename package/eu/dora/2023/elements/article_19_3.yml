id: 21216b87-bb13-4263-a7e9-307b6c2f2d5c
externalId: Article 19.3
name: Article 19.3
description: "Where a major ICT-related incident occurs and has an impact on the
  financial interests of clients, financial entities shall, without undue delay
  as soon as they become aware of it, inform their clients about the major
  ICT-related incident and about the measures that have been taken to mitigate
  the adverse effects of such incident.\r

  \r

  In the case of a significant cyber threat, financial entities shall, where
  applicable, inform their clients that are potentially affected of any
  appropriate protection measures which the latter may consider taking."
elementType: control
