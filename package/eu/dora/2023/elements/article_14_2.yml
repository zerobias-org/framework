id: 57fa2c9e-86f0-4ccd-bd8e-a6b7a5bedd6f
externalId: Article 14.2
name: Article 14.2
description: As part of the ICT risk management framework, financial entities
  shall implement communication policies for internal staff and for external
  stakeholders. Communication policies for staff shall take into account the
  need to differentiate between staff involved in ICT risk management, in
  particular the staff responsible for response and recovery, and staff that
  needs to be informed.
elementType: control
