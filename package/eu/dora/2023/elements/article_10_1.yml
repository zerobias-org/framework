id: 7b1e53b0-c2d5-4b4e-9379-df5723ae8044
externalId: Article 10.1
name: Article 10.1
description: "Financial entities shall have in place mechanisms to promptly
  detect anomalous activities, in accordance with Article 17, including ICT
  network performance issues and ICT-related incidents, and to identify
  potential material single points of failure.\r

  \r

  All detection mechanisms referred to in the first subparagraph shall be
  regularly tested in accordance with Article 25."
elementType: control
