id: 753acd6b-4718-4b24-a9f6-9dea83a8e005
externalId: Article 6.3
name: Article 6.3
description: In accordance with their ICT risk management framework, financial
  entities shall minimise the impact of ICT risk by deploying appropriate
  strategies, policies, procedures, ICT protocols and tools. They shall provide
  complete and updated information on ICT risk and on their ICT risk management
  framework to the competent authorities upon their request.
elementType: control
