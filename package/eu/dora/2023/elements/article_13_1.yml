id: 76afd6cd-23a9-448b-9dec-49a2e0d56cb0
externalId: Article 13.1
name: Article 13.1
description: Financial entities shall have in place capabilities and staff to
  gather information on vulnerabilities and cyber threats, ICT-related
  incidents, in particular cyber-attacks, and analyse the impact they are likely
  to have on their digital operational resilience.
elementType: control
