id: d40fcc64-4fcd-4805-8faf-ea791d6fe76e
externalId: Article 25.1
name: Article 25.1
description: The digital operational resilience testing programme referred to in
  Article 24 shall provide, in accordance with the criteria set out in Article
  4(2), for the execution of appropriate tests, such as vulnerability
  assessments and scans, open source analyses, network security assessments, gap
  analyses, physical security reviews, questionnaires and scanning software
  solutions, source code reviews where feasible, scenario-based tests,
  compatibility testing, performance testing, end-to-end testing and penetration
  testing.
elementType: control
