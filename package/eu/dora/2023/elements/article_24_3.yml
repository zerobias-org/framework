id: aaa04424-ff8d-4b2e-a2d3-5dc393a0d112
externalId: Article 24.3
name: Article 24.3
description: When conducting the digital operational resilience testing
  programme referred to in paragraph 1 of this Article, financial entities,
  other than microenterprises, shall follow a risk-based approach taking into
  account the criteria set out in Article 4(2) duly considering the evolving
  landscape of ICT risk, any specific risks to which the financial entity
  concerned is or might be exposed, the criticality of information assets and of
  services provided, as well as any other factor the financial entity deems
  appropriate.
elementType: control
