id: 559bcb12-e336-4553-a212-d23a8c7243bc
externalId: Article 5.3
name: Article 5.3
description: Financial entities, other than microenterprises, shall establish a
  role in order to monitor the arrangements concluded with ICT third-party
  service providers on the use of ICT services, or shall designate a member of
  senior management as responsible for overseeing the related risk exposure and
  relevant documentation.
elementType: control
