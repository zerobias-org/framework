externalId: Article 25.2
name: Article 25.2
description: Central securities depositories and central counterparties shall
  perform vulnerability assessments before any deployment or redeployment of new
  or existing applications and infrastructure components, and ICT services
  supporting critical or important functions of the financial entity.
elementType: control
