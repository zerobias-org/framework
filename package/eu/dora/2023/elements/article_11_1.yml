id: e07e1dc1-c2f4-4c58-b8cf-4731d060c9e4
externalId: Article 11.1
name: Article 11.1
description: As part of the ICT risk management framework referred to in Article
  6(1) and based on the identification requirements set out in Article 8,
  financial entities shall put in place a comprehensive ICT business continuity
  policy, which may be adopted as a dedicated specific policy, forming an
  integral part of the overall business continuity policy of the financial
  entity.
elementType: control
