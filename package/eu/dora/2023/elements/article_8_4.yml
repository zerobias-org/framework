id: 6b4146f5-2f4d-419f-9777-b28d98d466b7
externalId: Article 8.4
name: Article 8.4
description: Financial entities shall identify all information assets and ICT
  assets, including those on remote sites, network resources and hardware
  equipment, and shall map those considered critical. They shall map the
  configuration of the information assets and ICT assets and the links and
  interdependencies between the different information assets and ICT assets.
elementType: control
