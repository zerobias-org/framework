id: bf73ecce-86cd-4fe8-9b91-0b8a912c9826
externalId: Article 6.5
name: Article 6.5
description: The ICT risk management framework shall be documented and reviewed
  at least once a year, or periodically in the case of microenterprises, as well
  as upon the occurrence of major ICT-related incidents, and following
  supervisory instructions or conclusions derived from relevant digital
  operational resilience testing or audit processes. It shall be continuously
  improved on the basis of lessons derived from implementation and monitoring. A
  report on the review of the ICT risk management framework shall be submitted
  to the competent authority upon its request.
elementType: control
