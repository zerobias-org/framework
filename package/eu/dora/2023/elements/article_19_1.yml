id: d806396a-b0f4-423b-8987-1b6c36b8de37
externalId: Article 19.1
name: Article 19.1
description: "Financial entities shall report major ICT-related incidents to the
  relevant competent authority as referred to in Article 46 in accordance with
  paragraph 4 of this Article.\r

  Where a financial entity is subject to supervision by more than one national
  competent authority referred to in Article 46, Member States shall designate a
  single competent authority as the relevant competent authority responsible for
  carrying out the functions and duties provided for in this Article.\r

  \r

  Credit institutions classified as significant, in accordance with Article 6(4)
  of Regulation (EU) No 1024/2013, shall report major ICT-related incidents to
  the relevant national competent authority designated in accordance with
  Article 4 of Directive 2013/36/EU, which shall immediately transmit that
  report to the ECB.\r

  \r

  For the purpose of the first subparagraph, financial entities shall produce,
  after collecting and analysing all relevant information, the initial
  notification and reports referred to in paragraph 4 of this Article using the
  templates referred to in Article 20 and submit them to the competent
  authority. In the event that a technical impossibility prevents the submission
  of the initial notification using the template, financial entities shall
  notify the competent authority about it via alternative means.\r

  \r

  The initial notification and reports referred to in paragraph 4 shall include
  all information necessary for the competent authority to determine the
  significance of the major ICT-related incident and assess possible
  cross-border impacts.\r

  \r

  Without prejudice to the reporting pursuant to the first subparagraph by the
  financial entity to the relevant competent authority, Member States may
  additionally determine that some or all financial entities shall also provide
  the initial notification and each report referred to in paragraph 4 of this
  Article using the templates referred to in Article 20 to the competent
  authorities or the computer security incident response teams (CSIRTs)
  designated or established in accordance with Directive (EU) 2022/2555."
elementType: control
