id: 667631ee-839b-449e-b682-6cd2663a149d
externalId: Article 12.2
name: Article 12.2
description: Financial entities shall set up backup systems that can be
  activated in accordance with the backup policies and procedures, as well as
  restoration and recovery procedures and methods. The activation of backup
  systems shall not jeopardise the security of the network and information
  systems or the availability, authenticity, integrity or confidentiality of
  data. Testing of the backup procedures and restoration and recovery procedures
  and methods shall be undertaken periodically.
elementType: control
