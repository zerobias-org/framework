externalId: Article 16.1(c)
name: Article 16.1(c)
description: minimise the impact of ICT risk through the use of sound, resilient
  and updated ICT systems, protocols and tools which are appropriate to support
  the performance of their activities and the provision of services and
  adequately protect availability, authenticity, integrity and confidentiality
  of data in the network and information systems;
elementType: control
