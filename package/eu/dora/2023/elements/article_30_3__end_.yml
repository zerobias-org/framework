id: b9031b48-ad4f-498c-80cc-c50bc8b5314f
externalId: Article 30.3 (end)
name: Article 30.3 (end)
description: By way of derogation from point (e), the ICT third-party service
  provider and the financial entity that is a microenterprise may agree that the
  financial entity’s rights of access, inspection and audit can be delegated to
  an independent third party, appointed by the ICT third-party service provider,
  and that the financial entity is able to request information and assurance on
  the ICT third-party service provider’s performance from the third party at any
  time.
elementType: control
