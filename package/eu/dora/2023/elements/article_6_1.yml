id: 347b6102-f1a3-437c-a67f-0b61ffc2535b
externalId: Article 6.1
name: Article 6.1
description: Financial entities shall have a sound, comprehensive and
  well-documented ICT risk management framework as part of their overall risk
  management system, which enables them to address ICT risk quickly, efficiently
  and comprehensively and to ensure a high level of digital operational
  resilience.
elementType: control
