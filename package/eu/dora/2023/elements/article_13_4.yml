id: 055e2752-f43f-4b60-a42a-945b01ba1b51
externalId: Article 13.4
name: Article 13.4
description: Financial entities shall monitor the effectiveness of the
  implementation of their digital operational resilience strategy set out in
  Article 6(8). They shall map the evolution of ICT risk over time, analyse the
  frequency, types, magnitude and evolution of ICT-related incidents, in
  particular cyber-attacks and their patterns, with a view to understanding the
  level of ICT risk exposure, in particular in relation to critical or important
  functions, and enhance the cyber maturity and preparedness of the financial
  entity.
elementType: control
