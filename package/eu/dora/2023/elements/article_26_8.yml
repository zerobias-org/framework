externalId: Article 26.8
name: Article 26.8
description: "Financial entities shall contract testers for the purposes of
  undertaking TLPT in accordance with Article 27. When financial entities use
  internal testers for the purposes of undertaking TLPT, they shall contract
  external testers every three tests.\r

  \r

  Credit institutions that are classified as significant in accordance with
  Article 6(4) of Regulation (EU) No 1024/2013, shall only use external testers
  in accordance with Article 27(1), points (a) to (e).\r

  \r

  Competent authorities shall identify financial entities that are required to
  perform TLPT taking into account the criteria set out in Article 4(2), based
  on an assessment of the following:"
elementType: control
