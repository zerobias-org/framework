externalId: Article 13.2
name: Article 13.2
description: "Financial entities shall put in place post ICT-related incident
  reviews after a major ICT-related incident disrupts their core activities,
  analysing the causes of disruption and identifying required improvements to
  the ICT operations or within the ICT business continuity policy referred to in
  Article 11.\r

  \r

  Financial entities, other than microenterprises, shall, upon request,
  communicate to the competent authorities, the changes that were implemented
  following post ICT-related incident reviews as referred to in the first
  subparagraph.\r

  \r

  The post ICT-related incident reviews referred to in the first subparagraph
  shall determine whether the established procedures were followed and the
  actions taken were effective, including in relation to the following:"
elementType: control
