externalId: Article 6.9
name: Article 6.9
description: Financial entities may, in the context of the digital operational
  resilience strategy referred to in paragraph 8, define a holistic ICT
  multi-vendor strategy, at group or entity level, showing key dependencies on
  ICT third-party service providers and explaining the rationale behind the
  procurement mix of ICT third-party service providers.
elementType: control
