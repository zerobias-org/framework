id: 56bdff2d-0ccb-49bf-af00-f8c3916aad61
externalId: Article 19.4(b)
name: Article 19.4(b)
description: an intermediate report after the initial notification referred to
  in point (a), as soon as the status of the original incident has changed
  significantly or the handling of the major ICT-related incident has changed
  based on new information available, followed, as appropriate, by updated
  notifications every time a relevant status update is available, as well as
  upon a specific request of the competent authority;
elementType: control
