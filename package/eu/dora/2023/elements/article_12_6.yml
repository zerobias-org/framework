id: 85f94af6-d6eb-45e9-998b-6d1a3e1fc97b
externalId: Article 12.6
name: Article 12.6
description: In determining the recovery time and recovery point objectives for
  each function, financial entities shall take into account whether it is a
  critical or important function and the potential overall impact on market
  efficiency. Such time objectives shall ensure that, in extreme scenarios, the
  agreed service levels are met.
elementType: control
