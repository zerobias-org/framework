id: d33ada72-0919-4164-b267-27726b562bbd
externalId: Article 28.5
name: Article 28.5
description: Financial entities may only enter into contractual arrangements
  with ICT third-party service providers that comply with appropriate
  information security standards. When those contractual arrangements concern
  critical or important functions, financial entities shall, prior to concluding
  the arrangements, take due consideration of the use, by ICT third- party
  service providers, of the most up-to-date and highest quality information
  security standards.
elementType: control
