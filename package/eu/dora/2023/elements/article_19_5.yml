id: e056bc82-63bb-4c86-ba0a-1b2dcf36b7c1
externalId: Article 19.5
name: Article 19.5
description: Financial entities may outsource, in accordance with Union and
  national sectoral law, the reporting obligations under this Article to a
  third-party service provider. In case of such outsourcing, the financial
  entity remains fully responsible for the fulfilment of the incident reporting
  requirements.
elementType: control
