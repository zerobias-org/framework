id: 49445222-057b-4ad6-bf33-8d6d93caa959
externalId: Article 16.2
name: Article 16.2
description: The ICT risk management framework referred to in paragraph 1,
  second subparagraph, point (a), shall be documented and reviewed periodically
  and upon the occurrence of major ICT-related incidents in compliance with
  supervisory instructions. It shall be continuously improved on the basis of
  lessons derived from implementation and monitoring. A report on the review of
  the ICT risk management framework shall be submitted to the competent
  authority upon its request.
elementType: control
