id: 339bbfa7-571b-44b3-807f-70a937eea847
externalId: Article 13.3
name: Article 13.3
description: Lessons derived from the digital operational resilience testing
  carried out in accordance with Articles 26 and 27 and from real life
  ICT-related incidents, in particular cyber-attacks, along with challenges
  faced upon the activation of ICT business continuity plans and ICT response
  and recovery plans, together with relevant information exchanged with
  counterparts and assessed during supervisory reviews, shall be duly
  incorporated on a continuous basis into the ICT risk assessment process. Those
  findings shall form the basis for appropriate reviews of relevant components
  of the ICT risk management framework referred to in Article 6(1).
elementType: control
