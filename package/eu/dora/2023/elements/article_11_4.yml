externalId: Article 11.4
name: Article 11.4
description: Financial entities shall put in place, maintain and periodically
  test appropriate ICT business continuity plans, notably with regard to
  critical or important functions outsourced or contracted through arrangements
  with ICT third-party service providers.
elementType: control
