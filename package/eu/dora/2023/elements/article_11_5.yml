id: f3b5ef8c-4d9c-469e-95e5-0a4d948eb3d0
externalId: Article 11.5
name: Article 11.5
description: As part of the overall business continuity policy, financial
  entities shall conduct a business impact analysis (BIA) of their exposures to
  severe business disruptions. Under the BIA, financial entities shall assess
  the potential impact of severe business disruptions by means of quantitative
  and qualitative criteria, using internal and external data and scenario
  analysis, as appropriate. The BIA shall consider the criticality of identified
  and mapped business functions, support processes, third-party dependencies and
  information assets, and their interdependencies. Financial entities shall
  ensure that ICT assets and ICT services are designed and used in full
  alignment with the BIA, in particular with regard to adequately ensuring the
  redundancy of all critical components.
elementType: control
