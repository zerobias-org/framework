externalId: Article 4.1
name: Article 4.1
description: Financial entities shall implement the rules laid down in Chapter
  II in accordance with the principle of proportionality, taking into account
  their size and overall risk profile, and the nature, scale and complexity of
  their services, activities and operations.
elementType: control
