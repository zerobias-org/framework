id: 8c760751-1a11-4ca1-b8a3-afae2649d251
externalId: Article 28.2
name: Article 28.2
description: As part of their ICT risk management framework, financial entities,
  other than entities referred to in Article 16(1), first subparagraph, and
  other than microenterprises, shall adopt, and regularly review, a strategy on
  ICT third-party risk, taking into account the multi-vendor strategy referred
  to in Article 6(9), where applicable. The strategy on ICT third-party risk
  shall include a policy on the use of ICT services supporting critical or
  important functions provided by ICT third-party service providers and shall
  apply on an individual basis and, where relevant, on a sub-consolidated and
  consolidated basis. The management body shall, on the basis of an assessment
  of the overall risk profile of the financial entity and the scale and
  complexity of the business services, regularly review the risks identified in
  respect to contractual arrangements on the use of ICT services supporting
  critical or important functions.
elementType: control
