id: 443b0026-ee26-462f-b653-423bec5d1812
externalId: Article 14.1
name: Article 14.1
description: As part of the ICT risk management framework referred to in Article
  6(1), financial entities shall have in place crisis communication plans
  enabling a responsible disclosure of, at least, major ICT-related incidents or
  vulnerabilities to clients and counterparts as well as to the public, as
  appropriate.
elementType: control
