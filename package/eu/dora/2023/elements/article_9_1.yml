id: 8b1ac5c9-2ecc-433a-b8e2-53cf177cd215
externalId: Article 9.1
name: Article 9.1
description: For the purposes of adequately protecting ICT systems and with a
  view to organising response measures, financial entities shall continuously
  monitor and control the security and functioning of ICT systems and tools and
  shall minimise the impact of ICT risk on ICT systems through the deployment of
  appropriate ICT security tools, policies and procedures.
elementType: control
