id: 3180f16b-8193-439d-85e2-657bdee5a292
externalId: Article 30.3(e)(i)
name: Article 30.3(e)(i)
description: unrestricted rights of access, inspection and audit by the
  financial entity, or an appointed third party, and by the competent authority,
  and the right to take copies of relevant documentation on-site if they are
  critical to the operations of the ICT third-party service provider, the
  effective exercise of which is not impeded or limited by other contractual
  arrangements or implementation policies;
elementType: control
