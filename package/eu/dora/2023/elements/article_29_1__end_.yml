externalId: Article 29.1 (end)
name: Article 29.1 (end)
description: Financial entities shall weigh the benefits and costs of
  alternative solutions, such as the use of different ICT third-party service
  providers, taking into account if and how envisaged solutions match the
  business needs and objectives set out in their digital resilience strategy.
