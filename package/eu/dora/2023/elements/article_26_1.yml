id: ced2a2f8-f8cd-443d-9c61-7164d62fe44e
externalId: Article 26.1
name: Article 26.1
description: Financial entities, other than entities referred to in Article
  16(1), first subparagraph, and other than microenterprises, which are
  identified in accordance with paragraph 8, third subparagraph, of this
  Article, shall carry out at least every 3 years advanced testing by means of
  TLPT. Based on the risk profile of the financial entity and taking into
  account operational circumstances, the competent authority may, where
  necessary, request the financial entity to reduce or increase this frequency.
elementType: control
