id: 79bd4003-0f21-41d2-9279-0c72a745695a
externalId: Article 6.4
name: Article 6.4
description: Financial entities, other than microenterprises, shall assign the
  responsibility for managing and overseeing ICT risk to a control function and
  ensure an appropriate level of independence of such control function in order
  to avoid conflicts of interest. Financial entities shall ensure appropriate
  segregation and independence of ICT risk management functions, control
  functions, and internal audit functions, according to the three lines of
  defence model, or an internal risk management and control model.
elementType: control
