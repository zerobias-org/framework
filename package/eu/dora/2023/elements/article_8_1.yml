id: 62fa80d9-f170-40d6-a69b-2ccdc322dbda
externalId: Article 8.1
name: Article 8.1
description: As part of the ICT risk management framework referred to in Article
  6(1), financial entities shall identify, classify and adequately document all
  ICT supported business functions, roles and responsibilities, the information
  assets and ICT assets supporting those functions, and their roles and
  dependencies in relation to ICT risk. Financial entities shall review as
  needed, and at least yearly, the adequacy of this classification and of any
  relevant documentation.
elementType: control
