id: 0ee92acb-6108-4b51-bf9e-5dcdb0e50836
externalId: Article 27.3
name: Article 27.3
description: Financial entities shall ensure that contracts concluded with
  external testers require a sound management of the TLPT results and that any
  data processing thereof, including any generation, store, aggregation, draft,
  report, communication or destruction, do not create risks to the financial
  entity.
elementType: control
