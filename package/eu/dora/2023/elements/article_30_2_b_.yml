externalId: Article 30.2(b)
name: Article 30.2(b)
description: the locations, namely the regions or countries, where the
  contracted or subcontracted functions and ICT services are to be provided and
  where data is to be processed, including the storage location, and the
  requirement for the ICT third- party service provider to notify the financial
  entity in advance if it envisages changing such locations;
elementType: control
