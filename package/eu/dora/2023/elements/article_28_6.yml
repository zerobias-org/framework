id: b3bded99-06a6-4717-9dc7-6b8c0cdd737d
externalId: Article 28.6
name: Article 28.6
description: "In exercising access, inspection and audit rights over the ICT
  third-party service provider, financial entities shall, on the basis of a
  risk-based approach, pre-determine the frequency of audits and inspections as
  well as the areas to be audited through adhering to commonly accepted audit
  standards in line with any supervisory instruction on the use and
  incorporation of such audit standards.\r

  \r

  Where contractual arrangements concluded with ICT third-party service
  providers on the use of ICT services entail high technical complexity, the
  financial entity shall verify that auditors, whether internal or external, or
  a pool of auditors, possess appropriate skills and knowledge to effectively
  perform the relevant audits and assessments."
elementType: control
