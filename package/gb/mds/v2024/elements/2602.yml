name: Cyber Security Training
description: "The Supplier shall ensure that people who support the operation of
  Functions and protection of Data are appropriately trained in cyber security.
  The Supplier shall conduct awareness training at least every 12 months to
  recognise and respond to the following topics:\r

  i) Social engineering and phishing\r

  ii) Advanced persistent threats\r

  iii) Suspected breaches\r

  iv) Suspicious behaviours.\r

  A range of approaches to cyber security training, awareness and communications
  shall be employed and the Supplier shall update the training every 12 months
  or when there are significant changes to the threat."
elementType: control
