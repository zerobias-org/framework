name: Environmental Controls
description: "The Supplier shall, where appropriate, implement, install, and
  maintain the following environmental controls supporting Functions and
  protection of Data:\r

  i) Fire suppression systems\r

  ii) Temperature and humidity controls within a data centre or server room
  environment\r

  iii) Backup power technology (e.g. uninterruptible power supply, diesel
  generator, separate grid connection, etc.)."
