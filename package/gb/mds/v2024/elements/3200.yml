name: Proactive Security Event Discovery
description: The Supplier shall detect, within networks and information systems,
  malicious activity affecting, or with the potential to affect, the operation
  of business Functions and protection of Data even when the activity evades
  standard signature-based security prevent/detect solutions (or when standard
  solutions are not deployable).
