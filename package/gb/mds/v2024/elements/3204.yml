externalId: "3204"
name: Presence of Unauthorised System Components
description: "The Supplier shall implement proportionate measures to:\r

  i) Detect the presence of unauthorised hardware, software, and firmware
  components within the system using tooling\r

  ii) Take the following actions when unauthorised components are detected:
  disable network access by such components; isolate the components; notify
  systems administrators and/or security operations teams."
elementType: control
