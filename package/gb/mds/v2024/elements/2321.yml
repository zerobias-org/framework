externalId: "2321"
name: Publicly Accessible Data
description: "The Supplier shall:\r

  i) Designate individuals authorised to make information publicly accessible\r

  ii) Train authorised individuals to ensure that publicly accessible
  information does not contain non-public information\r

  iii) Review the proposed content of information prior to posting onto the
  publicly accessible system to ensure that non-public information is not
  included\r

  iv) Periodically review the content on the publicly accessible system for
  non-public information and remove such information, if discovered."
elementType: control
