externalId: "2300"
name: Data Security
description: The Supplier shall appropriately protect data stored or transmitted
  electronically from actions such as unauthorised access, modification, or
  deletion that may cause an adverse impact on Functions or Data. Such
  protection extends to how authorised users, devices and systems access
  critical data necessary for the operation of Functions and use of Data.
  Additionally, covers information that would assist an attacker, such as design
  details of networks and information systems.
elementType: control
