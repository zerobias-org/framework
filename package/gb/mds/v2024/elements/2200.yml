externalId: "2200"
name: Identity and Access Control
description: The Supplier shall understand, document and manage (i.e create,
  review and disable) access to networks, information systems, and removable
  storage media & devices supporting Functions and protection of Data. All
  accounts and identities, including users, system and automated functions that
  can access Data or systems are appropriately verified, authenticated and
  authorised.
elementType: control
