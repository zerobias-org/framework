externalId: "2323"
name: Secure Destruction
description: "The Supplier shall, where not otherwise stated explicitly by
  country, legislation or Authority instructions, implement procedures to ensure
  that all Data is securely destroyed when no longer needed, or at the
  expiration or termination of the Agreement. Supplier shall:\r

  i) Secure and confirm the erasure of Data from its systems and servers,
  including any physical or\r

  electronic copies, prior to asset destruction and disposal\r

  ii) Provide attestation of destruction, where specified by contract with
  Authority\r

  iii) Require that any third parties engaged to process the Data shall securely
  dispose of such Data when no longer needed to provide the service, unless
  otherwise stated explicitly by country, legislation or Authority
  instructions."
elementType: control
