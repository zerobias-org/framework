name: Privacy Warning Notices - Specific Handling
description: "The Supplier shall ensure that users accept appropriate warning
  notices prior to information system access where information systems contain
  information with specific handling requirements imposed by the UK or its
  International Partners.\r

  Such warnings must only be provided to authenticated users. At a minimum users
  must be warned that:\r

  i) The information system contains information with specific requirements
  imposed by the UK and/or international partner nations.\r

  ii) Use of the information system may be subject to other specified
  requirements associated with certain types of information, such as that
  subject to Export Controls or licences."
elementType: control
