name: Authentication Feedback
description: The Supplier shall configure systems to minimise feedback
  information from failed logons to ensure that the system does not provide any
  information that would allow unauthorised individuals to compromise
  authentication mechanisms. e.g. explicitly stating that the password is the
  incorrect authentication component.
elementType: control
