name: Response and Recovery Planning
description: The Supplier shall implement well-defined and tested incident
  management processes that aim to ensure continuity of business Functions and
  protection of Data in the event of system or service failure. Mitigation
  activities are designed and where possible automated to contain or limit the
  impact of a compromise.
