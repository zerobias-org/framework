externalId: "2312"
name: Security At Alternate Working Locations
description: "The Supplier shall employ technical security controls and educate
  users to reduce the security risks to employees while working outside the
  organisation's premise. Technical security controls for consideration may
  include, but are not limited to:\r

  i) Always-on VPN to protect data in-transit\r

  ii) Screen privacy protector to prevent shoulder surfing\r

  iii) Disabling USB ports on devices\r

  iv) Full disk encryption\r

  User awareness topics may include, but are not limited to:\r

  i) Risks of using public Wi-Fi\r

  ii) Avoid taking confidential phone calls within earshot of unauthorised
  individuals\r

  iii) Shoulder surfing\r

  iv) Avoid leaving devices unattended"
elementType: control
