externalId: "2403"
name: Penetration Testing
description: "The Supplier shall conduct penetration testing (minimum every 12
  months) against externally facing systems used to support the operation of
  Functions and that protect Data. The penetration testing programme shall be
  based upon industry standards and performed by subject matter experts. The
  Supplier shall ensure that any deficiencies identified are remediated in a
  timely manner in line with their risk to the network. The Supplier shall
  retain records including:\r

  i) The scope and methodology utilised\r

  ii) The number of critical, high, and medium severity findings\r

  iii) The name of the tester\r

  iv) The date of the testing\r

  v) Timelines and actions for a remedial plan."
elementType: control
