name: Secure First-Time Password Management
description: "The Supplier shall employ secure practices for the secure storage,
  transmission, and management of first-time and one-time passwords. These
  practices include, but are not limited to:\r

  i) Secure storage of first-time password prior to use\r

  ii) Secure transmission of first-time and one-time passwords to their new
  user\r

  iii) Require first-time and one-time passwords are immediately changed after
  first logon."
elementType: control
