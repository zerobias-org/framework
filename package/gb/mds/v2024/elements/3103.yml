id: dec9dd30-cdc8-477c-973e-23cb36f3a3b1
externalId: "3103"
name: Securing Logs
description: The Supplier shall hold logging data securely and grant read access
  only to accounts with business needs. The Supplier shall protect audit tools
  from unauthorised access, modification and deletion. Logging data shall be
  retained and protected from deletion to a documented retention period, after
  which it shall be deleted.
elementType: control
