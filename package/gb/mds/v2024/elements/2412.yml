externalId: "2412"
name: Voice over Internet Protocol (VoIP)
description: The Supplier should establish usage restrictions and implementation
  guidance for Voice over Internet Protocol (VoIP) technologies based on the
  potential to cause damage to the information system if used maliciously; and
  ensure controls are in place to authorise, monitor, and control the use of
  VoIP within the information system.
elementType: control
