externalId: "4104"
name: Incident Handling Capability
description: "The Supplier shall establish an operational incident handling
  capability for organisational information systems that is consistently applied
  across the organisation and includes:\r

  i) Adequate preparation, detection, forensic analysis, containment, recovery,
  and user response activities\r

  ii) Tracking, documenting, and reporting incidents to appropriate
  organisational officials and/or authorities\r

  iii) Sufficient rigour, intensity and scope."
elementType: control
