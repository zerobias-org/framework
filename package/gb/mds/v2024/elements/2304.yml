externalId: "2304"
name: Wireless Network Access Controls
description: "The Supplier shall ensure that the following controls apply to
  trusted organisational wireless networks:\r

  i) All users and devices must be authorised and authenticated prior to
  granting access to the network via the wireless network\r

  ii) The data transferred over the wireless network must be encrypted using
  WPA2 or above methodology."
elementType: control
