externalId: "2201"
name: Access Control - Multi-Factor Authentication
description: "The Supplier shall implement multi-factor authentication (MFA)
  mechanisms to control access to critical or sensitive systems, and
  organisational operations. Factors can include:\r

  i) Something you know (e.g. password/personal identification number (PIN))\r

  ii) Something you have (e.g. cryptographic identification device, token)\r

  iii) Something you are (e.g. biometric)."
elementType: control
