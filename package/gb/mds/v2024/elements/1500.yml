externalId: "1500"
name: Physical Access Controls
description: "The Supplier shall, unless prohibited by applicable law, restrict
  and monitor all physical access to facilities where Data is stored or
  processed to its authorised Personnel by implementing industry standard
  physical access controls. Examples of such controls include but are not
  limited to:\r

  i) Swipe card technology\r

  ii) Monitored CCTV\r

  iii) Remotely monitored alarm systems\r

  iv) On-premise security guards\r

  v) Photographic access credentials\r

  vi) Visitor escort\r

  vii) Physical access logs\r

  viii) Authorised access lists.\r

  The Supplier shall review physical access logs regularly or in the event of a
  physical or cybersecurity incident."
elementType: control
