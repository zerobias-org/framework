externalId: "2310"
name: Removable Media
description: "The Supplier shall:\r

  i) Maintain and manage an inventory of corporately owned removable storage
  media and devices\r

  ii) Encrypt removable media using secured and industry best practice methods\r

  iii) Allow only corporately owned and/or authorised removable storage media
  and devices to have read/write permissions\r

  iv) Prohibit the use of removable storage media and devices that are not
  corporately owned or authorised."
elementType: control
