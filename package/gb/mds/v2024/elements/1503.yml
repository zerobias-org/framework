externalId: "1503"
name: Visitor Access Management
description: "The Supplier shall ensure the following controls are applied to
  all visitors visiting the organisation's premises:\r

  i) Visitor access and exit shall be logged\r

  ii) All visitors shall wear visitor ID badges at all times. Visitor badges
  should visually differ from employee badges\r

  iii) All visitors should be appropriately escorted at all times while on the
  premises\r

  iv) Visitor badges should be returned to the organisation at the end of the
  day."
elementType: control
