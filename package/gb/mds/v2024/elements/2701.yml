externalId: "2701"
name: Personnel Security Vetting*
description: The Supplier shall define and implement a policy for applying BPSS
  and National Security Vetting (NSV) checks as appropriate for employees that
  support Functions and the protection of Data. *(It is recognised that
  application of NSV is normally only possible once a contract requiring such is
  in place. Potential suppliers who do not meet this requirement at time of
  submission must, however, be willing and be able to enforce their staff
  through appropriate levels of vetting within a timescale agreed with the
  project delivery team following contract award).
elementType: control
