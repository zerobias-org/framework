id: c2b5c29d-cab2-4f26-b444-06dcdface040
externalId: "2405"
name: Patch Management
description: "The Supplier shall develop and maintain an appropriately robust
  patch management programme to address known vulnerabilities on its network
  within industry best-practice timelines. The Supplier shall take appropriate
  steps to identify, assess, test and implement patches for endpoints, network
  devices and software which address known vulnerabilities within industry best
  practice timeline.\r

  The Supplier shall have appropriate processes in place to address out-of-band
  emergency patching and/or mitigating actions."
elementType: control
