externalId: "2505"
name: Resilient Backups
description: "The Supplier shall hold accessible and secured current backups of
  data and information needed to recover operation of their Functions and
  protect Data. Backup procedures and media shall include:\r

  i) Appropriate encryption technology\r

  ii) Integrity validation\r

  iii) Secure offsite storage supporting availability requirements\r

  iv) Regular backup recovery testing."
elementType: control
