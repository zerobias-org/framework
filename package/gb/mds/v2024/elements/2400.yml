name: System Security
description: The Supplier shall ensure that network and information systems and
  technology critical for the operation of business Functions and protection of
  Data are protected from cyber attack. An organisational understanding of risk
  to business Functions and protection of Data informs the use of robust and
  reliable protective security measures to effectively limit opportunities for
  attackers to compromise networks and systems.
