id: 701fea74-5c04-4e5f-8078-6ee312676ad0
externalId: "4102"
name: Response and Recovery Capability
description: The Supplier shall have the capability to enact their incident
  response plan, including effective limitation of impact on the operation of
  Functions and protection of Data. During an incident, the Supplier shall enact
  processes and capabilities to provide access to information sources on which
  to base their response decisions to coordinate incident handling activities
  with contingency planning activities.
elementType: control
