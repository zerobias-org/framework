externalId: "2604"
name: Acceptable Use Policy
description: "The Supplier’s Acceptable Use Policy shall consider and include
  appropriate enforcement of restrictions on:\r

  i) Use of social media, social networking sites, and external
  sites/applications ii) Posting organisational information on public websites\r

  iii) Use of organisation-provided identifiers (e.g. email addresses) and
  authentication secrets (e.g. passwords) for creating accounts on external
  sites/applications\r

  iv) Enforce clear desk and clear screen requirements\r

  v) Handling of physical corporate assets outside the office environment\r

  vi) Locations for conducting duties\r

  vii) Remote activation of collaborative computing devices\r

  viii) Prohibit remote activation of collaborative computing devices and
  provide indication of devices in use to users present at the device."
elementType: control
