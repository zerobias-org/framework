name: Personnel Pre-Employment Checks
description: "The Supplier shall, unless prohibited by Applicable Law, perform
  appropriate background verification checks on Personnel that have access to
  Data upon hire. The verification checks shall include:\r

  i) Verifying credentials\r

  ii) Employment history\r

  iii) Qualification checks\r

  iv) Application or verification of BPSS (Baseline Personnel Security
  Standard)"
elementType: control
