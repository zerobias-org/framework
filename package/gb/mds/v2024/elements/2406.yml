externalId: "2406"
name: Privacy Warning Notices - Prior To Access
description: "The Supplier shall ensure that mechanisms are in place to ensure
  users accept appropriate warning notices prior to information system access.
  At a minimum users must be warned that:\r

  i) Use of the information system is monitored, recorded and subject to audit\r

  ii) Unauthorised usage of the information system is prohibited\r

  iii) Unauthorised usage of the information system use is subject to criminal
  and civil penalties\r

  iv) In continuing, the user affirms consent to monitoring and recording of
  their activities"
elementType: control
