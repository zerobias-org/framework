externalId: "3102"
name: Continuously Monitor Security Controls
description: "The Supplier shall establish and document security event
  monitoring which at a minimum covers the following:\r

  i) 24x7x365 monitoring of all identified Information Systems in Production and
  non-Production environments\r

  ii) Tools used for 24x7x365 monitoring and correlation\r

  iii) Security events covered\r

  iv) Frequency of monitoring\r

  v) Clearly defined roles and responsibilities\r

  vi) Escalation matrix."
elementType: control
