externalId: "2404"
name: Change Management
description: "The Supplier shall formally document, publish and review (minimum
  every 12 months) the change control procedures to manage changes to
  information systems, supporting infrastructure and facilities. The change
  management policy includes:\r

  i) Definitions of the types of change (e.g. standard, critical, emergency)
  with associated processes\r

  ii) Roles and responsibilities for those involved in the change or approving
  the change.\r

  Prior to implementing any changes, Supplier shall:\r

  i) Establish acceptance criteria for production change approval and
  implementation\r

  ii) Require stakeholder approval prior to any change implementation\r

  iii) Formally record the change in a centralised repository\r

  iv) Document business impact analysis outcomes and document back-out
  procedures should the change fail\r

  v) Keep a full audit trail of the change request, testing conducted,
  associated documentation, approvals and outcomes\r

  vi) Document and record security impact analysis outcomes along with any
  mitigating actions."
elementType: control
