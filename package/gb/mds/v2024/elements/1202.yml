name: Peridically Assess Risk
description: The Supplier shall periodically assess the risk to organisational
  operations (including mission, functions, image, or reputation),
  organisational assets, and individuals, resulting from the operation of
  organisational systems and the associated processing, storage, or transmission
  of Data.
