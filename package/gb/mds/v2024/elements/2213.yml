externalId: "2213"
name: Automated Password Quality Check
description: The Supplier shall deploy technical controls to manage the quality
  of credentials across all identifiers. The technical controls should reflect
  industry standard requirements such as password length, complexity
  requirements (e.g. uppercase, lowercase, numbers and symbols), reuse history,
  prevent reuse of identifiers for a defined period, banned words and insecure
  pattern recognition (e.g. 1234), as appropriate.
elementType: control
