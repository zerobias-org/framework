name: Monitor/Protect Communications at Boundaries
description: The Supplier shall monitor, control, and protect communications
  (information transmitted or received by organisational systems) at the
  external boundaries except as prohibited by Applicable Law and key internal
  boundaries of those organisational systems. This includes all staff including
  all remote workers to carry out their duties.
elementType: control
