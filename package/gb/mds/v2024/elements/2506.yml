name: Physical Transport of Backups
description: "The Supplier shall protect the physical movement of media
  containing Data in transit using the following methodologies:\r

  i) Store backup media within a secured and locked container prior to
  transport.\r

  ii) Utilise a certified backup courier to transport backup drives/tapes.\r

  iii) Maintain a full chain of custody record.\r

  iv) Ensure that tracking information is recorded for all drives being
  transported.\r

  v) Implement appropriate cryptographic mechanisms to protect confidentiality."
elementType: control
