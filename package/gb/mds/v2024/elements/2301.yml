externalId: "2301"
name: Understanding Data
description: The Supplier shall have a good understanding and classification of
  the data important to the operation of Functions and protection of Data,
  including where it is stored, where it travels, the application of protective
  markings to media. The Supplier shall understand how unauthorised access,
  modification or availability of data would adversely impact the organisation.
  This shall apply to data released to third parties including those important
  to the operation of Functions and protection of all Data.
elementType: control
