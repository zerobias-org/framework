name: Deny Traffic By Default at Interfaces
description: The Supplier shall ensure that firewalls must block every network
  connectivity path and network service not explicitly authorised by the
  appropriate Change Advisory Board (CAB). Traffic flow policy exceptions that
  are no longer supported by an explicit business need must be removed.
elementType: control
