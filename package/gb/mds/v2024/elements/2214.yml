id: 30396821-c2f1-4d65-9ddc-084ae4d8120c
externalId: "2214"
name: Repeated Unsuccessful Logon Handling
description: The Supplier shall employ policies and processes to appropriately
  manage unsuccessful login attempts to standard and privileged accounts. The
  Supplier shall lock accounts after at most ten unsuccessful login attempts for
  a minimum of 15 minutes; the duration of which should increase between
  multiple account lockouts.
elementType: control
