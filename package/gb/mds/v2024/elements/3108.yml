name: Audit Reduction and Report Generation
description: "The Supplier shall provide and implement an appropriate audit
  record reduction and report generation capability that:\r

  i) supports on-demand audit record review, analysis, and reporting
  requirements and after-the-fact investigations of incidents; and\r

  ii) does not alter the original content or time ordering of audit records."
elementType: control
