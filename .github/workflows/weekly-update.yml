name: Weekly Framework Updates

on:
  schedule:
    # Mondays at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allow manual triggering for testing
  push:
    branches:
      - test

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    if: github.repository == 'zerobias-org/framework' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zerobias-org'

      # NPM_TOKEN lets dataloaderExec fetch @zerobias-com/platform-dataloader
      # from GitHub Packages. Same role the publish workflow uses.
      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: publishing-role
          path: gh-actions
          secrets: |
            operations-kv/data/ci/github writePackagesToken | NPM_TOKEN;

      - name: Setup Java (for gradle gate)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZB_TOKEN: ${{ secrets.ZB_TOKEN }}

      - name: Discover packages with update scripts
        id: discover
        run: |
          echo "Scanning for packages with update scripts..."
          packages_with_updates=""
          
          # Look specifically for update directories that contain package.json with update scripts
          for package_json in $(find package -path "*/update/package.json" -type f); do
            package_dir=$(dirname "$package_json")
            
            # Check if package has update script and is private (update tools are marked private)
            if jq -e '.scripts.update' "$package_json" > /dev/null 2>&1 && jq -e '.private == true' "$package_json" > /dev/null 2>&1; then
              echo "Found update script in: $package_dir"
              if [ -z "$packages_with_updates" ]; then
                packages_with_updates="$package_dir"
              else
                packages_with_updates="$packages_with_updates,$package_dir"
              fi
            fi
          done
          
          echo "packages=$packages_with_updates" >> $GITHUB_OUTPUT
          echo "Found packages with update scripts: $packages_with_updates"

      - name: Update framework packages
        id: update
        if: steps.discover.outputs.packages != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZB_TOKEN: ${{ secrets.ZB_TOKEN }}
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ steps.discover.outputs.packages }}"
          updated_packages=""
          failed_packages=""
          
          for package_dir in "${PACKAGES[@]}"; do
            echo "=========================================="
            echo "Updating package: $package_dir"
            echo "=========================================="
            
            cd "$package_dir"
            
            # Install package dependencies if needed  
            if [ -f "package.json" ]; then
              echo "Installing dependencies for $package_dir..."
              if ! npm install; then
                echo "❌ Failed to install dependencies for $package_dir"
                failed_packages="$failed_packages $package_dir(deps)"
                cd - > /dev/null
                continue
              fi
            fi
            
            # Run the update command
            echo "Running update for $package_dir..."
            if npm run update; then
              echo "✅ Successfully updated $package_dir"
              updated_packages="$updated_packages $package_dir"
              # Validation now happens via the gradle gate step below
              # (./gradlew :<path>:gate), not the deleted lerna-era
              # `npm run validate` script.
            else
              echo "❌ Failed to update $package_dir"
              failed_packages="$failed_packages $package_dir(update)"
            fi
            
            cd - > /dev/null
          done
          
          echo "UPDATED_PACKAGES=$updated_packages" >> $GITHUB_ENV
          echo "FAILED_PACKAGES=$failed_packages" >> $GITHUB_ENV
          
          # Also set as outputs for use in other steps
          echo "updated_packages=$updated_packages" >> $GITHUB_OUTPUT
          echo "failed_packages=$failed_packages" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "Update Summary:"
          echo "Updated packages:$updated_packages"
          echo "Failed packages:$failed_packages"
          echo "=========================================="
          
          # Fail if there were package failures
          if [ -n "$failed_packages" ]; then
            echo "PACKAGE_FAILURES=true" >> $GITHUB_ENV
            echo "❌ Package update failures detected"
            exit 1
          fi

      - name: Gradle gate changed/new packages
        if: steps.update.outputs.updated_packages != ''
        env:
          # build-tools resolves from GitHub Packages maven; gate writes
          # gate-stamp.json (testIntegrationDataloader is skipped without
          # NEON_* — CI re-runs it on push). READ_TOKEN/NPM_TOKEN fall
          # back to GITHUB_TOKEN in settings.gradle.kts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npmInstallContent pulls suite deps from pkg.zerobias.org, which
          # stopped serving anonymous reads on 17 Aug.
          ZB_TOKEN: ${{ secrets.ZB_TOKEN }}
        run: |
          # The update tools regenerate framework content under package/.
          # Any package dir that changed (incl. brand-new versions) needs:
          #   1. a build.gradle.kts marker (so the zbb pipeline discovers it)
          #   2. a fresh gate-stamp.json (publish preflight rejects without it)
          # Find every package dir (depth-4: <authority>/<framework>/<version>)
          # touched by the update, drop the marker if missing, then gate.
          changed_pkgs=$(git status --porcelain package/ \
            | awk '{print $2}' \
            | grep -oE 'package/[^/]+/[^/]+/[^/]+' \
            | grep -vE '/update$' \
            | sort -u)

          gate_targets=""
          for pkg in $changed_pkgs; do
            [ -f "$pkg/index.yml" ] || continue          # only real framework packages
            if [ ! -f "$pkg/build.gradle.kts" ]; then
              printf 'plugins { id("zb.content") }\n' > "$pkg/build.gradle.kts"
              echo "Added gradle marker to new package: $pkg"
            fi
            # Stage before gating: writeGateStamp hashes tracked files only,
            # so an untracked package stamps as sha256("") and fails preflight.
            git add -A "$pkg"
            proj=$(echo "${pkg#package/}" | tr '/' ':')
            gate_targets="$gate_targets :$proj:gate"
          done

          if [ -n "$gate_targets" ]; then
            echo "Gating:$gate_targets"
            ./gradlew --parallel $gate_targets
          else
            echo "No framework packages changed — nothing to gate."
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT

            echo "Changed files:"
            git status --porcelain | head -50
          fi

      - name: Configure Git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuse the branch of an already-open weekly PR instead of cutting a
          # new one each run — otherwise every week leaves another stale PR.
          branch_name=$(gh pr list --state open --base main \
            --json headRefName --jq \
            '[.[] | select(.headRefName | startswith("weekly-framework-updates"))][0].headRefName')

          if [ -z "$branch_name" ] || [ "$branch_name" = "null" ]; then
            branch_name="weekly-framework-updates-$(date +%Y-%m-%d)"
            echo "No open weekly PR — creating $branch_name"
            echo "PR_EXISTS=false" >> $GITHUB_ENV
          else
            echo "Reusing open weekly PR branch $branch_name"
            echo "PR_EXISTS=true" >> $GITHUB_ENV
          fi

          # -B resets the branch to this run's regenerated content. The fetcher
          # always regenerates from upstream, so replacing prior commits is
          # correct: the newest run is the complete desired state.
          git checkout -B "$branch_name"
          git add .
          git commit -m "chore: 🤖 weekly framework updates $(date +%Y-%m-%d)

          Updated packages:${{ env.UPDATED_PACKAGES }}
          Failed packages:${{ env.FAILED_PACKAGES }}

          🤖 Generated with GitHub Actions"

          git push --force-with-lease origin "$branch_name"
          echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV

      - name: Create or update PR to main
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_body="Automated weekly update of framework packages.

          ## Summary
          **Updated packages:**
          ${{ env.UPDATED_PACKAGES }}

          **Failed packages:**
          ${{ env.FAILED_PACKAGES }}

          **Run ID:** ${{ github.run_id }}

          🤖 Generated with GitHub Actions"

          if [ "${{ env.PR_EXISTS }}" = "true" ]; then
            # Branch was force-pushed, so the PR already shows the new diff;
            # just refresh title and body.
            gh pr edit "${{ env.BRANCH_NAME }}" \
              --title "chore: 🤖 weekly framework updates $(date +%Y-%m-%d)" \
              --body "$pr_body"
            echo "Updated existing PR on ${{ env.BRANCH_NAME }}"
          else
            gh pr create \
              --title "chore: 🤖 weekly framework updates $(date +%Y-%m-%d)" \
              --body "$pr_body" \
              --base main \
              --head "${{ env.BRANCH_NAME }}"
          fi

      - name: Update summary
        if: always()
        run: |
          echo "## Weekly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Successfully updated packages
          if [ -n "${{ env.UPDATED_PACKAGES }}" ]; then
            echo "✅ **Updated:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.UPDATED_PACKAGES }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Failed packages
          if [ -n "${{ env.FAILED_PACKAGES }}" ]; then
            echo "❌ **Failed:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.FAILED_PACKAGES }}" | tr ' ' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Commit status
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "📝 Changes committed and PR created to \`main\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes - all packages up to date" >> $GITHUB_STEP_SUMMARY
          fi

